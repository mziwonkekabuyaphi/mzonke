<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rands · Superadmin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red: #E30613;
      --red-glow: rgba(227, 6, 19, 0.35);
      --red-dim: rgba(227, 6, 19, 0.12);
      --red-border: rgba(227, 6, 19, 0.25);
      --bg: #09090b;
      --surface: #111114;
      --surface-2: #18181c;
      --surface-3: #1e1e24;
      --border: rgba(255,255,255,0.07);
      --border-bright: rgba(255,255,255,0.13);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --text-dim: #3f3f46;
      --green: #22c55e;
      --gold: #f59e0b;
      --blue: #3b82f6;
      --purple: #a78bfa;
      --sb-w: 56px;
      --sb-expanded: 248px;
      --header-h: 56px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --speed: 200ms;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }

    /* ──────────── LOADING / ACCESS DENIED ──────────── */
    .loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    }
    .load-logo-wrap { position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
    .load-logo-bg {
      width: 64px; height: 64px; background: var(--purple); border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(167,139,250,0.35), 0 0 80px rgba(167,139,250,0.15);
      animation: logoPulse 2s ease-in-out infinite;
    }
    .load-logo-bg i { color: white; font-size: 1.6rem; }
    .load-ring { position: absolute; inset: -6px; border-radius: 24px; border: 1.5px solid rgba(167,139,250,0.25); animation: ringRotate 3s linear infinite; }
    .load-ring::before { content: ''; position: absolute; top: -2px; left: 50%; width: 6px; height: 6px; background: var(--purple); border-radius: 50%; transform: translateX(-50%); box-shadow: 0 0 8px var(--purple); }
    @keyframes logoPulse { 0%,100%{ box-shadow: 0 0 40px rgba(167,139,250,0.35), 0 0 80px rgba(167,139,250,0.15); } 50%{ box-shadow: 0 0 60px rgba(167,139,250,0.5), 0 0 100px rgba(167,139,250,0.2); } }
    @keyframes ringRotate { to { transform: rotate(360deg); } }
    .load-brand { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; margin-bottom: 6px; }
    .load-sub { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 40px; }
    .load-bar-wrap { width: 200px; height: 2px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
    .load-bar { height: 100%; background: var(--purple); border-radius: 99px; animation: loadProgress 1.8s var(--ease) forwards; box-shadow: 0 0 12px var(--purple); }
    @keyframes loadProgress { from { width: 0%; } to { width: 100%; } }
    .load-msg { font-size: 0.72rem; color: var(--text-dim); margin-top: 14px; letter-spacing: 0.03em; }

    .access-denied { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 360px; }
    .access-denied i { font-size: 2.2rem; color: var(--red); }
    .access-denied h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; }
    .access-denied p { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }

    /* ──────────── SIDEBAR ──────────── */
    .sidebar {
      position: fixed; left: 0; top: 0; height: 100%; width: var(--sb-w);
      background: var(--surface); border-right: 1px solid var(--border); z-index: 200;
      display: flex; flex-direction: column; overflow: hidden;
      transition: width var(--speed) var(--ease), box-shadow var(--speed) var(--ease);
    }
    @media (min-width: 769px) {
      .sidebar:hover, .sidebar.peek { width: var(--sb-expanded); box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 8px 0 40px rgba(0,0,0,0.5); }
    }
    .sidebar::before {
      content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2px;
      background: linear-gradient(180deg, transparent, var(--purple) 50%, transparent);
      opacity: 0; transition: opacity var(--speed) var(--ease);
    }
    .sidebar:hover::before, .sidebar.peek::before { opacity: 1; }

    .sb-header { display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-bottom: 1px solid var(--border); min-height: var(--header-h); overflow: hidden; flex-shrink: 0; }
    .sb-logo { width: 36px; height: 36px; min-width: 36px; background: var(--purple); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(167,139,250,0.35); flex-shrink: 0; }
    .sb-logo i { color: white; font-size: 1rem; }
    .sb-brand { opacity: 0; transform: translateX(-6px); transition: opacity var(--speed) var(--ease), transform var(--speed) var(--ease); white-space: nowrap; overflow: hidden; pointer-events: none; }
    .sidebar:hover .sb-brand, .sidebar.peek .sb-brand { opacity: 1; transform: translateX(0); }
    .sb-brand-name { font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: -0.01em; }
    .sb-brand-sub { font-size: 0.62rem; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }

    .sb-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 0; scrollbar-width: none; }
    .sb-nav::-webkit-scrollbar { display: none; }

    .sb-section-label { display: flex; align-items: center; padding: 12px 0 4px 0; margin-left: 6px; gap: 8px; }
    .sb-section-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border-bright); flex-shrink: 0; transition: opacity var(--speed); }
    .sb-section-text { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: var(--text-dim); white-space: nowrap; opacity: 0; transition: opacity var(--speed) var(--ease); }
    .sidebar:hover .sb-section-dot, .sidebar.peek .sb-section-dot { opacity: 0; }
    .sidebar:hover .sb-section-text, .sidebar.peek .sb-section-text { opacity: 1; }

    .sb-item { display: flex; align-items: center; margin: 1px 6px; border-radius: 10px; cursor: pointer; overflow: hidden; min-height: 38px; white-space: nowrap; transition: background 0.15s, color 0.15s; position: relative; }
    .sb-item-icon { width: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; color: var(--text-muted); flex-shrink: 0; transition: color 0.15s; }
    .sb-item-label { font-size: 0.81rem; font-weight: 500; color: var(--text-muted); opacity: 0; transform: translateX(-4px); transition: opacity var(--speed) var(--ease), transform var(--speed) var(--ease); pointer-events: none; padding-right: 14px; }
    .sidebar:hover .sb-item-label, .sidebar.peek .sb-item-label { opacity: 1; transform: translateX(0); }
    .sb-item:hover { background: rgba(255,255,255,0.05); }
    .sb-item:hover .sb-item-icon, .sb-item:hover .sb-item-label { color: var(--text); }
    .sb-item.active { background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.25); }
    .sb-item.active::before { content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2px; background: var(--purple); border-radius: 99px; box-shadow: 0 0 8px var(--purple); }
    .sb-item.active .sb-item-icon, .sb-item.active .sb-item-label { color: var(--purple); }
    .sb-divider { height: 1px; background: var(--border); margin: 4px 12px; }
    .sb-footer { border-top: 1px solid var(--border); padding: 8px 6px; flex-shrink: 0; }
    .sb-logout { color: #ef4444 !important; }
    .sb-logout .sb-item-icon { color: #ef4444 !important; }
    .sb-logout:hover { background: rgba(239, 68, 68, 0.1) !important; }

    /* ──────────── MAIN ──────────── */
    .main { margin-left: var(--sb-w); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: var(--header-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; position: relative; z-index: 99; }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .topbar-crumb { display: flex; align-items: center; gap: 6px; background: var(--surface-3); border: 1px solid var(--border); border-radius: 99px; padding: 4px 12px 4px 8px; font-size: 0.7rem; color: var(--text-muted); }
    .topbar-crumb .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); box-shadow: 0 0 6px var(--purple); flex-shrink: 0; }
    .crumb-live { color: var(--purple); font-weight: 600; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }

    .btn-glass { background: var(--surface-3); border: 1px solid var(--border); color: var(--text-muted); padding: 7px 14px; border-radius: 8px; font-size: 0.73rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; font-family: 'Inter', sans-serif; }
    .btn-glass:hover { background: var(--surface-2); border-color: var(--border-bright); color: var(--text); }
    .btn-red { background: var(--red); border: none; color: white; padding: 7px 14px; border-radius: 8px; font-size: 0.73rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; font-family: 'Inter', sans-serif; box-shadow: 0 0 16px var(--red-glow); }
    .btn-red:hover { background: #c8050f; box-shadow: 0 0 24px var(--red-glow); }
    .btn-purple { background: var(--purple); border: none; color: #1e1033; padding: 7px 14px; border-radius: 8px; font-size: 0.73rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; font-family: 'Inter', sans-serif; }
    .btn-purple:hover { filter: brightness(1.08); }
    .btn-ghost-danger { background: transparent; border: 1px solid rgba(239,68,68,0.3); color: #ef4444; padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
    .btn-ghost-danger:hover { background: rgba(239,68,68,0.1); }

    .menu-toggle { display: none; font-size: 1.1rem; cursor: pointer; color: var(--text-muted); align-items: center; width: 34px; height: 34px; justify-content: center; border-radius: 8px; transition: background 0.15s; }
    .menu-toggle:hover { background: var(--surface-3); color: var(--text); }

    .content { flex: 1; overflow-y: auto; padding: 24px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    /* ──────────── SHARED CARD / FORM / TABLE ──────────── */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .kpi-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 8px; }
    .kpi-value { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--text); }
    .kpi-value i { font-size: 1rem; color: var(--purple); margin-right: 6px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 16px; transition: border-color 0.2s; }
    .card:hover { border-color: var(--border-bright); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .card-head-title { display: flex; align-items: center; gap: 10px; }
    .card-icon { width: 34px; height: 34px; border-radius: 10px; background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.25); display: flex; align-items: center; justify-content: center; color: var(--purple); font-size: 0.82rem; flex-shrink: 0; }
    .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .card-sub { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; }

    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { margin-bottom: 14px; flex: 1; min-width: 140px; }
    .form-label { display: block; font-size: 0.68rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-input { width: 100%; padding: 9px 14px; background: var(--surface-3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.82rem; transition: border-color 0.15s, box-shadow 0.15s; }
    .form-input:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(167,139,250,0.15); }
    .form-input option { background: var(--surface-3); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    thead th { text-align: left; padding: 10px 14px; background: var(--surface-3); font-weight: 700; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 0.75rem; color: var(--text); }
    tbody tr:hover td { background: var(--surface-3); }
    tbody tr:last-child td { border-bottom: none; }
    .empty-row td { text-align: center; color: var(--text-dim); padding: 24px; }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 40px; font-size: 0.6rem; font-weight: 700; text-transform: capitalize; }
    .badge-superadmin { background: rgba(167,139,250,0.15); color: var(--purple); }
    .badge-admin { background: var(--red-dim); color: var(--red); }
    .badge-staff { background: rgba(59,130,246,0.15); color: var(--blue); }
    .badge-customer { background: var(--surface-3); color: var(--text-muted); }
    .badge-mobile_scanner { background: rgba(245,158,11,0.15); color: var(--gold); }
    .badge-active { background: rgba(34,197,94,0.15); color: var(--green); }
    .badge-inactive { background: var(--surface-3); color: var(--text-muted); }

    .toggle-switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--border); cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .toggle-switch.on { background: var(--purple); border-color: var(--purple); }
    .toggle-switch.disabled { opacity: 0.5; cursor: wait; }
    .toggle-knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: transform 0.15s var(--ease); }
    .toggle-switch.on .toggle-knob { transform: translateX(16px); }

    .icon-btn-sm { background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.72rem; cursor: pointer; border-radius: 6px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .icon-btn-sm:hover { background: var(--surface-3); border-color: var(--border-bright); color: var(--text); }
    .icon-btn-sm.danger:hover { color: #ef4444; border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.08); }

    .empty-state { text-align: center; padding: 32px 16px; color: var(--text-dim); font-size: 0.78rem; }
    .empty-state i { font-size: 1.6rem; margin-bottom: 10px; display: block; color: var(--text-dim); }

    .tenant-modules-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .tenant-module-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--border); }
    .tenant-module-row:first-child { border-top: none; padding-top: 0; }
    .tenant-module-name { font-size: 0.78rem; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .tenant-module-name i { color: var(--text-muted); width: 14px; text-align: center; }

    .success-toast { position: fixed; bottom: 24px; right: 24px; z-index: 9998; background: var(--surface-2); border: 1px solid #22c55e44; color: #4ade80; padding: 12px 18px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; gap: 8px; transform: translateY(20px); opacity: 0; pointer-events: none; transition: all 0.3s var(--ease); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .success-toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }

    .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 199; }

    @media (max-width: 768px) {
      .sidebar { width: var(--sb-expanded); transform: translateX(calc(-1 * var(--sb-expanded))); transition: transform var(--speed) var(--ease), box-shadow var(--speed) var(--ease); }
      .sidebar.open { transform: translateX(0); box-shadow: 0 0 60px rgba(0,0,0,0.6); }
      .sidebar.open .sb-brand, .sidebar.open .sb-item-label, .sidebar.open .sb-section-text { opacity: 1; transform: translateX(0); pointer-events: auto; }
      .sidebar.open .sb-section-dot { opacity: 0; }
      .main { margin-left: 0; }
      .menu-toggle { display: flex !important; }
      .sidebar-backdrop { display: block; }
      .topbar { padding: 0 14px; }
      .content { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
    }
    @media (min-width: 769px) { .menu-toggle { display: none !important; } }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 99px; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Loading Screen ── -->
  <div class="loading-screen" v-if="showLoadingScreen">
    <div class="load-logo-wrap">
      <div class="load-logo-bg"><i class="fas fa-shield-halved"></i></div>
      <div class="load-ring"></div>
    </div>
    <div class="load-brand">Rands Platform</div>
    <div class="load-sub">Superadmin Console</div>
    <div class="load-bar-wrap"><div class="load-bar"></div></div>
    <div class="load-msg">{{ loadingMessage }}</div>
  </div>

  <template v-if="!showLoadingScreen">
    <!-- ── Backdrop ── -->
    <div class="sidebar-backdrop" v-if="sidebarOpen" @click="sidebarOpen = false"></div>

    <!-- ── Sidebar ── -->
    <aside class="sidebar" :class="{ open: sidebarOpen }">
      <div class="sb-header">
        <div class="sb-logo"><i class="fas fa-shield-halved"></i></div>
        <div class="sb-brand">
          <div class="sb-brand-name">Rands · Superadmin</div>
          <div class="sb-brand-sub">Platform Console</div>
        </div>
      </div>

      <div class="sb-nav">
        <div class="sb-section-label"><span class="sb-section-dot"></span><span class="sb-section-text">Platform</span></div>
        <div class="sb-item" :class="{ active: currentSection === 'overview' }" @click="nav('overview')">
          <span class="sb-item-icon"><i class="fas fa-chart-pie"></i></span><span class="sb-item-label">Overview</span>
        </div>
        <div class="sb-item" :class="{ active: currentSection === 'tenants' }" @click="nav('tenants')">
          <span class="sb-item-icon"><i class="fas fa-building-user"></i></span><span class="sb-item-label">Tenants</span>
        </div>
        <div class="sb-item" :class="{ active: currentSection === 'billing' }" @click="nav('billing')">
          <span class="sb-item-icon"><i class="fas fa-file-invoice-dollar"></i></span><span class="sb-item-label">Billing &amp; Revenue</span>
        </div>

        <div class="sb-divider"></div>

        <div class="sb-section-label"><span class="sb-section-dot"></span><span class="sb-section-text">Operations</span></div>
        <div class="sb-item" :class="{ active: currentSection === 'people' }" @click="nav('people')">
          <span class="sb-item-icon"><i class="fas fa-users-gear"></i></span><span class="sb-item-label">People</span>
        </div>
        <div class="sb-item" :class="{ active: currentSection === 'modules' }" @click="nav('modules')">
          <span class="sb-item-icon"><i class="fas fa-cubes"></i></span><span class="sb-item-label">Module Catalog</span>
        </div>

        <div class="sb-divider"></div>

        <div class="sb-section-label"><span class="sb-section-dot"></span><span class="sb-section-text">System</span></div>
        <div class="sb-item" :class="{ active: currentSection === 'config' }" @click="nav('config')">
          <span class="sb-item-icon"><i class="fas fa-sliders-h"></i></span><span class="sb-item-label">Platform Config</span>
        </div>
      </div>

      <div class="sb-footer">
        <div class="sb-item sb-logout" @click="logout">
          <span class="sb-item-icon"><i class="fas fa-sign-out-alt"></i></span><span class="sb-item-label">Logout</span>
        </div>
      </div>
    </aside>

    <!-- ── Main ── -->
    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <div class="menu-toggle" @click="sidebarOpen = !sidebarOpen"><i class="fas fa-bars"></i></div>

          <button class="btn-red" @click="logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
      </div>

      <div class="content">

        <!-- ══════════ OVERVIEW ══════════ -->
        <div v-if="currentSection === 'overview'">
          <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-label">Tenants</div><div class="kpi-value"><i class="fas fa-building-user"></i>{{ tenants.length }}</div></div>
            <div class="kpi-card"><div class="kpi-label">Active Modules</div><div class="kpi-value"><i class="fas fa-cubes"></i>{{ allModules.filter(m => m.is_active).length }} / {{ allModules.length }}</div></div>
            <div class="kpi-card"><div class="kpi-label">Admins / Staff</div><div class="kpi-value"><i class="fas fa-users-gear"></i>{{ roleCounts.admin || 0 }} / {{ roleCounts.staff || 0 }}</div></div>
            <div class="kpi-card"><div class="kpi-label">Superadmins</div><div class="kpi-value"><i class="fas fa-shield-halved"></i>{{ roleCounts.superadmin || 0 }}</div></div>
          </div>

          <div class="card">
            <div class="card-head">
              <div class="card-head-title"><div class="card-icon"><i class="fas fa-building-user"></i></div><div><div class="card-title">Tenants at a glance</div><div class="card-sub">Full management under Tenants</div></div></div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Name</th><th>Status</th><th>Modules Enabled</th><th>Created</th></tr></thead>
                <tbody>
                  <tr v-if="!tenants.length" class="empty-row"><td colspan="4">No tenants yet.</td></tr>
                  <tr v-for="t in tenants" :key="t.id">
                    <td>{{ t.name }}</td>
                    <td><span class="badge" :class="'badge-' + t.status">{{ t.status }}</span></td>
                    <td>{{ enabledModuleCount(t.id) }} / {{ allModules.length }}</td>
                    <td>{{ formatDate(t.created_at) }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <div class="card-head-title"><div class="card-icon"><i class="fas fa-circle-info"></i></div><div><div class="card-title">About this console</div></div></div>
            </div>
            <p style="font-size:0.8rem; color:var(--text-muted); line-height:1.6;">
              This is the platform-level control layer, one step above each venue's Admin Dashboard. Today there's a single tenant (Rands Cape Town), so most of this doubles as global settings — but Tenants, Module Catalog and Billing are already built to onboard a second venue without any rework.
            </p>
          </div>
        </div>

        <!-- ══════════ TENANTS ══════════ -->
        <div v-if="currentSection === 'tenants'">
          <div class="card">
            <div class="card-head">
              <div class="card-head-title"><div class="card-icon"><i class="fas fa-plus"></i></div><div><div class="card-title">Add Tenant</div></div></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Venue Name</label><input class="form-input" v-model="newTenantName" placeholder="e.g. Rands Johannesburg" @keyup.enter="addTenant"></div>
              <button class="btn-purple" @click="addTenant" :disabled="!newTenantName.trim()"><i class="fas fa-plus"></i> Add Tenant</button>
            </div>
          </div>

          <div class="grid">
            <div class="card" v-for="t in tenants" :key="t.id">
              <div class="card-head">
                <div class="card-head-title"><div class="card-icon"><i class="fas fa-building-user"></i></div><div><div class="card-title">{{ t.name }}</div><div class="card-sub">Tenant #{{ t.id }} · since {{ formatDate(t.created_at) }}</div></div></div>
                <select class="form-input" style="width:auto; min-width:110px;" :value="t.status" @change="updateTenantStatus(t, $event.target.value)">
                  <option value="active">Active</option>
                  <option value="suspended">Suspended</option>
                  <option value="cancelled">Cancelled</option>
                </select>
              </div>
              <div class="card-sub" style="margin-bottom:6px;">Module access</div>
              <div class="tenant-modules-list">
                <div class="tenant-module-row" v-for="m in allModules" :key="m.id">
                  <div class="tenant-module-name"><i :class="getIconClass(m.icon)"></i>{{ m.name }}</div>
                  <div class="toggle-switch" :class="{ on: isTenantModuleEnabled(t.id, m.name), disabled: togglingKey === (t.id + '_' + m.name) }"
                       @click="toggleTenantModule(t, m)">
                    <div class="toggle-knob"></div>
                  </div>
                </div>
              </div>
            </div>
            <div v-if="!tenants.length" class="empty-state"><i class="fas fa-building-user"></i>No tenants yet — add one above.</div>
          </div>
        </div>

        <!-- ══════════ BILLING ══════════ -->
        <div v-if="currentSection === 'billing'">
          <div class="card">
            <div class="card-head">
              <div class="card-head-title"><div class="card-icon"><i class="fas fa-file-invoice-dollar"></i></div><div><div class="card-title">Invoices</div><div class="card-sub">Platform fees billed to each tenant</div></div></div>
              <button class="btn-purple" @click="showInvoiceForm = !showInvoiceForm"><i class="fas fa-plus"></i> New Invoice</button>
            </div>
            <div v-if="showInvoiceForm" class="form-row" style="margin-bottom:8px;">
              <div class="form-group"><label class="form-label">Tenant</label>
                <select class="form-input" v-model="invoiceForm.tenant_id"><option v-for="t in tenants" :key="t.id" :value="t.id">{{ t.name }}</option></select>
              </div>
              <div class="form-group"><label class="form-label">Period</label><input class="form-input" v-model="invoiceForm.period" placeholder="2026-09"></div>
              <div class="form-group"><label class="form-label">Platform Fees (R)</label><input type="number" class="form-input" v-model="invoiceForm.platform_fees"></div>
              <div class="form-group"><label class="form-label">Due Date</label><input type="date" class="form-input" v-model="invoiceForm.due_date"></div>
              <button class="btn-purple" @click="addInvoice"><i class="fas fa-check"></i> Create</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Tenant</th><th>Period</th><th>Platform Fees</th><th>Status</th><th>Due</th></tr></thead>
                <tbody>
                  <tr v-if="!invoices.length" class="empty-row"><td colspan="5">No invoices yet.</td></tr>
                  <tr v-for="inv in invoices" :key="inv.id">
                    <td>{{ tenantName(inv.tenant_id) }}</td><td>{{ inv.period }}</td>
                    <td>R{{ inv.platform_fees }}</td><td><span class="badge" :class="'badge-' + (inv.status || 'inactive')">{{ inv.status || 'pending' }}</span></td>
                    <td>{{ inv.due_date }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <div class="card-head-title"><div class="card-icon"><i class="fas fa-chart-line"></i></div><div><div class="card-title">Revenue Transactions</div><div class="card-sub">Platform-fee ledger, per tenant</div></div></div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Tenant</th><th>Type</th><th>Amount</th><th>Platform Fee</th><th>Tenant Revenue</th><th>Date</th></tr></thead>
                <tbody>
                  <tr v-if="!revenueTx.length" class="empty-row"><td colspan="6">No revenue transactions recorded yet — this ledger fills in once a tenant's activity is wired to platform-fee tracking.</td></tr>
                  <tr v-for="r in revenueTx" :key="r.id">
                    <td>{{ tenantName(r.tenant_id) }}</td><td>{{ r.transaction_type }}</td><td>R{{ r.amount }}</td><td>R{{ r.platform_fee }}</td><td>R{{ r.tenant_revenue }}</td><td>{{ formatDate(r.created_at) }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- ══════════ PEOPLE ══════════ -->
        <div v-if="currentSection === 'people'">
          <div class="card">
            <div class="card-head">
              <div class="card-head-title"><div class="card-icon"><i class="fas fa-users-gear"></i></div><div><div class="card-title">All Accounts</div><div class="card-sub">{{ profiles.length }} profiles across every role</div></div></div>
              <input class="form-input" style="width:auto; min-width:180px;" v-model="profileFilter" placeholder="Search name, email, phone…">
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Name</th><th>Contact</th><th>Role</th><th>Staff Role</th><th>Status</th></tr></thead>
                <tbody>
                  <tr v-if="!filteredProfiles.length" class="empty-row"><td colspan="5">No matching profiles.</td></tr>
                  <tr v-for="p in filteredProfiles" :key="p.id">
                    <td>{{ p.name }} {{ p.surname }}</td>
                    <td>{{ p.email || p.phone || '—' }}</td>
                    <td>
                      <select class="form-input" style="width:auto; padding:5px 10px; font-size:0.72rem;" :value="p.role" :disabled="savingProfileId === p.id" @change="updateProfileRole(p, $event.target.value)">
                        <option value="superadmin">superadmin</option>
                        <option value="admin">admin</option>
                        <option value="staff">staff</option>
                        <option value="mobile_scanner">mobile_scanner</option>
                        <option value="customer">customer</option>
                      </select>
                    </td>
                    <td>{{ p.staff_role || '—' }}</td>
                    <td><span class="badge" :class="p.status === 'Active' ? 'badge-active' : 'badge-inactive'">{{ p.status || 'Active' }}</span></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- ══════════ MODULE CATALOG ══════════ -->
        <div v-if="currentSection === 'modules'">
          <div class="card">
            <div class="card-head">
              <div class="card-head-title"><div class="card-icon"><i class="fas fa-cubes"></i></div><div><div class="card-title">{{ editingModuleId ? 'Edit Module' : 'Add Module' }}</div><div class="card-sub">Global catalog — venue Admin can only show/hide these, not create them</div></div></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">ID (slug)</label><input class="form-input" v-model="moduleForm.id" :disabled="!!editingModuleId" placeholder="e.g. loyalty_program"></div>
              <div class="form-group"><label class="form-label">Name</label><input class="form-input" v-model="moduleForm.name" placeholder="Display name"></div>
              <div class="form-group"><label class="form-label">Icon (Font Awesome class)</label><input class="form-input" v-model="moduleForm.icon" placeholder="fa-solid fa-gift"></div>
              <div class="form-group"><label class="form-label">Path</label><input class="form-input" v-model="moduleForm.path" placeholder="loyalty-admin.html"></div>
              <div class="form-group" style="max-width:120px;"><label class="form-label">Order</label><input type="number" class="form-input" v-model="moduleForm.display_order"></div>
              <button class="btn-purple" @click="saveModule"><i class="fas fa-check"></i> {{ editingModuleId ? 'Save' : 'Add' }}</button>
              <button v-if="editingModuleId" class="btn-glass" @click="resetModuleForm">Cancel</button>
            </div>
          </div>

          <div class="card">
            <div class="table-wrap">
              <table>
                <thead><tr><th>Module</th><th>Path</th><th>Order</th><th>Status</th><th></th></tr></thead>
                <tbody>
                  <tr v-for="m in allModules" :key="m.id">
                    <td><i :class="getIconClass(m.icon)" style="color:var(--text-muted); margin-right:8px;"></i>{{ m.name }}</td>
                    <td style="color:var(--text-muted);">{{ m.path }}</td>
                    <td>{{ m.display_order }}</td>
                    <td><span class="badge" :class="m.is_active ? 'badge-active' : 'badge-inactive'">{{ m.is_active ? 'active' : 'hidden' }}</span></td>
                    <td>
                      <button class="icon-btn-sm" title="Edit" @click="editModule(m)"><i class="fas fa-pencil"></i></button>
                      <button class="icon-btn-sm danger" title="Delete" @click="deleteModule(m)"><i class="fas fa-trash"></i></button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- ══════════ PLATFORM CONFIG ══════════ -->
        <div v-if="currentSection === 'config'">
          <div class="grid">
            <div class="card">
              <div class="card-head">
                <div class="card-head-title"><div class="card-icon"><i class="fas fa-key"></i></div><div><div class="card-title">System Config</div><div class="card-sub">Key/value store — secrets are masked</div></div></div>
              </div>
              <div v-for="c in systemConfigRows" :key="c.id" class="form-group">
                <label class="form-label">{{ c.system_name || c.id }} <span style="opacity:0.5;">({{ c.config_type }})</span></label>
                <input class="form-input" :type="c.config_type === 'secret' ? 'password' : 'text'"
                       v-model="c.config_value" :disabled="c.config_type === 'secret'">
              </div>
              <button class="btn-purple" @click="saveSystemConfig" :disabled="savingConfig"><i class="fas fa-check"></i> Save Config</button>
            </div>

            <div class="card">
              <div class="card-head">
                <div class="card-head-title"><div class="card-icon"><i class="fas fa-robot"></i></div><div><div class="card-title">AI Concierge</div><div class="card-sub">WhatsApp AI settings</div></div></div>
              </div>
              <div class="form-group"><label class="form-label">Model</label><input class="form-input" v-model="aiSettings.model"></div>
              <div class="form-group"><label class="form-label">Temperature</label><input type="number" step="0.1" min="0" max="1" class="form-input" v-model="aiSettings.temperature"></div>
              <div class="form-group"><label class="form-label">Max Tokens</label><input type="number" class="form-input" v-model="aiSettings.max_tokens"></div>
              <div class="form-group" style="display:flex; align-items:center; gap:10px;">
                <label class="form-label" style="margin:0;">Enable AI</label>
                <div class="toggle-switch" :class="{ on: aiSettings.enable_ai }" @click="aiSettings.enable_ai = !aiSettings.enable_ai"><div class="toggle-knob"></div></div>
              </div>
              <button class="btn-purple" @click="saveAiSettings"><i class="fas fa-check"></i> Save AI Settings</button>
            </div>
          </div>
        </div>

      </div><!-- /content -->
    </div><!-- /main -->
  </template>

  <div class="success-toast" id="successToast"><i class="fas fa-check-circle"></i> Saved successfully</div>
</div>

<script type="module">
  import { supabase } from '../config/supabase.js';
  import { requireAuth, signOutUser } from '../config/auth.js';

  new Vue({
    el: '#app',
    data: {
      showLoadingScreen: true,
      loadingMessage: 'Verifying access…',
      sidebarOpen: false,
      currentSection: 'overview',

      tenants: [],
      newTenantName: '',
      tenantModules: [], // raw rows from tenant_modules
      togglingKey: null,

      allModules: [],
      moduleForm: { id: '', name: '', icon: '', path: '', display_order: 0 },
      editingModuleId: null,

      profiles: [],
      profileFilter: '',
      savingProfileId: null,

      systemConfigRows: [],
      aiSettings: { id: 'default', model: 'gpt-4', temperature: 0.3, max_tokens: 500, enable_ai: true },
      savingConfig: false,

      invoices: [],
      revenueTx: [],
      showInvoiceForm: false,
      invoiceForm: { tenant_id: '', period: '', platform_fees: '', due_date: '' }
    },
    computed: {
      currentSectionTitle() {
        const titles = { overview: 'Platform Overview', tenants: 'Tenants', billing: 'Billing & Revenue', people: 'People', modules: 'Module Catalog', config: 'Platform Config' };
        return titles[this.currentSection] || 'Superadmin';
      },
      roleCounts() {
        const counts = {};
        this.profiles.forEach(p => { counts[p.role] = (counts[p.role] || 0) + 1; });
        return counts;
      },
      filteredProfiles() {
        const q = this.profileFilter.trim().toLowerCase();
        if (!q) return this.profiles;
        return this.profiles.filter(p =>
          (p.name || '').toLowerCase().includes(q) ||
          (p.surname || '').toLowerCase().includes(q) ||
          (p.email || '').toLowerCase().includes(q) ||
          (p.phone || '').toLowerCase().includes(q)
        );
      }
    },
    methods: {
      nav(section) { this.currentSection = section; this.closeSidebar(); },
      closeSidebar() { if (window.innerWidth <= 768) this.sidebarOpen = false; },
      getIconClass(icon) {
        if (!icon) return 'fas fa-question';
        if (icon.startsWith('fas ') || icon.startsWith('fab ') || icon.startsWith('far ')) return icon;
        if (icon.startsWith('fa-')) return 'fas ' + icon;
        return 'fas fa-question';
      },
      formatDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString(); },
      showToast() { const el = document.getElementById('successToast'); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3000); },
      async logout() { await signOutUser(); },

      tenantName(id) { const t = this.tenants.find(t => t.id === id); return t ? t.name : '—'; },
      enabledModuleCount(tenantId) {
        return this.allModules.filter(m => this.isTenantModuleEnabled(tenantId, m.name)).length;
      },
      isTenantModuleEnabled(tenantId, moduleName) {
        const row = this.tenantModules.find(tm => tm.tenant_id === tenantId && tm.module_name === moduleName);
        // No row yet = treat as enabled by default (matches the module's own is_active state)
        return row ? row.enabled : true;
      },

      // ── Tenants ──
      async loadTenants() {
        const { data, error } = await supabase.from('tenants').select('*').order('created_at', { ascending: true });
        if (error) { console.error(error); return; }
        this.tenants = data || [];
      },
      async loadTenantModules() {
        const { data, error } = await supabase.from('tenant_modules').select('*');
        if (error) { console.error(error); return; }
        this.tenantModules = data || [];
      },
      async addTenant() {
        const name = this.newTenantName.trim();
        if (!name) return;
        const { error } = await supabase.from('tenants').insert({ name, status: 'active' });
        if (error) { console.error(error); alert('Could not add tenant.'); return; }
        this.newTenantName = '';
        await this.loadTenants();
        this.showToast();
      },
      async updateTenantStatus(tenant, status) {
        const { error } = await supabase.from('tenants').update({ status }).eq('id', tenant.id);
        if (error) { console.error(error); alert('Could not update tenant status.'); return; }
        tenant.status = status;
        this.showToast();
      },
      async toggleTenantModule(tenant, module) {
        const key = tenant.id + '_' + module.name;
        this.togglingKey = key;
        const current = this.isTenantModuleEnabled(tenant.id, module.name);
        const next = !current;
        try {
          const existing = this.tenantModules.find(tm => tm.tenant_id === tenant.id && tm.module_name === module.name);
          if (existing) {
            const { error } = await supabase.from('tenant_modules').update({ enabled: next }).eq('id', existing.id);
            if (error) throw error;
            existing.enabled = next;
          } else {
            const { data, error } = await supabase.from('tenant_modules').insert({ tenant_id: tenant.id, module_name: module.name, enabled: next }).select().single();
            if (error) throw error;
            this.tenantModules.push(data);
          }
          this.showToast();
        } catch (e) { console.error(e); alert('Could not update module access.'); }
        finally { this.togglingKey = null; }
      },

      // ── Modules ──
      async loadModules() {
        const { data, error } = await supabase.from('modules').select('*').order('display_order', { ascending: true, nullsFirst: false });
        if (error) { console.error(error); return; }
        this.allModules = data || [];
      },
      editModule(m) {
        this.editingModuleId = m.id;
        this.moduleForm = { id: m.id, name: m.name, icon: m.icon, path: m.path, display_order: m.display_order };
      },
      resetModuleForm() { this.editingModuleId = null; this.moduleForm = { id: '', name: '', icon: '', path: '', display_order: 0 }; },
      async saveModule() {
        const f = this.moduleForm;
        if (!f.id.trim() || !f.name.trim() || !f.path.trim()) { alert('ID, Name and Path are required.'); return; }
        if (this.editingModuleId) {
          const { error } = await supabase.from('modules').update({ name: f.name, icon: f.icon, path: f.path, display_order: Number(f.display_order) || 0 }).eq('id', this.editingModuleId);
          if (error) { console.error(error); alert('Could not save module.'); return; }
        } else {
          const { error } = await supabase.from('modules').insert({ id: f.id.trim(), name: f.name, icon: f.icon, path: f.path, display_order: Number(f.display_order) || 0, is_active: true });
          if (error) { console.error(error); alert('Could not add module. Is that ID already taken?'); return; }
        }
        this.resetModuleForm();
        await this.loadModules();
        this.showToast();
      },
      async deleteModule(m) {
        if (!confirm(`Delete "${m.name}"? This removes it from every tenant's sidebar.`)) return;
        const { error } = await supabase.from('modules').delete().eq('id', m.id);
        if (error) { console.error(error); alert('Could not delete module.'); return; }
        await this.loadModules();
        this.showToast();
      },

      // ── People ──
      async loadProfiles() {
        const { data, error } = await supabase.from('profiles').select('id, name, surname, email, phone, role, staff_role, status, auth_user_id').order('name', { ascending: true });
        if (error) { console.error(error); return; }
        this.profiles = data || [];
      },
      async updateProfileRole(profile, role) {
        this.savingProfileId = profile.id;
        try {
          const { error } = await supabase.from('profiles').update({ role }).eq('id', profile.id);
          if (error) throw error;
          profile.role = role;
          this.showToast();
        } catch (e) { console.error(e); alert('Could not update role.'); }
        finally { this.savingProfileId = null; }
      },

      // ── Config ──
      async loadSystemConfig() {
        const { data, error } = await supabase.from('system_config').select('*').order('system_name');
        if (error) { console.error(error); return; }
        this.systemConfigRows = (data || []).map(r => r.config_type === 'secret' ? { ...r, config_value: '••••••••••••' } : r);
      },
      async saveSystemConfig() {
        this.savingConfig = true;
        try {
          for (const row of this.systemConfigRows) {
            if (row.config_type === 'secret') continue; // never write back the masked placeholder
            const { error } = await supabase.from('system_config').update({ config_value: row.config_value }).eq('id', row.id);
            if (error) throw error;
          }
          this.showToast();
        } catch (e) { console.error(e); alert('Could not save config.'); }
        finally { this.savingConfig = false; }
      },
      async loadAiSettings() {
        const { data, error } = await supabase.from('ai_settings').select('*').eq('id', 'default').maybeSingle();
        if (error) { console.warn(error); return; }
        if (data) this.aiSettings = data;
      },
      async saveAiSettings() {
        try {
          const { error } = await supabase.from('ai_settings').upsert({ ...this.aiSettings, updated_at: new Date() });
          if (error) throw error;
          this.showToast();
        } catch (e) { console.error(e); alert('Could not save AI settings.'); }
      },

      // ── Billing ──
      async loadInvoices() {
        const { data, error } = await supabase.from('invoices').select('*').order('created_at', { ascending: false });
        if (error) { console.warn(error); return; }
        this.invoices = data || [];
      },
      async loadRevenueTx() {
        const { data, error } = await supabase.from('revenue_transactions').select('*').order('created_at', { ascending: false }).limit(100);
        if (error) { console.warn(error); return; }
        this.revenueTx = data || [];
      },
      async addInvoice() {
        const f = this.invoiceForm;
        if (!f.tenant_id || !f.period || !f.platform_fees) { alert('Tenant, period and platform fees are required.'); return; }
        const { error } = await supabase.from('invoices').insert({
          id: crypto.randomUUID(),
          tenant_id: f.tenant_id,
          period: f.period,
          platform_fees: Number(f.platform_fees),
          amount_owed: Number(f.platform_fees),
          status: 'pending',
          due_date: f.due_date || null
        });
        if (error) { console.error(error); alert('Could not create invoice.'); return; }
        this.invoiceForm = { tenant_id: '', period: '', platform_fees: '', due_date: '' };
        this.showInvoiceForm = false;
        await this.loadInvoices();
        this.showToast();
      },

      async loadAll() {
        await Promise.all([
          this.loadTenants(), this.loadTenantModules(), this.loadModules(),
          this.loadProfiles(), this.loadSystemConfig(), this.loadAiSettings(),
          this.loadInvoices(), this.loadRevenueTx()
        ]);
      }
    },
    async mounted() {
      // requireAuth handles: no session → /login.html, missing/broken profile →
      // signed out + /login.html, inactive account → signed out + /login.html,
      // and wrong role → silently redirected to that role's own dashboard.
      const auth = await requireAuth(['superadmin']);
      if (!auth) return; // already redirected

      this.loadingMessage = 'Loading platform data…';
      await this.loadAll();
      setTimeout(() => { this.showLoadingScreen = false; }, 500);
    }
  });
</script>
</body>
</html>
