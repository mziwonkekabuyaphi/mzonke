<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Box Office · Payment Request</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red: #E30613;
      --red-dark: #a0010e;
      --red-glow: rgba(227,6,19,0.18);
      --ink: #1e293b;
      --slate: #475569;
      --mist: #94a3b8;
      --bone: #f8fafd;
      --white: #ffffff;
      --border-strong: #eef2f8;
      --radius-lg: 28px;
      --radius-full: 9999px;
      --green: #10b981;
      --yellow: #f59e0b;
      --orange: #f97316;
      --purple: #8b5cf6;
      --gold: #fbbf24;
    }

    body {
      background: var(--bone);
      font-family: 'Inter', sans-serif;
      padding: 24px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-strong);
      overflow: hidden;
      box-shadow: 0 8px 20px -6px rgba(0,0,0,0.12);
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 2px solid var(--border-strong);
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, var(--white), var(--bone));
    }

    .card-header i { color: var(--red); margin-right: 8px; }

    .card-body { padding: 24px; }

    .event-selector {
      margin-bottom: 24px;
      padding: 16px;
      background: var(--bone);
      border-radius: 20px;
    }

    .event-selector label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
      color: var(--slate);
    }

    .event-selector select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 60px;
      border: 1px solid var(--border-strong);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      background: var(--white);
      cursor: pointer;
    }

    .event-selector select:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-glow);
    }

    .ticket-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }

    .ticket-card {
      background: var(--white);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ticket-card:hover:not(.disabled) {
      transform: translateY(-2px);
      border-color: var(--red);
      box-shadow: 0 4px 12px var(--red-glow);
    }

    .ticket-card.selected {
      border: 2px solid var(--red);
      background: rgba(227,6,19,0.06);
    }

    .ticket-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ticket-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--red);
    }

    .quantity-section {
      background: var(--bone);
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      margin-top: 20px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
    }

    .quantity-btn {
      width: 44px;
      height: 44px;
      background: white;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-full);
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      color: var(--red);
    }

    .quantity-btn:active { transform: scale(0.95); }
    .quantity-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .quantity-display {
      font-size: 28px;
      font-weight: 800;
      min-width: 60px;
      text-align: center;
    }

    .order-summary {
      background: var(--bone);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed var(--border-strong);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      padding: 16px 0 8px;
      border-top: 2px solid var(--red);
      font-weight: 800;
      color: var(--red);
    }

    .payment-methods-section { margin-bottom: 24px; }

    .payment-option {
      border: 1.5px solid var(--border-strong);
      border-radius: 20px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
      background: var(--white);
    }

    .payment-option:hover {
      border-color: var(--red);
      background: rgba(227,6,19,0.03);
    }

    .payment-option.selected {
      border-color: var(--red);
      background: rgba(227,6,19,0.05);
    }

    .payment-option-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .payment-icon {
      width: 48px;
      height: 48px;
      background: rgba(227,6,19,0.08);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .payment-icon i {
      font-size: 1.3rem;
      color: var(--red);
    }

    .payment-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--ink);
    }

    .payment-desc {
      font-size: 0.7rem;
      color: var(--mist);
    }

    .phone-input-group {
      margin-bottom: 20px;
      display: none;
    }

    .phone-input-group.visible { display: block; }

    .phone-input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 60px;
      border: 1px solid var(--border-strong);
      font-size: 1rem;
    }

    .btn-primary {
      background: var(--red);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-panel {
      margin-top: 20px;
      padding: 16px;
      border-radius: 20px;
      background: var(--bone);
      text-align: center;
      display: none;
    }

    .status-panel.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--green);
      color: var(--green);
    }

    .status-panel.error {
      display: block;
      background: rgba(227, 6, 19, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
    }

    .status-panel.pending {
      display: block;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--yellow);
      color: var(--orange);
    }

    .timer-display {
      font-family: monospace;
      font-size: 2rem;
      font-weight: 800;
      margin: 12px 0;
      color: var(--orange);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      z-index: 10001;
      transform: translateX(400px);
      transition: transform 0.25s;
    }

    .toast.show { transform: translateX(0); }

    /* Professional Wristband Styles */
    @media print {
      body * { visibility: hidden; }
      .wristband-print, .wristband-print * { visibility: visible; }
      .wristband-print {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      @page {
        size: 2in 8in;
        margin: 0;
      }
    }

    .wristband-print { display: none; }

    .wristband {
      width: 2in;
      height: 8in;
      font-family: 'Inter', sans-serif;
      position: relative;
      page-break-after: avoid;
      break-inside: avoid;
    }

    .wristband-general { background: linear-gradient(135deg, #ffffff, #f5f5f5); border-left: 4px solid #6b7280; }
    .wristband-vip { background: linear-gradient(135deg, #fef3c7, #fde68a); border-left: 4px solid var(--gold); }
    .wristband-vvip { background: linear-gradient(135deg, #fce7f3, #fbcfe8); border-left: 4px solid #ec4899; }
    .wristband-staff { background: linear-gradient(135deg, #e0e7ff, #c7d2fe); border-left: 4px solid #4f46e5; }
    .wristband-artist { background: linear-gradient(135deg, #dbeafe, #bfdbfe); border-left: 4px solid #3b82f6; }
    .wristband-backstage { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); border-left: 4px solid var(--purple); }

    .wristband-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 16px 12px;
    }

    .wristband-event {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(0,0,0,0.1);
      margin-bottom: 12px;
    }

    .wristband-event-name {
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .wristband-event-date {
      font-size: 9px;
      font-weight: 500;
      color: rgba(0,0,0,0.6);
    }

    .wristband-type { text-align: center; margin-bottom: 16px; }

    .wristband-type-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .badge-general { background: #6b7280; color: white; }
    .badge-vip { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1e293b; }
    .badge-vvip { background: linear-gradient(135deg, #ec4899, #db2777); color: white; }
    .badge-staff { background: linear-gradient(135deg, #4f46e5, #4338ca); color: white; }
    .badge-artist { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
    .badge-backstage { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; }

    .wristband-barcode-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
    }

    .wristband-qr { margin: 8px 0; }
    .wristband-qr canvas,
    .wristband-qr img {
      width: 140px !important;
      height: 140px !important;
      max-width: 140px;
      max-height: 140px;
    }

    .wristband-ticket-number {
      text-align: center;
      font-size: 10px;
      font-family: monospace;
      letter-spacing: 1px;
      margin-top: 8px;
      padding: 4px 8px;
      background: rgba(0,0,0,0.05);
      border-radius: 4px;
    }

    .wristband-guest {
      text-align: center;
      padding: 12px;
      margin-top: 8px;
      border-top: 1px dashed rgba(0,0,0,0.15);
    }

    .wristband-guest-label {
      font-size: 7px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(0,0,0,0.5);
      margin-bottom: 4px;
    }

    .wristband-guest-name {
      font-size: 12px;
      font-weight: 700;
    }

    .wristband-footer {
      text-align: center;
      padding-top: 8px;
      font-size: 6px;
      color: rgba(0,0,0,0.4);
      border-top: 1px solid rgba(0,0,0,0.1);
      margin-top: 8px;
    }

    .wristband-preview-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 3000;
      align-items: center;
      justify-content: center;
    }

    .wristband-preview-modal.show { display: flex; }

    .wristband-preview-content {
      background: white;
      border-radius: 24px;
      padding: 24px;
      max-width: 300px;
      text-align: center;
    }

    .preview-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .preview-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 60px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-print { background: var(--red); color: white; }
    .btn-close { background: var(--bone); color: var(--slate); }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(227,6,19,0.3);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      body { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="dashboard-grid">
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-ticket-alt"></i> Select tickets</span>
      <button class="btn-secondary" id="syncBtn" style="background: var(--bone); border: 1px solid var(--border-strong); padding: 6px 14px; border-radius: 60px; cursor: pointer;">
        <i class="fas fa-sync-alt"></i> Sync
      </button>
    </div>
    <div class="card-body">
      <div class="event-selector">
        <label><i class="fas fa-calendar-alt"></i> Select Event</label>
        <select id="eventSelect"></select>
      </div>
      <div id="eventInfo"></div>
      <div id="ticketContainer" class="ticket-grid"></div>
      <div class="quantity-section">
        <div>🎟️ Quantity</div>
        <div class="quantity-controls">
          <button class="quantity-btn" id="decQty">−</button>
          <span class="quantity-display" id="qtyDisplay">1</span>
          <button class="quantity-btn" id="incQty">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-cash-register"></i> Payment</span>
    </div>
    <div class="card-body">
      <div class="order-summary" id="orderSummary">
        <div class="summary-item"><span>Ticket type:</span><span id="summaryType">—</span></div>
        <div class="summary-item"><span>Price each:</span><span id="summaryPrice">R0</span></div>
        <div class="summary-item"><span>Quantity:</span><span id="summaryQty">1</span></div>
        <div class="summary-total"><span>Total:</span><span id="summaryTotal">R0</span></div>
      </div>

      <div class="payment-methods-section">
        <div style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--mist); margin-bottom: 12px;">
          <i class="fas fa-credit-card"></i> Payment Method
        </div>
        
        <div class="payment-option" id="cashOption">
          <div class="payment-option-header">
            <div class="payment-icon"><i class="fas fa-money-bill-wave"></i></div>
            <div><div class="payment-title">Cash Payment</div><div class="payment-desc">Pay with cash at the box office</div></div>
            <div style="margin-left: auto;"><div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;"><div id="cashSelectedIndicator" style="width:12px;height:12px;background:var(--red);border-radius:50%;display:none;"></div></div></div>
          </div>
        </div>

        <div class="payment-option" id="cardOption">
          <div class="payment-option-header">
            <div class="payment-icon"><i class="fas fa-credit-card"></i></div>
            <div><div class="payment-title">Card Payment</div><div class="payment-desc">Visa, Mastercard, Apple Pay</div></div>
            <div style="margin-left: auto;"><div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;"><div id="cardSelectedIndicator" style="width:12px;height:12px;background:var(--red);border-radius:50%;display:none;"></div></div></div>
          </div>
        </div>

        <div class="payment-option" id="walletOption">
          <div class="payment-option-header">
            <div class="payment-icon"><i class="fas fa-wallet"></i></div>
            <div><div class="payment-title">Rands Wallet</div><div class="payment-desc">Request payment approval from customer's wallet</div></div>
            <div style="margin-left: auto;"><div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;"><div id="walletSelectedIndicator" style="width:12px;height:12px;background:var(--red);border-radius:50%;display:none;"></div></div></div>
          </div>
        </div>
      </div>

      <div class="phone-input-group" id="phoneInputGroup">
        <label><i class="fas fa-phone-alt"></i> Customer phone number</label>
        <input type="tel" id="customerPhone" placeholder="e.g. 0712345678">
      </div>

      <button class="btn-primary" id="requestPaymentBtn">💰 Process Cash Payment</button>

      <div id="requestStatus" class="status-panel"></div>
    </div>
  </div>
</div>

<div id="toastMsg" class="toast"></div>

<div id="wristbandPreviewModal" class="wristband-preview-modal">
  <div class="wristband-preview-content">
    <i class="fas fa-ticket-alt" style="font-size: 48px; color: var(--red); margin-bottom: 16px;"></i>
    <h3>Wristband Preview</h3>
    <div id="previewWristband"></div>
    <div class="preview-actions">
      <button class="btn-print" id="printWristbandBtn"><i class="fas fa-print"></i> Print</button>
      <button class="btn-close" id="closePreviewBtn">Close</button>
    </div>
  </div>
</div>

<div id="wristbandPrintContainer" class="wristband-print"></div>

<script type="module">
  import { supabase } from '../config/supabase.js';

  // STATE
  let events = [];
  let selectedEvent = null;
  let selectedTicketType = null;
  let ticketQuantity = 1;
  let currentRequestId = null;
  let requestSubscription = null;
  let selectedPaymentMethod = 'cash';
  let countdownInterval = null;

  // DOM elements
  const eventSelect = document.getElementById('eventSelect');
  const eventInfoDiv = document.getElementById('eventInfo');
  const ticketContainer = document.getElementById('ticketContainer');
  const decQty = document.getElementById('decQty');
  const incQty = document.getElementById('incQty');
  const qtyDisplay = document.getElementById('qtyDisplay');
  const summaryType = document.getElementById('summaryType');
  const summaryPrice = document.getElementById('summaryPrice');
  const summaryQty = document.getElementById('summaryQty');
  const summaryTotal = document.getElementById('summaryTotal');
  const customerPhoneInput = document.getElementById('customerPhone');
  const requestPaymentBtn = document.getElementById('requestPaymentBtn');
  const requestStatusDiv = document.getElementById('requestStatus');
  const syncBtn = document.getElementById('syncBtn');
  const phoneInputGroup = document.getElementById('phoneInputGroup');

  function showToast(msg, type = 'info') {
    const toast = document.getElementById('toastMsg');
    const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
    toast.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function validatePhone(phone) { return /^[0-9]{10}$/.test(phone); }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function getTicketTypeClass(ticketName) {
    const name = ticketName.toLowerCase();
    if (name.includes('vvip')) return 'vvip';
    if (name.includes('vip')) return 'vip';
    if (name.includes('staff')) return 'staff';
    if (name.includes('artist')) return 'artist';
    if (name.includes('backstage')) return 'backstage';
    return 'general';
  }

  function getTicketTypeBadgeClass(ticketName) {
    const name = ticketName.toLowerCase();
    if (name.includes('vvip')) return 'badge-vvip';
    if (name.includes('vip')) return 'badge-vip';
    if (name.includes('staff')) return 'badge-staff';
    if (name.includes('artist')) return 'badge-artist';
    if (name.includes('backstage')) return 'badge-backstage';
    return 'badge-general';
  }

  async function generateWristbandHTML(ticket, event, ticketType, customerName = '') {
    const typeClass = getTicketTypeClass(ticketType.name);
    const badgeClass = getTicketTypeBadgeClass(ticketType.name);
    const displayName = customerName || 'Guest';
    const eventDate = event.start_time ? new Date(event.start_time).toLocaleDateString('en-ZA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : 'Date TBA';
    
    return `
      <div class="wristband wristband-${typeClass}">
        <div class="wristband-content">
          <div class="wristband-event">
            <div class="wristband-event-name">${escapeHtml(event.name)}</div>
            <div class="wristband-event-date">${eventDate}</div>
          </div>
          <div class="wristband-type">
            <span class="wristband-type-badge ${badgeClass}">${escapeHtml(ticketType.name.toUpperCase())}</span>
          </div>
          <div class="wristband-barcode-section">
            <div class="wristband-qr" id="qr-${ticket.id}"></div>
            <div class="wristband-ticket-number">#${ticket.id.slice(0, 8).toUpperCase()}</div>
          </div>
          <div class="wristband-guest">
            <div class="wristband-guest-label">GUEST</div>
            <div class="wristband-guest-name">${escapeHtml(displayName)}</div>
          </div>
          <div class="wristband-footer">
            <div>SCAN FOR ENTRY</div>
          </div>
        </div>
      </div>
    `;
  }

  async function printWristband(ticket, event, ticketType, customerName = '') {
    const html = await generateWristbandHTML(ticket, event, ticketType, customerName);
    const printContainer = document.getElementById('wristbandPrintContainer');
    printContainer.innerHTML = html;
    
    setTimeout(() => {
      const qrDiv = document.getElementById(`qr-${ticket.id}`);
      if (qrDiv && window.QRCode) {
        qrDiv.innerHTML = '';
        new QRCode(qrDiv, {
          text: JSON.stringify({ ticket_id: ticket.id, event_id: event.id, check: true }),
          width: 140,
          height: 140
        });
        setTimeout(() => window.print(), 200);
      } else {
        window.print();
      }
    }, 100);
  }

  async function showWristbandPreview(ticket, event, ticketType, customerName = '') {
    const html = await generateWristbandHTML(ticket, event, ticketType, customerName);
    const previewContainer = document.getElementById('previewWristband');
    previewContainer.innerHTML = html;
    
    setTimeout(() => {
      const qrDiv = document.getElementById(`qr-${ticket.id}`);
      if (qrDiv && window.QRCode) {
        qrDiv.innerHTML = '';
        new QRCode(qrDiv, {
          text: JSON.stringify({ ticket_id: ticket.id, event_id: event.id, check: true }),
          width: 140,
          height: 140
        });
      }
    }, 100);
    
    document.getElementById('wristbandPreviewModal').classList.add('show');
    
    document.getElementById('printWristbandBtn').onclick = () => {
      printWristband(ticket, event, ticketType, customerName);
      showToast('Wristband sent to printer', 'success');
    };
  }

  async function getOrCreateCustomerProfile(phone) {
    try {
      let { data: profile, error } = await supabase.from('profiles').select('id, name').eq('phone', phone).maybeSingle();
      if (error && error.code !== 'PGRST116') throw error;
      if (!profile) {
        const { data: newProfile, error: createError } = await supabase.from('profiles').insert({
          phone: phone, role: 'customer', account_type: 'general', status: 'Active', created_at: new Date().toISOString()
        }).select().single();
        if (createError) throw createError;
        profile = newProfile;
        await supabase.from('wallets').insert({ user_id: profile.id, balance: 0, currency: 'ZAR', status: 'active' });
      }
      return profile;
    } catch (err) {
      throw new Error(`Failed to get/create customer: ${err.message}`);
    }
  }

  async function loadEvents() {
    try {
      const { data: eventsData, error } = await supabase.from('events').select('*').eq('is_active', true).eq('status', 'active').order('start_time', { ascending: true });
      if (error) throw error;
      events = eventsData || [];
      
      if (events.length === 0) {
        eventSelect.innerHTML = '<option>No active events</option>';
        eventInfoDiv.innerHTML = '<div style="color: var(--mist); text-align: center; padding: 20px;">No active events found</div>';
        ticketContainer.innerHTML = '<div class="ticket-card disabled">No events available</div>';
        return;
      }
      
      for (let ev of events) {
        const { data: types } = await supabase.from('ticket_types').select('*').eq('event_id', ev.id);
        ev.ticketTypes = types || [];
      }
      
      const eventsWithTickets = events.filter(ev => ev.ticketTypes.length > 0);
      if (eventsWithTickets.length === 0) {
        eventSelect.innerHTML = '<option>No events with tickets</option>';
        eventInfoDiv.innerHTML = '<div style="color: var(--mist); text-align: center; padding: 20px;">No ticket types configured</div>';
        ticketContainer.innerHTML = '<div class="ticket-card disabled">No ticket types available</div>';
        return;
      }
      
      eventSelect.innerHTML = eventsWithTickets.map(ev => `<option value="${ev.id}">${escapeHtml(ev.name)}</option>`).join('');
      selectedEvent = eventsWithTickets[0];
      eventSelect.value = selectedEvent.id;
      renderEvent();
      renderTickets();
    } catch (err) {
      console.error('Load events error:', err);
      showToast('Failed to load events: ' + err.message, 'error');
    }
  }

  function renderEvent() {
    if (!selectedEvent) return;
    const start = selectedEvent.start_time ? new Date(selectedEvent.start_time) : null;
    const dateStr = start ? start.toLocaleDateString('en-ZA', { weekday: 'short', month: 'short', day: 'numeric' }) : 'TBD';
    eventInfoDiv.innerHTML = `<div style="font-size: 1.3rem; font-weight: 800; color: var(--red);">${escapeHtml(selectedEvent.name)}</div><div style="color: var(--slate); font-size: 0.9rem;"><i class="fas fa-calendar-alt"></i> ${dateStr}<br><i class="fas fa-map-marker-alt"></i> ${escapeHtml(selectedEvent.location || 'Venue TBA')}</div>`;
  }

  function renderTickets() {
    if (!selectedEvent?.ticketTypes?.length) {
      ticketContainer.innerHTML = '<div class="ticket-card disabled">No ticket types</div>';
      return;
    }
    
    ticketContainer.innerHTML = selectedEvent.ticketTypes.map(tt => {
      const available = (tt.capacity || 0) - (tt.sold || 0);
      return `<div class="ticket-card ${available <= 0 ? 'disabled' : ''}" data-id="${tt.id}" data-name="${escapeHtml(tt.name)}" data-price="${tt.price}" data-available="${available}">
        <div style="font-size: 32px;">🎟️</div>
        <div style="font-weight: 700;">${escapeHtml(tt.name)}</div>
        <div class="ticket-price">R${Number(tt.price).toLocaleString()}</div>
        <div style="font-size: 0.7rem;">${available} left</div>
      </div>`;
    }).join('');
    
    document.querySelectorAll('.ticket-card:not(.disabled)').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.ticket-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedTicketType = { id: card.dataset.id, name: card.dataset.name, price: parseInt(card.dataset.price), available: parseInt(card.dataset.available) };
        updateSummary();
        updateQuantityLimit();
      });
    });
    
    const firstAvail = document.querySelector('.ticket-card:not(.disabled)');
    if (firstAvail) firstAvail.click();
  }

  function updateQuantityLimit() {
    if (!selectedTicketType) { incQty.disabled = true; decQty.disabled = true; return; }
    incQty.disabled = ticketQuantity >= Math.min(selectedTicketType.available, 10);
    decQty.disabled = ticketQuantity <= 1;
  }

  function updateSummary() {
    if (!selectedTicketType) {
      summaryType.textContent = '—'; summaryPrice.textContent = 'R0'; summaryTotal.textContent = 'R0';
      return;
    }
    const total = selectedTicketType.price * ticketQuantity;
    summaryType.textContent = selectedTicketType.name;
    summaryPrice.textContent = `R${selectedTicketType.price.toLocaleString()}`;
    summaryQty.textContent = ticketQuantity;
    summaryTotal.textContent = `R${total.toLocaleString()}`;
  }

  decQty.addEventListener('click', () => { if (ticketQuantity > 1) { ticketQuantity--; qtyDisplay.textContent = ticketQuantity; updateSummary(); updateQuantityLimit(); } });
  incQty.addEventListener('click', () => { if (selectedTicketType && ticketQuantity < selectedTicketType.available && ticketQuantity < 10) { ticketQuantity++; qtyDisplay.textContent = ticketQuantity; updateSummary(); updateQuantityLimit(); } });
  eventSelect.addEventListener('change', () => { selectedEvent = events.find(ev => ev.id === eventSelect.value); selectedTicketType = null; ticketQuantity = 1; qtyDisplay.textContent = '1'; renderEvent(); renderTickets(); });

  // Payment method selection
  document.getElementById('cashOption').addEventListener('click', () => {
    selectedPaymentMethod = 'cash';
    document.getElementById('cashSelectedIndicator').style.display = 'block';
    document.getElementById('cardSelectedIndicator').style.display = 'none';
    document.getElementById('walletSelectedIndicator').style.display = 'none';
    document.getElementById('cashOption').classList.add('selected');
    document.getElementById('cardOption').classList.remove('selected');
    document.getElementById('walletOption').classList.remove('selected');
    phoneInputGroup.classList.remove('visible');
    requestPaymentBtn.innerHTML = '💰 Process Cash Payment';
  });
  
  document.getElementById('cardOption').addEventListener('click', () => {
    selectedPaymentMethod = 'card';
    document.getElementById('cardSelectedIndicator').style.display = 'block';
    document.getElementById('cashSelectedIndicator').style.display = 'none';
    document.getElementById('walletSelectedIndicator').style.display = 'none';
    document.getElementById('cardOption').classList.add('selected');
    document.getElementById('cashOption').classList.remove('selected');
    document.getElementById('walletOption').classList.remove('selected');
    phoneInputGroup.classList.remove('visible');
    requestPaymentBtn.innerHTML = '💳 Pay with Card';
  });
  
  document.getElementById('walletOption').addEventListener('click', () => {
    selectedPaymentMethod = 'wallet';
    document.getElementById('walletSelectedIndicator').style.display = 'block';
    document.getElementById('cashSelectedIndicator').style.display = 'none';
    document.getElementById('cardSelectedIndicator').style.display = 'none';
    document.getElementById('walletOption').classList.add('selected');
    document.getElementById('cashOption').classList.remove('selected');
    document.getElementById('cardOption').classList.remove('selected');
    phoneInputGroup.classList.add('visible');
    requestPaymentBtn.innerHTML = '📲 Request Wallet Payment';
  });

  async function issueTickets(customerPhone, customerId, customerName = '') {
    const ticketsToInsert = [];
    for (let i = 0; i < ticketQuantity; i++) {
      ticketsToInsert.push({
        event_id: selectedEvent.id,
        ticket_type_id: selectedTicketType.id,
        customer_phone: customerPhone,
        status: 'issued',
        issued_at: new Date().toISOString(),
        checked_in: true,
        checked_in_at: new Date().toISOString(),
        ticket_type: selectedTicketType.name.toLowerCase().includes('vip') ? 'vip' : 'general',
        qr_token: crypto.randomUUID()
      });
    }
    
    const { data: tickets, error } = await supabase.from('tickets').insert(ticketsToInsert).select();
    if (error) throw error;
    
    for (const ticket of tickets) {
      await supabase.from('checkins').insert({
        ticket_id: ticket.id,
        event_id: selectedEvent.id,
        scanned_at: new Date().toISOString(),
        status: 'valid',
        gate: 'box_office'
      });
      
      await showWristbandPreview(ticket, selectedEvent, selectedTicketType, customerName);
    }
    
    const { data: tt } = await supabase.from('ticket_types').select('sold').eq('id', selectedTicketType.id).single();
    if (tt) await supabase.from('ticket_types').update({ sold: (tt.sold || 0) + ticketQuantity }).eq('id', selectedTicketType.id);
    
    return tickets;
  }

  async function processCashPayment() {
    if (!selectedTicketType) { showToast('Select a ticket type', 'error'); return false; }
    if (ticketQuantity > selectedTicketType.available) { showToast(`Only ${selectedTicketType.available} tickets available`, 'error'); return false; }
    
    requestPaymentBtn.disabled = true;
    requestPaymentBtn.innerHTML = '<span class="loading-spinner"></span> Processing...';
    requestStatusDiv.style.display = 'block';
    requestStatusDiv.className = 'status-panel pending';
    requestStatusDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing cash payment...';
    
    try {
      const tickets = await issueTickets('cash_customer', null, 'Cash Customer');
      await supabase.from('payment_requests').insert({
        customer_phone: 'cash_customer',
        event_id: selectedEvent.id,
        ticket_type_id: selectedTicketType.id,
        quantity: ticketQuantity,
        total_amount: selectedTicketType.price * ticketQuantity,
        channel: 'boxoffice',
        status: 'completed',
        payment_method: 'cash',
        metadata: { cash_payment: true }
      });
      requestStatusDiv.innerHTML = `<i class="fas fa-check-circle"></i> Success! ${ticketQuantity} ticket(s) issued.`;
      requestStatusDiv.className = 'status-panel success';
      showToast(`✅ ${ticketQuantity} ticket(s) issued!`, 'success');
      await loadEvents();
      return true;
    } catch (err) {
      requestStatusDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Failed: ${err.message}`;
      requestStatusDiv.className = 'status-panel error';
      showToast(err.message, 'error');
      return false;
    } finally {
      requestPaymentBtn.disabled = false;
      requestPaymentBtn.innerHTML = '💰 Process Cash Payment';
      setTimeout(() => { if (requestStatusDiv.className !== 'status-panel success') requestStatusDiv.style.display = 'none'; }, 5000);
    }
  }

  async function processCardPayment() {
    if (!selectedTicketType) { showToast('Select a ticket type', 'error'); return false; }
    if (ticketQuantity > selectedTicketType.available) { showToast(`Only ${selectedTicketType.available} tickets available`, 'error'); return false; }
    
    requestPaymentBtn.disabled = true;
    requestPaymentBtn.innerHTML = '<span class="loading-spinner"></span> Initializing payment...';
    
    try {
      const totalAmount = selectedTicketType.price * ticketQuantity;
      const amountCents = Math.round(totalAmount * 100);
      
      const { data: pendingTx, error: insertError } = await supabase.from('wallet_transactions').insert({
        amount: totalAmount,
        type: 'topup',
        status: 'pending',
        provider: 'yoco',
        direction: 'credit',
        description: `Box office: ${ticketQuantity} x ${selectedTicketType.name} for ${selectedEvent.name}`,
        created_at: new Date().toISOString(),
        metadata: { 
          payment_method: 'yoco_card', 
          event_id: selectedEvent.id, 
          ticket_type_id: selectedTicketType.id, 
          quantity: ticketQuantity,
          box_office: true
        }
      }).select('id').single();
      if (insertError) throw new Error('Could not initialize payment');
      
      const { data: edgeResponse, error: edgeError } = await supabase.functions.invoke('yoco-create-checkout', {
        body: { 
          wallet_transaction_id: pendingTx.id, 
          amount_cents: amountCents, 
          currency: 'ZAR', 
          metadata: { 
            box_office: true, 
            event_id: selectedEvent.id, 
            ticket_type_id: selectedTicketType.id, 
            quantity: ticketQuantity,
            ticket_name: selectedTicketType.name,
            event_name: selectedEvent.name
          } 
        }
      });
      if (edgeError) throw new Error(edgeError.message || 'Payment gateway error');
      if (!edgeResponse?.checkout_url) throw new Error('Invalid response from payment gateway');
      
      sessionStorage.setItem('pendingBoxOfficePayment', JSON.stringify({ 
        event_id: selectedEvent.id, 
        ticket_type_id: selectedTicketType.id, 
        quantity: ticketQuantity, 
        total_amount: totalAmount, 
        transaction_id: pendingTx.id,
        ticket_name: selectedTicketType.name,
        event_name: selectedEvent.name
      }));
      window.location.href = edgeResponse.checkout_url;
    } catch (err) {
      showToast(err.message, 'error');
      requestPaymentBtn.disabled = false;
      requestPaymentBtn.innerHTML = '💳 Pay with Card';
      return false;
    }
  }

  async function processWalletPayment() {
    const phone = customerPhoneInput.value.trim();
    if (!phone || !validatePhone(phone)) { showToast('Enter valid 10-digit phone number', 'error'); return false; }
    if (!selectedTicketType) { showToast('Select a ticket type', 'error'); return false; }
    if (ticketQuantity > selectedTicketType.available) { showToast(`Only ${selectedTicketType.available} tickets available`, 'error'); return false; }
    
    requestPaymentBtn.disabled = true;
    requestPaymentBtn.innerHTML = '<span class="loading-spinner"></span> Sending request...';
    
    try {
      const customer = await getOrCreateCustomerProfile(phone);
      const totalAmount = selectedTicketType.price * ticketQuantity;
      const { data, error } = await supabase.from('payment_requests').insert({
        customer_phone: phone,
        customer_profile_id: customer.id,
        event_id: selectedEvent.id,
        ticket_type_id: selectedTicketType.id,
        quantity: ticketQuantity,
        total_amount: totalAmount,
        channel: 'boxoffice',
        status: 'pending',
        requested_at: new Date().toISOString(),
        expires_at: new Date(Date.now() + 2 * 60000).toISOString(),
        metadata: { payment_method: 'wallet' }
      }).select().single();
      if (error) throw error;
      
      currentRequestId = data.id;
      requestStatusDiv.style.display = 'block';
      requestStatusDiv.className = 'status-panel pending';
      requestStatusDiv.innerHTML = `<i class="fas fa-hourglass-half"></i> Waiting for customer approval...<br><small>Request ID: ${currentRequestId.slice(0, 8)}</small><div class="timer-display" id="requestTimer">02:00</div>`;
      
      let seconds = 120;
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        seconds--;
        const timerEl = document.getElementById('requestTimer');
        if (timerEl) timerEl.innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;
        if (seconds <= 0) {
          clearInterval(countdownInterval);
          if (currentRequestId) {
            showToast('Request expired - customer did not approve in time', 'error');
            resetRequestFlow();
          }
        }
      }, 1000);
      
      if (requestSubscription) requestSubscription.unsubscribe();
      requestSubscription = supabase.channel(`payment-${currentRequestId}`).on('postgres_changes', {
        event: 'UPDATE', schema: 'public', table: 'payment_requests', filter: `id=eq.${currentRequestId}`
      }, async (payload) => {
        if (payload.new.status === 'approved') {
          clearInterval(countdownInterval);
          await finalizeWalletPayment(payload.new, phone, customer);
        } else if (payload.new.status === 'rejected') {
          clearInterval(countdownInterval);
          showToast('Customer rejected payment', 'error');
          resetRequestFlow();
        } else if (payload.new.status === 'expired') {
          clearInterval(countdownInterval);
          showToast('Request expired', 'error');
          resetRequestFlow();
        }
      }).subscribe();
      
      showToast('Request sent! Customer has 2 minutes to approve in app', 'success');
    } catch (err) {
      showToast(err.message, 'error');
      requestPaymentBtn.disabled = false;
      requestPaymentBtn.innerHTML = '📲 Request Wallet Payment';
    }
  }

  async function finalizeWalletPayment(request, phone, customer) {
    requestStatusDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing tickets...';
    try {
      const tickets = await issueTickets(phone, customer.id, customer.name || 'Wallet Customer');
      await supabase.from('payment_requests').update({ status: 'completed', approved_at: new Date().toISOString() }).eq('id', request.id);
      requestStatusDiv.innerHTML = `<i class="fas fa-check-circle"></i> Success! ${ticketQuantity} ticket(s) issued.`;
      requestStatusDiv.className = 'status-panel success';
      showToast(`✅ ${ticketQuantity} ticket(s) issued!`, 'success');
      await loadEvents();
      resetRequestFlow();
    } catch (err) {
      requestStatusDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Failed: ${err.message}`;
      requestStatusDiv.className = 'status-panel error';
      showToast(err.message, 'error');
      resetRequestFlow();
    }
  }

  function resetRequestFlow() {
    if (countdownInterval) clearInterval(countdownInterval);
    if (requestSubscription) { requestSubscription.unsubscribe(); requestSubscription = null; }
    currentRequestId = null;
    requestPaymentBtn.disabled = false;
    if (selectedPaymentMethod === 'cash') requestPaymentBtn.innerHTML = '💰 Process Cash Payment';
    else if (selectedPaymentMethod === 'card') requestPaymentBtn.innerHTML = '💳 Pay with Card';
    else requestPaymentBtn.innerHTML = '📲 Request Wallet Payment';
    setTimeout(() => { if (requestStatusDiv.className !== 'status-panel success') requestStatusDiv.style.display = 'none'; }, 3000);
  }

  requestPaymentBtn.addEventListener('click', async () => {
    if (selectedPaymentMethod === 'cash') await processCashPayment();
    else if (selectedPaymentMethod === 'card') await processCardPayment();
    else if (selectedPaymentMethod === 'wallet') await processWalletPayment();
  });

  document.getElementById('closePreviewBtn').addEventListener('click', () => document.getElementById('wristbandPreviewModal').classList.remove('show'));
  
  syncBtn.addEventListener('click', () => { loadEvents(); showToast('Refreshed', 'info'); });
  
  customerPhoneInput.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10); });

  // Check for returning from card payment
  const pendingPayment = sessionStorage.getItem('pendingBoxOfficePayment');
  if (pendingPayment) {
    sessionStorage.removeItem('pendingBoxOfficePayment');
    const payment = JSON.parse(pendingPayment);
    showToast('Payment successful! Processing tickets...', 'success');
    (async () => {
      try {
        selectedEvent = events.find(e => e.id === payment.event_id);
        selectedTicketType = { id: payment.ticket_type_id, price: payment.total_amount / payment.quantity, name: payment.ticket_name || 'Ticket' };
        ticketQuantity = payment.quantity;
        const tickets = await issueTickets('card_customer', null, 'Card Customer');
        await supabase.from('wallet_transactions').update({ status: 'completed' }).eq('id', payment.transaction_id);
        await supabase.from('payment_requests').insert({
          customer_phone: 'card_customer',
          event_id: payment.event_id,
          ticket_type_id: payment.ticket_type_id,
          quantity: payment.quantity,
          total_amount: payment.total_amount,
          channel: 'boxoffice',
          status: 'completed',
          payment_method: 'card',
          metadata: { card_payment: true, transaction_id: payment.transaction_id }
        });
        showToast(`✅ ${payment.quantity} ticket(s) issued!`, 'success');
        await loadEvents();
      } catch (err) { showToast('Failed to process: ' + err.message, 'error'); }
    })();
  }

  phoneInputGroup.classList.remove('visible');
  loadEvents();
</script>
