<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Box Office · Rands Premium Ticketing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ========== DARK THEME – MATCH STAFF CONSOLE ========== */
    :root {
      --red: #E30613;
      --red-dim: rgba(227,6,19,0.12);
      --red-border: rgba(227,6,19,0.25);
      --bg: #0D0F12;
      --surface: #141720;
      --surface2: #1C2030;
      --surface3: #232840;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.1);
      --text: #F0F2F8;
      --text2: #8B92A8;
      --text3: #555E78;
      --green: #22C55E;
      --amber: #F59E0B;
      --blue: #3B82F6;
      --purple: #A855F7;
      --gold: #FBBF24;
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.4);
      --shadow-md: 0 8px 20px -6px rgba(0,0,0,0.5);
    }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      padding: 20px;
      color: var(--text);
    }

    /* Main grid – two columns */
    .premium-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Shared card style */
    .premium-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: border-color 0.2s;
    }

    .premium-card:hover {
      border-color: var(--border2);
    }

    .card-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface2);
    }

    .card-header i {
      color: var(--red);
      margin-right: 8px;
    }

    .card-body {
      padding: 24px;
    }

    /* Event info – elegant */
    .event-hero {
      margin-bottom: 28px;
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--surface2) 0%, var(--surface) 100%);
      border-radius: 20px;
      border-left: 4px solid var(--red);
    }

    .event-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .event-meta {
      font-size: 0.8rem;
      color: var(--text2);
      margin-top: 6px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Ticket grid – modern, clean */
    .ticket-grid-premium {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
    }

    .ticket-option {
      background: var(--surface2);
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      cursor: pointer;
      overflow: hidden;
    }

    .ticket-option:hover {
      transform: translateY(-2px);
      border-color: var(--red-border);
      box-shadow: 0 8px 20px rgba(227,6,19,0.15);
    }

    .ticket-option.selected {
      border: 2px solid var(--red);
      background: linear-gradient(135deg, var(--surface2), rgba(227,6,19,0.05));
    }

    .ticket-option-content {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .ticket-info {
      flex: 2;
    }

    .ticket-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .ticket-desc {
      font-size: 0.7rem;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ticket-price-block {
      text-align: right;
      min-width: 100px;
    }

    .ticket-price {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--red);
    }

    .ticket-availability {
      font-size: 0.7rem;
      color: var(--text3);
      margin-top: 4px;
    }

    .availability-bar {
      width: 100%;
      height: 3px;
      background: var(--surface3);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .availability-fill {
      height: 100%;
      background: var(--red);
      border-radius: 3px;
      transition: width 0.3s;
    }

    .select-btn {
      background: var(--surface3);
      border: 1px solid var(--border2);
      color: var(--text2);
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .select-btn:hover {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .ticket-option.selected .select-btn {
      background: var(--red);
      color: white;
      border-color: var(--red);
    }

    /* Quantity panel (elegant) */
    .quantity-panel {
      margin-top: 24px;
      background: var(--surface2);
      border-radius: 20px;
      padding: 16px 20px;
      text-align: center;
    }

    .quantity-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text3);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .qty-btn {
      width: 40px;
      height: 40px;
      background: var(--surface3);
      border: 1px solid var(--border2);
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--red);
      cursor: pointer;
      transition: all 0.15s;
    }

    .qty-btn:active { transform: scale(0.94); }
    .qty-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .qty-display {
      font-size: 1.8rem;
      font-weight: 800;
      min-width: 60px;
      text-align: center;
      color: var(--text);
    }

    /* Right panel – order summary */
    .order-summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      padding: 16px 0 8px;
      border-top: 2px solid var(--red);
      font-weight: 800;
      font-size: 1rem;
      color: var(--red);
    }

    /* Payment methods – refined */
    .payment-option {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .payment-option:hover {
      border-color: var(--red-border);
      background: rgba(227,6,19,0.03);
    }

    .payment-option.selected {
      border: 2px solid var(--red);
      background: linear-gradient(135deg, var(--surface2), rgba(227,6,19,0.06));
    }

    .payment-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .payment-icon {
      width: 44px;
      height: 44px;
      background: var(--surface3);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .payment-icon i { font-size: 1.2rem; color: var(--red); }
    .payment-title { font-weight: 700; color: var(--text); }
    .payment-desc { font-size: 0.65rem; color: var(--text3); }

    .phone-input-group {
      margin: 16px 0 12px;
      display: none;
    }
    .phone-input-group.visible { display: block; }
    .phone-input-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 60px;
      color: var(--text);
      font-size: 0.9rem;
    }
    .phone-input-group input:focus { border-color: var(--red); outline: none; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--red), #a0010e);
      border: none;
      border-radius: 60px;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: var(--surface3);
      color: var(--text3);
    }

    .status-panel {
      margin-top: 16px;
      padding: 14px;
      border-radius: 16px;
      text-align: center;
      display: none;
    }
    .status-panel.success { display: block; background: rgba(34,197,94,0.1); border: 1px solid var(--green); color: var(--green); }
    .status-panel.error { display: block; background: rgba(227,6,19,0.1); border: 1px solid var(--red); color: var(--red); }
    .status-panel.pending { display: block; background: rgba(245,158,11,0.1); border: 1px solid var(--amber); color: var(--amber); }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border-left: 3px solid var(--red);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 60px;
      z-index: 10001;
      transform: translateX(400px);
      transition: transform 0.25s;
      font-size: 0.8rem;
    }
    .toast.show { transform: translateX(0); }

    /* Wristband print & preview (same as before but dark themed) */
    @media print {
      body * { visibility: hidden; }
      .wristband-print, .wristband-print * { visibility: visible; }
      .wristband-print { position: fixed; top: 0; left: 0; width: 100%; }
    }
    .wristband-print { display: none; }
    .wristband-preview-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .wristband-preview-modal.show { display: flex; }
    .wristband-preview-content {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 28px;
      padding: 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .preview-scroll-area {
      max-height: 60vh;
      overflow-y: auto;
      margin: 16px 0;
    }
    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 16px;
    }
    .action-bar button {
      flex: 1;
      padding: 10px 12px;
      border-radius: 60px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn-print { background: var(--red); color: white; }
    .btn-new-sale { background: var(--green); color: white; }
    .btn-back-events { background: var(--purple); color: white; }
    .btn-close { background: var(--surface2); color: var(--text2); }

    .timer-display {
      font-family: monospace;
      font-size: 1.6rem;
      font-weight: 800;
      margin: 12px 0;
    }
    .loading-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .premium-grid { grid-template-columns: 1fr; }
      body { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="premium-grid">
  <!-- LEFT PANEL: Event + Tickets + Quantity -->
  <div class="premium-card">
    <div class="card-header">
      <span><i class="fas fa-ticket-alt"></i> SELECT TICKETS</span>
      <button id="syncBtn" style="background: transparent; border: 1px solid var(--border); padding: 5px 12px; border-radius: 40px; color: var(--text2); cursor: pointer; font-size: 0.7rem;"><i class="fas fa-sync-alt"></i> Sync</button>
    </div>
    <div class="card-body">
      <div id="eventInfo" class="event-hero"></div>
      <div id="ticketGrid" class="ticket-grid-premium"></div>
      <div class="quantity-panel" id="quantityPanel" style="display: none;">
        <div class="quantity-label"><i class="fas fa-tag"></i> QUANTITY</div>
        <div class="quantity-controls">
          <button class="qty-btn" id="decQty">−</button>
          <span class="qty-display" id="qtyDisplay">1</span>
          <button class="qty-btn" id="incQty">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL: Order summary + Payment -->
  <div>
    <div class="order-summary-card">
      <div class="card-header"><span><i class="fas fa-receipt"></i> ORDER SUMMARY</span></div>
      <div class="card-body">
        <div class="summary-item"><span>Ticket type:</span><span id="summaryType">—</span></div>
        <div class="summary-item"><span>Price each:</span><span id="summaryPrice">R0</span></div>
        <div class="summary-item"><span>Quantity:</span><span id="summaryQty">1</span></div>
        <div class="summary-total"><span>Total:</span><span id="summaryTotal">R0</span></div>
      </div>
    </div>

    <div class="premium-card">
      <div class="card-header"><span><i class="fas fa-credit-card"></i> PAYMENT METHOD</span></div>
      <div class="card-body">
        <div class="payment-option" id="cashOption">
          <div class="payment-header">
            <div class="payment-icon"><i class="fas fa-money-bill-wave"></i></div>
            <div><div class="payment-title">Cash Payment</div><div class="payment-desc">Pay at box office counter</div></div>
            <div style="margin-left: auto;"><div style="width: 20px;height:20px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;"><div id="cashSelectedIndicator" style="width:12px;height:12px;background:var(--red);border-radius:50%;display:none;"></div></div></div>
          </div>
        </div>
        <div class="payment-option" id="cardOption">
          <div class="payment-header">
            <div class="payment-icon"><i class="fas fa-credit-card"></i></div>
            <div><div class="payment-title">Card Payment</div><div class="payment-desc">Visa, Mastercard, Apple Pay</div></div>
            <div style="margin-left: auto;"><div style="width: 20px;height:20px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;"><div id="cardSelectedIndicator" style="width:12px;height:12px;background:var(--red);border-radius:50%;display:none;"></div></div></div>
          </div>
        </div>
        <div class="payment-option" id="walletOption">
          <div class="payment-header">
            <div class="payment-icon"><i class="fas fa-wallet"></i></div>
            <div><div class="payment-title">Rands Wallet</div><div class="payment-desc">Request approval from customer wallet</div></div>
            <div style="margin-left: auto;"><div style="width: 20px;height:20px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;"><div id="walletSelectedIndicator" style="width:12px;height:12px;background:var(--red);border-radius:50%;display:none;"></div></div></div>
          </div>
        </div>

        <div class="phone-input-group" id="phoneInputGroup">
          <label style="font-size:0.7rem; color:var(--text3);">Customer phone number</label>
          <input type="tel" id="customerPhone" placeholder="0712345678">
        </div>

        <button class="btn-primary" id="requestPaymentBtn" disabled><i class="fas fa-credit-card"></i> Select payment method</button>
        <div id="requestStatus" class="status-panel"></div>
      </div>
    </div>
  </div>
</div>

<div id="toastMsg" class="toast"></div>
<div id="wristbandPreviewModal" class="wristband-preview-modal">
  <div class="wristband-preview-content">
    <i class="fas fa-ticket-alt" style="font-size: 48px; color: var(--red);"></i>
    <h3 style="margin: 12px 0;">Wristband ready</h3>
    <div class="preview-scroll-area" id="previewWristbandScroll"></div>
    <div class="action-bar">
      <button class="btn-print" id="printWristbandBtn"><i class="fas fa-print"></i> Print</button>
      <button class="btn-new-sale" id="newSaleBtn"><i class="fas fa-plus-circle"></i> New Sale</button>
      <button class="btn-back-events" id="backEventsBtn"><i class="fas fa-calendar-alt"></i> Back to Events</button>
      <button class="btn-close" id="closePreviewBtn">Close</button>
    </div>
    <div id="autoResetMsg" style="font-size: 0.7rem; margin-top: 8px; color: var(--green);"></div>
  </div>
</div>
<div id="wristbandPrintContainer" class="wristband-print"></div>

<script type="module">
  import { supabase } from '../config/supabase.js';

  let events = [];
  let selectedEvent = null;
  let selectedTicketType = null;
  let ticketQuantity = 1;
  let currentRequestId = null;
  let requestSubscription = null;
  let selectedPaymentMethod = null;
  let countdownInterval = null;

  const eventInfoDiv = document.getElementById('eventInfo');
  const ticketGrid = document.getElementById('ticketGrid');
  const decQty = document.getElementById('decQty');
  const incQty = document.getElementById('incQty');
  const qtyDisplay = document.getElementById('qtyDisplay');
  const summaryType = document.getElementById('summaryType');
  const summaryPrice = document.getElementById('summaryPrice');
  const summaryQty = document.getElementById('summaryQty');
  const summaryTotal = document.getElementById('summaryTotal');
  const quantityPanel = document.getElementById('quantityPanel');
  const customerPhoneInput = document.getElementById('customerPhone');
  const requestPaymentBtn = document.getElementById('requestPaymentBtn');
  const requestStatusDiv = document.getElementById('requestStatus');
  const syncBtn = document.getElementById('syncBtn');
  const phoneInputGroup = document.getElementById('phoneInputGroup');

  function showToast(msg, type = 'info') {
    const toast = document.getElementById('toastMsg');
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${msg}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function validatePhone(phone) { return /^[0-9]{10}$/.test(phone); }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

  function getTicketTypeClass(name) {
    const n = name.toLowerCase();
    if (n.includes('vvip')) return 'vvip';
    if (n.includes('vip')) return 'vip';
    if (n.includes('staff')) return 'staff';
    if (n.includes('artist')) return 'artist';
    if (n.includes('backstage')) return 'backstage';
    return 'general';
  }

  function getTicketBadgeClass(name) {
    const n = name.toLowerCase();
    if (n.includes('vvip')) return 'badge-vvip';
    if (n.includes('vip')) return 'badge-vip';
    if (n.includes('staff')) return 'badge-staff';
    if (n.includes('artist')) return 'badge-artist';
    if (n.includes('backstage')) return 'badge-backstage';
    return 'badge-general';
  }

  async function generateWristbandHTML(ticket, event, ticketType, customerName = '') {
    const typeClass = getTicketTypeClass(ticketType.name);
    const badgeClass = getTicketBadgeClass(ticketType.name);
    const displayName = customerName || 'Guest';
    const eventDate = event.start_time ? new Date(event.start_time).toLocaleDateString('en-ZA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : 'Date TBA';
    return `<div class="wristband wristband-${typeClass}" style="width:2in;height:8in;font-family:'Inter';background:linear-gradient(135deg,#141720,#1C2030);border-left:4px solid var(--red);color:white;margin-bottom:12px;"><div style="padding:12px;"><div style="text-align:center;border-bottom:1px solid rgba(255,255,255,0.2);padding-bottom:8px;"><div style="font-weight:800;font-size:16px;">${escapeHtml(event.name)}</div><div style="font-size:8px;">${eventDate}</div></div><div style="text-align:center;margin:12px 0;"><span style="background:var(--red);padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;">${escapeHtml(ticketType.name.toUpperCase())}</span></div><div style="text-align:center;" class="qr-${ticket.id}"></div><div style="text-align:center;font-size:9px;margin:6px 0;">#${ticket.id.slice(0,8).toUpperCase()}</div><div style="text-align:center;margin-top:8px;"><div style="font-size:7px;opacity:0.6;">GUEST</div><div style="font-weight:700;">${escapeHtml(displayName)}</div></div><div style="text-align:center;margin-top:8px;font-size:6px;border-top:1px solid rgba(255,255,255,0.2);padding-top:6px;">SCAN FOR ENTRY</div></div></div>`;
  }

  async function showWristbandPreview(ticketsList, event, ticketType, customerName = '') {
    const previewScroll = document.getElementById('previewWristbandScroll');
    previewScroll.innerHTML = '';
    for (const ticket of ticketsList) {
      const html = await generateWristbandHTML(ticket, event, ticketType, customerName);
      const div = document.createElement('div');
      div.innerHTML = html;
      previewScroll.appendChild(div.firstElementChild);
      setTimeout(() => {
        const qrDiv = document.querySelector(`.qr-${ticket.id}`);
        if (qrDiv && window.QRCode) {
          new QRCode(qrDiv, { text: JSON.stringify({ ticket_id: ticket.id, event_id: event.id }), width: 110, height: 110 });
        }
      }, 100);
    }
    document.getElementById('wristbandPreviewModal').classList.add('show');
    window.lastPrintedTickets = ticketsList;
    window.lastEvent = event;
    window.lastTicketType = ticketType;
  }

  async function printWristbandHandler() {
    if (window.lastPrintedTickets && window.lastEvent && window.lastTicketType) {
      const container = document.getElementById('wristbandPrintContainer');
      container.innerHTML = '';
      for (const ticket of window.lastPrintedTickets) {
        const html = await generateWristbandHTML(ticket, window.lastEvent, window.lastTicketType, 'Guest');
        container.innerHTML += html;
      }
      setTimeout(() => {
        window.print();
        showToast('Wristband sent to printer', 'success');
        setTimeout(() => resetToNewSale(), 5000);
      }, 200);
    } else showToast('No wristband to print', 'error');
  }

  function resetToNewSale() {
    document.getElementById('wristbandPreviewModal').classList.remove('show');
    selectedTicketType = null;
    ticketQuantity = 1;
    qtyDisplay.textContent = '1';
    selectedPaymentMethod = null;
    document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('selected'));
    document.getElementById('cashSelectedIndicator').style.display = 'none';
    document.getElementById('cardSelectedIndicator').style.display = 'none';
    document.getElementById('walletSelectedIndicator').style.display = 'none';
    phoneInputGroup.classList.remove('visible');
    customerPhoneInput.value = '';
    if (countdownInterval) clearInterval(countdownInterval);
    if (requestSubscription) requestSubscription.unsubscribe();
    currentRequestId = null;
    requestStatusDiv.style.display = 'none';
    renderTickets();
    updateSummary();
    updateCheckoutButtonState();
    showToast('Ready for next customer', 'success');
  }

  async function loadEvents() {
    try {
      const { data: eventsData, error } = await supabase.from('events').select('*').eq('is_active', true).eq('status', 'active').order('start_time', { ascending: true });
      if (error) throw error;
      const now = new Date();
      const upcomingEvents = (eventsData || []).filter(ev => {
        if (!ev.start_time) return true;
        return new Date(ev.start_time) >= new Date(now.getFullYear(), now.getMonth(), now.getDate());
      });
      for (let ev of upcomingEvents) {
        const { data: types } = await supabase.from('ticket_types').select('*').eq('event_id', ev.id);
        ev.ticketTypes = types || [];
      }
      const validEvents = upcomingEvents.filter(ev => ev.ticketTypes.length > 0);
      if (validEvents.length === 0) {
        eventInfoDiv.innerHTML = '<div class="event-name">No upcoming events</div><div class="event-meta">Check back later</div>';
        ticketGrid.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3);">No tickets available</div>';
        selectedEvent = null;
        updateCheckoutButtonState();
        return;
      }
      events = validEvents;
      selectedEvent = validEvents[0];
      renderEvent();
      renderTickets();
    } catch (err) { showToast(err.message, 'error'); }
  }

  function renderEvent() {
    if (!selectedEvent) return;
    const start = selectedEvent.start_time ? new Date(selectedEvent.start_time) : null;
    const dateStr = start ? start.toLocaleDateString('en-ZA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : 'TBD';
    eventInfoDiv.innerHTML = `<div class="event-name">${escapeHtml(selectedEvent.name)}</div><div class="event-meta"><i class="fas fa-calendar-alt"></i> ${dateStr} &nbsp; <i class="fas fa-map-marker-alt"></i> ${escapeHtml(selectedEvent.location || 'Rands Cape Town')}</div>`;
  }

  function renderTickets() {
    if (!selectedEvent?.ticketTypes?.length) {
      ticketGrid.innerHTML = '<div style="padding:40px;text-align:center;">No ticket types</div>';
      return;
    }
    ticketGrid.innerHTML = selectedEvent.ticketTypes.map(tt => {
      const available = (tt.capacity || 0) - (tt.sold || 0);
      const percent = tt.capacity ? Math.round(((tt.capacity - available) / tt.capacity) * 100) : 0;
      return `
        <div class="ticket-option" data-id="${tt.id}" data-name="${escapeHtml(tt.name)}" data-price="${tt.price}" data-available="${available}" data-capacity="${tt.capacity}">
          <div class="ticket-option-content">
            <div class="ticket-info">
              <div class="ticket-name">${escapeHtml(tt.name)}</div>
              <div class="ticket-desc">Access to event</div>
              <div class="availability-bar"><div class="availability-fill" style="width: ${percent}%;"></div></div>
              <div class="ticket-availability">${available} left</div>
            </div>
            <div class="ticket-price-block">
              <div class="ticket-price">R${Number(tt.price).toLocaleString()}</div>
              <button class="select-btn" data-select="${tt.id}">Select</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
    document.querySelectorAll('.select-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const card = btn.closest('.ticket-option');
        const id = card.dataset.id;
        const name = card.dataset.name;
        const price = parseInt(card.dataset.price);
        const available = parseInt(card.dataset.available);
        document.querySelectorAll('.ticket-option').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedTicketType = { id, name, price, available };
        updateSummary();
        updateQuantityLimit();
        quantityPanel.style.display = 'block';
        updateCheckoutButtonState();
      });
    });
    // auto-select first available
    const firstAvail = document.querySelector('.ticket-option');
    if (firstAvail) firstAvail.querySelector('.select-btn').click();
  }

  function updateQuantityLimit() {
    if (!selectedTicketType) { incQty.disabled = true; decQty.disabled = true; return; }
    incQty.disabled = ticketQuantity >= Math.min(selectedTicketType.available, 10);
    decQty.disabled = ticketQuantity <= 1;
  }

  function updateSummary() {
    if (!selectedTicketType) {
      summaryType.textContent = '—';
      summaryPrice.textContent = 'R0';
      summaryTotal.textContent = 'R0';
      return;
    }
    const total = selectedTicketType.price * ticketQuantity;
    summaryType.textContent = selectedTicketType.name;
    summaryPrice.textContent = `R${selectedTicketType.price.toLocaleString()}`;
    summaryQty.textContent = ticketQuantity;
    summaryTotal.textContent = `R${total.toLocaleString()}`;
  }

  function updateCheckoutButtonState() {
    const hasTicket = selectedTicketType && ticketQuantity > 0 && ticketQuantity <= selectedTicketType.available;
    const hasPayment = selectedPaymentMethod !== null;
    requestPaymentBtn.disabled = !(hasTicket && hasPayment);
    if (!selectedTicketType) requestPaymentBtn.innerHTML = '<i class="fas fa-ticket-alt"></i> Select a ticket first';
    else if (!hasPayment) requestPaymentBtn.innerHTML = '<i class="fas fa-credit-card"></i> Choose payment method';
    else if (ticketQuantity > selectedTicketType.available) requestPaymentBtn.innerHTML = `<i class="fas fa-ban"></i> Only ${selectedTicketType.available} left`;
    else {
      if (selectedPaymentMethod === 'cash') requestPaymentBtn.innerHTML = '<i class="fas fa-money-bill-wave"></i> Process Cash Payment';
      else if (selectedPaymentMethod === 'card') requestPaymentBtn.innerHTML = '<i class="fas fa-credit-card"></i> Pay with Card';
      else requestPaymentBtn.innerHTML = '<i class="fas fa-wallet"></i> Request Wallet Payment';
    }
  }

  async function issueTickets(customerPhone, customerId, customerName = '') {
    const ticketsToInsert = [];
    for (let i = 0; i < ticketQuantity; i++) {
      ticketsToInsert.push({
        event_id: selectedEvent.id,
        ticket_type_id: selectedTicketType.id,
        customer_phone: customerPhone,
        status: 'issued',
        issued_at: new Date().toISOString(),
        checked_in: true,
        checked_in_at: new Date().toISOString(),
        ticket_type: selectedTicketType.name.toLowerCase().includes('vip') ? 'vip' : 'general',
        qr_token: crypto.randomUUID()
      });
    }
    const { data: tickets, error } = await supabase.from('tickets').insert(ticketsToInsert).select();
    if (error) throw error;
    for (const ticket of tickets) {
      await supabase.from('checkins').insert({ ticket_id: ticket.id, event_id: selectedEvent.id, scanned_at: new Date().toISOString(), status: 'valid', gate: 'box_office' });
    }
    const { data: tt } = await supabase.from('ticket_types').select('sold').eq('id', selectedTicketType.id).single();
    if (tt) await supabase.from('ticket_types').update({ sold: (tt.sold || 0) + ticketQuantity }).eq('id', selectedTicketType.id);
    return tickets;
  }

  async function processCashPayment() {
    requestPaymentBtn.disabled = true;
    requestPaymentBtn.innerHTML = '<span class="loading-spinner"></span> Processing...';
    try {
      const tickets = await issueTickets('cash_customer', null, 'Cash Customer');
      await supabase.from('payment_requests').insert({ customer_phone: 'cash_customer', event_id: selectedEvent.id, ticket_type_id: selectedTicketType.id, quantity: ticketQuantity, total_amount: selectedTicketType.price * ticketQuantity, channel: 'boxoffice', status: 'completed', payment_method: 'cash' });
      await showWristbandPreview(tickets, selectedEvent, selectedTicketType, 'Cash Customer');
      await loadEvents();
    } catch (err) { showToast(err.message, 'error'); }
    finally { requestPaymentBtn.disabled = false; updateCheckoutButtonState(); }
  }

  async function processCardPayment() {
    requestPaymentBtn.disabled = true;
    requestPaymentBtn.innerHTML = '<span class="loading-spinner"></span> Initializing...';
    try {
      const totalAmount = selectedTicketType.price * ticketQuantity;
      const amountCents = Math.round(totalAmount * 100);
      const transactionId = `BO_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
      const pending = { event_id: selectedEvent.id, ticket_type_id: selectedTicketType.id, quantity: ticketQuantity, total_amount: totalAmount, ticket_name: selectedTicketType.name, event_name: selectedEvent.name, transaction_id: transactionId };
      sessionStorage.setItem('pendingBoxOfficePayment', JSON.stringify(pending));
      const resp = await fetch('https://odpugxrihfspaucsdqjj.supabase.co/functions/v1/yoco-create-checkout', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount_cents: amountCents, transaction_id: transactionId, currency: 'ZAR', metadata: { box_office: true } })
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Payment failed');
      window.location.href = data.checkout_url;
    } catch (err) { showToast(err.message, 'error'); requestPaymentBtn.disabled = false; updateCheckoutButtonState(); }
  }

  async function processWalletPayment() {
    const phone = customerPhoneInput.value.trim();
    if (!phone || !validatePhone(phone)) { showToast('Valid 10-digit phone required', 'error'); return; }
    requestPaymentBtn.disabled = true;
    try {
      const { data: profile } = await supabase.from('profiles').select('id').eq('phone', phone).maybeSingle();
      const customerId = profile?.id;
      const totalAmount = selectedTicketType.price * ticketQuantity;
      const { data, error } = await supabase.from('payment_requests').insert({ customer_phone: phone, customer_profile_id: customerId, event_id: selectedEvent.id, ticket_type_id: selectedTicketType.id, quantity: ticketQuantity, total_amount: totalAmount, channel: 'boxoffice', status: 'pending', requested_at: new Date().toISOString(), expires_at: new Date(Date.now() + 2 * 60000).toISOString(), metadata: { payment_method: 'wallet' } }).select().single();
      if (error) throw error;
      currentRequestId = data.id;
      requestStatusDiv.className = 'status-panel pending';
      requestStatusDiv.style.display = 'block';
      requestStatusDiv.innerHTML = `<i class="fas fa-hourglass-half"></i> Waiting for customer approval...<div class="timer-display" id="requestTimer">02:00</div>`;
      let seconds = 120;
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        seconds--;
        const timerEl = document.getElementById('requestTimer');
        if (timerEl) timerEl.innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`;
        if (seconds <= 0) { clearInterval(countdownInterval); resetRequestFlow(); showToast('Request expired', 'error'); }
      }, 1000);
      if (requestSubscription) requestSubscription.unsubscribe();
      requestSubscription = supabase.channel(`payment-${currentRequestId}`).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'payment_requests', filter: `id=eq.${currentRequestId}` }, async (payload) => {
        if (payload.new.status === 'approved') {
          clearInterval(countdownInterval);
          const tickets = await issueTickets(phone, customerId, 'Wallet Customer');
          await supabase.from('payment_requests').update({ status: 'completed' }).eq('id', currentRequestId);
          await showWristbandPreview(tickets, selectedEvent, selectedTicketType, 'Wallet Customer');
          resetRequestFlow();
        } else if (payload.new.status === 'rejected') {
          clearInterval(countdownInterval);
          showToast('Customer rejected payment', 'error');
          resetRequestFlow();
        }
      }).subscribe();
    } catch (err) { showToast(err.message, 'error'); requestPaymentBtn.disabled = false; updateCheckoutButtonState(); }
  }
  function resetRequestFlow() { if (countdownInterval) clearInterval(countdownInterval); if (requestSubscription) requestSubscription.unsubscribe(); currentRequestId = null; requestStatusDiv.style.display = 'none'; updateCheckoutButtonState(); }

  decQty.addEventListener('click', () => { if (ticketQuantity > 1) { ticketQuantity--; qtyDisplay.textContent = ticketQuantity; updateSummary(); updateQuantityLimit(); updateCheckoutButtonState(); } });
  incQty.addEventListener('click', () => { if (selectedTicketType && ticketQuantity < selectedTicketType.available && ticketQuantity < 10) { ticketQuantity++; qtyDisplay.textContent = ticketQuantity; updateSummary(); updateQuantityLimit(); updateCheckoutButtonState(); } });

  function initPaymentHandlers() {
    document.getElementById('cashOption').addEventListener('click', () => {
      selectedPaymentMethod = 'cash';
      document.getElementById('cashSelectedIndicator').style.display = 'block';
      document.getElementById('cardSelectedIndicator').style.display = 'none';
      document.getElementById('walletSelectedIndicator').style.display = 'none';
      document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('selected'));
      document.getElementById('cashOption').classList.add('selected');
      phoneInputGroup.classList.remove('visible');
      updateCheckoutButtonState();
    });
    document.getElementById('cardOption').addEventListener('click', () => {
      selectedPaymentMethod = 'card';
      document.getElementById('cardSelectedIndicator').style.display = 'block';
      document.getElementById('cashSelectedIndicator').style.display = 'none';
      document.getElementById('walletSelectedIndicator').style.display = 'none';
      document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('selected'));
      document.getElementById('cardOption').classList.add('selected');
      phoneInputGroup.classList.remove('visible');
      updateCheckoutButtonState();
    });
    document.getElementById('walletOption').addEventListener('click', () => {
      selectedPaymentMethod = 'wallet';
      document.getElementById('walletSelectedIndicator').style.display = 'block';
      document.getElementById('cashSelectedIndicator').style.display = 'none';
      document.getElementById('cardSelectedIndicator').style.display = 'none';
      document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('selected'));
      document.getElementById('walletOption').classList.add('selected');
      phoneInputGroup.classList.add('visible');
      updateCheckoutButtonState();
    });
  }
  initPaymentHandlers();
  requestPaymentBtn.addEventListener('click', async () => {
    if (!selectedPaymentMethod) showToast('Select payment method', 'error');
    else if (selectedPaymentMethod === 'cash') await processCashPayment();
    else if (selectedPaymentMethod === 'card') await processCardPayment();
    else if (selectedPaymentMethod === 'wallet') await processWalletPayment();
  });

  document.getElementById('closePreviewBtn').addEventListener('click', () => document.getElementById('wristbandPreviewModal').classList.remove('show'));
  document.getElementById('printWristbandBtn').addEventListener('click', printWristbandHandler);
  document.getElementById('newSaleBtn').addEventListener('click', resetToNewSale);
  document.getElementById('backEventsBtn').addEventListener('click', () => { resetToNewSale(); loadEvents(); });
  syncBtn.addEventListener('click', () => { loadEvents(); showToast('Events refreshed', 'success'); });
  customerPhoneInput.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0,10); });

  loadEvents();

  // Handle card payment return
  const urlParams = new URLSearchParams(window.location.search);
  const paymentStatus = urlParams.get('payment');
  const transactionId = urlParams.get('transaction_id');
  if (paymentStatus === 'success' && transactionId) {
    const pending = sessionStorage.getItem('pendingBoxOfficePayment');
    if (pending) {
      sessionStorage.removeItem('pendingBoxOfficePayment');
      const payment = JSON.parse(pending);
      showToast('Card payment successful! Issuing tickets...', 'success');
      setTimeout(async () => {
        const ev = events.find(e => e.id === payment.event_id);
        if (ev) {
          selectedEvent = ev;
          selectedTicketType = { id: payment.ticket_type_id, price: payment.total_amount / payment.quantity, name: payment.ticket_name || 'Ticket', available: 999 };
          ticketQuantity = payment.quantity;
          const tickets = await issueTickets('card_customer', null, 'Card Customer');
          await showWristbandPreview(tickets, selectedEvent, selectedTicketType, 'Card Customer');
          await loadEvents();
        } else showToast('Event not found', 'error');
      }, 500);
    }
    window.history.replaceState({}, '', window.location.pathname);
  } else if (paymentStatus === 'cancel') showToast('Payment cancelled', 'info');
  else if (paymentStatus === 'failed') showToast('Payment failed', 'error');
</script>
