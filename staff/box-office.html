<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Box Office · Payment Request</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red: #E30613;
      --red-dark: #a0010e;
      --red-glow: rgba(227,6,19,0.18);
      --ink: #1e293b;
      --slate: #475569;
      --mist: #94a3b8;
      --bone: #f8fafd;
      --white: #ffffff;
      --border-strong: #eef2f8;
      --radius-lg: 28px;
      --radius-full: 9999px;
      --green: #10b981;
      --yellow: #f59e0b;
      --orange: #f97316;
      --purple: #8b5cf6;
      --gold: #fbbf24;
    }

    body {
      background: var(--bone);
      font-family: 'Inter', sans-serif;
      padding: 24px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-strong);
      overflow: hidden;
      box-shadow: 0 8px 20px -6px rgba(0,0,0,0.12);
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 2px solid var(--border-strong);
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, var(--white), var(--bone));
    }

    .card-header i { color: var(--red); margin-right: 8px; }

    .card-body { padding: 24px; }

    .event-info-block {
      margin-bottom: 24px;
      padding: 16px;
      background: var(--bone);
      border-radius: 20px;
    }

    .event-info-block .event-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--red);
    }

    .event-info-block .event-meta {
      color: var(--slate);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .ticket-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }

    .ticket-card {
      background: var(--white);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ticket-card:hover:not(.disabled) {
      transform: translateY(-2px);
      border-color: var(--red);
      box-shadow: 0 4px 12px var(--red-glow);
    }

    .ticket-card.selected {
      border: 2px solid var(--red);
      background: rgba(227,6,19,0.06);
    }

    .ticket-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ticket-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--red);
    }

    .quantity-section {
      background: var(--bone);
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      margin-top: 20px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
    }

    .quantity-btn {
      width: 44px;
      height: 44px;
      background: white;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-full);
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      color: var(--red);
    }

    .quantity-btn:active { transform: scale(0.95); }
    .quantity-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .quantity-display {
      font-size: 28px;
      font-weight: 800;
      min-width: 60px;
      text-align: center;
    }

    .order-summary {
      background: var(--bone);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed var(--border-strong);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      padding: 16px 0 8px;
      border-top: 2px solid var(--red);
      font-weight: 800;
      color: var(--red);
    }

    .payment-methods-section { margin-bottom: 24px; }

    .payment-option {
      border: 1.5px solid var(--border-strong);
      border-radius: 20px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
      background: var(--white);
    }

    .payment-option:hover {
      border-color: var(--red);
      background: rgba(227,6,19,0.03);
    }

    .payment-option.selected {
      border-color: var(--red);
      background: rgba(227,6,19,0.05);
    }

    .payment-option-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .payment-icon {
      width: 48px;
      height: 48px;
      background: rgba(227,6,19,0.08);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .payment-icon i {
      font-size: 1.3rem;
      color: var(--red);
    }

    .payment-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--ink);
    }

    .payment-desc {
      font-size: 0.7rem;
      color: var(--mist);
    }

    .phone-input-group {
      margin-bottom: 20px;
      display: none;
    }

    .phone-input-group.visible { display: block; }

    .phone-input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 60px;
      border: 1px solid var(--border-strong);
      font-size: 1rem;
    }

    .btn-primary {
      background: var(--red);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: var(--mist);
    }

    .status-panel {
      margin-top: 20px;
      padding: 16px;
      border-radius: 20px;
      background: var(--bone);
      text-align: center;
      display: none;
    }

    .status-panel.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--green);
      color: var(--green);
    }

    .status-panel.error {
      display: block;
      background: rgba(227, 6, 19, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
    }

    .status-panel.pending {
      display: block;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--yellow);
      color: var(--orange);
    }

    .timer-display {
      font-family: monospace;
      font-size: 2rem;
      font-weight: 800;
      margin: 12px 0;
      color: var(--orange);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      z-index: 10001;
      transform: translateX(400px);
      transition: transform 0.25s;
    }

    .toast.show { transform: translateX(0); }

    /* WRISTBAND PRINT STYLES */
    @media print {
      body * { visibility: hidden; }
      .wristband-print, .wristband-print * { visibility: visible; }
      .wristband-print {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      @page {
        size: 2in 8in;
        margin: 0;
      }
    }

    .wristband-print { display: none; }

    .wristband {
      width: 2in;
      height: 8in;
      font-family: 'Inter', sans-serif;
      position: relative;
      page-break-after: avoid;
      break-inside: avoid;
    }

    .wristband-general { background: linear-gradient(135deg, #ffffff, #f5f5f5); border-left: 4px solid #6b7280; }
    .wristband-vip { background: linear-gradient(135deg, #fef3c7, #fde68a); border-left: 4px solid var(--gold); }
    .wristband-vvip { background: linear-gradient(135deg, #fce7f3, #fbcfe8); border-left: 4px solid #ec4899; }
    .wristband-staff { background: linear-gradient(135deg, #e0e7ff, #c7d2fe); border-left: 4px solid #4f46e5; }
    .wristband-artist { background: linear-gradient(135deg, #dbeafe, #bfdbfe); border-left: 4px solid #3b82f6; }
    .wristband-backstage { background: linear-gradient(135deg, #f3e8ff, #e9d5ff); border-left: 4px solid var(--purple); }

    .wristband-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 16px 12px;
    }

    .wristband-event {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(0,0,0,0.1);
      margin-bottom: 12px;
    }

    .wristband-event-name {
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .wristband-event-date {
      font-size: 9px;
      font-weight: 500;
      color: rgba(0,0,0,0.6);
    }

    .wristband-type { text-align: center; margin-bottom: 16px; }
    .wristband-type-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .badge-general { background: #6b7280; color: white; }
    .badge-vip { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1e293b; }
    .badge-vvip { background: linear-gradient(135deg, #ec4899, #db2777); color: white; }
    .badge-staff { background: linear-gradient(135deg, #4f46e5, #4338ca); color: white; }
    .badge-artist { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
    .badge-backstage { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; }

    .wristband-barcode-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
    }
    .wristband-qr { margin: 8px 0; }
    .wristband-qr canvas, .wristband-qr img { width: 140px !important; height: 140px !important; max-width: 140px; max-height: 140px; }
    .wristband-ticket-number { text-align: center; font-size: 10px; font-family: monospace; letter-spacing: 1px; margin-top: 8px; padding: 4px 8px; background: rgba(0,0,0,0.05); border-radius: 4px; }
    .wristband-guest { text-align: center; padding: 12px; margin-top: 8px; border-top: 1px dashed rgba(0,0,0,0.15); }
    .wristband-guest-label { font-size: 7px; text-transform: uppercase; letter-spacing: 1px; color: rgba(0,0,0,0.5); margin-bottom: 4px; }
    .wristband-guest-name { font-size: 12px; font-weight: 700; }
    .wristband-footer { text-align: center; padding-top: 8px; font-size: 6px; color: rgba(0,0,0,0.4); border-top: 1px solid rgba(0,0,0,0.1); margin-top: 8px; }

    .wristband-preview-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }
    .wristband-preview-modal.show {
      display: flex;
    }
    .wristband-preview-content {
      background: white;
      border-radius: 28px;
      padding: 20px;
      max-width: 340px;
      width: 100%;
      margin: auto;
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 35px rgba(0,0,0,0.3);
    }
    .preview-scroll-area {
      max-height: 60vh;
      overflow-y: auto;
      margin: 16px 0;
      padding: 4px;
    }
    .preview-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .preview-actions button {
      flex: 1;
      padding: 12px 16px;
      border-radius: 60px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .btn-print { background: var(--red); color: white; }
    .btn-new-sale { background: var(--green); color: white; }
    .btn-back-events { background: var(--purple); color: white; }
    .btn-close { background: var(--bone); color: var(--slate); }

    .action-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
      justify-content: center;
    }
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(227,6,19,0.3);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      body { padding: 16px; }
    }
    .auto-reset-message {
      font-size: 0.8rem;
      margin-top: 8px;
      color: var(--green);
    }
  </style>
</head>
<body>

<div class="dashboard-grid">
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-ticket-alt"></i> Select tickets</span>
      <button class="btn-secondary" id="syncBtn" style="background: var(--bone); border: 1px solid var(--border-strong); padding: 6px 14px; border-radius: 60px; cursor: pointer;"><i class="fas fa-sync-alt"></i> Sync</button>
    </div>
    <div class="card-body">
      <div id="eventInfo" class="event-info-block"></div>
      <div id="ticketContainer" class="ticket-grid"></div>
      <div class="quantity-section">
        <div><i class="fas fa-ticket-alt"></i> Quantity</div>
        <div class="quantity-controls">
          <button class="quantity-btn" id="decQty">−</button>
          <span class="quantity-display" id="qtyDisplay">1</span>
          <button class="quantity-btn" id="incQty">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-cash-register"></i> Payment</span>
    </div>
    <div class="card-body">
      <div class="order-summary" id="orderSummary">
        <div class="summary-item"><span>Ticket type:</span><span id="summaryType">—</span></div>
        <div class="summary-item"><span>Price each:</span><span id="summaryPrice">R0</span></div>
        <div class="summary-item"><span>Quantity:</span><span id="summaryQty">1</span></div>
        <div class="summary-total"><span>Total:</span><span id="summaryTotal">R0</span></div>
      </div>

      <div class="payment-methods-section">
        <div style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--mist); margin-bottom: 12px;"><i class="fas fa-credit-card"></i> Payment Method</div>
        <div class="payment-option" id="cashOption"><div class="payment-option-header"><div class="payment-icon"><i class="fas fa-money-bill-wave"></i></div><div><div class="payment-title">Cash Payment</div><div class="payment-desc">Pay with cash at the box office</div></div><div style="margin-left: auto;"><div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;"><div id="cashSelectedIndicator" style="width:12px;height:12px;background:var(--red);border-radius:50%;display:none;"></div></div></div></div></div>
        <div class="payment-option" id="cardOption"><div class="payment-option-header"><div class="payment-icon"><i class="fas fa-credit-card"></i></div><div><div class="payment-title">Card Payment</div><div class="payment-desc">Visa, Mastercard, Apple Pay</div></div><div style="margin-left: auto;"><div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;"><div id="cardSelectedIndicator" style="width:12px;height:12px;background:var(--red);border-radius:50%;display:none;"></div></div></div></div></div>
        <div class="payment-option" id="walletOption"><div class="payment-option-header"><div class="payment-icon"><i class="fas fa-wallet"></i></div><div><div class="payment-title">Rands Wallet</div><div class="payment-desc">Request payment approval from customer's wallet</div></div><div style="margin-left: auto;"><div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;"><div id="walletSelectedIndicator" style="width:12px;height:12px;background:var(--red);border-radius:50%;display:none;"></div></div></div></div></div>
      </div>

      <div class="phone-input-group" id="phoneInputGroup">
        <label><i class="fas fa-phone-alt"></i> Customer phone number</label>
        <input type="tel" id="customerPhone" placeholder="e.g. 0712345678">
      </div>

      <button class="btn-primary" id="requestPaymentBtn" disabled><i class="fas fa-credit-card"></i> Select payment method</button>
      <div id="requestStatus" class="status-panel"></div>
    </div>
  </div>
</div>

<div id="toastMsg" class="toast"></div>
<div id="wristbandPreviewModal" class="wristband-preview-modal">
  <div class="wristband-preview-content">
    <i class="fas fa-ticket-alt" style="font-size: 48px; color: var(--red); margin-bottom: 8px;"></i>
    <h3 style="margin-bottom: 8px;">Wristband</h3>
    <div class="preview-scroll-area" id="previewWristbandScroll"></div>
    <div class="action-bar">
      <button class="btn-print" id="printWristbandBtn"><i class="fas fa-print"></i> Print</button>
      <button class="btn-new-sale" id="newSaleBtn"><i class="fas fa-plus-circle"></i> New Sale</button>
      <button class="btn-back-events" id="backEventsBtn"><i class="fas fa-calendar-alt"></i> Back to Events</button>
      <button class="btn-close" id="closePreviewBtn">Close</button>
    </div>
    <div id="autoResetMsg" class="auto-reset-message"></div>
  </div>
</div>
<div id="wristbandPrintContainer" class="wristband-print"></div>

<script type="module">
  import { supabase } from '../config/supabase.js';

  let events = [];
  let selectedEvent = null;
  let selectedTicketType = null;
  let ticketQuantity = 1;
  let currentRequestId = null;
  let requestSubscription = null;
  let selectedPaymentMethod = null;
  let countdownInterval = null;
  let lastIssuedTickets = [];

  const eventInfoDiv = document.getElementById('eventInfo');
  const ticketContainer = document.getElementById('ticketContainer');
  const decQty = document.getElementById('decQty');
  const incQty = document.getElementById('incQty');
  const qtyDisplay = document.getElementById('qtyDisplay');
  const summaryType = document.getElementById('summaryType');
  const summaryPrice = document.getElementById('summaryPrice');
  const summaryQty = document.getElementById('summaryQty');
  const summaryTotal = document.getElementById('summaryTotal');
  const customerPhoneInput = document.getElementById('customerPhone');
  const requestPaymentBtn = document.getElementById('requestPaymentBtn');
  const requestStatusDiv = document.getElementById('requestStatus');
  const syncBtn = document.getElementById('syncBtn');
  const phoneInputGroup = document.getElementById('phoneInputGroup');

  function isUpcomingEvent(eventDate) {
    if (!eventDate) return true;
    const now = new Date();
    const eventDateTime = new Date(eventDate);
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return eventDateTime >= today;
  }

  function showToast(msg, type = 'info') {
    const toast = document.getElementById('toastMsg');
    const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
    toast.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function validatePhone(phone) { return /^[0-9]{10}$/.test(phone); }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
  function getTicketTypeClass(ticketName) { const n = ticketName.toLowerCase(); if (n.includes('vvip')) return 'vvip'; if (n.includes('vip')) return 'vip'; if (n.includes('staff')) return 'staff'; if (n.includes('artist')) return 'artist'; if (n.includes('backstage')) return 'backstage'; return 'general'; }
  function getTicketTypeBadgeClass(ticketName) { const n = ticketName.toLowerCase(); if (n.includes('vvip')) return 'badge-vvip'; if (n.includes('vip')) return 'badge-vip'; if (n.includes('staff')) return 'badge-staff'; if (n.includes('artist')) return 'badge-artist'; if (n.includes('backstage')) return 'badge-backstage'; return 'badge-general'; }

  async function generateWristbandHTML(ticket, event, ticketType, customerName = '') {
    const typeClass = getTicketTypeClass(ticketType.name);
    const badgeClass = getTicketTypeBadgeClass(ticketType.name);
    const displayName = customerName || 'Guest';
    const eventDate = event.start_time ? new Date(event.start_time).toLocaleDateString('en-ZA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : 'Date TBA';
    return `<div class="wristband wristband-${typeClass}"><div class="wristband-content"><div class="wristband-event"><div class="wristband-event-name">${escapeHtml(event.name)}</div><div class="wristband-event-date">${eventDate}</div></div><div class="wristband-type"><span class="wristband-type-badge ${badgeClass}">${escapeHtml(ticketType.name.toUpperCase())}</span></div><div class="wristband-barcode-section"><div class="wristband-qr" id="qr-${ticket.id}"></div><div class="wristband-ticket-number">#${ticket.id.slice(0, 8).toUpperCase()}</div></div><div class="wristband-guest"><div class="wristband-guest-label">GUEST</div><div class="wristband-guest-name">${escapeHtml(displayName)}</div></div><div class="wristband-footer"><div>SCAN FOR ENTRY</div></div></div></div>`;
  }

  async function showWristbandPreview(ticketsList, event, ticketType, customerName = '') {
    const previewScroll = document.getElementById('previewWristbandScroll');
    previewScroll.innerHTML = '';
    for (const ticket of ticketsList) {
      const html = await generateWristbandHTML(ticket, event, ticketType, customerName);
      const wrapper = document.createElement('div');
      wrapper.innerHTML = html;
      previewScroll.appendChild(wrapper.firstElementChild);
      setTimeout(() => {
        const qrDiv = document.getElementById(`qr-${ticket.id}`);
        if (qrDiv && window.QRCode) {
          qrDiv.innerHTML = '';
          new QRCode(qrDiv, { text: JSON.stringify({ ticket_id: ticket.id, event_id: event.id, check: true }), width: 140, height: 140 });
        }
      }, 100);
    }
    document.getElementById('wristbandPreviewModal').classList.add('show');
    document.body.style.overflow = 'hidden';
    window.lastPrintedTickets = ticketsList;
    window.lastEvent = event;
    window.lastTicketType = ticketType;
  }

  async function printWristbandHandler() {
    if (window.lastPrintedTickets && window.lastEvent && window.lastTicketType) {
      const container = document.getElementById('wristbandPrintContainer');
      container.innerHTML = '';
      for (const ticket of window.lastPrintedTickets) {
        const html = await generateWristbandHTML(ticket, window.lastEvent, window.lastTicketType, 'Guest');
        container.innerHTML += html;
      }
      setTimeout(() => {
        window.print();
        showToast('Wristband sent to printer', 'success');
        const autoMsg = document.getElementById('autoResetMsg');
        autoMsg.innerHTML = '<i class="fas fa-check-circle"></i> Wristbands printed! Preparing next sale in 5 seconds...';
        setTimeout(() => { resetToNewSale(); autoMsg.innerHTML = ''; }, 5000);
      }, 200);
    } else { showToast('No wristband to print', 'error'); }
  }

  function resetToNewSale() {
    document.getElementById('wristbandPreviewModal').classList.remove('show');
    document.body.style.overflow = '';
    selectedTicketType = null;
    ticketQuantity = 1;
    qtyDisplay.textContent = '1';
    selectedPaymentMethod = null;
    document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('selected'));
    document.getElementById('cashSelectedIndicator').style.display = 'none';
    document.getElementById('cardSelectedIndicator').style.display = 'none';
    document.getElementById('walletSelectedIndicator').style.display = 'none';
    phoneInputGroup.classList.remove('visible');
    customerPhoneInput.value = '';
    if (countdownInterval) clearInterval(countdownInterval);
    if (requestSubscription) requestSubscription.unsubscribe();
    currentRequestId = null;
    requestStatusDiv.style.display = 'none';
    requestStatusDiv.className = 'status-panel';
    renderTickets();
    updateSummary();
    updateQuantityLimit();
    updateCheckoutButtonState();
    showToast('Ready for next customer', 'success');
  }

  function backToEventsList() {
    resetToNewSale();
    loadEvents();
  }

  async function issueTickets(customerPhone, customerId, customerName = '') {
    const ticketsToInsert = [];
    for (let i = 0; i < ticketQuantity; i++) {
      ticketsToInsert.push({ event_id: selectedEvent.id, ticket_type_id: selectedTicketType.id, customer_phone: customerPhone, status: 'issued', issued_at: new Date().toISOString(), checked_in: true, checked_in_at: new Date().toISOString(), ticket_type: selectedTicketType.name.toLowerCase().includes('vip') ? 'vip' : 'general', qr_token: crypto.randomUUID() });
    }
    const { data: tickets, error } = await supabase.from('tickets').insert(ticketsToInsert).select();
    if (error) throw error;
    for (const ticket of tickets) { await supabase.from('checkins').insert({ ticket_id: ticket.id, event_id: selectedEvent.id, scanned_at: new Date().toISOString(), status: 'valid', gate: 'box_office' }); }
    const { data: tt } = await supabase.from('ticket_types').select('sold').eq('id', selectedTicketType.id).single();
    if (tt) await supabase.from('ticket_types').update({ sold: (tt.sold || 0) + ticketQuantity }).eq('id', selectedTicketType.id);
    return tickets;
  }

  async function processCashPayment() {
    if (!selectedTicketType || ticketQuantity > selectedTicketType.available) { showToast('Invalid ticket/quantity', 'error'); return false; }
    requestPaymentBtn.disabled = true;
    requestPaymentBtn.innerHTML = '<span class="loading-spinner"></span> Processing...';
    try {
      const tickets = await issueTickets('cash_customer', null, 'Cash Customer');
      await supabase.from('payment_requests').insert({ customer_phone: 'cash_customer', event_id: selectedEvent.id, ticket_type_id: selectedTicketType.id, quantity: ticketQuantity, total_amount: selectedTicketType.price * ticketQuantity, channel: 'boxoffice', status: 'completed', payment_method: 'cash' });
      await showWristbandPreview(tickets, selectedEvent, selectedTicketType, 'Cash Customer');
      showToast(`Success: ${ticketQuantity} ticket(s) issued`, 'success');
      await loadEvents();
      return true;
    } catch (err) { showToast(err.message, 'error'); return false; }
    finally { requestPaymentBtn.disabled = false; updateCheckoutButtonState(); }
  }

  // FIXED CARD PAYMENT - exactly as working in payment.html
  async function processCardPayment() {
    if (!selectedTicketType || ticketQuantity > selectedTicketType.available) {
      showToast('Invalid ticket/quantity', 'error');
      return false;
    }
    requestPaymentBtn.disabled = true;
    requestPaymentBtn.innerHTML = '<span class="loading-spinner"></span> Initializing secure payment...';
    try {
      const totalAmount = selectedTicketType.price * ticketQuantity;
      const amountCents = Math.round(totalAmount * 100);
      const transactionId = `BO_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
      
      // Store payment context in sessionStorage for callback
      const pendingPayment = {
        event_id: selectedEvent.id,
        ticket_type_id: selectedTicketType.id,
        quantity: ticketQuantity,
        total_amount: totalAmount,
        ticket_name: selectedTicketType.name,
        event_name: selectedEvent.name,
        transaction_id: transactionId
      };
      sessionStorage.setItem('pendingBoxOfficePayment', JSON.stringify(pendingPayment));
      
      // Call Yoco edge function (public endpoint)
      const response = await fetch(
        'https://odpugxrihfspaucsdqjj.supabase.co/functions/v1/yoco-create-checkout',
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount_cents: amountCents,
            transaction_id: transactionId,
            currency: 'ZAR',
            metadata: { box_office: true, event_id: selectedEvent.id, ticket_type_id: selectedTicketType.id, quantity: ticketQuantity }
          }),
        }
      );
      
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Payment initialization failed');
      if (!data.checkout_url) throw new Error('No checkout URL received');
      
      // Redirect to Yoco checkout
      window.location.href = data.checkout_url;
    } catch (err) {
      showToast(err.message, 'error');
      requestPaymentBtn.disabled = false;
      updateCheckoutButtonState();
      return false;
    }
  }

  async function processWalletPayment() {
    const phone = customerPhoneInput.value.trim();
    if (!phone || !validatePhone(phone)) { showToast('Valid 10-digit phone required', 'error'); return; }
    requestPaymentBtn.disabled = true;
    try {
      const { data: profile } = await supabase.from('profiles').select('id').eq('phone', phone).maybeSingle();
      const customerId = profile?.id;
      const totalAmount = selectedTicketType.price * ticketQuantity;
      const { data, error } = await supabase.from('payment_requests').insert({ customer_phone: phone, customer_profile_id: customerId, event_id: selectedEvent.id, ticket_type_id: selectedTicketType.id, quantity: ticketQuantity, total_amount: totalAmount, channel: 'boxoffice', status: 'pending', requested_at: new Date().toISOString(), expires_at: new Date(Date.now() + 2 * 60000).toISOString(), metadata: { payment_method: 'wallet' } }).select().single();
      if (error) throw error;
      currentRequestId = data.id;
      requestStatusDiv.style.display = 'block';
      requestStatusDiv.className = 'status-panel pending';
      requestStatusDiv.innerHTML = `<i class="fas fa-hourglass-half"></i> Waiting for approval...<div class="timer-display" id="requestTimer">02:00</div>`;
      let seconds = 120;
      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => { seconds--; const timerEl = document.getElementById('requestTimer'); if (timerEl) timerEl.innerText = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`; if (seconds <= 0) { clearInterval(countdownInterval); if (currentRequestId) { showToast('Request expired', 'error'); resetRequestFlow(); } } }, 1000);
      if (requestSubscription) requestSubscription.unsubscribe();
      requestSubscription = supabase.channel(`payment-${currentRequestId}`).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'payment_requests', filter: `id=eq.${currentRequestId}` }, async (payload) => {
        if (payload.new.status === 'approved') {
          clearInterval(countdownInterval);
          const tickets = await issueTickets(phone, customerId, 'Wallet Customer');
          await supabase.from('payment_requests').update({ status: 'completed' }).eq('id', currentRequestId);
          await showWristbandPreview(tickets, selectedEvent, selectedTicketType, 'Wallet Customer');
          resetRequestFlow();
        } else if (payload.new.status === 'rejected') {
          clearInterval(countdownInterval);
          showToast('Customer rejected', 'error');
          resetRequestFlow();
        }
      }).subscribe();
      showToast('Request sent', 'success');
    } catch (err) { showToast(err.message, 'error'); requestPaymentBtn.disabled = false; updateCheckoutButtonState(); }
  }
  function resetRequestFlow() { if (countdownInterval) clearInterval(countdownInterval); if (requestSubscription) { requestSubscription.unsubscribe(); requestSubscription = null; } currentRequestId = null; requestStatusDiv.style.display = 'none'; updateCheckoutButtonState(); }

  async function loadEvents() {
    try {
      const { data: eventsData, error } = await supabase.from('events').select('*').eq('is_active', true).eq('status', 'active').order('start_time', { ascending: true });
      if (error) throw error;
      const upcomingEvents = (eventsData || []).filter(event => isUpcomingEvent(event.start_time));
      for (let ev of upcomingEvents) {
        const { data: types } = await supabase.from('ticket_types').select('*').eq('event_id', ev.id);
        ev.ticketTypes = types || [];
      }
      const eventsWithTickets = upcomingEvents.filter(ev => ev.ticketTypes.length > 0);
      if (eventsWithTickets.length === 0) {
        eventInfoDiv.innerHTML = '<div class="event-name" style="color: var(--orange);"><i class="fas fa-calendar-times"></i> No upcoming events available</div><div class="event-meta">Check back later for future events</div>';
        ticketContainer.innerHTML = '<div class="ticket-card disabled">No tickets available for upcoming events</div>';
        selectedEvent = null; selectedTicketType = null; updateCheckoutButtonState(); return;
      }
      events = eventsWithTickets;
      selectedEvent = eventsWithTickets[0];
      if (selectedEvent) { renderEvent(); renderTickets(); }
      updateCheckoutButtonState();
    } catch (err) { console.error(err); showToast('Failed to load events: ' + err.message, 'error'); }
  }
  
  function renderEvent() { 
    if (!selectedEvent) return; 
    const start = selectedEvent.start_time ? new Date(selectedEvent.start_time) : null; 
    const dateStr = start ? start.toLocaleDateString('en-ZA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : 'TBD'; 
    eventInfoDiv.innerHTML = `<div class="event-name">${escapeHtml(selectedEvent.name)}</div><div class="event-meta"><i class="fas fa-calendar-alt"></i> ${dateStr}<br><i class="fas fa-map-marker-alt"></i> ${escapeHtml(selectedEvent.location || 'Venue TBA')}</div>`; 
  }
  
  function renderTickets() { 
    if (!selectedEvent?.ticketTypes?.length) { ticketContainer.innerHTML = '<div class="ticket-card disabled">No ticket types</div>'; return; } 
    ticketContainer.innerHTML = selectedEvent.ticketTypes.map(tt => { 
      const available = (tt.capacity || 0) - (tt.sold || 0); 
      return `<div class="ticket-card ${available <= 0 ? 'disabled' : ''}" data-id="${tt.id}" data-name="${escapeHtml(tt.name)}" data-price="${tt.price}" data-available="${available}"><div style="font-size: 32px;"><i class="fas fa-ticket-alt"></i></div><div style="font-weight: 700;">${escapeHtml(tt.name)}</div><div class="ticket-price">R${Number(tt.price).toLocaleString()}</div><div style="font-size: 0.7rem;">${available} left</div></div>`; 
    }).join(''); 
    document.querySelectorAll('.ticket-card:not(.disabled)').forEach(card => { 
      card.addEventListener('click', () => { 
        document.querySelectorAll('.ticket-card').forEach(c => c.classList.remove('selected')); 
        card.classList.add('selected'); 
        selectedTicketType = { id: card.dataset.id, name: card.dataset.name, price: parseInt(card.dataset.price), available: parseInt(card.dataset.available) }; 
        updateSummary(); updateQuantityLimit(); updateCheckoutButtonState(); 
      }); 
    }); 
    const firstAvail = document.querySelector('.ticket-card:not(.disabled)'); if (firstAvail) firstAvail.click(); 
  }
  
  function updateQuantityLimit() { 
    if (!selectedTicketType) { incQty.disabled = true; decQty.disabled = true; return; } 
    incQty.disabled = ticketQuantity >= Math.min(selectedTicketType.available, 10); decQty.disabled = ticketQuantity <= 1; updateCheckoutButtonState(); 
  }
  
  function updateSummary() { 
    if (!selectedTicketType) { summaryType.textContent = '—'; summaryPrice.textContent = 'R0'; summaryTotal.textContent = 'R0'; return; } 
    const total = selectedTicketType.price * ticketQuantity; 
    summaryType.textContent = selectedTicketType.name; 
    summaryPrice.textContent = `R${selectedTicketType.price.toLocaleString()}`; 
    summaryQty.textContent = ticketQuantity; 
    summaryTotal.textContent = `R${total.toLocaleString()}`; updateCheckoutButtonState(); 
  }
  
  function updateCheckoutButtonState() {
    const isEventValid = selectedEvent && selectedTicketType && ticketQuantity > 0;
    const isPaymentSelected = selectedPaymentMethod !== null;
    const available = selectedTicketType ? selectedTicketType.available : 0;
    const quantityValid = ticketQuantity <= available && ticketQuantity > 0;
    const enabled = isEventValid && isPaymentSelected && quantityValid;
    requestPaymentBtn.disabled = !enabled;
    if (!isPaymentSelected && (selectedEvent && selectedTicketType)) requestPaymentBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Select payment method first';
    else if (!selectedTicketType) requestPaymentBtn.innerHTML = '<i class="fas fa-ticket-alt"></i> Select a ticket type';
    else if (!quantityValid && selectedTicketType) requestPaymentBtn.innerHTML = `<i class="fas fa-ban"></i> Max ${selectedTicketType.available} tickets`;
    else {
      if (selectedPaymentMethod === 'cash') requestPaymentBtn.innerHTML = '<i class="fas fa-money-bill-wave"></i> Process Cash Payment';
      else if (selectedPaymentMethod === 'card') requestPaymentBtn.innerHTML = '<i class="fas fa-credit-card"></i> Pay with Card';
      else if (selectedPaymentMethod === 'wallet') requestPaymentBtn.innerHTML = '<i class="fas fa-wallet"></i> Request Wallet Payment';
      else requestPaymentBtn.innerHTML = '<i class="fas fa-credit-card"></i> Select payment method';
    }
  }
  
  decQty.addEventListener('click', () => { if (ticketQuantity > 1) { ticketQuantity--; qtyDisplay.textContent = ticketQuantity; updateSummary(); updateQuantityLimit(); } });
  incQty.addEventListener('click', () => { if (selectedTicketType && ticketQuantity < selectedTicketType.available && ticketQuantity < 10) { ticketQuantity++; qtyDisplay.textContent = ticketQuantity; updateSummary(); updateQuantityLimit(); } });
  
  function initPaymentHandlers() {
    document.getElementById('cashOption').addEventListener('click', () => { selectedPaymentMethod = 'cash'; document.getElementById('cashSelectedIndicator').style.display = 'block'; document.getElementById('cardSelectedIndicator').style.display = 'none'; document.getElementById('walletSelectedIndicator').style.display = 'none'; document.getElementById('cashOption').classList.add('selected'); document.getElementById('cardOption').classList.remove('selected'); document.getElementById('walletOption').classList.remove('selected'); phoneInputGroup.classList.remove('visible'); updateCheckoutButtonState(); });
    document.getElementById('cardOption').addEventListener('click', () => { selectedPaymentMethod = 'card'; document.getElementById('cardSelectedIndicator').style.display = 'block'; document.getElementById('cashSelectedIndicator').style.display = 'none'; document.getElementById('walletSelectedIndicator').style.display = 'none'; document.getElementById('cardOption').classList.add('selected'); document.getElementById('cashOption').classList.remove('selected'); document.getElementById('walletOption').classList.remove('selected'); phoneInputGroup.classList.remove('visible'); updateCheckoutButtonState(); });
    document.getElementById('walletOption').addEventListener('click', () => { selectedPaymentMethod = 'wallet'; document.getElementById('walletSelectedIndicator').style.display = 'block'; document.getElementById('cashSelectedIndicator').style.display = 'none'; document.getElementById('cardSelectedIndicator').style.display = 'none'; document.getElementById('walletOption').classList.add('selected'); document.getElementById('cashOption').classList.remove('selected'); document.getElementById('cardOption').classList.remove('selected'); phoneInputGroup.classList.add('visible'); updateCheckoutButtonState(); });
  }
  
  requestPaymentBtn.addEventListener('click', async () => { if (!selectedPaymentMethod) { showToast('Please select a payment method first', 'error'); return; } if (selectedPaymentMethod === 'cash') await processCashPayment(); else if (selectedPaymentMethod === 'card') await processCardPayment(); else if (selectedPaymentMethod === 'wallet') await processWalletPayment(); });
  document.getElementById('closePreviewBtn').addEventListener('click', () => { document.getElementById('wristbandPreviewModal').classList.remove('show'); document.body.style.overflow = ''; });
  document.getElementById('printWristbandBtn').addEventListener('click', printWristbandHandler);
  document.getElementById('newSaleBtn').addEventListener('click', resetToNewSale);
  document.getElementById('backEventsBtn').addEventListener('click', backToEventsList);
  syncBtn.addEventListener('click', () => { loadEvents(); showToast('Refreshed', 'info'); });
  customerPhoneInput.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10); });
  
  initPaymentHandlers();
  loadEvents();

  // Handle card payment return callback
  const urlParams = new URLSearchParams(window.location.search);
  const paymentStatus = urlParams.get('payment');
  const transactionId = urlParams.get('transaction_id');
  if (paymentStatus === 'success' && transactionId) {
    const pending = sessionStorage.getItem('pendingBoxOfficePayment');
    if (pending) {
      sessionStorage.removeItem('pendingBoxOfficePayment');
      const payment = JSON.parse(pending);
      showToast('Card payment successful! Issuing tickets...', 'success');
      setTimeout(async () => {
        try {
          selectedEvent = events.find(e => e.id === payment.event_id);
          if (selectedEvent) {
            selectedTicketType = { id: payment.ticket_type_id, price: payment.total_amount / payment.quantity, name: payment.ticket_name || 'Ticket', available: 999 };
            ticketQuantity = payment.quantity;
            const tickets = await issueTickets('card_customer', null, 'Card Customer');
            await showWristbandPreview(tickets, selectedEvent, selectedTicketType, 'Card Customer');
            await loadEvents();
          } else {
            showToast('Event not found after payment', 'error');
          }
        } catch (err) { showToast('Error finalizing: ' + err.message, 'error'); }
      }, 500);
    }
    window.history.replaceState({}, '', window.location.pathname);
  } else if (paymentStatus === 'cancel') {
    showToast('Card payment was cancelled', 'info');
    window.history.replaceState({}, '', window.location.pathname);
  } else if (paymentStatus === 'failed') {
    showToast('Card payment failed. Please try again.', 'error');
    window.history.replaceState({}, '', window.location.pathname);
  }
</script>
