<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Box Office · Payment Request</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --red: #E30613;
      --red-dark: #a0010e;
      --red-glow: rgba(227,6,19,0.18);
      --ink: #1e293b;
      --slate: #475569;
      --mist: #94a3b8;
      --bone: #f8fafd;
      --white: #ffffff;
      --border-strong: #eef2f8;
      --radius-lg: 28px;
      --radius-full: 9999px;
    }

    body {
      background: var(--bone);
      font-family: 'Inter', sans-serif;
      padding: 24px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-strong);
      overflow: hidden;
      box-shadow: 0 8px 20px -6px rgba(0,0,0,0.12);
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 2px solid var(--border-strong);
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header i {
      color: var(--red);
      margin-right: 8px;
    }

    .card-body {
      padding: 24px;
    }

    .ticket-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      margin: 20px 0;
    }

    .ticket-card {
      background: var(--white);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ticket-card.selected {
      border: 2px solid var(--red);
      background: rgba(227,6,19,0.06);
    }

    .ticket-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ticket-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--red);
    }

    .quantity-section {
      background: var(--bone);
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      margin-top: 20px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
    }

    .quantity-btn {
      width: 44px;
      height: 44px;
      background: white;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-full);
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      color: var(--red);
    }

    .quantity-display {
      font-size: 28px;
      font-weight: 800;
      min-width: 60px;
      text-align: center;
    }

    .order-summary {
      background: var(--bone);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed var(--border-strong);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      padding: 16px 0 8px;
      border-top: 2px solid var(--red);
      font-weight: 800;
      color: var(--red);
    }

    .btn-primary {
      background: var(--red);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
    }

    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 60px;
      border: 1px solid var(--border-strong);
      font-size: 1rem;
    }

    .status-panel {
      margin-top: 20px;
      padding: 16px;
      border-radius: 20px;
      background: var(--bone);
      text-align: center;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: white;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      z-index: 10001;
      transform: translateX(400px);
      transition: transform 0.25s;
    }
    .toast.show { transform: translateX(0); }

    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="dashboard-grid">
  <!-- LEFT: Event & tickets -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-ticket-alt"></i> Select tickets</span>
      <button class="btn-sm" id="syncBtn" style="background: var(--bone); border:1px solid var(--border-strong); padding:6px 14px; border-radius:60px;">⟳ Sync</button>
    </div>
    <div class="card-body">
      <div id="eventInfo">
        <div style="font-size:1.3rem; font-weight:800; color:var(--red);">Loading events...</div>
      </div>
      <div id="ticketContainer" class="ticket-grid"></div>
      <div class="quantity-section">
        <div>🎟️ Quantity</div>
        <div class="quantity-controls">
          <button class="quantity-btn" id="decQty">−</button>
          <span class="quantity-display" id="qtyDisplay">1</span>
          <button class="quantity-btn" id="incQty">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Payment request -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-cash-register"></i> Payment request</span>
    </div>
    <div class="card-body">
      <div class="order-summary" id="orderSummary">
        <div class="summary-item"><span>Ticket type:</span><span id="summaryType">—</span></div>
        <div class="summary-item"><span>Price each:</span><span id="summaryPrice">R0</span></div>
        <div class="summary-item"><span>Quantity:</span><span id="summaryQty">1</span></div>
        <div class="summary-total"><span>Total:</span><span id="summaryTotal">R0</span></div>
      </div>

      <div class="input-group">
        <label><i class="fas fa-phone-alt"></i> Customer phone number</label>
        <input type="tel" id="customerPhone" placeholder="e.g. 0712345678" required>
      </div>

      <button class="btn-primary" id="requestPaymentBtn">📲 Request payment approval</button>

      <div id="requestStatus" class="status-panel" style="display:none;">
        <i class="fas fa-hourglass-half"></i> Waiting for customer approval...<br>
        <small id="requestIdDisplay"></small>
      </div>
    </div>
  </div>
</div>

<div id="toastMsg" class="toast"></div>

<script type="module">
  import { supabase } from '../config/supabase.js';

  // ---------- STATE ----------
  let events = [];
  let selectedEvent = null;
  let selectedTicketType = null;   // { key, name, price, available, ticketTypeId }
  let ticketQuantity = 1;
  let currentRequestId = null;
  let requestSubscription = null;

  // DOM elements
  const eventInfoDiv = document.getElementById('eventInfo');
  const ticketContainer = document.getElementById('ticketContainer');
  const decQty = document.getElementById('decQty');
  const incQty = document.getElementById('incQty');
  const qtyDisplay = document.getElementById('qtyDisplay');
  const summaryType = document.getElementById('summaryType');
  const summaryPrice = document.getElementById('summaryPrice');
  const summaryQty = document.getElementById('summaryQty');
  const summaryTotal = document.getElementById('summaryTotal');
  const customerPhoneInput = document.getElementById('customerPhone');
  const requestPaymentBtn = document.getElementById('requestPaymentBtn');
  const requestStatusDiv = document.getElementById('requestStatus');
  const requestIdDisplay = document.getElementById('requestIdDisplay');
  const syncBtn = document.getElementById('syncBtn');

  // Helper functions
  function showToast(msg, type = 'info') {
    const toast = document.getElementById('toastMsg');
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  async function loadEvents() {
    try {
      const { data: eventsData, error } = await supabase
        .from('events')
        .select('*')
        .order('start_time', { ascending: false });
      if (error) throw error;
      events = eventsData || [];
      if (events.length === 0) {
        eventInfoDiv.innerHTML = '<div style="color:var(--mist);">No events found</div>';
        ticketContainer.innerHTML = '';
        selectedEvent = null;
        return;
      }
      // Load ticket types for each event
      for (let ev of events) {
        const { data: types } = await supabase
          .from('ticket_types')
          .select('*')
          .eq('event_id', ev.id);
        ev.ticketTypes = types || [];
      }
      selectedEvent = events[0];
      renderEvent();
      renderTickets();
    } catch (err) {
      console.error(err);
      showToast('Failed to load events', 'error');
    }
  }

  function renderEvent() {
    if (!selectedEvent) return;
    const start = selectedEvent.start_time ? new Date(selectedEvent.start_time) : null;
    const dateStr = start ? start.toLocaleDateString() : 'TBD';
    const timeStr = start ? start.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' }) : '';
    eventInfoDiv.innerHTML = `
      <div style="font-size:1.3rem; font-weight:800; color:var(--red);">${escapeHtml(selectedEvent.name)}</div>
      <div style="color:var(--slate); margin-top:4px;">📅 ${dateStr} ${timeStr} &nbsp;📍 ${escapeHtml(selectedEvent.location || 'Venue')}</div>
    `;
  }

  function renderTickets() {
    if (!selectedEvent || !selectedEvent.ticketTypes.length) {
      ticketContainer.innerHTML = '<div class="ticket-card disabled">No ticket types</div>';
      return;
    }
    const typeMap = {
      earlyBird: { icon: '🐦', label: 'Early Bird' },
      general: { icon: '🎫', label: 'General Admission' },
      vip: { icon: '⭐', label: 'VIP' }
    };
    ticketContainer.innerHTML = selectedEvent.ticketTypes.map(tt => {
      const key = tt.name.toLowerCase().includes('early') ? 'earlyBird' : (tt.name.toLowerCase().includes('vip') ? 'vip' : 'general');
      const available = (tt.capacity || 0) - (tt.sold || 0);
      const isActive = available > 0 && selectedEvent.status === 'active';
      return `
        <div class="ticket-card ${!isActive ? 'disabled' : ''}" data-id="${tt.id}" data-name="${tt.name}" data-price="${tt.price}" data-available="${available}" data-key="${key}">
          <div class="ticket-icon" style="font-size:32px;">${typeMap[key]?.icon || '🎟️'}</div>
          <div style="font-weight:700; margin:8px 0;">${escapeHtml(tt.name)}</div>
          <div class="ticket-price">R${tt.price}</div>
          <div style="font-size:0.7rem; background:var(--bone); display:inline-block; padding:4px 10px; border-radius:60px; margin-top:8px;">${available} left</div>
        </div>
      `;
    }).join('');

    // Attach click handlers
    document.querySelectorAll('.ticket-card:not(.disabled)').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.ticket-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedTicketType = {
          id: card.dataset.id,
          name: card.dataset.name,
          price: parseInt(card.dataset.price),
          available: parseInt(card.dataset.available),
          key: card.dataset.key
        };
        updateSummary();
        updateQuantityLimit();
      });
    });
    // auto-select first available
    const firstAvail = document.querySelector('.ticket-card:not(.disabled)');
    if (firstAvail) firstAvail.click();
    else selectedTicketType = null;
  }

  function updateQuantityLimit() {
    const max = selectedTicketType ? selectedTicketType.available : 0;
    incQty.disabled = ticketQuantity >= max;
    decQty.disabled = ticketQuantity <= 1;
  }

  function updateSummary() {
    if (!selectedTicketType) {
      summaryType.textContent = '—';
      summaryPrice.textContent = 'R0';
      summaryTotal.textContent = 'R0';
      return;
    }
    const total = selectedTicketType.price * ticketQuantity;
    summaryType.textContent = selectedTicketType.name;
    summaryPrice.textContent = `R${selectedTicketType.price}`;
    summaryQty.textContent = ticketQuantity;
    summaryTotal.textContent = `R${total}`;
  }

  decQty.addEventListener('click', () => {
    if (ticketQuantity > 1) {
      ticketQuantity--;
      qtyDisplay.textContent = ticketQuantity;
      updateSummary();
      updateQuantityLimit();
    }
  });
  incQty.addEventListener('click', () => {
    if (selectedTicketType && ticketQuantity < selectedTicketType.available) {
      ticketQuantity++;
      qtyDisplay.textContent = ticketQuantity;
      updateSummary();
      updateQuantityLimit();
    }
  });

  // ---------- CREATE PAYMENT REQUEST ----------
  async function createPaymentRequest() {
    const phone = customerPhoneInput.value.trim();
    if (!phone) {
      showToast('Enter customer phone number', 'error');
      return false;
    }
    if (!selectedTicketType) {
      showToast('Select a ticket type', 'error');
      return false;
    }
    if (ticketQuantity > selectedTicketType.available) {
      showToast(`Only ${selectedTicketType.available} tickets left`, 'error');
      return false;
    }
    const totalAmount = selectedTicketType.price * ticketQuantity;
    // Insert request
    const { data, error } = await supabase
      .from('payment_requests')
      .insert({
        customer_phone: phone,
        event_id: selectedEvent.id,
        ticket_type_id: selectedTicketType.id,
        quantity: ticketQuantity,
        total_amount: totalAmount,
        channel: 'boxoffice',
        status: 'pending'
      })
      .select()
      .single();
    if (error) {
      showToast('Error creating request: ' + error.message, 'error');
      return false;
    }
    currentRequestId = data.id;
    requestIdDisplay.textContent = `Request ID: ${currentRequestId.slice(0,8)}...`;
    requestStatusDiv.style.display = 'block';
    requestPaymentBtn.disabled = true;
    return true;
  }

  // ---------- LISTEN FOR CUSTOMER APPROVAL ----------
  function subscribeToRequest(requestId) {
    if (requestSubscription) requestSubscription.unsubscribe();
    requestSubscription = supabase
      .channel(`payment-request-${requestId}`)
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'payment_requests',
        filter: `id=eq.${requestId}`
      }, (payload) => {
        const newStatus = payload.new.status;
        if (newStatus === 'approved') {
          handleApproval(payload.new);
        } else if (newStatus === 'rejected') {
          showToast('❌ Customer rejected the payment request', 'error');
          resetRequestFlow();
        } else if (newStatus === 'expired') {
          showToast('⏰ Request expired', 'error');
          resetRequestFlow();
        }
      })
      .subscribe();
  }

  async function handleApproval(request) {
    showToast('✅ Payment approved! Processing tickets...', 'success');
    try {
      // 1. Find customer profile by phone
      const { data: profile, error: profileErr } = await supabase
        .from('profiles')
        .select('id')
        .eq('phone', request.customer_phone)
        .single();
      if (profileErr || !profile) throw new Error('Customer profile not found');

      // 2. Find wallet
      const { data: wallet, error: walletErr } = await supabase
        .from('wallets')
        .select('id, balance')
        .eq('user_id', profile.id)
        .single();
      if (walletErr || !wallet) throw new Error('Wallet not found for this customer');
      if (wallet.balance < request.total_amount) throw new Error('Insufficient balance');

      // 3. Deduct from wallet
      const newBalance = wallet.balance - request.total_amount;
      const { error: updateErr } = await supabase
        .from('wallets')
        .update({ balance: newBalance })
        .eq('id', wallet.id);
      if (updateErr) throw updateErr;

      // 4. Record transaction
      await supabase.from('wallet_transactions').insert({
        wallet_id: wallet.id,
        amount: -request.total_amount,
        type: 'debit',
        description: `Box office: ${request.quantity} tickets for event ${selectedEvent.name}`
      });

      // 5. Create tickets (auto check-in)
      const ticketsToInsert = [];
      for (let i = 0; i < request.quantity; i++) {
        ticketsToInsert.push({
          event_id: request.event_id,
          ticket_type_id: request.ticket_type_id,
          customer_phone: request.customer_phone,
          status: 'issued',
          issued_by: null,
          issued_at: new Date().toISOString(),
          checked_in: true,
          checked_in_at: new Date().toISOString()
        });
      }
      const { data: tickets, error: ticketErr } = await supabase
        .from('tickets')
        .insert(ticketsToInsert)
        .select();
      if (ticketErr) throw ticketErr;

      // 6. Insert check-in records
      for (const ticket of tickets) {
        await supabase.from('checkins').insert({
          ticket_id: ticket.id,
          event_id: request.event_id,
          scanned_by: null,
          scanned_at: new Date().toISOString(),
          status: 'valid'
        });
      }

      // 7. Update ticket_type sold count
      const { data: tt, error: ttFetch } = await supabase
        .from('ticket_types')
        .select('sold')
        .eq('id', request.ticket_type_id)
        .single();
      if (!ttFetch && tt) {
        await supabase
          .from('ticket_types')
          .update({ sold: (tt.sold || 0) + request.quantity })
          .eq('id', request.ticket_type_id);
      }

      // 8. Update payment request with transaction status
      await supabase
        .from('payment_requests')
        .update({ transaction_id: wallet.id })
        .eq('id', request.id);

      showToast(`🎉 ${request.quantity} tickets issued and checked in!`, 'success');
      // Refresh ticket availability
      await loadEvents();
      resetRequestFlow();
    } catch (err) {
      console.error(err);
      showToast('Approval processing failed: ' + err.message, 'error');
      // Optionally mark request as failed
      resetRequestFlow();
    }
  }

  function resetRequestFlow() {
    if (requestSubscription) {
      requestSubscription.unsubscribe();
      requestSubscription = null;
    }
    currentRequestId = null;
    requestStatusDiv.style.display = 'none';
    requestPaymentBtn.disabled = false;
  }

  // Request button click
  requestPaymentBtn.addEventListener('click', async () => {
    const success = await createPaymentRequest();
    if (success) {
      subscribeToRequest(currentRequestId);
      showToast('📱 Request sent. Waiting for customer to approve...', 'info');
    }
  });

  syncBtn.addEventListener('click', () => {
    loadEvents();
    showToast('Refreshed events', 'info');
  });

  // Initial load
  loadEvents();
</script>
</body>
</html>
