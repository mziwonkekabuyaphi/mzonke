<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shisha POS · Embedded Module</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ========== EMBEDDED MODULE BASE (identical to Pre-Order POS) ========== */
    :root {
      --red: #E30613;
      --red-dark: #a0010e;
      --red-deep: #8A0009;
      --red-glow: rgba(227,6,19,0.18);
      --red-subtle: rgba(227,6,19,0.06);
      --ink: #1e293b;
      --ink-muted: #334155;
      --slate: #475569;
      --mist: #94a3b8;
      --bone: #f8fafd;
      --white: #ffffff;
      --card-bg: #ffffff;
      --border: rgba(0,0,0,0.07);
      --border-strong: #eef2f8;
      --shadow-soft: 0 8px 20px -6px rgba(0,0,0,0.12);
      --shadow-card: 0 4px 24px rgba(0,0,0,0.08);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-xl: 32px;
      --radius-full: 9999px;
      --transition: all 0.22s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--bone);
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100%;
      padding: 24px;
    }

    .pos-embedded-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-soft);
      transition: var(--transition);
    }

    .card-header {
      padding: 20px 24px;
      background: var(--white);
      border-bottom: 2px solid var(--border-strong);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink);
    }

    .card-header i {
      color: var(--red);
      margin-right: 8px;
    }

    .card-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 8px;
      color: var(--ink);
    }

    select, input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-strong);
      font-family: 'Inter', monospace;
      font-size: 0.9rem;
      background: var(--white);
      transition: var(--transition);
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-glow);
    }

    .payment-row {
      display: flex;
      gap: 12px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .payment-option {
      flex: 1;
    }
    .payment-option input {
      display: none;
    }
    .payment-option label {
      display: block;
      padding: 12px;
      background: var(--bone);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-full);
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
    }
    .payment-option input:checked + label {
      background: var(--red);
      color: white;
      border-color: var(--red);
    }

    .account-field {
      display: none;
      margin-bottom: 20px;
    }
    .account-field.show {
      display: block;
    }

    .mandatory-phone {
      margin-bottom: 20px;
    }

    .price-card {
      background: var(--bone);
      border-radius: var(--radius-lg);
      padding: 16px;
      text-align: center;
      margin: 20px 0;
    }
    .price-label {
      font-size: 0.8rem;
      color: var(--slate);
    }
    .price-amount {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--red);
    }

    .btn-primary {
      background: var(--red);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      transition: var(--transition);
    }
    .btn-primary:active { transform: scale(0.97); }

    .stats-inline {
      display: flex;
      gap: 12px;
    }
    .stat-badge {
      background: var(--bone);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .stat-number {
      color: var(--red);
      font-weight: 800;
      margin-left: 4px;
    }

    .sessions-scroll {
      max-height: 55vh;
      overflow-y: auto;
      margin-top: 8px;
    }
    .session-item {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border-strong);
      border-left: 4px solid;
      transition: var(--transition);
    }
    .session-item.active { border-left-color: var(--red); }
    .session-item.refill { border-left-color: #f59e0b; background: #fffbeb; }
    .session-item.expired { border-left-color: #6b7280; background: #f3f4f6; }
    .session-item.paused { border-left-color: #ff9800; background: #fff8e1; }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .session-device {
      font-weight: 800;
      color: var(--ink);
    }
    .status-badge {
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-weight: 600;
    }
    .status-badge.active { background: var(--red); color: white; }
    .status-badge.refill { background: #f59e0b; color: white; }
    .status-badge.expired { background: #6b7280; color: white; }
    .status-badge.paused { background: #ff9800; color: white; }

    .timer {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 700;
      margin: 8px 0;
    }
    .session-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .session-actions button {
      flex: 1;
      padding: 8px;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-refill { background: #f59e0b; color: white; }
    .btn-end { background: var(--red); color: white; }

    .toast-pos {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: white;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-weight: 500;
      z-index: 10002;
      transition: transform 0.2s ease;
      opacity: 0;
      pointer-events: none;
      font-size: 0.85rem;
    }
    .toast-pos.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      .pos-embedded-grid { grid-template-columns: 1fr; gap: 20px; }
      body { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="pos-embedded-grid">
  <!-- LEFT CARD: New Session -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-cash-register"></i> New session · R250 / 60min</span>
      <div class="stats-inline">
        <div class="stat-badge"><i class="fas fa-fire"></i> Active <span id="statActive" class="stat-number">0</span></div>
        <div class="stat-badge"><i class="fas fa-hourglass-half"></i> Refill soon <span id="statRefill" class="stat-number">0</span></div>
      </div>
    </div>
    <div class="card-body">
      <div class="form-group">
        <label><i class="fas fa-map-marker-alt"></i> Location</label>
        <select id="locationSelect"></select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-leaf"></i> Flavour</label>
        <select id="flavourSelect"></select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-smoking"></i> Hookah station</label>
        <select id="shishaSelect"><option>Loading...</option></select>
      </div>

      <div class="payment-row">
        <div class="payment-option"><input type="radio" name="payment" value="cash" id="cash" checked><label for="cash">💵 Cash</label></div>
        <div class="payment-option"><input type="radio" name="payment" value="card" id="card"><label for="card">💳 Card</label></div>
        <div class="payment-option"><input type="radio" name="payment" value="wallet" id="wallet"><label for="wallet">👛 Wallet</label></div>
      </div>
      <div id="accountField" class="account-field">
        <input type="text" id="accountIdInput" placeholder="WhatsApp number (e.g., 0635713652)">
      </div>

      <div class="mandatory-phone">
        <label><i class="fas fa-phone-alt"></i> Customer Phone Number <span style="color: var(--red);">*</span></label>
        <input type="tel" id="customerPhone" placeholder="06XXXXXXXX or +27XXXXXXXXX" autocomplete="off">
      </div>

      <div class="price-card">
        <div class="price-label">Session price (incl. coal)</div>
        <div class="price-amount">R250.00</div>
      </div>
      <button class="btn-primary" id="startSessionBtn"><i class="fas fa-play"></i> Start session</button>
    </div>
  </div>

  <!-- RIGHT CARD: Active sessions -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-list-ul"></i> Active hookah sessions</span>
      <button id="openAdminPanelBtn" class="stat-badge" style="background:var(--red-subtle); color:var(--red); border:none; cursor:pointer;">🛠️ Admin panel</button>
    </div>
    <div class="card-body">
      <div id="sessionsList" class="sessions-scroll">
        <div style="text-align:center; padding:24px; color:var(--mist);">Loading sessions...</div>
      </div>
    </div>
  </div>
</div>

<div id="toastMsg" class="toast-pos"></div>

<script type="module">
  import { supabase } from '../../config/supabase.js';

  // ============ ORIGINAL BUSINESS LOGIC – PRESERVED ==========
  const SESSION_PRICE = 250;
  const REFILL_PRICE = 250;
  const COAL_DURATION = 60; // minutes
  const REFILL_THRESHOLD = 15;

  let activeSessions = [];
  let availableHookahs = [];
  let countdownInterval = null;

  function showToast(message, isError = false) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = message;
    toast.style.background = isError ? 'var(--red)' : 'var(--ink)';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // Load locations, flavours, hookah devices
  async function loadDropdowns() {
    const { data: locations } = await supabase.from('shisha_locations').select('id, name').eq('is_active', true);
    const locSelect = document.getElementById('locationSelect');
    locSelect.innerHTML = (locations || []).map(l => `<option value="${l.id}">${l.name}</option>`).join('');
    if (locations?.length) locSelect.value = locations[0].id;

    const { data: flavours } = await supabase.from('shisha_products').select('id, name, price').eq('is_available', true);
    const flavourSelect = document.getElementById('flavourSelect');
    flavourSelect.innerHTML = (flavours || []).map(f => `<option value="${f.id}">${f.name} (R${f.price})</option>`).join('');
    if (flavours?.length) flavourSelect.value = flavours[0].id;
  }

  async function loadAvailableHookahs() {
    const { data, error } = await supabase.from('hookah_devices').select('id, device_code').eq('status', 'available');
    if (error) console.error(error);
    availableHookahs = data || [];
    const select = document.getElementById('shishaSelect');
    if (!availableHookahs.length) select.innerHTML = '<option>❌ No available hookahs</option>';
    else select.innerHTML = availableHookahs.map(h => `<option value="${h.id}">${h.device_code}</option>`).join('');
  }

  async function loadActiveSessions() {
    const { data, error } = await supabase
      .from('shisha_sessions')
      .select(`
        id, device_id, hookah_devices!inner(device_code), product_id, shisha_products!inner(name),
        location_id, shisha_locations!inner(name), start_time, last_refill_time,
        remaining_time_seconds, total_amount, refill_count, status, paused
      `)
      .in('status', ['active', 'refill', 'paused']);
    if (error) { console.error(error); return; }
    activeSessions = data.map(s => ({
      ...s,
      device_code: s.hookah_devices?.device_code,
      flavour_name: s.shisha_products?.name,
      location_name: s.shisha_locations?.name,
      remainingTime: s.remaining_time_seconds
    }));
    updateStats();
    renderSessions();
  }

  function updateStats() {
    let active = 0, refill = 0;
    activeSessions.forEach(s => {
      if (!s.paused) {
        if (s.status === 'active') active++;
        else if (s.status === 'refill') refill++;
      }
    });
    document.getElementById('statActive').innerText = active;
    document.getElementById('statRefill').innerText = refill;
  }

  // ========== LIVE COUNTDOWN LOGIC (FIX) ==========
  // Returns remaining seconds for a session (active/refill & not paused)
  function getLiveRemainingSeconds(session) {
    if (session.paused || session.status === 'expired') {
      // For paused/expired, return the stored value (static)
      return session.remaining_time_seconds;
    }
    // Use last_refill_time if available, otherwise start_time
    const referenceTime = session.last_refill_time ? new Date(session.last_refill_time) : new Date(session.start_time);
    const now = new Date();
    const elapsedSeconds = (now - referenceTime) / 1000;
    const totalDuration = COAL_DURATION * 60;
    let remaining = totalDuration - elapsedSeconds;
    return remaining > 0 ? remaining : 0;
  }

  function formatTime(seconds) {
    if (seconds <= 0) return "EXPIRED";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
  }

  // Update all timer displays in the DOM using live calculation
  function updateAllTimers() {
    document.querySelectorAll('.timer-value').forEach(elem => {
      const sessionId = elem.getAttribute('data-session-id');
      if (!sessionId) return;
      const session = activeSessions.find(s => s.id === sessionId);
      if (!session) return;
      let remainingSec = getLiveRemainingSeconds(session);
      if (remainingSec <= 0 && !session.paused && session.status !== 'expired') {
        // Mark as expired in UI only (no DB update)
        elem.innerText = "EXPIRED";
        elem.style.color = "var(--red)";
        // Optionally add expired class to parent
        const parentItem = elem.closest('.session-item');
        if (parentItem && !parentItem.classList.contains('expired')) {
          parentItem.classList.add('expired');
          const badge = parentItem.querySelector('.status-badge');
          if (badge) {
            badge.innerText = "EXPIRED";
            badge.classList.remove('active', 'refill', 'paused');
            badge.classList.add('expired');
          }
        }
      } else {
        elem.innerText = formatTime(remainingSec);
        elem.style.color = "";
      }
    });
  }

  // Start a single global countdown updater (every second)
  function startCountdownUpdater() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      updateAllTimers();
    }, 1000);
  }

  // Render sessions – each timer gets a dedicated span with data-session-id
  function renderSessions() {
    const container = document.getElementById('sessionsList');
    if (!activeSessions.length) {
      container.innerHTML = '<div style="text-align:center; padding:24px; color:var(--mist);">✨ No active sessions</div>';
      return;
    }
    container.innerHTML = activeSessions.map(s => {
      let statusClass = 'active', statusText = 'ACTIVE';
      if (s.paused) { statusClass = 'paused'; statusText = 'PAUSED'; }
      else if (s.status === 'expired') { statusClass = 'expired'; statusText = 'EXPIRED'; }
      else if (s.status === 'refill') { statusClass = 'refill'; statusText = 'REFILL SOON'; }
      // Determine initial timer display (will be updated live)
      let initialRemaining = getLiveRemainingSeconds(s);
      let timerDisplay = formatTime(initialRemaining);
      if (initialRemaining <= 0 && !s.paused && s.status !== 'expired') timerDisplay = "EXPIRED";
      return `
        <div class="session-item ${statusClass}" data-session-id="${s.id}">
          <div class="session-header">
            <span class="session-device"><i class="fas fa-smoking"></i> ${s.device_code}</span>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
          <div><small>📍 ${s.location_name} | 🍃 ${s.flavour_name}</small></div>
          <div><small>💰 Total: R${s.total_amount} | ♻️ Refills: ${s.refill_count || 0}</small></div>
          <div class="timer">⏱️ <span class="timer-value" data-session-id="${s.id}">${timerDisplay}</span></div>
          <div class="session-actions">
            <button class="btn-refill" data-id="${s.id}">🔄 Refill (R${REFILL_PRICE})</button>
            <button class="btn-end" data-id="${s.id}">❌ End</button>
          </div>
        </div>
      `;
    }).join('');
    // Re-attach event handlers
    document.querySelectorAll('.btn-refill').forEach(btn => btn.addEventListener('click', () => refillSession(btn.dataset.id)));
    document.querySelectorAll('.btn-end').forEach(btn => btn.addEventListener('click', () => endSession(btn.dataset.id)));
    // Force immediate timer update after render
    updateAllTimers();
  }

  async function refillSession(sessionId) {
    const session = activeSessions.find(s => s.id === sessionId);
    if (!session) return;
    if (session.paused) { showToast("Session paused. Resume before refill.", true); return; }
    if (!confirm(`Refill ${session.device_code} for R${REFILL_PRICE}?`)) return;

    const newTotal = session.total_amount + REFILL_PRICE;
    const newRefillCount = (session.refill_count || 0) + 1;
    const { error } = await supabase
      .from('shisha_sessions')
      .update({
        total_amount: newTotal,
        refill_count: newRefillCount,
        last_refill_time: new Date().toISOString(),
        remaining_time_seconds: COAL_DURATION * 60,
        status: 'active'
      })
      .eq('id', sessionId);
    if (error) { showToast(error.message, true); return; }
    showToast(`✅ Refilled! New total: R${newTotal}`);
    await loadActiveSessions();
    await loadAvailableHookahs();
  }

  async function endSession(sessionId) {
    const session = activeSessions.find(s => s.id === sessionId);
    if (!session) return;
    if (!confirm(`End session for ${session.device_code}? Total: R${session.total_amount}`)) return;
    const { error } = await supabase
      .from('shisha_sessions')
      .update({ status: 'expired', ended_at: new Date().toISOString() })
      .eq('id', sessionId);
    if (error) { showToast(error.message, true); return; }
    showToast("Session ended");
    await loadActiveSessions();
    await loadAvailableHookahs();
  }

  // Wallet deduction (real integration with Supabase wallets)
  async function getWalletByPhone(phone) {
    const normalized = phone.replace(/\D/g, '');
    const { data: profile, error: profileErr } = await supabase
      .from('profiles')
      .select('id, name, phone')
      .eq('phone', normalized)
      .maybeSingle();
    if (profileErr || !profile) return { success: false, error: "Profile not found" };
    const { data: wallet, error: walletErr } = await supabase
      .from('wallets')
      .select('id, balance')
      .eq('user_id', profile.id)
      .maybeSingle();
    if (walletErr || !wallet) return { success: false, error: "Wallet not found" };
    return { success: true, profile, wallet };
  }

  async function deductFromWallet(phone, amount, reason) {
    const walletData = await getWalletByPhone(phone);
    if (!walletData.success) return { success: false, error: walletData.error };
    const { profile, wallet } = walletData;
    if (wallet.balance < amount) return { success: false, error: `Insufficient balance. Available: R${wallet.balance.toFixed(2)}` };
    const newBalance = wallet.balance - amount;
    const { error: updateErr } = await supabase.from('wallets').update({ balance: newBalance }).eq('id', wallet.id);
    if (updateErr) return { success: false, error: updateErr.message };
    await supabase.from('wallet_transactions').insert({
      wallet_id: wallet.id,
      type: 'debit',
      amount: -amount,
      description: reason,
      reference: `shisha_pos_${Date.now()}`
    });
    return { success: true, newBalance, name: profile.name };
  }

  async function startNewSession() {
    const locationId = document.getElementById('locationSelect').value;
    const productId = document.getElementById('flavourSelect').value;
    const deviceId = document.getElementById('shishaSelect').value;
    const payment = document.querySelector('input[name="payment"]:checked').value;
    const accountId = document.getElementById('accountIdInput').value.trim();
    const customerPhone = document.getElementById('customerPhone').value.trim();

    if (!customerPhone) {
      showToast("Phone number required for session", true);
      return;
    }
    if (!locationId || !productId || !deviceId) { showToast("Please fill all fields", true); return; }
    if (payment === 'wallet' && !accountId) { showToast("Enter WhatsApp number for wallet", true); return; }

    // Wallet balance check & deduction before creating session
    if (payment === 'wallet') {
      const res = await deductFromWallet(accountId, SESSION_PRICE, `Shisha session start`);
      if (!res.success) { showToast(res.error, true); return; }
      showToast(`✅ Wallet payment successful. New balance: R${res.newBalance.toFixed(2)}`);
    } else {
      if (!confirm(`Confirm ${payment.toUpperCase()} payment of R${SESSION_PRICE}?`)) return;
    }

    const { error } = await supabase.from('shisha_sessions').insert({
      device_id: deviceId,
      product_id: productId,
      location_id: locationId,
      start_time: new Date().toISOString(),
      last_refill_time: new Date().toISOString(),
      remaining_time_seconds: COAL_DURATION * 60,
      total_amount: SESSION_PRICE,
      refill_count: 0,
      status: 'active',
      paused: false,
      payment_method: payment,
      account_id: payment === 'wallet' ? accountId : null,
      customer_phone: customerPhone
    });
    if (error) { showToast(error.message, true); return; }
    showToast(`✅ Session started on hookah!`);
    document.getElementById('customerPhone').value = '';
    document.getElementById('accountIdInput').value = '';
    document.getElementById('cash').checked = true;
    document.getElementById('accountField').classList.remove('show');
    await loadActiveSessions();
    await loadAvailableHookahs();
  }

  function toggleWalletField() {
    const walletChecked = document.getElementById('wallet').checked;
    document.getElementById('accountField').classList.toggle('show', walletChecked);
  }

  document.getElementById('openAdminPanelBtn').addEventListener('click', (e) => {
    e.preventDefault();
    window.open('shisha-management.html', '_blank');
  });

  // ========== INITIALIZATION ==========
  async function init() {
    await loadDropdowns();
    await loadAvailableHookahs();
    await loadActiveSessions();
    startCountdownUpdater();  // start the live 1-second timer
    document.querySelectorAll('input[name="payment"]').forEach(r => r.addEventListener('change', toggleWalletField));
    document.getElementById('startSessionBtn').addEventListener('click', startNewSession);
    toggleWalletField();
    // periodic refresh to keep session list up to date (realtime is also active)
    setInterval(async () => {
      await loadActiveSessions();
      await loadAvailableHookahs();
    }, 4000);
  }
  init();
</script>
</body>
</html>
