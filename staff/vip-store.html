<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VVIP Experience | Premium Packages</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        .hero {
            background: linear-gradient(135deg, #b30000, #660000);
            padding: 60px 20px;
            text-align: center;
        }
        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        .hero p {
            font-size: 18px;
            opacity: 0.9;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        .package-card {
            background: #1a1a1a;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .package-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(179, 0, 0, 0.3);
            border-color: #b30000;
        }
        .package-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .package-content {
            padding: 24px;
        }
        .package-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .package-name {
            font-size: 22px;
            font-weight: 700;
            color: #ff4d4d;
        }
        .package-price {
            font-size: 28px;
            font-weight: 800;
            color: #ffd700;
        }
        .package-description {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .benefits-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .benefit-tag {
            background: #2a2a2a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #ffd700;
        }
        .availability {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
            padding: 8px 0;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }
        .purchase-btn {
            width: 100%;
            padding: 14px;
            background: #b30000;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .purchase-btn:hover {
            background: #ff4d4d;
            transform: scale(1.02);
        }
        .purchase-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        .customer-bar {
            background: #1a1a1a;
            padding: 15px 25px;
            border-radius: 60px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #b30000;
        }
        .wallet-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .wallet-balance {
            color: #00ff9c;
            font-weight: bold;
            font-size: 20px;
        }
        .btn-secondary {
            background: #2a2a2a;
            border: 1px solid #b30000;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a1a;
            border-radius: 28px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 2px solid #b30000;
        }
        .booking-reference {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 16px;
            font-family: monospace;
            font-size: 20px;
            letter-spacing: 2px;
            margin: 20px 0;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 1100;
            display: none;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #aaa;
        }
        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .packages-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="hero">
    <h1><i class="fas fa-crown"></i> VVIP Experience</h1>
    <p>Exclusive packages for the ultimate luxury experience</p>
</div>

<div class="container">
    <div class="customer-bar" id="customerBar">
        <div class="wallet-info">
            <i class="fas fa-user-circle" style="font-size: 32px; color: #ff4d4d;"></i>
            <div>
                <div id="customerName">Not logged in</div>
                <div id="customerPhone">-</div>
            </div>
        </div>
        <div class="wallet-info">
            <span>Wallet Balance:</span>
            <span class="wallet-balance" id="walletBalance">R0</span>
        </div>
        <button class="btn-secondary" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Change Account
        </button>
    </div>

    <div id="packagesGrid" class="packages-grid">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading packages...</div>
    </div>
</div>

<!-- Purchase Modal -->
<div id="purchaseModal" class="modal">
    <div class="modal-content">
        <i class="fas fa-crown" style="font-size: 48px; color: #ffd700; margin-bottom: 16px;"></i>
        <h2 id="modalPackageName" style="color: #ff4d4d;">Confirm Purchase</h2>
        <p id="modalPackageDesc" style="margin: 16px 0; color: #aaa;"></p>
        <div style="background: #2a2a2a; padding: 16px; border-radius: 16px; margin: 16px 0;">
            <div>Package Price: <strong id="modalPackagePrice" style="color: #ffd700;"></strong></div>
            <div>Your Balance: <strong id="modalUserBalance" style="color: #00ff9c;"></strong></div>
            <div>After Purchase: <strong id="modalAfterBalance" style="color: #ff4d4d;"></strong></div>
        </div>
        <div class="booking-reference" id="bookingRef" style="display: none;"></div>
        <div style="display: flex; gap: 12px;">
            <button class="btn-secondary" onclick="closePurchaseModal()" style="flex: 1;">Cancel</button>
            <button class="purchase-btn" id="confirmPurchaseBtn" onclick="confirmPurchase()" style="flex: 1;">Confirm Purchase</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    let currentUser = null;
    let selectedPackage = null;
    let currentWalletBalance = 0;

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = isError ? '#dc2626' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function getCurrentUser() {
        const { data: { user }, error } = await supabase.auth.getUser();
        if (error || !user) return null;
        
        const { data: profile } = await supabase
            .from('profiles')
            .select('id, name, phone, wallet_balance')
            .eq('id', user.id)
            .single();
        
        return { ...user, ...profile };
    }

    async function loadUserData() {
        currentUser = await getCurrentUser();
        if (currentUser) {
            document.getElementById('customerName').innerText = currentUser.name || currentUser.email || 'Customer';
            document.getElementById('customerPhone').innerText = currentUser.phone || 'No phone';
            currentWalletBalance = currentUser.wallet_balance || 0;
            document.getElementById('walletBalance').innerText = `R${currentWalletBalance.toLocaleString()}`;
        } else {
            // Redirect to login if not authenticated
            window.location.href = 'login.html?redirect=vvip-store.html';
        }
    }

    async function loadPackages() {
        const { data, error } = await supabase
            .from('vvip_packages')
            .select('*')
            .eq('status', 'active')
            .order('price', { ascending: true });
        
        if (error) {
            showToast('Error loading packages: ' + error.message, true);
            return;
        }
        
        const container = document.getElementById('packagesGrid');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-crown" style="font-size: 48px; margin-bottom: 16px;"></i><p>No VVIP packages available at this time.</p></div>';
            return;
        }
        
        container.innerHTML = data.map(pkg => {
            const available = (pkg.capacity - (pkg.sold_count || 0));
            const isAvailable = available > 0;
            return `
                <div class="package-card" onclick="selectPackage(${JSON.stringify(pkg).replace(/"/g, '&quot;')})">
                    ${pkg.image ? `<img class="package-image" src="${pkg.image}" alt="${escapeHtml(pkg.name)}" onerror="this.src='https://placehold.co/400x220?text=VVIP'">` : '<div class="package-image" style="background: linear-gradient(135deg, #b30000, #660000); display: flex; align-items: center; justify-content: center;"><i class="fas fa-crown" style="font-size: 64px; color: #ffd700;"></i></div>'}
                    <div class="package-content">
                        <div class="package-header">
                            <span class="package-name">${escapeHtml(pkg.name)}</span>
                            <span class="package-price">R${pkg.price}</span>
                        </div>
                        <div class="package-description">${pkg.description || 'Premium VVIP experience package'}</div>
                        <div class="benefits-list">
                            ${(pkg.benefits || []).map(b => `<span class="benefit-tag"><i class="fas fa-check"></i> ${escapeHtml(b)}</span>`).join('')}
                        </div>
                        <div class="availability">
                            <i class="fas fa-users"></i> ${available} of ${pkg.capacity} spots available
                        </div>
                        <button class="purchase-btn" ${!isAvailable ? 'disabled' : ''}>
                            ${isAvailable ? 'Purchase Package' : 'Sold Out'}
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.selectPackage = function(pkg) {
        selectedPackage = pkg;
        const available = pkg.capacity - (pkg.sold_count || 0);
        if (available <= 0) {
            showToast('This package is sold out', true);
            return;
        }
        
        document.getElementById('modalPackageName').innerText = pkg.name;
        document.getElementById('modalPackageDesc').innerHTML = pkg.description || '';
        document.getElementById('modalPackagePrice').innerHTML = `R${pkg.price}`;
        document.getElementById('modalUserBalance').innerHTML = `R${currentWalletBalance.toLocaleString()}`;
        
        const afterBalance = currentWalletBalance - pkg.price;
        document.getElementById('modalAfterBalance').innerHTML = `R${afterBalance.toLocaleString()}`;
        
        document.getElementById('purchaseModal').style.display = 'flex';
        document.getElementById('bookingRef').style.display = 'none';
        document.getElementById('confirmPurchaseBtn').innerHTML = 'Confirm Purchase';
        document.getElementById('confirmPurchaseBtn').disabled = false;
    };

    window.closePurchaseModal = function() {
        document.getElementById('purchaseModal').style.display = 'none';
        selectedPackage = null;
    };

    function generateBookingReference() {
        const prefix = 'VVIP';
        const timestamp = Date.now().toString(36).toUpperCase();
        const random = Math.random().toString(36).substring(2, 6).toUpperCase();
        return `${prefix}-${timestamp}-${random}`;
    }

    window.confirmPurchase = async function() {
        if (!selectedPackage) return;
        if (currentWalletBalance < selectedPackage.price) {
            showToast('Insufficient wallet balance', true);
            return;
        }
        
        const confirmBtn = document.getElementById('confirmPurchaseBtn');
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        
        const bookingRef = generateBookingReference();
        const newBalance = currentWalletBalance - selectedPackage.price;
        
        // Start a transaction
        const { error: bookingError } = await supabase
            .from('vvip_bookings')
            .insert([{
                package_id: selectedPackage.id,
                customer_id: currentUser.id,
                customer_phone: currentUser.phone,
                customer_name: currentUser.name,
                booking_reference: bookingRef,
                quantity: 1,
                total_amount: selectedPackage.price,
                status: 'confirmed'
            }]);
        
        if (bookingError) {
            showToast('Booking failed: ' + bookingError.message, true);
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = 'Confirm Purchase';
            return;
        }
        
        // Update wallet balance
        const { error: walletError } = await supabase
            .from('profiles')
            .update({ wallet_balance: newBalance })
            .eq('id', currentUser.id);
        
        if (walletError) {
            showToast('Wallet update failed: ' + walletError.message, true);
            // Note: Booking created but wallet not updated - need manual reconciliation
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = 'Confirm Purchase';
            return;
        }
        
        // Update package sold_count
        await supabase.rpc('increment_package_sold_count', { 
            p_package_id: selectedPackage.id,
            p_quantity: 1
        });
        
        // Create order record
        const orderNumber = 'ORD-' + Date.now();
        const { error: orderError } = await supabase
            .from('orders')
            .insert([{
                order_number: orderNumber,
                customer_phone: currentUser.phone,
                customer_name: currentUser.name,
                total_amount: selectedPackage.price,
                total: selectedPackage.price,
                payment_method: 'wallet',
                payment_status: 'paid',
                status: 'completed',
                payment_source: 'vvip_tab',
                items: [{
                    product_type: 'other',
                    product_name: `VVIP Package: ${selectedPackage.name}`,
                    quantity: 1,
                    unit_price: selectedPackage.price,
                    subtotal: selectedPackage.price
                }],
                is_vvip: true,
                source: 'vvip_store'
            }]);
        
        if (orderError) {
            console.error('Order creation failed:', orderError);
        }
        
        // Show success
        currentWalletBalance = newBalance;
        document.getElementById('walletBalance').innerText = `R${newBalance.toLocaleString()}`;
        document.getElementById('bookingRef').innerHTML = `<i class="fas fa-ticket-alt"></i> Booking Reference:<br><strong>${bookingRef}</strong>`;
        document.getElementById('bookingRef').style.display = 'block';
        document.getElementById('confirmPurchaseBtn').innerHTML = 'Done';
        document.getElementById('confirmPurchaseBtn').onclick = () => {
            closePurchaseModal();
            document.getElementById('confirmPurchaseBtn').onclick = confirmPurchase;
        };
        
        showToast(`Booking confirmed! Reference: ${bookingRef}`);
        loadPackages(); // Refresh to update availability
    };

    window.logout = async function() {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
    };

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Add RPC function if not exists
    async function setupRPC() {
        const { error } = await supabase.rpc('increment_package_sold_count', { p_package_id: '00000000-0000-0000-0000-000000000000', p_quantity: 0 });
        if (error && error.message.includes('function')) {
            console.log('RPC function not found, please run SQL migration');
        }
    }

    // Initialization
    async function init() {
        await loadUserData();
        await loadPackages();
        setupRPC();
        
        // Real-time subscription for package updates
        supabase.channel('vvip_packages_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_packages' }, () => {
                loadPackages();
            })
            .subscribe();
    }
    
    init();
</script>
</body>
</html>
