<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VVIP Store | Rands</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --red: #E30613;
            --red-dark: #a0010e;
            --red-glow: rgba(227,6,19,0.12);
            --white: #ffffff;
            --ink: #1e293b;
            --slate: #475569;
            --mist: #94a3b8;
            --bone: #f8fafd;
            --border: rgba(0,0,0,0.07);
            --border-strong: #eef2f8;
            --gold: #D4AF37;
            --shadow-soft: 0 8px 20px -6px rgba(0,0,0,0.12);
            --shadow-card: 0 4px 16px rgba(0,0,0,0.06);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-full: 9999px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bone);
            color: var(--ink);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--red);
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .header h1 i {
            background: none;
            color: var(--red);
            margin-right: 8px;
        }
        .back-btn {
            background: var(--white);
            border: 1px solid var(--border-strong);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: var(--red);
            color: white;
            border-color: var(--red);
        }

        /* Customer lookup card */
        .lookup-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-strong);
            padding: 20px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }
        .lookup-field {
            flex: 2;
            min-width: 200px;
        }
        .lookup-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--mist);
            margin-bottom: 6px;
        }
        .lookup-field input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-strong);
            font-size: 0.9rem;
        }
        .lookup-btn {
            background: var(--red);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
        }
        .clear-btn {
            background: var(--white);
            border: 1px solid var(--border-strong);
            padding: 12px 24px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
        }

        /* Credit Card */
        .credit-card {
            background: linear-gradient(135deg, var(--white), #fff5f5);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 28px;
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-card);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .credit-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .credit-icon {
            width: 56px;
            height: 56px;
            background: var(--red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }
        .credit-details h3 {
            font-size: 0.8rem;
            color: var(--mist);
            font-weight: 500;
        }
        .credit-amount {
            font-size: 2rem;
            font-weight: 800;
            color: var(--red);
        }
        .topup-btn {
            background: var(--white);
            border: 1px solid var(--red);
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .topup-btn:hover {
            background: var(--red);
            color: white;
        }

        .section {
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-strong);
            padding: 24px;
            margin-bottom: 32px;
        }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--red);
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .package-card {
            background: var(--white);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-strong);
            transition: all 0.2s;
            box-shadow: var(--shadow-card);
        }
        .package-card:hover {
            transform: translateY(-4px);
            border-color: var(--red);
            box-shadow: var(--shadow-soft);
        }
        .package-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .package-image i {
            font-size: 48px;
            color: rgba(255,255,255,0.8);
        }
        .package-content {
            padding: 20px;
        }
        .package-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .package-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 800;
        }
        .package-price {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--red);
        }
        .package-meta {
            display: flex;
            gap: 16px;
            margin: 12px 0;
            font-size: 0.8rem;
            color: var(--mist);
        }
        .benefits-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0;
        }
        .benefit-tag {
            background: rgba(227,6,19,0.06);
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            color: var(--red);
        }
        .payment-options {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .pay-btn {
            flex: 1;
            padding: 10px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            border: none;
            transition: 0.1s;
        }
        .pay-tab {
            background: var(--red);
            color: white;
        }
        .pay-cash {
            background: var(--white);
            border: 1px solid var(--border-strong);
            color: var(--ink);
        }
        .pay-card {
            background: var(--gold);
            color: #1e293b;
        }
        .pay-btn:active {
            transform: scale(0.96);
        }
        .pay-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .topup-form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }
        .topup-field {
            flex: 2;
            min-width: 180px;
        }
        .topup-field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--mist);
            margin-bottom: 6px;
        }
        .topup-field input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-strong);
            font-size: 0.9rem;
        }
        .topup-buttons {
            display: flex;
            gap: 12px;
            flex: 1;
        }
        .topup-method-btn {
            background: var(--white);
            border: 1px solid var(--border-strong);
            padding: 12px 20px;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .topup-method-btn.active {
            background: var(--red);
            border-color: var(--red);
            color: white;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--white);
            border-radius: var(--radius-lg);
            max-width: 450px;
            width: 90%;
            padding: 28px;
            text-align: center;
            border: 2px solid var(--red);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            text-align: center;
            z-index: 1100;
            display: none;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--mist);
        }
        @media (max-width: 768px) {
            .packages-grid { grid-template-columns: 1fr; }
            .lookup-card { flex-direction: column; align-items: stretch; }
            .payment-options { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-crown"></i> VVIP Store</h1>
        <button class="back-btn" onclick="window.location.href='home.html'"><i class="fas fa-arrow-left"></i> Back to Home</button>
    </div>

    <!-- Customer Lookup (No Login Required) -->
    <div class="lookup-card">
        <div class="lookup-field">
            <label><i class="fas fa-mobile-alt"></i> Phone Number or Wallet ID</label>
            <input type="text" id="customerIdentifier" placeholder="e.g., 0712345678 or 16-digit Wallet ID">
        </div>
        <button class="lookup-btn" id="loadCustomerBtn"><i class="fas fa-search"></i> Load Customer</button>
        <button class="clear-btn" id="clearCustomerBtn"><i class="fas fa-times"></i> Clear</button>
    </div>

    <!-- Customer Tab Credit Section (visible after loading) -->
    <div id="creditSection" class="credit-card" style="display: none;">
        <div class="credit-info">
            <div class="credit-icon"><i class="fas fa-wallet"></i></div>
            <div class="credit-details">
                <h3>Tab Credit for <span id="customerName">-</span></h3>
                <div class="credit-amount" id="tabCreditAmount">R0.00</div>
            </div>
        </div>
        <button class="topup-btn" id="openTopupBtn"><i class="fas fa-plus-circle"></i> Top Up Credit</button>
    </div>

    <!-- Packages Section (visible after customer loaded) -->
    <div id="packagesSection" class="section" style="display: none;">
        <div class="section-title"><i class="fas fa-gift"></i> Exclusive VVIP Tables</div>
        <div id="packagesContainer" class="packages-grid">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading packages...</div>
        </div>
    </div>

    <!-- Top-up Modal -->
    <div id="topupModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">Top Up Tab Credit</h3>
            <div class="topup-field">
                <label>Amount (R)</label>
                <input type="number" id="topupAmount" min="10" step="10" placeholder="e.g., 500" value="100">
            </div>
            <div style="margin: 20px 0;">
                <div style="font-size: 0.7rem; margin-bottom: 8px;">Select payment method</div>
                <div style="display: flex; gap: 12px;">
                    <button id="topupMethodCard" class="topup-method-btn active">💳 Card (Yoco)</button>
                    <button id="topupMethodWallet" class="topup-method-btn">💰 Rands Wallet</button>
                </div>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="pay-btn pay-tab" id="confirmTopupBtn" style="flex: 1;">Confirm Top-up</button>
                <button class="pay-btn pay-cash" id="cancelTopupBtn" style="flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Info Modal -->
    <div id="infoModal" class="modal-overlay">
        <div class="modal-content">
            <i class="fas fa-crown" style="font-size: 48px; color: var(--red); margin-bottom: 16px;"></i>
            <h3 id="modalTitle" style="margin-bottom: 12px;">Notification</h3>
            <p id="modalMessage" style="margin-bottom: 24px; color: var(--slate);"></p>
            <button class="pay-btn pay-tab" onclick="closeModal()" style="width: auto; padding: 12px 24px;">OK</button>
        </div>
    </div>

    <div id="toastMessage" class="toast"></div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    let currentProfile = null;
    let currentActiveBooking = null;   // existing VVIP booking (for tab credit)
    let currentTabCredit = 0;          // remaining_balance from active booking OR from vvip_tab_accounts
    let currentCreditSource = null;     // 'booking' or 'tab_account'
    let packages = [];
    let selectedTopupMethod = 'card';

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMessage');
        toast.innerText = msg;
        toast.style.background = isError ? '#dc2626' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }
    function showModal(title, message) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalMessage').innerHTML = message;
        document.getElementById('infoModal').classList.add('active');
    }
    window.closeModal = function() {
        document.getElementById('infoModal').classList.remove('active');
    }
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }

    // Load customer by phone or wallet_id, get their current tab credit
    async function loadCustomer() {
        const identifier = document.getElementById('customerIdentifier').value.trim();
        if (!identifier) {
            showToast('Please enter a phone number or wallet ID', true);
            return;
        }
        let profile = null;
        const isPhone = /^[\+]?[0-9]{9,15}$/.test(identifier);
        if (isPhone) {
            const { data, error } = await supabase
                .from('profiles')
                .select('id, name, phone, wallet_id')
                .eq('phone', identifier)
                .maybeSingle();
            if (!error && data) profile = data;
        } else {
            const { data, error } = await supabase
                .from('profiles')
                .select('id, name, phone, wallet_id')
                .eq('wallet_id', identifier)
                .maybeSingle();
            if (!error && data) profile = data;
        }
        if (!profile) {
            showToast('Customer not found. Please check the phone number or wallet ID.', true);
            return;
        }
        currentProfile = profile;
        document.getElementById('customerName').innerText = profile.name || profile.phone || 'Guest';
        
        // Fetch current tab credit – first from active VVIP booking, then from vvip_tab_accounts
        const { data: booking } = await supabase
            .from('vvip_bookings')
            .select('id, remaining_balance')
            .eq('customer_id', profile.id)
            .in('status', ['confirmed', 'checked_in', 'seated'])
            .order('created_at', { ascending: false })
            .maybeSingle();
        
        if (booking && booking.remaining_balance > 0) {
            currentActiveBooking = { id: booking.id, remaining: booking.remaining_balance };
            currentTabCredit = booking.remaining_balance;
            currentCreditSource = 'booking';
        } else {
            // No active booking – check vvip_tab_accounts
            const { data: tabAcc } = await supabase
                .from('vvip_tab_accounts')
                .select('id, balance')
                .eq('user_id', profile.id)
                .maybeSingle();
            if (tabAcc && tabAcc.balance > 0) {
                currentTabCredit = tabAcc.balance;
                currentCreditSource = 'tab_account';
                currentActiveBooking = null;
            } else {
                currentTabCredit = 0;
                currentCreditSource = null;
                currentActiveBooking = null;
            }
        }
        
        document.getElementById('tabCreditAmount').innerHTML = `R${currentTabCredit.toFixed(2)}`;
        document.getElementById('creditSection').style.display = 'flex';
        document.getElementById('packagesSection').style.display = 'block';
        await loadPackages(); // ensure packages loaded
        showToast(`Loaded ${profile.name || profile.phone} | Tab credit: R${currentTabCredit.toFixed(2)}`);
    }

    async function loadPackages() {
        const { data, error } = await supabase
            .from('vvip_packages')
            .select('*')
            .eq('status', 'active')
            .order('price', { ascending: true });
        if (error) {
            showToast('Error loading packages: ' + error.message, true);
            return;
        }
        packages = data || [];
        renderPackages();
    }

    function renderPackages() {
        const container = document.getElementById('packagesContainer');
        if (!packages.length) {
            container.innerHTML = '<div class="loading"><i class="fas fa-crown"></i> No packages available.</div>';
            return;
        }
        container.innerHTML = packages.map(pkg => {
            const tables = pkg.capacity || 0;
            const tabCredit = pkg.tab_credit || 0;
            const benefits = pkg.benefits || [];
            return `
                <div class="package-card">
                    <div class="package-image">
                        ${pkg.image ? `<img src="${pkg.image}" style="width:100%; height:100%; object-fit:cover;">` : '<i class="fas fa-crown"></i>'}
                    </div>
                    <div class="package-content">
                        <div class="package-header">
                            <span class="package-name">${escapeHtml(pkg.name)}</span>
                            <span class="package-price">R${pkg.price}</span>
                        </div>
                        <div class="package-meta">
                            <span><i class="fas fa-table"></i> ${tables} tables</span>
                            <span><i class="fas fa-coins"></i> Tab credit: R${tabCredit}</span>
                        </div>
                        <div class="benefits-list">
                            ${benefits.slice(0, 3).map(b => `<span class="benefit-tag"><i class="fas fa-check"></i> ${escapeHtml(b)}</span>`).join('')}
                            ${benefits.length > 3 ? `<span class="benefit-tag">+${benefits.length-3} more</span>` : ''}
                        </div>
                        <div class="payment-options">
                            <button class="pay-btn pay-tab" data-package='${JSON.stringify(pkg)}' data-method="tab"><i class="fas fa-wallet"></i> Tab Credit</button>
                            <button class="pay-btn pay-cash" data-package='${JSON.stringify(pkg)}' data-method="cash"><i class="fas fa-money-bill"></i> Cash</button>
                            <button class="pay-btn pay-card" data-package='${JSON.stringify(pkg)}' data-method="card"><i class="fas fa-credit-card"></i> Card (Yoco)</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        
        document.querySelectorAll('.pay-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const packageData = JSON.parse(btn.dataset.package);
                const method = btn.dataset.method;
                await handlePackagePurchase(packageData, method);
            });
        });
    }

    async function handlePackagePurchase(pkg, method) {
        if (!currentProfile) {
            showModal('No Customer', 'Please load a customer first.');
            return;
        }
        
        // Tab Credit payment: need existing credit (from booking or tab account) to cover the package price
        if (method === 'tab') {
            if (currentTabCredit < pkg.price) {
                showModal('Insufficient Tab Credit', `You need R${pkg.price} but have only R${currentTabCredit.toFixed(2)}. Please top up or use another payment method.`);
                return;
            }
            // Deduct the package price from current credit source
            let newBalance = currentTabCredit - pkg.price;
            if (currentCreditSource === 'booking' && currentActiveBooking) {
                const { error: updateErr } = await supabase
                    .from('vvip_bookings')
                    .update({ remaining_balance: newBalance })
                    .eq('id', currentActiveBooking.id);
                if (updateErr) throw updateErr;
            } else if (currentCreditSource === 'tab_account') {
                // update vvip_tab_accounts
                const { data: tabAcc } = await supabase
                    .from('vvip_tab_accounts')
                    .select('id')
                    .eq('user_id', currentProfile.id)
                    .single();
                if (tabAcc) {
                    const { error: updateErr } = await supabase
                        .from('vvip_tab_accounts')
                        .update({ balance: newBalance })
                        .eq('id', tabAcc.id);
                    if (updateErr) throw updateErr;
                } else {
                    showModal('Error', 'Tab account not found', true);
                    return;
                }
            } else {
                showModal('Error', 'No active credit source', true);
                return;
            }
            // Create new booking for the package with remaining_balance = pkg.tab_credit
            const bookingRef = `VVIP-${Date.now()}-${Math.floor(Math.random()*10000)}`;
            const { error: insertErr } = await supabase.from('vvip_bookings').insert([{
                package_id: pkg.id,
                customer_id: currentProfile.id,
                customer_phone: currentProfile.phone || '',
                customer_name: currentProfile.name || 'Guest',
                booking_reference: bookingRef,
                quantity: 1,
                total_amount: pkg.price,
                remaining_balance: pkg.tab_credit || 0,
                status: 'confirmed',
                created_at: new Date().toISOString()
            }]);
            if (insertErr) throw insertErr;
            
            // Update sold count
            await supabase.from('vvip_packages').update({ sold_count: (pkg.sold_count || 0) + 1 }).eq('id', pkg.id);
            
            // Refresh local credit (the new booking becomes the active one)
            await loadCustomer(); // reloads the customer's credit (will pick up the new booking)
            showToast(`Package purchased using Tab Credit! New tab credit: R${newBalance.toFixed(2)}`);
        } 
        else if (method === 'cash') {
            // Cash: simply create booking with remaining_balance = pkg.tab_credit
            const bookingRef = `VVIP-${Date.now()}-${Math.floor(Math.random()*10000)}`;
            const { error: insertErr } = await supabase.from('vvip_bookings').insert([{
                package_id: pkg.id,
                customer_id: currentProfile.id,
                customer_phone: currentProfile.phone || '',
                customer_name: currentProfile.name || 'Guest',
                booking_reference: bookingRef,
                quantity: 1,
                total_amount: pkg.price,
                remaining_balance: pkg.tab_credit || 0,
                status: 'confirmed',
                created_at: new Date().toISOString()
            }]);
            if (insertErr) throw insertErr;
            await supabase.from('vvip_packages').update({ sold_count: (pkg.sold_count || 0) + 1 }).eq('id', pkg.id);
            await loadCustomer();
            showToast(`Package reserved for cash payment. Booking ref: ${bookingRef}`);
        }
        else if (method === 'card') {
            // Dummy Yoco – show alert then create booking
            if (confirm(`Pay R${pkg.price} with Yoco card? (Demo – no actual charge)`)) {
                const bookingRef = `VVIP-${Date.now()}-${Math.floor(Math.random()*10000)}`;
                const { error: insertErr } = await supabase.from('vvip_bookings').insert([{
                    package_id: pkg.id,
                    customer_id: currentProfile.id,
                    customer_phone: currentProfile.phone || '',
                    customer_name: currentProfile.name || 'Guest',
                    booking_reference: bookingRef,
                    quantity: 1,
                    total_amount: pkg.price,
                    remaining_balance: pkg.tab_credit || 0,
                    status: 'confirmed',
                    created_at: new Date().toISOString()
                }]);
                if (insertErr) throw insertErr;
                await supabase.from('vvip_packages').update({ sold_count: (pkg.sold_count || 0) + 1 }).eq('id', pkg.id);
                await loadCustomer();
                showToast(`Package purchased with Card! Booking ref: ${bookingRef}`);
            }
        }
    }

    // Top-up functions
    async function topUpTabCredit(amount, method) {
        if (!currentProfile) {
            showModal('No Customer', 'Please load a customer first.');
            return false;
        }
        if (amount < 10) {
            showModal('Invalid Amount', 'Minimum top-up is R10');
            return false;
        }
        if (method === 'card') {
            // Dummy Yoco
            if (confirm(`Pay R${amount} with Yoco card? (Demo)`)) {
                // Add amount to current tab credit source
                let newBalance;
                if (currentCreditSource === 'booking' && currentActiveBooking) {
                    newBalance = currentTabCredit + amount;
                    const { error: updateErr } = await supabase
                        .from('vvip_bookings')
                        .update({ remaining_balance: newBalance })
                        .eq('id', currentActiveBooking.id);
                    if (updateErr) throw updateErr;
                } else if (currentCreditSource === 'tab_account') {
                    const { data: tabAcc } = await supabase
                        .from('vvip_tab_accounts')
                        .select('id')
                        .eq('user_id', currentProfile.id)
                        .single();
                    if (tabAcc) {
                        newBalance = currentTabCredit + amount;
                        const { error: updateErr } = await supabase
                            .from('vvip_tab_accounts')
                            .update({ balance: newBalance })
                            .eq('id', tabAcc.id);
                        if (updateErr) throw updateErr;
                    } else {
                        // create new tab account
                        const { data: newAcc } = await supabase
                            .from('vvip_tab_accounts')
                            .insert({ user_id: currentProfile.id, balance: amount })
                            .select()
                            .single();
                        if (newAcc) newBalance = amount;
                        else throw new Error('Failed to create tab account');
                    }
                } else {
                    // no credit source – create new tab account
                    const { data: newAcc } = await supabase
                        .from('vvip_tab_accounts')
                        .insert({ user_id: currentProfile.id, balance: amount })
                        .select()
                        .single();
                    if (newAcc) newBalance = amount;
                    else throw new Error('Failed to create tab account');
                }
                await loadCustomer(); // refresh display
                showToast(`Topped up R${amount}! New tab credit: R${newBalance.toFixed(2)}`);
                return true;
            }
        } else if (method === 'wallet') {
            // Deduct from Rands Wallet (wallets table)
            const { data: wallet, error: walletErr } = await supabase
                .from('wallets')
                .select('id, balance')
                .eq('user_id', currentProfile.id)
                .single();
            if (walletErr || !wallet) {
                showModal('Wallet Error', 'No Rands Wallet found for this user.');
                return false;
            }
            if (wallet.balance < amount) {
                showModal('Insufficient Wallet Balance', `You have R${wallet.balance.toFixed(2)} in your wallet.`);
                return false;
            }
            const newWalletBalance = wallet.balance - amount;
            const { error: updateWallet } = await supabase
                .from('wallets')
                .update({ balance: newWalletBalance, updated_at: new Date().toISOString() })
                .eq('id', wallet.id);
            if (updateWallet) throw updateWallet;
            
            // Add amount to tab credit source
            let newTabBalance;
            if (currentCreditSource === 'booking' && currentActiveBooking) {
                newTabBalance = currentTabCredit + amount;
                const { error: updateTab } = await supabase
                    .from('vvip_bookings')
                    .update({ remaining_balance: newTabBalance })
                    .eq('id', currentActiveBooking.id);
                if (updateTab) throw updateTab;
            } else if (currentCreditSource === 'tab_account') {
                const { data: tabAcc } = await supabase
                    .from('vvip_tab_accounts')
                    .select('id')
                    .eq('user_id', currentProfile.id)
                    .single();
                if (tabAcc) {
                    newTabBalance = currentTabCredit + amount;
                    const { error: updateTab } = await supabase
                        .from('vvip_tab_accounts')
                        .update({ balance: newTabBalance })
                        .eq('id', tabAcc.id);
                    if (updateTab) throw updateTab;
                } else {
                    const { data: newAcc } = await supabase
                        .from('vvip_tab_accounts')
                        .insert({ user_id: currentProfile.id, balance: amount })
                        .select()
                        .single();
                    if (newAcc) newTabBalance = amount;
                    else throw new Error('Failed to create tab account');
                }
            } else {
                const { data: newAcc } = await supabase
                    .from('vvip_tab_accounts')
                    .insert({ user_id: currentProfile.id, balance: amount })
                    .select()
                    .single();
                if (newAcc) newTabBalance = amount;
                else throw new Error('Failed to create tab account');
            }
            await loadCustomer();
            showToast(`Topped up R${amount} using Rands Wallet! New tab credit: R${newTabBalance.toFixed(2)}`);
            return true;
        }
    }

    // DOM event bindings
    document.getElementById('loadCustomerBtn').addEventListener('click', loadCustomer);
    document.getElementById('clearCustomerBtn').addEventListener('click', () => {
        currentProfile = null;
        currentActiveBooking = null;
        currentTabCredit = 0;
        currentCreditSource = null;
        document.getElementById('creditSection').style.display = 'none';
        document.getElementById('packagesSection').style.display = 'none';
        document.getElementById('customerIdentifier').value = '';
        showToast('Customer cleared');
    });
    document.getElementById('openTopupBtn').addEventListener('click', () => {
        document.getElementById('topupModal').classList.add('active');
    });
    document.getElementById('cancelTopupBtn').addEventListener('click', () => {
        document.getElementById('topupModal').classList.remove('active');
    });
    document.getElementById('topupMethodCard').addEventListener('click', () => {
        selectedTopupMethod = 'card';
        document.getElementById('topupMethodCard').classList.add('active');
        document.getElementById('topupMethodWallet').classList.remove('active');
    });
    document.getElementById('topupMethodWallet').addEventListener('click', () => {
        selectedTopupMethod = 'wallet';
        document.getElementById('topupMethodWallet').classList.add('active');
        document.getElementById('topupMethodCard').classList.remove('active');
    });
    document.getElementById('confirmTopupBtn').addEventListener('click', async () => {
        const amount = parseFloat(document.getElementById('topupAmount').value);
        if (isNaN(amount) || amount < 10) {
            showModal('Invalid Amount', 'Please enter an amount of at least R10');
            return;
        }
        document.getElementById('topupModal').classList.remove('active');
        await topUpTabCredit(amount, selectedTopupMethod);
    });

    // Real-time subscription to refresh credit after any change
    function setupRealtime() {
        if (!currentProfile) return;
        supabase.channel('vvip-store')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_bookings', filter: `customer_id=eq.${currentProfile.id}` }, () => loadCustomer())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_tab_accounts', filter: `user_id=eq.${currentProfile.id}` }, () => loadCustomer())
            .subscribe();
    }
    
    // Initial load (no customer, just show lookup)
    // also preload packages so they're ready
    loadPackages();
    // later when customer loads, realtime will be set
    window.addEventListener('load', () => {
        // realtime subscription will be added after first customer load
        const originalLoad = loadCustomer;
        window.loadCustomer = async function() {
            await originalLoad();
            setupRealtime();
        };
    });
</script>
</body>
