<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Shisha Lounge | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafd;
            padding: 20px;
            color: #1e293b;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .stats-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            flex: 1;
            min-width: 140px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eef2f8;
        }
        .stat-number { font-size: 28px; font-weight: 800; color: #E30613; }
        .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
        .tabs {
            display: flex;
            gap: 8px;
            background: white;
            padding: 6px;
            border-radius: 60px;
            margin-bottom: 24px;
            border: 1px solid #eef2f8;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 60px;
            border: none;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #E30613;
            color: white;
            box-shadow: 0 2px 6px rgba(227,6,19,0.2);
        }
        .panel {
            display: none;
            background: white;
            border-radius: 28px;
            padding: 24px;
            border: 1px solid #eef2f8;
            margin-bottom: 24px;
        }
        .panel.active { display: block; }
        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f172a;
        }
        .add-form {
            background: #f8fafc;
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .add-form input, .add-form select {
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            font-family: inherit;
            flex: 1;
            min-width: 150px;
        }
        .add-form button {
            background: #E30613;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .item-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info .name { font-weight: 700; margin-bottom: 4px; }
        .item-info .meta { font-size: 12px; color: #64748b; }
        .item-actions button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            margin-left: 8px;
            color: #94a3b8;
        }
        .item-actions button.danger { color: #E30613; }
        .device-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 8px;
        }
        .status-available { background: #dcfce7; color: #166534; }
        .status-active { background: #fee2e2; color: #991b1b; }
        .status-refill { background: #fff3e0; color: #ef6c00; }
        .status-paused { background: #fff8e1; color: #ff8f00; }
        .status-expired { background: #e5e7eb; color: #4b5563; }
        .status-maintenance { background: #fef9c3; color: #854d0e; }
        .status-deleted { background: #e2e8f0; color: #475569; text-decoration: line-through; }
        
        .sessions-table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }
        .sessions-table th,
        .sessions-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .sessions-table th {
            background: #f1f5f9;
            font-weight: 600;
            color: #475569;
        }
        .session-status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 60px;
            font-size: 11px;
            font-weight: 600;
        }
        .session-status-active { background: #fee2e2; color: #991b1b; }
        .session-status-refill { background: #fff3e0; color: #ef6c00; }
        .session-status-paused { background: #fff8e1; color: #ff8f00; }
        .session-status-expired { background: #e5e7eb; color: #4b5563; }
        
        .loading-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        .error-state {
            text-align: center;
            padding: 40px;
            color: #e30613;
            background: #fee2e2;
            border-radius: 20px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 500;
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="stat-number" id="flavourCount">-</div><div class="stat-label">Flavours</div></div>
        <div class="stat-card"><div class="stat-number" id="deviceCount">-</div><div class="stat-label">Hookahs</div></div>
        <div class="stat-card"><div class="stat-number" id="locationCount">-</div><div class="stat-label">Locations</div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="flavours">🍃 Flavours</button>
        <button class="tab-btn" data-tab="devices">🔥 Hookah Devices</button>
        <button class="tab-btn" data-tab="locations">📍 Locations</button>
        <button class="tab-btn" data-tab="sessions">⏱️ Active Sessions</button>
    </div>

    <!-- FLAVOURS PANEL -->
    <div id="flavoursPanel" class="panel active">
        <div class="section-title"><i class="fas fa-leaf"></i> Shisha Flavours</div>
        <div class="add-form">
            <input type="text" id="newFlavourName" placeholder="Flavour name (e.g., Double Apple)">
            <input type="number" id="newFlavourPrice" placeholder="Price (R)" value="250" step="10">
            <button id="addFlavourBtn"><i class="fas fa-plus"></i> Add Flavour</button>
        </div>
        <div id="flavoursList" class="items-grid">Loading...</div>
    </div>

    <!-- DEVICES PANEL -->
    <div id="devicesPanel" class="panel">
        <div class="section-title"><i class="fas fa-fire"></i> Hookah Devices</div>
        <div class="add-form">
            <input type="text" id="newDeviceCode" placeholder="Device code (e.g., SH-031)">
            <select id="newDeviceStatus">
                <option value="available">Available</option>
                <option value="maintenance">Maintenance</option>
            </select>
            <button id="addDeviceBtn"><i class="fas fa-plus"></i> Add Custom Device</button>
        </div>
        <div id="devicesList" class="items-grid">Loading...</div>
    </div>

    <!-- LOCATIONS PANEL -->
    <div id="locationsPanel" class="panel">
        <div class="section-title"><i class="fas fa-map-marker-alt"></i> Lounge Locations</div>
        <div class="add-form">
            <input type="text" id="newLocationName" placeholder="Location name (e.g., VIP Terrace)">
            <button id="addLocationBtn"><i class="fas fa-plus"></i> Add Location</button>
        </div>
        <div id="locationsList" class="items-grid">Loading...</div>
    </div>

    <!-- SESSIONS PANEL -->
    <div id="sessionsPanel" class="panel">
        <div class="section-title"><i class="fas fa-hourglass-half"></i> Active Shisha Sessions</div>
        <div id="sessionsList" class="loading-state">Loading active sessions...</div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // ============ CONSTANTS ==========
    const COAL_DURATION = 60; // minutes
    const REFILL_THRESHOLD = 15; // minutes
    const DURATION_SECONDS = COAL_DURATION * 60;
    
    let realtimeSubscription = null;
    let activeSessions = [];

    // ============ HELPER FUNCTIONS ==========
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#b91c1c' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function escapeHtml(str) { 
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m){
            if(m==='&') return '&amp;'; 
            if(m==='<') return '&lt;'; 
            if(m==='>') return '&gt;'; 
            return m;
        }); 
    }

    // Calculate remaining seconds (same logic as POS and Console)
    function calculateRemainingSeconds(session) {
        if (!session) return 0;
        
        if (session.paused || session.status === 'expired') {
            return session.remaining_time_seconds || 0;
        }
        
        const referenceTime = session.last_refill_time ? new Date(session.last_refill_time) : new Date(session.start_time);
        const now = new Date();
        const elapsedSeconds = Math.floor((now - referenceTime) / 1000);
        let remaining = DURATION_SECONDS - elapsedSeconds;
        
        return remaining > 0 ? remaining : 0;
    }

    function formatTime(seconds) {
        if (seconds <= 0) return "EXPIRED";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function determineSessionStatus(session) {
        if (session.paused) return 'paused';
        if (session.status === 'expired') return 'expired';
        
        const remainingSec = calculateRemainingSeconds(session);
        if (remainingSec <= 0) return 'expired';
        if (remainingSec <= REFILL_THRESHOLD * 60) return 'refill';
        return 'active';
    }

    // ========== FLAVOURS ==========
    async function loadFlavours() {
        try {
            const { data, error } = await supabase
                .from('shisha_products')
                .select('*')
                .order('name');
            
            if (error) throw error;
            
            const container = document.getElementById('flavoursList');
            if (!data.length) { 
                container.innerHTML = '<div class="empty-state">No flavours. Add one above.</div>'; 
                return; 
            }
            
            container.innerHTML = data.map(p => `
                <div class="item-card" data-id="${p.id}">
                    <div class="item-info">
                        <div class="name">${escapeHtml(p.name)}</div>
                        <div class="meta">R${p.price} • ${p.is_available ? 'Available' : 'Hidden'}</div>
                    </div>
                    <div class="item-actions">
                        <button class="toggle-availability" data-id="${p.id}" data-avail="${p.is_available}">
                            <i class="fas ${p.is_available ? 'fa-eye-slash' : 'fa-eye'}"></i>
                        </button>
                        <button class="delete-flavour danger" data-id="${p.id}">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            // Attach events
            document.querySelectorAll('.toggle-availability').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const current = btn.dataset.avail === 'true';
                    const { error } = await supabase
                        .from('shisha_products')
                        .update({ is_available: !current })
                        .eq('id', id);
                    
                    if (error) showToast(error.message, true);
                    else { 
                        await loadFlavours(); 
                        showToast('Updated'); 
                    }
                });
            });
            
            document.querySelectorAll('.delete-flavour').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Delete this flavour? This will not delete sessions, but may break old records.')) return;
                    const id = btn.dataset.id;
                    const { error } = await supabase
                        .from('shisha_products')
                        .delete()
                        .eq('id', id);
                    
                    if (error) showToast(error.message, true);
                    else { 
                        await loadFlavours(); 
                        showToast('Deleted'); 
                    }
                });
            });
            
            document.getElementById('flavourCount').innerText = data.length;
        } catch (error) {
            console.error('Error loading flavours:', error);
            showToast('Failed to load flavours', true);
        }
    }

    document.getElementById('addFlavourBtn').onclick = async () => {
        const name = document.getElementById('newFlavourName').value.trim();
        const price = parseFloat(document.getElementById('newFlavourPrice').value);
        
        if (!name || isNaN(price)) { 
            showToast('Enter name and price', true); 
            return; 
        }
        
        const { error } = await supabase
            .from('shisha_products')
            .insert({ name, price, is_available: true });
        
        if (error) showToast(error.message, true);
        else {
            document.getElementById('newFlavourName').value = '';
            document.getElementById('newFlavourPrice').value = '250';
            await loadFlavours();
            showToast('Flavour added');
        }
    };

    // ========== DEVICES ==========
    async function loadDevices() {
        try {
            const { data, error } = await supabase
                .from('hookah_devices')
                .select('*')
                .order('device_code');
            
            if (error) throw error;
            
            const container = document.getElementById('devicesList');
            if (!data.length) { 
                container.innerHTML = '<div class="empty-state">No devices.</div>'; 
                return; 
            }
            
            container.innerHTML = data.map(d => `
                <div class="item-card" data-id="${d.id}">
                    <div class="item-info">
                        <div class="name">${escapeHtml(d.device_code)} ${d.device_name ? `(${escapeHtml(d.device_name)})` : ''}</div>
                        <div class="meta">
                            <span class="device-status status-${d.status}">${d.status}</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        <select class="status-select" data-id="${d.id}" style="padding:4px 8px; border-radius:30px;">
                            <option value="available" ${d.status === 'available' ? 'selected' : ''}>Available</option>
                            <option value="maintenance" ${d.status === 'maintenance' ? 'selected' : ''}>Maintenance</option>
                            <option value="deleted" ${d.status === 'deleted' ? 'selected' : ''}>Deleted</option>
                        </select>
                        <button class="delete-device danger" data-id="${d.id}">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            // Attach status change
            document.querySelectorAll('.status-select').forEach(select => {
                select.addEventListener('change', async () => {
                    const id = select.dataset.id;
                    const newStatus = select.value;
                    const { error } = await supabase
                        .from('hookah_devices')
                        .update({ status: newStatus })
                        .eq('id', id);
                    
                    if (error) showToast(error.message, true);
                    else { 
                        await loadDevices(); 
                        showToast('Device updated'); 
                    }
                });
            });
            
            document.querySelectorAll('.delete-device').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Delete this device? (Soft delete – sets status to deleted)')) return;
                    const id = btn.dataset.id;
                    const { error } = await supabase
                        .from('hookah_devices')
                        .update({ status: 'deleted' })
                        .eq('id', id);
                    
                    if (error) showToast(error.message, true);
                    else { 
                        await loadDevices(); 
                        showToast('Device marked as deleted'); 
                    }
                });
            });
            
            document.getElementById('deviceCount').innerText = data.length;
        } catch (error) {
            console.error('Error loading devices:', error);
            showToast('Failed to load devices', true);
        }
    }

    document.getElementById('addDeviceBtn').onclick = async () => {
        let code = document.getElementById('newDeviceCode').value.trim().toUpperCase();
        if (!code) { 
            showToast('Enter device code (e.g., SH-031)', true); 
            return; 
        }
        
        const status = document.getElementById('newDeviceStatus').value;
        const { error } = await supabase
            .from('hookah_devices')
            .insert({ device_code: code, status });
        
        if (error) showToast(error.message, true);
        else {
            document.getElementById('newDeviceCode').value = '';
            await loadDevices();
            showToast('Device added');
        }
    };

    // ========== LOCATIONS ==========
    async function loadLocations() {
        try {
            const { data, error } = await supabase
                .from('shisha_locations')
                .select('*')
                .order('name');
            
            if (error) throw error;
            
            const container = document.getElementById('locationsList');
            if (!data.length) { 
                container.innerHTML = '<div class="empty-state">No locations. Add one above.</div>'; 
                return; 
            }
            
            container.innerHTML = data.map(l => `
                <div class="item-card" data-id="${l.id}">
                    <div class="item-info">
                        <div class="name">${escapeHtml(l.name)}</div>
                        <div class="meta">${l.is_active ? 'Active' : 'Inactive'}</div>
                    </div>
                    <div class="item-actions">
                        <button class="toggle-location" data-id="${l.id}" data-active="${l.is_active}">
                            <i class="fas ${l.is_active ? 'fa-eye-slash' : 'fa-eye'}"></i>
                        </button>
                        <button class="delete-location danger" data-id="${l.id}">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.toggle-location').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const current = btn.dataset.active === 'true';
                    const { error } = await supabase
                        .from('shisha_locations')
                        .update({ is_active: !current })
                        .eq('id', id);
                    
                    if (error) showToast(error.message, true);
                    else { 
                        await loadLocations(); 
                        showToast('Updated'); 
                    }
                });
            });
            
            document.querySelectorAll('.delete-location').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm('Delete this location? Sessions will keep location reference but name may disappear.')) return;
                    const id = btn.dataset.id;
                    const { error } = await supabase
                        .from('shisha_locations')
                        .delete()
                        .eq('id', id);
                    
                    if (error) showToast(error.message, true);
                    else { 
                        await loadLocations(); 
                        showToast('Deleted'); 
                    }
                });
            });
            
            document.getElementById('locationCount').innerText = data.length;
        } catch (error) {
            console.error('Error loading locations:', error);
            showToast('Failed to load locations', true);
        }
    }

    document.getElementById('addLocationBtn').onclick = async () => {
        const name = document.getElementById('newLocationName').value.trim();
        if (!name) { 
            showToast('Enter location name', true); 
            return; 
        }
        
        const { error } = await supabase
            .from('shisha_locations')
            .insert({ name });
        
        if (error) showToast(error.message, true);
        else {
            document.getElementById('newLocationName').value = '';
            await loadLocations();
            showToast('Location added');
        }
    };

    // ========== ACTIVE SESSIONS (FIXED) ==========
    async function loadActiveSessions() {
        const container = document.getElementById('sessionsList');
        container.innerHTML = '<div class="loading-state">Loading active sessions...</div>';
        
        try {
            // Use the same query structure as POS and Console
            const { data, error } = await supabase
                .from('shisha_sessions')
                .select(`
                    id,
                    device_id,
                    product_id,
                    location_id,
                    start_time,
                    last_refill_time,
                    remaining_time_seconds,
                    total_amount,
                    refill_count,
                    status,
                    paused,
                    payment_method,
                    customer_phone,
                    hookah_devices!inner (device_code),
                    shisha_products!inner (name, price),
                    shisha_locations!inner (name)
                `)
                .in('status', ['active', 'refill', 'paused'])
                .order('start_time', { ascending: false });
            
            if (error) throw error;
            
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty-state">No active sessions at the moment.</div>';
                activeSessions = [];
                return;
            }
            
            // Process sessions with status determination (same as Console)
            activeSessions = data.map(session => {
                const sessionData = {
                    id: session.id,
                    deviceId: session.device_id,
                    deviceCode: session.hookah_devices?.device_code || 'Unknown',
                    flavour: session.shisha_products?.name || 'Unknown',
                    flavourPrice: session.shisha_products?.price || 250,
                    location: session.shisha_locations?.name || 'Unknown',
                    startTime: new Date(session.start_time),
                    lastRefillTime: session.last_refill_time ? new Date(session.last_refill_time) : null,
                    remaining_time_seconds: session.remaining_time_seconds,
                    total_amount: session.total_amount,
                    refillCount: session.refill_count || 0,
                    status: session.status,
                    paused: session.paused,
                    paymentMethod: session.payment_method,
                    customer_phone: session.customer_phone || 'Walk-in'
                };
                
                // Update status based on timer if not paused
                if (!sessionData.paused && sessionData.status !== 'expired') {
                    const determinedStatus = determineSessionStatus(sessionData);
                    if (determinedStatus !== sessionData.status) {
                        sessionData.status = determinedStatus;
                        // Update in database asynchronously
                        supabase
                            .from('shisha_sessions')
                            .update({ status: determinedStatus })
                            .eq('id', sessionData.id)
                            .then(({ error }) => {
                                if (error) console.error('Error updating session status:', error);
                            });
                    }
                }
                
                return sessionData;
            });
            
            // Render sessions table
            const html = `
                <table class="sessions-table">
                    <thead>
                        <tr>
                            <th>Device</th>
                            <th>Flavour</th>
                            <th>Location</th>
                            <th>Time Left</th>
                            <th>Status</th>
                            <th>Customer</th>
                            <th>Total</th>
                            <th>Refills</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${activeSessions.map(s => {
                            const remainingSec = calculateRemainingSeconds(s);
                            const timeLeft = remainingSec <= 0 ? 'EXPIRED' : formatTime(remainingSec);
                            const statusClass = s.paused ? 'paused' : (s.status === 'refill' ? 'refill' : (s.status === 'expired' ? 'expired' : 'active'));
                            const statusText = s.paused ? 'Paused' : (s.status === 'refill' ? 'Refill Soon' : (s.status === 'expired' ? 'Expired' : 'Active'));
                            
                            return `
                                <tr>
                                    <td style="padding:12px;"><strong>${escapeHtml(s.deviceCode)}</strong></td>
                                    <td>${escapeHtml(s.flavour)}</td>
                                    <td>${escapeHtml(s.location)}</td>
                                    <td><span style="font-family: monospace; font-weight: 600;">${timeLeft}</span></td>
                                    <td><span class="session-status-badge session-status-${statusClass}">${statusText}</span></td>
                                    <td>${escapeHtml(s.customer_phone)}</td>
                                    <td>R${s.total_amount}</td>
                                    <td>${s.refillCount}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
            
            container.innerHTML = html;
            
        } catch (error) {
            console.error('Error loading active sessions:', error);
            container.innerHTML = `<div class="error-state">
                <i class="fas fa-exclamation-triangle"></i><br>
                Failed to load sessions: ${error.message}<br>
                <small>Check console for details</small>
            </div>`;
            showToast('Failed to load active sessions', true);
        }
    }

    // Auto-refresh timer display
    function startTimerUpdater() {
        setInterval(() => {
            const sessionsPanel = document.getElementById('sessionsPanel');
            if (sessionsPanel.classList.contains('active') && activeSessions.length > 0) {
                // Update only the time cells without full reload
                const rows = document.querySelectorAll('#sessionsList tbody tr');
                rows.forEach((row, index) => {
                    if (index < activeSessions.length) {
                        const session = activeSessions[index];
                        const remainingSec = calculateRemainingSeconds(session);
                        const timeLeft = remainingSec <= 0 ? 'EXPIRED' : formatTime(remainingSec);
                        const timeCell = row.cells[3];
                        if (timeCell) {
                            timeCell.innerHTML = `<span style="font-family: monospace; font-weight: 600;">${timeLeft}</span>`;
                            
                            // Update status if needed
                            if (remainingSec <= 0 && session.status !== 'expired') {
                                const statusCell = row.cells[4];
                                statusCell.innerHTML = '<span class="session-status-badge session-status-expired">Expired</span>';
                            } else if (remainingSec <= REFILL_THRESHOLD * 60 && session.status !== 'refill' && remainingSec > 0) {
                                const statusCell = row.cells[4];
                                statusCell.innerHTML = '<span class="session-status-badge session-status-refill">Refill Soon</span>';
                            }
                        }
                    }
                });
            }
        }, 1000);
    }

    // ============ REALTIME SUBSCRIPTIONS ==========
    function setupRealtimeSubscriptions() {
        if (realtimeSubscription) {
            realtimeSubscription.unsubscribe();
        }
        
        realtimeSubscription = supabase
            .channel('shisha-admin-changes')
            .on('postgres_changes', 
                { event: '*', schema: 'public', table: 'shisha_sessions' }, 
                (payload) => {
                    console.log('Session change detected, reloading...', payload);
                    const sessionsPanel = document.getElementById('sessionsPanel');
                    if (sessionsPanel.classList.contains('active')) {
                        loadActiveSessions();
                    }
                }
            )
            .on('postgres_changes', 
                { event: '*', schema: 'public', table: 'shisha_products' }, 
                () => {
                    const flavoursPanel = document.getElementById('flavoursPanel');
                    if (flavoursPanel.classList.contains('active')) {
                        loadFlavours();
                    }
                }
            )
            .on('postgres_changes', 
                { event: '*', schema: 'public', table: 'hookah_devices' }, 
                () => {
                    const devicesPanel = document.getElementById('devicesPanel');
                    if (devicesPanel.classList.contains('active')) {
                        loadDevices();
                    }
                }
            )
            .on('postgres_changes', 
                { event: '*', schema: 'public', table: 'shisha_locations' }, 
                () => {
                    const locationsPanel = document.getElementById('locationsPanel');
                    if (locationsPanel.classList.contains('active')) {
                        loadLocations();
                    }
                }
            )
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    console.log('Realtime subscription active for Admin panel');
                } else if (status === 'CHANNEL_ERROR') {
                    console.error('Realtime subscription error');
                }
            });
    }

    // ========== TAB SWITCHING ==========
    async function switchTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`${tabId}Panel`).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
        
        // Load data based on tab
        if (tabId === 'sessions') {
            await loadActiveSessions();
        } else if (tabId === 'flavours') {
            await loadFlavours();
        } else if (tabId === 'devices') {
            await loadDevices();
        } else if (tabId === 'locations') {
            await loadLocations();
        }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // ========== INITIALIZATION ==========
    async function init() {
        try {
            // Test connection
            const { error: testError } = await supabase.from('shisha_products').select('count', { count: 'exact', head: true });
            if (testError) throw testError;
            
            // Load initial data
            await Promise.all([
                loadFlavours(),
                loadDevices(),
                loadLocations(),
                loadActiveSessions()
            ]);
            
            // Setup realtime subscriptions
            setupRealtimeSubscriptions();
            
            // Start timer updater for live countdown
            startTimerUpdater();
            
            console.log('Shisha Admin initialized successfully');
        } catch(e) {
            console.error('Initialization error:', e);
            showToast('Supabase connection error. Please check your configuration.', true);
            const sessionsContainer = document.getElementById('sessionsList');
            sessionsContainer.innerHTML = `<div class="error-state">
                <i class="fas fa-database"></i><br>
                Database connection error<br>
                <small>${e.message}</small>
            </div>`;
        }
    }
    
    init();
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
        if (realtimeSubscription) {
            realtimeSubscription.unsubscribe();
        }
    });
</script>
</body>
</html>
