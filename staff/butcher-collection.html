<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Collection Counter · Rands Staff Console</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0D0F12;
            min-height: 100vh;
            padding: 0;
            margin: 0;
            color: #F0F2F8;
        }

        /* ========== DARK THEME – MATCH STAFF CONSOLE ========== */
        :root {
            --red: #E30613;
            --red-dark: #a0010e;
            --red-dim: rgba(227,6,19,0.12);
            --red-border: rgba(227,6,19,0.25);
            --bg: #0D0F12;
            --surface: #141720;
            --surface2: #1C2030;
            --surface3: #232840;
            --border: rgba(255,255,255,0.06);
            --border2: rgba(255,255,255,0.1);
            --text: #F0F2F8;
            --text2: #8B92A8;
            --text3: #555E78;
            --green: #22C55E;
            --amber: #F59E0B;
            --gold: #FBBF24;
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.4);
            --shadow-md: 0 8px 20px -6px rgba(0,0,0,0.5);
            --radius-full: 9999px;
            --radius-lg: 24px;
            --radius-md: 20px;
            --transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .collection-panel {
            width: 100%;
            max-width: 100%;
            background: var(--bg);
            border-radius: 0;
            overflow: hidden;
        }

        /* Stats row – dark */
        .stats-row {
            background: var(--surface);
            padding: 14px 20px;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid var(--border);
        }

        .ready-counter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--red-dim);
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--red);
            border: 1px solid var(--red-border);
        }
        .ready-counter i {
            font-size: 0.9rem;
        }
        .ready-counter span {
            font-size: 1.3rem;
            font-weight: 800;
            margin: 0 3px;
            color: var(--red);
        }

        /* Orders grid – clean card layout */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 18px;
            padding: 20px;
            background: var(--bg);
            max-height: calc(100vh - 90px);
            overflow-y: auto;
        }

        /* Order card – dark theme */
        .order-card {
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid var(--border);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            position: relative;
        }
        .order-card:hover {
            border-color: var(--red-border);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        /* VVIP card – gold accent */
        .order-card.vvip-card {
            border-left: 4px solid var(--gold);
            background: linear-gradient(145deg, var(--surface), rgba(251,191,36,0.05));
            position: relative;
        }
        .order-card.vvip-card::before {
            content: "⚡ VVIP";
            position: absolute;
            top: -10px;
            right: 18px;
            background: var(--gold);
            color: #1e1a0c;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            z-index: 5;
            box-shadow: var(--shadow-sm);
        }
        .vvip-badge {
            background: var(--gold);
            color: #1e1a0c;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 30px;
            margin-left: 8px;
            display: inline-block;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px 6px 18px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .order-number {
            background: var(--red);
            color: white;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 5px 14px;
            border-radius: 40px;
            font-family: 'Inter', monospace;
            letter-spacing: 0.2px;
        }
        .ready-badge {
            background: var(--green);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .source-badge {
            background: var(--red-dim);
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--red);
        }

        .customer-block {
            margin: 10px 18px;
            background: var(--surface2);
            border-radius: 18px;
            padding: 12px 14px;
            border: 1px solid var(--border);
        }
        .customer-name {
            font-weight: 800;
            color: var(--text);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .customer-phone {
            font-size: 0.7rem;
            color: var(--text2);
            margin-top: 6px;
            font-family: monospace;
        }
        .ready-time {
            font-size: 10px;
            margin-top: 6px;
            color: var(--text3);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .items-preview {
            margin: 10px 18px;
            background: var(--surface2);
            border-radius: 16px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            max-height: 130px;
            overflow-y: auto;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.75rem;
            font-weight: 500;
            border-bottom: 1px solid var(--border);
            color: var(--text2);
        }
        .item-row:last-child {
            border-bottom: none;
        }
        .item-name {
            color: var(--text);
        }
        .item-price {
            color: var(--red);
            font-weight: 700;
        }

        .order-total-row {
            margin: 12px 18px 14px 18px;
            text-align: right;
            padding-top: 10px;
            border-top: 2px solid var(--red);
            font-size: 1rem;
            font-weight: 800;
            color: var(--red);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            align-items: baseline;
        }
        .total-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text2);
        }

        .collect-action {
            padding: 4px 18px 20px 18px;
        }
        .btn-collect {
            width: 100%;
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            border: none;
            padding: 12px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            color: white;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .btn-collect:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(227,6,19,0.3);
        }
        .btn-collect:active {
            transform: scale(0.98);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--surface);
            border-radius: 32px;
            color: var(--text2);
            border: 1px dashed var(--red-border);
        }
        .empty-state i {
            font-size: 52px;
            color: var(--red);
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 0.85rem;
        }

        /* Scrollbar */
        .orders-grid::-webkit-scrollbar {
            width: 5px;
        }
        .orders-grid::-webkit-scrollbar-track {
            background: var(--surface2);
            border-radius: 10px;
        }
        .orders-grid::-webkit-scrollbar-thumb {
            background: var(--red);
            border-radius: 10px;
        }

        /* Live footer – dark */
        .live-footer {
            display: flex;
            justify-content: flex-end;
            padding: 8px 20px 12px 20px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            font-size: 0.65rem;
            color: var(--text2);
            align-items: center;
            gap: 8px;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        @media (max-width: 640px) {
            .orders-grid {
                grid-template-columns: 1fr;
                padding: 14px;
            }
            .stats-row {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
<div class="collection-panel">
    <!-- Stats row: ready orders count -->
    <div class="stats-row">
        <div class="ready-counter">
            <i class="fas fa-utensils"></i>
            <span id="readyCountValue">0</span> ready for pickup
        </div>
    </div>

    <!-- Orders grid -->
    <div id="ordersGrid" class="orders-grid">
        <div class="empty-state">
            <i class="fas fa-hand-peace"></i>
            <p>Loading orders ...</p>
        </div>
    </div>

    <!-- Connection status -->
    <div class="live-footer">
        <div class="live-dot"></div>
        <span id="connText">Connected</span>
        <i class="fas fa-check-circle" style="color: var(--green); font-size: 9px;"></i>
    </div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    const BUTCHER_VENDOR = "The Butcher Shop";
    let lastReadyCount = 0;
    let realtimeSub = null;
    let soundEnabled = true;

    function showBriefMessage(msg, isNewOrder = false, isVVIP = false) {
        const connSpan = document.getElementById('connText');
        if (connSpan) {
            const original = connSpan.innerText;
            connSpan.innerHTML = isNewOrder ? `✨ ${msg}` : msg;
            setTimeout(() => {
                if (connSpan) connSpan.innerText = original;
            }, 2500);
        }
        if (isNewOrder && soundEnabled) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (isVVIP) {
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else {
                    osc.frequency.setValueAtTime(660, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e) { /* silent fallback */ }
        }
    }

    async function fetchReadyOrders() {
        console.log("🔄 Fetching ready orders for vendor:", BUTCHER_VENDOR);
        
        const { data, error } = await supabase
            .from('orders')
            .select('*')
            .eq('vendor', BUTCHER_VENDOR)
            .eq('status', 'ready')
            .order('is_vvip', { ascending: false })
            .order('updated_at', { ascending: true });
        
        if (error) {
            console.error("❌ Supabase error:", error);
            document.getElementById('connText').innerHTML = "⚠️ Query error";
            return [];
        }
        
        console.log(`📦 Found ${data?.length || 0} ready orders`);
        
        if (!data || data.length === 0) return [];
        
        return data.map(order => ({
            ...order,
            orderId: order.order_number || order.id,
            orderNumber: order.order_number,
            items: order.items || [],
            total: order.total || order.total_amount || 0,
            source: order.source || (order.payment_source === 'wallet' ? 'wallet' : 'kiosk'),
            status: order.status,
            bandName: order.customer_name || (order.source === 'kiosk' ? 'Guest' : 'Customer'),
            phoneNumber: order.phone || order.customer_phone || '',
            timestamp: order.created_at ? new Date(order.created_at).toLocaleTimeString() : '',
            isVVIP: order.is_vvip === true,
            readyAt: order.updated_at,
            vendor: order.vendor
        }));
    }

    async function markCollected(orderNumber, orderId) {
        try {
            console.log(`🔄 Marking order #${orderNumber} as collected`);
            
            const { error: updateErr } = await supabase
                .from('orders')
                .update({ 
                    status: 'collected', 
                    updated_at: new Date().toISOString()
                })
                .eq('order_number', orderNumber)
                .eq('vendor', BUTCHER_VENDOR)
                .eq('status', 'ready');
            
            if (updateErr) {
                console.error("❌ Update error:", updateErr);
                throw updateErr;
            }
            
            showBriefMessage(`✅ Order #${orderNumber} collected!`, false);
            await renderOrders();
            return true;
        } catch (err) {
            console.error("❌ Failed to collect order:", err);
            showBriefMessage(`Failed to collect #${orderNumber}`, false);
            return false;
        }
    }

    async function renderOrders() {
        const orders = await fetchReadyOrders();
        orders.sort((a, b) => (b.isVVIP ? 1 : 0) - (a.isVVIP ? 1 : 0));
        
        const readyCount = orders.length;
        document.getElementById('readyCountValue').innerText = readyCount;
        
        if (readyCount > lastReadyCount && lastReadyCount !== 0) {
            const newCount = readyCount - lastReadyCount;
            const hasVVIP = orders.slice(0, newCount).some(o => o.isVVIP);
            showBriefMessage(`${newCount} new order(s) ready!`, true, hasVVIP);
        }
        lastReadyCount = readyCount;
        
        const gridContainer = document.getElementById('ordersGrid');
        if (orders.length === 0) {
            gridContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-plate-wheat"></i>
                    <p>No orders ready for pickup</p>
                    <p style="font-size:12px; margin-top:6px;">Ready orders will appear here</p>
                </div>
            `;
            return;
        }
        
        gridContainer.innerHTML = orders.map(order => {
            const isVVIP = order.isVVIP === true;
            const vvipCardClass = isVVIP ? 'vvip-card' : '';
            const sourceLabel = order.source === 'wallet' ? '💰 Wallet' : '📱 Kiosk';
            
            let readyTimeAgo = 'just now';
            if (order.readyAt) {
                const diffMins = Math.floor((Date.now() - new Date(order.readyAt).getTime()) / 60000);
                if (diffMins < 1) readyTimeAgo = 'just now';
                else if (diffMins === 1) readyTimeAgo = '1 min ago';
                else readyTimeAgo = `${diffMins} min ago`;
            }
            
            const itemsToShow = order.items && Array.isArray(order.items) && order.items.length ? order.items : [];
            
            return `
                <div class="order-card ${vvipCardClass}">
                    <div class="card-header">
                        <span class="order-number">#${escapeHtml(String(order.orderNumber || order.orderId))}</span>
                        <div style="display: flex; gap: 6px;">
                            <span class="source-badge">${sourceLabel}</span>
                            <span class="ready-badge"><i class="fas fa-check-circle"></i> READY</span>
                        </div>
                    </div>
                    
                    <div class="customer-block">
                        <div class="customer-name">
                            <i class="fas fa-user" style="color: var(--red);"></i> ${escapeHtml(order.bandName)}
                            ${isVVIP ? '<span class="vvip-badge"><i class="fas fa-crown"></i> VVIP</span>' : ''}
                        </div>
                        ${order.phoneNumber ? `<div class="customer-phone"><i class="fas fa-phone-alt"></i> ${escapeHtml(order.phoneNumber)}</div>` : ''}
                        <div class="ready-time">
                            <i class="far fa-clock"></i> Ready ${readyTimeAgo}
                        </div>
                    </div>
                    
                    <div class="items-preview">
                        ${itemsToShow.length ? itemsToShow.slice(0, 4).map(item => `
                            <div class="item-row">
                                <span class="item-name">${item.quantity || 1}× ${escapeHtml(item.name || item.product_name || 'Item')}</span>
                                <span class="item-price">R${((item.price || item.unit_price || 0) * (item.quantity || 1)).toFixed(2)}</span>
                            </div>
                        `).join('') : '<div class="item-row"><span>Butcher special selection</span></div>'}
                        ${itemsToShow.length > 4 ? `<div style="font-size: 10px; color: var(--text3); margin-top: 4px;">+${itemsToShow.length-4} more items</div>` : ''}
                    </div>
                    
                    <div class="order-total-row">
                        <span class="total-label">TOTAL</span>
                        <span>R${(order.total || 0).toFixed(2)}</span>
                    </div>
                    
                    <div class="collect-action">
                        <button class="btn-collect" onclick="window.handleCollect('${order.orderNumber}', '${order.id}')">
                            <i class="fas fa-hand-peace"></i> Confirm Collection
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.handleCollect = async (orderNumber, orderId) => {
        await markCollected(orderNumber, orderId);
    };

    function setupRealtimeSubscription() {
        if (realtimeSub) {
            try { realtimeSub.unsubscribe(); } catch(e) {}
        }
        
        realtimeSub = supabase
            .channel('butcher-collection-clean')
            .on('postgres_changes', { 
                event: '*', 
                schema: 'public', 
                table: 'orders',
                filter: `vendor=eq.${BUTCHER_VENDOR}` 
            }, (payload) => {
                console.log("🔔 Realtime change:", payload.eventType, payload.new?.status);
                renderOrders();
            })
            .subscribe((status) => {
                console.log("📡 Realtime subscription status:", status);
                const connSpan = document.getElementById('connText');
                if (connSpan) {
                    if (status === 'SUBSCRIBED') connSpan.innerText = 'Live · ready orders';
                    else connSpan.innerText = 'Connected';
                }
            });
    }

    async function init() {
        console.log("🚀 Initializing Collection Screen...");
        await renderOrders();
        setupRealtimeSubscription();
        
        setInterval(() => {
            renderOrders();
        }, 5000);
        
        const { error } = await supabase.from('orders').select('count', { count: 'exact', head: true });
        const connSpan = document.getElementById('connText');
        if (connSpan) {
            if (error) connSpan.innerText = 'reconnecting...';
            else connSpan.innerText = 'ready for pickup';
        }
    }
    
    init();
</script>
</body>
</html>
