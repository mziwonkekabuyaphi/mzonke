<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VVIP Staff Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #b30000;
        }
        .header h1 { color: #ff4d4d; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            background: #1a1a1a;
            padding: 8px;
            border-radius: 60px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 60px;
            border: none;
            background: transparent;
            color: #aaa;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #b30000;
            color: white;
        }
        .panel { display: none; }
        .panel.active { display: block; }
        .bookings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .booking-card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 20px;
            border-left: 4px solid #b30000;
            transition: 0.2s;
        }
        .booking-card.checked-in { border-left-color: #00a86b; }
        .booking-card.seated { border-left-color: #ffd700; }
        .booking-card.completed { border-left-color: #888; opacity: 0.7; }
        .booking-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .booking-ref {
            font-family: monospace;
            background: #2a2a2a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .booking-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-confirmed { background: #ffaa00; color: #1a1a1a; }
        .status-checked_in { background: #00a86b; color: white; }
        .status-seated { background: #ffd700; color: #1a1a1a; }
        .status-completed { background: #666; color: white; }
        .booking-details {
            margin: 15px 0;
            padding: 12px;
            background: #2a2a2a;
            border-radius: 12px;
        }
        .booking-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .action-checkin { background: #00a86b; color: white; }
        .action-seat { background: #ffd700; color: #1a1a1a; }
        .action-complete { background: #888; color: white; }
        .action-cancel { background: #dc2626; color: white; }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid #b30000;
        }
        .stat-number { font-size: 28px; font-weight: 800; color: #ff4d4d; }
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            background: #1a1a1a;
            border: 1px solid #b30000;
            border-radius: 40px;
            color: white;
        }
        .btn-refresh {
            background: #2a2a2a;
            border: 1px solid #b30000;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .bookings-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-crown"></i> VVIP Staff Dashboard</h1>
        <button class="btn-refresh" onclick="loadAllData()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="stat-number" id="totalBookings">-</div><div class="stat-label">Total Bookings</div></div>
        <div class="stat-card"><div class="stat-number" id="checkedInCount">-</div><div class="stat-label">Checked In</div></div>
        <div class="stat-card"><div class="stat-number" id="seatedCount">-</div><div class="stat-label">Seated</div></div>
        <div class="stat-card"><div class="stat-number" id="revenueToday">-</div><div class="stat-label">Today's Revenue</div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-status="all">All Bookings</button>
        <button class="tab-btn" data-status="confirmed">Pending Check-in</button>
        <button class="tab-btn" data-status="checked_in">Checked In</button>
        <button class="tab-btn" data-status="seated">Seated</button>
        <button class="tab-btn" data-status="completed">Completed</button>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by reference, name, or phone...">
        <button class="btn-refresh" onclick="applySearch()"><i class="fas fa-search"></i> Search</button>
    </div>

    <div id="bookingsPanel" class="panel active">
        <div id="bookingsGrid" class="bookings-grid">
            <div style="text-align: center; padding: 40px;">Loading bookings...</div>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    let allBookings = [];
    let currentFilter = 'all';
    let currentSearch = '';

    async function loadStats() {
        const { data: bookings } = await supabase.from('vvip_bookings').select('status, total_amount, created_at');
        
        const total = bookings?.length || 0;
        const checkedIn = bookings?.filter(b => b.status === 'checked_in').length || 0;
        const seated = bookings?.filter(b => b.status === 'seated').length || 0;
        
        const today = new Date().toISOString().split('T')[0];
        const todayRevenue = bookings?.filter(b => b.created_at?.startsWith(today) && b.status === 'completed')
            .reduce((sum, b) => sum + (b.total_amount || 0), 0) || 0;
        
        document.getElementById('totalBookings').innerText = total;
        document.getElementById('checkedInCount').innerText = checkedIn;
        document.getElementById('seatedCount').innerText = seated;
        document.getElementById('revenueToday').innerText = 'R' + todayRevenue.toLocaleString();
    }

    async function loadBookings() {
        let query = supabase
            .from('vvip_bookings')
            .select(`
                *,
                packages:vvip_packages(name, price, capacity, image),
                customer:profiles(name, phone)
            `)
            .order('created_at', { ascending: false });
        
        const { data, error } = await query;
        if (error) {
            console.error('Error loading bookings:', error);
            return;
        }
        
        allBookings = data || [];
        renderBookings();
        loadStats();
    }

    function renderBookings() {
        let filtered = allBookings;
        
        if (currentFilter !== 'all') {
            filtered = filtered.filter(b => b.status === currentFilter);
        }
        
        if (currentSearch) {
            const searchLower = currentSearch.toLowerCase();
            filtered = filtered.filter(b => 
                (b.booking_reference || '').toLowerCase().includes(searchLower) ||
                (b.customer_name || '').toLowerCase().includes(searchLower) ||
                (b.customer_phone || '').includes(searchLower)
            );
        }
        
        const container = document.getElementById('bookingsGrid');
        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 60px; color: #666;"><i class="fas fa-ticket-alt" style="font-size: 48px; margin-bottom: 16px;"></i><p>No bookings found</p></div>';
            return;
        }
        
        container.innerHTML = filtered.map(booking => {
            const statusClass = `status-${booking.status}`;
            const statusText = booking.status.replace('_', ' ').toUpperCase();
            const packageName = booking.packages?.name || 'VVIP Package';
            
            let actionButtons = '';
            if (booking.status === 'confirmed') {
                actionButtons = `<button class="action-btn action-checkin" onclick="updateBookingStatus('${booking.id}', 'checked_in')"><i class="fas fa-check-circle"></i> Check In</button>
                                 <button class="action-btn action-cancel" onclick="updateBookingStatus('${booking.id}', 'cancelled')"><i class="fas fa-times"></i> Cancel</button>`;
            } else if (booking.status === 'checked_in') {
                actionButtons = `<button class="action-btn action-seat" onclick="updateBookingStatus('${booking.id}', 'seated')"><i class="fas fa-chair"></i> Mark Seated</button>
                                 <button class="action-btn action-cancel" onclick="updateBookingStatus('${booking.id}', 'cancelled')">Cancel</button>`;
            } else if (booking.status === 'seated') {
                actionButtons = `<button class="action-btn action-complete" onclick="updateBookingStatus('${booking.id}', 'completed')"><i class="fas fa-check-double"></i> Complete</button>`;
            }
            
            return `
                <div class="booking-card ${booking.status}">
                    <div class="booking-header">
                        <span class="booking-ref"><i class="fas fa-ticket-alt"></i> ${booking.booking_reference}</span>
                        <span class="booking-status ${statusClass}">${statusText}</span>
                    </div>
                    <div><strong>${escapeHtml(packageName)}</strong></div>
                    <div class="booking-details">
                        <div><i class="fas fa-user"></i> ${escapeHtml(booking.customer_name || booking.customer_phone)}</div>
                        <div><i class="fas fa-phone"></i> ${booking.customer_phone}</div>
                        <div><i class="fas fa-calendar"></i> Booked: ${new Date(booking.created_at).toLocaleDateString()}</div>
                        <div><i class="fas fa-money-bill"></i> Amount: <strong style="color:#ffd700;">R${booking.total_amount}</strong></div>
                    </div>
                    <div class="booking-actions">
                        ${actionButtons}
                    </div>
                </div>
            `;
        }).join('');
    }

    window.updateBookingStatus = async function(bookingId, newStatus) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) return;
        
        const updateData = { status: newStatus };
        if (newStatus === 'checked_in') updateData.check_in_time = new Date().toISOString();
        if (newStatus === 'seated') updateData.seated_time = new Date().toISOString();
        if (newStatus === 'completed') updateData.completed_time = new Date().toISOString();
        if (newStatus === 'cancelled') updateData.cancelled_time = new Date().toISOString();
        
        const { error } = await supabase.from('vvip_bookings').update(updateData).eq('id', bookingId);
        if (error) {
            alert('Error updating status: ' + error.message);
        } else {
            await loadBookings();
        }
    };

    window.applySearch = function() {
        currentSearch = document.getElementById('searchInput').value;
        renderBookings();
    };

    window.loadAllData = function() {
        loadBookings();
    };

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.status;
            renderBookings();
        });
    });

    // Real-time subscriptions
    supabase.channel('vvip_bookings_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_bookings' }, () => {
            loadBookings();
        })
        .subscribe();

    // Initial load
    loadBookings();

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
