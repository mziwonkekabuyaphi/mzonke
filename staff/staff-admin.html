<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Staff Management | Admin + HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --rands-red: #dc2626; --rands-red-dark: #b91c1c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background-color: #f9fafb; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--rands-red); border-radius: 4px; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
        .modal-enter { animation: modalFadeIn 0.3s ease-out; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid var(--rands-red); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .role-badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .status-badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; }
        .tab-btn {
            padding: 0.5rem 1.25rem;
            font-weight: 600;
            border-radius: 9999px;
            transition: all 0.2s;
            cursor: pointer;
            background: transparent;
            border: none;
            font-size: 0.85rem;
        }
        .tab-btn.active {
            background: var(--rands-red);
            color: white;
            box-shadow: 0 2px 6px rgba(220,38,38,0.3);
        }
        .tab-btn:not(.active):hover {
            background: #f3f4f6;
        }
        .payroll-row input { width: 90px; padding: 0.25rem; border-radius: 6px; border: 1px solid #ddd; }
        .activity-feed { max-height: 500px; overflow-y: auto; }
        .shift-card { transition: all 0.2s; }
        .screen-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e6f7e6;
            color: #2e7d32;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid #a5d6a7;
        }
        .screen-chip i { font-size: 0.65rem; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="w-full">
        <!-- Dashboard Stats (kept intact) -->
        <div class="p-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="stats-container">
                <div class="bg-white rounded-lg shadow-sm p-4"><div class="spinner mx-auto"></div></div>
            </div>

            <!-- Tab Navigation (clean, no emojis) -->
            <div class="flex flex-wrap gap-2 mb-6 border-b border-gray-200 pb-2">
                <button class="tab-btn active" data-tab="staff-tab">Staff Accounts</button>
                <button class="tab-btn" data-tab="payroll-tab">Payroll</button>
                <button class="tab-btn" data-tab="attendance-tab">Live Attendance</button>
                <button class="tab-btn" data-tab="activity-tab">Activity Log</button>
            </div>

            <!-- ================= STAFF TAB ================= -->
            <div id="staff-tab" class="tab-content">
                <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                    <div class="flex flex-wrap gap-4 items-center justify-between">
                        <div class="flex-1 min-w-[200px]">
                            <div class="relative">
                                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="search-staff" placeholder="Search by name, email, or phone..." 
                                       class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-500">
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-3">
                            <select id="filter-role" class="px-4 py-2 border border-gray-300 rounded-lg bg-white">
                                <option value="">All Job Titles</option>
                                <option value="event_manager">Event Manager</option>
                                <option value="event_host">Event Host</option>
                                <option value="shisha_attendant">Shisha Attendant</option>
                                <option value="smart_host">Smart Host</option>
                                <option value="butcher_crew">Butcher Crew</option>
                                <option value="vvip_concierge">VVIP Concierge</option>
                            </select>
                            <select id="filter-status" class="px-4 py-2 border border-gray-300 rounded-lg bg-white">
                                <option value="">All Status</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                            <button onclick="exportStaffList()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition flex items-center space-x-2">
                                <i class="fas fa-download"></i><span>Export</span>
                            </button>
                            <button onclick="openStaffForm()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition flex items-center space-x-2">
                                <i class="fas fa-plus"></i><span>Add Staff</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Staff</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Job Title</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Hourly Rate</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Screens</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Seen</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="staff-table-body" class="bg-white divide-y divide-gray-200">
                                <tr><td colspan="7" class="px-6 py-12 text-center"><div class="spinner mx-auto"></div><p class="mt-2">Loading staff...</p></td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="px-6 py-4 border-t border-gray-200" id="pagination-container"></div>
                </div>
            </div>

            <!-- ================= PAYROLL TAB ================= -->
            <div id="payroll-tab" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
                    <div class="flex flex-wrap gap-4 items-end">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Period Start</label>
                            <input type="date" id="payroll-start" class="border rounded-lg px-3 py-2 mt-1">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Period End</label>
                            <input type="date" id="payroll-end" class="border rounded-lg px-3 py-2 mt-1">
                        </div>
                        <button onclick="calculatePayroll()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">Calculate</button>
                        <button onclick="exportPayrollCSV()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg">Export CSV</button>
                        <button onclick="markAllPayrollPaid()" id="mark-all-paid-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg hidden">Mark All Paid</button>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Staff</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Job Title</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Hours Worked</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Rate</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Gross Pay</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Deductions/Bonus</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Net Pay</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="payroll-table-body">
                                <tr><td colspan="9" class="text-center py-8 text-gray-400">Select a date range and click Calculate</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- ================= ATTENDANCE TAB ================= -->
            <div id="attendance-tab" class="tab-content hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="active-shifts-container">
                    <div class="bg-white rounded-lg shadow-sm p-8 text-center text-gray-400 col-span-2">Loading active shifts...</div>
                </div>
            </div>

            <!-- ================= ACTIVITY LOG TAB ================= -->
            <div id="activity-tab" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="activity-feed p-4 space-y-3" id="activity-feed-container">
                        <div class="text-center text-gray-400 py-8">Loading activity...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Staff Form Modal (with screen preview green chips) -->
    <div id="staff-form-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto modal-enter">
                <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold" id="modal-title">Add New Staff</h2>
                    <button onclick="closeStaffForm()" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div id="staff-form-container"></div>
            </div>
        </div>
    </div>

    <!-- Staff Profile Modal -->
    <div id="staff-profile-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-3xl w-full max-h-[90vh] overflow-y-auto modal-enter">
                <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold">Staff Profile</h2>
                    <button onclick="closeStaffProfile()" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div id="staff-profile-container"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../config/supabase.js';
        
        // ---------- JOB TITLES & SCREENS (full definitions) ----------
        const JOB_TITLES = {
            event_manager: {
                name: 'Event Manager',
                screens: [
                    { name: 'Box Office', path: 'box-office.html', icon: 'fa-ticket-alt' },
                    { name: 'Event Check-In', path: 'gate-scanner.html', icon: 'fa-qrcode' },
                    { name: 'Event Analytics', path: 'event-analytics.html', icon: 'fa-chart-line' }
                ]
            },
            event_host: {
                name: 'Event Host',
                screens: [
                    { name: 'Box Office', path: 'box-office.html', icon: 'fa-ticket-alt' },
                    { name: 'Event Check-In', path: 'gate-scanner.html', icon: 'fa-qrcode' }
                ]
            },
            shisha_attendant: {
                name: 'Shisha Attendant',
                screens: [
                    { name: 'Shisha Lounge', path: 'shisha-pos.html', icon: 'fa-smoking' },
                    { name: 'Shisha Console', path: 'shisha-console.html', icon: 'fa-desktop' }
                ]
            },
            smart_host: {
                name: 'Smart Host',
                screens: [
                    { name: 'Booze Vault', path: 'booze-vault.html', icon: 'fa-vault' },
                    { name: 'Locker Registration', path: 'register-locker.html', icon: 'fa-clipboard-list' },
                    { name: 'Vault Access', path: 'unlock-vault.html', icon: 'fa-unlock-alt' },
                    { name: 'Booze Collection', path: 'booze-collection.html', icon: 'fa-shopping-bag' },
                    { name: 'Rands Counter', path: 'booze-counter.html', icon: 'fa-calculator' }
                ]
            },
            butcher_crew: {
                name: 'Butcher Crew',
                screens: [
                    { name: 'Order Processing', path: 'pre-order-pos.html', icon: 'fa-clipboard' },
                    { name: 'Kitchen Display', path: 'butcher-orders.html', icon: 'fa-utensils' },
                    { name: 'Order Collection', path: 'butcher-collection.html', icon: 'fa-box' }
                ]
            },
            vvip_concierge: {
                name: 'VVIP Concierge',
                screens: [
                    { name: 'VVIP Tab', path: 'vvip-tab.html', icon: 'fa-crown' },
                    { name: 'VVIP Check-In', path: 'vvip-staff.html', icon: 'fa-id-card' }
                ]
            }
        };

        // Legacy mapping
        function normalizeStaffRole(roleKey) {
            if (roleKey === 'event_master') return 'event_host';
            return JOB_TITLES[roleKey] ? roleKey : null;
        }
        function getJobTitleDisplay(roleKey) {
            const norm = normalizeStaffRole(roleKey);
            return norm && JOB_TITLES[norm] ? JOB_TITLES[norm].name : (roleKey || 'N/A');
        }
        function getScreensForRole(roleKey) {
            const norm = normalizeStaffRole(roleKey);
            return norm && JOB_TITLES[norm] ? JOB_TITLES[norm].screens : [];
        }

        // Global state
        let currentUser = null;
        let currentPage = 1;
        let pageSize = 10;
        let totalStaff = 0;
        let currentFilters = { search: '', role: '', status: '' };
        let staffList = [];
        let payrollData = [];

        // Helper functions
        function getInitials(first, last) { return `${(first || 'U')[0]}${(last || '')[0] || ''}`.toUpperCase(); }
        function formatDate(d) { return d ? new Date(d).toLocaleDateString('en-ZA') : 'Never'; }
        function formatDateTime(d) { return d ? new Date(d).toLocaleString('en-ZA') : 'Never'; }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }
        
        function showNotification(msg, type) {
            const n = document.createElement('div');
            n.className = `fixed top-5 right-5 z-50 px-5 py-3 rounded-lg shadow-xl flex items-center gap-2 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white animate-slide-in`;
            n.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i><span>${escapeHtml(msg)}</span>`;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3500);
        }

        // Dashboard stats (preserved)
        async function loadDashboardStats() {
            try {
                const { count: total } = await supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'staff');
                const { count: active } = await supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'staff').eq('status', 'active');
                const { count: clockedIn } = await supabase.from('staff_shifts').select('*', { count: 'exact', head: true }).is('logout_time', null);
                document.getElementById('stats-container').innerHTML = `
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-red-600">
                        <div class="flex items-center justify-between">
                            <div><p class="text-gray-500 text-sm">Total Staff</p><p class="text-2xl font-bold">${total || 0}</p></div>
                            <i class="fas fa-users text-3xl text-red-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-green-600">
                        <div class="flex items-center justify-between">
                            <div><p class="text-gray-500 text-sm">Active Staff</p><p class="text-2xl font-bold">${active || 0}</p></div>
                            <i class="fas fa-user-check text-3xl text-green-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-blue-600">
                        <div class="flex items-center justify-between">
                            <div><p class="text-gray-500 text-sm">Clocked In</p><p class="text-2xl font-bold">${clockedIn || 0}</p></div>
                            <i class="fas fa-clock text-3xl text-blue-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-purple-600">
                        <div class="flex items-center justify-between">
                            <div><p class="text-gray-500 text-sm">Active Job Roles</p><p class="text-2xl font-bold">${Object.keys(JOB_TITLES).length}</p></div>
                            <i class="fas fa-tags text-3xl text-purple-600 opacity-50"></i>
                        </div>
                    </div>
                `;
            } catch(e) { console.error(e); }
        }

        // Load staff list with pagination & filters
        async function loadStaffList() {
            try {
                let query = supabase.from('profiles').select('*', { count: 'exact' }).eq('role', 'staff');
                if (currentFilters.search) query = query.or(`first_name.ilike.%${currentFilters.search}%,last_name.ilike.%${currentFilters.search}%,email.ilike.%${currentFilters.search}%,phone.ilike.%${currentFilters.search}%`);
                if (currentFilters.role) {
                    if (currentFilters.role === 'event_host') query = query.or(`staff_role.eq.event_host,staff_role.eq.event_master`);
                    else query = query.eq('staff_role', currentFilters.role);
                }
                if (currentFilters.status) query = query.eq('status', currentFilters.status);
                const from = (currentPage - 1) * pageSize;
                const { data, error, count } = await query.order('created_at', { ascending: false }).range(from, from + pageSize - 1);
                if (error) throw error;
                totalStaff = count || 0;
                staffList = data || [];
                renderStaffTable(staffList);
                renderPagination();
            } catch(e) { showNotification('Failed to load staff', 'error'); }
        }

        function renderStaffTable(staff) {
            const tbody = document.getElementById('staff-table-body');
            if (!staff.length) { tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-gray-500">No staff found</td></tr>`; return; }
            tbody.innerHTML = staff.map(m => {
                const jobTitle = getJobTitleDisplay(m.staff_role);
                const screensCount = getScreensForRole(m.staff_role).length;
                const statusColor = m.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                const hourly = m.hourly_rate ? `R${parseFloat(m.hourly_rate).toFixed(2)}` : '—';
                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4"><div class="flex items-center"><div class="h-10 w-10 bg-red-100 rounded-full flex items-center justify-center"><span class="text-red-600 font-semibold">${getInitials(m.first_name, m.last_name)}</span></div><div class="ml-4"><div class="text-sm font-medium">${escapeHtml(m.first_name || '')} ${escapeHtml(m.last_name || '')}</div><div class="text-sm text-gray-500">${escapeHtml(m.email || '')}</div></div></div></td>
                        <td class="px-6 py-4"><span class="role-badge bg-indigo-100 text-indigo-800">${jobTitle}</span></td>
                        <td class="px-6 py-4 text-sm font-medium">${hourly}</td>
                        <td class="px-6 py-4"><span class="text-sm">${screensCount} screens</span></td>
                        <td class="px-6 py-4"><span class="status-badge ${statusColor}">${m.status || 'active'}</span></td>
                        <td class="px-6 py-4 text-sm text-gray-500">${m.last_seen ? formatDate(m.last_seen) : 'Never'}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <button onclick="window.viewStaffProfile('${m.id}')" class="text-blue-600 hover:text-blue-900 mr-2"><i class="fas fa-eye"></i></button>
                            <button onclick="window.editStaff('${m.id}')" class="text-green-600 hover:text-green-900 mr-2"><i class="fas fa-edit"></i></button>
                            <button onclick="window.toggleStaffStatus('${m.id}', '${m.status}')" class="text-yellow-600 hover:text-yellow-900 mr-2"><i class="fas ${m.status === 'active' ? 'fa-ban' : 'fa-check-circle'}"></i></button>
                            <button onclick="window.deleteStaff('${m.id}')" class="text-red-600 hover:text-red-900"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderPagination() {
            const totalPages = Math.ceil(totalStaff / pageSize);
            const container = document.getElementById('pagination-container');
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            container.innerHTML = `
                <div class="flex justify-between items-center flex-wrap gap-2">
                    <div class="text-sm text-gray-700">Showing ${((currentPage-1)*pageSize)+1} to ${Math.min(currentPage*pageSize, totalStaff)} of ${totalStaff}</div>
                    <div class="flex gap-2">
                        <button onclick="window.changePage(${currentPage-1})" ${currentPage===1 ? 'disabled' : ''} class="px-3 py-1 border rounded ${currentPage===1 ? 'opacity-50' : 'hover:bg-gray-50'}">Prev</button>
                        <span class="px-3 py-1 bg-gray-100 rounded">${currentPage} / ${totalPages}</span>
                        <button onclick="window.changePage(${currentPage+1})" ${currentPage===totalPages ? 'disabled' : ''} class="px-3 py-1 border rounded ${currentPage===totalPages ? 'opacity-50' : 'hover:bg-gray-50'}">Next</button>
                    </div>
                </div>
            `;
        }

        // Staff CRUD (with delete cascade)
        window.deleteStaff = async (staffId) => {
            const staff = staffList.find(s => s.id === staffId);
            if (!staff) return;
            if (!confirm(`Permanently delete ${staff.first_name} ${staff.last_name}? This will remove all shifts, payroll records, and activity logs.`)) return;
            try {
                await supabase.from('staff_shifts').delete().eq('staff_id', staffId);
                await supabase.from('staff_payroll').delete().eq('staff_id', staffId);
                await supabase.from('staff_activity_logs').delete().eq('staff_id', staffId);
                const { error } = await supabase.from('profiles').delete().eq('id', staffId);
                if (error) throw error;
                showNotification('Staff permanently deleted', 'success');
                await loadStaffList();
                await loadDashboardStats();
            } catch(err) { showNotification(err.message, 'error'); }
        };

        // Staff form with hourly rate and green screen preview
        async function openStaffForm(staffId = null) {
            const modal = document.getElementById('staff-form-modal');
            const container = document.getElementById('staff-form-container');
            document.getElementById('modal-title').textContent = staffId ? 'Edit Staff Member' : 'Add New Staff';
            let staffData = null;
            if (staffId) {
                const { data } = await supabase.from('profiles').select('*').eq('id', staffId).single();
                staffData = data;
                if (staffData?.staff_role === 'event_master') staffData.staff_role = 'event_host';
            }
            const jobOptions = Object.entries(JOB_TITLES).map(([k,v]) => `<option value="${k}" ${staffData?.staff_role === k ? 'selected' : ''}>${v.name}</option>`).join('');
            container.innerHTML = `
                <form id="staff-form" class="p-6 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">First Name *</label><input type="text" name="first_name" required value="${escapeHtml(staffData?.first_name || '')}" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Surname *</label><input type="text" name="last_name" required value="${escapeHtml(staffData?.last_name || '')}" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Email *</label><input type="email" name="email" required value="${escapeHtml(staffData?.email || '')}" ${staffId ? 'readonly class="w-full px-3 py-2 border rounded-lg bg-gray-100"' : 'class="w-full px-3 py-2 border rounded-lg"'}</div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Phone</label><input type="tel" name="phone" value="${escapeHtml(staffData?.phone || '')}" class="w-full px-3 py-2 border rounded-lg"></div>
                        ${!staffId ? `<div><label class="block text-sm font-medium text-gray-700 mb-1">Password *</label><input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg"></div>` : ''}
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Clock PIN (4-6 digits)</label><input type="password" name="clock_in_pin" maxlength="6" value="${escapeHtml(staffData?.clock_in_pin || '')}" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Hourly Rate (ZAR) *</label><input type="number" step="0.5" name="hourly_rate" required value="${staffData?.hourly_rate || ''}" class="w-full px-3 py-2 border rounded-lg"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Job Title *</label><select name="staff_role" required class="w-full px-3 py-2 border rounded-lg bg-white"><option value="">Select</option>${jobOptions}</select></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Status</label><select name="status" class="w-full px-3 py-2 border rounded-lg"><option value="active" ${staffData?.status === 'active' ? 'selected' : ''}>Active</option><option value="inactive" ${staffData?.status === 'inactive' ? 'selected' : ''}>Inactive</option></select></div>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4 border">
                        <h3 class="text-md font-semibold text-gray-800 mb-3"><i class="fas fa-desktop text-red-500 mr-2"></i>Screens Access (auto-assigned)</h3>
                        <div id="screens-preview" class="text-sm text-gray-500 italic">Select a job title to see available screens</div>
                    </div>
                    <div class="flex justify-end gap-3"><button type="button" onclick="window.closeStaffForm()" class="px-4 py-2 border rounded-lg">Cancel</button><button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-lg">${staffId ? 'Update' : 'Create'}</button></div>
                </form>
            `;
            const roleSelect = container.querySelector('select[name="staff_role"]');
            const previewDiv = container.querySelector('#screens-preview');
            const updatePreview = () => {
                const val = roleSelect.value;
                if (val && JOB_TITLES[val]) {
                    const screens = JOB_TITLES[val].screens;
                    previewDiv.innerHTML = `<div class="flex flex-wrap gap-2">${screens.map(s => `<span class="screen-chip"><i class="fas ${s.icon}"></i> ${s.name}</span>`).join('')}</div>`;
                } else {
                    previewDiv.innerHTML = '<i class="fas fa-info-circle text-gray-400 mr-1"></i> Select a job title to see which screens they will access in the Staff Console.';
                }
            };
            roleSelect.addEventListener('change', updatePreview);
            if (staffData?.staff_role) updatePreview();
            document.getElementById('staff-form').addEventListener('submit', (e) => { e.preventDefault(); saveStaff(staffId); });
            modal.classList.remove('hidden');
        }

        async function saveStaff(staffId) {
            const form = document.getElementById('staff-form');
            const formData = new FormData(form);
            try {
                if (staffId) {
                    const updatePayload = {
                        first_name: formData.get('first_name'), last_name: formData.get('last_name'),
                        phone: formData.get('phone'), clock_in_pin: formData.get('clock_in_pin') || null,
                        staff_role: formData.get('staff_role'), status: formData.get('status'),
                        hourly_rate: parseFloat(formData.get('hourly_rate')), updated_at: new Date().toISOString()
                    };
                    const { error } = await supabase.from('profiles').update(updatePayload).eq('id', staffId);
                    if (error) throw error;
                    showNotification('Staff updated', 'success');
                } else {
                    const email = formData.get('email'), password = formData.get('password');
                    const { data: auth, error: authError } = await supabase.auth.signUp({
                        email, password,
                        options: { data: { first_name: formData.get('first_name'), last_name: formData.get('last_name'), role: 'staff' } }
                    });
                    if (authError) throw authError;
                    const { error: profileError } = await supabase.from('profiles').insert([{
                        id: auth.user.id, first_name: formData.get('first_name'), last_name: formData.get('last_name'),
                        email, phone: formData.get('phone'), role: 'staff', staff_role: formData.get('staff_role'),
                        clock_in_pin: formData.get('clock_in_pin') || null, status: formData.get('status') || 'active',
                        hourly_rate: parseFloat(formData.get('hourly_rate'))
                    }]);
                    if (profileError) throw profileError;
                    showNotification('Staff created', 'success');
                }
                closeStaffForm();
                await loadStaffList();
                await loadDashboardStats();
            } catch(err) { showNotification(err.message, 'error'); }
        }

        // Payroll functions
        async function calculatePayroll() {
            const start = document.getElementById('payroll-start').value;
            const end = document.getElementById('payroll-end').value;
            if (!start || !end) { showNotification('Select date range', 'error'); return; }
            const startDate = new Date(start); startDate.setHours(0,0,0);
            const endDate = new Date(end); endDate.setHours(23,59,59);
            const { data: shifts, error } = await supabase.from('staff_shifts').select('*, staff_id').gte('login_time', startDate.toISOString()).lte('login_time', endDate.toISOString()).eq('status', 'completed');
            if (error) { showNotification('Error fetching shifts', 'error'); return; }
            const hoursMap = new Map();
            shifts.forEach(shift => { hoursMap.set(shift.staff_id, (hoursMap.get(shift.staff_id) || 0) + (shift.hours_worked || 0)); });
            const entries = [];
            for (const staff of staffList) {
                const hours = hoursMap.get(staff.id) || 0;
                if (hours === 0) continue;
                const rate = staff.hourly_rate || 0;
                const gross = hours * rate;
                const { data: existing } = await supabase.from('staff_payroll').select('*').eq('staff_id', staff.id).eq('period_start', start).eq('period_end', end).maybeSingle();
                entries.push({
                    staff_id: staff.id, name: `${staff.first_name} ${staff.last_name}`, job_title: getJobTitleDisplay(staff.staff_role),
                    hours, rate, gross, deductions: existing?.deductions || 0, status: existing?.payment_status || 'pending', id: existing?.id
                });
            }
            payrollData = entries;
            renderPayrollTable();
            document.getElementById('mark-all-paid-btn').classList.remove('hidden');
        }

        function renderPayrollTable() {
            const tbody = document.getElementById('payroll-table-body');
            if (!payrollData.length) { tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-gray-400">No hours recorded in this period</td></tr>'; return; }
            tbody.innerHTML = payrollData.map(entry => `
                <tr class="payroll-row">
                    <td class="px-6 py-4 font-medium">${escapeHtml(entry.name)}</td>
                    <td class="px-6 py-4">${escapeHtml(entry.job_title)}</td>
                    <td class="px-6 py-4">${entry.hours.toFixed(2)}h</td>
                    <td class="px-6 py-4">R${entry.rate.toFixed(2)}</td>
                    <td class="px-6 py-4">R${entry.gross.toFixed(2)}</td>
                    <td class="px-6 py-4"><input type="number" step="10" value="${entry.deductions}" class="deduction-input border rounded px-2 py-1 w-24" data-id="${entry.staff_id}"></td>
                    <td class="px-6 py-4 font-bold text-green-600 net-${entry.staff_id}">R${(entry.gross - entry.deductions).toFixed(2)}</td>
                    <td class="px-6 py-4"><span class="status-badge ${entry.status === 'paid' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">${entry.status}</span></td>
                    <td class="px-6 py-4"><button onclick="markPayrollPaid('${entry.staff_id}')" class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm" ${entry.status === 'paid' ? 'disabled' : ''}>Mark Paid</button></td>
                </tr>
            `).join('');
            attachDeductionListeners();
        }

        function attachDeductionListeners() {
            document.querySelectorAll('.deduction-input').forEach(inp => {
                inp.removeEventListener('change', updateDeduction);
                inp.addEventListener('change', updateDeduction);
            });
        }
        async function updateDeduction(e) {
            const staffId = e.target.dataset.id;
            const newDeduction = parseFloat(e.target.value) || 0;
            const entry = payrollData.find(p => p.staff_id === staffId);
            if (!entry) return;
            entry.deductions = newDeduction;
            const netSpan = document.querySelector(`.net-${staffId}`);
            if (netSpan) netSpan.innerText = `R${(entry.gross - newDeduction).toFixed(2)}`;
            const start = document.getElementById('payroll-start').value;
            const end = document.getElementById('payroll-end').value;
            if (entry.id) {
                await supabase.from('staff_payroll').update({ deductions: newDeduction, final_pay: entry.gross - newDeduction }).eq('id', entry.id);
            } else {
                const { data } = await supabase.from('staff_payroll').insert({
                    staff_id: staffId, period_start: start, period_end: end, hours_worked: entry.hours,
                    hourly_rate: entry.rate, gross_pay: entry.gross, deductions: newDeduction,
                    final_pay: entry.gross - newDeduction, payment_status: 'pending'
                }).select().single();
                if (data) entry.id = data.id;
            }
            showNotification('Deduction saved', 'success');
        }
        window.markPayrollPaid = async (staffId) => {
            const entry = payrollData.find(p => p.staff_id === staffId);
            if (!entry) return;
            if (!entry.id) await updateDeduction({ target: { dataset: { id: staffId }, value: entry.deductions } });
            const { error } = await supabase.from('staff_payroll').update({ payment_status: 'paid' }).eq('id', entry.id);
            if (error) { showNotification('Error', 'error'); return; }
            entry.status = 'paid';
            renderPayrollTable();
            showNotification('Marked as paid', 'success');
        };
        window.markAllPayrollPaid = async () => {
            for (const entry of payrollData) if (entry.status !== 'paid') await window.markPayrollPaid(entry.staff_id);
        };
        function exportPayrollCSV() {
            let csv = "Staff,Job Title,Hours,Rate,Gross,Deductions,Net,Status\n";
            payrollData.forEach(e => { csv += `"${e.name}","${e.job_title}",${e.hours},${e.rate},${e.gross},${e.deductions},${e.gross-e.deductions},${e.status}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `payroll_${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
        }

        // Attendance (live shifts)
        async function loadActiveShifts() {
            const { data: shifts, error } = await supabase.from('staff_shifts').select('*, staff_id').is('logout_time', null);
            if (error) { document.getElementById('active-shifts-container').innerHTML = '<div class="text-center text-red-500">Error loading shifts</div>'; return; }
            if (!shifts.length) { document.getElementById('active-shifts-container').innerHTML = '<div class="bg-white rounded-lg p-8 text-center text-gray-400 col-span-2">No active shifts</div>'; return; }
            const staffMap = new Map(staffList.map(s => [s.id, s]));
            const html = shifts.map(shift => {
                const staff = staffMap.get(shift.staff_id);
                const name = staff ? `${staff.first_name} ${staff.last_name}` : 'Unknown';
                const job = staff ? getJobTitleDisplay(staff.staff_role) : 'Staff';
                return `
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-green-500 shift-card">
                        <div class="flex justify-between items-start"><div><h3 class="font-bold">${escapeHtml(name)}</h3><p class="text-sm text-gray-500">${job}</p></div><button onclick="forceLogout('${shift.id}')" class="bg-red-100 text-red-700 px-3 py-1 rounded text-sm">Force Logout</button></div>
                        <div class="mt-2 text-sm"><i class="fas fa-clock mr-1"></i> Clocked in: ${formatDateTime(shift.login_time)}</div>
                    </div>
                `;
            }).join('');
            document.getElementById('active-shifts-container').innerHTML = html;
        }
        window.forceLogout = async (shiftId) => {
            if (!confirm('Force logout this staff?')) return;
            const now = new Date();
            const { data: shift } = await supabase.from('staff_shifts').select('staff_id, login_time').eq('id', shiftId).single();
            if (!shift) return;
            const hours = (now - new Date(shift.login_time)) / (1000*3600);
            await supabase.from('staff_shifts').update({ logout_time: now.toISOString(), status: 'completed', hours_worked: hours }).eq('id', shiftId);
            showNotification('Staff logged out', 'success');
            loadActiveShifts();
        };

        // Activity log
        async function loadActivityLog() {
            const { data: logs, error } = await supabase.from('staff_activity_logs').select('*, staff_id').order('created_at', { ascending: false }).limit(50);
            if (error) { document.getElementById('activity-feed-container').innerHTML = '<div class="text-center text-red-500">Error loading logs</div>'; return; }
            if (!logs.length) { document.getElementById('activity-feed-container').innerHTML = '<div class="text-center text-gray-400 py-8">No activity yet</div>'; return; }
            const staffMap = new Map(staffList.map(s => [s.id, s]));
            const items = logs.map(log => {
                const staff = staffMap.get(log.staff_id);
                const name = staff ? `${staff.first_name} ${staff.last_name}` : 'System';
                return `
                    <div class="border rounded-lg p-3 bg-white shadow-sm">
                        <div class="flex justify-between"><span class="font-semibold">${escapeHtml(name)}</span><span class="text-xs text-gray-400">${formatDateTime(log.created_at)}</span></div>
                        <div class="text-sm mt-1"><i class="fas fa-circle-info text-red-500 mr-1"></i> ${escapeHtml(log.action || 'Action')} — ${escapeHtml(log.module || 'General')}</div>
                    </div>
                `;
            }).join('');
            document.getElementById('activity-feed-container').innerHTML = items;
        }

        // Tab switching
        function initTabs() {
            const tabs = document.querySelectorAll('.tab-btn');
            const contents = document.querySelectorAll('.tab-content');
            tabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.dataset.tab;
                    tabs.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    contents.forEach(c => c.classList.add('hidden'));
                    document.getElementById(tabId).classList.remove('hidden');
                    if (tabId === 'attendance-tab') loadActiveShifts();
                    if (tabId === 'activity-tab') loadActivityLog();
                });
            });
        }

        // Setup filters
        function setupEventListeners() {
            let timeout;
            document.getElementById('search-staff').addEventListener('input', (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => { currentFilters.search = e.target.value; currentPage = 1; loadStaffList(); }, 400);
            });
            document.getElementById('filter-role').addEventListener('change', (e) => { currentFilters.role = e.target.value; currentPage = 1; loadStaffList(); });
            document.getElementById('filter-status').addEventListener('change', (e) => { currentFilters.status = e.target.value; currentPage = 1; loadStaffList(); });
        }

        // Profile view (simplified)
        window.viewStaffProfile = async (id) => {
            const { data: staff } = await supabase.from('profiles').select('*').eq('id', id).single();
            if (!staff) return;
            const jobDisplay = getJobTitleDisplay(staff.staff_role);
            const screens = getScreensForRole(staff.staff_role);
            const container = document.getElementById('staff-profile-container');
            container.innerHTML = `
                <div class="p-6 space-y-6">
                    <div class="flex items-center space-x-4"><div class="h-16 w-16 bg-red-100 rounded-full flex items-center justify-center"><span class="text-red-700 text-2xl font-bold">${getInitials(staff.first_name, staff.last_name)}</span></div><div><h3 class="text-xl font-bold">${escapeHtml(staff.first_name)} ${escapeHtml(staff.last_name)}</h3><p class="text-gray-500">${escapeHtml(staff.email)}</p></div></div>
                    <div class="grid grid-cols-2 gap-4"><div><p class="text-xs text-gray-500">Job Title</p><p class="font-medium">${jobDisplay}</p></div><div><p class="text-xs text-gray-500">Hourly Rate</p><p class="font-medium">R${staff.hourly_rate || 0}</p></div><div><p class="text-xs text-gray-500">Status</p><span class="status-badge ${staff.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${staff.status}</span></div><div><p class="text-xs text-gray-500">Last Seen</p><p>${staff.last_seen ? formatDateTime(staff.last_seen) : 'Never'}</p></div></div>
                    <div><h3 class="font-semibold">Assigned Screens</h3><div class="flex flex-wrap gap-2 mt-2">${screens.map(s => `<span class="screen-chip"><i class="fas ${s.icon}"></i> ${s.name}</span>`).join('')}</div></div>
                </div>
            `;
            document.getElementById('staff-profile-modal').classList.remove('hidden');
        };
        window.toggleStaffStatus = async (id, current) => {
            const newStatus = current === 'active' ? 'inactive' : 'active';
            if (!confirm(`Confirm ${newStatus === 'active' ? 'activate' : 'deactivate'}?`)) return;
            await supabase.from('profiles').update({ status: newStatus }).eq('id', id);
            showNotification(`Staff ${newStatus}`, 'success');
            await loadStaffList();
            await loadDashboardStats();
        };
        window.exportStaffList = async () => {
            const { data: staff } = await supabase.from('profiles').select('first_name, last_name, email, phone, staff_role, status, last_seen').eq('role', 'staff');
            if (!staff?.length) { showNotification('No data', 'error'); return; }
            const csvRows = [['First Name','Last Name','Email','Phone','Job Title','Status','Last Seen']];
            staff.forEach(s => csvRows.push([s.first_name||'', s.last_name||'', s.email||'', s.phone||'', getJobTitleDisplay(s.staff_role), s.status||'', s.last_seen?formatDate(s.last_seen):'']));
            const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob(["\uFEFF"+csvContent], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `staff_export_${new Date().toISOString().split('T')[0]}.csv`; a.click(); URL.revokeObjectURL(a.href);
            showNotification('Export complete', 'success');
        };
        window.changePage = (p) => { if (p>0 && p<=Math.ceil(totalStaff/pageSize)) { currentPage=p; loadStaffList(); } };
        window.closeStaffForm = () => document.getElementById('staff-form-modal').classList.add('hidden');
        window.closeStaffProfile = () => document.getElementById('staff-profile-modal').classList.add('hidden');
        window.editStaff = (id) => openStaffForm(id);

        // Initialization
        async function init() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) { window.parent.location.href = '/login.html'; return; }
                currentUser = session.user;
                const { data: profile } = await supabase.from('profiles').select('role').eq('id', currentUser.id).single();
                if (!['super_admin', 'admin'].includes(profile?.role)) { alert('Admin access required'); window.parent.location.href = '/dashboard.html'; return; }
                await loadDashboardStats();
                await loadStaffList();
                setupEventListeners();
                initTabs();
                const today = new Date().toISOString().split('T')[0];
                const firstDay = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];
                document.getElementById('payroll-start').value = firstDay;
                document.getElementById('payroll-end').value = today;
            } catch(e) { console.error(e); }
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
