<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Staff Management | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --rands-red: #dc2626; --rands-red-dark: #b91c1c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background-color: #f9fafb; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--rands-red); border-radius: 4px; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
        .modal-enter { animation: modalFadeIn 0.3s ease-out; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid var(--rands-red); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .role-badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .status-badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="w-full">
        <!-- Dashboard Stats -->
        <div class="p-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="stats-container">
                <div class="bg-white rounded-lg shadow-sm p-4"><div class="spinner mx-auto"></div></div>
            </div>

            <!-- Filters and Search -->
            <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                <div class="flex flex-wrap gap-4 items-center justify-between">
                    <div class="flex-1 min-w-[200px]">
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="search-staff" placeholder="Search by name, email, or phone..." 
                                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-500">
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <select id="filter-role" class="px-4 py-2 border border-gray-300 rounded-lg bg-white">
                            <option value="">All Job Titles</option>
                            <option value="event_manager">Event Manager</option>
                            <option value="event_host">Event Host</option>
                            <option value="shisha_attendant">Shisha Attendant</option>
                            <option value="smart_host">Smart Host</option>
                            <option value="butcher_crew">Butcher Crew</option>
                            <option value="vvip_concierge">VVIP Concierge</option>
                        </select>
                        <select id="filter-status" class="px-4 py-2 border border-gray-300 rounded-lg bg-white">
                            <option value="">All Status</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                        <button onclick="exportStaffList()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition flex items-center space-x-2">
                            <i class="fas fa-download"></i><span>Export</span>
                        </button>
                        <button onclick="openStaffForm()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition flex items-center space-x-2">
                            <i class="fas fa-plus"></i><span>Add Staff</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Staff List Table -->
            <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Staff</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Job Title</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Screens</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Seen</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="staff-table-body" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="6" class="px-6 py-12 text-center"><div class="spinner mx-auto"></div><p class="mt-2">Loading staff...</p></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="px-6 py-4 border-t border-gray-200" id="pagination-container"></div>
            </div>
        </div>
    </div>

    <!-- Staff Form Modal -->
    <div id="staff-form-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto modal-enter">
                <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold" id="modal-title">Add New Staff</h2>
                    <button onclick="closeStaffForm()" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div id="staff-form-container"></div>
            </div>
        </div>
    </div>

    <!-- Staff Profile Modal -->
    <div id="staff-profile-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-3xl w-full max-h-[90vh] overflow-y-auto modal-enter">
                <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold">Staff Profile</h2>
                    <button onclick="closeStaffProfile()" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div id="staff-profile-container"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../config/supabase.js';
        
        let currentUser = null;
        let currentPage = 1;
        let pageSize = 10;
        let totalStaff = 0;
        let currentFilters = { search: '', role: '', status: '' };
        
        // ======================= JOB TITLES & SCREENS DEFINITION =======================
        // profiles.staff_role stores these keys. Legacy 'event_master' is mapped to 'event_host'
        const JOB_TITLES = {
            event_manager: {
                name: 'Event Manager',
                screens: [
                    { name: 'Box Office', path: 'box-office.html', icon: 'fa-ticket-alt' },
                    { name: 'Event Check-In', path: 'gate-scanner.html', icon: 'fa-qrcode' },
                    { name: 'Event Analytics', path: 'event-analytics.html', icon: 'fa-chart-line' }
                ]
            },
            event_host: {
                name: 'Event Host',
                screens: [
                    { name: 'Box Office', path: 'box-office.html', icon: 'fa-ticket-alt' },
                    { name: 'Event Check-In', path: 'gate-scanner.html', icon: 'fa-qrcode' }
                ]
            },
            shisha_attendant: {
                name: 'Shisha Attendant',
                screens: [
                    { name: 'Shisha Lounge', path: 'shisha-pos.html', icon: 'fa-smoking' },
                    { name: 'Shisha Console', path: 'shisha-console.html', icon: 'fa-desktop' }
                ]
            },
            smart_host: {
                name: 'Smart Host',
                screens: [
                    { name: 'Booze Vault', path: 'booze-vault.html', icon: 'fa-vault' },
                    { name: 'Locker Registration', path: 'register-locker.html', icon: 'fa-clipboard-list' },
                    { name: 'Vault Access', path: 'unlock-vault.html', icon: 'fa-unlock-alt' },
                    { name: 'Booze Collection', path: 'booze-collection.html', icon: 'fa-shopping-bag' },
                    { name: 'Rands Counter', path: 'booze-counter.html', icon: 'fa-calculator' }
                ]
            },
            butcher_crew: {
                name: 'Butcher Crew',
                screens: [
                    { name: 'Order Processing', path: 'pre-order-pos.html', icon: 'fa-clipboard' },
                    { name: 'Kitchen Display', path: 'butcher-orders.html', icon: 'fa-utensils' },
                    { name: 'Order Collection', path: 'butcher-collection.html', icon: 'fa-box' }
                ]
            },
            vvip_concierge: {
                name: 'VVIP Concierge',
                screens: [
                    { name: 'VVIP Tab', path: 'vvip-tab.html', icon: 'fa-crown' },
                    { name: 'VVIP Check-In', path: 'vvip-staff.html', icon: 'fa-id-card' }
                ]
            }
        };
        
        // Legacy role mapping for backward compatibility (old 'event_master' -> 'event_host')
        function normalizeStaffRole(roleKey) {
            if (roleKey === 'event_master') return 'event_host';
            if (JOB_TITLES[roleKey]) return roleKey;
            return null;
        }
        
        function getJobTitleDisplay(roleKey) {
            const normalized = normalizeStaffRole(roleKey);
            if (normalized && JOB_TITLES[normalized]) return JOB_TITLES[normalized].name;
            return roleKey ? roleKey.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : 'N/A';
        }
        
        function getScreensForRole(roleKey) {
            const normalized = normalizeStaffRole(roleKey);
            return normalized && JOB_TITLES[normalized] ? JOB_TITLES[normalized].screens : [];
        }
        
        // ======================= AUTH & INIT =======================
        async function initStaffManagement() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) { window.parent.location.href = '/login.html'; return; }
                currentUser = session.user;
                
                const { data: profile, error: profileError } = await supabase.from('profiles').select('role').eq('id', currentUser.id).single();
                if (profileError || !['super_admin', 'admin'].includes(profile?.role)) {
                    alert('Access denied. Admin privileges required.');
                    window.parent.location.href = '/dashboard.html';
                    return;
                }
                
                await loadDashboardStats();
                await loadStaffList();
                setupEventListeners();
            } catch (error) {
                console.error('Init error:', error);
                showNotification('Failed to initialize dashboard', 'error');
            }
        }
        
        // ======================= DASHBOARD STATS =======================
        async function loadDashboardStats() {
            try {
                const { count: total } = await supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'staff');
                const { count: active } = await supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'staff').eq('status', 'active');
                const { count: clockedIn } = await supabase.from('staff_shifts').select('*', { count: 'exact', head: true }).is('clock_out', null);
                
                document.getElementById('stats-container').innerHTML = `
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-red-600">
                        <div class="flex items-center justify-between">
                            <div><p class="text-gray-500 text-sm">Total Staff</p><p class="text-2xl font-bold">${total || 0}</p></div>
                            <i class="fas fa-users text-3xl text-red-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-green-600">
                        <div class="flex items-center justify-between">
                            <div><p class="text-gray-500 text-sm">Active Staff</p><p class="text-2xl font-bold">${active || 0}</p></div>
                            <i class="fas fa-user-check text-3xl text-green-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-blue-600">
                        <div class="flex items-center justify-between">
                            <div><p class="text-gray-500 text-sm">Clocked In</p><p class="text-2xl font-bold">${clockedIn || 0}</p></div>
                            <i class="fas fa-clock text-3xl text-blue-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-purple-600">
                        <div class="flex items-center justify-between">
                            <div><p class="text-gray-500 text-sm">Active Job Roles</p><p class="text-2xl font-bold">${Object.keys(JOB_TITLES).length}</p></div>
                            <i class="fas fa-tags text-3xl text-purple-600 opacity-50"></i>
                        </div>
                    </div>
                `;
            } catch (error) { console.error(error); }
        }
        
        // ======================= STAFF LIST WITH LEGACY FILTERING =======================
        async function loadStaffList() {
            try {
                let query = supabase.from('profiles').select('*', { count: 'exact' }).eq('role', 'staff');
                
                if (currentFilters.search) {
                    query = query.or(`first_name.ilike.%${currentFilters.search}%,last_name.ilike.%${currentFilters.search}%,email.ilike.%${currentFilters.search}%,phone.ilike.%${currentFilters.search}%`);
                }
                
                if (currentFilters.role) {
                    // If filtering by 'event_host', also include legacy 'event_master' records
                    if (currentFilters.role === 'event_host') {
                        query = query.or(`staff_role.eq.event_host,staff_role.eq.event_master`);
                    } else {
                        query = query.eq('staff_role', currentFilters.role);
                    }
                }
                
                if (currentFilters.status) {
                    query = query.eq('status', currentFilters.status);
                }
                
                const from = (currentPage - 1) * pageSize;
                const { data: staff, error, count } = await query.order('created_at', { ascending: false }).range(from, from + pageSize - 1);
                if (error) throw error;
                totalStaff = count || 0;
                renderStaffTable(staff || []);
                renderPagination();
            } catch (error) { 
                console.error('Load staff error:', error);
                showNotification('Failed to load staff list', 'error');
            }
        }
        
        function renderStaffTable(staff) {
            const tbody = document.getElementById('staff-table-body');
            if (!staff.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-gray-500">No staff members found</td></tr>`;
                return;
            }
            
            tbody.innerHTML = staff.map(member => {
                const jobTitleDisplay = getJobTitleDisplay(member.staff_role);
                const screensCount = getScreensForRole(member.staff_role).length;
                const statusColor = member.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                const statusIcon = member.status === 'active' ? 'fa-check-circle' : 'fa-circle';
                return `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4">
                            <div class="flex items-center">
                                <div class="h-10 w-10 bg-red-100 rounded-full flex items-center justify-center">
                                    <span class="text-red-600 font-semibold">${getInitials(member.first_name, member.last_name)}</span>
                                </div>
                                <div class="ml-4">
                                    <div class="text-sm font-medium text-gray-900">${escapeHtml(member.first_name || '')} ${escapeHtml(member.last_name || '')}</div>
                                    <div class="text-sm text-gray-500">${escapeHtml(member.email || '')}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4"><span class="role-badge bg-indigo-100 text-indigo-800"><i class="fas fa-briefcase mr-1 text-xs"></i>${jobTitleDisplay}</span></td>
                        <td class="px-6 py-4"><span class="text-sm font-medium">${screensCount} screens</span><span class="text-xs text-gray-400 ml-1">accessible</span></td>
                        <td class="px-6 py-4"><span class="status-badge ${statusColor}"><i class="fas ${statusIcon} mr-1 text-xs"></i>${member.status || 'active'}</span></td>
                        <td class="px-6 py-4 text-sm text-gray-500">${member.last_seen ? formatDate(member.last_seen) : 'Never'}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <button onclick="window.viewStaffProfile('${member.id}')" class="text-blue-600 hover:text-blue-900 mr-3 transition" title="View Profile"><i class="fas fa-eye"></i></button>
                            <button onclick="window.editStaff('${member.id}')" class="text-green-600 hover:text-green-900 mr-3 transition" title="Edit"><i class="fas fa-edit"></i></button>
                            <button onclick="window.toggleStaffStatus('${member.id}', '${member.status}')" class="text-yellow-600 hover:text-yellow-900 transition" title="${member.status === 'active' ? 'Deactivate' : 'Activate'}"><i class="fas ${member.status === 'active' ? 'fa-ban' : 'fa-check-circle'}"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        function renderPagination() {
            const totalPages = Math.ceil(totalStaff / pageSize);
            const container = document.getElementById('pagination-container');
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            container.innerHTML = `
                <div class="flex justify-between items-center flex-wrap gap-2">
                    <div class="text-sm text-gray-700">Showing ${((currentPage - 1) * pageSize) + 1} to ${Math.min(currentPage * pageSize, totalStaff)} of ${totalStaff}</div>
                    <div class="flex gap-2">
                        <button onclick="window.changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} class="px-3 py-1 border rounded ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50'}">Prev</button>
                        <span class="px-3 py-1 bg-gray-100 rounded">${currentPage} / ${totalPages}</span>
                        <button onclick="window.changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} class="px-3 py-1 border rounded ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50'}">Next</button>
                    </div>
                </div>
            `;
        }
        
        // ======================= STAFF FORM (CREATE / EDIT) =======================
        async function openStaffForm(staffId = null) {
            const modal = document.getElementById('staff-form-modal');
            const container = document.getElementById('staff-form-container');
            document.getElementById('modal-title').textContent = staffId ? 'Edit Staff Member' : 'Add New Staff';
            
            let staffData = null;
            if (staffId) {
                const { data } = await supabase.from('profiles').select('*').eq('id', staffId).single();
                staffData = data;
                // Normalize legacy role for form dropdown
                if (staffData && staffData.staff_role === 'event_master') staffData.staff_role = 'event_host';
            }
            
            // Build job title options
            const jobOptions = Object.entries(JOB_TITLES).map(([key, val]) => 
                `<option value="${key}" ${staffData?.staff_role === key ? 'selected' : ''}>${val.name}</option>`
            ).join('');
            
            container.innerHTML = `
                <form id="staff-form" class="p-6 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">First Name *</label><input type="text" name="first_name" required value="${escapeHtml(staffData?.first_name || '')}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Surname *</label><input type="text" name="last_name" required value="${escapeHtml(staffData?.last_name || '')}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Email *</label><input type="email" name="email" required value="${escapeHtml(staffData?.email || '')}" ${staffId ? 'readonly class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100"' : 'class="w-full px-3 py-2 border border-gray-300 rounded-lg"'}</div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Phone</label><input type="tel" name="phone" value="${escapeHtml(staffData?.phone || '')}" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></div>
                        ${!staffId ? `<div><label class="block text-sm font-medium text-gray-700 mb-1">Password *</label><input type="password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg"></div>` : ''}
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Clock PIN (4-6 digits)</label><input type="password" name="clock_in_pin" maxlength="6" value="${escapeHtml(staffData?.clock_in_pin || '')}" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Staff Job Title *</label>
                            <select name="staff_role" required class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white">
                                <option value="">Select Job Title</option>
                                ${jobOptions}
                            </select>
                        </div>
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                            <select name="status" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white">
                                <option value="active" ${staffData?.status === 'active' ? 'selected' : ''}>Active</option>
                                <option value="inactive" ${staffData?.status === 'inactive' ? 'selected' : ''}>Inactive</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                        <h3 class="text-md font-semibold text-gray-800 mb-3"><i class="fas fa-desktop text-red-500 mr-2"></i>Screens Access (Auto-assigned by Job Title)</h3>
                        <div id="screens-preview" class="text-sm text-gray-500 italic">Select a job title to see available screens</div>
                    </div>
                    
                    <div class="flex justify-end gap-3 pt-2 border-t border-gray-200">
                        <button type="button" onclick="window.closeStaffForm()" class="px-5 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">Cancel</button>
                        <button type="submit" class="px-5 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition shadow-sm">${staffId ? 'Update Staff' : 'Create Staff'}</button>
                    </div>
                </form>
            `;
            
            const roleSelect = container.querySelector('select[name="staff_role"]');
            const preview = container.querySelector('#screens-preview');
            
            function updateScreensPreview() {
                const selectedVal = roleSelect.value;
                if (selectedVal && JOB_TITLES[selectedVal]) {
                    const screens = JOB_TITLES[selectedVal].screens;
                    preview.innerHTML = `<p class="text-sm font-medium text-gray-700 mb-2">This staff member will access:</p><div class="flex flex-wrap gap-2">${screens.map(s => `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs bg-green-100 text-green-800 border border-green-200"><i class="fas ${s.icon} mr-1"></i>${s.name}</span>`).join('')}</div>`;
                } else {
                    preview.innerHTML = '<p class="text-sm text-gray-500 italic"><i class="fas fa-info-circle mr-1"></i>Select a job title to see available screens</p>';
                }
            }
            
            roleSelect.addEventListener('change', updateScreensPreview);
            if (staffData?.staff_role) updateScreensPreview();
            
            document.getElementById('staff-form').addEventListener('submit', (e) => { e.preventDefault(); saveStaff(staffId); });
            modal.classList.remove('hidden');
        }
        
        async function saveStaff(staffId = null) {
            const form = document.getElementById('staff-form');
            const formData = new FormData(form);
            
            try {
                if (staffId) {
                    // Update existing staff - NEVER change role from staff
                    const updatePayload = {
                        first_name: formData.get('first_name'),
                        last_name: formData.get('last_name'),
                        phone: formData.get('phone'),
                        clock_in_pin: formData.get('clock_in_pin') || null,
                        staff_role: formData.get('staff_role'),
                        status: formData.get('status'),
                        updated_at: new Date().toISOString()
                    };
                    const { error } = await supabase.from('profiles').update(updatePayload).eq('id', staffId);
                    if (error) throw error;
                    showNotification('Staff updated successfully', 'success');
                } else {
                    // Create new staff user in Auth
                    const email = formData.get('email');
                    const password = formData.get('password');
                    const { data: auth, error: authError } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: { 
                            data: { 
                                first_name: formData.get('first_name'), 
                                last_name: formData.get('last_name'), 
                                role: 'staff' 
                            } 
                        }
                    });
                    if (authError) throw authError;
                    if (!auth.user) throw new Error('User creation failed');
                    
                    // Insert profile with role = 'staff' (critical: do NOT set role to job title)
                    const { error: profileError } = await supabase.from('profiles').insert([{
                        id: auth.user.id,
                        first_name: formData.get('first_name'),
                        last_name: formData.get('last_name'),
                        email: email,
                        phone: formData.get('phone'),
                        role: 'staff',          // Only 'staff', 'admin', or 'customer'
                        staff_role: formData.get('staff_role'),
                        clock_in_pin: formData.get('clock_in_pin') || null,
                        status: formData.get('status') || 'active'
                    }]);
                    if (profileError) throw profileError;
                    showNotification('Staff created successfully. Login credentials sent.', 'success');
                }
                closeStaffForm();
                await loadStaffList();
                await loadDashboardStats();
            } catch (error) {
                console.error('Save error:', error);
                showNotification(error.message || 'Operation failed', 'error');
            }
        }
        
        // ======================= PROFILE VIEW =======================
        async function viewStaffProfile(staffId) {
            try {
                const { data: staff } = await supabase.from('profiles').select('*').eq('id', staffId).single();
                if (!staff) throw new Error('Staff not found');
                const jobDisplay = getJobTitleDisplay(staff.staff_role);
                const screens = getScreensForRole(staff.staff_role);
                const { data: shift } = await supabase.from('staff_shifts').select('*').eq('staff_id', staffId).is('clock_out', null).single();
                
                const container = document.getElementById('staff-profile-container');
                container.innerHTML = `
                    <div class="p-6 space-y-6">
                        <div class="bg-gradient-to-r from-gray-50 to-white rounded-xl p-6 border">
                            <div class="flex items-center space-x-4 mb-4">
                                <div class="h-16 w-16 bg-red-100 rounded-full flex items-center justify-center"><span class="text-red-700 text-2xl font-bold">${getInitials(staff.first_name, staff.last_name)}</span></div>
                                <div><h3 class="text-xl font-bold">${escapeHtml(staff.first_name)} ${escapeHtml(staff.last_name)}</h3><p class="text-gray-500">${escapeHtml(staff.email)}</p></div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                                <div><p class="text-xs text-gray-500 uppercase">Job Title</p><p class="font-medium"><i class="fas fa-badge mr-1 text-red-500"></i>${jobDisplay}</p></div>
                                <div><p class="text-xs text-gray-500 uppercase">Status</p><span class="status-badge ${staff.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${staff.status}</span></div>
                                <div><p class="text-xs text-gray-500 uppercase">Phone</p><p class="font-medium">${escapeHtml(staff.phone || 'Not provided')}</p></div>
                                <div><p class="text-xs text-gray-500 uppercase">Last Seen</p><p class="font-medium">${staff.last_seen ? formatDateTime(staff.last_seen) : 'Never'}</p></div>
                                <div><p class="text-xs text-gray-500 uppercase">Clock PIN</p><p class="font-medium">${staff.clock_in_pin ? '●●●●' : 'Not set'}</p></div>
                            </div>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-5 border">
                            <h3 class="font-semibold mb-4 flex items-center"><i class="fas fa-tv text-red-500 mr-2"></i>Assigned Screens & Access</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${screens.map(s => `<div class="flex items-center p-3 bg-white rounded-lg border border-gray-200 shadow-sm"><i class="fas ${s.icon} text-red-500 w-6"></i><div class="ml-2"><p class="text-sm font-medium">${s.name}</p><p class="text-xs text-gray-400">${s.path}</p></div></div>`).join('')}
                                ${screens.length === 0 ? '<p class="text-gray-400 italic col-span-2">No specific screens assigned. Contact admin.</p>' : ''}
                            </div>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-5 border">
                            <h3 class="font-semibold mb-3"><i class="fas fa-history text-red-500 mr-2"></i>Current Shift</h3>
                            ${shift ? `<div class="flex items-center text-green-700"><i class="fas fa-play-circle mr-2"></i><span>Clocked in since ${formatDateTime(shift.clock_in)}</span></div>` : '<p class="text-gray-500"><i class="fas fa-stop-circle mr-2"></i>Not clocked in</p>'}
                        </div>
                    </div>
                `;
                document.getElementById('staff-profile-modal').classList.remove('hidden');
            } catch (error) { 
                showNotification('Error loading profile', 'error');
            }
        }
        
        // ======================= UTILITIES =======================
        function getInitials(first, last) { return `${(first || 'U')[0]}${(last || '')[0] || ''}`.toUpperCase(); }
        function formatDate(d) { return d ? new Date(d).toLocaleDateString('en-ZA') : 'Never'; }
        function formatDateTime(d) { return d ? new Date(d).toLocaleString('en-ZA') : 'Never'; }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]; }); }
        
        function showNotification(msg, type) {
            const n = document.createElement('div');
            n.className = `fixed top-5 right-5 z-50 px-5 py-3 rounded-lg shadow-xl flex items-center gap-2 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white animate-slide-in`;
            n.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i><span>${escapeHtml(msg)}</span>`;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3500);
        }
        
        async function toggleStaffStatus(id, current) {
            const newStatus = current === 'active' ? 'inactive' : 'active';
            if (confirm(`Are you sure you want to ${newStatus === 'active' ? 'activate' : 'deactivate'} this staff member?`)) {
                const { error } = await supabase.from('profiles').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', id);
                if (error) { showNotification('Status update failed', 'error'); return; }
                showNotification(`Staff ${newStatus === 'active' ? 'activated' : 'deactivated'}`, 'success');
                await loadStaffList();
                await loadDashboardStats();
            }
        }
        
        async function exportStaffList() {
            const { data: staff } = await supabase.from('profiles').select('first_name, last_name, email, phone, staff_role, status, last_seen').eq('role', 'staff');
            if (!staff || staff.length === 0) { showNotification('No staff data to export', 'error'); return; }
            const csvRows = [['First Name', 'Last Name', 'Email', 'Phone', 'Job Title', 'Status', 'Last Seen']];
            staff.forEach(s => {
                csvRows.push([
                    s.first_name || '', s.last_name || '', s.email || '', s.phone || '',
                    getJobTitleDisplay(s.staff_role), s.status || 'inactive',
                    s.last_seen ? formatDate(s.last_seen) : ''
                ]);
            });
            const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute('download', `staff_export_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showNotification('Staff list exported successfully', 'success');
        }
        
        function setupEventListeners() {
            let searchTimeout;
            document.getElementById('search-staff').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => { currentFilters.search = e.target.value; currentPage = 1; loadStaffList(); }, 400);
            });
            document.getElementById('filter-role').addEventListener('change', (e) => { currentFilters.role = e.target.value; currentPage = 1; loadStaffList(); });
            document.getElementById('filter-status').addEventListener('change', (e) => { currentFilters.status = e.target.value; currentPage = 1; loadStaffList(); });
        }
        
        function changePage(p) { if (p > 0 && p <= Math.ceil(totalStaff / pageSize)) { currentPage = p; loadStaffList(); } }
        function closeStaffForm() { document.getElementById('staff-form-modal').classList.add('hidden'); }
        function closeStaffProfile() { document.getElementById('staff-profile-modal').classList.add('hidden'); }
        function editStaff(id) { openStaffForm(id); }
        
        // Expose globals for inline handlers
        window.openStaffForm = openStaffForm;
        window.closeStaffForm = closeStaffForm;
        window.closeStaffProfile = closeStaffProfile;
        window.viewStaffProfile = viewStaffProfile;
        window.editStaff = editStaff;
        window.toggleStaffStatus = toggleStaffStatus;
        window.exportStaffList = exportStaffList;
        window.changePage = changePage;
        
        document.addEventListener('DOMContentLoaded', initStaffManagement);
    </script>
</body>
</html>
