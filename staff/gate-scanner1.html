<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rands Gate Entry | Wristband Printing</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

:root {
  --red: #E30613;
  --red-dark: #a0010e;
  --red-light: #ff4757;
  --white: #ffffff;
  --bone: #f8fafd;
  --ink: #1e293b;
  --slate: #475569;
  --mist: #94a3b8;
  --border: #eef2f8;
  --shadow: 0 8px 20px -6px rgba(0,0,0,0.12);
}

body {
  background: var(--bone);
  min-height: 100vh;
  padding: 20px;
}

/* Header */
.scanner-header {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto 20px;
  padding: 16px 24px;
  background: var(--white);
  border-radius: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 15px;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, var(--red), var(--red-dark));
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: white;
}

.brand-text h1 {
  color: var(--ink);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.3px;
}

.brand-text h1 span {
  color: var(--red);
}

.brand-text p {
  color: var(--mist);
  font-size: 11px;
  letter-spacing: 0.3px;
}

.gate-section {
  display: flex;
  align-items: center;
  gap: 20px;
  background: var(--bone);
  padding: 8px 24px;
  border-radius: 60px;
  border: 1px solid var(--border);
}

.gate-badge {
  display: flex;
  align-items: center;
  gap: 8px;
}

.gate-dot {
  width: 10px;
  height: 10px;
  background: var(--red);
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.2); }
}

.gate-label {
  color: var(--slate);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 1px;
}

.gate-number {
  color: var(--red);
  font-weight: 800;
  font-size: 18px;
}

.time-display {
  font-family: monospace;
  font-size: 18px;
  font-weight: 600;
  color: var(--red);
  letter-spacing: 1px;
}

/* Main Grid */
.scanner-app {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 25px;
}

/* Scanner Panel */
.scanner-panel {
  background: var(--white);
  border-radius: 28px;
  padding: 25px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.camera-container {
  background: #000;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 25px;
  position: relative;
  border: 2px solid var(--red);
  box-shadow: 0 0 0 4px rgba(227,6,19,0.1);
  aspect-ratio: 4/3;
}

.camera-view {
  width: 100%;
  height: 100%;
  background: linear-gradient(145deg, #111 0%, #000 100%);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.camera-view.shake {
  animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-3px); }
  20%, 40%, 60%, 80% { transform: translateX(3px); }
}

.camera-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.3) 100%);
}

.scan-area {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 70%;
  height: 50%;
  border: 2px solid var(--red);
  border-radius: 20px;
  box-shadow: 0 0 0 999px rgba(0,0,0,0.6);
}

.scan-line {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--red), var(--red-light), var(--red), transparent);
  animation: scanMove 2s ease-in-out infinite;
}

@keyframes scanMove {
  0% { top: 0; }
  50% { top: 100%; }
  100% { top: 0; }
}

.camera-instruction {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: white;
  font-size: 12px;
  font-weight: 500;
  background: rgba(0,0,0,0.7);
  padding: 6px 16px;
  border-radius: 30px;
  backdrop-filter: blur(5px);
  white-space: nowrap;
}

/* Quick Actions (only torch & manual now) */
.quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 25px;
}

.action-btn {
  padding: 14px;
  background: var(--bone);
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.action-btn:hover {
  border-color: var(--red);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(227,6,19,0.15);
}

.action-icon {
  font-size: 24px;
  margin-bottom: 6px;
}

.action-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}

/* Manual Entry */
.manual-entry {
  background: var(--bone);
  border-radius: 16px;
  padding: 20px;
}

.manual-entry h3 {
  color: var(--red);
  font-size: 14px;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.manual-input-group {
  display: flex;
  gap: 10px;
}

.manual-input-group input {
  flex: 1;
  padding: 14px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  color: var(--ink);
  text-transform: uppercase;
}

.manual-input-group input:focus {
  border-color: var(--red);
  outline: none;
}

.manual-input-group button {
  padding: 14px 24px;
  background: linear-gradient(135deg, var(--red), var(--red-dark));
  color: white;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.manual-input-group button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(227,6,19,0.4);
}

/* Right Panel */
.stats-panel {
  background: var(--white);
  border-radius: 28px;
  padding: 25px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.stats-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 2px solid var(--border);
}

.stats-header h2 {
  color: var(--ink);
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 700;
}

.shift-timer {
  background: var(--bone);
  color: var(--red);
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 13px;
  font-family: monospace;
  font-weight: 700;
}

.live-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--bone);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  border-left: 3px solid var(--red);
}

.stat-value {
  font-size: 28px;
  font-weight: 800;
  color: var(--red);
  line-height: 1;
}

.stat-label {
  font-size: 11px;
  color: var(--mist);
  text-transform: uppercase;
  margin-top: 5px;
  letter-spacing: 0.5px;
}

.ticket-status {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.status-card {
  background: var(--bone);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  border-top: 3px solid var(--red);
}

.status-icon {
  font-size: 24px;
  margin-bottom: 8px;
}

.status-label {
  font-size: 11px;
  color: var(--mist);
  text-transform: uppercase;
  margin-bottom: 5px;
}

.status-number {
  font-size: 32px;
  font-weight: 800;
  color: var(--red);
  line-height: 1;
}

.progress-section {
  margin-bottom: 20px;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--mist);
  margin-bottom: 8px;
}

.progress-header span:last-child {
  color: var(--red);
  font-weight: 700;
}

.progress-bar {
  height: 8px;
  background: var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red), var(--red-light));
  border-radius: 10px;
  transition: width 0.3s ease;
}

.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  padding: 4px;
  background: var(--bone);
  border-radius: 50px;
  width: fit-content;
}

.filter-chip {
  padding: 6px 16px;
  border-radius: 30px;
  background: transparent;
  border: none;
  font-size: 12px;
  cursor: pointer;
  color: var(--mist);
  font-weight: 600;
  transition: all 0.2s;
}

.filter-chip.active {
  background: var(--red);
  color: white;
}

.filter-chip:hover:not(.active) {
  color: var(--ink);
  background: var(--border);
}

.recent-scans {
  flex: 1;
  background: var(--bone);
  border-radius: 20px;
  padding: 15px;
  overflow-y: auto;
  max-height: 380px;
  min-height: 300px;
}

.feed-header {
  display: flex;
  justify-content: space-between;
  color: var(--mist);
  font-size: 11px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
  font-weight: 600;
}

.scan-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  background: var(--white);
  border-radius: 12px;
  margin-bottom: 8px;
  animation: slideIn 0.3s ease;
  border-left: 4px solid transparent;
}

.scan-item.valid { border-left-color: #4CAF50; }
.scan-item.invalid { border-left-color: var(--red); }
.scan-item.duplicate { border-left-color: #ff9800; }

.scan-avatar {
  width: 36px;
  height: 36px;
  background: var(--bone);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.scan-info { flex: 1; }
.scan-name { font-weight: 700; color: var(--ink); font-size: 13px; }
.scan-details { font-size: 10px; color: var(--mist); display: flex; gap: 8px; margin-top: 2px; }
.scan-time { font-size: 9px; color: var(--mist); margin-top: 2px; }

.scan-badge {
  padding: 3px 10px;
  border-radius: 30px;
  font-size: 9px;
  font-weight: 700;
  min-width: 65px;
  text-align: center;
}

.badge-valid { background: rgba(76, 175, 80, 0.15); color: #4CAF50; border: 1px solid rgba(76, 175, 80, 0.3); }
.badge-invalid { background: rgba(227, 6, 19, 0.15); color: var(--red); border: 1px solid rgba(227, 6, 19, 0.3); }
.badge-duplicate { background: rgba(255, 152, 0, 0.15); color: #ff9800; border: 1px solid rgba(255, 152, 0, 0.3); }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Toast messages (no modal) */
.scanner-toast {
  position: fixed;
  bottom: 30px;
  right: 30px;
  padding: 12px 20px;
  border-radius: 50px;
  color: white;
  font-weight: 500;
  animation: slideUp 0.3s ease;
  z-index: 1500;
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(10px);
}

.scanner-toast.success { background: #4CAF50; }
.scanner-toast.error { background: var(--red); }
.scanner-toast.warning { background: #ff9800; }

@keyframes slideUp {
  from { transform: translateY(100px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.success-flash {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(76, 175, 80, 0.3);
  z-index: 1999;
  pointer-events: none;
  animation: flashFade 0.5s ease-out;
}

@keyframes flashFade {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

/* Print Styles for Wristband */
@media print {
  body * {
    visibility: hidden;
  }
  .wristband-print-area, .wristband-print-area * {
    visibility: visible;
  }
  .wristband-print-area {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    margin: 0;
    padding: 0;
  }
}

@media (max-width: 1000px) {
  .scanner-app { grid-template-columns: 1fr; }
  .header-controls { width: 100%; justify-content: center; }
  .event-selector { width: 100%; justify-content: center; }
  .event-select { width: 100%; }
  .gate-section { width: 100%; justify-content: center; flex-wrap: wrap; }
}

@media (max-width: 600px) {
  .quick-actions { grid-template-columns: 1fr; }
  .manual-input-group { flex-direction: column; }
  .live-stats, .ticket-status { grid-template-columns: 1fr; }
  .scan-area { width: 85%; height: 45%; }
  .camera-instruction { white-space: normal; font-size: 10px; width: 90%; }
}
</style>

<script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
    }
  }
</script>
</head>
<body>

<div class="scanner-header">
  <div class="brand-section">
    <div class="brand-icon"><i class="fas fa-qrcode"></i></div>
    <div class="brand-text">
      <h1>RANDS <span>GATE</span></h1>
      <p>Wristband Printing • Entry Control</p>
    </div>
  </div>
  <div class="gate-section">
    <div class="gate-badge">
      <div class="gate-dot"></div>
      <span class="gate-label">GATE</span>
    </div>
    <div class="gate-number" id="gateName">MAIN GATE</div>
    <div class="time-display" id="gateTime">12:34:56</div>
  </div>
</div>

<div class="scanner-app">
  <div class="scanner-panel">
    <div class="camera-container">
      <div class="camera-view" id="cameraView">
        <div class="camera-overlay"></div>
        <div class="scan-area"><div class="scan-line"></div></div>
        <div class="camera-instruction">POSITION QR CODE IN FRAME</div>
      </div>
    </div>
    
    <div class="quick-actions">
      <div class="action-btn" id="toggleTorch">
        <div class="action-icon"><i class="fas fa-lightbulb"></i></div>
        <div class="action-label">TORCH</div>
      </div>
    </div>
    
    <div class="manual-entry">
      <h3><i class="fas fa-keyboard"></i> MANUAL ENTRY</h3>
      <div class="manual-input-group">
        <input type="text" id="manualTicketInput" placeholder="Enter ticket ID" autocomplete="off">
        <button id="manualCheckinBtn">VERIFY & ENTER</button>
      </div>
    </div>
  </div>
  
  <div class="stats-panel">
    <div class="stats-header">
      <h2>SCAN STATISTICS</h2>
      <div class="shift-timer" id="shiftTimer">00:00:00</div>
    </div>
    
    <div class="live-stats">
      <div class="stat-card"><div class="stat-value" id="totalScans">0</div><div class="stat-label">TOTAL SCANS</div></div>
      <div class="stat-card"><div class="stat-value" id="validScans">0</div><div class="stat-label">VALID</div></div>
      <div class="stat-card"><div class="stat-value" id="invalidScans">0</div><div class="stat-label">INVALID</div></div>
      <div class="stat-card"><div class="stat-value" id="uniqueGuests">0</div><div class="stat-label">INSIDE VENUE</div></div>
    </div>
    
    <div class="ticket-status">
      <div class="status-card"><div class="status-icon"><i class="fas fa-ticket-alt"></i></div><div class="status-label">PURCHASED</div><div class="status-number" id="purchasedTickets">0</div></div>
      <div class="status-card"><div class="status-icon"><i class="fas fa-hourglass-half"></i></div><div class="status-label">UNSCANNED</div><div class="status-number" id="unscannedTickets">0</div></div>
    </div>
    
    <div class="progress-section">
      <div class="progress-header"><span>ENTRY PROGRESS</span><span id="progressPercent">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
    </div>
    
    <div class="filter-bar">
      <div class="filter-chip active" data-filter="all">ALL</div>
      <div class="filter-chip" data-filter="valid">VALID</div>
      <div class="filter-chip" data-filter="invalid">INVALID</div>
      <div class="filter-chip" data-filter="duplicate">DUPLICATE</div>
    </div>
    
    <div class="recent-scans" id="recentScans">
      <div class="feed-header"><span>RECENT SCANS</span><span>STATUS</span></div>
      <div style="text-align: center; color: var(--mist); padding: 40px;">Ready to scan</div>
    </div>
  </div>
</div>

<div id="scannerToast"></div>

<script type="module">
  import { supabase } from '../config/supabase.js';

  let currentEvent = null;
  let allEvents = [];
  let allTickets = [];
  let lastValidScan = null;
  
  let scanState = {
    totalScans: 0,
    validScans: 0,
    invalidScans: 0,
    duplicateScans: 0,
    scans: [],
    currentFilter: 'all',
    shiftStart: new Date()
  };

  let checkinsSubscription = null;
  let isLoadingTickets = false;

  // ========== LOAD ONLY UPCOMING / TODAY ACTIVE EVENT (no dropdown) ==========
  async function loadCurrentEvent() {
    const now = new Date().toISOString();
    const { data, error } = await supabase
      .from('events')
      .select('id, name, status, start_time, end_time, image_url, location')
      .eq('status', 'active')
      .order('start_time', { ascending: true });
    
    if (error) {
      console.error('Error loading events:', error);
      showToast('Failed to load events', 'error');
      return false;
    }
    
    allEvents = data || [];
    if (allEvents.length === 0) {
      showToast('No active events found', 'warning');
      return false;
    }
    
    // Pick the first event that is today or future, or the soonest
    let selected = allEvents[0];
    for (let ev of allEvents) {
      if (ev.start_time && ev.start_time > now) {
        selected = ev;
        break;
      }
    }
    currentEvent = selected;
    document.getElementById('gateName').innerHTML = (currentEvent.name.split(' ')[0] || 'MAIN') + ' GATE';
    await loadEventTickets(currentEvent.id);
    return true;
  }
  
  // ========== SETUP REALTIME SUBSCRIPTION ==========
  function setupRealtimeSubscription(eventId) {
    if (checkinsSubscription) checkinsSubscription.unsubscribe();
    if (!eventId) return;
    
    checkinsSubscription = supabase
      .channel(`checkins-${eventId}`)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'checkins',
        filter: `event_id=eq.${eventId}`
      }, (payload) => {
        const newCheckin = payload.new;
        const ticket = allTickets.find(t => t.id === newCheckin.ticket_id);
        if (ticket && !ticket.checkedIn) {
          ticket.checkedIn = true;
          ticket.checkinTime = newCheckin.scanned_at;
          updateStatsFromTickets();
          const scanEntry = {
            id: newCheckin.ticket_id,
            name: ticket.attendeeName,
            type: ticket.ticketType,
            status: 'valid',
            icon: '✓',
            time: new Date(newCheckin.scanned_at).toLocaleTimeString()
          };
          scanState.scans.unshift(scanEntry);
          updateLiveStatsUI();
          addScanToFeed(scanEntry);
        }
      })
      .subscribe();
  }
  
  async function loadEventTickets(eventId) {
    if (!eventId || isLoadingTickets) return;
    isLoadingTickets = true;
    try {
      const { data, error } = await supabase
        .from('tickets')
        .select('id, customer_phone, checked_in, checked_in_at, status, ticket_types(name)')
        .eq('event_id', eventId);
      if (error) throw error;
      
      allTickets = (data || []).map(t => ({
        id: t.id,
        attendeeName: t.customer_phone || 'Guest',
        ticketType: t.ticket_types?.name || 'Standard',
        checkedIn: t.checked_in === true,
        checkinTime: t.checked_in_at,
        status: t.status
      }));
      
      updateStatsFromTickets();
      setupRealtimeSubscription(eventId);
    } catch (error) {
      console.error('Error loading tickets:', error);
      showToast('Failed to load tickets', 'error');
    } finally {
      isLoadingTickets = false;
    }
  }
  
  function updateStatsFromTickets() {
    const total = allTickets.length;
    const checked = allTickets.filter(t => t.checkedIn).length;
    document.getElementById('purchasedTickets').textContent = total;
    document.getElementById('unscannedTickets').textContent = total - checked;
    const percent = total ? Math.round((checked / total) * 100) : 0;
    document.getElementById('progressPercent').textContent = `${percent}%`;
    document.getElementById('progressFill').style.width = `${percent}%`;
  }

  function updateLiveStatsUI() {
    document.getElementById('totalScans').textContent = scanState.totalScans;
    document.getElementById('validScans').textContent = scanState.validScans;
    document.getElementById('invalidScans').textContent = scanState.invalidScans;
    const unique = new Set(scanState.scans.filter(s => s.status === 'valid').map(s => s.id)).size;
    document.getElementById('uniqueGuests').textContent = unique;
  }

  async function checkInTicket(ticketId) {
    const now = new Date().toISOString();
    const existingTicket = allTickets.find(t => t.id === ticketId);
    if (existingTicket?.checkedIn) throw new Error('DUPLICATE_TICKET');
    
    const { error: updateErr } = await supabase
      .from('tickets')
      .update({ checked_in: true, checked_in_at: now })
      .eq('id', ticketId)
      .eq('checked_in', false);
    if (updateErr) throw new Error('DUPLICATE_TICKET');
    
    const { error: checkinErr } = await supabase
      .from('checkins')
      .insert({
        ticket_id: ticketId,
        event_id: currentEvent.id,
        scanned_at: now,
        gate: document.querySelector('.gate-number')?.innerText || 'MAIN GATE',
        status: 'valid'
      });
    if (checkinErr) {
      await supabase.from('tickets').update({ checked_in: false, checked_in_at: null }).eq('id', ticketId);
      if (checkinErr.code === '23505') throw new Error('DUPLICATE_TICKET');
      throw checkinErr;
    }
    
    const ticket = allTickets.find(t => t.id === ticketId);
    if (ticket) { ticket.checkedIn = true; ticket.checkinTime = now; }
    updateStatsFromTickets();
    return true;
  }

  // ========== WRISTBAND GENERATION WITH QR CODE ==========
  async function generateAndPrintWristband(ticket) {
    if (!ticket) return;
    const eventData = currentEvent;
    const qrValue = ticket.id; // ticket ID matches gate scanner token
    const qrCanvas = document.createElement('canvas');
    await QRCode.toCanvas(qrCanvas, qrValue, { width: 80, margin: 1 });
    const qrDataUrl = qrCanvas.toDataURL();
    
    const wristbandHtml = `
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="UTF-8">
        <title>Wristband - ${escapeHtml(ticket.name)}</title>
        <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body {
            font-family: 'Inter', sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
          }
          .wristband {
            width: 260mm;
            height: 25mm;
            background: linear-gradient(135deg, #ffffff, #fef9f9);
            border-radius: 8px;
            border: 1px solid #E30613;

            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;

            position: relative;
            overflow: hidden;
          }
          .wristband::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: #E30613;
          }
          .band-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            border-right: 1px dashed #ddd;
            padding-right: 10px;
          }
          .band-logo {
            font-weight: 800;
            font-size: 18px;
            color: #E30613;
            letter-spacing: 1px;
          }
          .band-event {
            font-size: 8px;
            color: #475569;
          }
          .band-details {
            flex: 1;
            padding: 0 12px;
          }
          .band-name {
            font-weight: 700;
            font-size: 14px;
            color: #1e293b;
          }
          .band-info {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            font-size: 9px;
            color: #475569;
          }
          .band-type {
            background: #E30613;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 8px;
            display: inline-block;
          }
          .band-qr {
            width: 70px;
            text-align: center;
          }
          .band-qr img { width: 65px; height: 65px; }
          .band-id {
            font-size: 7px;
            color: #64748b;
            text-align: center;
            margin-top: 2px;
          }
          .band-venue {
            font-size: 7px;
            border-left: 1px dashed #ddd;
            padding-left: 10px;
            min-width: 60px;
            text-align: center;
          }
          @media print {
            body { margin: 0; padding: 0; }
            .no-print { display: none; }
            .wristband { break-inside: avoid; page-break-after: avoid; width: 260mm; margin: 0; }
          }
        </style>
      </head>
      <body>
        <div class="wristband">
          <div class="band-brand">
            <div class="band-logo">RANDS</div>
            <div class="band-event">${escapeHtml(eventData?.name || 'Event Access')}</div>
          </div>
          <div class="band-details">
            <div class="band-name">${escapeHtml(ticket.name)}</div>
            <div class="band-info">
              <span>${escapeHtml(ticket.phone || '')}</span>
              <span class="band-type">${escapeHtml(ticket.type)}</span>
            </div>

              <span>ID: ${ticket.id.slice(-12)}</span>
              <span>${new Date().toLocaleDateString()}</span>
            </div>

            <img src="${qrDataUrl}" alt="QR">

          </div>
        </div>
        <div class="no-print" style="position: fixed; bottom: 20px; left: 0; right: 0; text-align: center;">
          <button onclick="window.print()" style="padding: 10px 20px; background: #E30613; color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: 600;">PRINT WRISTBAND</button>

    const printWindow = window.open('', '_blank');
    printWindow.document.write(wristbandHtml);
    printWindow.document.close();

  async function processScan(ticketId) {
    if (!currentEvent) { showToast('No active event selected', 'error'); return false; }
    if (!ticketId || ticketId.trim() === '') { showToast('Enter a valid ticket ID', 'error'); return false; }
    ticketId = ticketId.trim();
    
    let ticket = allTickets.find(t => t.id === ticketId);
    if (!ticket && navigator.onLine) {
      try {
        const { data } = await supabase
          .from('tickets')
          .select('id, customer_phone, checked_in, checked_in_at, status, ticket_types(name)')
          .eq('id', ticketId)
          .maybeSingle();
        if (data) {
          ticket = {
            id: data.id,
            attendeeName: data.customer_phone || 'Guest',
            ticketType: data.ticket_types?.name || 'Standard',
            checkedIn: data.checked_in === true,
            checkinTime: data.checked_in_at,
            status: data.status
          };
          allTickets.push(ticket);
        }
      } catch (err) { console.error(err); }
    }
    
    scanState.totalScans++;
    let status = 'invalid';
    let message = '';
    
    if (!ticket) {
      status = 'invalid';
      scanState.invalidScans++;
      message = 'Ticket ID not found for this event';
    } else if (ticket.status !== 'issued') {
      status = 'invalid';
      scanState.invalidScans++;
      message = `Ticket status: ${ticket.status}`;
    } else if (ticket.checkedIn === true) {
      status = 'duplicate';
      scanState.duplicateScans++;
      scanState.invalidScans++;
      message = 'Already scanned';
    } else {
      try {
        await checkInTicket(ticketId);
        status = 'valid';
        scanState.validScans++;
        lastValidScan = { id: ticketId, name: ticket.attendeeName, type: ticket.ticketType };
        message = `Welcome ${ticket.attendeeName}`;
        ticket.checkedIn = true;
        ticket.checkinTime = new Date().toISOString();
        updateStatsFromTickets();
        
        // PRINT WRISTBAND AFTER SUCCESSFUL SCAN
        const wristbandTicket = {
          id: ticket.id,
          name: ticket.attendeeName,
          type: ticket.ticketType,
          phone: ticket.attendeeName !== 'Guest' ? ticket.attendeeName : ''
        };
        generateAndPrintWristband(wristbandTicket);
        
      } catch (err) {
        if (err.message === 'DUPLICATE_TICKET') {
          status = 'duplicate';
          scanState.duplicateScans++;
          scanState.invalidScans++;
          message = 'Duplicate scan prevented';
          ticket.checkedIn = true;
        } else {
          status = 'invalid';
          scanState.invalidScans++;
          message = err.message || 'Check-in failed';
        }
      }
    }
    
    const scanEntry = {
      id: ticketId,
      name: ticket?.attendeeName || 'Unknown',
      type: ticket?.ticketType || 'N/A',
      status: status,
      icon: status === 'valid' ? '✓' : (status === 'duplicate' ? '⚠' : '✗'),
      time: new Date().toLocaleTimeString()
    };
    scanState.scans.unshift(scanEntry);
    if (scanState.scans.length > 50) scanState.scans = scanState.scans.slice(0, 50);
    updateLiveStatsUI();
    addScanToFeed(scanEntry);
    
    if (status === 'valid') {
      createSuccessFlash();
      showToast(`${scanEntry.name} entered`, 'success');
    } else if (status === 'duplicate') {
      shakeCamera();
      showToast(`Already scanned: ${scanEntry.name}`, 'warning');
    } else {
      shakeCamera();
      showToast(`Invalid: ${message}`, 'error');
    }
    return status === 'valid';
  }
  
  function createSuccessFlash() {
    const flash = document.createElement('div');
    flash.className = 'success-flash';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 500);
  }
  
  function shakeCamera() {
    const cameraView = document.getElementById('cameraView');
    cameraView.classList.add('shake');
    setTimeout(() => cameraView.classList.remove('shake'), 500);
  }
  
  function showToast(message, type = 'info') {
    const container = document.getElementById('scannerToast');
    const toast = document.createElement('div');
    toast.className = `scanner-toast ${type}`;
    toast.innerHTML = `<span>${type === 'success' ? '✔' : type === 'error' ? '✖' : '⚠'}</span> ${message}`;
    container.innerHTML = '';
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }
  
  function addScanToFeed(scan) {
    const recentScans = document.getElementById('recentScans');
    const scanItem = document.createElement('div');
    scanItem.className = `scan-item ${scan.status}`;
    let badgeClass = `badge-${scan.status}`;
    let badgeText = scan.status.toUpperCase();
    scanItem.innerHTML = `
      <div class="scan-avatar">${scan.icon}</div>
      <div class="scan-info">
        <div class="scan-name">${escapeHtml(scan.name)}</div>
        <div class="scan-details"><span>${scan.id.slice(-8)}</span><span>•</span><span>${scan.type}</span></div>
        <div class="scan-time">${scan.time}</div>
      </div>
      <div class="scan-badge ${badgeClass}">${badgeText}</div>
    `;
    const feedHeader = recentScans.querySelector('.feed-header');
    if (feedHeader) recentScans.insertBefore(scanItem, feedHeader.nextSibling);
    else recentScans.insertBefore(scanItem, recentScans.firstChild);
    const emptyMsg = recentScans.querySelector('div[style*="text-align: center"]');
    if (emptyMsg) emptyMsg.remove();
    while (recentScans.children.length > 21) recentScans.removeChild(recentScans.lastChild);
    applyFilter();
  }
  
  function applyFilter() {
    const filter = scanState.currentFilter;
    document.querySelectorAll('.scan-item').forEach(item => {
      if (filter === 'all') item.style.display = 'flex';
      else {
        const status = item.classList.contains('valid') ? 'valid' : item.classList.contains('invalid') ? 'invalid' : 'duplicate';
        item.style.display = status === filter ? 'flex' : 'none';
      }
    });
  }
  
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  // Event listeners
  document.getElementById('manualCheckinBtn').addEventListener('click', () => {
    const ticketId = document.getElementById('manualTicketInput').value.trim();
    if (ticketId) {
      processScan(ticketId);
      document.getElementById('manualTicketInput').value = '';
    } else showToast('Enter ticket ID', 'error');
  });
  document.getElementById('manualTicketInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('manualCheckinBtn').click();
  });
  document.getElementById('toggleTorch').addEventListener('click', () => showToast('Flashlight toggled', 'info'));
  document.getElementById('cameraView').addEventListener('click', () => showToast('Position QR code in frame', 'info'));
  
  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      scanState.currentFilter = chip.dataset.filter;
      applyFilter();
    });
  });
  
  setInterval(() => {
    document.getElementById('gateTime').textContent = new Date().toLocaleTimeString();
  }, 1000);
  
  setInterval(() => {
    const diff = Math.floor((new Date() - scanState.shiftStart) / 1000);
    const h = Math.floor(diff / 3600).toString().padStart(2, '0');
    const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
    const s = (diff % 60).toString().padStart(2, '0');
    document.getElementById('shiftTimer').textContent = `${h}:${m}:${s}`;
  }, 1000);
  
  window.addEventListener('online', () => { if (currentEvent) loadEventTickets(currentEvent.id); });
  window.addEventListener('offline', () => showToast('Offline mode', 'warning'));
  
  async function init() {
    await loadCurrentEvent();
    showToast('Gate ready – scan ticket to print wristband', 'success');
    window.addEventListener('beforeunload', () => { if (checkinsSubscription) checkinsSubscription.unsubscribe(); });
  }
  init();
</script>
