<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Staff Clock‑in · Rands Vibe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f0f2f8 0%, #eef2f8 100%);
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 48px;
            padding: 32px 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid rgba(227,6,19,0.15);
            margin-bottom: 28px;
        }
        .red-header {
            background: #E30613;
            color: white;
            border-radius: 60px;
            padding: 12px 20px;
            display: inline-block;
            font-weight: 700;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .pin-input {
            width: 100%;
            padding: 18px 20px;
            font-size: 1.8rem;
            text-align: center;
            letter-spacing: 8px;
            font-family: monospace;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            margin: 20px 0;
            outline: none;
        }
        .pin-input:focus {
            border-color: #E30613;
            box-shadow: 0 0 0 3px rgba(227,6,19,0.2);
        }
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #E30613;
            color: white;
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-outline {
            background: transparent;
            border: 1px solid #e2e8f0;
            margin-top: 12px;
        }
        .staff-info {
            background: #fef2f2;
            border-radius: 32px;
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #E30613;
        }
        .shift-list {
            background: white;
            border-radius: 32px;
            padding: 20px;
        }
        .shift-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #edf2f7;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            text-align: center;
            z-index: 1000;
            display: none;
            font-size: 0.85rem;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .numeric-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 24px 0;
        }
        .key {
            background: #f1f5f9;
            border: none;
            padding: 18px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.1s;
        }
        .key:active { transform: scale(0.94); background: #e2e8f0; }
        .key-del { background: #fee2e2; color: #E30613; }
        .key-clear { background: #e2e8f0; }
        @media (max-width: 480px) {
            .pin-input { font-size: 1.2rem; letter-spacing: 4px; }
            .key { padding: 14px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card" style="text-align: center;">
        <div class="red-header"><i class="fas fa-fingerprint"></i> Staff Clock Terminal</div>
        <h1>Enter your PIN</h1>
        <input type="password" id="pinInput" class="pin-input" maxlength="6" inputmode="numeric" autofocus>
        
        <div class="numeric-keypad" id="keypad">
            <button class="key" data-digit="1">1</button>
            <button class="key" data-digit="2">2</button>
            <button class="key" data-digit="3">3</button>
            <button class="key" data-digit="4">4</button>
            <button class="key" data-digit="5">5</button>
            <button class="key" data-digit="6">6</button>
            <button class="key" data-digit="7">7</button>
            <button class="key" data-digit="8">8</button>
            <button class="key" data-digit="9">9</button>
            <button class="key key-clear" data-action="clear">⌫ Clear</button>
            <button class="key" data-digit="0">0</button>
            <button class="key key-del" data-action="delete">✕</button>
        </div>
        
        <button class="btn btn-primary" id="clockBtn">Clock In / Out</button>
        <button class="btn btn-outline" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh Active Shifts</button>
    </div>

    <div class="shift-list">
        <h3><i class="fas fa-clock"></i> Currently On Shift</h3>
        <div id="activeShiftsList">
            <div class="loading">Loading shifts...</div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    const pinInput = document.getElementById('pinInput');
    const clockBtn = document.getElementById('clockBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const activeShiftsDiv = document.getElementById('activeShiftsList');
    
    let currentStaff = null;      // stores staff data after PIN validation
    let activeShift = null;       // the current active shift (if any)

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.background = isError ? '#dc2626' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    async function loadActiveShifts() {
        try {
            const { data: shifts, error } = await supabase
                .from('staff_shifts')
                .select('*, staff_id')
                .eq('status', 'active')
                .order('login_time', { ascending: false });
            if (error) throw error;
            
            if (!shifts.length) {
                activeShiftsDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b;">No one on shift</div>';
                return;
            }
            
            // get staff names
            const staffIds = [...new Set(shifts.map(s => s.staff_id))];
            const { data: staffProfiles } = await supabase
                .from('profiles')
                .select('id, name, surname')
                .in('id', staffIds);
            
            const staffMap = new Map();
            staffProfiles?.forEach(p => staffMap.set(p.id, `${p.name} ${p.surname}`));
            
            let html = '';
            for (const shift of shifts) {
                const staffName = staffMap.get(shift.staff_id) || 'Unknown';
                const loginTime = new Date(shift.login_time).toLocaleTimeString();
                html += `
                    <div class="shift-item">
                        <div><i class="fas fa-user-circle"></i> <strong>${staffName}</strong></div>
                        <div>Since ${loginTime}</div>
                    </div>
                `;
            }
            activeShiftsDiv.innerHTML = html;
        } catch (err) {
            console.error(err);
            activeShiftsDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: #dc2626;">Error loading shifts</div>';
        }
    }

    async function validateStaffByPin(pin) {
        const { data, error } = await supabase
            .from('profiles')
            .select('id, name, surname, role, hourly_rate, clock_in_pin')
            .eq('clock_in_pin', pin)
            .maybeSingle();
        if (error) throw error;
        return data;
    }

    async function getActiveShift(staffId) {
        const { data, error } = await supabase
            .from('staff_shifts')
            .select('*')
            .eq('staff_id', staffId)
            .eq('status', 'active')
            .maybeSingle();
        if (error) throw error;
        return data;
    }

    async function clockIn(staff) {
        const { error } = await supabase
            .from('staff_shifts')
            .insert({
                staff_id: staff.id,
                login_time: new Date().toISOString(),
                status: 'active',
                login_method: 'pin_kiosk',
                kiosk_id: 'web-terminal'
            });
        if (error) throw error;
        // Log activity (optional)
        await supabase.from('staff_activity_logs').insert({
            staff_id: staff.id,
            module: 'Attendance',
            action: 'Clocked in via web terminal',
            created_at: new Date()
        });
        showToast(`✅ ${staff.name} ${staff.surname} – Clocked IN at ${new Date().toLocaleTimeString()}`);
        await loadActiveShifts();
    }

    async function clockOut(shift, staff) {
        const now = new Date();
        const hours = (now - new Date(shift.login_time)) / (1000 * 60 * 60);
        const { error } = await supabase
            .from('staff_shifts')
            .update({
                logout_time: now.toISOString(),
                status: 'completed',
                hours_worked: hours
            })
            .eq('id', shift.id);
        if (error) throw error;
        await supabase.from('staff_activity_logs').insert({
            staff_id: staff.id,
            module: 'Attendance',
            action: `Clocked out after ${hours.toFixed(2)} hours`,
            created_at: new Date()
        });
        showToast(`✅ ${staff.name} ${staff.surname} – Clocked OUT (${hours.toFixed(1)} hours)`);
        await loadActiveShifts();
    }

    async function handleClockAction() {
        const pin = pinInput.value.trim();
        if (!pin || !/^\d{4,6}$/.test(pin)) {
            showToast('Please enter a valid 4‑6 digit PIN', true);
            return;
        }
        
        // Disable button while processing
        clockBtn.disabled = true;
        clockBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        
        try {
            const staff = await validateStaffByPin(pin);
            if (!staff) {
                showToast('PIN not recognised. Please check with manager.', true);
                return;
            }
            
            const active = await getActiveShift(staff.id);
            if (active) {
                // Clock out
                await clockOut(active, staff);
                pinInput.value = '';
            } else {
                // Clock in
                await clockIn(staff);
                pinInput.value = '';
            }
        } catch (err) {
            console.error(err);
            showToast('Error: ' + err.message, true);
        } finally {
            clockBtn.disabled = false;
            clockBtn.innerHTML = 'Clock In / Out';
            pinInput.focus();
        }
    }

    // Keypad logic
    function setupKeypad() {
        const keypad = document.getElementById('keypad');
        keypad.addEventListener('click', (e) => {
            const btn = e.target.closest('.key');
            if (!btn) return;
            const digit = btn.dataset.digit;
            const action = btn.dataset.action;
            if (digit) {
                if (pinInput.value.length < 6) {
                    pinInput.value += digit;
                }
            } else if (action === 'delete') {
                pinInput.value = pinInput.value.slice(0, -1);
            } else if (action === 'clear') {
                pinInput.value = '';
            }
            pinInput.focus();
        });
    }

    // Also allow physical keyboard
    pinInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleClockAction();
        }
    });

    clockBtn.addEventListener('click', handleClockAction);
    refreshBtn.addEventListener('click', () => loadActiveShifts());

    // Initial load
    loadActiveShifts();
    setupKeypad();
    pinInput.focus();
    
    // Auto-refresh shifts every 15 seconds
    setInterval(loadActiveShifts, 15000);
</script>
</body>
</html>
