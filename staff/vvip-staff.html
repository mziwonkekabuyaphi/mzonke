<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VVIP Staff Management | Rands</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafd;
            color: #1e293b;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Red & White Theme */
        :root {
            --red: #E30613;
            --red-dark: #b0050f;
            --red-soft: #fff5f5;
            --white: #ffffff;
            --gray-bg: #f8fafc;
            --gray-border: #e2e8f0;
            --gray-text: #64748b;
            --success: #10b981;
            --gold: #f59e0b;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--red);
        }
        .header h1 { color: var(--red); }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--gray-border);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .stat-number { font-size: 32px; font-weight: 800; color: var(--red); }
        .stat-label { font-size: 13px; color: var(--gray-text); margin-top: 8px; }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            background: var(--white);
            padding: 8px;
            border-radius: 60px;
            border: 1px solid var(--gray-border);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 60px;
            border: none;
            background: transparent;
            color: var(--gray-text);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--red);
            color: white;
        }
        
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            background: var(--white);
            border: 1px solid var(--gray-border);
            border-radius: 40px;
            color: #1e293b;
        }
        .btn-refresh {
            background: var(--white);
            border: 1px solid var(--gray-border);
            padding: 12px 24px;
            border-radius: 40px;
            color: var(--gray-text);
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-refresh:hover {
            background: var(--red);
            border-color: var(--red);
            color: white;
        }
        
        .bookings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .booking-card {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            border-left: 4px solid var(--red);
            transition: 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .booking-card.checked_in { border-left-color: var(--success); }
        .booking-card.seated { border-left-color: var(--gold); }
        .booking-card.completed { border-left-color: #94a3b8; opacity: 0.8; }
        .booking-card.cancelled { border-left-color: #dc2626; opacity: 0.6; }
        
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .booking-ref {
            font-family: monospace;
            background: var(--gray-bg);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--red);
            font-weight: 600;
        }
        .booking-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-confirmed { background: #fef3c7; color: #b45309; }
        .status-checked_in { background: #dcfce7; color: #166534; }
        .status-seated { background: #fef3c7; color: #b45309; }
        .status-completed { background: #e2e8f0; color: #475569; }
        .status-cancelled { background: #fee2e2; color: #b91c1c; }
        
        .booking-details {
            margin: 15px 0;
            padding: 12px;
            background: var(--gray-bg);
            border-radius: 12px;
        }
        .booking-details div {
            margin: 6px 0;
            font-size: 13px;
        }
        .booking-details i {
            width: 24px;
            color: var(--red);
        }
        
        .booking-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            font-size: 12px;
        }
        .action-checkin { background: var(--success); color: white; }
        .action-seat { background: var(--gold); color: #1a1a1a; }
        .action-complete { background: var(--red); color: white; }
        .action-cancel { background: #dc2626; color: white; }
        .action-view { background: var(--gray-bg); color: var(--gray-text); border: 1px solid var(--gray-border); }
        .action-btn:hover { transform: translateY(-2px); opacity: 0.9; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--white);
            width: 90%;
            max-width: 500px;
            border-radius: 24px;
            padding: 24px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--gray-border);
        }
        .modal-header h3 { color: var(--red); }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid var(--gray-border);
        }
        .detail-label {
            width: 100px;
            font-weight: 600;
            color: var(--gray-text);
        }
        .detail-value {
            flex: 1;
            color: #1e293b;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 3000;
            display: none;
        }
        
        @media (max-width: 768px) {
            .bookings-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: 1fr 1fr; }
            .booking-actions { flex-direction: column; }
            .action-btn { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-crown"></i> VVIP Staff Dashboard</h1>
        <button class="btn-refresh" onclick="loadAllData()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="stat-number" id="totalBookings">-</div><div class="stat-label">Total Bookings</div></div>
        <div class="stat-card"><div class="stat-number" id="checkedInCount">-</div><div class="stat-label">Checked In</div></div>
        <div class="stat-card"><div class="stat-number" id="seatedCount">-</div><div class="stat-label">Seated</div></div>
        <div class="stat-card"><div class="stat-number" id="revenueToday">-</div><div class="stat-label">Today's Revenue</div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-status="all">All Bookings</button>
        <button class="tab-btn" data-status="confirmed">Pending Check-in</button>
        <button class="tab-btn" data-status="checked_in">Checked In</button>
        <button class="tab-btn" data-status="seated">Seated</button>
        <button class="tab-btn" data-status="completed">Completed</button>
        <button class="tab-btn" data-status="cancelled">Cancelled</button>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by reference, name, or phone..." onkeyup="applySearch()">
        <button class="btn-refresh" onclick="applySearch()"><i class="fas fa-search"></i> Search</button>
    </div>

    <div id="bookingsPanel" class="panel active">
        <div id="bookingsGrid" class="bookings-grid">
            <div style="text-align: center; padding: 40px; color: var(--gray-text);">Loading bookings...</div>
        </div>
    </div>
</div>

<!-- Booking Details Modal -->
<div id="detailsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-info-circle"></i> Booking Details</h3>
            <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
        </div>
        <div id="modalDetails"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    let allBookings = [];
    let currentFilter = 'all';
    let currentSearch = '';

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = isError ? '#dc2626' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function loadStats() {
        const { data: bookings } = await supabase.from('vvip_bookings').select('status, total_amount, created_at');
        
        const total = bookings?.length || 0;
        const checkedIn = bookings?.filter(b => b.status === 'checked_in').length || 0;
        const seated = bookings?.filter(b => b.status === 'seated').length || 0;
        
        const today = new Date().toISOString().split('T')[0];
        const todayRevenue = bookings?.filter(b => b.created_at?.startsWith(today) && b.status === 'completed')
            .reduce((sum, b) => sum + (b.total_amount || 0), 0) || 0;
        
        document.getElementById('totalBookings').innerText = total;
        document.getElementById('checkedInCount').innerText = checkedIn;
        document.getElementById('seatedCount').innerText = seated;
        document.getElementById('revenueToday').innerText = 'R' + todayRevenue.toLocaleString();
    }

    async function loadBookings() {
        try {
            const { data, error } = await supabase
                .from('vvip_bookings')
                .select(`
                    *,
                    packages:vvip_packages(name, price, capacity, image, benefits),
                    customer:profiles(name, phone)
                `)
                .order('created_at', { ascending: false });
            
            if (error) throw error;
            
            allBookings = data || [];
            renderBookings();
            loadStats();
        } catch (error) {
            console.error('Error loading bookings:', error);
            showToast('Error loading bookings: ' + error.message, true);
        }
    }

    function renderBookings() {
        let filtered = allBookings;
        
        if (currentFilter !== 'all') {
            filtered = filtered.filter(b => b.status === currentFilter);
        }
        
        if (currentSearch) {
            const searchLower = currentSearch.toLowerCase();
            filtered = filtered.filter(b => 
                (b.booking_reference || '').toLowerCase().includes(searchLower) ||
                (b.customer_name || '').toLowerCase().includes(searchLower) ||
                (b.customer_phone || '').includes(searchLower)
            );
        }
        
        const container = document.getElementById('bookingsGrid');
        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 60px; color: #94a3b8;"><i class="fas fa-ticket-alt" style="font-size: 48px; margin-bottom: 16px;"></i><p>No bookings found</p></div>';
            return;
        }
        
        container.innerHTML = filtered.map(booking => {
            const statusClass = `status-${booking.status}`;
            const statusText = (booking.status === 'checked_in' ? 'CHECKED IN' : booking.status.toUpperCase());
            const packageName = booking.packages?.name || 'VVIP Package';
            const statusMap = {
                'confirmed': 'Pending Check-in',
                'checked_in': 'Checked In',
                'seated': 'Seated',
                'completed': 'Completed',
                'cancelled': 'Cancelled'
            };
            
            let actionButtons = '';
            if (booking.status === 'confirmed') {
                actionButtons = `
                    <button class="action-btn action-checkin" onclick="updateBookingStatus('${booking.id}', 'checked_in')"><i class="fas fa-check-circle"></i> Check In</button>
                    <button class="action-btn action-cancel" onclick="updateBookingStatus('${booking.id}', 'cancelled')"><i class="fas fa-times"></i> Cancel</button>
                    <button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> Details</button>
                `;
            } else if (booking.status === 'checked_in') {
                actionButtons = `
                    <button class="action-btn action-seat" onclick="updateBookingStatus('${booking.id}', 'seated')"><i class="fas fa-chair"></i> Mark Seated</button>
                    <button class="action-btn action-cancel" onclick="updateBookingStatus('${booking.id}', 'cancelled')"><i class="fas fa-times"></i> Cancel</button>
                    <button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> Details</button>
                `;
            } else if (booking.status === 'seated') {
                actionButtons = `
                    <button class="action-btn action-complete" onclick="updateBookingStatus('${booking.id}', 'completed')"><i class="fas fa-check-double"></i> Complete</button>
                    <button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> Details</button>
                `;
            } else {
                actionButtons = `<button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> View Details</button>`;
            }
            
            // Calculate remaining balance if exists
            const remainingBalance = booking.remaining_balance !== null ? booking.remaining_balance : booking.total_amount;
            const usedAmount = booking.used_amount !== null ? booking.used_amount : 0;
            
            return `
                <div class="booking-card ${booking.status}">
                    <div class="booking-header">
                        <span class="booking-ref"><i class="fas fa-ticket-alt"></i> ${booking.booking_reference}</span>
                        <span class="booking-status ${statusClass}">${statusMap[booking.status] || statusText}</span>
                    </div>
                    <div><strong>${escapeHtml(packageName)}</strong> <span style="color: var(--gold);">R${booking.total_amount}</span></div>
                    <div class="booking-details">
                        <div><i class="fas fa-user"></i> ${escapeHtml(booking.customer_name || booking.customer_phone)}</div>
                        <div><i class="fas fa-phone"></i> ${booking.customer_phone || '-'}</div>
                        <div><i class="fas fa-calendar"></i> Booked: ${new Date(booking.created_at).toLocaleDateString()}</div>
                        <div><i class="fas fa-clock"></i> Time: ${new Date(booking.created_at).toLocaleTimeString()}</div>
                        ${remainingBalance !== booking.total_amount ? `<div><i class="fas fa-chart-line"></i> Remaining Credit: <strong style="color: var(--success);">R${remainingBalance.toFixed(2)}</strong></div>` : ''}
                    </div>
                    <div class="booking-actions">
                        ${actionButtons}
                    </div>
                </div>
            `;
        }).join('');
    }

    window.viewBookingDetails = async function(bookingId) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) return;
        
        const packageInfo = booking.packages || {};
        const remainingBalance = booking.remaining_balance !== null ? booking.remaining_balance : booking.total_amount;
        const usedAmount = booking.used_amount !== null ? booking.used_amount : 0;
        
        const modalContent = document.getElementById('modalDetails');
        modalContent.innerHTML = `
            <div class="detail-row"><div class="detail-label">Reference:</div><div class="detail-value"><strong>${booking.booking_reference}</strong></div></div>
            <div class="detail-row"><div class="detail-label">Package:</div><div class="detail-value">${escapeHtml(packageInfo.name || 'VVIP Package')}</div></div>
            <div class="detail-row"><div class="detail-label">Total Amount:</div><div class="detail-value"><strong style="color: var(--red);">R${booking.total_amount}</strong></div></div>
            <div class="detail-row"><div class="detail-label">Remaining:</div><div class="detail-value"><strong style="color: var(--success);">R${remainingBalance.toFixed(2)}</strong></div></div>
            <div class="detail-row"><div class="detail-label">Used:</div><div class="detail-value">R${usedAmount.toFixed(2)}</div></div>
            <div class="detail-row"><div class="detail-label">Customer:</div><div class="detail-value">${escapeHtml(booking.customer_name || '-')}</div></div>
            <div class="detail-row"><div class="detail-label">Phone:</div><div class="detail-value">${booking.customer_phone || '-'}</div></div>
            <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value"><span class="booking-status status-${booking.status}">${booking.status.toUpperCase()}</span></div></div>
            <div class="detail-row"><div class="detail-label">Booked:</div><div class="detail-value">${new Date(booking.created_at).toLocaleString()}</div></div>
            ${booking.check_in_time ? `<div class="detail-row"><div class="detail-label">Checked In:</div><div class="detail-value">${new Date(booking.check_in_time).toLocaleString()}</div></div>` : ''}
            ${booking.seated_time ? `<div class="detail-row"><div class="detail-label">Seated:</div><div class="detail-value">${new Date(booking.seated_time).toLocaleString()}</div></div>` : ''}
            ${booking.completed_time ? `<div class="detail-row"><div class="detail-label">Completed:</div><div class="detail-value">${new Date(booking.completed_time).toLocaleString()}</div></div>` : ''}
            <div class="detail-row"><div class="detail-label">Benefits:</div><div class="detail-value">${(packageInfo.benefits || []).map(b => `<span style="background: var(--gray-bg); padding: 2px 8px; border-radius: 20px; font-size: 11px; margin: 2px; display: inline-block;">${escapeHtml(b)}</span>`).join('') || '-'}</div></div>
        `;
        document.getElementById('detailsModal').style.display = 'flex';
    };

    window.closeDetailsModal = function() {
        document.getElementById('detailsModal').style.display = 'none';
    };

    window.updateBookingStatus = async function(bookingId, newStatus) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) return;
        
        const updateData = { status: newStatus };
        if (newStatus === 'checked_in') updateData.check_in_time = new Date().toISOString();
        if (newStatus === 'seated') updateData.seated_time = new Date().toISOString();
        if (newStatus === 'completed') updateData.completed_time = new Date().toISOString();
        if (newStatus === 'cancelled') updateData.cancelled_time = new Date().toISOString();
        
        const { error } = await supabase.from('vvip_bookings').update(updateData).eq('id', bookingId);
        if (error) {
            showToast('Error: ' + error.message, true);
        } else {
            showToast(`Booking ${newStatus.replace('_', ' ')} successfully`);
            await loadBookings();
        }
    };

    window.applySearch = function() {
        currentSearch = document.getElementById('searchInput').value;
        renderBookings();
    };

    window.loadAllData = function() {
        loadBookings();
        showToast('Refreshed');
    };

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.status;
            renderBookings();
        });
    });

    // Close modal on background click
    document.getElementById('detailsModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('detailsModal')) {
            closeDetailsModal();
        }
    });

    // Real-time subscriptions
    supabase.channel('vvip_bookings_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_bookings' }, () => {
            loadBookings();
        })
        .subscribe();

    // Initial load
    loadBookings();

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
