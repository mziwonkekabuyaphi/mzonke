<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VVIP Staff Console | Rands Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ========== DARK THEME – MATCH STAFF CONSOLE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #E30613;
            --red-dark: #a0010e;
            --red-dim: rgba(227,6,19,0.12);
            --red-border: rgba(227,6,19,0.25);
            --bg: #0D0F12;
            --surface: #141720;
            --surface2: #1C2030;
            --surface3: #232840;
            --border: rgba(255,255,255,0.06);
            --border2: rgba(255,255,255,0.1);
            --text: #F0F2F8;
            --text2: #8B92A8;
            --text3: #555E78;
            --green: #22C55E;
            --amber: #F59E0B;
            --gold: #FBBF24;
            --success: var(--green);
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.4);
            --shadow-md: 0 8px 20px -6px rgba(0,0,0,0.5);
            --shadow-card: var(--shadow-md);
            --radius-lg: 24px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--red);
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--red), #a0010e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .header h1 i {
            background: none;
            color: var(--red);
            margin-right: 8px;
        }
        .btn-refresh {
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text2);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .btn-refresh:hover {
            background: var(--red-dim);
            border-color: var(--red);
            color: var(--red);
            transform: translateY(-2px);
        }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 18px 16px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--red-border);
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--red);
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text2);
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
            background: var(--surface);
            padding: 6px;
            border-radius: 80px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 18px;
            border-radius: 60px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text2);
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--red);
            color: white;
            box-shadow: 0 2px 8px rgba(227,6,19,0.3);
        }

        /* Search */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 60px;
            font-size: 0.85rem;
            color: var(--text);
            transition: 0.2s;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--red);
            box-shadow: 0 0 0 2px var(--red-dim);
        }

        /* Booking grid */
        .bookings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;
        }
        .booking-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 0;
            overflow: hidden;
            transition: 0.25s ease;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            border-left: 5px solid var(--red);
        }
        .booking-card.checked_in { border-left-color: var(--green); }
        .booking-card.seated { border-left-color: var(--gold); }
        .booking-card.completed { border-left-color: var(--text3); opacity: 0.85; }
        .booking-card.cancelled { border-left-color: var(--red); opacity: 0.7; }

        .booking-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--border2);
        }

        .booking-header {
            padding: 16px 18px 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }
        .booking-ref {
            font-family: monospace;
            background: var(--surface2);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--red);
        }
        .booking-status {
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-confirmed { background: rgba(245,158,11,0.15); color: var(--amber); }
        .status-checked_in { background: rgba(34,197,94,0.15); color: var(--green); }
        .status-seated { background: rgba(251,191,36,0.15); color: var(--gold); }
        .status-completed { background: rgba(139,146,168,0.2); color: var(--text2); }
        .status-cancelled { background: rgba(227,6,19,0.15); color: var(--red); }

        .booking-body {
            padding: 14px 18px;
        }
        .package-title {
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--text);
        }
        .package-price {
            color: var(--red);
            font-size: 0.9rem;
        }
        .tables-info {
            background: var(--surface2);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            margin: 10px 0;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            color: var(--text2);
        }
        .booking-details {
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.75rem;
        }
        .booking-details div {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .booking-details i {
            width: 20px;
            color: var(--red);
        }
        .remaining-credit {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text2);
        }
        .remaining-credit strong {
            color: var(--green);
        }

        /* Guest check-in tracker */
        .guest-tracker {
            margin: 10px 0;
            padding: 10px 12px;
            background: var(--surface2);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .guest-tracker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.75rem;
            color: var(--text2);
            font-weight: 600;
        }
        .guest-tracker-row .count { color: var(--text); font-size: 0.85rem; }
        .guest-tracker-row .count strong { color: var(--green); }
        .guest-progress-bar {
            height: 6px;
            background: var(--surface3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .guest-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--red), var(--gold));
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .guest-tracker-actions {
            display: flex;
            gap: 8px;
        }
        .guest-btn {
            flex: 1;
            padding: 7px 6px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.68rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .guest-btn-add { background: var(--green); color: white; }
        .guest-btn-remove { background: var(--surface3); color: var(--text2); border: 1px solid var(--border); }
        .guest-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .guest-btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.05); }
        .waiting-note {
            font-size: 0.68rem;
            color: var(--amber);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .seat-override-btn {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 0.65rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            margin-top: 4px;
        }
        .seat-override-btn:hover { color: var(--amber); }

        .booking-actions {
            padding: 14px 18px 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--surface2);
            border-top: 1px solid var(--border);
        }
        .action-btn {
            flex: 1;
            padding: 8px 6px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .action-checkin { background: var(--green); color: white; }
        .action-seat { background: var(--gold); color: #1a1a1a; }
        .action-complete { background: var(--red); color: white; }
        .action-cancel { background: #dc2626; color: white; }
        .action-view { background: var(--surface3); color: var(--text2); border: 1px solid var(--border); }
        .action-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }

        /* Modal dark */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--surface);
            width: 90%;
            max-width: 550px;
            border-radius: var(--radius-lg);
            padding: 0;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid var(--red);
        }
        .modal-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }
        .modal-header h3 {
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
        }
        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 20px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }
        .modal-body {
            padding: 20px;
        }
        .detail-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .detail-label {
            width: 110px;
            font-weight: 700;
            color: var(--text2);
        }
        .detail-value {
            flex: 1;
            color: var(--text);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--surface2);
            border-left: 3px solid var(--red);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 60px;
            z-index: 3000;
            display: none;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: var(--shadow-md);
        }
        .loading-spinner {
            text-align: center;
            padding: 60px;
            color: var(--text2);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--surface2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--red); border-radius: 10px; }

        @media (max-width: 768px) {
            body { padding: 16px; }
            .bookings-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: 1fr 1fr; }
            .booking-actions { flex-direction: column; }
            .action-btn { width: 100%; }
            .tabs { border-radius: 30px; }
            .tab-btn { font-size: 0.65rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-crown"></i> VVIP Staff Console</h1>
        <button class="btn-refresh" onclick="loadAllData()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="stat-number" id="totalBookings">-</div><div class="stat-label">Total Bookings</div></div>
        <div class="stat-card"><div class="stat-number" id="checkedInCount">-</div><div class="stat-label">Checked In</div></div>
        <div class="stat-card"><div class="stat-number" id="seatedCount">-</div><div class="stat-label">Seated</div></div>
        <div class="stat-card"><div class="stat-number" id="revenueToday">-</div><div class="stat-label">Today's Revenue</div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-status="all">All</button>
        <button class="tab-btn" data-status="confirmed">Pending Check-in</button>
        <button class="tab-btn" data-status="checked_in">Checked In</button>
        <button class="tab-btn" data-status="seated">Seated</button>
        <button class="tab-btn" data-status="completed">Completed</button>
        <button class="tab-btn" data-status="cancelled">Cancelled</button>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by reference, customer name, or phone..." onkeyup="applySearch()">
        <button class="btn-refresh" onclick="applySearch()"><i class="fas fa-search"></i> Search</button>
    </div>

    <div id="bookingsGrid" class="bookings-grid">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading VIP experiences...</div>
    </div>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-info-circle"></i> VVIP Booking Details</h3>
            <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalDetails"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    let allBookings = [];
    let currentFilter = 'all';
    let currentSearch = '';
    let packagesCache = {};
    let tablesCache = {};

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.borderLeftColor = isError ? 'var(--red)' : 'var(--green)';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function loadPackages() {
        const { data, error } = await supabase
            .from('vvip_packages')
            .select('id, name, price, tab_credit, benefits');
        if (!error && data) {
            packagesCache = {};
            data.forEach(pkg => { packagesCache[pkg.id] = pkg; });
        }
        return packagesCache;
    }

    async function loadTables() {
        const { data, error } = await supabase
            .from('vvip_tables')
            .select('id, table_number, capacity');
        tablesCache = {};
        if (!error && data) {
            data.forEach(t => { tablesCache[t.id] = t; });
        }
        return tablesCache;
    }

    async function loadStats() {
        try {
            const { data: bookings } = await supabase
                .from('vvip_bookings')
                .select('status, total_amount, created_at');
            const total = bookings?.length || 0;
            const checkedIn = bookings?.filter(b => b.status === 'checked_in').length || 0;
            const seated = bookings?.filter(b => b.status === 'seated').length || 0;
            const today = new Date().toISOString().split('T')[0];
            const todayRevenue = bookings?.filter(b => b.created_at?.startsWith(today) && b.status === 'completed')
                .reduce((sum, b) => sum + (b.total_amount || 0), 0) || 0;
            document.getElementById('totalBookings').innerText = total;
            document.getElementById('checkedInCount').innerText = checkedIn;
            document.getElementById('seatedCount').innerText = seated;
            document.getElementById('revenueToday').innerText = 'R' + todayRevenue.toLocaleString();
        } catch (error) {
            console.error('Stats error:', error);
        }
    }

    async function loadBookings() {
        try {
            await loadPackages();
            await loadTables();
            const { data: bookings, error } = await supabase
                .from('vvip_bookings')
                .select('*')
                .order('created_at', { ascending: false });
            if (error) throw error;

            const customerIds = [...new Set(bookings.map(b => b.customer_id).filter(id => id))];
            let customers = {};
            if (customerIds.length > 0) {
                const { data: profiles } = await supabase
                    .from('profiles')
                    .select('id, name, phone')
                    .in('id', customerIds);
                if (profiles) {
                    profiles.forEach(p => { customers[p.id] = p; });
                }
            }
            allBookings = bookings
                // If admin deleted the package this booking was for, don't show it here anymore
                .filter(booking => packagesCache[booking.package_id])
                .map(booking => ({
                    ...booking,
                    packages: packagesCache[booking.package_id],
                    table: booking.table_id ? (tablesCache[booking.table_id] || null) : null,
                    customer: customers[booking.customer_id] || null
                }));
            renderBookings();
            loadStats();
        } catch (error) {
            console.error(error);
            showToast('Error loading bookings: ' + error.message, true);
            document.getElementById('bookingsGrid').innerHTML = '<div class="loading-spinner" style="color: var(--red);"><i class="fas fa-exclamation-triangle"></i> Failed to load. Please refresh.</div>';
        }
    }

    function renderBookings() {
        let filtered = allBookings;
        if (currentFilter !== 'all') filtered = filtered.filter(b => b.status === currentFilter);
        if (currentSearch) {
            const searchLower = currentSearch.toLowerCase();
            filtered = filtered.filter(b =>
                (b.booking_reference || '').toLowerCase().includes(searchLower) ||
                (b.customer_name || '').toLowerCase().includes(searchLower) ||
                (b.customer_phone || '').includes(searchLower) ||
                (b.customer?.name || '').toLowerCase().includes(searchLower) ||
                (b.customer?.phone || '').includes(searchLower)
            );
        }

        const container = document.getElementById('bookingsGrid');
        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text2);"><i class="fas fa-glass-cheers" style="font-size: 48px; margin-bottom: 16px;"></i><p>No VVIP bookings match</p></div>';
            return;
        }

        container.innerHTML = filtered.map(booking => {
            const packageInfo = booking.packages || {};
            const packageName = packageInfo.name || 'VVIP Package';
            const totalPrice = booking.total_amount || 0;
            const tableInfo = booking.table; // real named table from vvip_tables, or null for legacy bookings
            const partySize = tableInfo?.capacity || booking.quantity || 1;
            const checkedInCount = Math.min(booking.checked_in_count || 0, partySize);
            const customerName = booking.customer_name || booking.customer?.name || 'Guest';
            const customerPhone = booking.customer_phone || booking.customer?.phone || '-';
            const remainingBalance = booking.remaining_balance ?? 0;
            const usedAmount = booking.used_amount || 0;
            const fullyArrived = checkedInCount >= partySize;

            const statusMap = {
                'confirmed': 'Pending Check-in',
                'checked_in': fullyArrived ? 'Checked In' : `Checking In (${checkedInCount}/${partySize})`,
                'seated': 'Seated',
                'completed': 'Completed',
                'cancelled': 'Cancelled'
            };
            const statusClass = `status-${booking.status}`;

            // Guest tracker: shown while the booking is still gathering its party, before seating
            const guestTracker = (booking.status === 'confirmed' || booking.status === 'checked_in') ? `
                <div class="guest-tracker">
                    <div class="guest-tracker-row">
                        <span><i class="fas fa-users"></i> Guests arrived</span>
                        <span class="count"><strong>${checkedInCount}</strong> / ${partySize}</span>
                    </div>
                    <div class="guest-progress-bar"><div class="guest-progress-fill" style="width:${partySize > 0 ? (checkedInCount/partySize*100) : 0}%;"></div></div>
                    <div class="guest-tracker-actions">
                        <button class="guest-btn guest-btn-add" ${fullyArrived ? 'disabled' : ''} onclick="checkInGuest('${booking.id}')"><i class="fas fa-user-plus"></i> +1 Arrived</button>
                        <button class="guest-btn guest-btn-remove" ${checkedInCount <= 0 ? 'disabled' : ''} onclick="undoGuestCheckIn('${booking.id}')"><i class="fas fa-user-minus"></i> Undo</button>
                    </div>
                    ${!fullyArrived ? `<div class="waiting-note"><i class="fas fa-hourglass-half"></i> Waiting for ${partySize - checkedInCount} more guest${(partySize - checkedInCount) !== 1 ? 's' : ''} before seating</div>` : ''}
                </div>
            ` : '';

            let actionButtons = '';
            if (booking.status === 'confirmed') {
                actionButtons = `
                    <button class="action-btn action-cancel" onclick="updateBookingStatus('${booking.id}', 'cancelled')"><i class="fas fa-times"></i> Cancel</button>
                    <button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> Details</button>
                `;
            } else if (booking.status === 'checked_in') {
                actionButtons = `
                    <button class="action-btn action-seat" ${!fullyArrived ? 'disabled title="Waiting for the full party to arrive"' : ''} onclick="updateBookingStatus('${booking.id}', 'seated')"><i class="fas fa-chair"></i> Mark Seated</button>
                    <button class="action-btn action-cancel" onclick="updateBookingStatus('${booking.id}', 'cancelled')"><i class="fas fa-times"></i> Cancel</button>
                    <button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> Details</button>
                    ${!fullyArrived ? `<button class="seat-override-btn" style="flex-basis:100%;" onclick="seatPartialGroup('${booking.id}')">Seat this partial group now (staff override)</button>` : ''}
                `;
            } else if (booking.status === 'seated') {
                actionButtons = `
                    <button class="action-btn action-complete" onclick="updateBookingStatus('${booking.id}', 'completed')"><i class="fas fa-check-double"></i> Complete</button>
                    <button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> Details</button>
                `;
            } else if (booking.status === 'completed') {
                actionButtons = `<button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> View Details</button>`;
            } else {
                actionButtons = `<button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> View Details</button>`;
            }

            return `
                <div class="booking-card ${booking.status}">
                    <div class="booking-header">
                        <span class="booking-ref"><i class="fas fa-ticket-alt"></i> ${escapeHtml(booking.booking_reference)}</span>
                        <span class="booking-status ${statusClass}">${statusMap[booking.status]}</span>
                    </div>
                    <div class="booking-body">
                        <div class="package-title">
                            <strong>${escapeHtml(packageName)}</strong>
                            <span class="package-price">R${totalPrice.toFixed(2)}</span>
                        </div>
                        <div class="tables-info">
                            <span><i class="fas fa-chair"></i> Table: ${tableInfo ? escapeHtml(tableInfo.table_number) : 'Not assigned'}</span>
                            <span><i class="fas fa-users"></i> Party of ${partySize}</span>
                        </div>
                        <div class="booking-details">
                            <div><i class="fas fa-user"></i> ${escapeHtml(customerName)}</div>
                            <div><i class="fas fa-phone"></i> ${escapeHtml(customerPhone)}</div>
                            <div><i class="fas fa-calendar-alt"></i> ${new Date(booking.created_at).toLocaleDateString()}</div>
                            <div><i class="fas fa-clock"></i> ${new Date(booking.created_at).toLocaleTimeString()}</div>
                        </div>
                        ${guestTracker}
                        ${remainingBalance !== booking.total_amount ? `
                            <div class="remaining-credit">
                                <i class="fas fa-wallet"></i> Remaining credit: <strong>R${remainingBalance.toFixed(2)}</strong>
                            </div>
                        ` : ''}
                    </div>
                    <div class="booking-actions">
                        ${actionButtons}
                    </div>
                </div>
            `;
        }).join('');
    }

    window.checkInGuest = async function(bookingId) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) return;
        const partySize = booking.table?.capacity || booking.quantity || 1;
        const newCount = Math.min((booking.checked_in_count || 0) + 1, partySize);
        const updateData = { checked_in_count: newCount };
        if (booking.status === 'confirmed') {
            updateData.status = 'checked_in';
            updateData.check_in_time = new Date().toISOString();
        }
        const { error } = await supabase.from('vvip_bookings').update(updateData).eq('id', bookingId);
        if (error) { showToast('Error: ' + error.message, true); return; }
        showToast(newCount >= partySize ? 'Full party checked in' : `Guest checked in (${newCount}/${partySize})`);
        await loadBookings();
    };

    window.undoGuestCheckIn = async function(bookingId) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) return;
        const newCount = Math.max((booking.checked_in_count || 0) - 1, 0);
        const { error } = await supabase.from('vvip_bookings').update({ checked_in_count: newCount }).eq('id', bookingId);
        if (error) { showToast('Error: ' + error.message, true); return; }
        showToast('Guest check-in undone');
        await loadBookings();
    };

    window.seatPartialGroup = async function(bookingId) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) return;
        const partySize = booking.table?.capacity || booking.quantity || 1;
        const proceed = confirm(`Only ${booking.checked_in_count || 0} of ${partySize} guests have arrived. Seat this party now anyway?`);
        if (!proceed) return;
        await window.updateBookingStatus(bookingId, 'seated');
    };

    window.viewBookingDetails = async function(bookingId) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) return;
        const packageInfo = booking.packages || {};
        const tableInfo = booking.table;
        const partySize = tableInfo?.capacity || booking.quantity || 1;
        const checkedInCount = Math.min(booking.checked_in_count || 0, partySize);
        const totalPrice = booking.total_amount || 0;
        const remainingBalance = booking.remaining_balance ?? 0;
        const usedAmount = booking.used_amount || 0;
        const modalBody = document.getElementById('modalDetails');
        modalBody.innerHTML = `
            <div class="detail-row"><div class="detail-label">Reference:</div><div class="detail-value"><strong>${escapeHtml(booking.booking_reference)}</strong></div></div>
            <div class="detail-row"><div class="detail-label">Package:</div><div class="detail-value">${escapeHtml(packageInfo.name || 'VVIP Package')}</div></div>
            <div class="detail-row"><div class="detail-label">Table:</div><div class="detail-value">${tableInfo ? escapeHtml(tableInfo.table_number) : 'Not assigned'}</div></div>
            <div class="detail-row"><div class="detail-label">Party Size:</div><div class="detail-value">${partySize} guest${partySize !== 1 ? 's' : ''}</div></div>
            <div class="detail-row"><div class="detail-label">Arrived:</div><div class="detail-value">${checkedInCount} / ${partySize} checked in</div></div>
            <div class="detail-row"><div class="detail-label">Price Paid:</div><div class="detail-value"><strong style="color: var(--red);">R${totalPrice.toFixed(2)}</strong></div></div>
            <div class="detail-row"><div class="detail-label">Tab Credit:</div><div class="detail-value"><strong style="color: var(--green);">R${(remainingBalance + usedAmount).toFixed(2)}</strong></div></div>
            <div class="detail-row"><div class="detail-label">Remaining:</div><div class="detail-value"><strong style="color: var(--green);">R${remainingBalance.toFixed(2)}</strong></div></div>
            <div class="detail-row"><div class="detail-label">Used (tab):</div><div class="detail-value">R${usedAmount.toFixed(2)}</div></div>
            <div class="detail-row"><div class="detail-label">Customer:</div><div class="detail-value">${escapeHtml(booking.customer_name || booking.customer?.name || '-')}</div></div>
            <div class="detail-row"><div class="detail-label">Phone:</div><div class="detail-value">${escapeHtml(booking.customer_phone || booking.customer?.phone || '-')}</div></div>
            <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value"><span class="booking-status status-${booking.status}">${booking.status.toUpperCase()}</span></div></div>
            <div class="detail-row"><div class="detail-label">Booked:</div><div class="detail-value">${new Date(booking.created_at).toLocaleString()}</div></div>
            ${booking.check_in_time ? `<div class="detail-row"><div class="detail-label">Checked In:</div><div class="detail-value">${new Date(booking.check_in_time).toLocaleString()}</div></div>` : ''}
            ${booking.seated_time ? `<div class="detail-row"><div class="detail-label">Seated:</div><div class="detail-value">${new Date(booking.seated_time).toLocaleString()}</div></div>` : ''}
            ${booking.completed_time ? `<div class="detail-row"><div class="detail-label">Completed:</div><div class="detail-value">${new Date(booking.completed_time).toLocaleString()}</div></div>` : ''}
            <div class="detail-row"><div class="detail-label">Benefits:</div><div class="detail-value">${(packageInfo.benefits || []).map(b => `<span style="background: var(--surface2); padding: 4px 10px; border-radius: 30px; font-size: 11px; margin: 2px; display: inline-block;">${escapeHtml(b)}</span>`).join('') || '—'}</div></div>
        `;
        document.getElementById('detailsModal').style.display = 'flex';
    };

    window.closeDetailsModal = function() {
        document.getElementById('detailsModal').style.display = 'none';
    };

    window.updateBookingStatus = async function(bookingId, newStatus) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) return;
        const updateData = { status: newStatus };
        if (newStatus === 'checked_in') updateData.check_in_time = new Date().toISOString();
        if (newStatus === 'seated') updateData.seated_time = new Date().toISOString();
        if (newStatus === 'completed') updateData.completed_time = new Date().toISOString();
        if (newStatus === 'cancelled') updateData.cancelled_time = new Date().toISOString();
        const { error } = await supabase.from('vvip_bookings').update(updateData).eq('id', bookingId);
        if (error) {
            showToast('Error: ' + error.message, true);
        } else {
            showToast(`Booking ${newStatus.replace('_', ' ')} successfully`);
            await loadBookings();
        }
    };

    window.applySearch = function() {
        currentSearch = document.getElementById('searchInput').value;
        renderBookings();
    };

    window.loadAllData = function() {
        loadBookings();
        showToast('Refreshed');
    };

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.status;
            renderBookings();
        });
    });

    document.getElementById('detailsModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('detailsModal')) closeDetailsModal();
    });

    supabase.channel('vvip_bookings_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_bookings' }, () => { loadBookings(); })
        .subscribe();

    // If admin deletes (or edits) a package, drop/refresh any bookings tied to it immediately
    supabase.channel('vvip_packages_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_packages' }, () => { loadBookings(); })
        .subscribe();

    loadBookings();

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
