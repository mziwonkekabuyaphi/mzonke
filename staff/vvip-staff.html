<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VVIP Staff Console | Rands</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #E30613;
            --red-dark: #b0050f;
            --red-glow: rgba(227,6,19,0.12);
            --red-soft: #fff5f5;
            --white: #ffffff;
            --ink: #1e293b;
            --slate: #475569;
            --mist: #94a3b8;
            --gray-bg: #f8fafc;
            --gray-border: #eef2f8;
            --success: #10b981;
            --gold: #f59e0b;
            --shadow-card: 0 8px 20px -6px rgba(0,0,0,0.08);
            --radius-lg: 24px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #fef9f9 0%, #f8fafd 100%);
            color: var(--ink);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--red);
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--red), #a0010e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .header h1 i {
            background: none;
            color: var(--red);
            margin-right: 8px;
        }
        .btn-refresh {
            background: var(--white);
            border: 1px solid var(--gray-border);
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--slate);
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: var(--shadow-card);
        }
        .btn-refresh:hover {
            background: var(--red);
            border-color: var(--red);
            color: white;
            transform: translateY(-2px);
        }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            text-align: center;
            border: 1px solid var(--gray-border);
            box-shadow: var(--shadow-card);
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--red);
        }
        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--red);
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--mist);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            background: var(--white);
            padding: 8px;
            border-radius: 80px;
            border: 1px solid var(--gray-border);
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 20px;
            border-radius: 60px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--slate);
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--red);
            color: white;
            box-shadow: 0 2px 8px rgba(227,6,19,0.3);
        }

        /* Search */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 14px 24px;
            background: var(--white);
            border: 1px solid var(--gray-border);
            border-radius: 60px;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--red);
            box-shadow: 0 0 0 3px var(--red-glow);
        }

        /* Booking grid */
        .bookings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
            gap: 24px;
        }
        .booking-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 0;
            overflow: hidden;
            transition: 0.25s ease;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--gray-border);
            border-left: 5px solid var(--red);
        }
        .booking-card.checked_in { border-left-color: var(--success); }
        .booking-card.seated { border-left-color: var(--gold); }
        .booking-card.completed { border-left-color: #94a3b8; opacity: 0.85; }
        .booking-card.cancelled { border-left-color: #dc2626; opacity: 0.7; }

        .booking-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.15);
        }

        .booking-header {
            padding: 20px 20px 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--gray-border);
        }
        .booking-ref {
            font-family: monospace;
            background: var(--gray-bg);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--red);
        }
        .booking-status {
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-confirmed { background: #fef3c7; color: #b45309; }
        .status-checked_in { background: #dcfce7; color: #166534; }
        .status-seated { background: #ffedd5; color: #b45309; }
        .status-completed { background: #e2e8f0; color: #475569; }
        .status-cancelled { background: #fee2e2; color: #b91c1c; }

        .booking-body {
            padding: 16px 20px;
        }
        .package-title {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .package-price {
            color: var(--red);
            font-size: 1rem;
        }
        .tables-info {
            background: var(--gray-bg);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin: 12px 0;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .booking-details {
            margin: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.8rem;
        }
        .booking-details div {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .booking-details i {
            width: 24px;
            color: var(--red);
        }
        .remaining-credit {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--gray-border);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .booking-actions {
            padding: 16px 20px 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            background: var(--gray-bg);
            border-top: 1px solid var(--gray-border);
        }
        .action-btn {
            flex: 1;
            padding: 10px 8px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .action-checkin { background: var(--success); color: white; }
        .action-seat { background: var(--gold); color: #1a1a1a; }
        .action-complete { background: var(--red); color: white; }
        .action-cancel { background: #dc2626; color: white; }
        .action-view { background: var(--white); color: var(--slate); border: 1px solid var(--gray-border); }
        .action-btn:hover { transform: translateY(-2px); filter: brightness(0.95); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--white);
            width: 90%;
            max-width: 550px;
            border-radius: var(--radius-lg);
            padding: 0;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid var(--red);
        }
        .modal-header {
            padding: 20px 24px;
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }
        .modal-header h3 {
            color: white;
            font-weight: 800;
        }
        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 24px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
        }
        .modal-body {
            padding: 24px;
        }
        .detail-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-border);
        }
        .detail-label {
            width: 120px;
            font-weight: 700;
            color: var(--slate);
        }
        .detail-value {
            flex: 1;
            color: var(--ink);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e293b;
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            z-index: 3000;
            display: none;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
        }
        .loading-spinner {
            text-align: center;
            padding: 60px;
            color: var(--mist);
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            .bookings-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: 1fr 1fr; }
            .booking-actions { flex-direction: column; }
            .action-btn { width: 100%; }
            .tabs { border-radius: 30px; }
            .tab-btn { font-size: 0.7rem; padding: 8px 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-crown"></i> VVIP Staff Console</h1>
        <button class="btn-refresh" onclick="loadAllData()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="stat-number" id="totalBookings">-</div><div class="stat-label">Total Bookings</div></div>
        <div class="stat-card"><div class="stat-number" id="checkedInCount">-</div><div class="stat-label">Checked In</div></div>
        <div class="stat-card"><div class="stat-number" id="seatedCount">-</div><div class="stat-label">Seated</div></div>
        <div class="stat-card"><div class="stat-number" id="revenueToday">-</div><div class="stat-label">Today's Revenue</div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-status="all">All</button>
        <button class="tab-btn" data-status="confirmed">Pending Check-in</button>
        <button class="tab-btn" data-status="checked_in">Checked In</button>
        <button class="tab-btn" data-status="seated">Seated</button>
        <button class="tab-btn" data-status="completed">Completed</button>
        <button class="tab-btn" data-status="cancelled">Cancelled</button>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by reference, customer name, or phone..." onkeyup="applySearch()">
        <button class="btn-refresh" onclick="applySearch()"><i class="fas fa-search"></i> Search</button>
    </div>

    <div id="bookingsGrid" class="bookings-grid">
        <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading VIP experiences...</div>
    </div>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-info-circle"></i> VVIP Booking Details</h3>
            <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalDetails"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    let allBookings = [];
    let currentFilter = 'all';
    let currentSearch = '';
    let packagesCache = {};

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = isError ? '#dc2626' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function loadPackages() {
        const { data, error } = await supabase
            .from('vvip_packages')
            .select('id, name, price, capacity, image, benefits');
        if (!error && data) {
            packagesCache = {};
            data.forEach(pkg => { packagesCache[pkg.id] = pkg; });
        }
        return packagesCache;
    }

    async function loadStats() {
        try {
            const { data: bookings } = await supabase
                .from('vvip_bookings')
                .select('status, total_amount, created_at');
            const total = bookings?.length || 0;
            const checkedIn = bookings?.filter(b => b.status === 'checked_in').length || 0;
            const seated = bookings?.filter(b => b.status === 'seated').length || 0;
            const today = new Date().toISOString().split('T')[0];
            const todayRevenue = bookings?.filter(b => b.created_at?.startsWith(today) && b.status === 'completed')
                .reduce((sum, b) => sum + (b.total_amount || 0), 0) || 0;
            document.getElementById('totalBookings').innerText = total;
            document.getElementById('checkedInCount').innerText = checkedIn;
            document.getElementById('seatedCount').innerText = seated;
            document.getElementById('revenueToday').innerText = 'R' + todayRevenue.toLocaleString();
        } catch (error) {
            console.error('Stats error:', error);
        }
    }

    async function loadBookings() {
        try {
            await loadPackages();
            const { data: bookings, error } = await supabase
                .from('vvip_bookings')
                .select('*')
                .order('created_at', { ascending: false });
            if (error) throw error;

            const customerIds = [...new Set(bookings.map(b => b.customer_id).filter(id => id))];
            let customers = {};
            if (customerIds.length > 0) {
                const { data: profiles } = await supabase
                    .from('profiles')
                    .select('id, name, phone')
                    .in('id', customerIds);
                if (profiles) {
                    profiles.forEach(p => { customers[p.id] = p; });
                }
            }
            allBookings = bookings.map(booking => ({
                ...booking,
                packages: packagesCache[booking.package_id] || null,
                customer: customers[booking.customer_id] || null
            }));
            renderBookings();
            loadStats();
        } catch (error) {
            console.error(error);
            showToast('Error loading bookings: ' + error.message, true);
            document.getElementById('bookingsGrid').innerHTML = '<div class="loading-spinner" style="color: var(--red);"><i class="fas fa-exclamation-triangle"></i> Failed to load. Please refresh.</div>';
        }
    }

    function renderBookings() {
        let filtered = allBookings;
        if (currentFilter !== 'all') filtered = filtered.filter(b => b.status === currentFilter);
        if (currentSearch) {
            const searchLower = currentSearch.toLowerCase();
            filtered = filtered.filter(b =>
                (b.booking_reference || '').toLowerCase().includes(searchLower) ||
                (b.customer_name || '').toLowerCase().includes(searchLower) ||
                (b.customer_phone || '').includes(searchLower) ||
                (b.customer?.name || '').toLowerCase().includes(searchLower) ||
                (b.customer?.phone || '').includes(searchLower)
            );
        }

        const container = document.getElementById('bookingsGrid');
        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 60px; color: #94a3b8;"><i class="fas fa-glass-cheers" style="font-size: 48px; margin-bottom: 16px;"></i><p>No VVIP bookings match</p></div>';
            return;
        }

        container.innerHTML = filtered.map(booking => {
            const packageInfo = booking.packages || {};
            const packageName = packageInfo.name || 'VVIP Package';
            const totalPrice = booking.total_amount;
            const tableCount = packageInfo.capacity || 0;   // capacity = number of tables
            const pricePerTable = tableCount > 0 ? (totalPrice / tableCount).toFixed(2) : 0;
            const customerName = booking.customer_name || booking.customer?.name || 'Guest';
            const customerPhone = booking.customer_phone || booking.customer?.phone || '-';
            const remainingBalance = booking.remaining_balance !== null && booking.remaining_balance !== undefined ? booking.remaining_balance : booking.total_amount;
            const usedAmount = booking.used_amount || 0;

            const statusMap = {
                'confirmed': 'Pending Check-in',
                'checked_in': 'Checked In',
                'seated': 'Seated',
                'completed': 'Completed',
                'cancelled': 'Cancelled'
            };
            const statusClass = `status-${booking.status}`;

            let actionButtons = '';
            if (booking.status === 'confirmed') {
                actionButtons = `
                    <button class="action-btn action-checkin" onclick="updateBookingStatus('${booking.id}', 'checked_in')"><i class="fas fa-check-circle"></i> Check In</button>
                    <button class="action-btn action-cancel" onclick="updateBookingStatus('${booking.id}', 'cancelled')"><i class="fas fa-times"></i> Cancel</button>
                    <button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> Details</button>
                `;
            } else if (booking.status === 'checked_in') {
                actionButtons = `
                    <button class="action-btn action-seat" onclick="updateBookingStatus('${booking.id}', 'seated')"><i class="fas fa-chair"></i> Mark Seated</button>
                    <button class="action-btn action-cancel" onclick="updateBookingStatus('${booking.id}', 'cancelled')"><i class="fas fa-times"></i> Cancel</button>
                    <button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> Details</button>
                `;
            } else if (booking.status === 'seated') {
                actionButtons = `
                    <button class="action-btn action-complete" onclick="updateBookingStatus('${booking.id}', 'completed')"><i class="fas fa-check-double"></i> Complete</button>
                    <button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> Details</button>
                `;
            } else if (booking.status === 'completed') {
                actionButtons = `<button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> View Details</button>`;
            } else {
                actionButtons = `<button class="action-btn action-view" onclick="viewBookingDetails('${booking.id}')"><i class="fas fa-eye"></i> View Details</button>`;
            }

            return `
                <div class="booking-card ${booking.status}">
                    <div class="booking-header">
                        <span class="booking-ref"><i class="fas fa-ticket-alt"></i> ${escapeHtml(booking.booking_reference)}</span>
                        <span class="booking-status ${statusClass}">${statusMap[booking.status]}</span>
                    </div>
                    <div class="booking-body">
                        <div class="package-title">
                            <strong>${escapeHtml(packageName)}</strong>
                            <span class="package-price">R${totalPrice.toFixed(2)}</span>
                        </div>
                        ${tableCount > 0 ? `
                            <div class="tables-info">
                                <span><i class="fas fa-table"></i> ${tableCount} table${tableCount !== 1 ? 's' : ''}</span>
                                <span><i class="fas fa-tag"></i> R${pricePerTable} / table</span>
                            </div>
                        ` : `<div class="tables-info"><span><i class="fas fa-table"></i> Tables info not set</span></div>`}
                        <div class="booking-details">
                            <div><i class="fas fa-user"></i> ${escapeHtml(customerName)}</div>
                            <div><i class="fas fa-phone"></i> ${escapeHtml(customerPhone)}</div>
                            <div><i class="fas fa-calendar-alt"></i> ${new Date(booking.created_at).toLocaleDateString()}</div>
                            <div><i class="fas fa-clock"></i> ${new Date(booking.created_at).toLocaleTimeString()}</div>
                        </div>
                        ${remainingBalance !== booking.total_amount ? `
                            <div class="remaining-credit">
                                <i class="fas fa-wallet"></i> Remaining credit: <strong style="color: var(--success);">R${remainingBalance.toFixed(2)}</strong>
                            </div>
                        ` : ''}
                    </div>
                    <div class="booking-actions">
                        ${actionButtons}
                    </div>
                </div>
            `;
        }).join('');
    }

    window.viewBookingDetails = async function(bookingId) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) return;
        const packageInfo = booking.packages || {};
        const tableCount = packageInfo.capacity || 0;
        const totalPrice = booking.total_amount;
        const pricePerTable = tableCount > 0 ? (totalPrice / tableCount).toFixed(2) : 0;
        const remainingBalance = booking.remaining_balance !== null && booking.remaining_balance !== undefined ? booking.remaining_balance : booking.total_amount;
        const usedAmount = booking.used_amount || 0;
        const modalBody = document.getElementById('modalDetails');
        modalBody.innerHTML = `
            <div class="detail-row"><div class="detail-label">Reference:</div><div class="detail-value"><strong>${escapeHtml(booking.booking_reference)}</strong></div></div>
            <div class="detail-row"><div class="detail-label">Package:</div><div class="detail-value">${escapeHtml(packageInfo.name || 'VVIP Package')}</div></div>
            <div class="detail-row"><div class="detail-label">Tables / Qty:</div><div class="detail-value">${tableCount} table${tableCount !== 1 ? 's' : ''} @ R${pricePerTable}/table</div></div>
            <div class="detail-row"><div class="detail-label">Total Price:</div><div class="detail-value"><strong style="color: var(--red);">R${totalPrice.toFixed(2)}</strong></div></div>
            <div class="detail-row"><div class="detail-label">Remaining:</div><div class="detail-value"><strong style="color: var(--success);">R${remainingBalance.toFixed(2)}</strong></div></div>
            <div class="detail-row"><div class="detail-label">Used (tab):</div><div class="detail-value">R${usedAmount.toFixed(2)}</div></div>
            <div class="detail-row"><div class="detail-label">Customer:</div><div class="detail-value">${escapeHtml(booking.customer_name || booking.customer?.name || '-')}</div></div>
            <div class="detail-row"><div class="detail-label">Phone:</div><div class="detail-value">${escapeHtml(booking.customer_phone || booking.customer?.phone || '-')}</div></div>
            <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value"><span class="booking-status status-${booking.status}">${booking.status.toUpperCase()}</span></div></div>
            <div class="detail-row"><div class="detail-label">Booked:</div><div class="detail-value">${new Date(booking.created_at).toLocaleString()}</div></div>
            ${booking.check_in_time ? `<div class="detail-row"><div class="detail-label">Checked In:</div><div class="detail-value">${new Date(booking.check_in_time).toLocaleString()}</div></div>` : ''}
            ${booking.seated_time ? `<div class="detail-row"><div class="detail-label">Seated:</div><div class="detail-value">${new Date(booking.seated_time).toLocaleString()}</div></div>` : ''}
            ${booking.completed_time ? `<div class="detail-row"><div class="detail-label">Completed:</div><div class="detail-value">${new Date(booking.completed_time).toLocaleString()}</div></div>` : ''}
            <div class="detail-row"><div class="detail-label">Benefits:</div><div class="detail-value">${(packageInfo.benefits || []).map(b => `<span style="background: #f1f5f9; padding: 4px 10px; border-radius: 30px; font-size: 11px; margin: 2px; display: inline-block;">${escapeHtml(b)}</span>`).join('') || '—'}</div></div>
        `;
        document.getElementById('detailsModal').style.display = 'flex';
    };

    window.closeDetailsModal = function() {
        document.getElementById('detailsModal').style.display = 'none';
    };

    window.updateBookingStatus = async function(bookingId, newStatus) {
        const booking = allBookings.find(b => b.id === bookingId);
        if (!booking) return;
        const updateData = { status: newStatus };
        if (newStatus === 'checked_in') updateData.check_in_time = new Date().toISOString();
        if (newStatus === 'seated') updateData.seated_time = new Date().toISOString();
        if (newStatus === 'completed') updateData.completed_time = new Date().toISOString();
        if (newStatus === 'cancelled') updateData.cancelled_time = new Date().toISOString();
        const { error } = await supabase.from('vvip_bookings').update(updateData).eq('id', bookingId);
        if (error) {
            showToast('Error: ' + error.message, true);
        } else {
            showToast(`Booking ${newStatus.replace('_', ' ')} successfully`);
            await loadBookings();
        }
    };

    window.applySearch = function() {
        currentSearch = document.getElementById('searchInput').value;
        renderBookings();
    };

    window.loadAllData = function() {
        loadBookings();
        showToast('Refreshed');
    };

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.status;
            renderBookings();
        });
    });

    document.getElementById('detailsModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('detailsModal')) closeDetailsModal();
    });

    supabase.channel('vvip_bookings_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_bookings' }, () => { loadBookings(); })
        .subscribe();

    loadBookings();

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
