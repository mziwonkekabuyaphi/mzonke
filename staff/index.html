<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Staff Login | Rands</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; border-radius: 32px; padding: 48px 40px; width: 90%; max-width: 450px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #E30613, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo p { color: #64748b; font-size: 0.85rem; margin-top: 8px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; color: #1e293b; }
        .form-group input { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 16px; font-size: 1rem; transition: all 0.2s; font-family: 'Inter', sans-serif; }
        .form-group input:focus { outline: none; border-color: #E30613; box-shadow: 0 0 0 3px rgba(227,6,19,0.1); }
        .pin-input { letter-spacing: 4px; font-size: 1.2rem; text-align: center; }
        .btn-login { width: 100%; background: #E30613; color: white; border: none; padding: 14px; border-radius: 16px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.1s; margin-top: 8px; }
        .btn-login:active { transform: scale(0.98); }
        .error-message { background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 12px; font-size: 0.8rem; margin-bottom: 20px; display: none; align-items: center; gap: 8px; }
        .error-message.show { display: flex; }
        .info-text { text-align: center; margin-top: 24px; font-size: 0.7rem; color: #94a3b8; }
        .info-text i { margin-right: 4px; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <i class="fas fa-user-clock" style="font-size: 3rem; color: #E30613; margin-bottom: 8px; display: block;"></i>
        <h1>Staff Portal</h1>
        <p>Sign in with your username and PIN</p>
    </div>
    
    <div class="error-message" id="errorMsg">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">Invalid username or PIN</span>
    </div>
    
    <div class="form-group">
        <label><i class="fas fa-user"></i> Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
    </div>
    
    <div class="form-group">
        <label><i class="fas fa-key"></i> PIN Code</label>
        <input type="password" id="pin" class="pin-input" placeholder="••••" maxlength="6" autocomplete="off">
    </div>
    
    <button class="btn-login" onclick="handleLogin()">
        <i class="fas fa-sign-in-alt"></i> Sign In
    </button>
    
    <div class="info-text">
        <i class="fas fa-shield-alt"></i> Secure login using your credentials
    </div>
</div>

<script>
    // Supabase configuration
    const SUPABASE_URL = 'https://fqbcidcezfprranfxhyj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxYmNpZGNlemZwcnJhbmZ4aHlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MjY0ODgsImV4cCI6MjA5MzIwMjQ4OH0.eGCEE-lA8yLGjU1nFXv_A1RjbWvRbb5Mfm8FMzVRgHI';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const pin = document.getElementById('pin').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        
        // Hide error initially
        errorMsg.classList.remove('show');
        
        if (!username || !pin) {
            errorText.innerText = 'Please enter both username and PIN';
            errorMsg.classList.add('show');
            return;
        }
        
        if (pin.length < 4) {
            errorText.innerText = 'PIN must be at least 4 digits';
            errorMsg.classList.add('show');
            return;
        }
        
        try {
            // Query staff from Supabase
            const { data: staff, error } = await supabase
                .from('staff')
                .select(`
                    id,
                    name,
                    username,
                    pin,
                    role,
                    status,
                    tenant_id,
                    tenants:tenant_id (id, name)
                `)
                .eq('username', username)
                .eq('pin', pin)
                .eq('status', 'Active')
                .single();
            
            if (error || !staff) {
                console.error('Login error:', error);
                errorText.innerText = 'Invalid username or PIN. Please try again.';
                errorMsg.classList.add('show');
                return;
            }
            
            // Check if staff is active
            if (staff.status !== 'Active') {
                errorText.innerText = 'Your account is inactive. Please contact your manager.';
                errorMsg.classList.add('show');
                return;
            }
            
            // Store session
            const sessionData = {
                userId: staff.id,
                name: staff.name,
                staffRole: staff.role,
                tenantId: staff.tenant_id,
                businessName: staff.tenants?.name || 'Venue',
                loginTime: new Date().toISOString()
            };
            
            localStorage.setItem('rands_session', JSON.stringify(sessionData));
            
            // Redirect to staff dashboard
            window.location.href = 'staff.html';
            
        } catch (err) {
            console.error('Login error:', err);
            errorText.innerText = 'Connection error. Please try again.';
            errorMsg.classList.add('show');
        }
    }
    
    // Allow Enter key to submit
    document.getElementById('username').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('pin').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
</script>
</body>
</html>
