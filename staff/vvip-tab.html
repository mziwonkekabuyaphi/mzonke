<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>VVIP POS | Rands Sovereign Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ========== DARK THEME – MATCH STAFF CONSOLE ========== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
:root {
    --red: #E30613;
    --red-dark: #a0010e;
    --red-dim: rgba(227,6,19,0.12);
    --red-border: rgba(227,6,19,0.25);
    --bg: #0D0F12;
    --surface: #141720;
    --surface2: #1C2030;
    --surface3: #232840;
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.1);
    --text: #F0F2F8;
    --text2: #8B92A8;
    --text3: #555E78;
    --gold: #FBBF24;
    --gold-dim: rgba(251,191,36,0.12);
    --green: #22C55E;
    --shadow-sm: 0 2px 6px rgba(0,0,0,0.4);
    --shadow-md: 0 8px 20px -6px rgba(0,0,0,0.5);
    --radius-lg: 28px;
    --radius-md: 20px;
    --radius-sm: 14px;
    --radius-full: 9999px;
    --transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}
body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
}
.container {
    max-width: 1600px;
    margin: 0 auto;
}
/* Status Bar – dark */
.status-bar {
    background: var(--surface);
    border-radius: 60px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
}
.status-bar::before {
    content: '';
    position: absolute;
    inset: -2px;
    background: conic-gradient(from 0deg, transparent, var(--red-border), transparent 30%);
    animation: rotateGlow 6s linear infinite;
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
}
.status-bar > * { position: relative; z-index: 1; }
@keyframes rotateGlow { to { transform: rotate(360deg); } }
.status-dot {
    width: 12px;
    height: 12px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
}
.status-text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--red), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
.status-stats {
    display: flex;
    gap: 24px;
    font-size: 0.8rem;
    color: var(--text2);
}
.status-stats span {
    color: var(--red);
    font-weight: 700;
}
.status-buttons {
    margin-left: auto;
    display: flex;
    gap: 12px;
}
.status-btn {
    background: transparent;
    border: 1px solid var(--border);
    padding: 8px 20px;
    border-radius: 40px;
    font-weight: 600;
    font-size: 0.75rem;
    color: var(--text2);
    cursor: pointer;
    transition: var(--transition);
}
.status-btn:hover {
    background: var(--red-dim);
    border-color: var(--red);
    color: var(--red);
    transform: translateY(-2px);
}
.status-btn.primary {
    background: var(--red);
    border-color: var(--red);
    color: white;
}
.status-btn.primary:hover {
    background: var(--red-dark);
}
/* Main grid */
.main-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
    margin-bottom: 24px;
}
/* Menu panel */
.menu-panel {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: 20px;
    box-shadow: var(--shadow-sm);
}
/* Vendor tabs – dark */
.vendor-tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
}
.vendor-tab {
    background: transparent;
    border: none;
    padding: 10px 24px;
    border-radius: 40px;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text2);
    cursor: pointer;
    transition: var(--transition);
}
.vendor-tab.active {
    background: var(--red);
    color: white;
}
.vendor-tab i {
    margin-right: 8px;
}
/* Category chips (dynamic sub-nav under vendor tabs) */
.category-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}
.category-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 7px 16px;
    border-radius: 40px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
}
.category-chip:hover { border-color: var(--red-border); color: var(--text); }
.category-chip.active {
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    border-color: var(--red);
    color: white;
    box-shadow: 0 3px 10px rgba(227,6,19,0.3);
}

/* Products grid – dark cards */
.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 20px;
}
.product-card {
    background: var(--surface2);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    transition: var(--transition);
    overflow: hidden;
    position: relative;
}
.product-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.06) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
    pointer-events: none;
}
.product-card:hover::after { transform: translateX(100%); }
.product-card:hover {
    transform: translateY(-4px);
    border-color: var(--red-border);
    box-shadow: var(--shadow-md);
}
.product-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    background: var(--surface3);
}
.product-info {
    padding: 12px;
}
.product-category-tag {
    display: inline-block;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--gold);
    background: var(--gold-dim);
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 6px;
}
.product-name {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--text);
}
.product-price {
    color: var(--red);
    font-weight: 800;
    margin-top: 4px;
}
.add-btn {
    background: var(--red);
    color: white;
    border: none;
    width: 100%;
    padding: 10px;
    border-radius: 40px;
    margin-top: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.1s;
}
.add-btn:active { transform: scale(0.97); }

/* Quick-Load Active Tables strip */
.active-tables-section { margin-bottom: 16px; }
.active-tables-label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text2);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.active-tables-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 6px;
}
.active-tables-strip::-webkit-scrollbar { height: 4px; }
.no-tables-msg {
    font-size: 0.72rem;
    color: var(--text3);
    padding: 10px 0;
}
.table-chip {
    flex: 0 0 auto;
    min-width: 118px;
    background: linear-gradient(160deg, var(--surface2), var(--surface3));
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
    transition: var(--transition);
    color: var(--text);
}
.table-chip:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(251,191,36,0.15);
}
.table-chip-name {
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 4px;
}
.table-chip-guest {
    font-size: 0.72rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 6px;
}
.table-chip-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.65rem;
    color: var(--text2);
}
.table-chip-meta span:first-child { color: var(--green); font-weight: 700; }

/* Table badge on the loaded customer card */
.table-badge-inline {
    background: var(--gold-dim);
    color: var(--gold);
    padding: 3px 10px;
    border-radius: 30px;
    font-size: 0.65rem;
    font-weight: 700;
    margin-left: 8px;
}
/* Shisha customizer – dark */
.shisha-customizer {
    background: var(--surface2);
    border-radius: var(--radius-md);
    padding: 20px;
    border: 1px solid var(--red-border);
}
.customizer-group {
    margin-bottom: 16px;
}
.customizer-group label {
    display: block;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 6px;
}
.customizer-group select {
    width: 100%;
    padding: 12px;
    border-radius: 40px;
    border: 1px solid var(--border);
    background: var(--surface3);
    color: var(--text);
}
.customizer-group select:focus {
    outline: none;
    border-color: var(--red);
}
.preview-price {
    background: var(--surface3);
    border-radius: 30px;
    padding: 12px;
    text-align: center;
    margin: 16px 0;
    font-weight: 800;
    color: var(--red);
}
/* Cart panel – dark */
.cart-panel {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    padding: 20px;
    position: sticky;
    top: 20px;
    height: fit-content;
    box-shadow: var(--shadow-sm);
}
.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--red);
    margin-bottom: 20px;
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--text);
}
.cart-items {
    max-height: 400px;
    overflow-y: auto;
    margin-bottom: 20px;
}
.cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface2);
    padding: 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    border: 1px solid var(--border);
}
.cart-item-details {
    flex: 1;
}
.cart-item-name {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text);
}
.cart-item-price {
    font-size: 0.7rem;
    color: var(--text2);
}
.cart-item-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}
.qty-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--red);
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
.remove-item {
    background: none;
    border: none;
    color: var(--text2);
    cursor: pointer;
}
.remove-item:hover {
    color: var(--red);
}
.cart-summary {
    background: var(--surface2);
    padding: 16px;
    border-radius: var(--radius-sm);
    margin-bottom: 20px;
    border: 1px solid var(--border);
}
.cart-summary span {
    color: var(--text2);
}
.cart-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.btn-checkout {
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    border: none;
    padding: 14px;
    border-radius: 60px;
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}
.btn-checkout:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(227,6,19,0.3);
}
.btn-checkout:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.btn-clear {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 60px;
    padding: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text2);
    transition: var(--transition);
}
.btn-clear:hover {
    background: var(--surface2);
    border-color: var(--border2);
    color: var(--text);
}
/* Customer card – dark */
.customer-card {
    background: var(--surface2);
    border-radius: var(--radius-md);
    border-left: 5px solid var(--red);
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
}
.customer-row {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 12px;
    color: var(--text);
}
.balance {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--red);
}
.package-badge {
    background: var(--red-dim);
    padding: 6px 12px;
    border-radius: 40px;
    font-size: 0.7rem;
    color: var(--red);
}
/* Requests widget – dark */
.requests-widget {
    background: var(--surface2);
    border-radius: var(--radius-md);
    border-left: 4px solid var(--gold);
    padding: 12px 16px;
    margin-bottom: 20px;
}
.request-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
}
.request-item:last-child {
    border-bottom: none;
}
.request-actions button {
    background: var(--red);
    border: none;
    color: white;
    padding: 4px 12px;
    border-radius: 30px;
    font-size: 0.7rem;
    margin-left: 8px;
    cursor: pointer;
}
.request-actions button:last-child {
    background: var(--text3);
}
/* Modals – dark */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index: 2000;
    align-items: center;
    justify-content: center;
}
.modal.active {
    display: flex;
}
.modal-content {
    background: var(--surface);
    border-radius: var(--radius-lg);
    max-width: 500px;
    width: 90%;
    padding: 24px;
    border: 2px solid var(--red);
    color: var(--text);
}
.modal-content h2 {
    color: var(--red);
}
/* Toast */
.toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--surface2);
    border-left: 3px solid var(--red);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 60px;
    z-index: 3000;
    display: none;
    font-size: 0.8rem;
}
/* Inputs – dark */
input {
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 60px;
    padding: 12px;
}
input:focus {
    outline: none;
    border-color: var(--red);
}
@keyframes pulse {
    0% { opacity: 1; transform: scale(1);}
    50% { opacity: 0.5; transform: scale(1.1);}
    100% { opacity: 1; transform: scale(1);}
}
@media (max-width: 768px) {
    .main-grid { grid-template-columns: 1fr; }
    .status-buttons { margin-left: 0; width: 100%; justify-content: space-between; }
}
/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--surface2); border-radius: 10px; }
::-webkit-scrollbar-thumb { background: var(--red); border-radius: 10px; }
</style>
</head>
<body>
<div class="container">
    <div class="status-bar">
        <div class="status-dot"></div>
        <div class="status-text"><i class="fas fa-crown"></i> VVIP TERMINAL • ACTIVE</div>
        <div class="status-stats">
            <div><i class="fas fa-chart-line"></i> Revenue: <span id="revenueStat">R0</span></div>
            <div><i class="fas fa-users"></i> Active VVIP: <span id="activeGuestsStat">0</span></div>
            <div><i class="fas fa-bell"></i> Requests: <span id="requestCountStat">0</span></div>
        </div>
        <div class="status-buttons">
            <button class="status-btn" onclick="showActiveOrders()"><i class="fas fa-list"></i> Orders</button>
            <button class="status-btn" onclick="openDashboard()"><i class="fas fa-chart-simple"></i> Dashboard</button>
            <button class="status-btn primary" onclick="window.open('vvip-store.html', '_blank')"><i class="fas fa-gift"></i> Packages</button>
        </div>
    </div>

    <div id="requestsWidget" class="requests-widget" style="display: none;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <strong><i class="fas fa-crown" style="color: var(--gold);"></i> VVIP Service Requests</strong>
            <span id="requestCountBadge">0</span>
        </div>
        <div id="requestsList"></div>
    </div>

    <div class="main-grid">
        <div class="menu-panel">
            <div class="vendor-tabs" id="vendorTabs">
                <button class="vendor-tab active" data-vendor="Rands Smart Counter"><i class="fas fa-beer"></i> Drinks</button>
                <button class="vendor-tab" data-vendor="The Butcher Shop"><i class="fas fa-utensils"></i> Butcher</button>
                <button class="vendor-tab" data-vendor="Shisha Lounge"><i class="fas fa-smoking"></i> Shisha Lounge</button>
            </div>
            <div id="categoryChips" class="category-chips"></div>
            <div id="menuContainer"></div>
        </div>

        <div class="cart-panel">
            <div class="cart-header">
                <span><i class="fas fa-shopping-cart"></i> Current Order</span>
                <span id="cartItemCount">0</span>
            </div>

            <div class="active-tables-section">
                <div class="active-tables-label"><i class="fas fa-layer-group"></i> Quick Load — Active VVIP Tables</div>
                <div id="activeTablesStrip" class="active-tables-strip">
                    <div class="no-tables-msg">Loading...</div>
                </div>
            </div>

            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <input type="text" id="customerSearch" placeholder="Phone number or Wallet ID" style="flex:1;">
                <button class="status-btn primary" onclick="loadCustomer()" style="padding: 0 20px;"><i class="fas fa-search"></i> Load</button>
                <button class="status-btn" onclick="clearCustomer()" style="padding: 0 20px;"><i class="fas fa-times"></i> Clear</button>
            </div>

            <div id="customerCard" style="display: none;" class="customer-card">
                <div class="customer-row">
                    <span><i class="fas fa-user"></i> <strong id="custName">-</strong><span id="custTableBadge"></span></span>
                    <span id="custPhone">-</span>
                </div>
                <div class="customer-row">
                    <span><i class="fas fa-wallet"></i> Tab Credit</span>
                    <span class="balance" id="tabBalance">R0</span>
                </div>
                <div id="packageInfo"></div>
            </div>

            <div id="cartItems" class="cart-items">
                <div style="text-align: center; color: var(--text2); padding: 40px;"><i class="fas fa-cart-plus"></i> Cart empty</div>
            </div>

            <div class="cart-summary">
                <div style="display: flex; justify-content: space-between;">
                    <span>Subtotal</span>
                    <span id="cartSubtotal" style="font-weight: 800; color: var(--red);">R0</span>
                </div>
            </div>
            <div class="cart-actions">
                <button class="btn-checkout" id="checkoutBtn" disabled><i class="fas fa-credit-card"></i> Checkout</button>
                <button class="btn-clear" onclick="clearCart()"><i class="fas fa-trash-alt"></i> Clear</button>
            </div>
        </div>
    </div>
</div>

<div id="ordersModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2 style="color: var(--red);"><i class="fas fa-list"></i> Active Orders</h2>
            <button onclick="closeModal('ordersModal')" style="background: none; border: none; font-size: 24px; color: var(--text2);"><i class="fas fa-times"></i></button>
        </div>
        <div id="activeOrdersList" style="max-height: 60vh; overflow-y: auto;"></div>
    </div>
</div>

<div id="dashboardModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2 style="color: var(--red);"><i class="fas fa-chart-line"></i> Dashboard</h2>
            <button onclick="closeModal('dashboardModal')" style="background: none; border: none; font-size: 24px; color: var(--text2);"><i class="fas fa-times"></i></button>
        </div>
        <div id="dashboardContent"></div>
    </div>
</div>

<div id="toastMessage" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // ---------- GLOBALS ----------
    let currentCustomer = null;
    let currentCart = [];
    let currentTabBalance = 0;
    let currentPackageInfo = null;       // { name, remaining, bookingId, tableLabel }
    let allProducts = [];
    let shishaFlavours = [], shishaDevices = [], shishaLocations = [];
    let vendor = "Rands Smart Counter";
    let selectedCategory = 'all';
    let activeTables = [];
    let revenue = 0, activeGuests = 0;
    let pendingRequests = [];

    // Categories that belong to the food vendor; anything else (any drink/spirit category,
    // including ones added later) automatically shows up under Drinks — no hardcoded list to maintain.
    const FOOD_CATEGORIES = ['butcher', 'food', 'steak', 'burger', 'snacks', 'platter', 'platters', 'starters', 'mains', 'dessert', 'desserts'];

    // Nice icons for known categories; falls back to a generic glass/bottle icon for anything new
    const CATEGORY_ICONS = {
        'beers': 'fa-beer', 'ciders': 'fa-wine-bottle', 'whiskey': 'fa-whiskey-glass',
        'gin': 'fa-martini-glass', 'vodka': 'fa-martini-glass', 'tequila': 'fa-glass-water',
        'cognac': 'fa-wine-bottle', 'liqueur': 'fa-cocktail', 'champagne': 'fa-champagne-glasses',
        'sparkling wine': 'fa-champagne-glasses', 'spirits': 'fa-glass-water', 'soft drinks': 'fa-glass-water',
        'butcher': 'fa-drumstick-bite', 'food': 'fa-utensils'
    };
    function categoryIcon(cat) { return CATEGORY_ICONS[cat] || 'fa-martini-glass-citrus'; }
    function categoryLabel(cat) { return (cat || '').replace(/\b\w/g, c => c.toUpperCase()); }

    // ---------- HELPERS ----------
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMessage');
        toast.innerText = msg;
        toast.style.background = isError ? '#b91c1c' : 'var(--surface2)';
        toast.style.borderLeftColor = isError ? 'var(--red)' : 'var(--green)';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // Generates every reasonable South African phone format for a given input so a lookup
    // works no matter whether the number was typed/stored as 073..., 27..., or +27....
    // e.g. "0731234567" -> ["0731234567", "27731234567"]
    //      "27731234567" -> ["27731234567", "0731234567"]
    function phoneVariants(raw) {
        const digits = String(raw || '').replace(/\D/g, ''); // strip spaces, +, dashes, etc.
        const variants = new Set([digits]);
        if (digits.startsWith('0') && digits.length === 10) {
            variants.add('27' + digits.slice(1));
        } else if (digits.startsWith('27') && digits.length === 11) {
            variants.add('0' + digits.slice(2));
        }
        return [...variants];
    }

    // ---------- LOAD PRODUCTS ----------
    async function loadProductsAndShisha() {
        const { data: products } = await supabase.from('products').select('*').eq('is_available', true);
        allProducts = products || [];
        const [flavours, locations] = await Promise.all([
            supabase.from('shisha_products').select('*').eq('is_available', true),
            supabase.from('shisha_locations').select('*').eq('is_active', true)
        ]);
        shishaFlavours = flavours.data || [];
        shishaLocations = locations.data || [];
        await loadHookahDevices();
        renderMenu();
    }

    // Devices get their own refresh path so a device that just went 'in_use' (here or on another
    // terminal) disappears immediately instead of lingering from a stale cached list.
    async function loadHookahDevices() {
        const { data } = await supabase.from('hookah_devices').select('*').eq('status', 'available');
        shishaDevices = data || [];
        if (vendor === 'Shisha Lounge') renderMenu();
    }

    function renderMenu() {
        const container = document.getElementById('menuContainer');
        const chipsContainer = document.getElementById('categoryChips');
        if (vendor === 'Shisha Lounge') {
            chipsContainer.innerHTML = '';
            renderShishaCustomizer(container);
            return;
        }
        // Any category not in FOOD_CATEGORIES is a drink — this automatically includes every
        // alcohol/beverage category in your products table, not just a hardcoded few.
        const vendorProducts = allProducts.filter(p => {
            const isFood = FOOD_CATEGORIES.includes((p.category || '').toLowerCase());
            return vendor === 'The Butcher Shop' ? isFood : !isFood;
        });

        const categoriesPresent = [...new Set(vendorProducts.map(p => p.category))].sort();
        if (categoriesPresent.length > 1) {
            chipsContainer.innerHTML = `
                <button class="category-chip ${selectedCategory === 'all' ? 'active' : ''}" data-cat="all"><i class="fas fa-border-all"></i> All</button>
                ${categoriesPresent.map(cat => `
                    <button class="category-chip ${selectedCategory === cat ? 'active' : ''}" data-cat="${escapeHtml(cat)}"><i class="fas ${categoryIcon(cat)}"></i> ${escapeHtml(categoryLabel(cat))}</button>
                `).join('')}
            `;
            chipsContainer.querySelectorAll('.category-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    selectedCategory = chip.dataset.cat;
                    renderMenu();
                });
            });
        } else {
            chipsContainer.innerHTML = '';
            selectedCategory = 'all';
        }

        const filtered = selectedCategory === 'all' ? vendorProducts : vendorProducts.filter(p => p.category === selectedCategory);

        if (!filtered.length) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text2);"><i class="fas fa-box-open"></i> No items available</div>';
            return;
        }
        container.innerHTML = `
            <div class="products-grid">
                ${filtered.map(p => `
                    <div class="product-card">
                        <img class="product-img" src="${p.image || 'https://placehold.co/400x300/1C2030/8B92A8?text=Item'}" onerror="this.src='https://placehold.co/400x300/1C2030/8B92A8?text=No+Image'">
                        <div class="product-info">
                            <div class="product-category-tag">${escapeHtml(categoryLabel(p.category))}</div>
                            <div class="product-name">${escapeHtml(p.name)}</div>
                            <div class="product-price">R${p.price}</div>
                            <button class="add-btn" data-id="${p.id}" data-name="${escapeHtml(p.name)}" data-price="${p.price}" data-vendor="${vendor}"><i class="fas fa-plus-circle"></i> Add</button>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
        document.querySelectorAll('.add-btn').forEach(btn => {
            btn.onclick = () => addToCart(btn.dataset.name, parseFloat(btn.dataset.price), btn.dataset.vendor, btn.dataset.id);
        });
    }

    function renderShishaCustomizer(container) {
        // Also exclude devices already added to the current cart but not yet checked out —
        // otherwise the same device could be picked twice before the DB status flips to in_use.
        const cartDeviceIds = new Set(currentCart.filter(i => i.isShisha).map(i => i.deviceId));
        const pickableDevices = shishaDevices.filter(d => !cartDeviceIds.has(d.id));

        if (!shishaFlavours.length || !shishaDevices.length) {
            container.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text2);"><i class="fas fa-exclamation-triangle"></i> Shisha setup incomplete</div>';
            return;
        }
        if (!pickableDevices.length) {
            container.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text2);"><i class="fas fa-smoking"></i> All hookah devices are currently in session. None available to book right now.</div>';
            return;
        }
        container.innerHTML = `
            <div class="shisha-customizer">
                <h4 style="margin-bottom:16px;"><i class="fas fa-smoking"></i> Custom Hookah Session</h4>
                <div class="customizer-group">
                    <label><i class="fas fa-leaf"></i> Flavour</label>
                    <select id="shishaFlavour">
                        ${shishaFlavours.map(f => `<option value="${f.id}" data-price="${f.price}" data-name="${escapeHtml(f.name)}">${escapeHtml(f.name)} - R${f.price}</option>`).join('')}
                    </select>
                </div>
                <div class="customizer-group">
                    <label><i class="fas fa-smoking"></i> Hookah Device <span style="color:var(--green); font-weight:400;">(${pickableDevices.length} available)</span></label>
                    <select id="shishaDevice">
                        ${pickableDevices.map(d => `<option value="${d.id}" data-code="${d.device_code}">${d.device_code}</option>`).join('')}
                    </select>
                </div>
                <div class="customizer-group">
                    <label><i class="fas fa-map-marker-alt"></i> Shisha Station</label>
                    <select id="shishaLocation">
                        ${shishaLocations.map(l => `<option value="${l.id}" data-name="${escapeHtml(l.name)}">${escapeHtml(l.name)}</option>`).join('')}
                    </select>
                </div>
                <div class="preview-price" id="shishaPreviewPrice"><i class="fas fa-tag"></i> R${shishaFlavours[0]?.price || 0}</div>
                <button class="add-btn" id="addShishaBtn"><i class="fas fa-cart-plus"></i> Add Hookah Session</button>
            </div>
        `;
        document.getElementById('shishaFlavour').addEventListener('change', (e) => {
            const price = shishaFlavours.find(f => f.id == e.target.value)?.price || 0;
            document.getElementById('shishaPreviewPrice').innerHTML = `<i class="fas fa-tag"></i> R${price}`;
        });
        document.getElementById('addShishaBtn').addEventListener('click', () => {
            const flavourId = document.getElementById('shishaFlavour').value;
            const deviceId = document.getElementById('shishaDevice').value;
            const locationId = document.getElementById('shishaLocation').value;
            const flavour = shishaFlavours.find(f => f.id == flavourId);
            const device = pickableDevices.find(d => d.id == deviceId);
            const location = shishaLocations.find(l => l.id == locationId);
            if (!flavour || !device) { showToast('Select flavour and device', true); return; }
            addShishaToCart(flavour, device, location);
        });
    }

    function addShishaToCart(flavour, device, location) {
        if (!currentCustomer) { showToast('Load a customer first', true); return; }
        const sessionId = 'SHS-' + Date.now() + '-' + Math.random().toString(36).substr(2,4);
        currentCart.push({
            id: sessionId,
            name: `${flavour.name} Hookah`,
            price: flavour.price,
            vendor: 'Shisha Lounge',
            quantity: 1,
            productId: `shisha_${flavour.id}`,
            flavourId: flavour.id,
            deviceId: device.id,
            deviceCode: device.device_code,
            locationId: location?.id,
            locationName: location?.name,
            sessionId: sessionId,
            isShisha: true
        });
        updateCartUI();
        renderMenu(); // drop this device out of the picker immediately, before checkout even runs
        showToast(`Added ${flavour.name} hookah (${device.device_code})`);
    }

    function addToCart(name, price, vendor, productId) {
        if (!currentCustomer) { showToast('Load a customer first', true); return; }
        const existing = currentCart.find(i => i.productId === productId && i.vendor === vendor);
        if (existing) existing.quantity++;
        else currentCart.push({ id: Date.now()+'-'+productId, name, price, vendor, quantity: 1, productId, isShisha: false });
        updateCartUI();
        showToast(`Added ${name}`);
    }

    function updateCartUI() {
        const container = document.getElementById('cartItems');
        let subtotal = 0, totalItems = 0;
        if (!currentCart.length) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color: var(--text2);"><i class="fas fa-cart-plus"></i> Cart empty</div>';
            document.getElementById('cartItemCount').innerText = '0';
            document.getElementById('cartSubtotal').innerHTML = 'R0';
            document.getElementById('checkoutBtn').disabled = true;
            return;
        }
        let html = '';
        currentCart.forEach((item, idx) => {
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;
            totalItems += item.quantity;
            let icon = item.vendor === 'Shisha Lounge' ? '<i class="fas fa-smoking"></i>' : (item.vendor === 'The Butcher Shop' ? '<i class="fas fa-utensils"></i>' : '<i class="fas fa-beer"></i>');
            html += `
                <div class="cart-item">
                    <div style="font-size: 1.2rem;">${icon}</div>
                    <div class="cart-item-details">
                        <div class="cart-item-name">${escapeHtml(item.name)}</div>
                        <div class="cart-item-price">R${item.price} · ${item.vendor === 'Shisha Lounge' ? item.deviceCode || '' : ''}</div>
                        ${item.sessionId ? `<div style="font-size:0.6rem; color:var(--red);"><i class="fas fa-qrcode"></i> ${item.sessionId}</div>` : ''}
                    </div>
                    <div class="cart-item-controls">
                        <button class="qty-btn" onclick="window.updateQuantity(${idx}, -1)">-</button>
                        <span style="min-width:28px; text-align:center;">${item.quantity}</span>
                        <button class="qty-btn" onclick="window.updateQuantity(${idx}, 1)">+</button>
                        <button class="remove-item" onclick="window.removeCartItem(${idx})"><i class="fas fa-trash"></i></button>
                    </div>
                    <span style="font-weight:700;">R${itemTotal.toFixed(2)}</span>
                </div>
            `;
        });
        container.innerHTML = html;
        document.getElementById('cartItemCount').innerText = totalItems;
        document.getElementById('cartSubtotal').innerHTML = 'R' + subtotal.toFixed(2);
        document.getElementById('checkoutBtn').disabled = false;
    }

    window.updateQuantity = (idx, delta) => {
        if (currentCart[idx]) {
            const wasShisha = currentCart[idx].isShisha;
            currentCart[idx].quantity += delta;
            if (currentCart[idx].quantity <= 0) currentCart.splice(idx, 1);
            updateCartUI();
            if (wasShisha && vendor === 'Shisha Lounge') renderMenu();
        }
    };
    window.removeCartItem = (idx) => {
        const wasShisha = currentCart[idx]?.isShisha;
        currentCart.splice(idx, 1);
        updateCartUI();
        if (wasShisha && vendor === 'Shisha Lounge') renderMenu();
    };
    window.clearCart = () => { currentCart = []; updateCartUI(); if (vendor === 'Shisha Lounge') renderMenu(); };

    // ---------- CUSTOMER LOADING ----------
    async function loadCustomer() {
        const identifier = document.getElementById('customerSearch').value.trim();
        if (!identifier) { showToast('Enter phone or wallet ID', true); return; }
        const variants = phoneVariants(identifier);
        let { data: profile } = await supabase.from('profiles').select('*').in('phone', variants).maybeSingle();
        if (!profile) {
            const { data: byWallet } = await supabase.from('profiles').select('*').eq('wallet_id', identifier).maybeSingle();
            if (byWallet) profile = byWallet;
        }
        if (!profile) { showToast('Customer not found', true); return; }

        let booking = null;
        let tabBalance = 0;
        let packageName = null;
        let bookingId = null;
        let tableLabel = null;

        const { data: bookingData } = await supabase
            .from('vvip_bookings')
            .select(`id, remaining_balance, table_id, packages:vvip_packages(name), table:vvip_tables(table_number)`)
            .eq('customer_id', profile.id)
            .in('status', ['confirmed', 'checked_in', 'seated'])
            .order('created_at', { ascending: false })
            .maybeSingle();

        if (bookingData) {
            booking = bookingData;
            tabBalance = bookingData.remaining_balance ?? 0;
            packageName = bookingData.packages?.name || 'VVIP Package';
            bookingId = bookingData.id;
            tableLabel = bookingData.table?.table_number || null;
        } else {
            const { data: tabAcc } = await supabase
                .from('vvip_tab_accounts')
                .select('balance')
                .eq('user_id', profile.id)
                .maybeSingle();
            if (tabAcc && tabAcc.balance > 0) {
                tabBalance = tabAcc.balance;
                packageName = 'Tab Credit (Standalone)';
                bookingId = null;
            }
        }

        currentCustomer = profile;
        currentTabBalance = tabBalance;
        currentPackageInfo = {
            name: packageName || 'No active package',
            remaining: tabBalance,
            bookingId: bookingId,
            tableLabel: tableLabel
        };
        currentCart = [];
        updateCustomerUI();
        updateCartUI();
        showToast(`Loaded ${profile.name || profile.phone}${tableLabel ? ' · ' + tableLabel : ''} | Credit R${tabBalance.toFixed(2)}`);
    }
    window.loadCustomer = loadCustomer;

    function updateCustomerUI() {
        if (!currentCustomer) {
            document.getElementById('customerCard').style.display = 'none';
            return;
        }
        document.getElementById('customerCard').style.display = 'block';
        document.getElementById('custName').innerText = currentCustomer.name || 'Guest';
        document.getElementById('custTableBadge').innerHTML = currentPackageInfo?.tableLabel
            ? `<span class="table-badge-inline"><i class="fas fa-chair"></i> ${escapeHtml(currentPackageInfo.tableLabel)}</span>` : '';
        document.getElementById('custPhone').innerText = currentCustomer.phone || '-';
        document.getElementById('tabBalance').innerHTML = `R${currentTabBalance.toFixed(2)}`;
        const pkgDiv = document.getElementById('packageInfo');
        if (currentPackageInfo && currentPackageInfo.remaining > 0) {
            pkgDiv.innerHTML = `<div class="package-badge"><i class="fas fa-crown"></i> ${escapeHtml(currentPackageInfo.name)} · R${currentPackageInfo.remaining.toFixed(2)} left</div>`;
        } else {
            pkgDiv.innerHTML = '<div class="package-badge">No active package</div>';
        }
    }
    window.clearCustomer = () => {
        currentCustomer = null;
        currentCart = [];
        currentTabBalance = 0;
        currentPackageInfo = null;
        document.getElementById('customerCard').style.display = 'none';
        document.getElementById('customerSearch').value = '';
        updateCartUI();
        showToast('Customer cleared');
    };

    // ---------- QUICK LOAD BY TABLE ----------
    async function loadActiveTables() {
        const { data } = await supabase
            .from('vvip_bookings')
            .select(`id, customer_id, customer_name, remaining_balance, checked_in_count, table_id, packages:vvip_packages(name), table:vvip_tables(table_number, capacity)`)
            .in('status', ['confirmed', 'checked_in', 'seated'])
            .order('created_at', { ascending: false });
        activeTables = data || [];
        renderActiveTables();
    }

    function renderActiveTables() {
        const container = document.getElementById('activeTablesStrip');
        if (!container) return;
        if (!activeTables.length) {
            container.innerHTML = '<div class="no-tables-msg"><i class="fas fa-moon"></i> No active VVIP tables right now</div>';
            return;
        }
        container.innerHTML = activeTables.map(b => {
            const tableName = b.table?.table_number || 'Unassigned';
            const partySize = b.table?.capacity || 1;
            const arrived = Math.min(b.checked_in_count || 0, partySize);
            const remaining = b.remaining_balance ?? 0;
            return `
                <button class="table-chip" onclick="loadCustomerByBooking('${b.id}')">
                    <div class="table-chip-name"><i class="fas fa-chair"></i> ${escapeHtml(tableName)}</div>
                    <div class="table-chip-guest">${escapeHtml(b.customer_name || 'Guest')}</div>
                    <div class="table-chip-meta"><span>R${remaining.toFixed(0)}</span><span>${arrived}/${partySize} <i class="fas fa-users"></i></span></div>
                </button>
            `;
        }).join('');
    }

    window.loadCustomerByBooking = async function(bookingId) {
        const booking = activeTables.find(b => b.id === bookingId);
        if (!booking) return;
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', booking.customer_id).maybeSingle();
        if (!profile) { showToast('Customer profile not found', true); return; }
        currentCustomer = profile;
        currentTabBalance = booking.remaining_balance ?? 0;
        currentPackageInfo = {
            name: booking.packages?.name || 'VVIP Package',
            remaining: booking.remaining_balance ?? 0,
            bookingId: booking.id,
            tableLabel: booking.table?.table_number || null
        };
        currentCart = [];
        updateCustomerUI();
        updateCartUI();
        document.getElementById('customerSearch').value = profile.phone || '';
        showToast(`Loaded ${profile.name || 'Guest'} · ${booking.table?.table_number || 'Table'}`);
    };

    // ---------- CHECKOUT ----------
    async function checkout() {
        if (!currentCustomer) { showToast('No customer loaded', true); return; }
        const total = currentCart.reduce((s,i) => s + i.price * i.quantity, 0);
        if (total === 0) { showToast('Cart empty', true); return; }
        if (currentTabBalance < total) {
            showToast(`Insufficient credit: need R${total}, have R${currentTabBalance}`, true);
            return;
        }

        const shishaItems = currentCart.filter(i => i.isShisha);
        for (const shItem of shishaItems) {
            const customerPhone = currentCustomer.phone || '';
            if (!customerPhone) {
                showToast('Customer phone number missing for shisha session', true);
                return;
            }
            const { error: sessionError } = await supabase.from('shisha_sessions').insert([{
                customer_phone: customerPhone,
                device_id: shItem.deviceId,
                product_id: shItem.flavourId,
                location_id: shItem.locationId || null,
                start_time: new Date().toISOString(),
                last_refill_time: new Date().toISOString(),
                remaining_time_seconds: 3600,
                total_amount: shItem.price,
                refill_count: 0,
                status: 'active',
                paused: false,
                created_at: new Date(),
                payment_method: 'vvip_tab'
            }]);
            if (sessionError) {
                console.error('Shisha session error:', sessionError);
                showToast('Failed to create shisha session: ' + sessionError.message, true);
                return;
            }
            await supabase.from('hookah_devices').update({ status: 'in_use' }).eq('id', shItem.deviceId);
        }
        if (shishaItems.length) await loadHookahDevices(); // don't wait on the realtime round-trip to reflect this

        const vendorGroups = new Map();
        currentCart.forEach(item => {
            if (!vendorGroups.has(item.vendor)) vendorGroups.set(item.vendor, []);
            vendorGroups.get(item.vendor).push(item);
        });
        const newBalance = currentTabBalance - total;
        try {
            for (const [vendorName, items] of vendorGroups.entries()) {
                const orderNumber = `${vendorName === 'Rands Smart Counter' ? 'SC' : vendorName === 'The Butcher Shop' ? 'BT' : 'SH'}-${Date.now()}-${Math.floor(Math.random()*1000)}`;
                const orderItems = items.map(i => ({
                    product_name: i.name,
                    quantity: i.quantity,
                    unit_price: i.price,
                    subtotal: i.price * i.quantity,
                    session_id: i.sessionId || null,
                    device_code: i.deviceCode || null
                }));
                const { error } = await supabase.from('orders').insert([{
                    order_number: orderNumber,
                    customer_phone: currentCustomer.phone || '',
                    customer_name: currentCustomer.name || 'Guest',
                    total: items.reduce((s,i) => s + i.price * i.quantity, 0),
                    payment_method: 'vvip_tab',
                    payment_status: 'paid',
                    status: 'pending',
                    vendor: vendorName,
                    source: 'vvip_pos',
                    is_vvip: true,
                    items: orderItems,
                    created_at: new Date()
                }]);
                if (error) throw error;
            }

            if (currentPackageInfo?.bookingId) {
                const { error: updateError } = await supabase
                    .from('vvip_bookings')
                    .update({ remaining_balance: newBalance })
                    .eq('id', currentPackageInfo.bookingId);
                if (updateError) throw updateError;
            } else {
                const { data: tabAcc } = await supabase
                    .from('vvip_tab_accounts')
                    .select('id, balance')
                    .eq('user_id', currentCustomer.id)
                    .single();
                if (tabAcc) {
                    const { error: updateTab } = await supabase
                        .from('vvip_tab_accounts')
                        .update({ balance: newBalance })
                        .eq('id', tabAcc.id);
                    if (updateTab) throw updateTab;
                } else {
                    throw new Error('No tab account found to deduct from');
                }
            }

            currentTabBalance = newBalance;
            if (currentPackageInfo) currentPackageInfo.remaining = newBalance;
            updateCustomerUI();
            clearCart();
            showToast(`✅ Charged R${total}. Remaining R${newBalance}`);
            if (newBalance <= 0) showToast('Credit depleted. Please top up or buy a new package.');
            loadStats();
        } catch (err) {
            console.error('Checkout error:', err);
            showToast('Checkout failed: ' + err.message, true);
        }
    }
    document.getElementById('checkoutBtn').onclick = checkout;

    // ---------- STATS & REAL-TIME ----------
    async function loadStats() {
        const { data: orders } = await supabase.from('orders').select('total');
        const totalRevenue = (orders || []).reduce((s,o) => s + (o.total || 0), 0);
        revenue = totalRevenue;
        const { count: active } = await supabase.from('vvip_bookings').select('*', { count:'exact', head: true }).in('status', ['checked_in','seated']);
        activeGuests = active || 0;
        document.getElementById('revenueStat').innerHTML = 'R' + revenue.toLocaleString();
        document.getElementById('activeGuestsStat').innerText = activeGuests;

        const { data: requests } = await supabase.from('service_requests').select('*').eq('status', 'pending');
        pendingRequests = requests || [];
        document.getElementById('requestCountStat').innerText = pendingRequests.length;
        document.getElementById('requestCountBadge').innerText = pendingRequests.length;
        const widget = document.getElementById('requestsWidget');
        if (pendingRequests.length) {
            widget.style.display = 'block';
            const listDiv = document.getElementById('requestsList');
            listDiv.innerHTML = pendingRequests.map(req => `
                <div class="request-item">
                    <div><i class="fas fa-user"></i> <strong>${escapeHtml(req.customer_name)}</strong> · R${req.remaining_balance}</div>
                    <div class="request-actions">
                        <button onclick="acceptRequest('${req.id}')"><i class="fas fa-check"></i> Accept</button>
                        <button onclick="declineRequest('${req.id}')" style="background: gray;"><i class="fas fa-times"></i> Decline</button>
                    </div>
                </div>
            `).join('');
        } else {
            widget.style.display = 'none';
        }
    }

    window.acceptRequest = async (id) => {
        const req = pendingRequests.find(r => r.id == id);
        if (!req) return;
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', req.customer_id).single();
        if (profile) {
            currentCustomer = profile;
            const { data: booking } = await supabase.from('vvip_bookings').select('id, remaining_balance, table_id, packages:vvip_packages(name), table:vvip_tables(table_number)').eq('customer_id', profile.id).in('status', ['confirmed','checked_in','seated']).maybeSingle();
            if (booking) {
                currentTabBalance = booking.remaining_balance ?? 0;
                currentPackageInfo = { name: booking.packages?.name, remaining: booking.remaining_balance ?? 0, bookingId: booking.id, tableLabel: booking.table?.table_number || null };
            } else {
                const { data: tabAcc } = await supabase.from('vvip_tab_accounts').select('balance').eq('user_id', profile.id).maybeSingle();
                currentTabBalance = tabAcc?.balance || 0;
                currentPackageInfo = { name: 'Tab Credit', remaining: currentTabBalance, bookingId: null, tableLabel: null };
            }
            updateCustomerUI();
            updateCartUI();
            document.getElementById('customerSearch').value = profile.phone || '';
            await supabase.from('service_requests').update({ status: 'accepted', accepted_at: new Date() }).eq('id', id);
            loadStats();
            showToast(`Loaded ${profile.name}`);
        }
    };
    window.declineRequest = async (id) => {
        await supabase.from('service_requests').update({ status: 'declined' }).eq('id', id);
        loadStats();
        showToast('Request declined');
    };

    function setupRealtime() {
        supabase.channel('vvip-pos')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_bookings' }, () => { if (currentCustomer) loadCustomer(); loadActiveTables(); loadStats(); })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_tab_accounts' }, () => { if (currentCustomer) loadCustomer(); })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'service_requests' }, () => loadStats())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'hookah_devices' }, () => loadHookahDevices())
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'vvip_packages' }, () => loadActiveTables())
            .subscribe();
    }

    // ---------- ORDERS & DASHBOARD ----------
    window.showActiveOrders = async () => {
        const { data } = await supabase.from('orders').select('*').in('status', ['pending','preparing','ready']).order('created_at', { ascending: false });
        const container = document.getElementById('activeOrdersList');
        if (!data?.length) container.innerHTML = '<div style="text-align:center; color:var(--text2);"><i class="fas fa-inbox"></i> No active orders</div>';
        else {
            container.innerHTML = data.map(o => `
                <div style="background: var(--surface2); border-radius: 20px; padding: 16px; margin-bottom: 12px; border-left: 4px solid var(--red);">
                    <div style="display: flex; justify-content: space-between;">
                        <strong><i class="fas fa-receipt"></i> #${o.order_number}</strong>
                        <span style="color: var(--red);">R${o.total}</span>
                    </div>
                    <div><i class="fas fa-user"></i> ${o.customer_name} · ${o.vendor}</div>
                    <div style="margin-top: 8px;">
                        <span style="background: var(--surface3); padding: 4px 12px; border-radius: 30px;">${o.status}</span>
                        ${o.status === 'pending' ? `<button class="status-btn" style="margin-left: 10px;" onclick="updateOrderStatus('${o.id}', 'preparing')"><i class="fas fa-play"></i> Start prep</button>` : ''}
                        ${o.status === 'preparing' ? `<button class="status-btn" style="margin-left: 10px;" onclick="updateOrderStatus('${o.id}', 'ready')"><i class="fas fa-flag-checkered"></i> Mark ready</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
        document.getElementById('ordersModal').classList.add('active');
    };
    window.updateOrderStatus = async (orderId, newStatus) => {
        await supabase.from('orders').update({ status: newStatus }).eq('id', orderId);
        showToast(`Order status → ${newStatus}`);
        showActiveOrders();
    };
    window.openDashboard = async () => {
        const { data: orders } = await supabase.from('orders').select('total, created_at');
        const total = (orders || []).reduce((s,o) => s + (o.total || 0), 0);
        const today = new Date().toISOString().split('T')[0];
        const todayTotal = (orders || []).filter(o => o.created_at?.startsWith(today)).reduce((s,o) => s + (o.total || 0), 0);
        document.getElementById('dashboardContent').innerHTML = `
            <div style="background: var(--surface2); border-radius: 24px; padding: 24px; text-align: center;">
                <div style="font-size: 2rem; font-weight: 800; color: var(--red);">R${total.toLocaleString()}</div>
                <div><i class="fas fa-chart-line"></i> Total Revenue (All Time)</div>
                <div style="margin-top: 20px; font-size: 1.2rem;"><i class="fas fa-calendar-day"></i> Today: R${todayTotal.toLocaleString()}</div>
                <div style="margin-top: 12px;"><i class="fas fa-users"></i> Active VVIP Guests: ${activeGuests}</div>
            </div>
        `;
        document.getElementById('dashboardModal').classList.add('active');
    };
    window.closeModal = (id) => document.getElementById(id).classList.remove('active');

    // Vendor switching
    document.querySelectorAll('.vendor-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.vendor-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            vendor = btn.dataset.vendor;
            selectedCategory = 'all';
            renderMenu();
        });
    });

    // Initialisation
    async function init() {
        await loadProductsAndShisha();
        await loadActiveTables();
        await loadStats();
        setupRealtime();
        setInterval(loadStats, 10000);
    }
    init();
</script>
</body>
</html>
