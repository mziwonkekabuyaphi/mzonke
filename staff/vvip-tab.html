<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>VVIP POS | Rands Sovereign Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
:root {
    --red: #E30613;
    --red-dark: #a0010e;
    --red-soft: #FFF5F5;
    --white: #FFFFFF;
    --gray-bg: #F8FAFC;
    --gray-border: #E2E8F0;
    --gray-text: #475569;
    --gray-light: #94A3B8;
    --gold: #D4AF37;
    --success: #10b981;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --radius-lg: 28px;
    --radius-md: 20px;
    --radius-sm: 14px;
}
body {
    font-family: 'Inter', sans-serif;
    background: var(--gray-bg);
    color: #1E293B;
    padding: 20px;
    min-height: 100vh;
}
.container {
    max-width: 1600px;
    margin: 0 auto;
}

/* Header / Status Bar */
.status-bar {
    background: var(--white);
    border-radius: 60px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--gray-border);
}
.status-dot {
    width: 12px;
    height: 12px;
    background: var(--success);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
}
.status-text {
    font-weight: 700;
    color: var(--red);
    letter-spacing: 0.3px;
}
.status-stats {
    display: flex;
    gap: 24px;
    font-size: 0.8rem;
    color: var(--gray-text);
}
.status-stats span {
    color: var(--red);
    font-weight: 700;
}
.status-buttons {
    margin-left: auto;
    display: flex;
    gap: 12px;
}
.status-btn {
    background: transparent;
    border: 1px solid var(--gray-border);
    padding: 8px 20px;
    border-radius: 40px;
    font-weight: 600;
    font-size: 0.75rem;
    color: var(--gray-text);
    cursor: pointer;
    transition: all 0.2s;
}
.status-btn:hover {
    background: var(--red);
    border-color: var(--red);
    color: white;
    transform: translateY(-2px);
}
.status-btn.primary {
    background: var(--red);
    border-color: var(--red);
    color: white;
}

/* Main Layout */
.main-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
    margin-bottom: 24px;
}

/* Left Panel (Menu) */
.menu-panel {
    background: var(--white);
    border-radius: var(--radius-lg);
    border: 1px solid var(--gray-border);
    padding: 20px;
    box-shadow: var(--shadow-sm);
}
.vendor-tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--gray-border);
    padding-bottom: 12px;
}
.vendor-tab {
    background: transparent;
    border: none;
    padding: 10px 24px;
    border-radius: 40px;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--gray-text);
    cursor: pointer;
    transition: all 0.2s;
}
.vendor-tab.active {
    background: var(--red);
    color: white;
}
.vendor-tab i {
    margin-right: 8px;
}
.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 20px;
}
.product-card {
    background: var(--white);
    border-radius: var(--radius-md);
    border: 1px solid var(--gray-border);
    transition: all 0.2s;
    overflow: hidden;
}
.product-card:hover {
    transform: translateY(-4px);
    border-color: var(--red);
    box-shadow: var(--shadow-md);
}
.product-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    background: var(--gray-bg);
}
.product-info {
    padding: 12px;
}
.product-name {
    font-weight: 700;
    font-size: 0.9rem;
}
.product-price {
    color: var(--red);
    font-weight: 800;
    margin-top: 4px;
}
.add-btn {
    background: var(--red);
    color: white;
    border: none;
    width: 100%;
    padding: 10px;
    border-radius: 40px;
    margin-top: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.1s;
}
.add-btn:active { transform: scale(0.97); }

/* Shisha Customizer */
.shisha-customizer {
    background: var(--red-soft);
    border-radius: var(--radius-md);
    padding: 20px;
    border: 1px solid var(--red);
}
.customizer-group {
    margin-bottom: 16px;
}
.customizer-group label {
    display: block;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--gray-text);
    margin-bottom: 6px;
}
.customizer-group select {
    width: 100%;
    padding: 12px;
    border-radius: 40px;
    border: 1px solid var(--gray-border);
    background: white;
}
.preview-price {
    background: white;
    border-radius: 30px;
    padding: 12px;
    text-align: center;
    margin: 16px 0;
    font-weight: 800;
    color: var(--red);
}

/* Right Panel (Cart) */
.cart-panel {
    background: var(--white);
    border-radius: var(--radius-lg);
    border: 1px solid var(--gray-border);
    padding: 20px;
    position: sticky;
    top: 20px;
    height: fit-content;
    box-shadow: var(--shadow-sm);
}
.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--red);
    margin-bottom: 20px;
    font-weight: 800;
    font-size: 1.2rem;
}
.cart-items {
    max-height: 400px;
    overflow-y: auto;
    margin-bottom: 20px;
}
.cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--gray-bg);
    padding: 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
}
.cart-item-details {
    flex: 1;
}
.cart-item-name {
    font-weight: 600;
    font-size: 0.85rem;
}
.cart-item-price {
    font-size: 0.7rem;
    color: var(--gray-text);
}
.cart-item-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}
.qty-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--red);
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
.remove-item {
    background: none;
    border: none;
    color: var(--gray-light);
    cursor: pointer;
}
.cart-summary {
    background: var(--gray-bg);
    padding: 16px;
    border-radius: var(--radius-sm);
    margin-bottom: 20px;
}
.cart-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.btn-checkout {
    background: var(--red);
    border: none;
    padding: 14px;
    border-radius: 60px;
    color: white;
    font-weight: 700;
    cursor: pointer;
}
.btn-clear {
    background: transparent;
    border: 1px solid var(--gray-border);
    border-radius: 60px;
    padding: 14px;
    font-weight: 600;
    cursor: pointer;
}

/* Customer Info Card */
.customer-card {
    background: var(--white);
    border-radius: var(--radius-md);
    border-left: 5px solid var(--red);
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
}
.customer-row {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 12px;
}
.balance {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--red);
}
.package-badge {
    background: var(--red-soft);
    padding: 6px 12px;
    border-radius: 40px;
    font-size: 0.7rem;
    color: var(--red);
}

/* Requests Widget */
.requests-widget {
    background: #FFF9E6;
    border-radius: var(--radius-md);
    border-left: 4px solid var(--gold);
    padding: 12px 16px;
    margin-bottom: 20px;
}
.request-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #FFE5B4;
}
.request-actions button {
    background: var(--red);
    border: none;
    color: white;
    padding: 4px 12px;
    border-radius: 30px;
    font-size: 0.7rem;
    margin-left: 8px;
    cursor: pointer;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(6px);
    z-index: 2000;
    align-items: center;
    justify-content: center;
}
.modal.active {
    display: flex;
}
.modal-content {
    background: var(--white);
    border-radius: var(--radius-lg);
    max-width: 500px;
    width: 90%;
    padding: 24px;
    border: 2px solid var(--red);
}
.toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #1E293B;
    color: white;
    padding: 12px 24px;
    border-radius: 60px;
    z-index: 3000;
    display: none;
    font-size: 0.8rem;
}
@keyframes pulse {
    0% { opacity: 1; transform: scale(1);}
    50% { opacity: 0.5; transform: scale(1.1);}
    100% { opacity: 1; transform: scale(1);}
}
@media (max-width: 768px) {
    .main-grid { grid-template-columns: 1fr; }
    .status-buttons { margin-left: 0; width: 100%; justify-content: space-between; }
}
</style>
</head>
<body>
<div class="container">
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-dot"></div>
        <div class="status-text"><i class="fas fa-crown"></i> VVIP TERMINAL • ACTIVE</div>
        <div class="status-stats">
            <div><i class="fas fa-chart-line"></i> Revenue: <span id="revenueStat">R0</span></div>
            <div><i class="fas fa-users"></i> Active VVIP: <span id="activeGuestsStat">0</span></div>
            <div><i class="fas fa-bell"></i> Requests: <span id="requestCountStat">0</span></div>
        </div>
        <div class="status-buttons">
            <button class="status-btn" onclick="showActiveOrders()"><i class="fas fa-list"></i> Orders</button>
            <button class="status-btn" onclick="openDashboard()"><i class="fas fa-chart-simple"></i> Dashboard</button>
            <button class="status-btn primary" onclick="window.open('vvip-store.html', '_blank')"><i class="fas fa-gift"></i> Packages</button>
        </div>
    </div>

    <!-- Pending Requests Widget (real-time) -->
    <div id="requestsWidget" class="requests-widget" style="display: none;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <strong><i class="fas fa-crown" style="color: var(--gold);"></i> VVIP Service Requests</strong>
            <span id="requestCountBadge">0</span>
        </div>
        <div id="requestsList"></div>
    </div>

    <!-- Main POS Area -->
    <div class="main-grid">
        <!-- Left: Menu & Vendor -->
        <div class="menu-panel">
            <div class="vendor-tabs" id="vendorTabs">
                <button class="vendor-tab active" data-vendor="Rands Smart Counter"><i class="fas fa-beer"></i> Drinks</button>
                <button class="vendor-tab" data-vendor="The Butcher Shop"><i class="fas fa-utensils"></i> Butcher</button>
                <button class="vendor-tab" data-vendor="Shisha Lounge"><i class="fas fa-smoking"></i> Shisha Lounge</button>
            </div>
            <div id="menuContainer"></div>
        </div>

        <!-- Right: Customer + Cart -->
        <div class="cart-panel">
            <div class="cart-header">
                <span><i class="fas fa-shopping-cart"></i> Current Order</span>
                <span id="cartItemCount">0</span>
            </div>

            <!-- Customer Load Section -->
            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <input type="text" id="customerSearch" placeholder="Phone number or Wallet ID" style="flex:1; padding: 12px; border-radius: 60px; border: 1px solid var(--gray-border);">
                <button class="status-btn primary" onclick="loadCustomer()" style="padding: 0 20px;"><i class="fas fa-search"></i> Load</button>
                <button class="status-btn" onclick="clearCustomer()" style="padding: 0 20px;"><i class="fas fa-times"></i> Clear</button>
            </div>

            <!-- Customer Info Card -->
            <div id="customerCard" style="display: none;" class="customer-card">
                <div class="customer-row">
                    <span><i class="fas fa-user"></i> <strong id="custName">-</strong></span>
                    <span id="custPhone">-</span>
                </div>
                <div class="customer-row">
                    <span><i class="fas fa-wallet"></i> Tab Credit</span>
                    <span class="balance" id="tabBalance">R0</span>
                </div>
                <div id="packageInfo"></div>
            </div>

            <!-- Cart Items -->
            <div id="cartItems" class="cart-items">
                <div style="text-align: center; color: var(--gray-light); padding: 40px;"><i class="fas fa-cart-plus"></i> Cart empty</div>
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary">
                <div style="display: flex; justify-content: space-between;">
                    <span>Subtotal</span>
                    <span id="cartSubtotal" style="font-weight: 800; color: var(--red);">R0</span>
                </div>
            </div>
            <div class="cart-actions">
                <button class="btn-checkout" id="checkoutBtn" disabled><i class="fas fa-credit-card"></i> Checkout</button>
                <button class="btn-clear" onclick="clearCart()"><i class="fas fa-trash-alt"></i> Clear</button>
            </div>
        </div>
    </div>
</div>

<!-- Active Orders Modal -->
<div id="ordersModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2 style="color: var(--red);"><i class="fas fa-list"></i> Active Orders</h2>
            <button onclick="closeModal('ordersModal')" style="background: none; border: none; font-size: 24px;"><i class="fas fa-times"></i></button>
        </div>
        <div id="activeOrdersList" style="max-height: 60vh; overflow-y: auto;"></div>
    </div>
</div>

<!-- Dashboard Modal -->
<div id="dashboardModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2 style="color: var(--red);"><i class="fas fa-chart-line"></i> Dashboard</h2>
            <button onclick="closeModal('dashboardModal')" style="background: none; border: none; font-size: 24px;"><i class="fas fa-times"></i></button>
        </div>
        <div id="dashboardContent"></div>
    </div>
</div>

<div id="toastMessage" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // ---------- GLOBALS ----------
    let currentCustomer = null;
    let currentCart = [];
    let currentTabBalance = 0;
    let currentPackage = null;
    let allProducts = [];
    let shishaFlavours = [], shishaDevices = [], shishaLocations = [];
    let vendor = "Rands Smart Counter";
    let revenue = 0, activeGuests = 0;
    let pendingRequests = [];

    // ---------- HELPERS ----------
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMessage');
        toast.innerText = msg;
        toast.style.background = isError ? '#dc2626' : '#1E293B';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // ---------- LOAD DATA FROM SUPABASE ----------
    async function loadProductsAndShisha() {
        const { data: products } = await supabase.from('products').select('*').eq('is_available', true);
        allProducts = products || [];
        const [flavours, devices, locations] = await Promise.all([
            supabase.from('shisha_products').select('*').eq('is_available', true),
            supabase.from('hookah_devices').select('*').eq('status', 'available'),
            supabase.from('shisha_locations').select('*').eq('is_active', true)
        ]);
        shishaFlavours = flavours.data || [];
        shishaDevices = devices.data || [];
        shishaLocations = locations.data || [];
        renderMenu();
    }

    function renderMenu() {
        const container = document.getElementById('menuContainer');
        if (vendor === 'Shisha Lounge') {
            renderShishaCustomizer(container);
            return;
        }
        const filtered = allProducts.filter(p => {
            if (vendor === 'Rands Smart Counter') return ['beer','wine','spirits','non_alcoholic'].includes(p.category);
            if (vendor === 'The Butcher Shop') return ['butcher','food','steak','burger'].includes(p.category);
            return false;
        });
        if (!filtered.length) {
            container.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fas fa-box-open"></i> No items available</div>';
            return;
        }
        container.innerHTML = `
            <div class="products-grid">
                ${filtered.map(p => `
                    <div class="product-card">
                        <img class="product-img" src="${p.image || 'https://placehold.co/400x300/F1F5F9/94A3B8?text=Item'}" onerror="this.src='https://placehold.co/400x300/F1F5F9/94A3B8?text=No+Image'">
                        <div class="product-info">
                            <div class="product-name">${escapeHtml(p.name)}</div>
                            <div class="product-price">R${p.price}</div>
                            <button class="add-btn" data-id="${p.id}" data-name="${escapeHtml(p.name)}" data-price="${p.price}" data-vendor="${vendor}"><i class="fas fa-plus-circle"></i> Add</button>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
        document.querySelectorAll('.add-btn').forEach(btn => {
            btn.onclick = () => addToCart(btn.dataset.name, parseFloat(btn.dataset.price), btn.dataset.vendor, btn.dataset.id);
        });
    }

    function renderShishaCustomizer(container) {
        if (!shishaFlavours.length || !shishaDevices.length) {
            container.innerHTML = '<div style="padding:40px; text-align:center;"><i class="fas fa-exclamation-triangle"></i> Shisha setup incomplete</div>';
            return;
        }
        container.innerHTML = `
            <div class="shisha-customizer">
                <h4><i class="fas fa-smoking"></i> Custom Hookah Session</h4>
                <div class="customizer-group">
                    <label><i class="fas fa-leaf"></i> Flavour</label>
                    <select id="shishaFlavour">
                        ${shishaFlavours.map(f => `<option value="${f.id}" data-price="${f.price}" data-name="${escapeHtml(f.name)}">${escapeHtml(f.name)} - R${f.price}</option>`).join('')}
                    </select>
                </div>
                <div class="customizer-group">
                    <label><i class="fas fa-smoking"></i> Hookah Device</label>
                    <select id="shishaDevice">
                        ${shishaDevices.map(d => `<option value="${d.id}" data-code="${d.device_code}">${d.device_code}</option>`).join('')}
                    </select>
                </div>
                <div class="customizer-group">
                    <label><i class="fas fa-map-marker-alt"></i> Location</label>
                    <select id="shishaLocation">
                        ${shishaLocations.map(l => `<option value="${l.id}" data-name="${escapeHtml(l.name)}">${escapeHtml(l.name)}</option>`).join('')}
                    </select>
                </div>
                <div class="preview-price" id="shishaPreviewPrice"><i class="fas fa-tag"></i> R${shishaFlavours[0]?.price || 0}</div>
                <button class="add-btn" id="addShishaBtn"><i class="fas fa-cart-plus"></i> Add Hookah Session</button>
            </div>
        `;
        document.getElementById('shishaFlavour').addEventListener('change', (e) => {
            const price = shishaFlavours.find(f => f.id == e.target.value)?.price || 0;
            document.getElementById('shishaPreviewPrice').innerHTML = `<i class="fas fa-tag"></i> R${price}`;
        });
        document.getElementById('addShishaBtn').addEventListener('click', () => {
            const flavourId = document.getElementById('shishaFlavour').value;
            const deviceId = document.getElementById('shishaDevice').value;
            const locationId = document.getElementById('shishaLocation').value;
            const flavour = shishaFlavours.find(f => f.id == flavourId);
            const device = shishaDevices.find(d => d.id == deviceId);
            const location = shishaLocations.find(l => l.id == locationId);
            if (!flavour || !device) { showToast('Select flavour and device', true); return; }
            addShishaToCart(flavour, device, location);
        });
    }

    function addShishaToCart(flavour, device, location) {
        if (!currentCustomer) { showToast('Load a customer first', true); return; }
        const sessionId = 'SHS-' + Date.now() + '-' + Math.random().toString(36).substr(2,4);
        currentCart.push({
            id: sessionId,
            name: `${flavour.name} Hookah`,
            price: flavour.price,
            vendor: 'Shisha Lounge',
            quantity: 1,
            productId: `shisha_${flavour.id}`,
            flavourId: flavour.id,
            deviceId: device.id,
            deviceCode: device.device_code,
            locationId: location?.id,
            locationName: location?.name,
            sessionId: sessionId,
            isShisha: true
        });
        updateCartUI();
        showToast(`Added ${flavour.name} hookah (${device.device_code})`);
    }

    function addToCart(name, price, vendor, productId) {
        if (!currentCustomer) { showToast('Load a customer first', true); return; }
        const existing = currentCart.find(i => i.productId === productId && i.vendor === vendor);
        if (existing) existing.quantity++;
        else currentCart.push({ id: Date.now()+'-'+productId, name, price, vendor, quantity: 1, productId, isShisha: false });
        updateCartUI();
        showToast(`Added ${name}`);
    }

    function updateCartUI() {
        const container = document.getElementById('cartItems');
        let subtotal = 0, totalItems = 0;
        if (!currentCart.length) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color: var(--gray-light);"><i class="fas fa-cart-plus"></i> Cart empty</div>';
            document.getElementById('cartItemCount').innerText = '0';
            document.getElementById('cartSubtotal').innerHTML = 'R0';
            document.getElementById('checkoutBtn').disabled = true;
            return;
        }
        let html = '';
        currentCart.forEach((item, idx) => {
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;
            totalItems += item.quantity;
            let icon = item.vendor === 'Shisha Lounge' ? '<i class="fas fa-smoking"></i>' : (item.vendor === 'The Butcher Shop' ? '<i class="fas fa-utensils"></i>' : '<i class="fas fa-beer"></i>');
            html += `
                <div class="cart-item">
                    <div style="font-size: 1.2rem;">${icon}</div>
                    <div class="cart-item-details">
                        <div class="cart-item-name">${escapeHtml(item.name)}</div>
                        <div class="cart-item-price">R${item.price} · ${item.vendor === 'Shisha Lounge' ? item.deviceCode || '' : ''}</div>
                        ${item.sessionId ? `<div style="font-size:0.6rem; color:var(--red);"><i class="fas fa-qrcode"></i> ${item.sessionId}</div>` : ''}
                    </div>
                    <div class="cart-item-controls">
                        <button class="qty-btn" onclick="window.updateQuantity(${idx}, -1)">-</button>
                        <span style="min-width:28px; text-align:center;">${item.quantity}</span>
                        <button class="qty-btn" onclick="window.updateQuantity(${idx}, 1)">+</button>
                        <button class="remove-item" onclick="window.removeCartItem(${idx})"><i class="fas fa-trash"></i></button>
                    </div>
                    <span style="font-weight:700;">R${itemTotal.toFixed(2)}</span>
                </div>
            `;
        });
        container.innerHTML = html;
        document.getElementById('cartItemCount').innerText = totalItems;
        document.getElementById('cartSubtotal').innerHTML = 'R' + subtotal.toFixed(2);
        document.getElementById('checkoutBtn').disabled = false;
    }

    window.updateQuantity = (idx, delta) => {
        if (currentCart[idx]) {
            currentCart[idx].quantity += delta;
            if (currentCart[idx].quantity <= 0) currentCart.splice(idx, 1);
            updateCartUI();
        }
    };
    window.removeCartItem = (idx) => { currentCart.splice(idx, 1); updateCartUI(); };
    window.clearCart = () => { currentCart = []; updateCartUI(); };

    // ---------- CUSTOMER LOADING ----------
    async function loadCustomer() {
        const identifier = document.getElementById('customerSearch').value.trim();
        if (!identifier) { showToast('Enter phone or wallet ID', true); return; }
        let { data: profile } = await supabase.from('profiles').select('*').eq('phone', identifier).maybeSingle();
        if (!profile) {
            const { data: byWallet } = await supabase.from('profiles').select('*').eq('wallet_id', identifier).maybeSingle();
            if (byWallet) profile = byWallet;
        }
        if (!profile) { showToast('Customer not found', true); return; }

        // Get active VVIP booking
        const { data: booking } = await supabase
            .from('vvip_bookings')
            .select(`id, remaining_balance, total_amount, packages:vvip_packages(name, capacity)`)
            .eq('customer_id', profile.id)
            .in('status', ['confirmed', 'checked_in', 'seated'])
            .order('created_at', { ascending: false })
            .maybeSingle();

        if (booking && booking.remaining_balance !== undefined && booking.remaining_balance > 0) {
            currentTabBalance = booking.remaining_balance;
            currentPackage = { name: booking.packages?.name, tables: booking.packages?.capacity || 0, remaining: booking.remaining_balance };
        } else {
            currentTabBalance = 0;
            currentPackage = null;
        }
        currentCustomer = profile;
        currentCart = [];
        updateCustomerUI();
        updateCartUI();
        showToast(`Welcome ${profile.name || profile.phone} | Credit R${currentTabBalance}`);
    }
    window.loadCustomer = loadCustomer;

    function updateCustomerUI() {
        if (!currentCustomer) {
            document.getElementById('customerCard').style.display = 'none';
            return;
        }
        document.getElementById('customerCard').style.display = 'block';
        document.getElementById('custName').innerText = currentCustomer.name || 'Guest';
        document.getElementById('custPhone').innerText = currentCustomer.phone || '-';
        document.getElementById('tabBalance').innerHTML = `R${currentTabBalance.toFixed(2)}`;
        const pkgDiv = document.getElementById('packageInfo');
        if (currentPackage && currentPackage.remaining > 0) {
            pkgDiv.innerHTML = `<div class="package-badge"><i class="fas fa-crown"></i> ${currentPackage.name} · ${currentPackage.tables} tables · R${currentPackage.remaining} left</div>`;
        } else {
            pkgDiv.innerHTML = '<div class="package-badge">No active package</div>';
        }
    }
    window.clearCustomer = () => {
        currentCustomer = null; currentCart = []; currentTabBalance = 0; currentPackage = null;
        document.getElementById('customerCard').style.display = 'none';
        document.getElementById('customerSearch').value = '';
        updateCartUI();
        showToast('Customer cleared');
    };

    // ---------- CHECKOUT (VVIP TAB DEDUCTION + SHISHA SESSION CREATION) ----------
    async function checkout() {
        if (!currentCustomer) { showToast('No customer loaded', true); return; }
        const total = currentCart.reduce((s,i) => s + i.price * i.quantity, 0);
        if (total === 0) { showToast('Cart empty', true); return; }
        if (currentTabBalance < total) { showToast(`Insufficient credit: need R${total}, have R${currentTabBalance}`, true); return; }

        // Process shisha sessions BEFORE creating orders
        const shishaItems = currentCart.filter(i => i.isShisha);
        for (const shItem of shishaItems) {
            // Create shisha_session record
            const { error: sessionError } = await supabase.from('shisha_sessions').insert([{
                customer_phone: currentCustomer.phone,
                device_id: shItem.deviceId,
                product_id: shItem.flavourId,
                location_id: shItem.locationId || null,
                start_time: new Date().toISOString(),
                last_refill_time: new Date().toISOString(),
                remaining_time_seconds: 3600, // 60 min session
                total_amount: shItem.price,
                refill_count: 0,
                status: 'active',
                paused: false,
                created_at: new Date(),
                payment_method: 'vvip_tab'
            }]);
            if (sessionError) {
                console.error('Shisha session error:', sessionError);
                showToast('Failed to create shisha session', true);
                return;
            }
            // Update hookah device status to 'in_use'
            await supabase.from('hookah_devices').update({ status: 'in_use' }).eq('id', shItem.deviceId);
        }

        // Group by vendor for orders
        const vendorGroups = new Map();
        currentCart.forEach(item => {
            if (!vendorGroups.has(item.vendor)) vendorGroups.set(item.vendor, []);
            vendorGroups.get(item.vendor).push(item);
        });
        const newBalance = currentTabBalance - total;
        try {
            for (const [vendor, items] of vendorGroups.entries()) {
                const orderNumber = `${vendor === 'Rands Smart Counter' ? 'SC' : vendor === 'The Butcher Shop' ? 'BT' : 'SH'}-${Date.now()}-${Math.floor(Math.random()*1000)}`;
                const orderItems = items.map(i => ({
                    product_name: i.name,
                    quantity: i.quantity,
                    unit_price: i.price,
                    subtotal: i.price * i.quantity,
                    session_id: i.sessionId || null,
                    device_code: i.deviceCode || null
                }));
                const { error } = await supabase.from('orders').insert([{
                    order_number: orderNumber,
                    customer_phone: currentCustomer.phone,
                    customer_name: currentCustomer.name,
                    total: items.reduce((s,i) => s + i.price * i.quantity, 0),
                    payment_method: 'vvip_tab',
                    payment_status: 'paid',
                    status: 'pending',
                    vendor: vendor,
                    source: 'vvip_pos',
                    is_vvip: true,
                    customer_id: currentCustomer.id,
                    items: orderItems,
                    created_at: new Date()
                }]);
                if (error) throw error;
            }
            // Update booking balance
            const { data: booking } = await supabase.from('vvip_bookings').select('id').eq('customer_id', currentCustomer.id).in('status', ['confirmed','checked_in','seated']).limit(1).single();
            if (booking) {
                await supabase.from('vvip_bookings').update({ remaining_balance: newBalance }).eq('id', booking.id);
            }
            currentTabBalance = newBalance;
            if (currentPackage) currentPackage.remaining = newBalance;
            updateCustomerUI();
            clearCart();
            showToast(`✅ Charged R${total}. Remaining R${newBalance}`);
            if (newBalance <= 0) showToast('VVIP package depleted. Please purchase a new package.');
            loadStats();
        } catch (err) {
            console.error(err);
            showToast('Checkout failed', true);
        }
    }
    document.getElementById('checkoutBtn').onclick = checkout;

    // ---------- REAL-TIME & STATS ----------
    async function loadStats() {
        const { data: orders } = await supabase.from('orders').select('total');
        const totalRevenue = (orders || []).reduce((s,o) => s + (o.total || 0), 0);
        revenue = totalRevenue;
        const { count: active } = await supabase.from('vvip_bookings').select('*', { count:'exact', head: true }).in('status', ['checked_in','seated']);
        activeGuests = active || 0;
        document.getElementById('revenueStat').innerHTML = 'R' + revenue.toLocaleString();
        document.getElementById('activeGuestsStat').innerText = activeGuests;
        // Pending requests
        const { data: requests } = await supabase.from('service_requests').select('*').eq('status', 'pending');
        pendingRequests = requests || [];
        document.getElementById('requestCountStat').innerText = pendingRequests.length;
        document.getElementById('requestCountBadge').innerText = pendingRequests.length;
        const widget = document.getElementById('requestsWidget');
        if (pendingRequests.length) {
            widget.style.display = 'block';
            const listDiv = document.getElementById('requestsList');
            listDiv.innerHTML = pendingRequests.map(req => `
                <div class="request-item">
                    <div><i class="fas fa-user"></i> <strong>${escapeHtml(req.customer_name)}</strong> · R${req.remaining_balance}</div>
                    <div class="request-actions">
                        <button onclick="acceptRequest('${req.id}')"><i class="fas fa-check"></i> Accept</button>
                        <button onclick="declineRequest('${req.id}')" style="background: gray;"><i class="fas fa-times"></i> Decline</button>
                    </div>
                </div>
            `).join('');
        } else {
            widget.style.display = 'none';
        }
    }

    window.acceptRequest = async (id) => {
        const req = pendingRequests.find(r => r.id == id);
        if (!req) return;
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', req.customer_id).single();
        if (profile) {
            await loadCustomerByProfile(profile);
            await supabase.from('service_requests').update({ status: 'accepted', accepted_at: new Date() }).eq('id', id);
            loadStats();
            showToast(`Loaded ${profile.name}`);
        }
    };
    window.declineRequest = async (id) => {
        await supabase.from('service_requests').update({ status: 'declined' }).eq('id', id);
        loadStats();
        showToast('Request declined');
    };

    async function loadCustomerByProfile(profile) {
        const { data: booking } = await supabase.from('vvip_bookings').select('id, remaining_balance, total_amount, packages:vvip_packages(name, capacity)').eq('customer_id', profile.id).in('status', ['confirmed','checked_in','seated']).maybeSingle();
        if (booking && booking.remaining_balance > 0) {
            currentTabBalance = booking.remaining_balance;
            currentPackage = { name: booking.packages?.name, tables: booking.packages?.capacity, remaining: booking.remaining_balance };
        } else { currentTabBalance = 0; currentPackage = null; }
        currentCustomer = profile;
        currentCart = [];
        updateCustomerUI();
        updateCartUI();
        document.getElementById('customerSearch').value = profile.phone || '';
    }

    function setupRealtime() {
        supabase.channel('vvip-pos').on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_bookings' }, () => { if (currentCustomer) loadCustomer(); loadStats(); })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'service_requests' }, () => loadStats())
            .subscribe();
    }

    // ---------- ORDERS & DASHBOARD ----------
    window.showActiveOrders = async () => {
        const { data } = await supabase.from('orders').select('*').in('status', ['pending','preparing','ready']).order('created_at', { ascending: false });
        const container = document.getElementById('activeOrdersList');
        if (!data?.length) container.innerHTML = '<div style="text-align:center;"><i class="fas fa-inbox"></i> No active orders</div>';
        else {
            container.innerHTML = data.map(o => `
                <div style="background: var(--gray-bg); border-radius: 20px; padding: 16px; margin-bottom: 12px; border-left: 4px solid var(--red);">
                    <div style="display: flex; justify-content: space-between;">
                        <strong><i class="fas fa-receipt"></i> #${o.order_number}</strong>
                        <span style="color: var(--red);">R${o.total}</span>
                    </div>
                    <div><i class="fas fa-user"></i> ${o.customer_name} · ${o.vendor}</div>
                    <div style="margin-top: 8px;">
                        <span style="background: #FFEDD5; padding: 4px 12px; border-radius: 30px;">${o.status}</span>
                        ${o.status === 'pending' ? `<button class="status-btn" style="margin-left: 10px;" onclick="updateOrderStatus('${o.id}', 'preparing')"><i class="fas fa-play"></i> Start prep</button>` : ''}
                        ${o.status === 'preparing' ? `<button class="status-btn" style="margin-left: 10px;" onclick="updateOrderStatus('${o.id}', 'ready')"><i class="fas fa-flag-checkered"></i> Mark ready</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
        document.getElementById('ordersModal').classList.add('active');
    };
    window.updateOrderStatus = async (orderId, newStatus) => {
        await supabase.from('orders').update({ status: newStatus }).eq('id', orderId);
        showToast(`Order status → ${newStatus}`);
        showActiveOrders(); // refresh
    };
    window.openDashboard = async () => {
        const { data: orders } = await supabase.from('orders').select('total, created_at');
        const total = (orders || []).reduce((s,o) => s + (o.total || 0), 0);
        const today = new Date().toISOString().split('T')[0];
        const todayTotal = (orders || []).filter(o => o.created_at?.startsWith(today)).reduce((s,o) => s + (o.total || 0), 0);
        document.getElementById('dashboardContent').innerHTML = `
            <div style="background: var(--gray-bg); border-radius: 24px; padding: 24px; text-align: center;">
                <div style="font-size: 2rem; font-weight: 800; color: var(--red);">R${total.toLocaleString()}</div>
                <div><i class="fas fa-chart-line"></i> Total Revenue (All Time)</div>
                <div style="margin-top: 20px; font-size: 1.2rem;"><i class="fas fa-calendar-day"></i> Today: R${todayTotal.toLocaleString()}</div>
                <div style="margin-top: 12px;"><i class="fas fa-users"></i> Active VVIP Guests: ${activeGuests}</div>
            </div>
        `;
        document.getElementById('dashboardModal').classList.add('active');
    };
    window.closeModal = (id) => document.getElementById(id).classList.remove('active');

    // Vendor switching
    document.querySelectorAll('.vendor-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.vendor-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            vendor = btn.dataset.vendor;
            renderMenu();
        });
    });

    // Initialisation
    async function init() {
        await loadProductsAndShisha();
        await loadStats();
        setupRealtime();
        setInterval(loadStats, 10000);
    }
    init();
</script>
</body>
</html>
