<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rands Locker · Staff Vault</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ========== EMBEDDED MODULE BASE (identical to Pre-Order POS) ========== */
    :root {
      --red: #E30613;
      --red-dark: #a0010e;
      --red-deep: #8A0009;
      --red-glow: rgba(227,6,19,0.18);
      --red-subtle: rgba(227,6,19,0.06);
      --ink: #1e293b;
      --ink-muted: #334155;
      --slate: #475569;
      --mist: #94a3b8;
      --bone: #f8fafd;
      --white: #ffffff;
      --card-bg: #ffffff;
      --border: rgba(0,0,0,0.07);
      --border-strong: #eef2f8;
      --shadow-soft: 0 8px 20px -6px rgba(0,0,0,0.12);
      --shadow-card: 0 4px 24px rgba(0,0,0,0.08);
      --shadow-float: 0 16px 48px rgba(0,0,0,0.14);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-xl: 32px;
      --radius-full: 9999px;
      --transition: all 0.22s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* iframe-ready: no outer margins, background matches Staff Console */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--bone);
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100%;
      padding: 24px;
    }

    /* unified dashboard grid */
    .vault-dashboard {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* card styling – exact match */
    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-soft);
      transition: var(--transition);
    }

    .card-header {
      padding: 20px 24px;
      background: var(--white);
      border-bottom: 2px solid var(--border-strong);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink);
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-header i {
      color: var(--red);
      margin-right: 8px;
    }

    .card-body {
      padding: 24px;
    }

    /* stats row (compact) */
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .stat-chip {
      background: var(--bone);
      border-radius: var(--radius-lg);
      padding: 12px 20px;
      flex: 1;
      text-align: center;
      min-width: 100px;
    }
    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--red);
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--slate);
      margin-top: 4px;
    }

    /* search/unlock card */
    .two-factor-badge {
      background: var(--red-subtle);
      border-left: 3px solid var(--red);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
    }

    .input-group {
      margin-bottom: 18px;
    }
    .input-group label {
      display: block;
      font-weight: 600;
      font-size: 0.8rem;
      margin-bottom: 6px;
      color: var(--ink);
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-strong);
      font-family: 'Inter', monospace;
      font-size: 0.9rem;
      background: var(--white);
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-glow);
    }

    .btn-primary {
      background: var(--red);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
    }
    .btn-primary:active { transform: scale(0.97); }
    .btn-success {
      background: #10b981;
    }
    .btn-warning {
      background: #f59e0b;
    }

    /* customer result styles */
    .result-card {
      margin-top: 20px;
      border-radius: var(--radius-lg);
      padding: 20px;
      border-left: 4px solid;
    }
    .result-success {
      background: #ecfdf5;
      border-left-color: #10b981;
    }
    .result-error {
      background: #fef2f2;
      border-left-color: var(--red);
    }
    .item-list {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 12px;
      margin: 12px 0;
      max-height: 200px;
      overflow-y: auto;
    }

    /* grids */
    .pre-reg-grid, .locker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .pre-card, .locker-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1px solid var(--border-strong);
      transition: var(--transition);
    }
    .pre-card {
      border-left: 4px solid #f59e0b;
    }
    .locker-card.available {
      border-left: 4px solid #10b981;
    }
    .locker-card.occupied {
      border-left: 4px solid var(--red);
    }
    .card-title {
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .badge-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-available { background: #e8f5e9; color: #2e7d32; }
    .badge-occupied { background: #ffebee; color: var(--red); }
    .badge-pending { background: #fff3e0; color: #ef6c00; }

    /* modals (matching POS stunning style) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .modal-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      max-width: 550px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
      border: 2px solid var(--red);
      box-shadow: var(--shadow-float);
    }
    .modal-card h3 { color: var(--red); margin-bottom: 16px; }
    .close-modal {
      float: right;
      font-size: 24px;
      cursor: pointer;
      color: var(--mist);
    }
    .flex-buttons { display: flex; gap: 12px; margin-top: 20px; }

    .toast-pos {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: white;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      z-index: 10002;
      transition: transform 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }
    .toast-pos.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 700px) {
      body { padding: 16px; }
      .stats-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="vault-dashboard">
  <!-- STATS CARD -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-shield-alt"></i> Rands Vault · Two‑Factor Locker System</span>
      <div><button id="refreshGlobalBtn" class="btn-primary" style="padding:6px 16px; width:auto;"><i class="fas fa-sync-alt"></i> Refresh</button></div>
    </div>
    <div class="card-body">
      <div class="stats-row" id="statsContainer"></div>
    </div>
  </div>

  <!-- UNLOCK SECTION (two-factor) -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-unlock-alt"></i> Unlock locker · WhatsApp + PIN</span>
    </div>
    <div class="card-body">
      <div class="two-factor-badge">
        <i class="fas fa-lock"></i> TWO‑FACTOR AUTHENTICATION REQUIRED – Both WhatsApp number AND 4‑digit PIN must match
      </div>
      <div class="input-group">
        <label><i class="fab fa-whatsapp"></i> WhatsApp number</label>
        <input type="tel" id="unlockPhone" placeholder="+27 82 123 4567">
      </div>
      <div class="input-group">
        <label><i class="fas fa-key"></i> 4‑digit PIN</label>
        <input type="password" id="unlockPin" maxlength="4" inputmode="numeric" pattern="\d*" placeholder="****">
      </div>
      <button id="unlockBtn" class="btn-primary btn-success"><i class="fas fa-check-circle"></i> Unlock with 2FA</button>
      <div id="unlockResult"></div>
    </div>
  </div>

  <!-- PRE-REGISTRATIONS (awaiting assignment) -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-clock"></i> Awaiting confirmation (pre‑registrations)</span>
      <button id="refreshPreRegBtn" class="btn-primary" style="padding:6px 16px; width:auto; background:#f59e0b;">Refresh</button>
    </div>
    <div class="card-body">
      <div id="preRegGrid" class="pre-reg-grid"></div>
    </div>
  </div>

  <!-- LOCKERS SECTION -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-archive"></i> Rands Vault lockers</span>
      <div><button id="createLockerBtn" class="btn-primary" style="background:#10b981; padding:6px 16px; width:auto;"><i class="fas fa-plus"></i> New locker</button></div>
    </div>
    <div class="card-body">
      <div id="lockerGrid" class="locker-grid"></div>
    </div>
  </div>
</div>

<!-- MODALS (restyled) -->
<div id="assignModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <span class="close-modal" onclick="closeAssignModal()">&times;</span>
    <h3><i class="fas fa-exchange-alt"></i> Assign locker</h3>
    <div id="assignModalContent"></div>
  </div>
</div>

<div id="lockerDetailModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <span class="close-modal" onclick="closeLockerModal()">&times;</span>
    <h3><i class="fas fa-info-circle"></i> Vault details</h3>
    <div id="lockerDetailContent"></div>
  </div>
</div>

<div id="createLockerModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <span class="close-modal" onclick="closeCreateLockerModal()">&times;</span>
    <h3><i class="fas fa-plus-circle"></i> Create new locker</h3>
    <div class="input-group"><label>Locker number (unique)</label><input type="number" id="newLockerNumber" placeholder="e.g., 11"></div>
    <div class="input-group"><label>QR code (optional)</label><input type="text" id="newLockerQr" placeholder="auto‑generated if empty"></div>
    <button id="confirmCreateLockerBtn" class="btn-primary" style="background:#10b981;">Create locker</button>
    <button onclick="closeCreateLockerModal()" class="btn-primary" style="background:#6b7280; margin-top:8px;">Cancel</button>
  </div>
</div>

<div id="alertModal" class="modal-overlay" style="display:none;">
  <div class="modal-card" style="text-align:center;">
    <h3 id="alertTitle">Notice</h3>
    <p id="alertMessage" style="margin:20px 0;"></p>
    <button id="alertOkBtn" class="btn-primary" style="background:var(--red);">OK</button>
  </div>
</div>

<div id="toastMsg" class="toast-pos"></div>

<script type="module">
  import { supabase } from '../config/supabase.js';

  // ========== ORIGINAL BUSINESS LOGIC – PRESERVED ==========
  let lockers = [];
  let preRegistrations = [];

  function showToast(msg, isError = false) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = msg;
    toast.style.background = isError ? 'var(--red)' : 'var(--ink)';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function showAlert(title, message) {
    document.getElementById('alertTitle').innerText = title;
    document.getElementById('alertMessage').innerHTML = message;
    document.getElementById('alertModal').style.display = 'flex';
  }
  function closeAlert() { document.getElementById('alertModal').style.display = 'none'; }
  document.getElementById('alertOkBtn').addEventListener('click', closeAlert);

  function formatDuration(timestamp) {
    if (!timestamp) return '—';
    const now = new Date();
    const diff = now - new Date(timestamp);
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins} min${mins !== 1 ? 's' : ''} ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours} hour${hours !== 1 ? 's' : ''} ago`;
    const days = Math.floor(hours / 24);
    return `${days} day${days !== 1 ? 's' : ''} ago`;
  }

  // Load data
  async function loadLockers() {
    const { data, error } = await supabase.from('lockers').select('*').order('locker_number');
    if (error) { showAlert('DB Error', error.message); return []; }
    lockers = data || [];
    if (lockers.length === 0) await createDefaultLockers();
    return lockers;
  }

  async function createDefaultLockers() {
    const defaults = [];
    for (let i = 1; i <= 10; i++) defaults.push({
      locker_number: i, qr_code: `QL-${1000+i}`, status: 'available',
      customer_name: null, customer_phone: null, customer_pin_hash: null,
      total_value: 0, total_items: 0, occupied_at: null,
      created_at: new Date().toISOString(), updated_at: new Date().toISOString()
    });
    const { error } = await supabase.from('lockers').insert(defaults);
    if (error) console.error(error);
  }

  async function loadPreRegistrations() {
    const { data, error } = await supabase.from('pre_registrations').select('*').eq('status', 'pending').order('created_at');
    if (error) { console.error(error); return []; }
    preRegistrations = data || [];
    return preRegistrations;
  }

  async function refreshAll() {
    await loadLockers();
    await loadPreRegistrations();
    renderStats();
    renderPreRegistrations();
    renderLockers();
  }

  function renderStats() {
    const total = lockers.length;
    const available = lockers.filter(l => l.status === 'available').length;
    const occupied = lockers.filter(l => l.status === 'occupied').length;
    const totalValue = lockers.reduce((s, l) => s + (l.total_value || 0), 0);
    document.getElementById('statsContainer').innerHTML = `
      <div class="stat-chip"><div class="stat-value">${total}</div><div class="stat-label">Total lockers</div></div>
      <div class="stat-chip"><div class="stat-value" style="color:#10b981;">${available}</div><div class="stat-label">Available</div></div>
      <div class="stat-chip"><div class="stat-value" style="color:var(--red);">${occupied}</div><div class="stat-label">Occupied</div></div>
      <div class="stat-chip"><div class="stat-value">R${totalValue.toFixed(2)}</div><div class="stat-label">Total value</div></div>
    `;
  }

  function renderPreRegistrations() {
    const grid = document.getElementById('preRegGrid');
    if (!preRegistrations.length) { grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--mist);">No pending pre‑registrations</div>'; return; }
    grid.innerHTML = preRegistrations.map(reg => {
      let itemsSummary = '';
      if (reg.items && Array.isArray(reg.items)) itemsSummary = reg.items.map(i => `${i.name} x${i.quantity}`).join(', ');
      else itemsSummary = String(reg.items || '—');
      return `
        <div class="pre-card">
          <div class="card-title">📝 Pre-registration</div>
          <div><strong>👤 ${escapeHtml(reg.customer_name)}</strong></div>
          <div><i class="fab fa-whatsapp"></i> ${escapeHtml(reg.customer_phone)}</div>
          <div><i class="fas fa-key"></i> PIN: <span class="badge-status badge-pending">${escapeHtml(reg.pin_hash)}</span></div>
          <div><small>📦 ${escapeHtml(itemsSummary)}</small></div>
          <div><small>⏱️ ${formatDuration(reg.created_at)}</small></div>
          <button class="btn-primary" style="margin-top:12px; background:#f59e0b;" onclick="window.showAssignModal('${reg.id}')">Assign locker</button>
        </div>
      `;
    }).join('');
  }

  function renderLockers() {
    const grid = document.getElementById('lockerGrid');
    if (!lockers.length) { grid.innerHTML = '<div style="grid-column:1/-1; text-align:center;">No lockers</div>'; return; }
    grid.innerHTML = lockers.map(l => {
      if (l.status === 'available') {
        return `
          <div class="locker-card available">
            <div class="card-title">📭 Locker #${l.locker_number}</div>
            <div><span class="badge-status badge-available">Available</span></div>
            <div><code>${escapeHtml(l.qr_code)}</code></div>
          </div>
        `;
      } else {
        return `
          <div class="locker-card occupied">
            <div class="card-title">🔐 Locker #${l.locker_number}</div>
            <div><span class="badge-status badge-occupied">Occupied</span></div>
            <div><i class="fas fa-user"></i> ${escapeHtml(l.customer_name || '—')}</div>
            <div><i class="fab fa-whatsapp"></i> ${escapeHtml(l.customer_phone || '—')}</div>
            <div><span class="badge-status">💰 R${(l.total_value || 0).toFixed(2)}</span></div>
            <div><small>⏱️ ${formatDuration(l.occupied_at)}</small></div>
            <button class="btn-primary" style="margin-top:10px;" onclick="window.viewLockerDetails('${l.id}')">View vault</button>
          </div>
        `;
      }
    }).join('');
  }

  // Assign locker from pre-registration
  window.showAssignModal = async function(preRegId) {
    const reg = preRegistrations.find(r => r.id === preRegId);
    if (!reg) return;
    const availableLockers = lockers.filter(l => l.status === 'available');
    if (!availableLockers.length) { showAlert('No lockers', 'All lockers are occupied. Please release one first.'); return; }
    const modal = document.getElementById('assignModal');
    const content = document.getElementById('assignModalContent');
    let options = '';
    availableLockers.forEach(l => { options += `<option value="${l.id}">Locker #${l.locker_number} (${l.qr_code})</option>`; });
    content.innerHTML = `
      <p>Assign to <strong>${escapeHtml(reg.customer_name)}</strong> (${escapeHtml(reg.customer_phone)})</p>
      <select id="assignLockerSelect" style="width:100%; margin:10px 0;">${options}</select>
      <div style="background:var(--bone); padding:12px; border-radius:var(--radius-md); margin:12px 0;">
        <strong>Items:</strong> ${reg.items ? (Array.isArray(reg.items) ? reg.items.map(i => `${i.name} x${i.quantity}`).join(', ') : reg.items) : '—'}
      </div>
      <button id="doAssignBtn" class="btn-primary" style="background:#10b981;">Confirm assignment</button>
    `;
    modal.style.display = 'flex';
    document.getElementById('doAssignBtn').onclick = async () => {
      const lockerId = document.getElementById('assignLockerSelect').value;
      const locker = lockers.find(l => l.id === lockerId && l.status === 'available');
      if (!locker) { showAlert('Error', 'Locker no longer available'); closeAssignModal(); return; }
      const newQr = `QL-${Date.now()}-${Math.floor(Math.random()*900+100)}`;
      const { error: updateErr } = await supabase.from('lockers').update({
        status: 'occupied',
        customer_name: reg.customer_name,
        customer_phone: reg.customer_phone,
        customer_pin_hash: reg.pin_hash,
        total_value: reg.total_value,
        total_items: reg.items ? (Array.isArray(reg.items) ? reg.items.length : 1) : 0,
        occupied_at: new Date().toISOString(),
        qr_code: newQr,
        updated_at: new Date().toISOString()
      }).eq('id', locker.id);
      if (updateErr) { showAlert('DB Error', updateErr.message); return; }
      if (reg.items && Array.isArray(reg.items) && reg.items.length) {
        const items = reg.items.map(item => ({ locker_id: locker.id, product_id: item.product_id || null, product_name: item.name, price: item.price, quantity: item.quantity }));
        await supabase.from('locker_items').insert(items);
      }
      await supabase.from('pre_registrations').update({ status: 'assigned' }).eq('id', reg.id);
      await refreshAll();
      closeAssignModal();
      showAlert('Locker assigned', `Locker #${locker.locker_number} assigned to ${reg.customer_name}.`);
    };
  };
  window.closeAssignModal = () => document.getElementById('assignModal').style.display = 'none';

  // Unlock with WhatsApp + PIN
  document.getElementById('unlockBtn').addEventListener('click', async () => {
    const phone = document.getElementById('unlockPhone').value.trim();
    const pin = document.getElementById('unlockPin').value.trim();
    const resultDiv = document.getElementById('unlockResult');
    if (!phone || !pin) { showAlert('Missing', 'Enter both WhatsApp and PIN'); return; }
    if (pin.length !== 4 || !/^\d+$/.test(pin)) { showAlert('Invalid PIN', 'PIN must be 4 digits'); return; }
    const locker = lockers.find(l => l.status === 'occupied' && l.customer_phone === phone && l.customer_pin_hash === pin);
    if (!locker) {
      const phoneMatch = lockers.find(l => l.status === 'occupied' && l.customer_phone === phone);
      if (phoneMatch) resultDiv.innerHTML = `<div class="result-card result-error"><i class="fas fa-times-circle"></i> Incorrect PIN for ${phone}. Customer: ${phoneMatch.customer_name}</div>`;
      else resultDiv.innerHTML = `<div class="result-card result-error">No active locker found for ${phone} with that PIN.</div>`;
      return;
    }
    const { data: items } = await supabase.from('locker_items').select('*').eq('locker_id', locker.id);
    let itemsHtml = '<div class="item-list">';
    if (items?.length) items.forEach(i => { itemsHtml += `<div>• ${escapeHtml(i.product_name)} x${i.quantity} – R${i.price.toFixed(2)}</div>`; });
    else itemsHtml += '<div>No items recorded</div>';
    itemsHtml += '</div>';
    resultDiv.innerHTML = `
      <div class="result-card result-success">
        <strong><i class="fas fa-check-circle"></i> Customer verified!</strong> Locker #${locker.locker_number}<br>
        👤 ${escapeHtml(locker.customer_name)}<br>
        💰 Total value: R${(locker.total_value || 0).toFixed(2)}<br>
        📦 Items: ${itemsHtml}
        <button id="confirmUnlockBtn" class="btn-primary" style="background:#10b981; margin-top:12px;">Confirm & unlock locker</button>
      </div>
    `;
    document.getElementById('confirmUnlockBtn').onclick = async () => {
      await unlockAndReleaseLocker(locker.id);
      resultDiv.innerHTML = `<div class="result-card result-success">✅ Locker #${locker.locker_number} unlocked and released.</div>`;
      document.getElementById('unlockPhone').value = '';
      document.getElementById('unlockPin').value = '';
      await refreshAll();
    };
  });

  async function unlockAndReleaseLocker(lockerId) {
    const { error } = await supabase.from('lockers').update({
      status: 'available',
      customer_name: null, customer_phone: null, customer_pin_hash: null,
      total_value: 0, total_items: 0, occupied_at: null,
      updated_at: new Date().toISOString(),
      qr_code: `QL-${Date.now()}-${Math.floor(Math.random()*900+100)}`
    }).eq('id', lockerId);
    if (error) throw error;
    await supabase.from('locker_items').delete().eq('locker_id', lockerId);
    showToast('Locker released');
  }

  window.viewLockerDetails = async function(lockerId) {
    const locker = lockers.find(l => l.id === lockerId);
    if (!locker) return;
    const { data: items } = await supabase.from('locker_items').select('*').eq('locker_id', lockerId);
    const modal = document.getElementById('lockerDetailModal');
    const content = document.getElementById('lockerDetailContent');
    let itemsHtml = '';
    if (items?.length) items.forEach(i => { itemsHtml += `<div>• ${escapeHtml(i.product_name)} x${i.quantity} – R${i.price.toFixed(2)}</div>`; });
    else itemsHtml = '<div>No items</div>';
    content.innerHTML = `
      <p><strong>Locker #${locker.locker_number}</strong></p>
      <p><i class="fas fa-user"></i> ${escapeHtml(locker.customer_name || '—')}</p>
      <p><i class="fab fa-whatsapp"></i> ${escapeHtml(locker.customer_phone || '—')}</p>
      <p><i class="fas fa-key"></i> PIN: ${locker.customer_pin_hash ? '****' : '—'}</p>
      <p><strong>Value:</strong> R${(locker.total_value || 0).toFixed(2)}</p>
      <div class="item-list"><strong>Items:</strong><br>${itemsHtml}</div>
      <div class="two-factor-badge"><i class="fas fa-shield-alt"></i> Two‑factor protected (WhatsApp + PIN)</div>
    `;
    modal.style.display = 'flex';
  };
  window.closeLockerModal = () => document.getElementById('lockerDetailModal').style.display = 'none';

  // Create new locker
  document.getElementById('createLockerBtn').addEventListener('click', () => {
    document.getElementById('newLockerNumber').value = '';
    document.getElementById('newLockerQr').value = '';
    document.getElementById('createLockerModal').style.display = 'flex';
  });
  window.closeCreateLockerModal = () => document.getElementById('createLockerModal').style.display = 'none';
  document.getElementById('confirmCreateLockerBtn').addEventListener('click', async () => {
    let num = parseInt(document.getElementById('newLockerNumber').value);
    const customQr = document.getElementById('newLockerQr').value.trim();
    if (isNaN(num) || num <= 0) { showAlert('Invalid', 'Locker number must be positive'); return; }
    if (lockers.some(l => l.locker_number === num)) { showAlert('Duplicate', `Locker #${num} already exists`); return; }
    const qr = customQr || `QL-${Date.now()}-${Math.floor(Math.random()*9000+1000)}`;
    const { error } = await supabase.from('lockers').insert({
      locker_number: num, qr_code: qr, status: 'available',
      customer_name: null, customer_phone: null, customer_pin_hash: null,
      total_value: 0, total_items: 0, occupied_at: null,
      created_at: new Date().toISOString(), updated_at: new Date().toISOString()
    });
    if (error) showAlert('Error', error.message);
    else { await refreshAll(); closeCreateLockerModal(); showToast(`Locker #${num} created`); }
  });

  // Pending unlock from localStorage (customer portal compatibility)
  let pendingInterval;
  function checkPendingUnlocks() {
    const pending = JSON.parse(localStorage.getItem('rands_pending_unlocks') || '[]');
    if (pending.length) {
      const req = pending[0];
      showAlert('Pending unlock request', `Customer ${req.customer} (${req.phone}) requested unlock for locker #${req.lockerId}. Please verify at the counter.`);
      localStorage.setItem('rands_pending_unlocks', JSON.stringify(pending.slice(1)));
    }
  }
  pendingInterval = setInterval(checkPendingUnlocks, 5000);
  window.addEventListener('beforeunload', () => clearInterval(pendingInterval));

  // Refresh buttons
  document.getElementById('refreshGlobalBtn').addEventListener('click', async () => { await refreshAll(); showToast('Data refreshed'); });
  document.getElementById('refreshPreRegBtn').addEventListener('click', async () => { await loadPreRegistrations(); renderPreRegistrations(); showToast('Pre-registrations updated'); });

  function escapeHtml(s) { if(!s) return ''; return String(s).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

  // Expose globals
  window.showAssignModal = window.showAssignModal;
  window.closeAssignModal = window.closeAssignModal;
  window.viewLockerDetails = window.viewLockerDetails;
  window.closeLockerModal = window.closeLockerModal;
  window.closeCreateLockerModal = window.closeCreateLockerModal;

  // Init
  await refreshAll();
  setInterval(() => refreshAll(), 8000);
</script>
</body>
</html>
