<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shisha Console · Rands Staff</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0D0F12;
      padding: 20px;
      color: #F0F2F8;
    }
    .shisha-dashboard {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #141720;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 8px 20px -6px rgba(0,0,0,0.4);
    }
    .card-header {
      padding: 18px 22px;
      background: #1C2030;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #F0F2F8;
    }
    .card-header i { color: #E30613; margin-right: 8px; }
    .card-body { padding: 20px; }
    .badge-red {
      background: #E30613;
      color: white;
      padding: 4px 12px;
      border-radius: 60px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .stats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
    }
    .stat-item {
      background: #1C2030;
      border-radius: 20px;
      padding: 10px 8px;
      text-align: center;
      flex: 1;
      min-width: 65px;
    }
    .stat-number {
      font-size: 1.4rem;
      font-weight: 800;
      color: #E30613;
    }
    .stat-label {
      font-size: 0.65rem;
      color: #8B92A8;
      margin-top: 4px;
    }
    .requests-container {
      max-height: 320px;
      overflow-y: auto;
      margin-top: 12px;
    }
    .request-item {
      background: #1C2030;
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .request-info { font-size: 0.8rem; color: #F0F2F8; }
    .btn-approve {
      background: #22C55E;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reject {
      background: #E30613;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 60px;
      font-weight: 600;
      cursor: pointer;
    }
    .pipes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      margin-top: 8px;
    }
    .pipe-card {
      background: #1C2030;
      border-radius: 20px;
      padding: 14px;
      border-left: 4px solid;
      transition: all 0.2s;
    }
    .pipe-card.available { border-left-color: #22C55E; }
    .pipe-card.inuse { border-left-color: #E30613; }
    .pipe-card.refill { border-left-color: #F59E0B; background: #2A1F10; }
    .pipe-card.expired { border-left-color: #64748B; background: #1A1C22; }
    .pipe-card.paused { border-left-color: #F97316; background: #251A0E; }
    .pipe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .pipe-code { font-weight: 800; font-size: 1rem; color: #F0F2F8; }
    .pipe-status {
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 60px;
      font-weight: 600;
    }
    .pipe-status.available { background: rgba(34,197,94,0.15); color: #22C55E; }
    .pipe-status.inuse { background: rgba(227,6,19,0.15); color: #E30613; }
    .pipe-status.refill { background: rgba(245,158,11,0.15); color: #F59E0B; }
    .pipe-status.expired { background: rgba(100,116,139,0.2); color: #94A3B8; }
    .pipe-status.paused { background: rgba(249,115,22,0.15); color: #F97316; }
    .timer {
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: 800;
      margin: 8px 0;
      color: #F0F2F8;
    }
    .timer.expired { color: #E30613; }
    .timer.refill { color: #F59E0B; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .pipe-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .pipe-actions button {
      padding: 6px 12px;
      border-radius: 60px;
      border: none;
      font-weight: 600;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .btn-assign { background: #E30613; color: white; }
    .btn-refill { background: #F59E0B; color: white; }
    .btn-pause { background: #F97316; color: white; }
    .btn-resume { background: #22C55E; color: white; }
    .btn-end { background: #64748B; color: white; }

    /* Modal dark */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-container {
      background: #141720;
      border-radius: 28px;
      max-width: 400px;
      width: 90%;
      padding: 28px 24px;
      text-align: center;
      border: 2px solid #E30613;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
      transform: scale(0.95);
      transition: transform 0.2s;
    }
    .modal-overlay.active .modal-container { transform: scale(1); }
    .modal-icon { font-size: 3rem; margin-bottom: 16px; }
    .modal-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 12px; color: #F0F2F8; }
    .modal-message { color: #8B92A8; margin-bottom: 24px; line-height: 1.5; }
    .modal-buttons { display: flex; gap: 12px; justify-content: center; }
    .modal-btn {
      padding: 10px 24px;
      border-radius: 60px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-btn.confirm { background: #E30613; color: white; }
    .modal-btn.cancel { background: #1C2030; color: #8B92A8; border: 1px solid rgba(255,255,255,0.1); }

    .toast-pos {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1C2030;
      border-left: 3px solid #E30613;
      color: white;
      padding: 10px 20px;
      border-radius: 60px;
      font-weight: 500;
      z-index: 10002;
      transition: transform 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }
    .toast-pos.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    @media (max-width: 900px) {
      .shisha-dashboard { grid-template-columns: 1fr; gap: 16px; }
      body { padding: 16px; }
    }
    select, input {
      background: #0D0F12;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 60px;
      padding: 10px;
      color: #F0F2F8;
      font-family: inherit;
    }
  </style>
</head>
<body>
<div class="shisha-dashboard">
  <div>
    <div class="card" style="margin-bottom: 20px;">
      <div class="card-header">
        <span><i class="fas fa-concierge-bell"></i> Service requests</span>
        <span id="requestBadge" class="badge-red">0</span>
      </div>
      <div class="card-body">
        <div class="requests-container" id="requestsList"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span><i class="fas fa-chart-simple"></i> Live status</span></div>
      <div class="card-body"><div class="stats-grid" id="statsContainer"></div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><span><i class="fas fa-smoking"></i> Hookah stations · R250 session</span></div>
    <div class="card-body"><div id="pipesGrid" class="pipes-grid"></div></div>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal-container">
    <div id="modalIcon" class="modal-icon"></div>
    <div id="modalTitle" class="modal-title"></div>
    <div id="modalMessage" class="modal-message"></div>
    <div id="modalButtons" class="modal-buttons"></div>
  </div>
</div>
<div id="toastMsg" class="toast-pos"></div>

<script type="module">
  import { supabase } from '../config/supabase.js';

  const SESSION_PRICE = 250, REFILL_PRICE = 250, COAL_DURATION = 60, REFILL_THRESHOLD = 15;
  let activeSessions = [], allDevices = [], countdownInterval = null, realtimeSub = null;

  // Modal & Toast
  function showModal(type, title, message, onConfirm = null, onCancel = null) {
    const overlay = document.getElementById('modalOverlay');
    const iconMap = { success:'✅', error:'❌', warning:'⚠️', confirm:'❓' };
    document.getElementById('modalIcon').innerHTML = iconMap[type] || '⚠️';
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerHTML = message;
    const btns = document.getElementById('modalButtons');
    btns.innerHTML = '';
    if (type === 'confirm' && onConfirm) {
      const c = document.createElement('button'); c.className = 'modal-btn confirm'; c.innerText = 'Confirm';
      c.onclick = () => { closeModal(); onConfirm(); };
      const d = document.createElement('button'); d.className = 'modal-btn cancel'; d.innerText = 'Cancel';
      d.onclick = () => { closeModal(); if(onCancel) onCancel(); };
      btns.append(c, d);
    } else {
      const ok = document.createElement('button'); ok.className = 'modal-btn confirm'; ok.innerText = 'OK';
      ok.onclick = closeModal;
      btns.append(ok);
    }
    overlay.classList.add('active');
  }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
  function showToast(msg, isErr = false) {
    const t = document.getElementById('toastMsg');
    t.innerText = msg;
    t.style.background = isErr ? '#b91c1c' : '#1C2030';
    t.style.borderLeftColor = isErr ? '#E30613' : '#22C55E';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Helpers
  function remainingSec(session) {
    if (!session) return 0;
    if (session.paused) return session.remaining_time_seconds || 0;
    const ref = session.last_refill_time ? new Date(session.last_refill_time) : new Date(session.start_time);
    const elapsed = (new Date() - ref) / 1000;
    let rem = COAL_DURATION * 60 - elapsed;
    return rem > 0 ? rem : 0;
  }
  function formatTime(sec) {
    if (sec <= 0) return "EXPIRED";
    let m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }
  function sessionStatus(s) {
    if (s.paused) return 'paused';
    if (s.status === 'expired') return 'expired';
    let rem = remainingSec(s);
    if (rem <= 0) return 'expired';
    if (rem <= REFILL_THRESHOLD * 60) return 'refill';
    return 'active';
  }
  async function isHookahFree(deviceId) {
    const { data } = await supabase.from('shisha_sessions').select('id').eq('device_id', deviceId).in('status', ['active','refill','paused']).maybeSingle();
    return !data;
  }

  // Data loading
  async function loadDevices() {
    const { data } = await supabase.from('hookah_devices').select('*').order('device_code');
    allDevices = data || [];
  }
  async function loadSessions() {
    const { data } = await supabase.from('shisha_sessions').select(`
      id, device_id, product_id, location_id, start_time, last_refill_time,
      remaining_time_seconds, total_amount, refill_count, status, paused,
      payment_method, customer_phone,
      hookah_devices(device_code), shisha_products(name), shisha_locations(name)
    `).in('status', ['active','refill','paused']);
    if (data) {
      activeSessions = data.map(s => ({
        id: s.id, deviceId: s.device_id, device_code: s.hookah_devices?.device_code,
        flavour_name: s.shisha_products?.name, location_name: s.shisha_locations?.name,
        start_time: s.start_time, last_refill_time: s.last_refill_time,
        remaining_time_seconds: s.remaining_time_seconds, total_amount: s.total_amount,
        refill_count: s.refill_count || 0, paused: s.paused,
        status: sessionStatus({ paused: s.paused, status: s.status, last_refill_time: s.last_refill_time, start_time: s.start_time, remaining_time_seconds: s.remaining_time_seconds })
      }));
    }
    renderPipes(); updateStats();
  }
  async function loadRequests() {
    const { data } = await supabase.from('shisha_requests').select('*').eq('status', 'pending').order('created_at', { ascending: false });
    const pending = data || [];
    document.getElementById('requestBadge').innerText = pending.length;
    const container = document.getElementById('requestsList');
    if (!pending.length) { container.innerHTML = '<div style="text-align:center; padding:24px; color:#8B92A8;">✅ No pending requests</div>'; return; }
    container.innerHTML = pending.map(r => `
      <div class="request-item" data-id="${r.id}">
        <div class="request-info"><strong>${r.request_type.replace(/_/g,' ').toUpperCase()}</strong><br><small>📍 ${r.location_name || 'Lounge'} | 🍃 ${r.flavour_name || '-'}</small><br><small>👤 ${r.customer_phone || 'Guest'} | ${r.device_code || 'New'}</small></div>
        <div class="request-buttons"><button class="btn-approve" data-id="${r.id}">Approve</button><button class="btn-reject" data-id="${r.id}">Reject</button></div>
      </div>
    `).join('');
    document.querySelectorAll('.btn-approve').forEach(btn => btn.addEventListener('click', () => approveRequest(btn.dataset.id)));
    document.querySelectorAll('.btn-reject').forEach(btn => btn.addEventListener('click', () => rejectRequest(btn.dataset.id)));
  }

  async function approveRequest(id) {
    const { data: req } = await supabase.from('shisha_requests').select('*').eq('id', id).single();
    if (!req) return showModal('error', 'Error', 'Request not found');
    try {
      if (req.request_type === 'coal_refill') await handleRefill(req);
      else if (req.request_type === 'new_order') await handleNewOrder(req);
      else throw new Error('Unknown request type');
      await supabase.from('shisha_requests').update({ status: 'approved', responded_at: new Date().toISOString() }).eq('id', id);
      showToast('Request approved');
      await Promise.all([loadSessions(), loadRequests(), loadDevices()]);
    } catch (err) { showModal('error', 'Error', err.message); }
  }
  async function handleRefill(req) {
    let session = activeSessions.find(s => s.id === req.session_id);
    if (!session) throw new Error('Session not found');
    if (session.paused) throw new Error('Session paused');
    const { data: cur } = await supabase.from('shisha_sessions').select('paused,status').eq('id', session.id).single();
    if (cur?.paused || cur?.status === 'expired') throw new Error('Session no longer active');
    const newTotal = session.total_amount + REFILL_PRICE;
    const newCount = (session.refill_count || 0) + 1;
    const { error } = await supabase.from('shisha_sessions').update({
      last_refill_time: new Date().toISOString(),
      remaining_time_seconds: COAL_DURATION * 60,
      status: 'active',
      total_amount: newTotal,
      refill_count: newCount
    }).eq('id', session.id);
    if (error) throw new Error('Refill failed: ' + error.message);
    showToast(`Refilled ${session.device_code}`);
  }
  async function handleNewOrder(req) {
    const { data: free } = await supabase.from('hookah_devices').select('id,device_code').eq('status', 'available').limit(1);
    if (!free?.length) throw new Error('No available hookah');
    const avail = await isHookahFree(free[0].id);
    if (!avail) throw new Error('Hookah just taken');
    const { data: prod } = await supabase.from('shisha_products').select('id').eq('name', req.flavour_name).limit(1);
    const { data: loc } = await supabase.from('shisha_locations').select('id').eq('name', req.location_name).limit(1);
    if (!prod?.length || !loc?.length) throw new Error('Invalid flavour/location');
    const { error } = await supabase.from('shisha_sessions').insert({
      device_id: free[0].id,
      product_id: prod[0].id,
      location_id: loc[0].id,
      start_time: new Date().toISOString(),
      last_refill_time: new Date().toISOString(),
      remaining_time_seconds: COAL_DURATION * 60,
      total_amount: SESSION_PRICE,
      refill_count: 0,
      status: 'active',
      customer_phone: req.customer_phone || 'walkin_customer',
      payment_method: 'cash'
    });
    if (error) throw new Error('Session creation failed');
    showToast(`Started on ${free[0].device_code}`);
  }
  async function rejectRequest(id) {
    await supabase.from('shisha_requests').update({ status: 'rejected', responded_at: new Date().toISOString() }).eq('id', id);
    showToast('Request rejected');
    await loadRequests();
  }

  function renderPipes() {
    if (!allDevices.length) return;
    const container = document.getElementById('pipesGrid');
    container.innerHTML = allDevices.map(dev => {
      const sess = activeSessions.find(s => s.deviceId === dev.id);
      let statusClass = "available", statusText = "Free", flavour = "-", loc = "-", timerVal = "00:00", timerClass = "";
      if (sess) {
        flavour = sess.flavour_name || "-"; loc = sess.location_name || "-";
        const rem = remainingSec(sess);
        const stat = sessionStatus(sess);
        timerVal = rem <= 0 ? "EXPIRED" : formatTime(rem);
        timerClass = (stat === 'refill' ? 'refill' : (rem <= 0 ? 'expired' : ''));
        if (sess.paused) { statusClass = "paused"; statusText = "Paused"; }
        else if (stat === 'expired') { statusClass = "expired"; statusText = "Expired"; }
        else if (stat === 'refill') { statusClass = "refill"; statusText = "Refill soon"; }
        else { statusClass = "inuse"; statusText = "In use"; }
      }
      return `<div class="pipe-card ${statusClass}" data-device-id="${dev.id}">
        <div class="pipe-header"><span class="pipe-code">${dev.device_code}</span><span class="pipe-status ${statusClass}">${statusText}</span></div>
        <div><small>📍 ${loc} | 🍃 ${flavour}</small></div>
        <div class="timer ${timerClass}">⏱️ <span class="timer-value" data-session-id="${sess ? sess.id : ''}">${timerVal}</span></div>
        <div class="pipe-actions">
          ${!sess ? `<button class="btn-assign" data-device-id="${dev.id}" data-device-code="${dev.device_code}">Assign (R250)</button>` :
            `<button class="btn-refill" data-session-id="${sess.id}">Refill (R250)</button>
             <button class="btn-pause" data-session-id="${sess.id}">Pause</button>
             ${sess.paused ? `<button class="btn-resume" data-session-id="${sess.id}">Resume</button>` : ''}
             <button class="btn-end" data-session-id="${sess.id}">End</button>`}
        </div>
      </div>`;
    }).join('');
    document.querySelectorAll('.btn-assign').forEach(btn => btn.addEventListener('click', () => openAssignModal(btn.dataset.deviceId, btn.dataset.deviceCode)));
    document.querySelectorAll('.btn-refill').forEach(btn => btn.addEventListener('click', () => openRefillModal(btn.dataset.sessionId)));
    document.querySelectorAll('.btn-pause').forEach(btn => btn.addEventListener('click', () => openPauseModal(btn.dataset.sessionId)));
    document.querySelectorAll('.btn-resume').forEach(btn => btn.addEventListener('click', () => resumeSession(btn.dataset.sessionId)));
    document.querySelectorAll('.btn-end').forEach(btn => btn.addEventListener('click', () => endSession(btn.dataset.sessionId)));
  }
  function updateStats() {
    let avail=0, inuse=0, refill=0, expired=0, paused=0;
    for(let dev of allDevices) {
      let s = activeSessions.find(s => s.deviceId === dev.id);
      if(!s) avail++;
      else if(s.paused) paused++;
      else {
        let st = sessionStatus(s);
        if(st === 'expired') expired++;
        else if(st === 'refill') refill++;
        else inuse++;
      }
    }
    document.getElementById('statsContainer').innerHTML = `
      <div class="stat-item"><div class="stat-number">${avail}</div><div class="stat-label">Free</div></div>
      <div class="stat-item"><div class="stat-number">${inuse}</div><div class="stat-label">In use</div></div>
      <div class="stat-item"><div class="stat-number">${refill}</div><div class="stat-label">Refill soon</div></div>
      <div class="stat-item"><div class="stat-number">${expired}</div><div class="stat-label">Expired</div></div>
      <div class="stat-item"><div class="stat-number">${paused}</div><div class="stat-label">Paused</div></div>
    `;
  }
  function updateAllTimers() {
    document.querySelectorAll('.timer-value').forEach(el => {
      let sid = el.dataset.sessionId;
      if(!sid) return;
      let s = activeSessions.find(s => s.id === sid);
      if(!s) return;
      let rem = remainingSec(s), st = sessionStatus(s);
      if(rem <= 0 || st === 'expired') { el.innerText = "EXPIRED"; el.classList.add('expired'); el.classList.remove('refill'); }
      else if(st === 'refill') { el.innerText = formatTime(rem); el.classList.add('refill'); el.classList.remove('expired'); }
      else { el.innerText = formatTime(rem); el.classList.remove('expired','refill'); }
    });
  }
  function startTimer() { if(countdownInterval) clearInterval(countdownInterval); countdownInterval = setInterval(updateAllTimers, 1000); }

  // Actions
  async function openAssignModal(deviceId, deviceCode) {
    if(!(await isHookahFree(deviceId))) { showModal('error', 'Not Available', 'This hookah is no longer free'); await loadSessions(); return; }
    const { data: locs } = await supabase.from('shisha_locations').select('name').eq('is_active', true);
    const { data: flavours } = await supabase.from('shisha_products').select('name').eq('is_available', true);
    const html = `<div style="text-align:left"><label>Location</label><select id="assignLoc" style="width:100%;margin-bottom:12px;">${(locs||[]).map(l=>`<option>${l.name}</option>`).join('')}</select><label>Flavour</label><select id="assignFlav">${(flavours||[]).map(f=>`<option>${f.name}</option>`).join('')}</select></div>`;
    showModal('confirm', `Assign ${deviceCode}`, html, async () => {
      const loc = document.getElementById('assignLoc')?.value, flav = document.getElementById('assignFlav')?.value;
      if(!(await isHookahFree(deviceId))) { showModal('error', 'Not Available', 'Hookah taken'); return; }
      const { data: prod } = await supabase.from('shisha_products').select('id').eq('name', flav).limit(1);
      const { data: locObj } = await supabase.from('shisha_locations').select('id').eq('name', loc).limit(1);
      if(!prod?.length || !locObj?.length) { showModal('error', 'Error', 'Invalid selection'); return; }
      const { error } = await supabase.from('shisha_sessions').insert({
        device_id: deviceId, product_id: prod[0].id, location_id: locObj[0].id,
        start_time: new Date().toISOString(), last_refill_time: new Date().toISOString(),
        remaining_time_seconds: COAL_DURATION*60, total_amount: SESSION_PRICE,
        refill_count: 0, status: 'active', customer_phone: 'walkin_customer', payment_method: 'cash'
      });
      if(error) showModal('error', 'Error', error.message);
      else { showToast(`Started ${deviceCode}`); await loadSessions(); await loadDevices(); }
    });
  }
  async function openRefillModal(sessionId) {
    let s = activeSessions.find(s => s.id === sessionId);
    if(!s) return;
    if(s.paused) return showModal('warning', 'Cannot Refill', 'Resume before refilling');
    showModal('confirm', 'Confirm Refill', `Refill ${s.device_code} for R${REFILL_PRICE}? Total becomes R${s.total_amount + REFILL_PRICE}`, async () => {
      const { data: cur } = await supabase.from('shisha_sessions').select('paused,status').eq('id', sessionId).single();
      if(cur?.paused || cur?.status === 'expired') { showModal('error', 'Error', 'Session no longer active'); await loadSessions(); return; }
      const newTotal = s.total_amount + REFILL_PRICE, newCount = (s.refill_count||0)+1;
      const { error } = await supabase.from('shisha_sessions').update({
        last_refill_time: new Date().toISOString(), remaining_time_seconds: COAL_DURATION*60,
        status: 'active', total_amount: newTotal, refill_count: newCount
      }).eq('id', sessionId);
      if(error) showModal('error', 'Error', error.message);
      else { showToast(`Refilled ${s.device_code}`); await loadSessions(); }
    });
  }
  async function openPauseModal(sessionId) {
    let s = activeSessions.find(s => s.id === sessionId);
    if(!s || s.paused) return showModal('warning', 'Cannot Pause', 'Session not active or already paused');
    showModal('confirm', 'Pause Session', `Pause ${s.device_code}?`, async () => {
      let rem = remainingSec(s);
      const { error } = await supabase.from('shisha_sessions').update({ paused: true, status: 'paused', remaining_time_seconds: Math.max(0,rem) }).eq('id', sessionId);
      if(error) showModal('error', 'Error', error.message);
      else { showToast(`Paused ${s.device_code}`); await loadSessions(); }
    });
  }
  async function resumeSession(sessionId) {
    let s = activeSessions.find(s => s.id === sessionId);
    if(!s?.paused) return showModal('warning', 'Cannot Resume', 'Session not paused');
    let rem = s.remaining_time_seconds || 0;
    let newStat = rem <= 0 ? 'expired' : (rem <= REFILL_THRESHOLD*60 ? 'refill' : 'active');
    const { error } = await supabase.from('shisha_sessions').update({ paused: false, status: newStat }).eq('id', sessionId);
    if(error) showModal('error', 'Error', error.message);
    else { showToast(`Resumed ${s.device_code}`); await loadSessions(); }
  }
  async function endSession(sessionId) {
    let s = activeSessions.find(s => s.id === sessionId);
    if(!s) return;
    showModal('confirm', 'End Session', `End ${s.device_code}? Total due: R${s.total_amount}`, async () => {
      const { error } = await supabase.from('shisha_sessions').update({ status: 'expired', ended_at: new Date().toISOString() }).eq('id', sessionId);
      if(error) showModal('error', 'Error', error.message);
      else { showToast(`Ended ${s.device_code}`); await loadSessions(); await loadDevices(); }
    });
  }

  function setupRealtime() {
    if(realtimeSub) realtimeSub.unsubscribe();
    realtimeSub = supabase.channel('shisha-console').on('postgres_changes', { event:'*', schema:'public', table:'shisha_sessions' }, () => { loadSessions(); loadDevices(); }).on('postgres_changes', { event:'*', schema:'public', table:'shisha_requests' }, () => loadRequests()).subscribe();
  }

  async function init() {
    await loadDevices(); await loadSessions(); await loadRequests();
    startTimer(); setupRealtime();
    setInterval(async () => { await loadSessions(); await loadRequests(); await loadDevices(); }, 8000);
  }
  init();
</script>
</body>
