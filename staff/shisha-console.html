<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shisha Premium · Staff Console</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ========== EMBEDDED MODULE BASE ========== */
    :root {
      --red: #E30613;
      --red-dark: #a0010e;
      --red-deep: #8A0009;
      --red-glow: rgba(227,6,19,0.18);
      --red-subtle: rgba(227,6,19,0.06);
      --ink: #1e293b;
      --ink-muted: #334155;
      --slate: #475569;
      --mist: #94a3b8;
      --bone: #f8fafd;
      --white: #ffffff;
      --card-bg: #ffffff;
      --border: rgba(0,0,0,0.07);
      --border-strong: #eef2f8;
      --shadow-soft: 0 8px 20px -6px rgba(0,0,0,0.12);
      --shadow-card: 0 4px 24px rgba(0,0,0,0.08);
      --shadow-float: 0 16px 48px rgba(0,0,0,0.14);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-xl: 32px;
      --radius-full: 9999px;
      --transition: all 0.22s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--bone);
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100%;
      padding: 24px;
    }

    .shisha-dashboard {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-soft);
      transition: var(--transition);
      margin-bottom: 0;
    }

    .card-header {
      padding: 20px 24px;
      background: var(--white);
      border-bottom: 2px solid var(--border-strong);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink);
    }

    .card-header i {
      color: var(--red);
      margin-right: 8px;
    }

    .card-body {
      padding: 20px 24px;
    }

    .badge-red {
      background: var(--red);
      color: white;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .stats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
    }

    .stat-item {
      background: var(--bone);
      border-radius: var(--radius-lg);
      padding: 12px 8px;
      text-align: center;
      flex: 1;
      min-width: 70px;
    }
    .stat-number {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--red);
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--slate);
      margin-top: 4px;
    }

    .requests-container {
      max-height: 320px;
      overflow-y: auto;
      margin-top: 12px;
    }
    .request-item {
      background: var(--bone);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .request-info { font-size: 0.85rem; color: var(--ink); }
    .request-buttons { display: flex; gap: 8px; }
    .btn-approve {
      background: #10b981;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reject {
      background: var(--red);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-weight: 600;
      cursor: pointer;
    }

    .pipes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .pipe-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 16px;
      border-left: 4px solid;
      transition: var(--transition);
      box-shadow: var(--shadow-soft);
    }
    .pipe-card.available { border-left-color: #10b981; }
    .pipe-card.inuse { border-left-color: var(--red); }
    .pipe-card.refill { border-left-color: #f59e0b; background: #fffbeb; }
    .pipe-card.expired { border-left-color: #6b7280; background: #f3f4f6; }
    .pipe-card.paused { border-left-color: #ff9800; background: #fff8e1; }

    .pipe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .pipe-code { font-weight: 800; color: var(--ink); }
    .pipe-status {
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-weight: 600;
    }
    .pipe-status.available { background: #e8f5e9; color: #2e7d32; }
    .pipe-status.inuse { background: #ffebee; color: var(--red); }
    .pipe-status.refill { background: #fff3e0; color: #ef6c00; }
    .pipe-status.expired { background: #e5e7eb; color: #4b5563; }
    .pipe-status.paused { background: #fff8e1; color: #ff8f00; }

    .timer {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 700;
      margin: 8px 0;
      color: var(--ink);
    }
    .pipe-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .pipe-actions button {
      padding: 8px 12px;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-assign { background: var(--red); color: white; }
    .btn-refill { background: #f59e0b; color: white; }
    .btn-pause { background: #ff9800; color: white; }
    .btn-resume { background: #10b981; color: white; }
    .btn-end { background: #6b7280; color: white; }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .modal-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      max-width: 450px;
      width: 90%;
      padding: 28px;
      border: 2px solid var(--red);
      box-shadow: var(--shadow-float);
    }
    .modal-card h3 { color: var(--red); margin-bottom: 16px; }
    .modal-card select, .modal-card input {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-strong);
      margin-bottom: 12px;
      font-family: inherit;
    }
    .btn-confirm {
      background: var(--red);
      color: white;
      border: none;
      padding: 12px;
      border-radius: var(--radius-full);
      font-weight: 700;
      width: 100%;
      cursor: pointer;
    }
    .btn-cancel {
      background: var(--bone);
      color: var(--ink);
      border: 1px solid var(--border-strong);
      margin-top: 8px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .toast-pos {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: white;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-weight: 500;
      z-index: 10002;
      transition: transform 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }
    .toast-pos.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      .shisha-dashboard { grid-template-columns: 1fr; gap: 20px; }
      body { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="shisha-dashboard">
  <!-- LEFT COLUMN: Requests + Stats -->
  <div>
    <div class="card" style="margin-bottom: 24px;">
      <div class="card-header">
        <span><i class="fas fa-concierge-bell"></i> Service requests</span>
        <span id="requestBadge" class="badge-red">0</span>
      </div>
      <div class="card-body">
        <div class="requests-container" id="requestsList"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <span><i class="fas fa-chart-simple"></i> Live status</span>
      </div>
      <div class="card-body">
        <div class="stats-grid" id="statsContainer"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN: Hookah stations -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-smoking"></i> Hookah stations · R250 session</span>
    </div>
    <div class="card-body">
      <div id="pipesGrid" class="pipes-grid"></div>
    </div>
  </div>
</div>

<!-- Modals -->
<div id="genericModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3 id="modalTitle">Notice</h3>
    <p id="modalMessage" style="margin: 20px 0;"></p>
    <button id="modalOkBtn" class="btn-confirm" style="background:var(--red);">OK</button>
  </div>
</div>

<div id="assignModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3>📝 Assign new session (R250)</h3>
    <select id="assignLocation"></select>
    <select id="assignFlavour"></select>
    <button id="confirmAssignBtn" class="btn-confirm">Confirm & start</button>
    <button id="cancelAssignBtn" class="btn-confirm btn-cancel">Cancel</button>
  </div>
</div>

<div id="refillModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3>🔄 Refill session (R250)</h3>
    <p id="refillInfo" style="margin: 12px 0;"></p>
    <button id="confirmRefillBtn" class="btn-confirm">Refill R250</button>
    <button id="cancelRefillBtn" class="btn-confirm btn-cancel">Cancel</button>
  </div>
</div>

<div id="pauseModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3>⏸️ Pause session</h3>
    <input type="text" id="pauseReason" placeholder="Reason (optional)">
    <button id="confirmPauseBtn" class="btn-confirm">Pause</button>
    <button id="cancelPauseBtn" class="btn-confirm btn-cancel">Cancel</button>
  </div>
</div>

<div id="toastMsg" class="toast-pos"></div>

<script type="module">
  import { supabase } from '../../config/supabase.js';

  // ============ CONSTANTS ==========
  const SESSION_PRICE = 250;
  const REFILL_PRICE = 250;
  const COAL_DURATION = 60; // minutes
  const REFILL_THRESHOLD = 15; // minutes
  const DURATION_SECONDS = COAL_DURATION * 60;

  let activeSessions = [];
  let allDevices = [];
  let selectedPipeForAction = null;
  let selectedDeviceForAssign = null;
  let countdownInterval = null;
  let realtimeSubscription = null;

  // ============ HELPER FUNCTIONS ==========
  function showToast(message, isError = false) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = message;
    toast.style.background = isError ? 'var(--red)' : 'var(--ink)';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function showAlertModal(message, title = "Notification") {
    const modal = document.getElementById('genericModal');
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    modal.style.display = 'flex';
    document.getElementById('modalOkBtn').onclick = () => { modal.style.display = 'none'; };
  }

  function closeModals() {
    document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    selectedPipeForAction = null;
    selectedDeviceForAssign = null;
  }

  // Check if hookah already has an active session
  async function isHookahAvailable(deviceId) {
    const { data, error } = await supabase
      .from('shisha_sessions')
      .select('id')
      .eq('device_id', deviceId)
      .in('status', ['active', 'refill', 'paused'])
      .maybeSingle();
    
    if (error) {
      console.error('Error checking hookah availability:', error);
      return false;
    }
    return !data;
  }

  // Calculate remaining seconds for a session
  function calculateRemainingSeconds(session) {
    if (!session) return 0;
    
    // For paused or expired, use stored remaining time
    if (session.paused || session.status === 'expired') {
      return session.remaining_time_seconds || 0;
    }
    
    // For active sessions, calculate based on last refill time
    const referenceTime = session.last_refill_time ? new Date(session.last_refill_time) : new Date(session.start_time);
    const now = new Date();
    const elapsedSeconds = Math.floor((now - referenceTime) / 1000);
    let remaining = DURATION_SECONDS - elapsedSeconds;
    
    // Update database if remaining time has changed significantly (every minute)
    if (Math.abs(remaining - (session.remaining_time_seconds || 0)) >= 60) {
      supabase
        .from('shisha_sessions')
        .update({ remaining_time_seconds: Math.max(0, remaining) })
        .eq('id', session.id)
        .then(({ error }) => {
          if (error) console.error('Error updating remaining time:', error);
        });
    }
    
    return remaining > 0 ? remaining : 0;
  }

  function formatTime(seconds) {
    if (seconds <= 0) return "EXPIRED";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  // Determine session status based on remaining time
  function determineSessionStatus(session) {
    if (session.paused) return 'paused';
    if (session.status === 'expired') return 'expired';
    
    const remainingSec = calculateRemainingSeconds(session);
    if (remainingSec <= 0) return 'expired';
    if (remainingSec <= REFILL_THRESHOLD * 60) return 'refill';
    return 'active';
  }

  // ============ DATA LOADING ==========
  async function loadDevices() {
    const { data, error } = await supabase
      .from('hookah_devices')
      .select('*')
      .order('device_code');
    
    if (error) {
      console.error('Error loading devices:', error);
      return [];
    }
    
    allDevices = data;
    return data;
  }

  async function loadSessions() {
    const { data, error } = await supabase
      .from('shisha_sessions')
      .select(`
        id, 
        device_id, 
        product_id, 
        location_id,
        start_time, 
        last_refill_time, 
        remaining_time_seconds,
        total_amount, 
        refill_count, 
        status, 
        paused,
        payment_method,
        account_id,
        hookah_devices (device_code),
        shisha_products (name),
        shisha_locations (name)
      `)
      .in('status', ['active', 'refill', 'paused', 'expired']);
    
    if (error) {
      console.error('Error loading sessions:', error);
      return;
    }
    
    // Process sessions with proper status determination
    activeSessions = data.map(s => {
      const sessionData = {
        id: s.id,
        deviceId: s.device_id,
        shishaId: s.hookah_devices?.device_code,
        location: s.shisha_locations?.name,
        flavour: s.shisha_products?.name,
        startTime: new Date(s.start_time),
        lastRefillTime: s.last_refill_time ? new Date(s.last_refill_time) : null,
        remaining_time_seconds: s.remaining_time_seconds,
        amount: s.total_amount,
        refillCount: s.refill_count,
        status: s.status,
        paused: s.paused,
        paymentMethod: s.payment_method,
        accountId: s.account_id
      };
      
      // Update status based on timer if not paused
      if (!sessionData.paused && sessionData.status !== 'expired') {
        const newStatus = determineSessionStatus(sessionData);
        if (newStatus !== sessionData.status) {
          sessionData.status = newStatus;
          // Update in database asynchronously
          supabase
            .from('shisha_sessions')
            .update({ status: newStatus })
            .eq('id', sessionData.id)
            .then(({ error }) => {
              if (error) console.error('Error updating session status:', error);
            });
        }
      }
      
      return sessionData;
    });
    
    renderPipes();
    updateStats();
  }

  async function loadRequests() {
    const { data, error } = await supabase
      .from('shisha_requests')
      .select('*')
      .eq('status', 'pending')
      .order('created_at', { ascending: false });
    
    if (error) {
      console.error('Error loading requests:', error);
      return;
    }
    
    const pending = data || [];
    document.getElementById('requestBadge').innerText = pending.length;
    const container = document.getElementById('requestsList');
    
    if (pending.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:24px; color:var(--mist);">✅ No pending requests</div>';
      return;
    }
    
    container.innerHTML = pending.map(r => `
      <div class="request-item" data-id="${r.id}">
        <div class="request-info">
          <strong>${r.request_type.replace(/_/g, ' ').toUpperCase()}</strong><br>
          <small>📍 ${r.location_name || 'Lounge'} | 🍃 ${r.flavour_name || '-'}</small><br>
          <small>👤 ${r.customer_phone || 'Guest'} | ${r.device_code || 'New'}</small>
        </div>
        <div class="request-buttons">
          <button class="btn-approve" data-id="${r.id}">Approve</button>
          <button class="btn-reject" data-id="${r.id}">Reject</button>
        </div>
      </div>
    `).join('');
    
    document.querySelectorAll('.btn-approve').forEach(btn => 
      btn.addEventListener('click', () => approveRequest(btn.dataset.id))
    );
    document.querySelectorAll('.btn-reject').forEach(btn => 
      btn.addEventListener('click', () => rejectRequest(btn.dataset.id))
    );
  }

  // ============ REQUEST HANDLING ==========
  async function approveRequest(requestId) {
    const { data: req, error: fetchErr } = await supabase
      .from('shisha_requests')
      .select('*')
      .eq('id', requestId)
      .single();
    
    if (fetchErr || !req) {
      showAlertModal("Request not found");
      return;
    }
    
    try {
      switch (req.request_type) {
        case 'coal_refill':
          await handleRefillRequest(req);
          break;
        case 'new_order':
          await handleNewOrderRequest(req);
          break;
        default:
          showAlertModal(`Unknown request type: ${req.request_type}`);
          return;
      }
      
      await supabase
        .from('shisha_requests')
        .update({ status: 'approved', responded_at: new Date().toISOString() })
        .eq('id', requestId);
      
      showToast(`✅ Request approved successfully`);
      await Promise.all([loadSessions(), loadRequests(), loadDevices()]);
      
    } catch (err) {
      showAlertModal(err.message, "Error");
    }
  }

  async function handleRefillRequest(req) {
    const session = activeSessions.find(s => s.id === req.session_id);
    if (!session) throw new Error("Session not found");
    if (session.paused) throw new Error("Session is paused, cannot refill");
    
    // Check if hookah is still available (not ended by another staff)
    const isAvailable = await isHookahAvailable(session.deviceId);
    if (isAvailable) throw new Error("Session appears to have ended");
    
    const newTotal = (session.amount || SESSION_PRICE) + REFILL_PRICE;
    const newRefillCount = (session.refillCount || 0) + 1;
    
    const { error } = await supabase
      .from('shisha_sessions')
      .update({
        last_refill_time: new Date().toISOString(),
        remaining_time_seconds: DURATION_SECONDS,
        status: 'active',
        total_amount: newTotal,
        refill_count: newRefillCount
      })
      .eq('id', session.id);
    
    if (error) throw new Error(`Failed to process refill: ${error.message}`);
    showToast(`✅ Refill approved for ${session.shishaId}`);
  }

  async function handleNewOrderRequest(req) {
    // Find available hookah
    const { data: freeDevice, error: deviceError } = await supabase
      .from('hookah_devices')
      .select('id, device_code')
      .eq('status', 'available')
      .limit(1);
    
    if (deviceError || !freeDevice || freeDevice.length === 0) {
      throw new Error("No available hookah stations");
    }
    
    // Double-check no active session exists
    const isAvailable = await isHookahAvailable(freeDevice[0].id);
    if (!isAvailable) throw new Error("Hookah was just taken by another session");
    
    const deviceId = freeDevice[0].id;
    const { data: product } = await supabase
      .from('shisha_products')
      .select('id')
      .eq('name', req.flavour_name)
      .limit(1);
    
    const { data: location } = await supabase
      .from('shisha_locations')
      .select('id')
      .eq('name', req.location_name)
      .limit(1);
    
    if (!product?.length || !location?.length) {
      throw new Error("Flavour or location not found");
    }
    
    const paymentMethod = req.request_data?.paymentMethod || 'cash';
    
    const { error: insertError } = await supabase
      .from('shisha_sessions')
      .insert({
        device_id: deviceId,
        product_id: product[0].id,
        location_id: location[0].id,
        start_time: new Date().toISOString(),
        last_refill_time: new Date().toISOString(),
        remaining_time_seconds: DURATION_SECONDS,
        total_amount: SESSION_PRICE,
        status: 'active',
        customer_phone: req.customer_phone || 'walkin_customer',
        payment_method: paymentMethod,
        account_id: paymentMethod === 'wallet' ? req.customer_phone : null
      });
    
    if (insertError) throw new Error(`Failed to create session: ${insertError.message}`);
    showToast(`✅ New session started on ${freeDevice[0].device_code}`);
  }

  async function rejectRequest(requestId) {
    await supabase
      .from('shisha_requests')
      .update({ status: 'rejected', responded_at: new Date().toISOString() })
      .eq('id', requestId);
    
    showToast("Request rejected");
    await loadRequests();
  }

  // ============ UI RENDERING ==========
  function updateAllTimers() {
    document.querySelectorAll('.timer-value').forEach(elem => {
      const sessionId = elem.getAttribute('data-session-id');
      if (!sessionId) return;
      
      const session = activeSessions.find(s => s.id === sessionId);
      if (!session) return;
      
      const remainingSec = calculateRemainingSeconds(session);
      const status = determineSessionStatus(session);
      
      if (remainingSec <= 0 || status === 'expired') {
        elem.innerText = "EXPIRED";
        elem.style.color = "var(--red)";
        
        // Update card styling
        const parentCard = elem.closest('.pipe-card');
        if (parentCard && !parentCard.classList.contains('expired')) {
          parentCard.classList.remove('inuse', 'refill', 'paused');
          parentCard.classList.add('expired');
          const statusSpan = parentCard.querySelector('.pipe-status');
          if (statusSpan) {
            statusSpan.innerText = "Expired";
            statusSpan.classList.remove('inuse', 'refill', 'paused');
            statusSpan.classList.add('expired');
          }
        }
      } else {
        elem.innerText = formatTime(remainingSec);
        elem.style.color = "";
      }
    });
  }

  function startCountdownUpdater() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      updateAllTimers();
    }, 1000);
  }

  function renderPipes() {
    if (!allDevices.length) return;
    
    const container = document.getElementById('pipesGrid');
    container.innerHTML = allDevices.map(device => {
      const session = activeSessions.find(s => s.deviceId === device.id);
      let statusClass = "available", statusText = "Free";
      let flavour = "-", location = "-";
      let timerValue = "--:--";
      
      if (session) {
        flavour = session.flavour || "-";
        location = session.location || "-";
        const remainingSec = calculateRemainingSeconds(session);
        const status = determineSessionStatus(session);
        timerValue = remainingSec <= 0 ? "EXPIRED" : formatTime(remainingSec);
        
        if (session.paused) {
          statusClass = "paused";
          statusText = "Paused";
        } else if (status === 'expired') {
          statusClass = "expired";
          statusText = "Expired";
        } else if (status === 'refill') {
          statusClass = "refill";
          statusText = "Refill soon";
        } else {
          statusClass = "inuse";
          statusText = "In use";
        }
      }
      
      return `<div class="pipe-card ${statusClass}" data-device-id="${device.id}">
        <div class="pipe-header">
          <span class="pipe-code">${device.device_code}</span>
          <span class="pipe-status ${statusClass}">${statusText}</span>
        </div>
        <div><small>📍 ${location} | 🍃 ${flavour}</small></div>
        <div class="timer">⏱️ <span class="timer-value" data-session-id="${session ? session.id : ''}">${timerValue}</span></div>
        <div class="pipe-actions">
          ${!session ? 
            `<button class="btn-assign" data-device-id="${device.id}" data-device-code="${device.device_code}">Assign (R250)</button>` :
            `<button class="btn-refill" data-session-id="${session.id}">Refill (R250)</button>
             <button class="btn-pause" data-session-id="${session.id}">Pause</button>
             ${session.paused ? `<button class="btn-resume" data-session-id="${session.id}">Resume</button>` : ''}
             <button class="btn-end" data-session-id="${session.id}">End</button>`
          }
        </div>
      </div>`;
    }).join('');
    
    // Re-attach event listeners
    document.querySelectorAll('.btn-assign').forEach(btn => 
      btn.addEventListener('click', () => openAssignModal(btn.dataset.deviceId, btn.dataset.deviceCode))
    );
    document.querySelectorAll('.btn-refill').forEach(btn => 
      btn.addEventListener('click', () => openRefillModal(btn.dataset.sessionId))
    );
    document.querySelectorAll('.btn-pause').forEach(btn => 
      btn.addEventListener('click', () => openPauseModal(btn.dataset.sessionId))
    );
    document.querySelectorAll('.btn-resume').forEach(btn => 
      btn.addEventListener('click', () => resumeSession(btn.dataset.sessionId))
    );
    document.querySelectorAll('.btn-end').forEach(btn => 
      btn.addEventListener('click', () => endSession(btn.dataset.sessionId))
    );
  }

  function updateStats() {
    let available = 0, inuse = 0, refill = 0, expired = 0, paused = 0;
    
    for (let device of allDevices) {
      const session = activeSessions.find(s => s.deviceId === device.id);
      
      if (!session) {
        available++;
      } else if (session.paused) {
        paused++;
      } else {
        const status = determineSessionStatus(session);
        if (status === 'expired') expired++;
        else if (status === 'refill') refill++;
        else inuse++;
      }
    }
    
    document.getElementById('statsContainer').innerHTML = `
      <div class="stat-item"><div class="stat-number">${available}</div><div class="stat-label">Free</div></div>
      <div class="stat-item"><div class="stat-number">${inuse}</div><div class="stat-label">In use</div></div>
      <div class="stat-item"><div class="stat-number">${refill}</div><div class="stat-label">Refill soon</div></div>
      <div class="stat-item"><div class="stat-number">${expired}</div><div class="stat-label">Expired</div></div>
      <div class="stat-item"><div class="stat-number">${paused}</div><div class="stat-label">Paused</div></div>
    `;
  }

  // ============ SESSION ACTIONS ==========
  async function openAssignModal(deviceId, deviceCode) {
    // Verify hookah is still available before opening modal
    const isAvailable = await isHookahAvailable(deviceId);
    if (!isAvailable) {
      showAlertModal("This hookah is no longer available. Please refresh and try again.");
      await loadSessions();
      return;
    }
    
    selectedDeviceForAssign = { id: deviceId, code: deviceCode };
    
    const { data: locations } = await supabase
      .from('shisha_locations')
      .select('name')
      .eq('is_active', true);
    
    const { data: flavours } = await supabase
      .from('shisha_products')
      .select('name')
      .eq('is_available', true);
    
    document.getElementById('assignLocation').innerHTML = (locations || []).map(l => `<option>${l.name}</option>`).join('');
    document.getElementById('assignFlavour').innerHTML = (flavours || []).map(f => `<option>${f.name}</option>`).join('');
    document.getElementById('assignModal').style.display = 'flex';
  }

  document.getElementById('confirmAssignBtn').onclick = async () => {
    const locationName = document.getElementById('assignLocation').value;
    const flavourName = document.getElementById('assignFlavour').value;
    
    if (!selectedDeviceForAssign) {
      showAlertModal("No device selected");
      return;
    }
    
    // Final availability check before creation
    const isAvailable = await isHookahAvailable(selectedDeviceForAssign.id);
    if (!isAvailable) {
      showAlertModal(`${selectedDeviceForAssign.code} is no longer available. It may have been taken by another staff member.`);
      closeModals();
      await loadSessions();
      return;
    }
    
    const { data: product } = await supabase
      .from('shisha_products')
      .select('id')
      .eq('name', flavourName)
      .limit(1);
    
    const { data: location } = await supabase
      .from('shisha_locations')
      .select('id')
      .eq('name', locationName)
      .limit(1);
    
    if (!product?.length || !location?.length) {
      showAlertModal("Invalid flavour or location");
      return;
    }
    
    const { error } = await supabase
      .from('shisha_sessions')
      .insert({
        device_id: selectedDeviceForAssign.id,
        product_id: product[0].id,
        location_id: location[0].id,
        start_time: new Date().toISOString(),
        last_refill_time: new Date().toISOString(),
        remaining_time_seconds: DURATION_SECONDS,
        total_amount: SESSION_PRICE,
        status: 'active',
        payment_method: 'cash',
        customer_phone: 'walkin_customer'
      });
    
    if (error) {
      showAlertModal(`Failed to start session: ${error.message}`);
    } else {
      closeModals();
      showToast(`✅ Session started on ${selectedDeviceForAssign.code}`);
      await loadSessions();
      await loadDevices();
    }
  };
  
  document.getElementById('cancelAssignBtn').onclick = () => closeModals();

  async function openRefillModal(sessionId) {
    const sess = activeSessions.find(s => s.id === sessionId);
    if (!sess) return;
    
    // Verify session is still active
    if (sess.paused) {
      showAlertModal("Cannot refill a paused session");
      return;
    }
    
    selectedPipeForAction = sess;
    document.getElementById('refillInfo').innerHTML = `${sess.shishaId} | ${sess.flavour} | Total: R${sess.amount}`;
    document.getElementById('refillModal').style.display = 'flex';
  }
  
  document.getElementById('confirmRefillBtn').onclick = async () => {
    const sess = selectedPipeForAction;
    if (!sess) return;
    
    // Verify session still exists and is active
    const { data: currentSession } = await supabase
      .from('shisha_sessions')
      .select('status, paused')
      .eq('id', sess.id)
      .single();
    
    if (!currentSession || currentSession.paused || currentSession.status === 'expired') {
      showAlertModal("Session is no longer active");
      closeModals();
      await loadSessions();
      return;
    }
    
    const newTotal = sess.amount + REFILL_PRICE;
    const newRefillCount = (sess.refillCount || 0) + 1;
    
    const { error } = await supabase
      .from('shisha_sessions')
      .update({
        last_refill_time: new Date().toISOString(),
        remaining_time_seconds: DURATION_SECONDS,
        status: 'active',
        total_amount: newTotal,
        refill_count: newRefillCount
      })
      .eq('id', sess.id);
    
    if (error) {
      showAlertModal(`Failed to refill: ${error.message}`);
    } else {
      closeModals();
      showToast(`✅ Refilled ${sess.shishaId}`);
      await loadSessions();
    }
  };
  
  document.getElementById('cancelRefillBtn').onclick = () => closeModals();

  async function openPauseModal(sessionId) {
    const sess = activeSessions.find(s => s.id === sessionId);
    if (!sess || sess.paused) {
      showAlertModal("Cannot pause this session");
      return;
    }
    
    selectedPipeForAction = sess;
    document.getElementById('pauseModal').style.display = 'flex';
  }
  
  document.getElementById('confirmPauseBtn').onclick = async () => {
    if (selectedPipeForAction) {
      // Store remaining time before pausing
      const remainingSec = calculateRemainingSeconds(selectedPipeForAction);
      
      const { error } = await supabase
        .from('shisha_sessions')
        .update({ 
          paused: true, 
          status: 'paused',
          remaining_time_seconds: Math.max(0, remainingSec)
        })
        .eq('id', selectedPipeForAction.id);
      
      if (error) {
        showAlertModal(`Failed to pause: ${error.message}`);
      } else {
        closeModals();
        showToast(`⏸️ ${selectedPipeForAction.shishaId} paused`);
        await loadSessions();
      }
    }
  };
  
  document.getElementById('cancelPauseBtn').onclick = () => closeModals();

  async function resumeSession(sessionId) {
    const sess = activeSessions.find(s => s.id === sessionId);
    if (sess?.paused) {
      const remainingTime = sess.remaining_time_seconds || 0;
      let newStatus = remainingTime <= 0 ? 'expired' : (remainingTime <= REFILL_THRESHOLD * 60 ? 'refill' : 'active');
      
      const { error } = await supabase
        .from('shisha_sessions')
        .update({ paused: false, status: newStatus })
        .eq('id', sess.id);
      
      if (error) {
        showAlertModal(`Failed to resume: ${error.message}`);
      } else {
        showToast(`▶️ ${sess.shishaId} resumed`);
        await loadSessions();
      }
    }
  }
  
  async function endSession(sessionId) {
    const sess = activeSessions.find(s => s.id === sessionId);
    if (!sess) return;
    
    if (confirm(`End session for ${sess.shishaId}? Total due: R${sess.amount}`)) {
      const { error } = await supabase
        .from('shisha_sessions')
        .update({ 
          status: 'expired', 
          ended_at: new Date().toISOString(),
          remaining_time_seconds: 0
        })
        .eq('id', sess.id);
      
      if (error) {
        showAlertModal(`Failed to end session: ${error.message}`);
      } else {
        showToast(`❌ ${sess.shishaId} ended`);
        await loadSessions();
        await loadDevices();
      }
    }
  }

  // ============ REALTIME SUBSCRIPTIONS ==========
  function setupRealtimeSubscriptions() {
    if (realtimeSubscription) {
      realtimeSubscription.unsubscribe();
    }
    
    realtimeSubscription = supabase
      .channel('shisha-console-changes')
      .on('postgres_changes', 
        { event: '*', schema: 'public', table: 'shisha_sessions' }, 
        () => {
          console.log('Session change detected, reloading...');
          loadSessions();
          loadDevices();
        }
      )
      .on('postgres_changes', 
        { event: '*', schema: 'public', table: 'shisha_requests' }, 
        () => {
          console.log('Request change detected, reloading...');
          loadRequests();
        }
      )
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          console.log('Realtime subscription active');
        }
      });
  }

  // ============ INITIALIZATION ==========
  async function init() {
    await loadDevices();
    await loadSessions();
    await loadRequests();
    startCountdownUpdater();
    setupRealtimeSubscriptions();
    
    // Periodic refresh as backup (every 5 seconds)
    setInterval(async () => { 
      await loadSessions(); 
      await loadRequests();
      await loadDevices();
    }, 5000);
  }
  
  init();
</script>
</body>
