<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shisha Premium · Staff Console</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ========== EMBEDDED MODULE BASE (identical to Pre-Order POS) ========== */
    :root {
      --red: #E30613;
      --red-dark: #a0010e;
      --red-deep: #8A0009;
      --red-glow: rgba(227,6,19,0.18);
      --red-subtle: rgba(227,6,19,0.06);
      --ink: #1e293b;
      --ink-muted: #334155;
      --slate: #475569;
      --mist: #94a3b8;
      --bone: #f8fafd;
      --white: #ffffff;
      --card-bg: #ffffff;
      --border: rgba(0,0,0,0.07);
      --border-strong: #eef2f8;
      --shadow-soft: 0 8px 20px -6px rgba(0,0,0,0.12);
      --shadow-card: 0 4px 24px rgba(0,0,0,0.08);
      --shadow-float: 0 16px 48px rgba(0,0,0,0.14);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-xl: 32px;
      --radius-full: 9999px;
      --transition: all 0.22s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--bone);
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100%;
      padding: 24px;
    }

    .shisha-dashboard {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-soft);
      transition: var(--transition);
      margin-bottom: 0;
    }

    .card-header {
      padding: 20px 24px;
      background: var(--white);
      border-bottom: 2px solid var(--border-strong);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink);
    }

    .card-header i {
      color: var(--red);
      margin-right: 8px;
    }

    .card-body {
      padding: 20px 24px;
    }

    .badge-red {
      background: var(--red);
      color: white;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .stats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
    }

    .stat-item {
      background: var(--bone);
      border-radius: var(--radius-lg);
      padding: 12px 8px;
      text-align: center;
      flex: 1;
      min-width: 70px;
    }
    .stat-number {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--red);
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--slate);
      margin-top: 4px;
    }

    .requests-container {
      max-height: 320px;
      overflow-y: auto;
      margin-top: 12px;
    }
    .request-item {
      background: var(--bone);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .request-info { font-size: 0.85rem; color: var(--ink); }
    .request-buttons { display: flex; gap: 8px; }
    .btn-approve {
      background: #10b981;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reject {
      background: var(--red);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-weight: 600;
      cursor: pointer;
    }

    .pipes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .pipe-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 16px;
      border-left: 4px solid;
      transition: var(--transition);
      box-shadow: var(--shadow-soft);
    }
    .pipe-card.available { border-left-color: #10b981; }
    .pipe-card.inuse { border-left-color: var(--red); }
    .pipe-card.refill { border-left-color: #f59e0b; background: #fffbeb; }
    .pipe-card.expired { border-left-color: #6b7280; background: #f3f4f6; }
    .pipe-card.paused { border-left-color: #ff9800; background: #fff8e1; }

    .pipe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .pipe-code { font-weight: 800; color: var(--ink); }
    .pipe-status {
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-weight: 600;
    }
    .pipe-status.available { background: #e8f5e9; color: #2e7d32; }
    .pipe-status.inuse { background: #ffebee; color: var(--red); }
    .pipe-status.refill { background: #fff3e0; color: #ef6c00; }
    .pipe-status.expired { background: #e5e7eb; color: #4b5563; }
    .pipe-status.paused { background: #fff8e1; color: #ff8f00; }

    .timer {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 700;
      margin: 8px 0;
      color: var(--ink);
    }
    .pipe-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .pipe-actions button {
      padding: 8px 12px;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-assign { background: var(--red); color: white; }
    .btn-refill { background: #f59e0b; color: white; }
    .btn-pause { background: #ff9800; color: white; }
    .btn-resume { background: #10b981; color: white; }
    .btn-end { background: #6b7280; color: white; }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .modal-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      max-width: 450px;
      width: 90%;
      padding: 28px;
      border: 2px solid var(--red);
      box-shadow: var(--shadow-float);
    }
    .modal-card h3 { color: var(--red); margin-bottom: 16px; }
    .modal-card select, .modal-card input {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-strong);
      margin-bottom: 12px;
      font-family: inherit;
    }
    .btn-confirm {
      background: var(--red);
      color: white;
      border: none;
      padding: 12px;
      border-radius: var(--radius-full);
      font-weight: 700;
      width: 100%;
      cursor: pointer;
    }
    .btn-cancel {
      background: var(--bone);
      color: var(--ink);
      border: 1px solid var(--border-strong);
      margin-top: 8px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .toast-pos {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: white;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-weight: 500;
      z-index: 10002;
      transition: transform 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }
    .toast-pos.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      .shisha-dashboard { grid-template-columns: 1fr; gap: 20px; }
      body { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="shisha-dashboard">
  <!-- LEFT COLUMN: Requests + Stats -->
  <div>
    <div class="card" style="margin-bottom: 24px;">
      <div class="card-header">
        <span><i class="fas fa-concierge-bell"></i> Service requests</span>
        <span id="requestBadge" class="badge-red">0</span>
      </div>
      <div class="card-body">
        <div class="requests-container" id="requestsList"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <span><i class="fas fa-chart-simple"></i> Live status</span>
      </div>
      <div class="card-body">
        <div class="stats-grid" id="statsContainer"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN: Hookah stations -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-smoking"></i> Hookah stations · R250 session</span>
    </div>
    <div class="card-body">
      <div id="pipesGrid" class="pipes-grid"></div>
    </div>
  </div>
</div>

<!-- Modals (identical to original but restyled) -->
<div id="genericModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3 id="modalTitle">Notice</h3>
    <p id="modalMessage" style="margin: 20px 0;"></p>
    <button id="modalOkBtn" class="btn-confirm" style="background:var(--red);">OK</button>
  </div>
</div>

<div id="assignModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3>📝 Assign new session (R250)</h3>
    <select id="assignLocation"></select>
    <select id="assignFlavour"></select>
    <select id="assignPayment">
      <option value="cash">Cash</option>
      <option value="card">Card</option>
      <option value="wallet">Rands Wallet</option>
    </select>
    <div id="assignAccountField" style="display:none;">
      <input type="text" id="assignAccountId" placeholder="WhatsApp number">
    </div>
    <button id="confirmAssignBtn" class="btn-confirm">Confirm & start</button>
    <button id="cancelAssignBtn" class="btn-confirm btn-cancel">Cancel</button>
  </div>
</div>

<div id="refillModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3>🔄 Refill session (R250)</h3>
    <p id="refillInfo" style="margin: 12px 0;"></p>
    <button id="confirmRefillBtn" class="btn-confirm">Refill R250</button>
    <button id="cancelRefillBtn" class="btn-confirm btn-cancel">Cancel</button>
  </div>
</div>

<div id="pauseModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3>⏸️ Pause session</h3>
    <input type="text" id="pauseReason" placeholder="Reason (optional)">
    <button id="confirmPauseBtn" class="btn-confirm">Pause</button>
    <button id="cancelPauseBtn" class="btn-confirm btn-cancel">Cancel</button>
  </div>
</div>

<div id="toastMsg" class="toast-pos"></div>

<script type="module">
  import { supabase } from '../../config/supabase.js';

  // ============ CONSTANTS & HELPERS ==========
  const SESSION_PRICE = 250;
  const REFILL_PRICE = 250;
  const COAL_DURATION = 60; // minutes
  const REFILL_THRESHOLD = 15;
  const DURATION_SECONDS = COAL_DURATION * 60; // 3600

  let activeSessions = [];
  let allDevices = [];
  let selectedPipeForAction = null;
  let selectedDeviceForAssign = null;
  let countdownInterval = null;

  function showToast(message, isError = false) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = message;
    toast.style.background = isError ? 'var(--red)' : 'var(--ink)';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function showAlertModal(message, title = "Notification") {
    const modal = document.getElementById('genericModal');
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    modal.style.display = 'flex';
    document.getElementById('modalOkBtn').onclick = () => { modal.style.display = 'none'; };
  }

  function closeModals() {
    document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    selectedPipeForAction = null;
    selectedDeviceForAssign = null;
  }

  // ============ WALLET LOGIC (unchanged) ==========
  async function getWalletByPhone(phone) {
    const normalized = phone.replace(/\D/g, '');
    const { data: profile, error: profileErr } = await supabase
      .from('profiles')
      .select('id, name, phone')
      .eq('phone', normalized)
      .maybeSingle();
    if (profileErr || !profile) return { success: false, error: "Profile not found" };
    const { data: wallet, error: walletErr } = await supabase
      .from('wallets')
      .select('id, balance')
      .eq('user_id', profile.id)
      .maybeSingle();
    if (walletErr || !wallet) return { success: false, error: "Wallet not found" };
    return { success: true, profile, wallet };
  }

  async function deductFromWallet(phone, amount, reason) {
    const walletData = await getWalletByPhone(phone);
    if (!walletData.success) return { success: false, error: walletData.error };
    const { profile, wallet } = walletData;
    if (wallet.balance < amount) return { success: false, error: `Insufficient balance. Available: R${wallet.balance.toFixed(2)}` };
    const newBalance = wallet.balance - amount;
    const { error: updateErr } = await supabase.from('wallets').update({ balance: newBalance }).eq('id', wallet.id);
    if (updateErr) return { success: false, error: updateErr.message };
    await supabase.from('wallet_transactions').insert({
      wallet_id: wallet.id,
      type: 'debit',
      amount: -amount,
      description: reason,
      reference: `shisha_${Date.now()}`
    });
    return { success: true, newBalance, name: profile.name };
  }

  // ============ DATA LOADING ==========
  async function loadDevices() {
    const { data, error } = await supabase.from('hookah_devices').select('*').order('device_code');
    if (error) { console.error(error); return []; }
    allDevices = data;
    return data;
  }

  async function loadSessions() {
    const { data, error } = await supabase
      .from('shisha_sessions')
      .select(`
        id, device_id, product_id, location_id,
        start_time, last_refill_time, remaining_time_seconds,
        total_amount, refill_count, status, paused, payment_method, account_id,
        hookah_devices (device_code),
        shisha_products (name),
        shisha_locations (name)
      `)
      .in('status', ['active', 'refill', 'paused', 'expired']);
    if (error) { console.error(error); return []; }
    activeSessions = data.map(s => ({
      id: s.id,
      shishaId: s.hookah_devices?.device_code,
      deviceId: s.device_id,
      location: s.shisha_locations?.name,
      flavour: s.shisha_products?.name,
      startTime: new Date(s.start_time),
      lastRefillTime: s.last_refill_time ? new Date(s.last_refill_time) : null,
      remainingTime: s.remaining_time_seconds, // used for paused/expired only
      amount: s.total_amount,
      refillCount: s.refill_count,
      status: s.status,
      paused: s.paused,
      paymentMethod: s.payment_method,
      accountId: s.account_id
    }));
    renderPipes();   // full rerender (keeps buttons/modal state)
    updateStats();
  }

  async function loadRequests() {
    const { data, error } = await supabase
      .from('shisha_requests')
      .select('*')
      .eq('status', 'pending')
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    const pending = data || [];
    document.getElementById('requestBadge').innerText = pending.length;
    const container = document.getElementById('requestsList');
    if (pending.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:24px; color:var(--mist);">✅ No pending requests</div>';
      return;
    }
    container.innerHTML = pending.map(r => `
      <div class="request-item" data-id="${r.id}">
        <div class="request-info">
          <strong>${r.request_type.replace(/_/g, ' ').toUpperCase()}</strong><br>
          <small>📍 ${r.location_name || 'Lounge'} | 🍃 ${r.flavour_name || '-'}</small><br>
          <small>👤 ${r.customer_phone || 'Guest'} | ${r.device_code || 'New'}</small>
        </div>
        <div class="request-buttons">
          <button class="btn-approve" data-id="${r.id}">Approve</button>
          <button class="btn-reject" data-id="${r.id}">Reject</button>
        </div>
      </div>
    `).join('');
    document.querySelectorAll('.btn-approve').forEach(btn => btn.addEventListener('click', () => approveRequest(btn.dataset.id)));
    document.querySelectorAll('.btn-reject').forEach(btn => btn.addEventListener('click', () => rejectRequest(btn.dataset.id)));
  }

  // ============ REQUEST HANDLING (preserved) ==========
  async function approveRequest(requestId) {
    const { data: req, error: fetchErr } = await supabase.from('shisha_requests').select('*').eq('id', requestId).single();
    if (fetchErr || !req) { showAlertModal("Request not found"); return; }
    let session = activeSessions.find(s => s.id === req.session_id);
    let deviceId = null;
    try {
      switch (req.request_type) {
        case 'coal_refill':
          if (!session) throw new Error("Session not found");
          if (session.paused) throw new Error("Session paused");
          if (session.paymentMethod?.toLowerCase().includes('wallet') && session.accountId) {
            const res = await deductFromWallet(session.accountId, REFILL_PRICE, `Coal refill ${session.shishaId}`);
            if (!res.success) throw new Error(res.error);
          }
          await supabase.from('shisha_sessions').update({
            last_refill_time: new Date().toISOString(),
            remaining_time_seconds: DURATION_SECONDS,
            status: 'active',
            total_amount: (session.amount || SESSION_PRICE) + REFILL_PRICE,
            refill_count: (session.refillCount || 0) + 1
          }).eq('id', session.id);
          showToast(`✅ Refill approved for ${session.shishaId}`);
          break;
        case 'new_order':
          const { data: freeDevice } = await supabase.from('hookah_devices').select('id, device_code').eq('status', 'available').limit(1);
          if (!freeDevice || freeDevice.length === 0) throw new Error("No available stations");
          deviceId = freeDevice[0].id;
          const { data: product } = await supabase.from('shisha_products').select('id').eq('name', req.flavour_name).limit(1);
          const { data: location } = await supabase.from('shisha_locations').select('id').eq('name', req.location_name).limit(1);
          if (!product?.length || !location?.length) throw new Error("Flavour/location missing");
          const paymentMethod = req.request_data?.paymentMethod || 'cash';
          if (paymentMethod === 'wallet' && req.customer_phone) {
            const res = await deductFromWallet(req.customer_phone, SESSION_PRICE, `New session ${freeDevice[0].device_code}`);
            if (!res.success) throw new Error(res.error);
          }
          await supabase.from('shisha_sessions').insert({
            device_id: deviceId,
            product_id: product[0].id,
            location_id: location[0].id,
            start_time: new Date().toISOString(),
            last_refill_time: new Date().toISOString(),
            remaining_time_seconds: DURATION_SECONDS,
            total_amount: SESSION_PRICE,
            status: 'active',
            customer_phone: req.customer_phone,
            payment_method: paymentMethod,
            account_id: req.customer_phone
          });
          showToast(`✅ New session on ${freeDevice[0].device_code}`);
          break;
        default:
          showAlertModal(`Handled: ${req.request_type}`);
      }
      await supabase.from('shisha_requests').update({ status: 'approved', responded_at: new Date().toISOString() }).eq('id', requestId);
      await loadSessions(); await loadRequests(); await loadDevices();
    } catch (err) { showAlertModal(err.message, "Error"); }
  }

  async function rejectRequest(requestId) {
    await supabase.from('shisha_requests').update({ status: 'rejected', responded_at: new Date().toISOString() }).eq('id', requestId);
    showToast("Request rejected");
    await loadRequests();
  }

  // ============ LIVE COUNTDOWN LOGIC (shared with POS/Monitor) ==========
  function calculateRemainingSeconds(session) {
    if (session.paused || session.status === 'expired') {
      // For paused/expired, show stored remaining (static)
      return session.remainingTime;
    }
    const referenceTime = session.lastRefillTime ? new Date(session.lastRefillTime) : new Date(session.startTime);
    const now = new Date();
    const elapsedSeconds = Math.floor((now - referenceTime) / 1000);
    let remaining = DURATION_SECONDS - elapsedSeconds;
    return remaining > 0 ? remaining : 0;
  }

  function formatTime(seconds) {
    if (seconds <= 0) return "EXPIRED";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  // Update all timer spans on the page (no rerender)
  function updateAllTimers() {
    document.querySelectorAll('.timer-value').forEach(elem => {
      const sessionId = elem.getAttribute('data-session-id');
      if (!sessionId) return;
      const session = activeSessions.find(s => s.id === sessionId);
      if (!session) return;
      let remainingSec = calculateRemainingSeconds(session);
      if (remainingSec <= 0 && !session.paused && session.status !== 'expired') {
        elem.innerText = "EXPIRED";
        elem.style.color = "var(--red)";
        // Also update parent card styling visually if needed (not required but nice)
        const parentCard = elem.closest('.pipe-card');
        if (parentCard && !parentCard.classList.contains('expired')) {
          parentCard.classList.remove('inuse', 'refill', 'paused');
          parentCard.classList.add('expired');
          const statusSpan = parentCard.querySelector('.pipe-status');
          if (statusSpan) {
            statusSpan.innerText = "Expired";
            statusSpan.classList.remove('inuse', 'refill', 'paused');
            statusSpan.classList.add('expired');
          }
        }
      } else {
        elem.innerText = formatTime(remainingSec);
        elem.style.color = "";
      }
    });
  }

  function startCountdownUpdater() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      updateAllTimers();
    }, 1000);
  }

  // ============ UI RENDERING (with timer spans) ==========
  function renderPipes() {
    if (!allDevices.length) return;
    const container = document.getElementById('pipesGrid');
    container.innerHTML = allDevices.map(device => {
      const session = activeSessions.find(s => s.deviceId === device.id);
      let statusClass = "available", statusText = "Free";
      let timerDisplay = "01:00";
      let flavour = "-", location = "-";
      let timerValue = "00:00";
      if (session) {
        flavour = session.flavour;
        location = session.location;
        const remainingSec = calculateRemainingSeconds(session);
        timerDisplay = formatTime(remainingSec);
        timerValue = remainingSec <= 0 ? "EXPIRED" : timerDisplay;
        if (session.paused) { statusClass = "paused"; statusText = "Paused"; }
        else if (session.status === 'expired') { statusClass = "expired"; statusText = "Expired"; }
        else if (session.status === 'refill') { statusClass = "refill"; statusText = "Refill soon"; }
        else { statusClass = "inuse"; statusText = "In use"; }
      }
      return `<div class="pipe-card ${statusClass}" data-device-id="${device.id}">
        <div class="pipe-header">
          <span class="pipe-code">${device.device_code}</span>
          <span class="pipe-status ${statusClass}">${statusText}</span>
        </div>
        <div><small>📍 ${location} | 🍃 ${flavour}</small></div>
        <div class="timer">⏱️ <span class="timer-value" data-session-id="${session ? session.id : ''}">${timerValue}</span></div>
        <div class="pipe-actions">
          ${!session ? `<button class="btn-assign" data-device-id="${device.id}" data-device-code="${device.device_code}">Assign (R250)</button>` :
            `<button class="btn-refill" data-session-id="${session.id}">Refill (R250)</button>
             <button class="btn-pause" data-session-id="${session.id}">Pause</button>
             ${session.paused ? `<button class="btn-resume" data-session-id="${session.id}">Resume</button>` : ''}
             <button class="btn-end" data-session-id="${session.id}">End</button>`}
        </div>
      </div>`;
    }).join('');
    // Re-attach event listeners
    document.querySelectorAll('.btn-assign').forEach(btn => btn.addEventListener('click', () => openAssignModal(btn.dataset.deviceId, btn.dataset.deviceCode)));
    document.querySelectorAll('.btn-refill').forEach(btn => btn.addEventListener('click', () => openRefillModal(btn.dataset.sessionId)));
    document.querySelectorAll('.btn-pause').forEach(btn => btn.addEventListener('click', () => openPauseModal(btn.dataset.sessionId)));
    document.querySelectorAll('.btn-resume').forEach(btn => btn.addEventListener('click', () => resumeSession(btn.dataset.sessionId)));
    document.querySelectorAll('.btn-end').forEach(btn => btn.addEventListener('click', () => endSession(btn.dataset.sessionId)));
  }

  function updateStats() {
    let available = 0, inuse = 0, refill = 0, expired = 0, paused = 0;
    for (let d of allDevices) {
      const s = activeSessions.find(s => s.deviceId === d.id);
      if (!s) available++;
      else if (s.paused) paused++;
      else if (s.status === 'expired') expired++;
      else if (s.status === 'refill') refill++;
      else inuse++;
    }
    document.getElementById('statsContainer').innerHTML = `
      <div class="stat-item"><div class="stat-number">${available}</div><div class="stat-label">Free</div></div>
      <div class="stat-item"><div class="stat-number">${inuse}</div><div class="stat-label">In use</div></div>
      <div class="stat-item"><div class="stat-number">${refill}</div><div class="stat-label">Refill soon</div></div>
      <div class="stat-item"><div class="stat-number">${expired}</div><div class="stat-label">Expired</div></div>
      <div class="stat-item"><div class="stat-number">${paused}</div><div class="stat-label">Paused</div></div>
    `;
  }

  // ============ SESSION ACTIONS (unchanged) ==========
  async function openAssignModal(deviceId, deviceCode) {
    selectedDeviceForAssign = { id: deviceId, code: deviceCode };
    const { data: locations } = await supabase.from('shisha_locations').select('name').eq('is_active', true);
    const { data: flavours } = await supabase.from('shisha_products').select('name').eq('is_available', true);
    document.getElementById('assignLocation').innerHTML = (locations || []).map(l => `<option>${l.name}</option>`).join('');
    document.getElementById('assignFlavour').innerHTML = (flavours || []).map(f => `<option>${f.name}</option>`).join('');
    document.getElementById('assignModal').style.display = 'flex';
  }
  document.getElementById('assignPayment').addEventListener('change', () => {
    document.getElementById('assignAccountField').style.display = document.getElementById('assignPayment').value === 'wallet' ? 'block' : 'none';
  });
  document.getElementById('confirmAssignBtn').onclick = async () => {
    const locationName = document.getElementById('assignLocation').value;
    const flavourName = document.getElementById('assignFlavour').value;
    const payment = document.getElementById('assignPayment').value;
    const accountId = document.getElementById('assignAccountId').value.trim();
    if (payment === 'wallet' && !accountId) { showAlertModal("Account ID needed"); return; }
    if (payment === 'wallet') {
      const res = await deductFromWallet(accountId, SESSION_PRICE, `New session ${selectedDeviceForAssign.code}`);
      if (!res.success) { showAlertModal(res.error); return; }
    }
    const { data: product } = await supabase.from('shisha_products').select('id').eq('name', flavourName).limit(1);
    const { data: location } = await supabase.from('shisha_locations').select('id').eq('name', locationName).limit(1);
    if (!product?.length || !location?.length) { showAlertModal("Invalid flavour/location"); return; }
    await supabase.from('shisha_sessions').insert({
      device_id: selectedDeviceForAssign.id,
      product_id: product[0].id,
      location_id: location[0].id,
      start_time: new Date().toISOString(),
      last_refill_time: new Date().toISOString(),
      remaining_time_seconds: DURATION_SECONDS,
      total_amount: SESSION_PRICE,
      status: 'active',
      payment_method: payment,
      account_id: payment === 'wallet' ? accountId : null
    });
    closeModals();
    showToast(`✅ Session started on ${selectedDeviceForAssign.code}`);
    await loadSessions(); await loadDevices();
  };
  document.getElementById('cancelAssignBtn').onclick = () => closeModals();

  async function openRefillModal(sessionId) {
    const sess = activeSessions.find(s => s.id === sessionId);
    if (!sess) return;
    selectedPipeForAction = sess;
    document.getElementById('refillInfo').innerHTML = `${sess.shishaId} | ${sess.flavour} | Total: R${sess.amount}`;
    document.getElementById('refillModal').style.display = 'flex';
  }
  document.getElementById('confirmRefillBtn').onclick = async () => {
    const sess = selectedPipeForAction;
    if (sess.paymentMethod?.toLowerCase().includes('wallet') && sess.accountId) {
      const res = await deductFromWallet(sess.accountId, REFILL_PRICE, `Refill ${sess.shishaId}`);
      if (!res.success) { showAlertModal(res.error); return; }
    }
    await supabase.from('shisha_sessions').update({
      last_refill_time: new Date().toISOString(),
      remaining_time_seconds: DURATION_SECONDS,
      status: 'active',
      total_amount: sess.amount + REFILL_PRICE,
      refill_count: (sess.refillCount || 0) + 1
    }).eq('id', sess.id);
    closeModals();
    showToast(`✅ Refilled ${sess.shishaId}`);
    await loadSessions();
  };
  document.getElementById('cancelRefillBtn').onclick = () => closeModals();

  async function openPauseModal(sessionId) {
    const sess = activeSessions.find(s => s.id === sessionId);
    if (!sess || sess.paused) { showAlertModal("Cannot pause"); return; }
    selectedPipeForAction = sess;
    document.getElementById('pauseModal').style.display = 'flex';
  }
  document.getElementById('confirmPauseBtn').onclick = async () => {
    if (selectedPipeForAction) {
      await supabase.from('shisha_sessions').update({ paused: true, status: 'paused' }).eq('id', selectedPipeForAction.id);
      closeModals();
      showToast(`⏸️ ${selectedPipeForAction.shishaId} paused`);
      await loadSessions();
    }
  };
  document.getElementById('cancelPauseBtn').onclick = () => closeModals();

  async function resumeSession(sessionId) {
    const sess = activeSessions.find(s => s.id === sessionId);
    if (sess?.paused) {
      let newStatus = sess.remainingTime <= 0 ? 'expired' : (sess.remainingTime <= REFILL_THRESHOLD*60 ? 'refill' : 'active');
      await supabase.from('shisha_sessions').update({ paused: false, status: newStatus }).eq('id', sess.id);
      showToast(`▶️ ${sess.shishaId} resumed`);
      await loadSessions();
    }
  }
  async function endSession(sessionId) {
    const sess = activeSessions.find(s => s.id === sessionId);
    if (sess && confirm(`End session for ${sess.shishaId}? Total: R${sess.amount}`)) {
      await supabase.from('shisha_sessions').update({ status: 'expired', ended_at: new Date().toISOString() }).eq('id', sess.id);
      showToast(`❌ ${sess.shishaId} ended`);
      await loadSessions();
    }
  }

  // ============ INITIALIZATION ==========
  async function init() {
    await loadDevices();
    await loadSessions();
    await loadRequests();
    startCountdownUpdater();   // start live 1-second updates
    // Keep existing 3-second refresh for sessions/requests (realtime)
    setInterval(async () => { 
      await loadSessions(); 
      await loadRequests(); 
    }, 3000);
  }
  init();
</script>
</body>
