<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shisha Premium · Staff Console</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ========== EMBEDDED MODULE BASE ========== */
    :root {
      --red: #E30613;
      --red-dark: #a0010e;
      --red-deep: #8A0009;
      --red-glow: rgba(227,6,19,0.18);
      --red-subtle: rgba(227,6,19,0.06);
      --ink: #1e293b;
      --ink-muted: #334155;
      --slate: #475569;
      --mist: #94a3b8;
      --bone: #f8fafd;
      --white: #ffffff;
      --card-bg: #ffffff;
      --border: rgba(0,0,0,0.07);
      --border-strong: #eef2f8;
      --shadow-soft: 0 8px 20px -6px rgba(0,0,0,0.12);
      --shadow-card: 0 4px 24px rgba(0,0,0,0.08);
      --shadow-float: 0 16px 48px rgba(0,0,0,0.14);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-xl: 32px;
      --radius-full: 9999px;
      --transition: all 0.22s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      --green: #10b981;
      --yellow: #f59e0b;
      --orange: #f97316;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--bone);
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100%;
      padding: 24px;
    }

    .shisha-dashboard {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      overflow: hidden;
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-soft);
      transition: var(--transition);
      margin-bottom: 0;
    }

    .card-header {
      padding: 20px 24px;
      background: var(--white);
      border-bottom: 2px solid var(--border-strong);
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink);
    }

    .card-header i {
      color: var(--red);
      margin-right: 8px;
    }

    .card-body {
      padding: 20px 24px;
    }

    .badge-red {
      background: var(--red);
      color: white;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .stats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
    }

    .stat-item {
      background: var(--bone);
      border-radius: var(--radius-lg);
      padding: 12px 8px;
      text-align: center;
      flex: 1;
      min-width: 70px;
    }
    .stat-number {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--red);
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--slate);
      margin-top: 4px;
    }

    .requests-container {
      max-height: 320px;
      overflow-y: auto;
      margin-top: 12px;
    }
    .request-item {
      background: var(--bone);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .request-info { font-size: 0.85rem; color: var(--ink); }
    .request-buttons { display: flex; gap: 8px; }
    .btn-approve {
      background: #10b981;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reject {
      background: var(--red);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-weight: 600;
      cursor: pointer;
    }

    .pipes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .pipe-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 16px;
      border-left: 4px solid;
      transition: var(--transition);
      box-shadow: var(--shadow-soft);
    }
    .pipe-card.available { border-left-color: #10b981; }
    .pipe-card.inuse { border-left-color: var(--red); }
    .pipe-card.refill { border-left-color: #f59e0b; background: #fffbeb; }
    .pipe-card.expired { border-left-color: #6b7280; background: #f3f4f6; }
    .pipe-card.paused { border-left-color: #ff9800; background: #fff8e1; }

    .pipe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .pipe-code { font-weight: 800; font-size: 1.1rem; color: var(--ink); }
    .pipe-status {
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-weight: 600;
    }
    .pipe-status.available { background: #e8f5e9; color: #2e7d32; }
    .pipe-status.inuse { background: #ffebee; color: var(--red); }
    .pipe-status.refill { background: #fff3e0; color: #ef6c00; }
    .pipe-status.expired { background: #e5e7eb; color: #4b5563; }
    .pipe-status.paused { background: #fff8e1; color: #ff8f00; }

    .timer {
      font-family: monospace;
      font-size: 1.3rem;
      font-weight: 800;
      margin: 8px 0;
      color: var(--ink);
    }
    .timer.expired { color: var(--red); }
    .timer.refill { color: #f59e0b; animation: pulse 1s infinite; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .pipe-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .pipe-actions button {
      padding: 8px 12px;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-assign { background: var(--red); color: white; }
    .btn-refill { background: #f59e0b; color: white; }
    .btn-pause { background: #ff9800; color: white; }
    .btn-resume { background: #10b981; color: white; }
    .btn-end { background: #6b7280; color: white; }

    /* Modal Styles - Matching POS */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-container {
      background: var(--white);
      border-radius: var(--radius-xl);
      max-width: 400px;
      width: 90%;
      padding: 28px 24px;
      text-align: center;
      box-shadow: var(--shadow-card);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-container {
      transform: scale(1);
    }
    .modal-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--ink);
    }
    .modal-message {
      color: var(--slate);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .modal-btn {
      padding: 10px 24px;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .modal-btn.confirm {
      background: var(--red);
      color: white;
    }
    .modal-btn.cancel {
      background: var(--bone);
      color: var(--ink);
      border: 1px solid var(--border-strong);
    }
    .modal-btn.confirm:hover {
      background: var(--red-dark);
    }
    .modal-btn.cancel:hover {
      background: var(--border-strong);
    }

    .toast-pos {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: white;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-weight: 500;
      z-index: 10002;
      transition: transform 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }
    .toast-pos.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 900px) {
      .shisha-dashboard { grid-template-columns: 1fr; gap: 20px; }
      body { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="shisha-dashboard">
  <!-- LEFT COLUMN: Requests + Stats -->
  <div>
    <div class="card" style="margin-bottom: 24px;">
      <div class="card-header">
        <span><i class="fas fa-concierge-bell"></i> Service requests</span>
        <span id="requestBadge" class="badge-red">0</span>
      </div>
      <div class="card-body">
        <div class="requests-container" id="requestsList"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <span><i class="fas fa-chart-simple"></i> Live status</span>
      </div>
      <div class="card-body">
        <div class="stats-grid" id="statsContainer"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN: Hookah stations -->
  <div class="card">
    <div class="card-header">
      <span><i class="fas fa-smoking"></i> Hookah stations · R250 session</span>
    </div>
    <div class="card-body">
      <div id="pipesGrid" class="pipes-grid"></div>
    </div>
  </div>
</div>

<!-- Modal Component - Matching POS -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-container">
    <div id="modalIcon" class="modal-icon"></div>
    <div id="modalTitle" class="modal-title"></div>
    <div id="modalMessage" class="modal-message"></div>
    <div id="modalButtons" class="modal-buttons"></div>
  </div>
</div>

<div id="toastMsg" class="toast-pos"></div>

<script type="module">
  import { supabase } from '../config/supabase.js';

  // ============ CONSTANTS (Matching POS) ==========
  const SESSION_PRICE = 250;
  const REFILL_PRICE = 250;
  const COAL_DURATION = 60; // minutes
  const REFILL_THRESHOLD = 15; // minutes

  let activeSessions = [];
  let allDevices = [];
  let selectedPipeForAction = null;
  let selectedDeviceForAssign = null;
  let countdownInterval = null;
  let realtimeSubscription = null;

  // ============ MODAL SYSTEM (Matching POS) ==========
  function showModal(type, title, message, onConfirm = null, onCancel = null) {
    const overlay = document.getElementById('modalOverlay');
    const iconEl = document.getElementById('modalIcon');
    const titleEl = document.getElementById('modalTitle');
    const messageEl = document.getElementById('modalMessage');
    const buttonsEl = document.getElementById('modalButtons');
    
    const icons = {
      success: '✅',
      error: '❌',
      warning: '⚠️',
      confirm: '❓'
    };
    
    iconEl.innerHTML = icons[type] || icons.warning;
    titleEl.innerText = title;
    messageEl.innerText = message;
    
    buttonsEl.innerHTML = '';
    
    if (type === 'confirm' && onConfirm) {
      const confirmBtn = document.createElement('button');
      confirmBtn.className = 'modal-btn confirm';
      confirmBtn.innerText = 'Confirm';
      confirmBtn.onclick = () => {
        closeModal();
        onConfirm();
      };
      buttonsEl.appendChild(confirmBtn);
      
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'modal-btn cancel';
      cancelBtn.innerText = 'Cancel';
      cancelBtn.onclick = () => {
        closeModal();
        if (onCancel) onCancel();
      };
      buttonsEl.appendChild(cancelBtn);
    } else {
      const okBtn = document.createElement('button');
      okBtn.className = 'modal-btn confirm';
      okBtn.innerText = 'OK';
      okBtn.onclick = closeModal;
      buttonsEl.appendChild(okBtn);
    }
    
    overlay.classList.add('active');
  }
  
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  function showToast(message, isError = false) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = message;
    toast.style.background = isError ? 'var(--red)' : 'var(--ink)';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ============ HELPER FUNCTIONS (Matching POS logic) ==========
  
  // Calculate remaining seconds - SAME LOGIC AS POS
  function calculateRemainingSeconds(session) {
    if (!session) return 0;
    
    // For paused sessions, use stored remaining time
    if (session.paused) {
      return session.remaining_time_seconds || 0;
    }
    
    // For active/refill sessions, calculate based on last refill time
    const referenceTime = session.last_refill_time ? new Date(session.last_refill_time) : new Date(session.start_time);
    const now = new Date();
    const elapsedSeconds = (now - referenceTime) / 1000;
    const totalDuration = COAL_DURATION * 60;
    let remaining = totalDuration - elapsedSeconds;
    
    return remaining > 0 ? remaining : 0;
  }

  function formatTime(seconds) {
    if (seconds <= 0) return "EXPIRED";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  // Determine session status based on remaining time - SAME AS POS
  function determineSessionStatus(session) {
    if (!session) return 'available';
    if (session.paused) return 'paused';
    if (session.status === 'expired') return 'expired';
    
    const remainingSec = calculateRemainingSeconds(session);
    if (remainingSec <= 0) return 'expired';
    if (remainingSec <= REFILL_THRESHOLD * 60) return 'refill';
    return 'active';
  }

  // Validate hookah availability (same as POS)
  async function isHookahAvailable(deviceId) {
    const { data, error } = await supabase
      .from('shisha_sessions')
      .select('id')
      .eq('device_id', deviceId)
      .in('status', ['active', 'refill', 'paused'])
      .maybeSingle();
    
    if (error) {
      console.error('Error checking hookah availability:', error);
      return false;
    }
    return !data;
  }

  // ============ DATA LOADING (Matching POS queries) ==========
  async function loadDevices() {
    const { data, error } = await supabase
      .from('hookah_devices')
      .select('*')
      .order('device_code');
    
    if (error) {
      console.error('Error loading devices:', error);
      return [];
    }
    
    allDevices = data;
    return data;
  }

  async function loadSessions() {
    const { data, error } = await supabase
      .from('shisha_sessions')
      .select(`
        id, 
        device_id, 
        product_id, 
        location_id,
        start_time, 
        last_refill_time, 
        remaining_time_seconds,
        total_amount, 
        refill_count, 
        status, 
        paused,
        payment_method,
        account_id,
        hookah_devices(device_code),
        shisha_products(name),
        shisha_locations(name)
      `)
      .in('status', ['active', 'refill', 'paused']);
    
    if (error) {
      console.error('Error loading sessions:', error);
      return;
    }
    
    // Process sessions (same as POS)
    activeSessions = data.map(s => ({
      id: s.id,
      deviceId: s.device_id,
      device_code: s.hookah_devices?.device_code,
      flavour_name: s.shisha_products?.name,
      location_name: s.shisha_locations?.name,
      start_time: s.start_time,
      last_refill_time: s.last_refill_time,
      remaining_time_seconds: s.remaining_time_seconds,
      total_amount: s.total_amount,
      refill_count: s.refill_count || 0,
      status: determineSessionStatus({ 
        paused: s.paused, 
        status: s.status,
        last_refill_time: s.last_refill_time,
        start_time: s.start_time,
        remaining_time_seconds: s.remaining_time_seconds
      }),
      paused: s.paused,
      payment_method: s.payment_method,
      account_id: s.account_id
    }));
    
    renderPipes();
    updateStats();
  }

  async function loadRequests() {
    const { data, error } = await supabase
      .from('shisha_requests')
      .select('*')
      .eq('status', 'pending')
      .order('created_at', { ascending: false });
    
    if (error) {
      console.error('Error loading requests:', error);
      return;
    }
    
    const pending = data || [];
    document.getElementById('requestBadge').innerText = pending.length;
    const container = document.getElementById('requestsList');
    
    if (pending.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:24px; color:var(--mist);">✅ No pending requests</div>';
      return;
    }
    
    container.innerHTML = pending.map(r => `
      <div class="request-item" data-id="${r.id}">
        <div class="request-info">
          <strong>${r.request_type.replace(/_/g, ' ').toUpperCase()}</strong><br>
          <small>📍 ${r.location_name || 'Lounge'} | 🍃 ${r.flavour_name || '-'}</small><br>
          <small>👤 ${r.customer_phone || 'Guest'} | ${r.device_code || 'New'}</small>
        </div>
        <div class="request-buttons">
          <button class="btn-approve" data-id="${r.id}">Approve</button>
          <button class="btn-reject" data-id="${r.id}">Reject</button>
        </div>
      </div>
    `).join('');
    
    document.querySelectorAll('.btn-approve').forEach(btn => 
      btn.addEventListener('click', () => approveRequest(btn.dataset.id))
    );
    document.querySelectorAll('.btn-reject').forEach(btn => 
      btn.addEventListener('click', () => rejectRequest(btn.dataset.id))
    );
  }

  // ============ REQUEST HANDLING ==========
  async function approveRequest(requestId) {
    const { data: req, error: fetchErr } = await supabase
      .from('shisha_requests')
      .select('*')
      .eq('id', requestId)
      .single();
    
    if (fetchErr || !req) {
      showModal('error', 'Error', "Request not found");
      return;
    }
    
    try {
      switch (req.request_type) {
        case 'coal_refill':
          await handleRefillRequest(req);
          break;
        case 'new_order':
          await handleNewOrderRequest(req);
          break;
        default:
          showModal('warning', 'Warning', `Unknown request type: ${req.request_type}`);
          return;
      }
      
      await supabase
        .from('shisha_requests')
        .update({ status: 'approved', responded_at: new Date().toISOString() })
        .eq('id', requestId);
      
      showToast(`✅ Request approved successfully`);
      await Promise.all([loadSessions(), loadRequests(), loadDevices()]);
      
    } catch (err) {
      showModal('error', 'Error', err.message);
    }
  }

  async function handleRefillRequest(req) {
    const session = activeSessions.find(s => s.id === req.session_id);
    if (!session) throw new Error("Session not found");
    if (session.paused) throw new Error("Session is paused, cannot refill");
    
    // Check if hookah is still active
    const { data: currentSession } = await supabase
      .from('shisha_sessions')
      .select('status, paused')
      .eq('id', session.id)
      .single();
    
    if (!currentSession || currentSession.paused || currentSession.status === 'expired') {
      throw new Error("Session is no longer active");
    }
    
    const newTotal = session.total_amount + REFILL_PRICE;
    const newRefillCount = (session.refill_count || 0) + 1;
    
    const { error } = await supabase
      .from('shisha_sessions')
      .update({
        last_refill_time: new Date().toISOString(),
        remaining_time_seconds: COAL_DURATION * 60,
        status: 'active',
        total_amount: newTotal,
        refill_count: newRefillCount
      })
      .eq('id', session.id);
    
    if (error) throw new Error(`Failed to process refill: ${error.message}`);
    showToast(`✅ Refill approved for ${session.device_code}`);
  }

  async function handleNewOrderRequest(req) {
    // Find available hookah
    const { data: freeDevice, error: deviceError } = await supabase
      .from('hookah_devices')
      .select('id, device_code')
      .eq('status', 'available')
      .limit(1);
    
    if (deviceError || !freeDevice || freeDevice.length === 0) {
      throw new Error("No available hookah stations");
    }
    
    // Double-check no active session exists
    const isAvailable = await isHookahAvailable(freeDevice[0].id);
    if (!isAvailable) throw new Error("Hookah was just taken by another session");
    
    const deviceId = freeDevice[0].id;
    const { data: product } = await supabase
      .from('shisha_products')
      .select('id')
      .eq('name', req.flavour_name)
      .limit(1);
    
    const { data: location } = await supabase
      .from('shisha_locations')
      .select('id')
      .eq('name', req.location_name)
      .limit(1);
    
    if (!product?.length || !location?.length) {
      throw new Error("Flavour or location not found");
    }
    
    const { error: insertError } = await supabase
      .from('shisha_sessions')
      .insert({
        device_id: deviceId,
        product_id: product[0].id,
        location_id: location[0].id,
        start_time: new Date().toISOString(),
        last_refill_time: new Date().toISOString(),
        remaining_time_seconds: COAL_DURATION * 60,
        total_amount: SESSION_PRICE,
        status: 'active',
        customer_phone: req.customer_phone || 'walkin_customer',
        payment_method: 'cash'
      });
    
    if (insertError) throw new Error(`Failed to create session: ${insertError.message}`);
    showToast(`✅ New session started on ${freeDevice[0].device_code}`);
  }

  async function rejectRequest(requestId) {
    await supabase
      .from('shisha_requests')
      .update({ status: 'rejected', responded_at: new Date().toISOString() })
      .eq('id', requestId);
    
    showToast("Request rejected");
    await loadRequests();
  }

  // ============ UI RENDERING (Matching POS display) ==========
  function updateAllTimers() {
    document.querySelectorAll('.timer-value').forEach(elem => {
      const sessionId = elem.getAttribute('data-session-id');
      if (!sessionId) return;
      
      const session = activeSessions.find(s => s.id === sessionId);
      if (!session) return;
      
      const remainingSec = calculateRemainingSeconds(session);
      const status = determineSessionStatus(session);
      
      if (remainingSec <= 0 || status === 'expired') {
        elem.innerText = "EXPIRED";
        elem.classList.add('expired');
        elem.classList.remove('refill');
      } else if (status === 'refill') {
        elem.innerText = formatTime(remainingSec);
        elem.classList.add('refill');
        elem.classList.remove('expired');
      } else {
        elem.innerText = formatTime(remainingSec);
        elem.classList.remove('expired', 'refill');
      }
    });
  }

  function startCountdownUpdater() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      updateAllTimers();
    }, 1000);
  }

  function renderPipes() {
    if (!allDevices.length) return;
    
    const container = document.getElementById('pipesGrid');
    container.innerHTML = allDevices.map(device => {
      const session = activeSessions.find(s => s.deviceId === device.id);
      let statusClass = "available", statusText = "Free";
      let flavour = "-", location = "-";
      let timerValue = "00:00";
      let timerClass = "";
      
      if (session) {
        flavour = session.flavour_name || "-";
        location = session.location_name || "-";
        const remainingSec = calculateRemainingSeconds(session);
        const status = determineSessionStatus(session);
        
        if (remainingSec <= 0 || status === 'expired') {
          timerValue = "EXPIRED";
          timerClass = "expired";
        } else {
          timerValue = formatTime(remainingSec);
          timerClass = status === 'refill' ? "refill" : "";
        }
        
        if (session.paused) {
          statusClass = "paused";
          statusText = "Paused";
        } else if (status === 'expired') {
          statusClass = "expired";
          statusText = "Expired";
        } else if (status === 'refill') {
          statusClass = "refill";
          statusText = "Refill soon";
        } else {
          statusClass = "inuse";
          statusText = "In use";
        }
      }
      
      return `<div class="pipe-card ${statusClass}" data-device-id="${device.id}">
        <div class="pipe-header">
          <span class="pipe-code">${device.device_code}</span>
          <span class="pipe-status ${statusClass}">${statusText}</span>
        </div>
        <div><small>📍 ${location} | 🍃 ${flavour}</small></div>
        <div class="timer ${timerClass}">⏱️ <span class="timer-value" data-session-id="${session ? session.id : ''}">${timerValue}</span></div>
        <div class="pipe-actions">
          ${!session ? 
            `<button class="btn-assign" data-device-id="${device.id}" data-device-code="${device.device_code}">Assign (R250)</button>` :
            `<button class="btn-refill" data-session-id="${session.id}">Refill (R250)</button>
             <button class="btn-pause" data-session-id="${session.id}">Pause</button>
             ${session.paused ? `<button class="btn-resume" data-session-id="${session.id}">Resume</button>` : ''}
             <button class="btn-end" data-session-id="${session.id}">End</button>`
          }
        </div>
      </div>`;
    }).join('');
    
    // Re-attach event listeners
    document.querySelectorAll('.btn-assign').forEach(btn => 
      btn.addEventListener('click', () => openAssignModal(btn.dataset.deviceId, btn.dataset.deviceCode))
    );
    document.querySelectorAll('.btn-refill').forEach(btn => 
      btn.addEventListener('click', () => openRefillModal(btn.dataset.sessionId))
    );
    document.querySelectorAll('.btn-pause').forEach(btn => 
      btn.addEventListener('click', () => openPauseModal(btn.dataset.sessionId))
    );
    document.querySelectorAll('.btn-resume').forEach(btn => 
      btn.addEventListener('click', () => resumeSession(btn.dataset.sessionId))
    );
    document.querySelectorAll('.btn-end').forEach(btn => 
      btn.addEventListener('click', () => endSession(btn.dataset.sessionId))
    );
  }

  function updateStats() {
    let available = 0, inuse = 0, refill = 0, expired = 0, paused = 0;
    
    for (let device of allDevices) {
      const session = activeSessions.find(s => s.deviceId === device.id);
      
      if (!session) {
        available++;
      } else if (session.paused) {
        paused++;
      } else {
        const status = determineSessionStatus(session);
        if (status === 'expired') expired++;
        else if (status === 'refill') refill++;
        else inuse++;
      }
    }
    
    document.getElementById('statsContainer').innerHTML = `
      <div class="stat-item"><div class="stat-number">${available}</div><div class="stat-label">Free</div></div>
      <div class="stat-item"><div class="stat-number">${inuse}</div><div class="stat-label">In use</div></div>
      <div class="stat-item"><div class="stat-number">${refill}</div><div class="stat-label">Refill soon</div></div>
      <div class="stat-item"><div class="stat-number">${expired}</div><div class="stat-label">Expired</div></div>
      <div class="stat-item"><div class="stat-number">${paused}</div><div class="stat-label">Paused</div></div>
    `;
  }

  // ============ SESSION ACTIONS (Matching POS functionality) ==========
  async function openAssignModal(deviceId, deviceCode) {
    const isAvailable = await isHookahAvailable(deviceId);
    if (!isAvailable) {
      showModal('error', 'Not Available', "This hookah is no longer available. Please refresh and try again.");
      await loadSessions();
      return;
    }
    
    selectedDeviceForAssign = { id: deviceId, code: deviceCode };
    
    const { data: locations } = await supabase
      .from('shisha_locations')
      .select('name')
      .eq('is_active', true);
    
    const { data: flavours } = await supabase
      .from('shisha_products')
      .select('name')
      .eq('is_available', true);
    
    // Create modal content dynamically
    const modalContent = `
      <div style="text-align: left;">
        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Location</label>
        <select id="assignLocationSelect" style="width: 100%; padding: 10px; border-radius: 60px; border: 1px solid #eef2f8; margin-bottom: 16px;">
          ${(locations || []).map(l => `<option>${l.name}</option>`).join('')}
        </select>
        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Flavour</label>
        <select id="assignFlavourSelect" style="width: 100%; padding: 10px; border-radius: 60px; border: 1px solid #eef2f8; margin-bottom: 16px;">
          ${(flavours || []).map(f => `<option>${f.name}</option>`).join('')}
        </select>
      </div>
    `;
    
    showModal('confirm', `Assign New Session - ${deviceCode}`, modalContent, async () => {
      const locationName = document.getElementById('assignLocationSelect').value;
      const flavourName = document.getElementById('assignFlavourSelect').value;
      
      const finalCheck = await isHookahAvailable(deviceId);
      if (!finalCheck) {
        showModal('error', 'Not Available', `${deviceCode} is no longer available.`);
        return;
      }
      
      const { data: product } = await supabase
        .from('shisha_products')
        .select('id')
        .eq('name', flavourName)
        .limit(1);
      
      const { data: location } = await supabase
        .from('shisha_locations')
        .select('id')
        .eq('name', locationName)
        .limit(1);
      
      if (!product?.length || !location?.length) {
        showModal('error', 'Error', "Invalid flavour or location");
        return;
      }
      
      const { error } = await supabase
        .from('shisha_sessions')
        .insert({
          device_id: deviceId,
          product_id: product[0].id,
          location_id: location[0].id,
          start_time: new Date().toISOString(),
          last_refill_time: new Date().toISOString(),
          remaining_time_seconds: COAL_DURATION * 60,
          total_amount: SESSION_PRICE,
          refill_count: 0,
          status: 'active',
          paused: false,
          payment_method: 'cash',
          customer_phone: 'walkin_customer'
        });
      
      if (error) {
        showModal('error', 'Error', `Failed to start session: ${error.message}`);
      } else {
        showToast(`✅ Session started on ${deviceCode}`);
        await loadSessions();
        await loadDevices();
      }
    });
  }

  async function openRefillModal(sessionId) {
    const session = activeSessions.find(s => s.id === sessionId);
    if (!session) return;
    
    if (session.paused) {
      showModal('warning', 'Cannot Refill', "Session is paused. Resume before refilling.");
      return;
    }
    
    showModal('confirm', 'Confirm Refill', 
      `Refill ${session.device_code} for R${REFILL_PRICE}? Total will be R${session.total_amount + REFILL_PRICE}`,
      async () => {
        const { data: currentSession } = await supabase
          .from('shisha_sessions')
          .select('status, paused')
          .eq('id', session.id)
          .single();
        
        if (!currentSession || currentSession.paused || currentSession.status === 'expired') {
          showModal('error', 'Error', "Session is no longer active");
          await loadSessions();
          return;
        }
        
        const newTotal = session.total_amount + REFILL_PRICE;
        const newRefillCount = (session.refill_count || 0) + 1;
        
        const { error } = await supabase
          .from('shisha_sessions')
          .update({
            last_refill_time: new Date().toISOString(),
            remaining_time_seconds: COAL_DURATION * 60,
            status: 'active',
            total_amount: newTotal,
            refill_count: newRefillCount
          })
          .eq('id', session.id);
        
        if (error) {
          showModal('error', 'Error', `Failed to refill: ${error.message}`);
        } else {
          showToast(`✅ Refilled ${session.device_code}`);
          await loadSessions();
        }
      }
    );
  }

  async function openPauseModal(sessionId) {
    const session = activeSessions.find(s => s.id === sessionId);
    if (!session || session.paused) {
      showModal('warning', 'Cannot Pause', "Session is already paused or not active");
      return;
    }
    
    showModal('confirm', 'Pause Session', `Pause ${session.device_code}?`, async () => {
      const remainingSec = calculateRemainingSeconds(session);
      
      const { error } = await supabase
        .from('shisha_sessions')
        .update({ 
          paused: true, 
          status: 'paused',
          remaining_time_seconds: Math.max(0, remainingSec)
        })
        .eq('id', session.id);
      
      if (error) {
        showModal('error', 'Error', `Failed to pause: ${error.message}`);
      } else {
        showToast(`⏸️ ${session.device_code} paused`);
        await loadSessions();
      }
    });
  }

  async function resumeSession(sessionId) {
    const session = activeSessions.find(s => s.id === sessionId);
    if (!session?.paused) {
      showModal('warning', 'Cannot Resume', "Session is not paused");
      return;
    }
    
    const remainingTime = session.remaining_time_seconds || 0;
    let newStatus = remainingTime <= 0 ? 'expired' : (remainingTime <= REFILL_THRESHOLD * 60 ? 'refill' : 'active');
    
    const { error } = await supabase
      .from('shisha_sessions')
      .update({ paused: false, status: newStatus })
      .eq('id', session.id);
    
    if (error) {
      showModal('error', 'Error', `Failed to resume: ${error.message}`);
    } else {
      showToast(`▶️ ${session.device_code} resumed`);
      await loadSessions();
    }
  }

  async function endSession(sessionId) {
    const session = activeSessions.find(s => s.id === sessionId);
    if (!session) return;
    
    showModal('confirm', 'End Session', 
      `End session for ${session.device_code}? Total amount due: R${session.total_amount}`,
      async () => {
        const { error } = await supabase
          .from('shisha_sessions')
          .update({ 
            status: 'expired', 
            ended_at: new Date().toISOString()
          })
          .eq('id', session.id);
        
        if (error) {
          showModal('error', 'Error', `Failed to end session: ${error.message}`);
        } else {
          showToast(`❌ ${session.device_code} ended`);
          await loadSessions();
          await loadDevices();
        }
      }
    );
  }

  // ============ REALTIME SUBSCRIPTIONS ==========
  function setupRealtimeSubscriptions() {
    if (realtimeSubscription) {
      realtimeSubscription.unsubscribe();
    }
    
    realtimeSubscription = supabase
      .channel('shisha-console-changes')
      .on('postgres_changes', 
        { event: '*', schema: 'public', table: 'shisha_sessions' }, 
        () => {
          console.log('Session change detected, reloading...');
          loadSessions();
          loadDevices();
        }
      )
      .on('postgres_changes', 
        { event: '*', schema: 'public', table: 'shisha_requests' }, 
        () => {
          console.log('Request change detected, reloading...');
          loadRequests();
        }
      )
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          console.log('Realtime subscription active');
        }
      });
  }

  // ============ INITIALIZATION ==========
  async function init() {
    await loadDevices();
    await loadSessions();
    await loadRequests();
    startCountdownUpdater();
    setupRealtimeSubscriptions();
    
    // Periodic refresh as backup
    setInterval(async () => { 
      await loadSessions(); 
      await loadRequests();
      await loadDevices();
    }, 5000);
  }
  
  init();
</script>
</body>
</html>
