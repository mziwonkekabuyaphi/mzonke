<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Rands Smart Counter · Collection</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: #0D0F12;
        min-height: 100vh;
        padding: 0;
        margin: 0;
        color: #F0F2F8;
    }

    /* ========== DARK THEME — UNCHANGED FROM ORIGINAL CONSOLE ========== */
    :root {
        --red: #E30613;
        --red-dark: #a0010e;
        --red-dim: rgba(227,6,19,0.12);
        --red-border: rgba(227,6,19,0.25);
        --bg: #0D0F12;
        --surface: #141720;
        --surface2: #1C2030;
        --surface3: #232840;
        --border: rgba(255,255,255,0.06);
        --border2: rgba(255,255,255,0.1);
        --text: #F0F2F8;
        --text2: #8B92A8;
        --text3: #555E78;
        --green: #22C55E;
        --amber: #F59E0B;
        --gold: #FBBF24;
        --shadow-sm: 0 2px 6px rgba(0,0,0,0.4);
        --shadow-md: 0 8px 20px -6px rgba(0,0,0,0.5);
        --radius-full: 9999px;
        --radius-lg: 24px;
        --radius-md: 20px;
        --transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .collection-panel {
        width: 100%;
        max-width: 100%;
        background: var(--bg);
        border-radius: 0;
        overflow: hidden;
    }

    .stats-row {
        background: var(--surface);
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        gap: 12px;
        flex-wrap: wrap;
    }

    .panel-title {
        display: flex; align-items: center; gap: 10px;
        font-weight: 800; font-size: 1rem; color: var(--text);
    }
    .panel-title i { color: var(--red); }

    .ready-counter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--red-dim);
        padding: 6px 18px;
        border-radius: 60px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--red);
        border: 1px solid var(--red-border);
    }
    .ready-counter i { font-size: 0.9rem; }
    .ready-counter span {
        font-size: 1.3rem;
        font-weight: 800;
        margin: 0 3px;
        color: var(--red);
    }

    .orders-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 18px;
        padding: 20px;
        background: var(--bg);
        max-height: calc(100vh - 90px);
        overflow-y: auto;
    }

    .order-card {
        background: var(--surface);
        border-radius: 24px;
        border: 1px solid var(--border);
        transition: var(--transition);
        box-shadow: var(--shadow-sm);
        position: relative;
        animation: cardIn 0.4s cubic-bezier(.2,.8,.3,1);
    }
    .order-card:hover {
        border-color: var(--red-border);
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
    }
    @keyframes cardIn {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .order-card.vvip-card {
        border-left: 4px solid var(--gold);
        background: linear-gradient(145deg, var(--surface), rgba(251,191,36,0.05));
        position: relative;
        box-shadow: 0 0 0 1px rgba(251,191,36,0.15), var(--shadow-sm);
        animation: cardIn 0.4s cubic-bezier(.2,.8,.3,1), vvipShimmer 2.6s ease-in-out infinite;
    }
    @keyframes vvipShimmer {
        0%,100% { box-shadow: 0 0 0 1px rgba(251,191,36,0.15), var(--shadow-sm); }
        50% { box-shadow: 0 0 22px 2px rgba(251,191,36,0.3), var(--shadow-sm); }
    }
    .order-card.vvip-card::before {
        content: "⚡ VVIP";
        position: absolute;
        top: -10px;
        right: 18px;
        background: var(--gold);
        color: #1e1a0c;
        font-size: 9px;
        font-weight: 800;
        padding: 3px 14px;
        border-radius: 40px;
        letter-spacing: 0.3px;
        z-index: 5;
        box-shadow: var(--shadow-sm);
    }
    .vvip-badge {
        background: var(--gold);
        color: #1e1a0c;
        font-size: 9px;
        font-weight: 800;
        padding: 3px 10px;
        border-radius: 30px;
        margin-left: 8px;
        display: inline-block;
    }
    .vvip-tab-note {
        font-size: 10px; color: var(--gold); margin-top: 6px; font-weight: 600;
        display: flex; align-items: center; gap: 4px;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px 6px 18px;
        flex-wrap: wrap;
        gap: 8px;
    }
    .order-number {
        background: var(--red);
        color: white;
        font-weight: 700;
        font-size: 0.7rem;
        padding: 5px 14px;
        border-radius: 40px;
        font-family: 'Inter', monospace;
        letter-spacing: 0.2px;
    }
    .ready-badge {
        background: var(--green);
        color: white;
        font-size: 0.65rem;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: 30px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .source-badge {
        background: var(--red-dim);
        padding: 3px 10px;
        border-radius: 40px;
        font-size: 0.6rem;
        font-weight: 600;
        color: var(--red);
    }

    .customer-block {
        margin: 10px 18px;
        background: var(--surface2);
        border-radius: 18px;
        padding: 12px 14px;
        border: 1px solid var(--border);
    }
    .customer-name {
        font-weight: 800;
        color: var(--text);
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
    }
    .customer-phone {
        font-size: 0.7rem;
        color: var(--text2);
        margin-top: 6px;
        font-family: monospace;
    }
    .ready-time {
        font-size: 10px;
        margin-top: 6px;
        color: var(--text3);
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .ready-time.waiting-long { color: var(--amber); font-weight: 700; }
    .ready-time.waiting-very-long { color: var(--red); font-weight: 700; }

    .items-preview {
        margin: 10px 18px;
        background: var(--surface2);
        border-radius: 16px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        max-height: 130px;
        overflow-y: auto;
    }
    .item-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        font-size: 0.75rem;
        font-weight: 500;
        border-bottom: 1px solid var(--border);
        color: var(--text2);
    }
    .item-row:last-child { border-bottom: none; }
    .item-name { color: var(--text); }
    .item-price { color: var(--red); font-weight: 700; }

    .order-total-row {
        margin: 12px 18px 14px 18px;
        text-align: right;
        padding-top: 10px;
        border-top: 2px solid var(--red);
        font-size: 1rem;
        font-weight: 800;
        color: var(--red);
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        align-items: baseline;
    }
    .total-label { font-size: 0.7rem; font-weight: 600; color: var(--text2); }

    .collect-action { padding: 4px 18px 20px 18px; }
    .btn-collect {
        width: 100%;
        background: linear-gradient(135deg, var(--red), var(--red-dark));
        border: none;
        padding: 12px;
        border-radius: 60px;
        font-weight: 700;
        font-size: 0.8rem;
        color: white;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: 'Inter', sans-serif;
    }
    .btn-collect:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(227,6,19,0.3);
    }
    .btn-collect:active { transform: scale(0.98); }
    .btn-collect:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-collect.vvip-btn {
        background: linear-gradient(135deg, var(--gold), #c98a0f);
        color: #1e1a0c;
    }

    .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        background: var(--surface);
        border-radius: 32px;
        color: var(--text2);
        border: 1px dashed var(--red-border);
    }
    .empty-state i {
        font-size: 52px;
        color: var(--red);
        margin-bottom: 16px;
        opacity: 0.5;
    }
    .empty-state p { font-size: 0.85rem; }

    .orders-grid::-webkit-scrollbar { width: 5px; }
    .orders-grid::-webkit-scrollbar-track { background: var(--surface2); border-radius: 10px; }
    .orders-grid::-webkit-scrollbar-thumb { background: var(--red); border-radius: 10px; }

    .live-footer {
        display: flex;
        justify-content: flex-end;
        padding: 8px 20px 12px 20px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        font-size: 0.65rem;
        color: var(--text2);
        align-items: center;
        gap: 8px;
    }
    .live-dot {
        width: 7px;
        height: 7px;
        background: var(--green);
        border-radius: 50%;
        animation: pulse 1.6s infinite;
    }
    .live-dot.error { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    @media (max-width: 640px) {
        .orders-grid { grid-template-columns: 1fr; padding: 14px; }
        .stats-row { padding: 12px 16px; }
    }
</style>
</head>
<body>
<div class="collection-panel">
    <div class="stats-row">
        <div class="panel-title"><i class="fas fa-martini-glass-citrus"></i> Rands Smart Counter — Collection</div>
        <div class="ready-counter">
            <i class="fas fa-champagne-glasses"></i>
            <span id="readyCountValue">0</span> ready for pickup
        </div>
    </div>

    <div id="ordersGrid" class="orders-grid">
        <div class="empty-state">
            <i class="fas fa-hand-peace"></i>
            <p>Loading orders ...</p>
        </div>
    </div>

    <div class="live-footer">
        <div class="live-dot" id="liveDot"></div>
        <span id="connText">Connecting…</span>
        <i class="fas fa-check-circle" style="color: var(--green); font-size: 9px;"></i>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // Same Rands project as the other three consoles.
    const SUPABASE_URL = 'https://odpugxrihfspaucsdqjj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fCsjtPGF2zFngK_5DiUKag_tkJk_xo2';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let lastReadyCount = 0;
    let realtimeSub = null;
    let soundEnabled = true;
    let refreshDebounce = null;

    function showBriefMessage(msg, isNewOrder = false, isVVIP = false) {
        const connSpan = document.getElementById('connText');
        if (connSpan) {
            connSpan.innerHTML = isNewOrder ? `✨ ${msg}` : msg;
            setTimeout(() => { if (connSpan) connSpan.innerText = 'Live · ready orders'; }, 2500);
        }
        if (isNewOrder && soundEnabled) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (isVVIP) {
                    [[988,0,0.16,0.16],[1319,0.16,0.16,0.16],[1568,0.32,0.35,0.18]].forEach(([freq,delay,dur,vol]) => setTimeout(() => {
                        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                        osc.start(); osc.stop(audioCtx.currentTime + dur);
                    }, delay*1000));
                } else {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(660, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e) {}
        }
    }

    function setConnStatus(state, text) {
        const dot = document.getElementById('liveDot');
        const txt = document.getElementById('connText');
        if (state === 'error') dot.classList.add('error'); else dot.classList.remove('error');
        if (txt) txt.innerText = text;
    }

    async function fetchReadyOrders() {
        const { data, error } = await supabase
            .from('booze_shop_orders')
            .select('*')
            .eq('status', 'ready')
            .order('updated_at', { ascending: true });

        if (error) {
            console.error("Supabase error:", error);
            setConnStatus('error', '⚠️ Query error');
            return [];
        }

        return (data || []).map(order => {
            const isVVIP = order.is_vvip === true || order.payment_source === 'vvip_tab';
            return {
                orderId: order.order_id,
                orderNumber: order.order_number,
                items: order.booze_items || [],
                total: parseFloat(order.booze_total ?? 0) || 0,
                source: (order.source || 'kiosk').toLowerCase(),
                bandName: order.customer_name || 'Walk-in',
                phoneNumber: order.customer_phone || '',
                isVVIP,
                paymentSource: order.payment_source,
                readyAt: order.updated_at,
            };
        });
    }

    async function markCollected(orderId, orderNumber) {
        const btn = document.getElementById(`btn-collect-${orderId}`);
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Collecting…'; }
        try {
            const { error: updateErr } = await supabase
                .from('orders')
                .update({
                    status: 'collected',
                    updated_at: new Date().toISOString()
                })
                .eq('id', orderId)
                .eq('status', 'ready');

            if (updateErr) throw updateErr;

            showBriefMessage(`✅ Order #${orderNumber} collected!`, false);
            await renderOrders();
            return true;
        } catch (err) {
            console.error("Failed to collect order:", err);
            showBriefMessage(`Failed to collect #${orderNumber}`, false);
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-hand-peace"></i> Confirm Collection'; }
            return false;
        }
    }

    function sourceLabel(source) {
        const s = (source || 'kiosk').toLowerCase();
        if (s.includes('whatsapp')) return '💬 WhatsApp';
        if (s.includes('web')) return '💻 Web App';
        return '📱 Kiosk';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
        });
    }

    async function renderOrders() {
        const orders = await fetchReadyOrders();
        orders.sort((a, b) => { if (a.isVVIP !== b.isVVIP) return a.isVVIP ? -1 : 1; return new Date(a.readyAt) - new Date(b.readyAt); });

        const readyCount = orders.length;
        document.getElementById('readyCountValue').innerText = readyCount;

        if (readyCount > lastReadyCount && lastReadyCount !== 0) {
            const newCount = readyCount - lastReadyCount;
            const hasVVIP = orders.slice(0, newCount).some(o => o.isVVIP);
            showBriefMessage(`${newCount} new order(s) ready!`, true, hasVVIP);
        }
        lastReadyCount = readyCount;

        const gridContainer = document.getElementById('ordersGrid');
        if (orders.length === 0) {
            gridContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-martini-glass"></i>
                    <p>No orders ready for pickup</p>
                    <p style="font-size:12px; margin-top:6px;">Orders marked ready at the counter will appear here</p>
                </div>
            `;
            return;
        }

        gridContainer.innerHTML = orders.map(order => {
            const vvipCardClass = order.isVVIP ? 'vvip-card' : '';

            let readyTimeAgo = 'just now';
            let waitClass = '';
            if (order.readyAt) {
                const diffMins = Math.floor((Date.now() - new Date(order.readyAt).getTime()) / 60000);
                if (diffMins < 1) readyTimeAgo = 'just now';
                else if (diffMins === 1) readyTimeAgo = '1 min ago';
                else readyTimeAgo = `${diffMins} min ago`;
                if (diffMins >= 10) waitClass = 'waiting-very-long';
                else if (diffMins >= 5) waitClass = 'waiting-long';
            }

            const itemsToShow = order.items || [];
            const vvipTabNote = (order.isVVIP && order.paymentSource === 'vvip_tab') ? `<div class="vvip-tab-note"><i class="fas fa-crown"></i> Paid via VVIP Tab on WhatsApp</div>` : '';

            return `
                <div class="order-card ${vvipCardClass}">
                    <div class="card-header">
                        <span class="order-number">#${escapeHtml(String(order.orderNumber || order.orderId))}</span>
                        <div style="display: flex; gap: 6px;">
                            <span class="source-badge">${sourceLabel(order.source)}</span>
                            <span class="ready-badge"><i class="fas fa-check-circle"></i> READY</span>
                        </div>
                    </div>

                    <div class="customer-block">
                        <div class="customer-name">
                            <i class="fas fa-user" style="color: var(--red);"></i> ${escapeHtml(order.bandName)}
                            ${order.isVVIP ? '<span class="vvip-badge"><i class="fas fa-crown"></i> VVIP</span>' : ''}
                        </div>
                        ${order.phoneNumber ? `<div class="customer-phone"><i class="fas fa-phone-alt"></i> ${escapeHtml(order.phoneNumber)}</div>` : ''}
                        <div class="ready-time ${waitClass}">
                            <i class="far fa-clock"></i> Ready ${readyTimeAgo}
                        </div>
                        ${vvipTabNote}
                    </div>

                    <div class="items-preview">
                        ${itemsToShow.length ? itemsToShow.slice(0, 4).map(item => `
                            <div class="item-row">
                                <span class="item-name">${item.quantity || 1}× ${escapeHtml(item.name || 'Item')}</span>
                                <span class="item-price">R${(Number(item.unit_price || 0) * (item.quantity || 1)).toFixed(2)}</span>
                            </div>
                        `).join('') : '<div class="item-row"><span>Smart Counter selection</span></div>'}
                        ${itemsToShow.length > 4 ? `<div style="font-size: 10px; color: var(--text3); margin-top: 4px;">+${itemsToShow.length-4} more items</div>` : ''}
                    </div>

                    <div class="order-total-row">
                        <span class="total-label">BAR TOTAL</span>
                        <span>R${order.total.toFixed(2)}</span>
                    </div>

                    <div class="collect-action">
                        <button id="btn-collect-${order.orderId}" class="btn-collect ${order.isVVIP ? 'vvip-btn' : ''}" onclick="window.handleCollect('${order.orderId}', '${escapeHtml(String(order.orderNumber))}')">
                            <i class="fas fa-hand-peace"></i> Confirm Collection
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.handleCollect = async (orderId, orderNumber) => {
        await markCollected(orderId, orderNumber);
    };

    function debouncedRefresh() { clearTimeout(refreshDebounce); refreshDebounce = setTimeout(renderOrders, 300); }

    function setupRealtimeSubscription() {
        if (realtimeSub) { try { supabase.removeChannel(realtimeSub); } catch(e) {} }

        realtimeSub = supabase
            .channel('smart-counter-collection')
            .on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'orders'
            }, () => { debouncedRefresh(); })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') setConnStatus('ok', 'Live · ready orders');
                else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { setConnStatus('error', 'Reconnecting…'); setTimeout(setupRealtimeSubscription, 5000); }
            });
    }

    setInterval(renderOrders, 15000);

    async function init() {
        await renderOrders();
        setupRealtimeSubscription();

        const { error } = await supabase.from('booze_shop_orders').select('order_id', { count: 'exact', head: true });
        if (error) setConnStatus('error', 'Reconnecting…');
        else setConnStatus('ok', 'ready for pickup');
    }

    init();
</script>
</body>
</html>
