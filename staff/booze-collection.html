<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Smart Counter · Collection Counter</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: #ffffff;
        min-height: 100vh;
        padding: 0;
        margin: 0;
    }

    /* RED & WHITE THEME — identical to Butcher Collection, clean & iframe-ready */
    :root {
        --red: #E30613;
        --red-dark: #b9080f;
        --red-soft: #fff0f0;
        --red-glow: rgba(227,6,19,0.08);
        --white: #ffffff;
        --gray-light: #fafbfc;
        --gray-border: #eeeff2;
        --text-dark: #1a1c23;
        --text-muted: #6c727f;
    }

    .collection-panel {
        width: 100%;
        max-width: 100%;
        background: var(--white);
        border-radius: 0;
        overflow: hidden;
    }

    /* mini stats bar — minimal, only count */
    .stats-row {
        background: var(--white);
        padding: 14px 20px;
        display: flex;
        justify-content: flex-end;
        border-bottom: 1px solid var(--gray-border);
    }

    .ready-counter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--red-soft);
        padding: 6px 18px;
        border-radius: 60px;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--red);
        border: 1px solid #ffdbdb;
    }
    .ready-counter i {
        font-size: 0.9rem;
    }
    .ready-counter span {
        font-size: 1.3rem;
        font-weight: 800;
        margin: 0 3px;
        color: var(--red);
    }

    /* orders grid — clean card layout */
    .orders-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 18px;
        padding: 20px;
        background: #ffffff;
        max-height: calc(100vh - 90px);
        overflow-y: auto;
    }

    /* order card — red accents */
    .order-card {
        background: var(--white);
        border-radius: 24px;
        border: 1px solid var(--gray-border);
        transition: all 0.2s ease;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        position: relative;
    }
    .order-card:hover {
        border-color: var(--red);
        box-shadow: 0 10px 22px rgba(227,6,19,0.08);
        transform: translateY(-2px);
    }

    /* VVIP STYLE — subtle gold+red prestige */
    .order-card.vvip-card {
        border-left: 4px solid #ffc107;
        background: linear-gradient(145deg, #fffefb, #ffffff);
        position: relative;
    }
    .order-card.vvip-card::before {
        content: "⚡ VVIP";
        position: absolute;
        top: -10px;
        right: 18px;
        background: #ffc107;
        color: #1e1a0c;
        font-size: 9px;
        font-weight: 800;
        padding: 3px 14px;
        border-radius: 40px;
        letter-spacing: 0.3px;
        z-index: 5;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .vvip-badge {
        background: #ffc107;
        color: #2c2410;
        font-size: 9px;
        font-weight: 800;
        padding: 3px 10px;
        border-radius: 30px;
        margin-left: 8px;
        display: inline-block;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px 6px 18px;
        flex-wrap: wrap;
        gap: 8px;
    }
    .order-number {
        background: var(--red);
        color: white;
        font-weight: 700;
        font-size: 0.7rem;
        padding: 5px 14px;
        border-radius: 40px;
        font-family: 'Inter', monospace;
        letter-spacing: 0.2px;
    }
    .ready-badge {
        background: #10b981;
        color: white;
        font-size: 0.65rem;
        font-weight: 700;
        padding: 5px 12px;
        border-radius: 30px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .source-badge {
        background: var(--red-soft);
        padding: 3px 10px;
        border-radius: 40px;
        font-size: 0.6rem;
        font-weight: 600;
        color: var(--red);
    }

    .customer-block {
        margin: 10px 18px;
        background: #fefaf7;
        border-radius: 18px;
        padding: 12px 14px;
        border: 1px solid #ffe6de;
    }
    .customer-name {
        font-weight: 800;
        color: var(--text-dark);
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
    }
    .customer-phone {
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 6px;
        font-family: monospace;
    }
    .ready-time {
        font-size: 10px;
        margin-top: 6px;
        color: #b07a5a;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .items-preview {
        margin: 10px 18px;
        background: #ffffff;
        border-radius: 16px;
        padding: 10px 12px;
        border: 1px solid #f2e6df;
        max-height: 130px;
        overflow-y: auto;
    }
    .item-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        font-size: 0.75rem;
        font-weight: 500;
        border-bottom: 1px dashed #f0dfd7;
    }
    .item-row:last-child {
        border-bottom: none;
    }
    .item-name {
        color: #2d3e42;
    }
    .item-price {
        color: var(--red);
        font-weight: 700;
    }

    .order-total-row {
        margin: 12px 18px 14px 18px;
        text-align: right;
        padding-top: 10px;
        border-top: 2px solid var(--red);
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--red);
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        align-items: baseline;
    }
    .total-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--text-muted);
    }

    .collect-action {
        padding: 4px 18px 20px 18px;
    }
    .btn-collect {
        width: 100%;
        background: var(--red);
        border: none;
        padding: 12px;
        border-radius: 60px;
        font-weight: 700;
        font-size: 0.8rem;
        color: white;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: 'Inter', sans-serif;
    }
    .btn-collect:hover {
        background: var(--red-dark);
        transform: scale(1.01);
        box-shadow: 0 4px 12px var(--red-glow);
    }
    .btn-collect:active {
        transform: scale(0.98);
    }

    .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        background: var(--gray-light);
        border-radius: 32px;
        color: var(--text-muted);
        border: 1px dashed var(--red);
    }
    .empty-state i {
        font-size: 52px;
        color: var(--red);
        margin-bottom: 16px;
        opacity: 0.5;
    }
    .empty-state p {
        font-size: 0.85rem;
    }

    /* scrollbar neat */
    .orders-grid::-webkit-scrollbar {
        width: 5px;
    }
    .orders-grid::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
    }
    .orders-grid::-webkit-scrollbar-thumb {
        background: var(--red);
        border-radius: 10px;
    }

    /* live footer minimal */
    .live-footer {
        display: flex;
        justify-content: flex-end;
        padding: 8px 20px 12px 20px;
        border-top: 1px solid var(--gray-border);
        background: white;
        font-size: 0.65rem;
        color: var(--text-muted);
        align-items: center;
        gap: 8px;
    }
    .live-dot {
        width: 7px;
        height: 7px;
        background: #10b981;
        border-radius: 50%;
        animation: pulse 1.6s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    @media (max-width: 640px) {
        .orders-grid {
            grid-template-columns: 1fr;
            padding: 14px;
        }
        .stats-row {
            padding: 12px 16px;
        }
    }
</style>
</head>
<body>
<div class="collection-panel">
    <!-- Only stats: ready orders count — clean and minimal -->
    <div class="stats-row">
        <div class="ready-counter">
            <i class="fas fa-mug-hot"></i>
            <span id="readyCountValue">0</span> ready for pickup
        </div>
    </div>

    <!-- orders grid (no tabs, only Smart Counter orders) -->
    <div id="ordersGrid" class="orders-grid">
        <div class="empty-state">
            <i class="fas fa-hand-peace"></i>
            <p>Loading orders ...</p>
        </div>
    </div>

    <!-- subtle connection status -->
    <div class="live-footer">
        <div class="live-dot"></div>
        <span id="connText">Connected</span>
        <i class="fas fa-check-circle" style="color: #10b981; font-size: 9px;"></i>
    </div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // ======================== SMART COUNTER COLLECTION SCREEN ========================
    // Only shows READY orders for "Rands Smart Counter" vendor
    // Fixed: removed 'ready_at' column reference (doesn't exist in schema)
    
    const SMART_VENDOR = "Rands Smart Counter";
    let lastReadyCount = 0;
    let realtimeSub = null;
    let soundEnabled = true;

    // simple inline notification
    function showBriefMessage(msg, isNewOrder = false, isVVIP = false) {
        const connSpan = document.getElementById('connText');
        if (connSpan) {
            const original = connSpan.innerText;
            connSpan.innerHTML = isNewOrder ? `✨ ${msg}` : msg;
            setTimeout(() => {
                if (connSpan) connSpan.innerText = original;
            }, 2500);
        }
        if (isNewOrder && soundEnabled) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (isVVIP) {
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else {
                    osc.frequency.setValueAtTime(660, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e) { /* silent fallback */ }
        }
    }

    // fetch ONLY ready orders for Rands Smart Counter (status = 'ready')
    // FIXED: removed 'ready_at' column from order by (doesn't exist in schema)
    async function fetchReadyOrders() {
        console.log("🔄 Fetching ready orders for vendor:", SMART_VENDOR);
        
        const { data, error } = await supabase
            .from('orders')
            .select('*')
            .eq('vendor', SMART_VENDOR)
            .eq('status', 'ready')
            .order('is_vvip', { ascending: false })
            .order('updated_at', { ascending: true });
        
        if (error) {
            console.error("❌ Supabase error (Smart Counter):", error);
            document.getElementById('connText').innerHTML = "⚠️ Query error - check console";
            return [];
        }
        
        console.log(`📦 Found ${data?.length || 0} ready orders for ${SMART_VENDOR}`);
        
        if (!data || data.length === 0) return [];
        
        return data.map(order => ({
            ...order,
            orderId: order.order_number || order.order_id || order.id,
            items: order.items || [],
            total: order.total || order.total_amount || 0,
            source: order.source || (order.payment_source === 'wallet' ? 'wallet' : 'kiosk'),
            status: order.status,
            bandName: order.customer_name || (order.source === 'kiosk' ? 'Guest' : 'Customer'),
            phoneNumber: order.phone || order.customer_phone || '',
            timestamp: order.created_at ? new Date(order.created_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '',
            isVVIP: order.is_vvip === true,
            readyAt: order.updated_at,  // Use updated_at instead of ready_at
            vendor: order.vendor
        }));
    }

    // mark order as collected (update status to 'collected')
    async function markCollected(orderNumber) {
        try {
            console.log(`🔄 Marking order #${orderNumber} as collected`);
            
            // double-check it's ready & belongs to Smart Counter
            const { data: check, error: fetchErr } = await supabase
                .from('orders')
                .select('status, vendor, id')
                .eq('order_number', orderNumber)
                .maybeSingle();
            
            if (fetchErr || !check) {
                console.error("Order not found:", fetchErr);
                showBriefMessage(`Order #${orderNumber} not found`, false);
                return false;
            }
            
            if (check.status !== 'ready') {
                showBriefMessage(`Order #${orderNumber} is not ready (status: ${check.status})`, false);
                return false;
            }
            
            if (check.vendor !== SMART_VENDOR) {
                showBriefMessage(`Invalid order`, false);
                return false;
            }
            
            const { error: updateErr } = await supabase
                .from('orders')
                .update({ 
                    status: 'collected', 
                    updated_at: new Date().toISOString()
                })
                .eq('order_number', orderNumber);
            
            if (updateErr) throw updateErr;
            
            console.log(`✅ Order #${orderNumber} marked as collected`);
            showBriefMessage(`✅ Order #${orderNumber} collected`, false);
            await renderOrders(); // refresh grid
            return true;
        } catch (err) {
            console.error("❌ Failed to collect order:", err);
            showBriefMessage(`Failed to collect #${orderNumber}`, false);
            return false;
        }
    }

    // render orders into grid
    async function renderOrders() {
        const orders = await fetchReadyOrders();
        // sort VVIP on top
        orders.sort((a,b) => (b.isVVIP ? 1 : 0) - (a.isVVIP ? 1 : 0));
        
        const readyCount = orders.length;
        document.getElementById('readyCountValue').innerText = readyCount;
        
        // new order detection + sound (only if count increased)
        if (readyCount > lastReadyCount && lastReadyCount !== 0) {
            const newCount = readyCount - lastReadyCount;
            const newOrdersSlice = orders.slice(0, newCount);
            const hasVVIP = newOrdersSlice.some(o => o.isVVIP);
            showBriefMessage(`${newCount} new order(s) ready`, true, hasVVIP);
        }
        lastReadyCount = readyCount;
        
        const gridContainer = document.getElementById('ordersGrid');
        if (orders.length === 0) {
            gridContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-mug-hot"></i>
                    <p>No orders ready for pickup</p>
                    <p style="font-size:12px; margin-top:6px;">Ready orders will appear here</p>
                </div>
            `;
            return;
        }
        
        gridContainer.innerHTML = orders.map(order => {
            const isVVIP = order.isVVIP === true;
            const vvipCardClass = isVVIP ? 'vvip-card' : '';
            const sourceLabel = order.source === 'wallet' ? '💰 Wallet' : '📱 Kiosk';
            
            let readyTimeAgo = 'just now';
            if (order.readyAt) {
                const diffMins = Math.floor((Date.now() - new Date(order.readyAt).getTime()) / 60000);
                if (diffMins < 1) readyTimeAgo = 'just now';
                else if (diffMins === 1) readyTimeAgo = '1 min ago';
                else readyTimeAgo = `${diffMins} min ago`;
            }
            
            const itemsToShow = order.items && Array.isArray(order.items) && order.items.length ? order.items : [];
            
            return `
                <div class="order-card ${vvipCardClass}">
                    <div class="card-header">
                        <span class="order-number">#${escapeHtml(String(order.orderId))}</span>
                        <div style="display: flex; gap: 6px;">
                            <span class="source-badge">${sourceLabel}</span>
                            <span class="ready-badge"><i class="fas fa-check-circle"></i> READY</span>
                        </div>
                    </div>
                    
                    <div class="customer-block">
                        <div class="customer-name">
                            <i class="fas fa-user" style="color: var(--red);"></i> ${escapeHtml(order.bandName)}
                            ${isVVIP ? '<span class="vvip-badge"><i class="fas fa-crown"></i> VVIP</span>' : ''}
                        </div>
                        ${order.phoneNumber ? `<div class="customer-phone"><i class="fas fa-phone-alt"></i> ${escapeHtml(order.phoneNumber)}</div>` : ''}
                        <div class="ready-time">
                            <i class="far fa-clock"></i> Ready ${readyTimeAgo}
                        </div>
                    </div>
                    
                    <div class="items-preview">
                        ${itemsToShow.length ? itemsToShow.slice(0, 4).map(item => `
                            <div class="item-row">
                                <span class="item-name">${item.quantity || 1}× ${escapeHtml(item.name || item.product_name || 'Item')}</span>
                                <span class="item-price">R${((item.price || item.unit_price || 0) * (item.quantity || 1)).toFixed(2)}</span>
                            </div>
                        `).join('') : '<div class="item-row"><span>Smart Counter selection</span></div>'}
                        ${itemsToShow.length > 4 ? `<div style="font-size: 10px; color: #a0a0a0; margin-top: 4px;">+${itemsToShow.length-4} more items</div>` : ''}
                    </div>
                    
                    <div class="order-total-row">
                        <span class="total-label">TOTAL</span>
                        <span>R${(order.total || 0).toFixed(2)}</span>
                    </div>
                    
                    <div class="collect-action">
                        <button class="btn-collect" onclick="window.handleCollect('${order.orderId}')">
                            <i class="fas fa-hand-peace"></i> Confirm Collection
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // expose global collect function for inline onclick
    window.handleCollect = async (orderId) => {
        await markCollected(orderId);
    };

    // setup realtime subscription (only for Rands Smart Counter)
    function setupRealtimeSubscription() {
        if (realtimeSub) {
            try { realtimeSub.unsubscribe(); } catch(e) {}
        }
        
        realtimeSub = supabase
            .channel('smart-counter-collection')
            .on('postgres_changes', { 
                event: '*', 
                schema: 'public', 
                table: 'orders',
                filter: `vendor=eq.${SMART_VENDOR}` 
            }, (payload) => {
                console.log("🔔 Realtime change:", payload.eventType, payload.new?.status);
                renderOrders();
            })
            .subscribe((status) => {
                console.log("📡 Realtime subscription status:", status);
                const connSpan = document.getElementById('connText');
                if (connSpan) {
                    if (status === 'SUBSCRIBED') connSpan.innerText = 'Live · ready orders';
                    else connSpan.innerText = 'Connected';
                }
            });
    }

    // periodic refresh as fallback (every 5 seconds)
    let intervalRefresh = setInterval(() => {
        renderOrders();
    }, 5000);

    // init everything
    async function init() {
        console.log("🚀 Initializing Smart Counter Collection Screen...");
        await renderOrders();
        setupRealtimeSubscription();
        // test connection and display friendly status
        const { error } = await supabase.from('orders').select('count', { count: 'exact', head: true });
        const connSpan = document.getElementById('connText');
        if (connSpan) {
            if (error) {
                connSpan.innerText = 'reconnecting...';
                console.error("❌ Connection test failed:", error);
            } else {
                connSpan.innerText = 'ready for pickup';
            }
        }
    }
    
    init();
</script>
</body>
</html>
