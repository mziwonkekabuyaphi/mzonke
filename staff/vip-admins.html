<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VVIP Packages Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            padding: 16px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #b30000;
        }
        
        .header h1 {
            font-size: 24px;
            color: #ff4d4d;
        }
        
        .header h1 i {
            margin-right: 8px;
        }
        
        /* Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .btn-primary {
            background: #b30000;
            color: white;
        }
        
        .btn-primary:hover, .btn-primary:active {
            background: #ff4d4d;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #2a2a2a;
            color: white;
            border: 1px solid #b30000;
        }
        
        .btn-danger {
            background: #dc2626;
            color: white;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            border: 1px solid #b30000;
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: 800;
            color: #ff4d4d;
        }
        
        .stat-label {
            font-size: 12px;
            color: #aaa;
            margin-top: 8px;
        }
        
        /* Packages Grid - Responsive */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .package-card {
            background: #1a1a1a;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.2s, border-color 0.2s;
        }
        
        .package-card:hover {
            border-color: #b30000;
            transform: translateY(-4px);
        }
        
        .package-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: linear-gradient(135deg, #b30000, #660000);
        }
        
        .package-content {
            padding: 20px;
        }
        
        .package-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .package-name {
            font-size: 18px;
            font-weight: 700;
            color: #ff4d4d;
        }
        
        .package-price {
            font-size: 22px;
            font-weight: 800;
            color: #ffd700;
        }
        
        .package-description {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .package-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #888;
            flex-wrap: wrap;
        }
        
        .benefits-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .benefit-tag {
            background: #2a2a2a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #ffd700;
        }
        
        .package-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        
        .package-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 13px;
        }
        
        /* Modal - FIXED SCROLLING */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(4px);
            z-index: 10000;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .modal-content {
            background: #1a1a1a;
            border-radius: 28px;
            max-width: 550px;
            width: 90%;
            margin: 40px auto;
            padding: 24px;
            border: 2px solid #b30000;
            position: relative;
        }
        
        /* Modal header with close button */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }
        
        .modal-header h2 {
            color: #ff4d4d;
            font-size: 20px;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 28px;
            cursor: pointer;
            padding: 0 8px;
        }
        
        .modal-close:hover {
            color: #ff4d4d;
        }
        
        /* Form Styles - SCROLLABLE */
        .form-container {
            max-height: calc(90vh - 120px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 8px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ff4d4d;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #b30000;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 14px;
        }
        
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ff4d4d;
        }
        
        .benefits-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .benefits-input-group input {
            flex: 1;
        }
        
        .benefits-input-group button {
            padding: 12px 20px;
            white-space: nowrap;
        }
        
        .benefits-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        
        .benefit-item {
            background: #b30000;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .benefit-item button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
        
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #333;
        }
        
        .form-actions button {
            flex: 1;
            padding: 12px;
        }
        
        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .status-active {
            background: #00a86b;
            color: white;
        }
        
        .status-inactive {
            background: #666;
            color: white;
        }
        
        /* Loading and Empty States */
        .loading, .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: #b30000;
        }
        
        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 10001;
            display: none;
            font-size: 14px;
            white-space: nowrap;
            max-width: 90%;
            white-space: normal;
            text-align: center;
        }
        
        /* Mobile Responsive */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .btn {
                padding: 10px 18px;
                font-size: 13px;
            }
            
            .packages-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            
            .modal-content {
                width: 95%;
                margin: 20px auto;
                padding: 20px;
            }
            
            .form-container {
                max-height: calc(85vh - 100px);
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .stat-number {
                font-size: 22px;
            }
            
            .toast {
                bottom: 80px;
                font-size: 12px;
            }
        }
        
        @media (max-width: 480px) {
            .package-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .package-actions {
                flex-direction: column;
            }
            
            .benefits-input-group {
                flex-direction: column;
            }
            
            .benefits-input-group button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-crown"></i> VVIP Packages</h1>
        <button class="btn btn-primary" onclick="openCreateModal()">
            <i class="fas fa-plus"></i> Create Package
        </button>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-number" id="totalPackages">-</div>
            <div class="stat-label">Total Packages</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalBookings">-</div>
            <div class="stat-label">Total Bookings</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalRevenue">-</div>
            <div class="stat-label">Revenue</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="occupancyRate">-</div>
            <div class="stat-label">Occupancy</div>
        </div>
    </div>

    <div id="packagesGrid" class="packages-grid">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading packages...</div>
    </div>
</div>

<!-- Create/Edit Modal -->
<div id="packageModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Create VVIP Package</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="form-container">
            <form id="packageForm">
                <div class="form-group">
                    <label>Package Name *</label>
                    <input type="text" id="packageName" required placeholder="e.g., Platinum VVIP Experience">
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="packageDescription" placeholder="Describe what this package includes..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Price (R) *</label>
                    <input type="number" id="packagePrice" step="0.01" required placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label>Capacity (Max Guests) *</label>
                    <input type="number" id="packageCapacity" min="1" required placeholder="1">
                </div>
                
                <div class="form-group">
                    <label>Status</label>
                    <select id="packageStatus">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Image URL (optional)</label>
                    <input type="text" id="packageImage" placeholder="https://example.com/image.jpg">
                </div>
                
                <div class="form-group">
                    <label>Benefits</label>
                    <div class="benefits-input-group">
                        <input type="text" id="benefitInput" placeholder="e.g., VIP Lounge Access">
                        <button type="button" class="btn-secondary" onclick="addBenefit()">Add</button>
                    </div>
                    <div id="benefitsList" class="benefits-tags"></div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Package</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    // Supabase connection
    let supabase = null;
    let currentEditingId = null;
    let benefitsArray = [];
    
    // Helper: Show toast notification
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.background = isError ? '#dc2626' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
    
    // Helper: Escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Update benefits display
    function updateBenefitsDisplay() {
        const container = document.getElementById('benefitsList');
        if (!container) return;
        
        if (benefitsArray.length === 0) {
            container.innerHTML = '<span style="color:#666; font-size:12px;">No benefits added yet</span>';
            return;
        }
        
        container.innerHTML = benefitsArray.map(b => `
            <div class="benefit-item">
                <i class="fas fa-check-circle" style="font-size:10px;"></i> ${escapeHtml(b)}
                <button type="button" onclick="removeBenefit('${escapeHtml(b).replace(/'/g, "\\'")}')">&times;</button>
            </div>
        `).join('');
    }
    
    // Add benefit
    window.addBenefit = function() {
        const input = document.getElementById('benefitInput');
        const benefit = input.value.trim();
        if (benefit && !benefitsArray.includes(benefit)) {
            benefitsArray.push(benefit);
            updateBenefitsDisplay();
            input.value = '';
            input.focus();
        }
    };
    
    // Remove benefit
    window.removeBenefit = function(benefit) {
        benefitsArray = benefitsArray.filter(b => b !== benefit);
        updateBenefitsDisplay();
    };
    
    // Load Supabase
    async function initSupabase() {
        try {
            // Try multiple paths
            let module;
            try {
                module = await import('../../config/supabase.js');
            } catch(e) {
                module = await import('../config/supabase.js');
            }
            supabase = module.default || module.supabase;
            console.log('✅ Supabase connected');
            return true;
        } catch (error) {
            console.error('❌ Supabase connection failed:', error);
            showToast('Failed to connect to database. Check config.', true);
            return false;
        }
    }
    
    // Load stats
    async function loadStats() {
        if (!supabase) return;
        
        try {
            const { count: packageCount } = await supabase
                .from('vvip_packages')
                .select('*', { count: 'exact', head: true });
            
            const { count: bookingCount } = await supabase
                .from('vvip_bookings')
                .select('*', { count: 'exact' });
            
            const { data: revenueData } = await supabase
                .from('vvip_bookings')
                .select('total_amount')
                .eq('status', 'completed');
            
            const totalRevenue = (revenueData || []).reduce((sum, b) => sum + (b.total_amount || 0), 0);
            
            const { data: packages } = await supabase
                .from('vvip_packages')
                .select('capacity, sold_count');
            
            let totalCapacity = 0, totalSold = 0;
            (packages || []).forEach(p => {
                totalCapacity += p.capacity;
                totalSold += p.sold_count || 0;
            });
            const occupancy = totalCapacity > 0 ? Math.round((totalSold / totalCapacity) * 100) : 0;
            
            document.getElementById('totalPackages').innerText = packageCount || 0;
            document.getElementById('totalBookings').innerText = bookingCount || 0;
            document.getElementById('totalRevenue').innerText = 'R' + totalRevenue.toLocaleString();
            document.getElementById('occupancyRate').innerText = occupancy + '%';
        } catch (error) {
            console.error('Stats error:', error);
        }
    }
    
    // Load packages
    async function loadPackages() {
        if (!supabase) return;
        
        try {
            const { data, error } = await supabase
                .from('vvip_packages')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) throw error;
            
            const container = document.getElementById('packagesGrid');
            
            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-crown"></i>
                        <p>No packages created yet</p>
                        <button class="btn btn-primary" onclick="openCreateModal()">Create Your First Package</button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = data.map(pkg => `
                <div class="package-card">
                    ${pkg.image ? `<img class="package-image" src="${pkg.image}" alt="${escapeHtml(pkg.name)}" onerror="this.style.display='none'">` : '<div class="package-image" style="display: flex; align-items: center; justify-content: center;"><i class="fas fa-crown" style="font-size: 48px; color: #ffd700;"></i></div>'}
                    <div class="package-content">
                        <div class="package-header">
                            <span class="package-name">${escapeHtml(pkg.name)}</span>
                            <span class="package-price">R${pkg.price}</span>
                        </div>
                        <div class="package-meta">
                            <span><i class="fas fa-users"></i> Capacity: ${pkg.capacity}</span>
                            <span><i class="fas fa-ticket-alt"></i> Sold: ${pkg.sold_count || 0}</span>
                            <span class="status-badge ${pkg.status === 'active' ? 'status-active' : 'status-inactive'}">${pkg.status}</span>
                        </div>
                        <div class="package-description">${escapeHtml(pkg.description || 'No description')}</div>
                        <div class="benefits-list">
                            ${(pkg.benefits || []).slice(0, 3).map(b => `<span class="benefit-tag"><i class="fas fa-check"></i> ${escapeHtml(b)}</span>`).join('')}
                            ${(pkg.benefits || []).length > 3 ? `<span class="benefit-tag">+${pkg.benefits.length - 3} more</span>` : ''}
                        </div>
                        <div class="package-actions">
                            <button class="btn-secondary" onclick="editPackage('${pkg.id}')"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn-danger" onclick="deletePackage('${pkg.id}')"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            await loadStats();
        } catch (error) {
            console.error('Load error:', error);
            document.getElementById('packagesGrid').innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error: ${error.message}</p></div>`;
        }
    }
    
    // Open create modal
    window.openCreateModal = function() {
        currentEditingId = null;
        benefitsArray = [];
        document.getElementById('modalTitle').innerText = 'Create VVIP Package';
        document.getElementById('packageForm').reset();
        document.getElementById('packageStatus').value = 'active';
        updateBenefitsDisplay();
        document.getElementById('packageModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    };
    
    // Edit package
    window.editPackage = async function(id) {
        if (!supabase) return;
        
        try {
            const { data, error } = await supabase
                .from('vvip_packages')
                .select('*')
                .eq('id', id)
                .single();
            
            if (error) throw error;
            
            currentEditingId = id;
            benefitsArray = data.benefits || [];
            
            document.getElementById('modalTitle').innerText = 'Edit VVIP Package';
            document.getElementById('packageName').value = data.name;
            document.getElementById('packageDescription').value = data.description || '';
            document.getElementById('packagePrice').value = data.price;
            document.getElementById('packageCapacity').value = data.capacity;
            document.getElementById('packageStatus').value = data.status || 'active';
            document.getElementById('packageImage').value = data.image || '';
            updateBenefitsDisplay();
            
            document.getElementById('packageModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        } catch (error) {
            showToast('Error loading package: ' + error.message, true);
        }
    };
    
    // Delete package
    window.deletePackage = async function(id) {
        if (!confirm('Are you sure you want to delete this package? This will not affect existing bookings.')) return;
        
        if (!supabase) return;
        
        try {
            const { error } = await supabase
                .from('vvip_packages')
                .update({ status: 'inactive' })
                .eq('id', id);
            
            if (error) throw error;
            
            showToast('Package archived successfully');
            await loadPackages();
        } catch (error) {
            showToast('Error: ' + error.message, true);
        }
    };
    
    // Close modal
    window.closeModal = function() {
        document.getElementById('packageModal').style.display = 'none';
        document.body.style.overflow = 'auto';
        currentEditingId = null;
        benefitsArray = [];
    };
    
    // Handle form submit
    document.getElementById('packageForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!supabase) {
            showToast('Database not connected', true);
            return;
        }
        
        const packageData = {
            name: document.getElementById('packageName').value.trim(),
            description: document.getElementById('packageDescription').value.trim(),
            price: parseFloat(document.getElementById('packagePrice').value),
            capacity: parseInt(document.getElementById('packageCapacity').value),
            status: document.getElementById('packageStatus').value,
            image: document.getElementById('packageImage').value.trim() || null,
            benefits: benefitsArray
        };
        
        if (!packageData.name || !packageData.price || !packageData.capacity) {
            showToast('Please fill in all required fields', true);
            return;
        }
        
        try {
            let result;
            if (currentEditingId) {
                result = await supabase
                    .from('vvip_packages')
                    .update(packageData)
                    .eq('id', currentEditingId);
            } else {
                result = await supabase
                    .from('vvip_packages')
                    .insert([packageData]);
            }
            
            if (result.error) throw result.error;
            
            showToast(currentEditingId ? 'Package updated!' : 'Package created!');
            closeModal();
            await loadPackages();
        } catch (error) {
            showToast('Error: ' + error.message, true);
        }
    });
    
    // Close modal on background click
    document.getElementById('packageModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('packageModal')) {
            closeModal();
        }
    });
    
    // Real-time subscription
    function setupRealtime() {
        if (!supabase) return;
        
        supabase.channel('vvip_packages_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_packages' }, () => {
                loadPackages();
            })
            .subscribe();
    }
    
    // Initialize
    async function init() {
        const connected = await initSupabase();
        if (connected) {
            await loadPackages();
            setupRealtime();
        } else {
            document.getElementById('packagesGrid').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-database"></i>
                    <p>Cannot connect to database</p>
                    <p style="font-size: 12px; margin-top: 8px;">Make sure config/supabase.js exists</p>
                </div>
            `;
        }
    }
    
    init();
</script>
</body>
</html>
