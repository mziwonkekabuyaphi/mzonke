<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rands Staff Console · VELVET OPS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    /* ========== YOUR EXACT STYLES – UNCHANGED ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #E30613;
      --red-dim: rgba(227,6,19,0.08);
      --red-border: rgba(227,6,19,0.2);
      --bg: #0D0F12;
      --surface: #141720;
      --surface2: #1C2030;
      --surface3: #232840;
      --border: rgba(255,255,255,0.06);
      --border2: rgba(255,255,255,0.1);
      --text: #F0F2F8;
      --text2: #8B92A8;
      --text3: #555E78;
      --sidebar-w: 56px;
      --sidebar-w-open: 220px;
      --header-h: 52px;
      --green: #22C55E;
      --amber: #F59E0B;
      --blue: #3B82F6;
      --purple: #A855F7;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      font-size: 13px;
      line-height: 1.5;
    }
    [v-cloak] { display: none; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
    }
    .body-row {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.22s cubic-bezier(.4,0,.2,1);
      overflow: hidden;
      z-index: 40;
    }
    .sidebar:hover, .sidebar.open { width: var(--sidebar-w-open); }
    .sidebar-logo {
      height: var(--header-h);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-logo-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .sidebar-logo-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.08em;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .sidebar:hover .sidebar-logo-text,
    .sidebar.open .sidebar-logo-text { opacity: 1; }
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 0;
    }
    .nav-section-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text3);
      padding: 12px 14px 4px;
      white-space: nowrap;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.15s;
      text-transform: uppercase;
    }
    .sidebar:hover .nav-section-label,
    .sidebar.open .nav-section-label { opacity: 1; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 36px;
      cursor: pointer;
      border-radius: 0;
      position: relative;
      transition: background 0.12s;
      overflow: hidden;
      white-space: nowrap;
      user-select: none;
    }
    .nav-item:hover { background: var(--surface2); }
    .nav-item.active {
      background: var(--red-dim);
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--red);
      border-radius: 0 2px 2px 0;
    }
    .nav-item i {
      font-size: 13px;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
      color: var(--text2);
      transition: color 0.12s;
    }
    .nav-item.active i { color: var(--red); }
    .nav-item:hover i { color: var(--text); }
    .nav-item-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text2);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .sidebar:hover .nav-item-label,
    .sidebar.open .nav-item-label { opacity: 1; }
    .nav-item.active .nav-item-label { color: var(--text); }
    .nav-badge {
      margin-left: auto;
      font-size: 9px;
      font-weight: 700;
      background: var(--red);
      color: white;
      padding: 1px 5px;
      border-radius: 99px;
      line-height: 1.4;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .sidebar:hover .nav-badge,
    .sidebar.open .nav-badge { opacity: 1; }
    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding: 8px 0;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }
    .main-header {
      height: var(--header-h);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      flex-shrink: 0;
      background: var(--surface);
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text2);
    }
    .breadcrumb .active { color: var(--text); font-weight: 600; }
    .content-area {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .content-scroll {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px;
    }
    .header-logo-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 7px;
      flex-shrink: 0;
    }
    .header-divider {
      width: 1px;
      height: 20px;
      background: var(--border2);
      flex-shrink: 0;
    }
    .search-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0 10px;
      height: 30px;
      cursor: text;
      transition: border-color 0.15s;
      flex: 1;
      max-width: 280px;
    }
    .search-bar:hover, .search-bar.focused { border-color: var(--border2); }
    .search-bar input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      width: 100%;
    }
    .search-bar input::placeholder { color: var(--text3); }
    .header-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text2);
      font-size: 12px;
      transition: all 0.12s;
      position: relative;
      flex-shrink: 0;
    }
    .header-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
    .notif-dot {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      border: 1.5px solid var(--surface);
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #E30613 0%, #8B0000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid var(--border2);
    }
    .staff-info { line-height: 1.2; }
    .staff-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .staff-role { font-size: 10px; color: var(--text2); }
    .clock { font-size: 11px; font-weight: 600; color: var(--text2); font-variant-numeric: tabular-nums; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.15s;
    }
    .stat-card:hover { border-color: var(--border2); }
    .stat-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-label i { font-size: 10px; }
    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .stat-sub {
      font-size: 10px;
      color: var(--text3);
      margin-top: 4px;
    }
    .stat-delta {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .delta-up { color: var(--green); background: rgba(34,197,94,0.1); }
    .delta-dn { color: #EF4444; background: rgba(239,68,68,0.1); }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .section-action {
      font-size: 11px;
      color: var(--text3);
      cursor: pointer;
      transition: color 0.12s;
    }
    .section-action:hover { color: var(--red); }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .table-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .table-search {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 8px;
      height: 26px;
      flex: 1;
      max-width: 220px;
    }
    .table-search input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 11px;
      font-family: inherit;
      width: 100%;
    }
    .table-search input::placeholder { color: var(--text3); }
    .filter-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .filter-pill:hover { border-color: var(--border2); color: var(--text); }
    .filter-pill.active { border-color: var(--red-border); background: var(--red-dim); color: var(--red); }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 7px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      cursor: pointer;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td {
      padding: 8px 14px;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
    }
    .table-pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
    }
    .page-info { font-size: 11px; color: var(--text3); }
    .page-btns { display: flex; gap: 4px; }
    .page-btn {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s;
    }
    .page-btn:hover { border-color: var(--border2); color: var(--text); }
    .page-btn.active { background: var(--red); border-color: var(--red); color: white; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge-green { color: var(--green); background: rgba(34,197,94,0.1); }
    .badge-amber { color: var(--amber); background: rgba(245,158,11,0.1); }
    .badge-red { color: #EF4444; background: rgba(239,68,68,0.1); }
    .badge-blue { color: var(--blue); background: rgba(59,130,246,0.1); }
    .badge-purple { color: var(--purple); background: rgba(168,85,247,0.1); }
    .badge-gray { color: var(--text3); background: var(--surface3); }
    .row-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.12s;
    }
    tbody tr:hover .row-actions { opacity: 1; }
    .row-action {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text3);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s;
    }
    .row-action:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
    .module-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--surface);
    }
    .module-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border2);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .task-list { display: flex; flex-direction: column; gap: 4px; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .task-item:hover { background: var(--surface2); border-color: var(--border2); }
    .task-check {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 1.5px solid var(--border2);
      flex-shrink: 0;
      transition: all 0.12s;
    }
    .task-check.done {
      background: var(--green);
      border-color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: white;
    }
    .task-text { font-size: 12px; color: var(--text); flex: 1; }
    .task-text.done { color: var(--text3); text-decoration: line-through; }
    .task-priority {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .queue-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .queue-row:last-child { border-bottom: none; }
    .queue-num {
      font-size: 18px;
      font-weight: 800;
      color: var(--text3);
      width: 32px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .queue-num.top { color: var(--red); }
    .toast-stack {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      pointer-events: all;
      animation: slideIn 0.2s ease;
      max-width: 320px;
    }
    @keyframes slideIn {
      from { transform: translateX(12px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error   { border-left: 3px solid #EF4444; }
    .toast.info    { border-left: 3px solid var(--blue); }
    .toast.warn    { border-left: 3px solid var(--amber); }
    .toast i { font-size: 13px; flex-shrink: 0; }
    .toast.success i { color: var(--green); }
    .toast.error   i { color: #EF4444; }
    .toast.info    i { color: var(--blue); }
    .toast.warn    i { color: var(--amber); }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 24px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }
    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .modal-body {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
    .btn-red {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }
    .btn-red:hover { background: #c0010f; }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn-ghost:hover { background: var(--surface2); border-color: var(--border); }
    .btn-sm { height: 26px; padding: 0 10px; font-size: 11px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .panel-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .panel-body { padding: 8px 0; }
    .role-tag {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--red-dim);
      border: 1px solid var(--red-border);
      color: var(--red);
    }
    .shift-timer {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--green);
    }
    .mobile-menu-btn { display: none; }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        width: 0;
        border-right: none;
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }
      .sidebar.open {
        width: var(--sidebar-w-open);
        border-right: 1px solid var(--border);
      }
      .mobile-menu-btn { display: flex; }
      .search-bar { max-width: 160px; }
      .staff-info { display: none; }
      .two-col, .three-col { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .activity-item {
      display: flex;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
      font-size: 11px;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .activity-text { color: var(--text2); line-height: 1.4; }
    .activity-time { color: var(--text3); margin-left: auto; flex-shrink: 0; }
    .cmd-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      z-index: 2000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 80px;
    }
    .cmd-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 12px;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    .cmd-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .cmd-input {
      background: none;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text);
      font-family: inherit;
      width: 100%;
    }
    .cmd-input::placeholder { color: var(--text3); }
    .cmd-results { max-height: 320px; overflow-y: auto; }
    .cmd-group-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 16px 4px;
    }
    .cmd-result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.1s;
      font-size: 13px;
      color: var(--text);
    }
    .cmd-result-item:hover, .cmd-result-item.selected { background: var(--surface2); }
    .cmd-result-item i { width: 16px; text-align: center; color: var(--text3); font-size: 12px; }
    .cmd-hint {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
    }
    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--text3);
    }
    .key {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
      color: var(--text2);
    }
    .notif-panel {
      position: absolute;
      top: calc(var(--header-h) + 6px);
      right: 14px;
      width: 300px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      z-index: 200;
      overflow: hidden;
    }
    .notif-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .notif-item {
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .notif-item:last-child { border-bottom: none; }
    .notif-item:hover { background: var(--surface2); }
    .notif-item.unread { background: rgba(227,6,19,0.04); }
    .notif-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
    }
    .notif-text { font-size: 11px; color: var(--text2); line-height: 1.4; }
    .notif-text strong { color: var(--text); font-weight: 600; }
    .notif-time { font-size: 10px; color: var(--text3); margin-top: 2px; }
    .logout-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid rgba(239,68,68,0.2);
      background: rgba(239,68,68,0.06);
      color: #EF4444;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .logout-btn:hover { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.4); }
    /* role-select removed – role is loaded from Supabase */
    .auth-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 9999;
    }
    .auth-screen .spinner { width: 36px; height: 36px; }
    .auth-screen-title { font-size: 14px; font-weight: 600; color: var(--text2); }
    .access-denied {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
      text-align: center;
      padding: 24px;
    }
    .access-denied i { font-size: 40px; color: var(--red); margin-bottom: 8px; }
    .access-denied h2 { font-size: 18px; font-weight: 700; color: var(--text); }
    .access-denied p { font-size: 13px; color: var(--text2); max-width: 360px; line-height: 1.6; }
    .prog-bar {
      height: 3px;
      background: var(--surface3);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .prog-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--red);
      transition: width 0.6s ease;
    }
    .module-tabs {
      display: flex;
      gap: 2px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .module-tab {
      height: 36px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text3);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 2px solid transparent;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .module-tab:hover { color: var(--text2); }
    .module-tab.active { color: var(--text); border-bottom-color: var(--red); }
    .module-tab .count {
      font-size: 9px;
      background: var(--surface3);
      color: var(--text3);
      padding: 1px 5px;
      border-radius: 99px;
    }
    .module-tab.active .count { background: var(--red-dim); color: var(--red); }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .ml-auto { margin-left: auto; }
    .mr-1 { margin-right: 4px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-5 { margin-bottom: 20px; }
    .text-xs { font-size: 11px; }
    .text-2 { color: var(--text2); }
    .text-3 { color: var(--text3); }
    .font-600 { font-weight: 600; }
    .font-700 { font-weight: 700; }
    .w-full { width: 100%; }
    .fade-enter-active, .fade-leave-active { transition: opacity 0.15s, transform 0.15s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(-4px); }
    @media(max-width:768px){ .mobile-backdrop{ display:block !important; } }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <!-- Auth loading screen -->
  <div class="auth-screen" v-if="authLoading">
    <div class="spinner"></div>
    <span class="auth-screen-title">Verifying session…</span>
  </div>

  <!-- Access denied screen -->
  <div class="access-denied" v-else-if="accessDenied">
    <i class="fas fa-shield-alt"></i>
    <h2>Access Denied</h2>
    <p>{{ accessDeniedMsg }}</p>
    <button class="btn btn-red" @click="doLogout"><i class="fas fa-sign-out-alt"></i> Sign out</button>
  </div>

  <!-- Main console (only shown when auth passes) -->
  <template v-else>
  <!-- HEADER (unchanged) -->
  <header class="header">
    <button class="header-btn mobile-menu-btn" @click="sidebarOpen = !sidebarOpen"><i class="fas fa-bars"></i></button>
    <div class="header-logo-img" style="display:none;"></div>
    <div class="header-divider" style="display:none;"></div>
    <div class="search-bar" :class="{ focused: searchFocused }" @click="openCommand">
      <i class="fas fa-search" style="font-size:11px; color:var(--text3);"></i>
      <input type="text" placeholder="Search customers, orders, tickets... (K)" readonly style="cursor:pointer;" @focus="openCommand">
    </div>
    <div class="ml-auto flex items-center gap-2">
      <span class="clock">{{ currentTime }}</span>
      <div class="header-divider"></div>
      <span class="shift-timer" title="Shift duration">
        <i class="fas fa-circle" style="font-size:5px; color:var(--green); vertical-align:middle; margin-right:3px;"></i>{{ shiftTimer }}
      </span>
      <div class="header-divider"></div>
      <button class="header-btn" @click="notifOpen = !notifOpen; closeOthers('notif')">
        <i class="fas fa-bell"></i>
        <span class="notif-dot" v-if="unreadNotifs > 0"></span>
      </button>
      <span class="role-tag" v-if="jobTitle">{{ jobTitle }}</span>
      <div class="header-divider"></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="avatar" @click="profileOpen = !profileOpen">{{ staffInitials }}</div>
        <div class="staff-info">
          <div class="staff-name">{{ staffName }}</div>
          <div class="staff-role">{{ jobTitle || 'Staff' }}</div>
        </div>
      </div>
      <button class="logout-btn" @click="confirmLogout"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
    <div class="notif-panel" v-if="notifOpen">
      <div class="notif-header"><span style="font-size:12px;font-weight:700;color:var(--text);">Notifications</span><span style="font-size:11px;color:var(--red);cursor:pointer;" @click="markAllRead">Mark all read</span></div>
      <div v-for="n in notifications" :key="n.id" class="notif-item" :class="{unread: n.unread}">
        <div class="notif-icon" :style="{background: n.color + '18'}"><i :class="n.icon" :style="{color: n.color}"></i></div>
        <div><div class="notif-text" v-html="n.text"></div><div class="notif-time">{{ n.time }}</div></div>
      </div>
    </div>
  </header>

  <div class="body-row">
    <!-- SIDEBAR -->
    <nav class="sidebar" :class="{open: sidebarOpen}" @mouseleave="sidebarOpen = false">
      <div class="sidebar-logo">
        <img src="../assets/images/rands-logo.png" alt="Rands Staff Console" class="sidebar-logo-img">
        <span class="sidebar-logo-text">Rands Staff Console</span>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section-label">Overview</div>
        <div class="nav-item" :class="{active: activeModule === 'dashboard'}" @click="navigate('dashboard')">
          <i class="fas fa-th-large"></i><span class="nav-item-label">Dashboard</span>
        </div>
        <div class="nav-section-label" v-if="hasModule('box_office') || hasModule('gate_scanner')">Rands Entry Control</div>
        <div v-if="hasModule('box_office')" class="nav-item" :class="{active: activeModule === 'box_office'}" @click="navigate('box_office')">
          <i class="fas fa-ticket-alt"></i><span class="nav-item-label">Box Office</span>
        </div>
        <div v-if="hasModule('gate_scanner')" class="nav-item" :class="{active: activeModule === 'gate_scanner'}" @click="navigate('gate_scanner')">
          <i class="fas fa-qrcode"></i><span class="nav-item-label">Ticket Scanner</span>
        </div>
        <div class="nav-section-label" v-if="hasModule('shisha_pos') || hasModule('shisha_console')">Hubbly Station</div>
        <div v-if="hasModule('shisha_pos')" class="nav-item" :class="{active: activeModule === 'shisha_pos'}" @click="navigate('shisha_pos')">
          <i class="fas fa-cash-register"></i><span class="nav-item-label">Shisha POS</span>
        </div>
        <div v-if="hasModule('shisha_console')" class="nav-item" :class="{active: activeModule === 'shisha_console'}" @click="navigate('shisha_console')">
          <i class="fas fa-gamepad"></i><span class="nav-item-label">Shisha Console</span>
        </div>
        <div class="nav-section-label" v-if="hasModule('booze_vault') || hasModule('register_locker') || hasModule('unlock_vault') || hasModule('booze_collection') || hasModule('booze_counter')">Rands Smart Counter</div>
        <div v-if="hasModule('booze_vault')" class="nav-item" :class="{active: activeModule === 'booze_vault'}" @click="navigate('booze_vault')">
          <i class="fas fa-box-open"></i><span class="nav-item-label">Booze Vault</span>
        </div>
        <div v-if="hasModule('register_locker')" class="nav-item" :class="{active: activeModule === 'register_locker'}" @click="navigate('register_locker')">
          <i class="fas fa-clipboard-list"></i><span class="nav-item-label">Register Locker</span>
        </div>
        <div v-if="hasModule('unlock_vault')" class="nav-item" :class="{active: activeModule === 'unlock_vault'}" @click="navigate('unlock_vault')">
          <i class="fas fa-key"></i><span class="nav-item-label">Vault Access</span>
        </div>
        <div v-if="hasModule('booze_collection')" class="nav-item" :class="{active: activeModule === 'booze_collection'}" @click="navigate('booze_collection')">
          <i class="fas fa-wine-bottle"></i><span class="nav-item-label">Booze Collection</span>
        </div>
        <div v-if="hasModule('booze_counter')" class="nav-item" :class="{active: activeModule === 'booze_counter'}" @click="navigate('booze_counter')">
          <i class="fas fa-calculator"></i><span class="nav-item-label">Smart Counter</span>
        </div>
        <div class="nav-section-label" v-if="hasModule('pre_order_pos') || hasModule('butcher_orders') || hasModule('butcher_collection')">The Butcher Shop</div>
        <div v-if="hasModule('pre_order_pos')" class="nav-item" :class="{active: activeModule === 'pre_order_pos'}" @click="navigate('pre_order_pos')">
          <i class="fas fa-shopping-cart"></i><span class="nav-item-label">Order POS</span>
          <span class="nav-badge">{{ globalStats.activeOrders }}</span>
        </div>
        <div v-if="hasModule('butcher_orders')" class="nav-item" :class="{active: activeModule === 'butcher_orders'}" @click="navigate('butcher_orders')">
          <i class="fas fa-utensils"></i><span class="nav-item-label">Kitchen Display</span>
        </div>
        <div v-if="hasModule('butcher_collection')" class="nav-item" :class="{active: activeModule === 'butcher_collection'}" @click="navigate('butcher_collection')">
          <i class="fas fa-hand-holding-heart"></i><span class="nav-item-label">Order Collection</span>
        </div>
        <div class="nav-section-label" v-if="hasModule('vvip_tab') || hasModule('vvip_staff')">VVIP Console</div>
        <div v-if="hasModule('vvip_tab')" class="nav-item" :class="{active: activeModule === 'vvip_tab'}" @click="navigate('vvip_tab')">
          <i class="fas fa-star"></i><span class="nav-item-label">VVIP Tab</span>
        </div>
        <div v-if="hasModule('vvip_staff')" class="nav-item" :class="{active: activeModule === 'vvip_staff'}" @click="navigate('vvip_staff')">
          <i class="fas fa-id-card"></i><span class="nav-item-label">VVIP Check-in</span>
        </div>
      </div>
      <div class="sidebar-bottom">
        <div class="nav-item" @click="showToast('Settings coming soon', 'info')"><i class="fas fa-cog"></i><span class="nav-item-label">Settings</span></div>
        <div class="nav-item" @click="showToast('Support: ops@rands.co.za', 'info')"><i class="fas fa-question-circle"></i><span class="nav-item-label">Help</span></div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main">
      <div class="main-header">
        <div class="breadcrumb">
          <span>Rands Cape Town</span><i class="fas fa-chevron-right" style="font-size:9px;color:var(--text3);"></i>
          <span class="active">{{ activeModuleLabel }}</span>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <button class="btn btn-sm" @click="refreshStats"><i class="fas fa-sync-alt" style="font-size:10px;"></i> Refresh</button>
          <button class="btn btn-sm btn-red" v-if="activeModule !== 'dashboard'" @click="enterFullscreen"><i class="fas fa-expand" style="font-size:10px;"></i> Fullscreen</button>
        </div>
      </div>

      <div class="content-area">
        <!-- DASHBOARD (real data only) -->
        <div v-if="activeModule === 'dashboard'" class="content-scroll">
          <!-- Stats row: computed from wallets, refunds, etc. -->
          <div class="stats-grid mb-5">
            <div class="stat-card"><div class="stat-label"><i class="fas fa-users" style="color:var(--blue);"></i> Total Accounts</div><div class="stat-value">{{ globalStats.totalAccounts }}</div><div class="stat-delta delta-up"><i class="fas fa-arrow-up" style="font-size:8px;"></i> wallets</div></div>
            <div class="stat-card"><div class="stat-label"><i class="fas fa-chart-line" style="color:var(--green);"></i> Total Balance</div><div class="stat-value">R{{ globalStats.totalBalance }}</div></div>
            <div class="stat-card"><div class="stat-label"><i class="fas fa-ban"></i> Blocked Passports</div><div class="stat-value">{{ globalStats.blockedAccounts }}</div></div>
            <div class="stat-card"><div class="stat-label"><i class="fas fa-clock"></i> Pending Refunds</div><div class="stat-value">{{ globalStats.pendingRefunds }}</div></div>
            <div class="stat-card"><div class="stat-label"><i class="fas fa-check-circle"></i> Approved Refunds</div><div class="stat-value">{{ globalStats.approvedRefunds }}</div></div>
            <div class="stat-card"><div class="stat-label"><i class="fas fa-coins"></i> Total Refunded</div><div class="stat-value">R{{ globalStats.totalRefundAmount }}</div></div>
            <div class="stat-card"><div class="stat-label"><i class="fas fa-clock" style="color:var(--text3);"></i> Shift Duration</div><div class="stat-value" style="font-size:18px;">{{ shiftTimer }}</div><div class="stat-sub">Started {{ shiftStart }}</div></div>
          </div>

          <div class="two-col mb-5">
            <!-- Left panel: Recent Top‑ups (real) -->
            <div class="panel">
              <div class="panel-header"><span class="panel-title">Recent Top‑ups</span></div>
              <div class="panel-body">
                <div v-if="recentTopups.length === 0" class="empty-state" style="padding:20px;text-align:center;color:var(--text3);">No top‑ups yet</div>
                <div v-for="tx in recentTopups" :key="tx.id" class="queue-row" style="justify-content:space-between;">
                  <div><strong>{{ tx.customer_name }}</strong><br><span class="text-3 text-xs">{{ tx.time }}</span></div>
                  <span class="badge badge-green">+R{{ tx.amount.toFixed(2) }}</span>
                </div>
              </div>
            </div>
            <!-- Right panel: Recent Support Tickets -->
            <div class="panel">
              <div class="panel-header"><span class="panel-title">Recent Support Tickets</span></div>
              <div class="panel-body">
                <div v-if="recentTickets.length === 0" class="empty-state" style="padding:20px;text-align:center;color:var(--text3);">No tickets yet</div>
                <div v-for="t in recentTickets" :key="t.id" class="queue-row" style="justify-content:space-between;">
                  <div><strong>{{ t.customer_name }}</strong><br><span class="text-3 text-xs">{{ t.issue_type.replace('_',' ') }}</span></div>
                  <span class="badge" :class="{'badge-amber': t.status === 'open', 'badge-blue': t.status === 'in_progress', 'badge-green': t.status === 'resolved'}">{{ t.status }}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Pending Approvals (real refund requests) -->
          <div class="section-header mb-3"><span class="section-title">Pending Approvals</span></div>
          <div class="table-wrap mb-5">
            <div v-if="pendingApprovals.length === 0" class="empty-state" style="padding:20px;text-align:center;color:var(--text3);">No pending refund requests</div>
            <div v-for="a in pendingApprovals" :key="a.id" class="activity-item" style="justify-content:space-between;">
              <div><strong>{{ a.label }}</strong><br><span class="text-3 text-xs">{{ a.sub }}</span></div>
              <div class="flex gap-2"><button class="btn btn-sm btn-red" @click="approve(a)">Approve</button><button class="btn btn-sm btn-ghost" @click="decline(a)">Decline</button></div>
            </div>
          </div>

          <!-- Recent Activity (real transactions + tickets) -->
          <div class="section-header mb-3"><span class="section-title">Recent Activity</span></div>
          <div class="table-wrap mb-5">
            <div v-for="act in activityFeed" :key="act.id" class="activity-item">
              <div class="activity-dot" :style="{background: act.color}"></div>
              <span class="activity-text" v-html="act.text"></span>
              <span class="activity-time">{{ act.time }}</span>
            </div>
            <div v-if="activityFeed.length === 0" class="empty-state" style="padding:20px;text-align:center;color:var(--text3);">No recent activity</div>
          </div>

          <!-- Customers table -->
          <div class="section-header mb-3"><span class="section-title">Customers</span><span class="section-action">Export CSV</span></div>
          <div class="table-wrap">
            <div class="table-toolbar">
              <div class="table-search"><i class="fas fa-search" style="font-size:10px;color:var(--text3);"></i><input v-model="customerSearch" placeholder="Search by name, phone, wallet..."></div>
              <button class="filter-pill" :class="{active: customerFilter==='all'}" @click="customerFilter='all'">All</button>
              <button class="filter-pill" :class="{active: customerFilter==='active'}" @click="customerFilter='active'">Active</button>
              <button class="filter-pill" :class="{active: customerFilter==='blocked'}" @click="customerFilter='blocked'">Blocked</button>
              <div class="ml-auto"><button class="btn btn-sm"><i class="fas fa-sliders-h" style="font-size:10px;"></i> Filters</button></div>
            </div>
            <table class="data-table">
              <thead><tr><th>Name</th><th>Phone</th><th>Wallet</th><th>Status</th><th>Checked In</th><th></th></tr></thead>
              <tbody>
                <tr v-for="c in filteredCustomers" :key="c.id">
                  <td><div style="display:flex;align-items:center;gap:8px;"><div style="width:24px;height:24px;border-radius:5px;background:linear-gradient(135deg,#E30613,#8B0000);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white;flex-shrink:0;">{{ c.name[0] }}</div>{{ c.name }}</div></td>
                  <td style="color:var(--text2);">{{ c.phone }}</td><td style="font-weight:600;">R{{ c.wallet }}</td>
                  <td><span class="badge" :class="c.statusClass">{{ c.status }}</span></td>
                  <td style="color:var(--text3);">{{ c.checkedIn }}</td>
                  <td><div class="row-actions"><button class="row-action" title="View profile"><i class="fas fa-eye"></i></button><button class="row-action" title="Top up wallet"><i class="fas fa-wallet"></i></button><button class="row-action" title="More"><i class="fas fa-ellipsis-h"></i></button></div></td>
                </tr>
                <tr v-if="filteredCustomers.length === 0"><td colspan="6" style="text-align:center;padding:24px;color:var(--text3);"><i class="fas fa-search" style="margin-right:6px;"></i> No customers found</td></tr>
              </tbody>
            </table>
            <div class="table-pagination"><span class="page-info">Showing {{ filteredCustomers.length }} of {{ customers.length }} customers</span><div class="page-btns"><button class="page-btn"><i class="fas fa-chevron-left" style="font-size:9px;"></i></button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">3</button><button class="page-btn"><i class="fas fa-chevron-right" style="font-size:9px;"></i></button></div></div>
          </div>
        </div>

        <!-- IFRAME MODULES (unchanged) -->
        <div v-else style="height:100%;position:relative;">
          <div v-if="moduleLoading" class="module-loading"><div class="spinner"></div><span style="font-size:11px;color:var(--text3);">Loading {{ activeModuleLabel }}...</span></div>
          <iframe :src="activeModuleSrc" :title="activeModuleLabel" class="module-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation" referrerpolicy="no-referrer" @load="moduleLoading = false" @error="onIframeError"></iframe>
        </div>
      </div>
    </main>
  </div>

  <!-- Command palette, toasts, modals (unchanged) -->
  <transition name="fade"><div class="cmd-backdrop" v-if="cmdOpen" @click.self="cmdOpen = false"><div class="cmd-box"><div class="cmd-input-row"><i class="fas fa-search" style="color:var(--text3);font-size:14px;"></i><input class="cmd-input" v-model="cmdQuery" ref="cmdInput" placeholder="Search customers..." @keydown.esc="cmdOpen = false" @keydown.enter="cmdEnter"></div><div class="cmd-results"><template v-if="cmdQuery.length < 2"><div class="cmd-group-label">Quick navigation</div><div v-for="mod in availableModules" :key="mod.key" class="cmd-result-item" @click="navigate(mod.key); cmdOpen=false;"><i :class="mod.icon"></i>{{ mod.title }}<span style="margin-left:auto;font-size:10px;color:var(--text3);">Module</span></div></template><template v-else><div class="cmd-group-label">Search results</div><div v-for="r in cmdResults" :key="r.id" class="cmd-result-item"><i :class="r.icon"></i><div><div>{{ r.label }}</div><div style="font-size:10px;color:var(--text3);">{{ r.sub }}</div></div><span class="badge ml-auto" :class="r.badgeClass">{{ r.type }}</span></div><div v-if="cmdResults.length === 0" style="padding:20px;text-align:center;font-size:12px;color:var(--text3);">No results for "{{ cmdQuery }}"</div></template></div><div class="cmd-hint"><span class="kbd"><span class="key">Esc</span> close</span><span class="kbd"><span class="key">Enter</span> open</span><span class="kbd"><span class="key">K</span> open search</span></div></div></div></transition>
  <div class="toast-stack"><div v-for="t in toasts" :key="t.id" class="toast" :class="t.type"><i :class="t.icon"></i><span>{{ t.message }}</span></div></div>
  <transition name="fade"><div class="modal-backdrop" v-if="modal.open" @click.self="modal.open = false"><div class="modal"><div class="modal-title">{{ modal.title }}</div><div class="modal-body">{{ modal.body }}</div><div class="modal-actions"><button class="btn" @click="modal.open = false">Cancel</button><button class="btn btn-red" @click="modal.confirm(); modal.open = false">{{ modal.confirmLabel }}</button></div></div></div></transition>
  <div v-if="isFullscreen && activeModule !== 'dashboard'" style="position:fixed;inset:0;z-index:5000;background:#0D0F12;display:flex;flex-direction:column;"><div style="height:40px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;"><i :class="activeModuleMeta?.icon" style="color:var(--red);font-size:13px;"></i><span style="font-size:12px;font-weight:600;color:var(--text);">{{ activeModuleLabel }}</span><div class="ml-auto flex items-center gap-2"><span class="clock">{{ currentTime }}</span><button class="btn btn-sm" @click="isFullscreen = false"><i class="fas fa-compress" style="font-size:10px;"></i> Exit Fullscreen</button></div></div><iframe :src="activeModuleSrc" :title="activeModuleLabel" style="flex:1;border:none;" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation" referrerpolicy="no-referrer"></iframe></div>
  <div v-if="sidebarOpen" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:39;display:none;" class="mobile-backdrop" @click="sidebarOpen = false"></div>
  </template>
</div>

<script>
const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;

// ========================
// SUPABASE CLIENT (direct, no fallbacks)
// ========================
const SUPABASE_URL = 'https://odpugxrihfspaucsdqjj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcHVneHJpaGZzcGF1Y3NkcWpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTQ5MDcsImV4cCI6MjA5NDMzMDkwN30.c1xpL4p4llS8oNzdg0evCuJNaBMC1REPG0dNk47WeMU';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ========================
// HELPER FUNCTIONS (no mocks, only real data)
// ========================
async function fetchWalletsWithProfiles() {
  const { data, error } = await supabaseClient
    .from('wallets')
    .select(`id, balance, status, user_id, profiles (id, name, email, phone, created_at)`)
    .order('created_at', { ascending: false });
  if (error) throw error;
  return (data || []).map(w => ({
    id: w.id,
    balance: parseFloat(w.balance) || 0,
    status: w.status === 'active' ? 'Active' : 'Blocked',
    user_id: w.user_id,
    name: w.profiles?.name || 'Unknown',
    email: w.profiles?.email || '',
    phone: w.profiles?.phone || '',
    profile_created_at: w.profiles?.created_at || null,
    created_at: w.created_at
  }));
}

async function fetchRefundRequests() {
  const { data, error } = await supabaseClient.from('refund_requests').select('*, profiles(name)').order('created_at', { ascending: false });
  if (error) throw error;
  return (data || []).map(r => ({
    id: r.id,
    customer_name: r.profiles?.name || 'Unknown',
    amount: parseFloat(r.amount),
    reason: r.reason,
    status: r.status,
    created_at: r.created_at
  }));
}

async function fetchRecentTopups(limit = 8) {
  const { data, error } = await supabaseClient
    .from('wallet_transactions')
    .select('*, wallets(user_id, profiles(name))')
    .eq('type', 'topup')
    .order('created_at', { ascending: false })
    .limit(limit);
  if (error) return [];
  return (data || []).map(tx => ({
    id: tx.id,
    amount: parseFloat(tx.amount),
    customer_name: tx.wallets?.profiles?.name || 'Customer',
    time: new Date(tx.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
  }));
}

async function fetchRecentTickets(limit = 5) {
  const { data, error } = await supabaseClient
    .from('support_tickets')
    .select('*, profiles(name)')
    .order('created_at', { ascending: false })
    .limit(limit);
  if (error) return [];
  return (data || []).map(t => ({
    id: t.id,
    customer_name: t.profiles?.name || 'Unknown',
    issue_type: t.issue_type,
    status: t.status,
    created_at: t.created_at
  }));
}

// ========================
// VUE APP (no mock data, no localStorage)
// ========================
const UI_PATHS = {
  box_office: 'box-office.html', gate_scanner: 'gate-scanner.html',
  shisha_pos: 'shisha-pos.html', shisha_console: 'shisha-console.html',
  booze_vault: 'vault.html', register_locker: '../kiosk/register-locker.html',
  unlock_vault: '../kiosk/unlock-vault.html', booze_collection: 'booze-collection.html',
  booze_counter: 'booze-counter.html', pre_order_pos: 'pre-order-pos.html',
  butcher_orders: 'butcher-orders.html', butcher_collection: 'butcher-collection.html',
  vvip_tab: 'vvip-tab.html', vvip_staff: 'vvip-staff.html'
};
const MODULE_META = {
  dashboard: { title: 'Dashboard', icon: 'fas fa-th-large', src: null },
  box_office: { title: 'Box Office', icon: 'fas fa-ticket-alt', src: UI_PATHS.box_office },
  gate_scanner: { title: 'Gate Scanner', icon: 'fas fa-qrcode', src: UI_PATHS.gate_scanner },
  shisha_pos: { title: 'Shisha POS', icon: 'fas fa-cash-register', src: UI_PATHS.shisha_pos },
  shisha_console: { title: 'Shisha Console', icon: 'fas fa-gamepad', src: UI_PATHS.shisha_console },
  booze_vault: { title: 'Booze Vault', icon: 'fas fa-box-open', src: UI_PATHS.booze_vault },
  register_locker: { title: 'Register Locker', icon: 'fas fa-clipboard-list', src: UI_PATHS.register_locker },
  unlock_vault: { title: 'Vault Access', icon: 'fas fa-key', src: UI_PATHS.unlock_vault },
  booze_collection: { title: 'Booze Collection', icon: 'fas fa-wine-bottle', src: UI_PATHS.booze_collection },
  booze_counter: { title: 'Rands Counter', icon: 'fas fa-calculator', src: UI_PATHS.booze_counter },
  pre_order_pos: { title: 'Order Processing', icon: 'fas fa-shopping-cart', src: UI_PATHS.pre_order_pos },
  butcher_orders: { title: 'Kitchen Display', icon: 'fas fa-utensils', src: UI_PATHS.butcher_orders },
  butcher_collection: { title: 'Order Collection', icon: 'fas fa-hand-holding-heart', src: UI_PATHS.butcher_collection },
  vvip_tab: { title: 'VVIP Tab', icon: 'fas fa-star', src: UI_PATHS.vvip_tab },
  vvip_staff: { title: 'VVIP Check-in', icon: 'fas fa-id-card', src: UI_PATHS.vvip_staff }
};
// ========================
// JOB TITLE → MODULE PERMISSIONS
// (Defined server-side in spirit; matched by job_title from profiles table)
// ========================
const JOB_TITLE_MODULES = {
  'Event Manager':    ['box_office','gate_scanner','shisha_pos','shisha_console','booze_vault','register_locker','unlock_vault','booze_collection','booze_counter','pre_order_pos','butcher_orders','butcher_collection','vvip_tab','vvip_staff'],
  'Event Host':       ['box_office','gate_scanner'],
  'Shisha Attendant': ['shisha_pos','shisha_console'],
  'Smart Host':       ['booze_vault','register_locker','unlock_vault','booze_collection','booze_counter'],
  'Butcher Crew':     ['pre_order_pos','butcher_orders','butcher_collection'],
  'VVIP Concierge':   ['vvip_tab','vvip_staff'],
};

createApp({
  setup() {
    // ── Auth / permission state ──────────────────────────────────────────────
    const authLoading    = ref(true);
    const accessDenied   = ref(false);
    const accessDeniedMsg= ref('');
    const jobTitle       = ref('');          // from profiles.job_title
    const allowedModules = ref([]);          // derived from jobTitle

    // ── Original UI state (unchanged) ───────────────────────────────────────
    const staffName   = ref('Staff Member');
    const activeModule= ref('dashboard');
    const moduleLoading= ref(false);
    const sidebarOpen = ref(false);
    const notifOpen   = ref(false);
    const cmdOpen     = ref(false);
    const cmdQuery    = ref('');
    const cmdInput    = ref(null);
    const isFullscreen= ref(false);
    const currentTime = ref('');
    const shiftTimer  = ref('00:00:00');
    const shiftStart  = ref('');
    const customerSearch= ref('');
    const customerFilter= ref('all');
    const toasts      = ref([]);
    const modal       = ref({ open: false, title: '', body: '', confirmLabel: 'Confirm', confirm: () => {} });
    const profileOpen = ref(false);

    // ── Real data state (unchanged) ─────────────────────────────────────────
    const wallets          = ref([]);
    const customers        = ref([]);
    const pendingApprovals = ref([]);
    const activityFeed     = ref([]);
    const notifications    = ref([]);
    const unreadNotifs     = ref(0);
    const recentTopups     = ref([]);
    const recentTickets    = ref([]);

    const globalStats = computed(() => {
      const totalAccounts    = wallets.value.length;
      const totalBalance     = wallets.value.reduce((s, w) => s + w.balance, 0).toFixed(2);
      const blockedAccounts  = wallets.value.filter(w => w.status === 'Blocked').length;
      const pendingRefunds   = pendingApprovals.value.length;
      return { totalAccounts, totalBalance, blockedAccounts, pendingRefunds, approvedRefunds: 0, totalRefundAmount: 0, activeOrders: 0, ticketsScanned: 0, scanPct: 0, walletLoads: 0, walletValue: 0, vvipTables: 0, vvipPending: 0 };
    });

    // ── Toast helper ────────────────────────────────────────────────────────
    let toastId = 0;
    const showToast = (message, type = 'info') => {
      const icons = { success:'fas fa-check-circle', error:'fas fa-times-circle', info:'fas fa-info-circle', warn:'fas fa-exclamation-triangle' };
      const id = ++toastId;
      toasts.value.push({ id, message, type, icon: icons[type] || icons.info });
      setTimeout(() => { toasts.value = toasts.value.filter(t => t.id !== id); }, 3500);
    };

    // ── Auth: load user → profile → job_title → permissions ─────────────────
    const loadAuth = async () => {
      authLoading.value = true;
      try {
        const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
        if (authError || !user) {
          accessDenied.value   = true;
          accessDeniedMsg.value= 'You are not logged in. Please sign in to access the Staff Console.';
          authLoading.value    = false;
          return;
        }

        const { data: profile, error: profileError } = await supabaseClient
          .from('profiles')
          .select('name, role, job_title')
          .eq('id', user.id)
          .single();

        if (profileError || !profile) {
          accessDenied.value   = true;
          accessDeniedMsg.value= 'Your staff profile could not be found. Please contact your administrator.';
          authLoading.value    = false;
          return;
        }

        if (profile.role !== 'staff') {
          accessDenied.value   = true;
          accessDeniedMsg.value= `This console is for staff members only. Your account role is "${profile.role}". Please use the correct portal.`;
          authLoading.value    = false;
          return;
        }

        const title = profile.job_title || '';
        const perms = JOB_TITLE_MODULES[title] || [];

        if (!title || perms.length === 0) {
          accessDenied.value   = true;
          accessDeniedMsg.value= 'No job title has been assigned to your account. Please contact your administrator to set up your role.';
          authLoading.value    = false;
          return;
        }

        // Auth passed — populate state
        staffName.value     = profile.name || user.email || 'Staff Member';
        jobTitle.value      = title;
        allowedModules.value= perms;
        authLoading.value   = false;

        // Now load live data
        fetchAllData();
      } catch (err) {
        console.error('Auth error:', err);
        accessDenied.value   = true;
        accessDeniedMsg.value= 'An unexpected error occurred during authentication. Please try again.';
        authLoading.value    = false;
      }
    };

    // ── Data fetching (unchanged logic) ──────────────────────────────────────
    const fetchAllData = async () => {
      try {
        wallets.value = await fetchWalletsWithProfiles();
        customers.value = wallets.value.map(w => ({
          id: w.id, name: w.name, phone: w.phone,
          wallet: w.balance.toFixed(2), status: w.status,
          statusClass: w.status === 'Active' ? 'badge-green' : 'badge-red',
          checkedIn: w.profile_created_at ? new Date(w.profile_created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '—'
        }));
        const refunds = await fetchRefundRequests();
        pendingApprovals.value = refunds.filter(r => r.status === 'pending').map(r => ({
          id: r.id, label: `Refund R${r.amount.toFixed(2)}`, sub: r.customer_name + (r.reason ? ` – ${r.reason}` : '')
        }));
        recentTopups.value  = await fetchRecentTopups(6);
        recentTickets.value = await fetchRecentTickets(5);
        const feed = [];
        recentTopups.value.slice(0,5).forEach(tx => {
          feed.push({ id: `tx-${tx.id}`, color: '#22C55E', text: `<strong>${tx.customer_name}</strong> top‑up of R${tx.amount.toFixed(2)}`, time: tx.time });
        });
        recentTickets.value.slice(0,5).forEach(t => {
          feed.push({ id: `ticket-${t.id}`, color: '#3B82F6', text: `<strong>${t.customer_name}</strong> opened ticket: ${t.issue_type.replace('_',' ')}`, time: new Date(t.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        });
        feed.sort((a,b) => b.time.localeCompare(a.time));
        activityFeed.value = feed.slice(0, 10);
        notifications.value = [
          { id:1, icon:'fas fa-wallet', color:'#3B82F6', text:`Loaded ${wallets.value.length} wallets`, time:'now', unread:true },
          { id:2, icon:'fas fa-clock',  color:'#F59E0B', text:`${pendingApprovals.value.length} pending refunds`, time:'now', unread:true }
        ];
        unreadNotifs.value = notifications.value.filter(n => n.unread).length;
        showToast(`Loaded ${wallets.value.length} wallets`, 'success');
      } catch (err) {
        console.error(err);
        showToast('Error loading data from Supabase', 'error');
      }
    };

    const refreshStats = () => fetchAllData();

    // ── Permission guard ─────────────────────────────────────────────────────
    /**
     * Returns true only if the current staff member's allowed modules include key.
     * This is the single source of truth for all sidebar v-if checks and navigation guards.
     */
    const hasModule = (key) => allowedModules.value.includes(key);

    // ── Navigation with access guard ─────────────────────────────────────────
    const navigate = (key) => {
      if (key === 'dashboard') { activeModule.value = 'dashboard'; sidebarOpen.value = false; notifOpen.value = false; return; }
      if (!hasModule(key)) {
        showToast('Access denied: you are not authorised to use this module.', 'error');
        return;
      }
      if (key === activeModule.value) return;
      activeModule.value  = key;
      moduleLoading.value = true;
      sidebarOpen.value   = false;
      notifOpen.value     = false;
    };

    // ── Logout ───────────────────────────────────────────────────────────────
    const doLogout = async () => {
      await supabaseClient.auth.signOut();
      showToast('Signed out', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 800);
    };

    const confirmLogout = () => {
      modal.value = {
        open: true, title: 'End session',
        body: `Sign out as ${staffName.value}?`,
        confirmLabel: 'Sign out',
        confirm: () => { modal.value.open = false; doLogout(); }
      };
    };

    // ── Refund actions ───────────────────────────────────────────────────────
    const approve = async (item) => {
      const confirmed = await new Promise(resolve => {
        modal.value = { open: true, title: 'Approve Refund', body: `Approve refund for ${item.label}?`, confirmLabel: 'Approve', confirm: () => resolve(true) };
      });
      if (!confirmed) return;
      await supabaseClient.from('refund_requests').update({ status: 'approved', processed_at: new Date().toISOString() }).eq('id', item.id);
      showToast(`Refund approved: ${item.label}`, 'success');
      await fetchAllData();
    };
    const decline = async (item) => {
      const confirmed = await new Promise(resolve => {
        modal.value = { open: true, title: 'Reject Refund', body: `Reject refund for ${item.label}?`, confirmLabel: 'Reject', confirm: () => resolve(true) };
      });
      if (!confirmed) return;
      await supabaseClient.from('refund_requests').update({ status: 'rejected' }).eq('id', item.id);
      showToast(`Refund rejected: ${item.label}`, 'warning');
      await fetchAllData();
    };
    const markAllRead = () => { notifications.value.forEach(n => n.unread = false); unreadNotifs.value = 0; };

    // ── UI helpers ───────────────────────────────────────────────────────────
    const onIframeError  = () => { moduleLoading.value = false; showToast(`Could not load ${activeModuleLabel.value}`, 'error'); };
    const enterFullscreen= () => { isFullscreen.value = true; };
    const openCommand    = () => { cmdOpen.value = true; nextTick(() => cmdInput.value?.focus()); };
    const cmdEnter       = () => { if (cmdResults.value.length) showToast(`Opened: ${cmdResults.value[0].label}`, 'info'); cmdOpen.value = false; cmdQuery.value = ''; };
    const closeOthers    = (keep) => { if (keep !== 'notif') notifOpen.value = false; };

    // ── Computed ─────────────────────────────────────────────────────────────
    const staffInitials     = computed(() => staffName.value.slice(0,2).toUpperCase());
    const availableModules  = computed(() => allowedModules.value.map(k => ({ key: k, ...MODULE_META[k] })).filter(m => m.title));
    const activeModuleMeta  = computed(() => MODULE_META[activeModule.value]);
    const activeModuleLabel = computed(() => activeModuleMeta.value?.title || 'Dashboard');
    const activeModuleSrc   = computed(() => activeModuleMeta.value?.src || '');
    const filteredCustomers = computed(() => {
      let list = customers.value;
      if (customerFilter.value === 'active')  list = list.filter(c => c.status === 'Active');
      if (customerFilter.value === 'blocked') list = list.filter(c => c.status === 'Blocked');
      if (customerSearch.value.trim()) {
        const q = customerSearch.value.toLowerCase();
        list = list.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q) || c.id.includes(q));
      }
      return list;
    });
    const cmdResults = computed(() => {
      if (cmdQuery.value.length < 2) return [];
      const q = cmdQuery.value.toLowerCase();
      return customers.value.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q)).slice(0,5).map(c => ({ id: c.id, icon:'fas fa-user', label: c.name, sub: c.phone + ' · Wallet R' + c.wallet, type:'Customer', badgeClass:'badge-blue' }));
    });

    // ── Timers ───────────────────────────────────────────────────────────────
    let timeInt, shiftInt, statsInt;
    const shiftStartTs = Date.now();
    shiftStart.value   = new Date(shiftStartTs).toLocaleTimeString('en-ZA', { hour:'2-digit', minute:'2-digit', hour12:false });
    const updateTime   = () => { currentTime.value = new Date().toLocaleTimeString('en-ZA', { hour12: false }); };
    const updateShift  = () => { const s = Math.floor((Date.now() - shiftStartTs) / 1000); shiftTimer.value = `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
    const handleKey    = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCommand(); }
      if (e.key === 'k' && !cmdOpen.value && document.activeElement.tagName !== 'INPUT') openCommand();
      if (e.key === 'Escape') { cmdOpen.value = false; notifOpen.value = false; isFullscreen.value = false; }
    };

    onMounted(() => {
      updateTime(); updateShift();
      timeInt  = setInterval(updateTime,  1000);
      shiftInt = setInterval(updateShift, 1000);
      statsInt = setInterval(() => { if (!authLoading.value && !accessDenied.value) fetchAllData(); }, 30000);
      window.addEventListener('keydown', handleKey);
      loadAuth();   // ← kick off Supabase auth check; data load follows inside loadAuth()
    });
    onUnmounted(() => { clearInterval(timeInt); clearInterval(shiftInt); clearInterval(statsInt); window.removeEventListener('keydown', handleKey); });

    return {
      authLoading, accessDenied, accessDeniedMsg,
      jobTitle, staffName, staffInitials, activeModule, moduleLoading,
      sidebarOpen, notifOpen, cmdOpen, cmdQuery, cmdInput, isFullscreen, currentTime,
      shiftTimer, shiftStart, globalStats, notifications, unreadNotifs, pendingApprovals,
      activityFeed, customers, customerSearch, customerFilter, filteredCustomers,
      recentTopups, recentTickets, cmdResults, toasts, modal, profileOpen,
      availableModules, activeModuleMeta, activeModuleLabel, activeModuleSrc,
      hasModule, navigate, showToast, confirmLogout, doLogout, approve, decline,
      markAllRead, onIframeError, enterFullscreen, refreshStats,
      openCommand, cmdEnter, closeOthers
    };
  }
}).mount('#app');
</script>
</body>
</html>
