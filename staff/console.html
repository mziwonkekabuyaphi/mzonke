<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VELVET OPS · Rands Cape Town</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ─── TOKENS ─────────────────────────────────────── */
        :root {
            --bg:          #08090a;
            --surface:     #111214;
            --surface-2:   #181a1d;
            --border:      rgba(255,255,255,0.07);
            --border-hi:   rgba(255,255,255,0.13);
            --accent:      #E30613;
            --accent-dim:  rgba(227,6,19,0.18);
            --accent-glow: rgba(227,6,19,0.35);
            --green:       #22c55e;
            --text:        #f0f0f0;
            --text-2:      rgba(240,240,240,0.55);
            --text-3:      rgba(240,240,240,0.28);
            --sidebar-w:   260px;
            --topbar-h:    56px;
            --radius:      16px;
            --mono:        'DM Mono', monospace;
            --display:     'Syne', sans-serif;
            --body:        'Inter', sans-serif;
        }

        /* ─── RESET ───────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: var(--bg); }
        body { font-family: var(--body); color: var(--text); -webkit-tap-highlight-color: transparent; }
        [v-cloak] { display: none; }

        /* ─── SCROLLBAR ───────────────────────────────────── */
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(227,6,19,0.4); border-radius: 99px; }

        /* ─── LAYOUT ──────────────────────────────────────── */
        #app { display: flex; height: 100vh; width: 100vw; overflow: hidden; position: relative; }

        /* ─── AMBIENT BG ──────────────────────────────────── */
        .ambient {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(ellipse 60% 40% at 10% 0%, rgba(227,6,19,0.06) 0%, transparent 65%),
                radial-gradient(ellipse 50% 40% at 90% 100%, rgba(227,6,19,0.04) 0%, transparent 60%),
                var(--bg);
        }
        .grid-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.25;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* ─── SIDEBAR ─────────────────────────────────────── */
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0;
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            z-index: 100;
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        .sidebar-header {
            height: var(--topbar-h);
            display: flex; align-items: center; gap: 12px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-logo {
            width: 28px; height: 28px;
            background: var(--accent);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--display); font-weight: 800; font-size: 13px;
            letter-spacing: -0.5px; color: #fff;
            flex-shrink: 0;
        }
        .sidebar-brand {
            font-family: var(--display); font-weight: 700; font-size: 14px;
            color: var(--text); letter-spacing: 0.02em; line-height: 1.1;
        }
        .sidebar-brand small {
            display: block; font-family: var(--mono); font-size: 9px;
            font-weight: 400; color: var(--text-3); letter-spacing: 0.15em;
            text-transform: uppercase; margin-top: 1px;
        }

        /* system status pill */
        .sys-status {
            display: flex; align-items: center; gap: 7px;
            margin: 16px 20px 8px;
            padding: 8px 12px;
            background: rgba(34,197,94,0.08);
            border: 1px solid rgba(34,197,94,0.2);
            border-radius: 8px;
        }
        .sys-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0;
            box-shadow: 0 0 6px rgba(34,197,94,0.8); animation: blink 2.2s ease-in-out infinite; }
        @keyframes blink { 0%,100%{ opacity:1 } 50%{ opacity:0.3 } }
        .sys-label { font-family: var(--mono); font-size: 10px; color: var(--green); letter-spacing: 0.1em; text-transform: uppercase; }

        /* role badge */
        .role-badge {
            margin: 0 20px 16px;
            padding: 10px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .role-badge-label { font-family: var(--mono); font-size: 9px; color: var(--text-3); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px; }
        .role-badge-name { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--text); }
        .role-badge-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

        /* nav section label */
        .nav-section-label {
            font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em;
            text-transform: uppercase; color: var(--text-3);
            padding: 0 20px 8px;
        }

        /* nav items */
        .nav-list { flex: 1; overflow-y: auto; padding: 0 12px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.18s, color 0.18s;
            margin-bottom: 2px;
            border: 1px solid transparent;
            position: relative;
        }
        .nav-item:hover { background: var(--surface-2); border-color: var(--border); }
        .nav-item.active {
            background: var(--accent-dim);
            border-color: rgba(227,6,19,0.3);
        }
        .nav-item.active .nav-icon { color: var(--accent); }
        .nav-item.active .nav-title { color: var(--text); }
        .nav-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: var(--text-2); background: var(--surface-2); flex-shrink: 0;
            transition: color 0.18s; }
        .nav-item.active .nav-icon { background: rgba(227,6,19,0.15); }
        .nav-title { font-size: 13px; font-weight: 500; color: var(--text-2); transition: color 0.18s; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.5s ease-in-out infinite; flex-shrink: 0; }

        /* sidebar footer */
        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding: 14px 20px;
            flex-shrink: 0;
        }
        .staff-row { display: flex; align-items: center; gap: 10px; }
        .staff-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--accent-dim);
            border: 1px solid rgba(227,6,19,0.3);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--accent);
            flex-shrink: 0;
        }
        .staff-name { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .staff-shift { font-family: var(--mono); font-size: 9px; color: var(--green); letter-spacing: 0.1em; text-transform: uppercase; }

        /* ─── TOPBAR ──────────────────────────────────────── */
        .topbar {
            position: fixed; left: var(--sidebar-w); right: 0; top: 0;
            height: var(--topbar-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 0;
            padding: 0 24px;
            z-index: 90;
            transition: left 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        .topbar-module-name {
            font-family: var(--display); font-weight: 700; font-size: 16px;
            color: var(--text); flex: 1;
        }
        .topbar-module-name span { color: var(--accent); margin-right: 6px; font-size: 12px; }
        .topbar-clock {
            font-family: var(--mono); font-size: 13px; color: var(--text-2);
            background: var(--surface-2); border: 1px solid var(--border);
            padding: 5px 12px; border-radius: 7px; letter-spacing: 0.06em;
        }
        .topbar-venue {
            font-family: var(--mono); font-size: 10px; color: var(--text-3);
            margin-left: 14px; letter-spacing: 0.12em; text-transform: uppercase;
        }
        .menu-toggle {
            display: none; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 8px;
            background: var(--surface-2); border: 1px solid var(--border);
            color: var(--text-2); cursor: pointer; margin-right: 14px; flex-shrink: 0;
            font-size: 14px; transition: background 0.18s;
        }
        .menu-toggle:hover { background: var(--surface); color: var(--text); }

        /* ─── STAT PILLS (topbar right) ──────────────────── */
        .stat-pills { display: flex; gap: 8px; margin-right: 14px; }
        .stat-pill {
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 8px; padding: 5px 12px;
            display: flex; flex-direction: column; align-items: flex-end;
        }
        .stat-pill-val { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--text); line-height: 1; }
        .stat-pill-label { font-family: var(--mono); font-size: 8px; color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }

        /* ─── MAIN CONTENT ────────────────────────────────── */
        .main {
            margin-left: var(--sidebar-w);
            margin-top: var(--topbar-h);
            flex: 1;
            display: flex; flex-direction: column;
            height: calc(100vh - var(--topbar-h));
            overflow: hidden;
            position: relative; z-index: 1;
            transition: margin-left 0.35s cubic-bezier(0.4,0,0.2,1);
        }

        /* ─── WELCOME BANNER ──────────────────────────────── */
        .welcome-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px 0;
            flex-shrink: 0;
        }
        .welcome-greeting { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; }
        .welcome-greeting em { color: var(--accent); font-style: normal; }
        .welcome-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }
        .live-badge {
            display: flex; align-items: center; gap: 7px;
            padding: 7px 14px;
            background: var(--accent-dim); border: 1px solid rgba(227,6,19,0.3);
            border-radius: 99px;
            font-family: var(--mono); font-size: 10px; color: var(--accent);
            letter-spacing: 0.1em; text-transform: uppercase;
        }
        .live-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s ease-in-out infinite; }

        /* ─── IFRAME AREA ─────────────────────────────────── */
        .iframe-area {
            flex: 1; display: flex; flex-direction: column;
            padding: 16px 24px 20px;
            overflow: hidden;
        }
        .iframe-card {
            flex: 1; display: flex; flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border-hi);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            min-height: 0;
        }
        .iframe-card-header {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--surface-2);
        }
        .iframe-card-icon {
            width: 36px; height: 36px; border-radius: 10px;
            background: var(--accent-dim); border: 1px solid rgba(227,6,19,0.25);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent); font-size: 15px; flex-shrink: 0;
        }
        .iframe-card-title { font-family: var(--display); font-weight: 700; font-size: 15px; flex: 1; }
        .iframe-card-subtitle { font-family: var(--mono); font-size: 10px; color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase; }
        .iframe-expand-btn {
            width: 34px; height: 34px; border-radius: 8px;
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text-2); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 13px; transition: all 0.18s; flex-shrink: 0;
        }
        .iframe-expand-btn:hover { background: var(--accent-dim); border-color: rgba(227,6,19,0.3); color: var(--accent); }
        .iframe-wrapper { flex: 1; position: relative; min-height: 0; }
        .iframe-wrapper iframe {
            width: 100%; height: 100%; border: none;
            background: transparent; display: block;
        }

        /* Loading shimmer */
        .iframe-loader {
            position: absolute; inset: 0; z-index: 5;
            background: var(--surface);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        }
        .loader-spinner {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid var(--border-hi);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-label { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase; }

        /* iframe error */
        .iframe-error-state {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
            background: var(--surface);
        }
        .iframe-error-icon { font-size: 32px; color: var(--accent); }
        .iframe-error-title { font-family: var(--display); font-weight: 700; font-size: 15px; }
        .iframe-error-sub { font-size: 12px; color: var(--text-3); text-align: center; max-width: 260px; }

        /* ─── EMPTY STATE ─────────────────────────────────── */
        .empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
            color: var(--text-3);
        }
        .empty-state i { font-size: 36px; color: var(--border-hi); }
        .empty-state p { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }

        /* ─── TOAST ───────────────────────────────────────── */
        .toast-wrap {
            position: fixed; top: calc(var(--topbar-h) + 12px); right: 16px; z-index: 500;
            pointer-events: none;
        }
        .toast {
            background: var(--surface-2); border: 1px solid var(--border-hi);
            border-left: 3px solid var(--accent);
            border-radius: 12px; padding: 12px 18px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            animation: toastIn 0.25s ease-out;
            min-width: 220px; max-width: 320px;
        }
        @keyframes toastIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }
        .toast i { color: var(--accent); font-size: 14px; flex-shrink: 0; }
        .toast-text { font-size: 13px; color: var(--text); flex: 1; }

        /* ─── FULLSCREEN OVERLAY ──────────────────────────── */
        .fullscreen-overlay {
            position: fixed; inset: 0; background: #000;
            z-index: 10000; display: flex; flex-direction: column;
        }
        .fullscreen-overlay iframe { width: 100%; flex: 1; border: none; }
        .fullscreen-exit-btn {
            position: fixed; bottom: 24px; right: 24px;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%; width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; cursor: pointer; z-index: 10002; font-size: 18px;
            transition: all 0.2s;
        }
        .fullscreen-exit-btn:hover { background: var(--accent); border-color: transparent; transform: scale(1.1); }
        .fullscreen-exit-hint {
            position: fixed; bottom: 24px; left: 0; right: 0;
            text-align: center; pointer-events: none;
            color: rgba(255,255,255,0.3); font-family: var(--mono); font-size: 10px;
            letter-spacing: 0.1em; z-index: 10001;
        }

        /* ─── PIN MODAL ───────────────────────────────────── */
        .pin-modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92); backdrop-filter: blur(16px);
            z-index: 20000; display: flex; align-items: center; justify-content: center;
        }
        .pin-modal-card {
            background: var(--surface-2);
            border: 1px solid rgba(227,6,19,0.3);
            border-radius: 24px; padding: 36px 32px; width: 90%; max-width: 320px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(227,6,19,0.12);
        }
        .pin-icon { font-size: 28px; color: var(--accent); margin-bottom: 14px; }
        .pin-title { font-family: var(--display); font-weight: 700; font-size: 17px; margin-bottom: 20px; }
        .pin-input {
            width: 100%; background: var(--surface); border: 1px solid rgba(227,6,19,0.3);
            border-radius: 12px; padding: 14px 16px; color: var(--text);
            font-family: var(--mono); font-size: 22px; text-align: center; letter-spacing: 8px;
            outline: none; margin-bottom: 20px; transition: border-color 0.2s;
        }
        .pin-input:focus { border-color: rgba(227,6,19,0.6); }
        .pin-buttons { display: flex; gap: 10px; }
        .pin-btn {
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            font-family: var(--display); font-weight: 700; font-size: 14px;
            cursor: pointer; transition: all 0.18s;
        }
        .pin-btn-cancel { background: var(--surface); color: var(--text-2); border: 1px solid var(--border-hi); }
        .pin-btn-cancel:hover { background: var(--surface-2); color: var(--text); }
        .pin-btn-confirm { background: var(--accent); color: #fff; }
        .pin-btn-confirm:hover { background: #c00511; }
        .pin-error-msg { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 12px; letter-spacing: 0.05em; }

        /* ─── SIDEBAR OVERLAY (mobile) ─────────────────────── */
        .sidebar-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px); z-index: 99;
        }

        /* ─── FAB ─────────────────────────────────────────── */
        .fab {
            position: fixed; bottom: 24px; right: 24px;
            width: 52px; height: 52px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #c00511);
            color: #fff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.2s; z-index: 80; font-size: 18px; border: none;
        }
        .fab:active { transform: scale(0.93); }
        .fab:hover { box-shadow: 0 6px 28px var(--accent-glow); transform: scale(1.05); }

        /* Radial menu */
        .radial-menu-overlay {
            position: fixed; inset: 0; z-index: 79; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
        }
        .radial-menu {
            position: fixed; bottom: 90px; right: 24px; z-index: 80;
            background: var(--surface-2); border: 1px solid var(--border-hi);
            border-radius: 20px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            animation: toastIn 0.2s ease-out;
        }
        .radial-item {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            padding: 14px 16px; border-radius: 14px; cursor: pointer;
            background: var(--surface); border: 1px solid var(--border);
            transition: all 0.18s; min-width: 80px;
        }
        .radial-item:hover { background: var(--surface-2); border-color: var(--border-hi); }
        .radial-item i { font-size: 18px; color: var(--text-2); }
        .radial-item span { font-size: 11px; color: var(--text-3); font-weight: 500; }

        /* ─── TRANSITIONS ─────────────────────────────────── */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.25s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }

        /* ─── MOBILE ──────────────────────────────────────── */
        @media (max-width: 768px) {
            :root { --sidebar-w: 260px; }

            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay { display: block; }

            .topbar { left: 0; }
            .main { margin-left: 0; }

            .menu-toggle { display: flex; }

            .stat-pills { display: none; }
            .topbar-venue { display: none; }

            .welcome-bar { padding: 12px 16px 0; }
            .iframe-area { padding: 12px 16px 16px; }

            .fab { bottom: 20px; right: 20px; }
            .radial-menu { right: 16px; bottom: 82px; }
        }

        /* ─── STAGGER ANIM ────────────────────────────────── */
        @keyframes navItemIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .nav-item { animation: navItemIn 0.3s ease-out both; }

        /* Iframe slide transition */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .iframe-card { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body>

<div id="app" v-cloak>
    <!-- ── AMBIENT BACKGROUNDS ────────────────────────── -->
    <div class="ambient"></div>
    <div class="grid-overlay"></div>

    <!-- ════════════════════════════════════════════════ -->
    <!--  MAIN CONSOLE (visible when not fullscreen)     -->
    <!-- ════════════════════════════════════════════════ -->
    <template v-if="!isFullscreenActive">

        <!-- Sidebar overlay (mobile) -->

        <!-- ── SIDEBAR ───────────────────────────────── -->
        <aside class="sidebar" :class="{ open: sidebarOpen }">

            <!-- Staff footer -->

                    </div>
                </div>
            </div>
        </aside>

        <!-- ── TOP BAR ───────────────────────────────── -->
        <header class="topbar">
            <div class="menu-toggle" @click="sidebarOpen = !sidebarOpen">
                <i class="fas fa-bars"></i>
            </div>

            <div class="topbar-module-name">
                <span>▸</span>
                <span v-if="currentDisplayModule">{{ cleanTitle(currentDisplayModule.title) }}</span>
                <span v-else style="color: var(--text-3);">Select a Module</span>
            </div>

            <!-- Stats pills (contextual, live) -->
            <div class="stat-pills" v-if="leftStatValue !== '—' || rightStatValue !== '—'">
                <div class="stat-pill">
                    <div class="stat-pill-val">{{ leftStatValue }}</div>
                    <div class="stat-pill-label">{{ leftStatLabel }}</div>
                </div>
                <div class="stat-pill">
                    <div class="stat-pill-val">R{{ rightStatValue }}</div>
                    <div class="stat-pill-label">{{ rightStatLabel }}</div>
                </div>
            </div>

            <div class="topbar-venue">{{ venueName }}</div>
            <div class="topbar-clock">{{ currentTime }}</div>
        </header>

        <!-- ── MAIN CONTENT ──────────────────────────── -->
        <main class="main">
            <!-- Welcome strip -->
            <div class="welcome-bar">
                <div>
                    <div class="welcome-greeting">Siyakwamkela, <em>{{ staffName }}</em></div>
                    <div class="welcome-sub">{{ roleDisplayName }} · Shift Active · {{ venueName }}</div>
                </div>
                <div class="live-badge">
                    <div class="live-badge-dot"></div>
                    Live
                </div>
            </div>

            <!-- iFrame area -->
            <div class="iframe-area">
                <!-- Module selected -->
                <div class="iframe-card" v-if="currentDisplayModule" :key="currentDisplayModule.key">
                    <!-- Card header -->
                    <div class="iframe-card-header">
                        <div class="iframe-card-icon">
                            <i :class="currentDisplayModule.icon"></i>
                        </div>
                        <div style="flex:1; overflow:hidden;">
                            <div class="iframe-card-title">{{ cleanTitle(currentDisplayModule.title) }}</div>
                            <div class="iframe-card-subtitle">Live Module · {{ venueName }}</div>
                        </div>
                        <div class="iframe-expand-btn" @click="requestFullscreenWithPin(currentDisplayModule)" title="Fullscreen">
                            <i class="fas fa-expand"></i>
                        </div>
                    </div>

                    <!-- iframe wrapper -->
                    <div class="iframe-wrapper">
                        <!-- Error state -->
                        <div class="iframe-error-state" v-if="currentDisplayModule.loadError">
                            <div class="iframe-error-icon"><i class="fas fa-triangle-exclamation"></i></div>
                            <div class="iframe-error-title">Module Unavailable</div>
                            <div class="iframe-error-sub">Could not load <code style="font-family:var(--mono); color:var(--accent);">{{ currentDisplayModule.src }}</code>. Ensure the file exists.</div>
                        </div>

                        <!-- Loading overlay -->
                        <div class="iframe-loader" v-show="iframeLoading && !currentDisplayModule.loadError" :id="'loader-' + currentDisplayModule.key">
                            <div class="loader-spinner"></div>
                            <div class="loader-label">Loading {{ cleanTitle(currentDisplayModule.title) }}…</div>
                        </div>

                        <!-- The iframe — untouched src/sandbox/attrs -->
                        <iframe
                            v-if="!currentDisplayModule.loadError"
                            :src="currentDisplayModule.src"

                            sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"

                <!-- No module selected -->

        <!-- ── FAB + RADIAL MENU ──────────────────────── -->

                <i class="fas fa-circle-question"></i><span>Help</span>

            <div class="radial-item" @click="quickAction('report')">

        </button>

        <!-- ── TOAST ──────────────────────────────────── -->
        <div class="toast-wrap">

                    <span class="toast-text">{{ toastMessage }}</span>

    </template>

    <!-- ════════════════════════════════════════════════ -->
    <!--  FULLSCREEN OVERLAY (untouched logic)           -->

        <div class="pin-modal-card">
            <div class="pin-icon"><i class="fas fa-lock"></i></div>
            <div class="pin-title">{{ pinActionText }}</div>
            <input
                type="password"
                v-model="pinInput"
                @keyup.enter="verifyPin"
                class="pin-input"
                placeholder="••••"
                maxlength="4"
                autofocus
            >
            <div class="pin-buttons">
                <button class="pin-btn pin-btn-cancel" @click="cancelPin">Cancel</button>
                <button class="pin-btn pin-btn-confirm" @click="verifyPin">Unlock</button>
            </div>
            <div v-if="pinError" class="pin-error-msg">✕ Incorrect PIN — try again</div>
        </div>
    </div>

<!--  JAVASCRIPT — Backend logic 100% preserved          -->
<!-- ════════════════════════════════════════════════════ -->
<script>
    const { createApp, ref, computed, nextTick, onMounted, onUnmounted } = Vue;

    // ============================================================
    // PATHS TO HTML FILES (unchanged)
    // ============================================================
    const UI_PATHS = {
        box_office:      'box-office.html',
        shisha_pos:      'shisha-pos.html',
        shisha_console:  'shisha-console.html',
        vvip_tab:        'vvip-tab.html',
        booze_lockers:   'vault.html',
        register_locker: 'register-locker.html',
        pre_order_pos:   'pre-order-pos.html',
        gate_scanner:    'gate-scanner.html'
    };

    // ============================================================
    // ROLE → MODULE MAPPING (unchanged)
    // ============================================================
    const roleModules = {
        cashier:          ['box_office'],
        shisha_master:    ['shisha_pos', 'shisha_console'],
        vvip_concierge:   ['vvip_tab'],
        event_manager: [
            'box_office',
            'vvip_tab',
            'shisha_pos',
            'shisha_console',
            'pre_order_pos',
            'booze_lockers',
            'register_locker'
        ]
    };

    // ============================================================
    // MODULE META (unchanged)
    // ============================================================
    const moduleMeta = {
        box_office:      { title: '🎟️ BOX OFFICE',       icon: 'fas fa-ticket-alt',    src: UI_PATHS.box_office },
        gate_scanner:    { title: '📦 Express Scanner',   icon: 'fas fa-qrcode',        src: UI_PATHS.gate_scanner },
        shisha_pos:      { title: '💨 SHISHA POS',        icon: 'fas fa-cash-register', src: UI_PATHS.shisha_pos },
        shisha_console:  { title: '🎮 SHISHA CONSOLE',    icon: 'fas fa-gamepad',       src: UI_PATHS.shisha_console },
        vvip_tab:        { title: '✨ VVIP TAB',          icon: 'fas fa-star',          src: UI_PATHS.vvip_tab },
        booze_lockers:   { title: '🍾 BOOZE LOCKERS',     icon: 'fas fa-box',           src: UI_PATHS.booze_lockers },
        register_locker: { title: '📝 REGISTER LOCKER',   icon: 'fas fa-clipboard-list',src: UI_PATHS.register_locker },
        pre_order_pos:   { title: '📦 PRE‑ORDER POS',     icon: 'fas fa-shopping-cart', src: UI_PATHS.pre_order_pos }
    };

    const roleNames = {
        cashier:        'Cashier',
        shisha_master:  'Shisha Master',
        vvip_concierge: 'VVIP Concierge',
        event_manager:  'Event Manager',
        staff:          'Staff (Manager)'
    };

    // ============================================================
    // SUPABASE (unchanged — identical credentials & client init)
    // ============================================================
    const SUPABASE_URL      = 'https://qrjlgfajglvkbifhlebc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyamxnZmFqZ2x2a2JpZmhsZWJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMjAzOTAsImV4cCI6MjA5MjY5NjM5MH0.dBj6kPPyBE7LwrZZudyNkUsFcq_8NJBIXCJcNH41ajY';
    const supabaseClient    = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const getLoggedInStaffName = () => {
        const stored = localStorage.getItem('staffName')
            || sessionStorage.getItem('staffName')
            || localStorage.getItem('userName')
            || sessionStorage.getItem('userName');
        return (stored && stored.trim()) ? stored.trim() : 'Mziwonke';
    };

    const FULLSCREEN_PIN = '1989';

    // ============================================================
    // VUE APP
    // ============================================================
    createApp({
        setup() {
            // ── role / modules ─────────────────────────────────
            const currentRole     = ref('staff');
            const roleDisplayName = ref('Staff (Manager)');
            const staffName       = ref(getLoggedInStaffName());
            const activeModules   = ref([]);

            // active module for the single-pane view
            const activeModuleKey      = ref(null);
            const currentDisplayModule = ref(null);
            const iframeLoading        = ref(true);

            // sidebar (mobile)
            const sidebarOpen = ref(false);

            // fullscreen
            const isFullscreenActive = ref(false);
            const fullscreenModule   = ref(null);

            // ui state
            const currentTime    = ref('');
            const refreshing     = ref(false);
            const showRadialMenu = ref(false);
            const toastMessage   = ref('');
            const venueName      = ref('Rands Cape Town');
            const liveFeed       = ref([{ id: 1, message: 'System ready', time_ago: 'Just now' }]);

            // stats
            const leftStatLabel  = ref('ACTIVE GUESTS');
            const rightStatLabel = ref('WALLET VOLUME');
            const leftStatValue  = ref('—');
            const rightStatValue = ref('—');

            // pin modal
            const showPinModal   = ref(false);
            const pinInput       = ref('');
            const pinError       = ref(false);
            const pinActionText  = ref('Enter PIN to continue');
            let pendingPinResolver  = null;
            let pendingPinRejector  = null;

            // intervals
            let toastTimeout  = null;
            let timeInterval  = null;
            let statsInterval = null;
            let lastTap       = 0;

            // ── computed ───────────────────────────────────────
            const staffInitials = computed(() => {
                const parts = staffName.value.trim().split(' ');
                return parts.length >= 2
                    ? (parts[0][0] + parts[1][0]).toUpperCase()
                    : staffName.value.slice(0, 2).toUpperCase();
            });

            // Strip emoji prefix for clean display
            const cleanTitle = (title) => title.replace(/^[\u{1F300}-\u{1FFFF}\u2700-\u27BF\uE000-\uF8FF\s]+/u, '').trim();

            // ── toast ──────────────────────────────────────────
            const showToast = (message) => {
                toastMessage.value = message;
                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => { toastMessage.value = ''; }, 3000);
            };

            // ── pin ────────────────────────────────────────────
            const requestPin = (desc) => new Promise((resolve, reject) => {
                pinActionText.value = desc || 'Enter PIN to continue';
                pinInput.value      = '';
                pinError.value      = false;
                showPinModal.value  = true;
                pendingPinResolver  = resolve;
                pendingPinRejector  = reject;
            });

            const verifyPin = () => {
                if (pinInput.value === FULLSCREEN_PIN) {
                    showPinModal.value = false;
                    if (pendingPinResolver) { pendingPinResolver(true); pendingPinResolver = null; }
                    pinError.value = false;
                } else {
                    pinError.value = true;
                    pinInput.value = '';
                }
            };

            const cancelPin = () => {
                showPinModal.value = false;
                if (pendingPinRejector) { pendingPinRejector(new Error('PIN cancelled')); pendingPinRejector = null; }
                pendingPinResolver = null;
                showToast('Action cancelled');
            };

            // ── fullscreen (unchanged logic) ───────────────────
            const requestFullscreenWithPin = async (module) => {
                try { await requestPin('🔐 Enter PIN to enter fullscreen mode'); await enterFullscreenModule(module); }
                catch (err) { /* cancelled */ }
            };
            const requestExitFullscreenWithPin = async () => {
                try { await requestPin('🔐 Enter PIN to exit fullscreen'); await exitFullscreen(); }
                catch (err) { /* cancelled */ }
            };
            const enterFullscreenModule = async (module) => {
                fullscreenModule.value   = module;
                isFullscreenActive.value = true;
                await nextTick();
                const elem = document.querySelector('.fullscreen-overlay');
                if (elem && elem.requestFullscreen) {
                    try { await elem.requestFullscreen(); showToast('Fullscreen mode — double-tap to exit (PIN required)'); }
                    catch (err) { console.warn('Fullscreen request failed', err); showToast('Fullscreen not available'); }
                }
            };
            const exitFullscreen = async () => {
                try { if (document.fullscreenElement) await document.exitFullscreen(); }
                catch (err) { console.warn('Exit fullscreen failed', err); }
                finally { isFullscreenActive.value = false; fullscreenModule.value = null; showToast('Exited fullscreen'); }
            };
            const onFullscreenChange = () => {
                if (!document.fullscreenElement && isFullscreenActive.value) {
                    isFullscreenActive.value = false;
                    fullscreenModule.value   = null;
                    showToast('Exited fullscreen (Esc pressed)');
                }
            };
            const onDoubleTap = (e) => {
                if (!isFullscreenActive.value) return;
                const now = Date.now();
                if (now - lastTap < 500) { e.preventDefault(); requestExitFullscreenWithPin(); }
                lastTap = now;
            };

            // ── module selection (NEW: sidebar click → single pane) ─
            const selectModule = (module) => {
                if (activeModuleKey.value === module.key) {
                    sidebarOpen.value = false; return;
                }
                activeModuleKey.value      = module.key;
                currentDisplayModule.value = module;
                iframeLoading.value        = true;
                sidebarOpen.value          = false;
                updateStatsForModule(module.key);
                showToast(`Loading ${cleanTitle(module.title)}`);
            };

            // ── switchRole (unchanged — auto-selects first module) ──
            const switchRole = () => {
                roleDisplayName.value = roleNames[currentRole.value] || currentRole.value;
                const moduleKeys      = roleModules[currentRole.value] || [];
                activeModules.value   = moduleKeys.map(key => ({
                    key,
                    title:     moduleMeta[key]?.title || key,
                    icon:      moduleMeta[key]?.icon  || 'fas fa-cog',
                    src:       moduleMeta[key]?.src   || '',
                    loadError: false
                }));
                // auto-select first module
                if (activeModules.value.length) {
                    selectModule(activeModules.value[0]);
                } else {
                    activeModuleKey.value      = null;
                    currentDisplayModule.value = null;
                }
            };

            // ── iframe events ──────────────────────────────────
            const onIframeLoad = (moduleKey) => {
                const mod = activeModules.value.find(m => m.key === moduleKey);
                if (mod) mod.loadError = false;
                iframeLoading.value = false;
                console.log(`✅ ${moduleKey} loaded`);
                showToast(`${cleanTitle(moduleMeta[moduleKey]?.title || moduleKey)} ready`);
            };
            const onIframeError = (moduleKey) => {
                const mod = activeModules.value.find(m => m.key === moduleKey);
                if (mod) { mod.loadError = true; }
                iframeLoading.value = false;
                console.error(`❌ Failed to load ${moduleKey}`);
                showToast(`Failed to load ${cleanTitle(moduleMeta[moduleKey]?.title || moduleKey)} — file missing`);
            };

            // ── misc ───────────────────────────────────────────
            const refreshData = () => {
                refreshing.value = true;
                setTimeout(() => { refreshing.value = false; showToast('Data refreshed'); }, 500);
            };
            const showStaffInfo = () => { showToast(`${staffName.value} · ${roleDisplayName.value} · Active shift`); };
            const toggleRadialMenu = () => { showRadialMenu.value = !showRadialMenu.value; };
            const quickAction = (action) => {
                showRadialMenu.value = false;
                const actions = {
                    help:   () => showToast('Help: Contact supervisor or check manual'),
                    report: () => showToast('Report incident? Tap again to confirm'),
                    team:   () => showToast('Team channel opening…'),
                    break:  () => showToast('Break started — 30 min timer'),
                    shift:  () => showToast('Clocked in successfully')
                };
                actions[action]?.();
            };
            const updateTime = () => {
                const now = new Date();
                currentTime.value = now.toLocaleTimeString('en-US', { hour12: false });
            };

            // ── REAL STAT FETCHERS (unchanged) ────────────────
            async function fetchPreOrderStats() {
                try {
                    const { data: waitingTickets } = await supabaseClient.from('butcher_queue').select('ticket_number, called').eq('called', false);
                    const { data: activeOrders }   = await supabaseClient.from('butcher_orders').select('total, kitchen_status').in('kitchen_status', ['new', 'preparing', 'ready']);
                    const activeCount  = (waitingTickets?.length || 0) + (activeOrders?.length || 0);
                    const totalVolume  = (activeOrders || []).reduce((sum, o) => sum + (o.total || 0), 0);
                    leftStatValue.value  = activeCount;
                    rightStatValue.value = totalVolume.toFixed(2);
                    leftStatLabel.value  = 'ACTIVE PRE‑ORDERS';
                    rightStatLabel.value = 'PRE‑ORDER VOLUME';
                } catch (err) { console.error('Pre-order stats error:', err); leftStatValue.value = '⚠️'; rightStatValue.value = '⚠️'; }
            }

            async function fetchLockerStats() {
                try {
                    const { data, error } = await supabaseClient.from('lockers').select('status');
                    if (!error && data) {
                        leftStatValue.value  = data.filter(l => l.status === 'occupied').length;
                        rightStatValue.value = data.filter(l => l.status === 'available').length;
                    } else {
                        leftStatValue.value  = parseInt(localStorage.getItem('lockers_occupied')  || '0');
                        rightStatValue.value = parseInt(localStorage.getItem('lockers_available') || '0');
                    }
                    leftStatLabel.value  = 'OCCUPIED LOCKERS';
                    rightStatLabel.value = 'AVAILABLE LOCKERS';
                } catch (err) { console.error('Locker stats error:', err); leftStatValue.value = '?'; rightStatValue.value = '?'; }
            }

            function fetchVVIPStats() {
                try {
                    const tables = JSON.parse(localStorage.getItem('tables') || '{}');
                    let insideCount = 0, totalTab = 0;
                    Object.values(tables).forEach(table => {
                        if (table.entriesUsed > 0) insideCount += table.entriesUsed;
                        totalTab += (table.tabBalance || 0);
                    });
                    leftStatValue.value  = insideCount;
                    rightStatValue.value = totalTab.toFixed(2);
                    leftStatLabel.value  = 'VVIP GUESTS INSIDE';
                    rightStatLabel.value = 'TABLE SPEND';
                } catch (err) { console.error('VVIP stats error:', err); leftStatValue.value = '?'; rightStatValue.value = '?'; }
            }

            async function fetchShishaStats() {
                try {
                    const { data, error } = await supabaseClient.from('shisha_sessions').select('status, total_amount').in('status', ['active', 'refill', 'paused']);
                    if (error) throw error;
                    const activeCount = data?.filter(s => s.status === 'active' || s.status === 'refill').length || 0;
                    const revenue     = data?.reduce((sum, s) => sum + (s.total_amount || 0), 0) || 0;
                    leftStatValue.value  = activeCount;
                    rightStatValue.value = revenue.toFixed(2);
                    leftStatLabel.value  = 'ACTIVE HOOKAHS';
                    rightStatLabel.value = 'SHISHA REVENUE';
                } catch (err) { console.error('Shisha stats error:', err); leftStatValue.value = '?'; rightStatValue.value = '?'; }
            }

            async function fetchBoxOfficeStats() {
                try {
                    const today = new Date().toISOString().split('T')[0];
                    const { data, error } = await supabaseClient.from('tickets').select('status, price').eq('status', 'used').gte('updated_at', today);
                    if (error) throw error;
                    const sold    = data?.length || 0;
                    const revenue = data?.reduce((sum, t) => sum + (t.price || 0), 0) || 0;
                    leftStatValue.value  = sold;
                    rightStatValue.value = revenue.toFixed(2);
                    leftStatLabel.value  = 'TICKETS SOLD (TODAY)';
                    rightStatLabel.value = 'BOX OFFICE REVENUE';
                } catch (err) { console.error('Box office stats error:', err); leftStatValue.value = '?'; rightStatValue.value = '?'; }
            }

            function updateStatsForModule(moduleKey) {
                if (statsInterval) clearInterval(statsInterval);
                if (moduleKey === 'pre_order_pos') {
                    fetchPreOrderStats(); statsInterval = setInterval(fetchPreOrderStats, 5000);
                } else if (moduleKey === 'booze_lockers' || moduleKey === 'register_locker') {
                    fetchLockerStats(); statsInterval = setInterval(fetchLockerStats, 5000);
                } else if (moduleKey === 'vvip_tab') {
                    fetchVVIPStats(); statsInterval = setInterval(fetchVVIPStats, 4000);
                } else if (moduleKey === 'shisha_pos' || moduleKey === 'shisha_console') {
                    fetchShishaStats(); statsInterval = setInterval(fetchShishaStats, 5000);
                } else if (moduleKey === 'box_office') {
                    fetchBoxOfficeStats(); statsInterval = setInterval(fetchBoxOfficeStats, 10000);
                } else {
                    leftStatLabel.value  = 'ACTIVE GUESTS';
                    rightStatLabel.value = 'WALLET VOLUME';
                    leftStatValue.value  = '—';
                    rightStatValue.value = '—';
                }
            }

            // ── VENUE NAME (unchanged) ─────────────────────────
            async function loadVenueName() {
                try {
                    const { data, error } = await supabaseClient.from('tenants').select('name').eq('is_active', true).limit(1);
                    if (!error && data && data.length > 0) {
                        venueName.value = data[0].name;
                    } else {
                        const { data: allTenants } = await supabaseClient.from('tenants').select('name').limit(1);
                        if (allTenants && allTenants.length) venueName.value = allTenants[0].name;
                    }
                } catch (err) { console.error('Failed to fetch venue name:', err); }
            }

            // ── LIFECYCLE ──────────────────────────────────────
            onMounted(() => {
                updateTime();
                timeInterval = setInterval(updateTime, 1000);
                switchRole();
                loadVenueName();
                document.addEventListener('touchstart', onDoubleTap);
                document.addEventListener('dblclick',   onDoubleTap);
                document.addEventListener('fullscreenchange', onFullscreenChange);
            });

            onUnmounted(() => {
                if (timeInterval)  clearInterval(timeInterval);
                if (statsInterval) clearInterval(statsInterval);
                document.removeEventListener('touchstart', onDoubleTap);
                document.removeEventListener('dblclick',   onDoubleTap);
                document.removeEventListener('fullscreenchange', onFullscreenChange);
            });

            return {
                // state
                currentRole, roleDisplayName, staffName, staffInitials,
                activeModules, activeModuleKey, currentDisplayModule, iframeLoading,
                sidebarOpen,
                isFullscreenActive, fullscreenModule,
                currentTime, refreshing, showRadialMenu, toastMessage,
                liveFeed, venueName,
                showPinModal, pinInput, pinError, pinActionText,
                leftStatLabel, rightStatLabel, leftStatValue, rightStatValue,
                // methods
                cleanTitle, selectModule, switchRole,
                onIframeLoad, onIframeError,
                refreshData, showStaffInfo,
                toggleRadialMenu, quickAction,
                requestFullscreenWithPin, requestExitFullscreenWithPin,
                verifyPin, cancelPin
            };
        }
    }).mount('#app');
</script>

</body>
