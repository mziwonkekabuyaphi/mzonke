<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <title>Rands Vibe Pass</title>

  <!-- PWA Meta -->

  <meta name="theme-color" content="#d40000" />

  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Apple PWA -->

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta name="apple-mobile-web-app-title" content="Rands" />

  <!-- Icons -->

  <link rel="icon" type="image/png" href="assets/images/icon-192.png" />

  <link rel="apple-touch-icon" href="assets/images/icon-192.png" />

  <!-- Manifest -->

  <link rel="manifest" href="manifest.json" />

  <!-- CSS -->

  <link rel="stylesheet" href="assets/css/index.css" />

  <!-- Font Awesome -->

  <link rel="stylesheet"

    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

</head>

<body>

  <!-- Splash Screen -->

  <div class="splash">

    <div class="logo-3d">

      <div class="flip-card">

        <div class="flip-front">

          <img src="assets/images/rands-logo2.png" alt="Rands Vibe Pass Logo" />

        </div>

        <div class="flip-back">

          <i class="fas fa-crown"></i>

          <span>RANDS</span>

          <small>Vibe Pass</small>

        </div>

      </div>

      <div class="pulse-ring"></div>

    </div>

    <!-- Branding -->

    <h1>Rands Vibe Pass</h1>

    <div class="version">

      ✦ Secure Digital Pass ✦

    </div>

    <!-- Loading Bar -->

    <div class="loading-bar">

      <div class="progress" id="progressFill"></div>

    </div>

    <!-- Spinner -->

    <div class="loading-circle">

      <div class="spinner"></div>

    </div>

    <!-- Status -->

    <div class="status-message" id="statusMessage">

      <span>✨ Initializing Rands Vibe Pass</span>

    </div>

    <!-- Percentage -->

    <div class="percentage" id="percentage">

      0%

    </div>

    <!-- Tagline -->

    <div class="tagline">

      #SeeYourVibe

    </div>

  </div>

  <!-- Install Banner -->

  <div id="installBanner" class="install-banner">

    <div class="install-content">

      <div class="install-text">

        <strong>Install Rands App</strong>

        <p>Add Rands Vibe Pass to your home screen.</p>

      </div>

      <div class="install-actions">

        <button id="installBtn">

          Install

        </button>

        <button id="closeInstallBtn" class="close-install">

          ✕

        </button>

      </div>

    </div>

  </div>

  <!-- No JavaScript -->

  <noscript>

    <div class="noscript-warning">

      This app requires JavaScript to run properly.

    </div>

  </noscript>

  <!-- Main JS -->

  <script src="assets/js/index.js"></script>

</body>

</html>
