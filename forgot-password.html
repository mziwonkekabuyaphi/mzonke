<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Rands Vibe Passport · Forgot Password</title>

    <!-- Fonts: Bebas Neue for the big heading -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
               FORGOT PASSWORD — Rands Vibe Passport
               Matches login.html exactly, with tailored content.
               #SeeYourVibe + logo icon + forgot form = centered
               Brand heading + tagline = left‑aligned
               Red edge on the far left, no borders
               NORMAL 'R' (no mirror), normal 'N' and 'D'
               ============================================================ */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --red: #E30613;
            --red-glow: rgba(227, 6, 19, 0.4);
            --red-dim: rgba(227, 6, 19, 0.15);
            --bg: #09090b;
            --surface: #111114;
            --surface-2: #18181c;
            --surface-3: #1e1e24;
            --border: rgba(255, 255, 255, 0.06);
            --border-bright: rgba(255, 255, 255, 0.12);
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --text-dim: #52525b;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        html,
        body {
            height: 100%;
            min-height: 100dvh;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }

        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 0;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100dvh;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* ── Background layers ── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(120, 0, 200, 0.2) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(200, 0, 60, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 20% 60%, rgba(60, 0, 120, 0.12) 0%, transparent 60%),
                var(--bg);
        }

        .bg-noise {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.4;
        }

        /* ── RED LINE · at the edge of the screen ── */
        .red-edge {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            z-index: 10;
            background: linear-gradient(180deg, transparent 5%, var(--red) 30%, var(--red) 70%, transparent 95%);
            box-shadow: 0 0 20px var(--red-glow), 0 0 60px rgba(227, 6, 19, 0.15);
            pointer-events: none;
        }

        /* ── Main wrapper ── */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            padding: 28px 28px 48px 48px;
            animation: fadeUp 0.6s var(--ease) both;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── No card border — just content ── */
        .login-content {
            width: 100%;
            padding: 0;
            background: transparent;
        }

        /* ── #SeeYourVibe tag · CENTERED ── */
        .vibe-tag {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--red);
            text-shadow: 0 0 20px var(--red-glow);
        }
        .vibe-tag .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 10px var(--red);
            flex-shrink: 0;
        }

        /* ── Brand container ── */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
            width: 100%;
        }

        /* ── Logo icon · CENTERED ── */
        .logo-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        .logo-mark {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 40px var(--red-glow);
            transition: box-shadow 0.3s;
            background: var(--surface-3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-mark:hover {
            box-shadow: 0 0 60px var(--red-glow), 0 0 120px rgba(227, 6, 19, 0.15);
        }
        .logo-mark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .logo-mark .fallback-icon {
            color: var(--red);
            font-size: 2rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            display: none;
        }
        .logo-mark img:not([src]),
        .logo-mark img[src=""] {
            display: none;
        }
        .logo-mark img:not([src])+.fallback-icon,
        .logo-mark img[src=""]+.fallback-icon {
            display: block;
        }

        /* ── Brand text · LEFT‑ALIGNED ── */
        .brand-text {
            width: 100%;
            text-align: left;
        }

        /* ── BIG & BOLD HEADING — normal R, no ligature ── */
        .brand-heading {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(52px, 13vw, 72px);
            line-height: 0.92;
            letter-spacing: 1px;
            color: var(--text);
            font-weight: 400;
        }
        .brand-heading .top {
            display: block;
        }
        .brand-heading .bottom {
            display: block;
            color: var(--red);
            text-shadow: 0 0 40px rgba(227, 6, 19, 0.6), 0 0 80px rgba(227, 6, 19, 0.3);
        }

        /* ✅ NORMAL 'R' — no mirror, no transform */
        .normal-r {
            display: inline-block;
        }
        /* ✅ NORMAL 'N' and 'D' — no ligature */
        .normal-nd {
            display: inline-block;
        }

        .brand-sub {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 8px;
            letter-spacing: 0.02em;
        }

        /* ── Forgot Password section heading ── */
        .forgot-heading {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(32px, 7vw, 44px);
            line-height: 1.05;
            letter-spacing: 0.5px;
            color: var(--text);
            font-weight: 400;
            margin-top: 6px;
        }
        .forgot-heading .highlight {
            color: var(--red);
            text-shadow: 0 0 30px rgba(227, 6, 19, 0.3);
        }

        .forgot-sub {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 4px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        /* ── Form fields ── bigger & bolder ── */
        .form-wrap {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 4px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding-left: 2px;
        }

        .input-wrap {
            position: relative;
        }

        .field-input {
            width: 100%;
            background: var(--surface-3);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
            -webkit-appearance: none;
        }
        .field-input::placeholder {
            color: var(--text-dim);
            font-weight: 400;
        }
        .field-input:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 4px var(--red-dim);
            background: var(--surface-2);
        }
        .field-input.has-error {
            border-color: var(--red);
            box-shadow: 0 0 0 4px rgba(227, 6, 19, 0.15);
        }
        .field-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .field-error {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--red);
            padding-left: 4px;
            display: none;
        }
        .field-error.visible {
            display: block;
        }

        /* ── Message area ── */
        .reset-message {
            display: none;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.5;
            margin-top: 4px;
            animation: fadeSlide 0.3s var(--ease) both;
        }
        .reset-message.visible {
            display: block;
        }
        .reset-message.success {
            background: rgba(0, 200, 100, 0.1);
            border: 1px solid rgba(0, 200, 100, 0.3);
            color: rgba(100, 255, 180, 0.95);
        }
        .reset-message.error {
            background: rgba(227, 6, 19, 0.1);
            border: 1px solid rgba(227, 6, 19, 0.3);
            color: rgba(255, 160, 168, 0.95);
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Primary CTA ── bigger & bolder ── */
        .cta-wrap {
            margin-top: 22px;
        }

        .cta-btn {
            width: 100%;
            padding: 18px 28px;
            border-radius: 10px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s var(--ease), box-shadow 0.3s, background 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.02em;
        }
        .cta-btn:active {
            transform: scale(0.97);
        }
        .cta-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .red-cta {
            background: var(--red);
            color: white;
            box-shadow: 0 0 24px var(--red-glow);
        }
        .red-cta:hover:not(:disabled) {
            background: #c8050f;
            box-shadow: 0 0 40px var(--red-glow);
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -110%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: skewX(-20deg);
        }
        .cta-btn:not(:disabled):hover::before {
            animation: sheen 0.6s forwards;
        }
        @keyframes sheen {
            to {
                left: 160%;
            }
        }

        .btn-spinner {
            width: 22px;
            height: 22px;
            display: none;
            animation: spinIcon 0.75s linear infinite;
            flex-shrink: 0;
        }
        .cta-btn.loading .btn-spinner {
            display: block;
        }
        .cta-btn.loading .btn-label {
            opacity: 0.7;
        }

        @keyframes spinIcon {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Back to Login link · CENTERED ── */
        .back-link {
            text-align: center;
            margin-top: 28px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .back-link a {
            color: var(--red);
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-link a:hover {
            opacity: 0.8;
        }
        .back-link .arrow {
            display: inline-block;
            transition: transform 0.2s;
        }
        .back-link a:hover .arrow {
            transform: translateX(-3px);
        }

        /* ── Divider (optional, for visual separation) ── */
        .alt-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 28px;
        }
        .alt-divider-line {
            flex: 1;
            height: 1.5px;
            background: var(--border);
        }
        .alt-divider-text {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
            white-space: nowrap;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .login-wrapper {
                padding: 20px 18px 40px 36px;
            }
            .brand-heading {
                font-size: clamp(44px, 11vw, 56px);
            }
            .logo-mark {
                width: 54px;
                height: 54px;
            }
            .forgot-heading {
                font-size: clamp(28px, 6vw, 36px);
            }
            .field-input {
                font-size: 0.95rem;
                padding: 12px 16px;
            }
            .cta-btn {
                font-size: 0.95rem;
                padding: 16px 24px;
            }
            .vibe-tag {
                font-size: 0.75rem;
            }
            .forgot-sub {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 420px) {
            .login-wrapper {
                padding: 16px 14px 32px 28px;
            }
            .brand-heading {
                font-size: clamp(36px, 9vw, 44px);
            }
            .logo-mark {
                width: 48px;
                height: 48px;
                border-radius: 12px;
            }
            .brand-sub {
                font-size: 0.85rem;
            }
            .forgot-heading {
                font-size: clamp(24px, 5.5vw, 30px);
            }
            .field-input {
                font-size: 0.9rem;
                padding: 11px 14px;
            }
            .cta-btn {
                font-size: 0.9rem;
                padding: 14px 20px;
            }
            .back-link {
                font-size: 0.85rem;
            }
            .vibe-tag {
                font-size: 0.7rem;
                gap: 6px;
            }
            .forgot-sub {
                font-size: 0.85rem;
            }
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-bright);
            border-radius: 99px;
        }

        /* ── Logo fallback ── */
        .logo-mark img:not([src]),
        .logo-mark img[src=""] {
            display: none;
        }
        .logo-mark img:not([src])+.fallback-icon,
        .logo-mark img[src=""]+.fallback-icon {
            display: block;
        }

        /* ── Install Banner (same as login) ── */
        .login-install-banner {
            display: none;
            width: 100%;
            max-width: 560px;
            margin-bottom: 18px;
            margin-top: 0;
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            animation: slideDown 0.4s var(--ease) both;
            position: relative;
            z-index: 2;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .banner-content {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .banner-icon {
            font-size: 28px;
            flex-shrink: 0;
        }
        .banner-text {
            flex: 1;
            min-width: 140px;
        }
        .banner-text strong {
            display: block;
            font-size: 0.95rem;
            color: var(--text);
        }
        .banner-text p {
            margin: 2px 0 0;
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .banner-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .cta-button {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            white-space: nowrap;
        }
        .cta-button:hover {
            background: #c8050f;
        }
        .cta-button:active {
            transform: scale(0.96);
        }
        .banner-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0 6px;
            transition: color 0.2s;
            line-height: 1;
        }
        .banner-close:hover {
            color: var(--text);
        }
    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>

    <!-- ─── RED LINE · at the edge of the screen ─── -->
    <div class="red-edge"></div>

    <!-- Background layers -->
    <div class="bg"></div>
    <div class="bg-noise"></div>

    <!-- ─── INSTALL BANNER ─── -->
    <div id="loginInstallBanner" class="login-install-banner" style="display:none;">
        <div class="banner-content">
            <div class="banner-icon">📲</div>
            <div class="banner-text">
                <strong>Install Rands Vibe Passport</strong>
                <p id="installInstructions">Get the full app experience with one tap.</p>
            </div>
            <div class="banner-actions">
                <button id="loginInstallCta" class="cta-button">Install Now</button>
                <button id="closeLoginBanner" class="banner-close" aria-label="Dismiss">✕</button>
            </div>
        </div>
    </div>

    <!-- ─── MAIN CONTENT ─── -->
    <div class="login-wrapper">
        <div class="login-content">

            <!-- #SeeYourVibe tag · CENTERED -->
            <div class="vibe-tag">
                <span class="dot"></span>
                <span>#SeeYourVibe</span>
            </div>

            <!-- Brand · logo icon centered, text left-aligned -->
            <div class="brand">
                <div class="logo-wrapper">
                    <div class="logo-mark">
                        <img src="../assets/images/rands-logo.png" alt="Rands Vibe Passport" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'" />
                        <span class="fallback-icon">R</span>
                    </div>
                </div>
                <div class="brand-text">
                    <h1 class="brand-heading">
                        <!-- NORMAL 'R', normal 'N' and 'D' — no mirror, no ligature -->
                        <span class="top"><span class="normal-r">R</span>a<span class="normal-nd">n</span>d<span class="normal-nd">s</span></span>
                        <span class="bottom">Vibe Passport</span>
                    </h1>
                    <div class="brand-sub">Reset your password keysecurely</div>
                </div>
            </div>

            <!-- ─── FORGOT PASSWORD SECTION ─── -->
            <div class="forgot-heading">
                Forgot <span class="highlight">Passport Key</span>
            </div>
            <p class="forgot-sub">
                Enter your email address and we'll send you a secure passport Key reset link.
            </p>

            <!-- Form -->
            <form class="form-wrap" id="forgotForm" novalidate>
                <div class="field-group">
                    <label class="field-label" for="email">Email Address</label>
                    <div class="input-wrap">
                        <input class="field-input" type="email" id="email" name="email" placeholder="mzi@example.com" autocomplete="email" inputmode="email" required />
                    </div>
                    <span class="field-error" id="err-email">Enter a valid email address</span>
                </div>

                <!-- Message area for success / error -->
                <div class="reset-message" id="resetMessage" role="alert" aria-live="polite"></div>
            </form>

            <!-- Primary CTA -->
            <div class="cta-wrap">
                <button class="cta-btn red-cta" id="resetBtn" type="button">
                    <span class="btn-label" id="resetBtnLabel">Send Reset Link</span>
                    <svg class="btn-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
                    </svg>
                </button>
            </div>

            <!-- Divider (visual separation) -->
            <div class="alt-divider">
                <div class="alt-divider-line"></div>
                <span class="alt-divider-text">or</span>
                <div class="alt-divider-line"></div>
            </div>

            <!-- Back to Login -->
            <div class="back-link">
                <a href="login.html">
                    <span class="arrow">←</span>
                    Back to Login
                </a>
            </div>

        </div><!-- /login-content -->
    </div><!-- /login-wrapper -->

    <!-- ====== SCRIPTS ====== -->

    <script type="module">
        // ─────────────────────────────────────────────────────────────
        //  FORGOT PASSWORD — Supabase integration
        //  Uses the same Supabase client instance as login.html
        // ─────────────────────────────────────────────────────────────

        import { supabase } from './config/supabase.js';

// Make available globally if other scripts on this page expect it
window.supabaseClient = supabase;
window.supabase = supabase;

        // ── DOM refs ──
        const form = document.getElementById('forgotForm');
        const emailInput = document.getElementById('email');
        const errEmail = document.getElementById('err-email');
        const resetBtn = document.getElementById('resetBtn');
        const resetBtnLabel = document.getElementById('resetBtnLabel');
        const messageEl = document.getElementById('resetMessage');

        // ── Helpers ──
        function setLoading(loading) {
            if (loading) {
                resetBtn.classList.add('loading');
                resetBtn.disabled = true;
                resetBtnLabel.textContent = 'Sending...';
            } else {
                resetBtn.classList.remove('loading');
                resetBtn.disabled = false;
                resetBtnLabel.textContent = 'Send Reset Link';
            }
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'reset-message visible ' + type;
        }

        function hideMessage() {
            messageEl.className = 'reset-message';
            messageEl.textContent = '';
        }

        function setEmailError(show) {
            if (show) {
                emailInput.classList.add('has-error');
                errEmail.classList.add('visible');
            } else {
                emailInput.classList.remove('has-error');
                errEmail.classList.remove('visible');
            }
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // ── Reset handler ──
        async function handleReset(e) {
            e.preventDefault();

            // Reset state
            hideMessage();
            setEmailError(false);

            const email = emailInput.value.trim();

            // Validate
            if (!email || !validateEmail(email)) {
                setEmailError(true);
                emailInput.focus();
                return;
            }

            // Begin loading
            setLoading(true);

            try {
                // Call Supabase password reset
                const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/update-password.html',
                });

                if (error) {
                    // Show the Supabase error
                    showMessage(error.message, 'error');
                    return;
                }

                // Success — always show success regardless of whether email exists
                // (security best practice: don't reveal if email exists)
                showMessage(
                    'Check your email for a password reset link. If you don\'t see it, check your spam folder.',
                    'success'
                );

                // Clear the field on success
                emailInput.value = '';

            } catch (err) {
                // Unexpected error
                showMessage('Something went wrong. Please try again.', 'error');
                console.error('Password reset error:', err);
            } finally {
                setLoading(false);
            }
        }

        // ── Event listeners ──
        resetBtn.addEventListener('click', handleReset);

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            handleReset(e);
        });

        // ── Real‑time validation ──
        emailInput.addEventListener('blur', function() {
            const val = this.value.trim();
            if (val && !validateEmail(val)) {
                setEmailError(true);
            } else {
                setEmailError(false);
            }
        });

        emailInput.addEventListener('input', function() {
            // Clear error while typing
            if (emailInput.classList.contains('has-error')) {
                const val = this.value.trim();
                if (!val || validateEmail(val)) {
                    setEmailError(false);
                }
            }
            // Hide any old message when user types
            if (messageEl.classList.contains('visible')) {
                hideMessage();
            }
        });

        // ── Keyboard shortcut: Enter triggers submit ──
        emailInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                resetBtn.click();
            }
        });

        // ── Expose finishLogin for OAuth callback (if needed) ──
        window.finishLogin = async function(user) {
            // This is a no-op for forgot password, but kept for compatibility
            console.log('finishLogin called (forgot-password) with user:', user);
        };

        console.log('🔐 Forgot Password page ready');
    </script>

    <!-- Install Banner Logic (same as login) -->
    <script>
        (function() {
            'use strict';

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBanner);
            } else {
                initBanner();
            }

            function initBanner() {
                const banner = document.getElementById('loginInstallBanner');
                const closeBtn = document.getElementById('closeLoginBanner');
                const ctaBtn = document.getElementById('loginInstallCta');
                const instructionsEl = document.getElementById('installInstructions');

                if (!banner) return;

                const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                    window.navigator.standalone === true;

                const isDismissed = localStorage.getItem('loginInstallDismissed') === 'true';

                if (isStandalone || isDismissed) {
                    banner.style.display = 'none';
                    return;
                }

                const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                const isAndroid = /Android/.test(navigator.userAgent);

                let instructionText = '';
                let ctaText = 'Install Now';

                if (isIos) {
                    instructionText = 'Tap the Share icon below, then select "Add to Home Screen".';
                    ctaText = 'How to Install';
                } else if (isAndroid) {
                    instructionText = 'Tap the menu (⋮) in your browser and select "Install App".';
                    ctaText = 'Install App';
                } else {
                    instructionText = 'Install this app from your browser\'s menu for the best experience.';
                    ctaText = 'Learn How';
                }

                if (instructionsEl) instructionsEl.textContent = instructionText;
                if (ctaBtn) ctaBtn.textContent = ctaText;

                banner.style.display = 'block';

                if (closeBtn) {
                    closeBtn.addEventListener('click', function() {
                        banner.style.display = 'none';
                        localStorage.setItem('loginInstallDismissed', 'true');
                    });
                }

                if (ctaBtn) {
                    ctaBtn.addEventListener('click', function() {
                        if (isIos) {
                            alert(
                                '📲 To install Rands Vibe Passport on your iPhone/iPad:\n\n' +
                                '1. Tap the Share icon (square with arrow) at the bottom of the screen.\n' +
                                '2. Scroll down and tap "Add to Home Screen".\n' +
                                '3. Tap "Add" in the top‑right corner.\n\n' +
                                'You\'ll then have the app icon on your Home Screen.'
                            );
                        } else if (isAndroid) {
                            alert(
                                '📲 To install Rands Vibe Passport on your Android device:\n\n' +
                                '1. Tap the three‑dot menu (⋮) in your browser.\n' +
                                '2. Tap "Install App" or "Add to Home Screen".\n' +
                                '3. Follow the on‑screen prompts.\n\n' +
                                'The app will be added to your Home Screen.'
                            );
                        } else {
                            alert(
                                '📲 To install this app on your computer:\n\n' +
                                '• Chrome/Edge: Look for the install icon (➕) in the address bar.\n' +
                                '• Firefox/Safari: Use "Add to Home Screen" or "Add to Dock" from the browser menu.\n\n' +
                                'This will create a shortcut for quick access.'
                            );
                        }
                    });
                }
            }
        })();
    </script>
