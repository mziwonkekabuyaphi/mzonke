<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Payment Success | Rands Wallet</title>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Google Fonts: Satoshi & Inter (premium modern) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Satoshi:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      background-image: radial-gradient(circle at 20% 30%, rgba(255, 43, 43, 0.15) 0%, #000000 90%);
      font-family: "Inter", "Satoshi", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ambient animated red glow */
    .ambient-glow {
      position: fixed;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(ellipse at 40% 50%, rgba(255, 43, 43, 0.25), transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      animation: slowDrift 16s infinite alternate ease-in-out;
    }

    @keyframes slowDrift {
      0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      100% { transform: translate(2%, 1%) scale(1.05); opacity: 0.9; }
    }

    /* Floating particles (subtle) */
    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: #ff5e5e;
      border-radius: 50%;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    /* Main glass card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(12, 12, 20, 0.65);
      backdrop-filter: blur(16px);
      border-radius: 48px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255, 43, 43, 0.35);
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 43, 43, 0.6);
      transform: translateY(-3px);
    }

    /* Success icon – glowing checkmark */
    .checkmark {
      font-size: 70px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffd966, #ff2b2b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 43, 43, 0.6);
      animation: pop 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
      display: inline-block;
    }

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #ffb8b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 12px 0 8px;
    }

    .sub {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    /* QR code container – premium glass */
    #qrcode {
      margin: 20px auto;
      background: white;
      padding: 12px;
      border-radius: 28px;
      display: inline-block;
      box-shadow: 0 0 0 2px rgba(255, 43, 43, 0.3), 0 15px 30px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
    }

    #qrcode canvas, #qrcode img {
      border-radius: 20px;
      display: block;
    }

    /* Buttons – glowing pill design */
    .btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px 0;
      border: none;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      backdrop-filter: blur(4px);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .print {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .print:hover, .print:active {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ff2b2b;
    }

    .whatsapp {
      background: linear-gradient(105deg, #25D366, #128C7E);
      color: white;
      box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
    }

    /* Tagline */
    .tagline {
      margin: 18px 0 12px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      color: #ff8a8a;
    }

    /* Enhanced Countdown with ring */
    .countdown {
      margin-top: 16px;
      padding: 10px;
      border-radius: 60px;
      transition: all 0.3s ease;
      background: rgba(20, 20, 30, 0.7);
      backdrop-filter: blur(4px);
    }

    .countdown-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .progress-ring {
      width: 32px;
      height: 32px;
    }

    .progress-ring svg {
      transform: rotate(-90deg);
    }

    .progress-ring-circle {
      fill: none;
      stroke: #ff5e5e;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
    }

    .countdown-text {
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Warning state */
    .countdown.warning {
      background: rgba(255, 193, 7, 0.25);
      border: 1px solid rgba(255, 193, 7, 0.6);
      box-shadow: 0 0 12px rgba(255, 193, 7, 0.3);
    }
    .countdown.warning .progress-ring-circle {
      stroke: #ffc107;
    }
    .countdown.warning .countdown-text {
      color: #ffd966;
      font-weight: 800;
    }

    /* Critical state */
    .countdown.critical {
      background: rgba(220, 53, 69, 0.4);
      border: 1px solid #ff2b2b;
      animation: pulseCritical 0.8s infinite;
      box-shadow: 0 0 18px rgba(220, 53, 69, 0.6);
    }
    .countdown.critical .progress-ring-circle {
      stroke: #ff2b2b;
      filter: drop-shadow(0 0 4px #ff2b2b);
    }
    .countdown.critical .countdown-text {
      color: #ffb3b3;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    @keyframes pulseCritical {
      0% { transform: scale(1); background: rgba(220, 53, 69, 0.3);}
      100% { transform: scale(1.02); background: rgba(220, 53, 69, 0.6);}
    }

    /* WhatsApp Modal – dark glass */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: rgba(18, 18, 28, 0.95);
      backdrop-filter: blur(20px);
      padding: 28px 24px;
      border-radius: 48px;
      text-align: center;
      width: 320px;
      color: white;
      border: 1px solid rgba(255, 43, 43, 0.5);
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-content h3 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff, #ffb8b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .modal-content input {
      width: 100%;
      padding: 14px;
      margin: 16px 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      font-size: 1rem;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-family: monospace;
      text-align: center;
    }

    .modal-content input:focus {
      outline: none;
      border-color: #ff2b2b;
      box-shadow: 0 0 8px rgba(255, 43, 43, 0.5);
    }

    .country-code {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-bottom: 16px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .modal-btn.send {
      background: linear-gradient(105deg, #25D366, #128C7E);
      color: white;
    }

    .modal-btn.cancel {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

<div class="ambient-glow"></div>
<!-- floating particles generated by JS -->

<div class="card">
  <div class="checkmark">✓</div>
  <h1>Payment Secured</h1>
  <div class="sub">Your transaction is confirmed</div>

  <!-- QR Code -->
  <div id="qrcode"></div>

  <!-- Action buttons -->
  <button class="btn print" onclick="window.print()">🖨️ Print Receipt</button>
  <button class="btn whatsapp" onclick="showWhatsAppModal()">📲 Share via WhatsApp</button>

  <div class="tagline">#RandsVibe • Live the Moment</div>

  <!-- Countdown with visual ring -->
  <div class="countdown" id="countdown">
    <div class="countdown-content">
      <div class="progress-ring">
        <svg width="28" height="28">
          <circle class="progress-ring-circle" cx="14" cy="14" r="12" stroke="currentColor" stroke-width="3" fill="none" />
        </svg>
      </div>
      <div class="countdown-text" id="countdown-text">Closing in 30s...</div>
    </div>
  </div>
</div>

<!-- WhatsApp Number Modal -->
<div id="whatsappModal" class="modal">
  <div class="modal-content">
    <h3>📲 WhatsApp Receipt</h3>
    <p>Enter customer's WhatsApp number</p>
    <input type="tel" id="whatsappNumber" placeholder="e.g., 27721234567" autocomplete="off" />
    <div class="country-code">Include country code (e.g., 27 for South Africa)</div>
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeWhatsAppModal()">Cancel</button>
      <button class="modal-btn send" onclick="sendToWhatsApp()">Send</button>
    </div>
  </div>
</div>

<script>
  // ------------------- RANDS WALLET SUCCESS LOGIC -------------------
  const orderId = "RND" + Math.floor(Math.random() * 100000);
  const orderLink = "https://rands.co.za/order/" + orderId;

  // Generate QR code
  try {
    new QRCode(document.getElementById("qrcode"), {
      text: orderLink,
      width: 160,
      height: 160
    });
  } catch(e) {
    document.getElementById('qrcode').innerHTML = '<p style="color:#ff5e5e;">⚠️ QR unavailable. Please refresh.</p>';
  }

  // WhatsApp modal handling
  function showWhatsAppModal() {
    const modal = document.getElementById("whatsappModal");
    modal.style.display = "flex";
    document.getElementById("whatsappNumber").value = "";
  }

  function closeWhatsAppModal() {
    const modal = document.getElementById("whatsappModal");
    modal.style.display = "none";
  }

  function sendToWhatsApp() {
    let phoneNumber = document.getElementById("whatsappNumber").value.trim();
    phoneNumber = phoneNumber.replace(/\D/g, '');

    if (phoneNumber === "") {
      alert("📱 Please enter a WhatsApp number");
      return;
    }
    // Simple SA formatting: if 10 digits starting with 7, add 27
    if (phoneNumber.length === 10 && phoneNumber.startsWith("7")) {
      phoneNumber = "27" + phoneNumber;
    }
    if (phoneNumber.length < 10) {
      alert("⚠️ Valid number with country code required");
      return;
    }

    const message = `🎉 Rands Wallet Payment Successful! 🎉\n\nOrder ID: ${orderId}\n🔗 Receipt link: ${orderLink}\n\nThank you for vibing with Rands. 💫`;
    window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
    closeWhatsAppModal();
  }

  // Enhanced 30s countdown with visual ring & emotion
  let timeLeft = 30;
  const totalTime = 30;
  const countdownEl = document.getElementById("countdown");
  const countdownText = document.getElementById("countdown-text");
  const progressCircle = document.querySelector('.progress-ring-circle');
  const radius = 12;
  const circumference = 2 * Math.PI * radius;

  if (progressCircle) {
    progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
    progressCircle.style.strokeDashoffset = circumference;
  }

  function updateProgressRing() {
    if (!progressCircle) return;
    const percent = timeLeft / totalTime;
    const offset = circumference * (1 - percent);
    progressCircle.style.strokeDashoffset = offset;
  }

  function updateCountdownStyle() {
    countdownEl.classList.remove('normal', 'warning', 'critical');
    
    if (timeLeft <= 10) {
      countdownEl.classList.add('critical');
      countdownText.innerHTML = timeLeft <= 3 ? `⛔ CLOSING IN ${timeLeft}S! ⛔` : `🔴 EXPIRING IN ${timeLeft}S 🔴`;
    } 
    else if (timeLeft <= 15) {
      countdownEl.classList.add('warning');
      countdownText.innerHTML = `⚠️ Closing in ${timeLeft}s... ⚠️`;
    } 
    else {
      countdownEl.classList.add('normal');
      countdownText.innerHTML = `Closing in ${timeLeft}s...`;
    }
    updateProgressRing();
  }

  updateCountdownStyle();

  const timer = setInterval(() => {
    timeLeft--;
    updateCountdownStyle();

    if (timeLeft <= 0) {
      clearInterval(timer);
      countdownText.innerHTML = "✨ Redirecting to Rands... ✨";
      setTimeout(() => {
        window.location.href = "index.html";
      }, 500);
    }
  }, 1000);

  // Optional subtle haptic for critical stage (mobile)
  if (window.navigator && window.navigator.vibrate) {
    let vibrated = false;
    const vibeInterval = setInterval(() => {
      if (timeLeft <= 8 && !vibrated) {
        window.navigator.vibrate(100);
        vibrated = true;
      }
      if (timeLeft <= 0) clearInterval(vibeInterval);
    }, 200);
  }

  // Close modal on outside click
  window.onclick = function(event) {
    const modal = document.getElementById("whatsappModal");
    if (event.target === modal) closeWhatsAppModal();
  }

  // Floating particles (cinematic)
  function createParticles() {
    const particleCount = 45;
    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      const size = Math.random() * 4 + 1;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.top = `${Math.random() * 100}%`;
      particle.style.animation = `floatParticle ${Math.random() * 8 + 5}s infinite ease-in-out`;
      particle.style.animationDelay = `${Math.random() * 5}s`;
      document.body.appendChild(particle);
    }
  }
  // Add keyframe animation dynamically
  const styleSheet = document.createElement("style");
  styleSheet.textContent = `
    @keyframes floatParticle {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-60px) translateX(20px); opacity: 0; }
    }
  `;
  document.head.appendChild(styleSheet);
  createParticles();
</script>
</body>
</html>
