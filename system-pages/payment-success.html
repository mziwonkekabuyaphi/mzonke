<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Verifying Payment | Rands Kiosk</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none; /* kiosk */
    }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      background-image: radial-gradient(circle at 20% 30%, rgba(255, 43, 43, 0.2), #000 90%);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    /* Large card – fits 22" screen */
    .card {
      background: rgba(12, 12, 20, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 64px;
      padding: 48px 56px;
      max-width: 800px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255, 43, 43, 0.4);
      box-shadow: 0 30px 50px rgba(0,0,0,0.5);
    }

    h1 { font-size: 3rem; font-weight: 800; margin-bottom: 1rem; }
    .loader {
      width: 80px;
      height: 80px;
      border: 6px solid rgba(255,255,255,0.2);
      border-top: 6px solid #ff2b2b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn {
      display: inline-block;
      margin: 16px 12px;
      padding: 18px 32px;
      font-size: 1.4rem;
      font-weight: bold;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: transform 0.1s ease;
      min-width: 220px;
    }
    .btn:active { transform: scale(0.96); }
    .print { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
    .whatsapp { background: linear-gradient(105deg, #25D366, #128C7E); color: white; }

    .checkmark {
      font-size: 100px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffd966, #ff2b2b);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 28px;
      font-size: 1rem;
      letter-spacing: 2px;
      color: #ff8a8a;
    }

    /* Modal for WhatsApp – touch friendly */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #1a1a2a;
      border-radius: 56px;
      padding: 40px;
      width: 500px;
      text-align: center;
    }
    .modal-content input {
      width: 100%;
      padding: 20px;
      font-size: 1.2rem;
      margin: 24px 0;
      border-radius: 60px;
      background: #000000aa;
      color: white;
      border: 1px solid #ff2b2b;
      text-align: center;
    }
    .modal-buttons { display: flex; gap: 20px; }
    .modal-btn {
      flex: 1;
      padding: 16px;
      font-size: 1.2rem;
      border-radius: 60px;
      cursor: pointer;
    }
    .send { background: #25D366; color: white; border: none; }
    .cancel { background: #333; color: white; border: none; }
  </style>
</head>
<body>

<div class="card" id="statusCard">
  <h1>🔐 Verifying Payment</h1>
  <div class="loader"></div>
  <p style="font-size: 1.2rem;">Contacting Yoco secure gateway...</p>
</div>

<!-- WhatsApp Modal -->
<div id="whatsappModal" class="modal">
  <div class="modal-content">
    <h2>📲 Send Receipt</h2>
    <input type="tel" id="whatsappNumber" placeholder="27721234567" autocomplete="off">
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="closeWhatsAppModal()">Cancel</button>
      <button class="modal-btn send" onclick="sendToWhatsApp()">Send</button>
    </div>
  </div>
</div>

<script type="module">
  // ✅ YOUR EXISTING SUPABASE CLIENT IMPORT (relative path)
  import supabase from '../config/supabase.js';

  const urlParams = new URLSearchParams(window.location.search);
  const transactionId = urlParams.get('transaction_id');

  if (!transactionId) {
    document.getElementById('statusCard').innerHTML = `<h1>⚠️ Invalid Link</h1><p>Missing transaction reference.</p><button class="btn" onclick="window.location.href='/kiosk'">Back to Kiosk</button>`;
  } else {
    verifyPayment(transactionId);
  }

  async function verifyPayment(txId) {
    try {
      // 1. Call Edge Function (server-side verification)
      const response = await fetch('https://your-project-ref.supabase.co/functions/v1/verify-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transaction_id: txId })
      });

      const result = await response.json();

      if (result.status === 'paid') {
        // 2. ✅ Payment verified – show success UI
        showSuccessUI(result.receipt_id, result.amount);
        
        // (Optional) Real-time subscription to wallet balance update
        subscribeToWalletBalance();
      } else {
        showFailureAndRedirect();
      }
    } catch (err) {
      console.error('Verification error:', err);
      showFailureAndRedirect();
    }
  }

  function showSuccessUI(receiptId, amount) {
    const card = document.getElementById('statusCard');
    card.innerHTML = `
      <div class="checkmark">✓</div>
      <h1>💰 Wallet Credited!</h1>
      <p style="font-size: 1.8rem; margin: 20px 0;">R ${amount}</p>
      <p style="font-size: 1.2rem;">Receipt: ${receiptId}</p>
      <div>
        <button class="btn print" onclick="window.print()">🖨️ Print Receipt</button>
        <button class="btn whatsapp" onclick="showWhatsAppModal()">📲 WhatsApp Receipt</button>
      </div>
      <p class="tagline">Payment verified server‑side ✓</p>
    `;
    // Auto‑return to kiosk after 10 seconds
    setTimeout(() => { window.location.href = '/kiosk'; }, 10000);
  }

  function showFailureAndRedirect() {
    const card = document.getElementById('statusCard');
    card.innerHTML = `<h1 style="color:#ff5e5e;">⚠️ Payment Not Verified</h1><p>Could not confirm with Yoco. Redirecting...</p>`;
    setTimeout(() => {
      window.location.href = '/system-pages/payment-failure.html?reason=unverified';
    }, 5000);
  }

  // Real‑time subscription (bonus)
  async function subscribeToWalletBalance() {
    // Example: listen to wallet changes for the current user
    const { data: user } = await supabase.auth.getUser();
    if (user) {
      supabase
        .channel('wallet-updates')
        .on('postgres_changes', { 
          event: 'UPDATE', 
          schema: 'public', 
          table: 'wallets', 
          filter: `user_id=eq.${user.id}` 
        }, (payload) => {
          console.log('New balance:', payload.new.balance);
          // You could flash a notification on the kiosk
        })
        .subscribe();
    }
  }

  // WhatsApp functions (keep existing implementation)
  function showWhatsAppModal() {
    document.getElementById('whatsappModal').style.display = 'flex';
  }
  window.showWhatsAppModal = showWhatsAppModal;

  function closeWhatsAppModal() {
    document.getElementById('whatsappModal').style.display = 'none';
  }
  window.closeWhatsAppModal = closeWhatsAppModal;

  function sendToWhatsApp() {
    let phone = document.getElementById('whatsappNumber').value.trim().replace(/\D/g, '');
    if (!phone) return alert('Enter number');
    if (phone.length === 10 && phone.startsWith('7')) phone = '27' + phone;
    const message = `✅ Rands Wallet: Payment confirmed. Receipt: ${receiptIdFromUI()}`;
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    closeWhatsAppModal();
  }
  window.sendToWhatsApp = sendToWhatsApp;

  function receiptIdFromUI() {
    const text = document.body.innerText;
    const match = text.match(/Receipt: (RCPT-\w+)/);
    return match ? match[1] : 'RandsPayment';
  }
</script>
</body>
</html>
