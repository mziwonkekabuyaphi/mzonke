<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying Payment | Rands Wallet</title>
  <style>
    /* (keep your existing premium styles – same glassmorphism, particles, etc.) */
    body { background: #0a0a0f; font-family: 'Inter', sans-serif; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .loader { border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #ff2b2b; border-radius: 50%; width: 48px; height: 48px; animation: spin 0.8s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .card { background: rgba(12,12,20,0.8); backdrop-filter: blur(20px); border-radius: 48px; padding: 32px; max-width: 400px; text-align: center; }
    .error { color: #ff8a8a; }
  </style>
</head>
<body>
<div class="card" id="statusCard">
  <h2>🔐 Verifying Payment</h2>
  <div class="loader"></div>
  <p id="statusMessage">Checking with Yoco secure gateway...</p>
</div>

<script>
  // ========== SECURE VERIFICATION ==========
  const urlParams = new URLSearchParams(window.location.search);
  const transactionId = urlParams.get('transaction_id');

  if (!transactionId) {
    document.getElementById('statusCard').innerHTML = `<h2>⚠️ Invalid Link</h2><p>No transaction reference found.</p><button onclick="window.location.href='/'">Return to Kiosk</button>`;
  } else {
    verifyPayment(transactionId);
  }

  async function verifyPayment(txId) {
    try {
      const response = await fetch('https://your-project-ref.supabase.co/functions/v1/verify-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transaction_id: txId })
      });

      const result = await response.json();

      if (result.status === 'paid') {
        // ✅ Payment confirmed – show success UI
        showSuccessUI(result.receipt_id, result.amount);
        // Optional: send WhatsApp (if you want, reuse modal from original)
        triggerWalletCreditedAnimation();
      } else {
        // ❌ Failed or pending too long
        showFailureAndRedirect();
      }
    } catch (error) {
      console.error('Verification error:', error);
      showFailureAndRedirect();
    }
  }

  function showSuccessUI(receiptId, amount) {
    const card = document.getElementById('statusCard');
    card.innerHTML = `
      <div class="checkmark">✓</div>
      <h1>💰 Wallet Credited!</h1>
      <p>Amount: <strong>R ${amount}</strong></p>
      <p>Receipt: ${receiptId}</p>
      <button class="btn print" onclick="window.print()">🖨️ Print Receipt</button>
      <button class="btn whatsapp" onclick="showWhatsAppModal()">📲 Send WhatsApp</button>
      <p class="tagline">Payment secured via Yoco server-side verification</p>
    `;
    // Redirect to kiosk after 8 seconds or user action
    setTimeout(() => { window.location.href = '/kiosk'; }, 8000);
  }

  function showFailureAndRedirect() {
    const card = document.getElementById('statusCard');
    card.innerHTML = `<h2 class="error">⚠️ Payment Not Verified</h2><p>We could not confirm your payment. You will be redirected.</p>`;
    setTimeout(() => {
      window.location.href = '/system-pages/payment-failure.html?reason=unverified';
    }, 4000);
  }

  function triggerWalletCreditedAnimation() {
    // Optional: play sound / confetti
    if ('vibrate' in navigator) navigator.vibrate(200);
  }

  // Reuse original WhatsApp modal functions
  function showWhatsAppModal() { /* keep existing implementation */ }
  function closeWhatsAppModal() { /* ... */ }
  function sendToWhatsApp() { /* ... */ }
</script>
</body>
</html>
