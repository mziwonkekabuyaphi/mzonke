<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Payment Failed | Rands Wallet</title>

  <!-- Google Fonts: Satoshi & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Satoshi:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      background-image: radial-gradient(circle at 20% 30%, rgba(255, 43, 43, 0.2) 0%, #000000 95%);
      font-family: "Inter", "Satoshi", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ambient red glow */
    .ambient-glow {
      position: fixed;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 43, 43, 0.3), transparent 70%);
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      animation: slowDrift 18s infinite alternate ease-in-out;
    }

    @keyframes slowDrift {
      0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      100% { transform: translate(3%, 2%) scale(1.08); opacity: 0.9; }
    }

    /* floating particles */
    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: #ff5e5e;
      border-radius: 50%;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    /* main glass card */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(12, 12, 20, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 56px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255, 43, 43, 0.4);
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 43, 43, 0.7);
      transform: translateY(-3px);
    }

    /* error icon */
    .error-icon {
      font-size: 72px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff5e5e, #b51212);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 43, 43, 0.7);
      animation: shake 0.5s cubic-bezier(0.36, 1.2, 0.64, 1);
      display: inline-block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ff7b7b, #ff2b2b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 12px 0 8px;
    }

    .sub {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    /* error details card */
    .error-details {
      background: rgba(255, 43, 43, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      padding: 12px 16px;
      margin: 16px 0;
      border: 1px solid rgba(255, 43, 43, 0.4);
      font-size: 0.8rem;
      font-weight: 500;
      font-family: monospace;
      letter-spacing: 0.5px;
    }

    .error-details strong {
      color: #ff7b7b;
    }

    /* reason list */
    .error-message {
      text-align: left;
      margin: 20px 0;
    }

    .reason-list {
      list-style: none;
      padding: 0;
      margin-top: 12px;
    }

    .reason-list li {
      margin: 10px 0;
      padding-left: 24px;
      position: relative;
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .reason-list li::before {
      content: "⚠️";
      position: absolute;
      left: 0;
      top: -1px;
      font-size: 0.9rem;
    }

    /* buttons */
    .btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 14px 0;
      border: none;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      backdrop-filter: blur(4px);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .retry {
      background: linear-gradient(105deg, #ff2b2b, #b51212);
      color: white;
      box-shadow: 0 8px 20px rgba(255, 43, 43, 0.4);
      border: none;
    }

    .support {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .support:hover, .support:active {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ff2b2b;
    }

    .help {
      background: linear-gradient(105deg, #25D366, #128C7E);
      color: white;
      box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
    }

    .tagline {
      margin: 20px 0 12px;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 500;
      color: #ff8a8a;
    }

    /* countdown */
    .countdown {
      margin-top: 16px;
      padding: 10px;
      border-radius: 60px;
      background: rgba(20, 20, 30, 0.6);
      backdrop-filter: blur(4px);
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.3s;
      border: 1px solid rgba(255, 43, 43, 0.3);
    }

    /* Modal – dark glass premium */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(14px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: rgba(18, 18, 28, 0.96);
      backdrop-filter: blur(20px);
      padding: 28px 24px;
      border-radius: 48px;
      text-align: center;
      width: 320px;
      color: white;
      border: 1px solid rgba(255, 43, 43, 0.6);
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-content h3 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff, #ffb8b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .modal-content input,
    .modal-content textarea {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-family: inherit;
      resize: vertical;
    }

    .modal-content input:focus,
    .modal-content textarea:focus {
      outline: none;
      border-color: #ff2b2b;
      box-shadow: 0 0 8px rgba(255, 43, 43, 0.5);
    }

    .modal-content textarea {
      min-height: 80px;
      border-radius: 24px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .modal-btn.send {
      background: linear-gradient(105deg, #25D366, #128C7E);
      color: white;
    }

    .modal-btn.cancel {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

<div class="ambient-glow"></div>
<!-- particles injected via JS -->

<div class="card">
  <div class="error-icon">✗</div>
  <h1>Payment Failed</h1>
  <div class="sub">Transaction could not be completed</div>

  <!-- error code display -->
  <div class="error-details">
    <strong>Error Code:</strong> <span id="errorCode"></span>
  </div>

  <div class="error-message">
    <strong>🔍 Possible reasons</strong>
    <ul class="reason-list" id="reasonList">
      <!-- dynamic reasons based on error code -->
    </ul>
  </div>

  <!-- action buttons -->
  <button class="btn retry" id="retryBtn">⟳ Try Again</button>
  <button class="btn support" id="supportBtn">❓ Need Help?</button>
  <button class="btn help" id="whatsappSupportBtn">📲 WhatsApp Support</button>

  <div class="tagline">#RandsVibe • Secure Payments</div>
  <div class="countdown" id="countdown">Redirecting in 15s...</div>
</div>

<!-- Support Modal -->
<div id="supportModal" class="modal">
  <div class="modal-content">
    <h3>❓ Help Center</h3>
    <p>Describe your issue — we’ll respond quickly</p>
    <input type="email" id="supportEmail" placeholder="Your email address" autocomplete="email">
    <textarea id="supportMessage" placeholder="What went wrong? (e.g., error code, payment method)"></textarea>
    <div class="modal-buttons">
      <button class="modal-btn cancel" id="closeModalBtn">Cancel</button>
      <button class="modal-btn send" id="sendSupportBtn">Send</button>
    </div>
  </div>
</div>

<script>
  // ---------- RANDS WALLET FAILURE PAGE ----------
  // Random error code from realistic set
  const errorCodesMap = {
    "ERR_INSUFFICIENT_FUNDS": {
      display: "ERR_INSUFFICIENT_FUNDS",
      reasons: ["Insufficient balance in wallet", "Payment exceeds daily limit", "Pending holds on account"]
    },
    "ERR_CARD_DECLINED": {
      display: "ERR_CARD_DECLINED",
      reasons: ["Card declined by issuing bank", "3D Secure authentication failed", "Card expired or blocked"]
    },
    "ERR_PAYMENT_TIMEOUT": {
      display: "ERR_PAYMENT_TIMEOUT",
      reasons: ["Network timeout", "Bank gateway unresponsive", "Request took too long"]
    },
    "ERR_INVALID_DETAILS": {
      display: "ERR_INVALID_DETAILS",
      reasons: ["Incorrect CVV or expiry", "Mismatched billing address", "Invalid card number"]
    }
  };
  
  const errorKeys = Object.keys(errorCodesMap);
  const selectedKey = errorKeys[Math.floor(Math.random() * errorKeys.length)];
  const errorMeta = errorCodesMap[selectedKey];
  const errorCodeDisplay = errorMeta.display;
  document.getElementById("errorCode").innerText = errorCodeDisplay;

  // Populate reason list dynamically
  const reasonListEl = document.getElementById("reasonList");
  reasonListEl.innerHTML = errorMeta.reasons.map(r => `<li>${r}</li>`).join('');

  // Order attempt reference for support
  const orderAttempt = "RND" + Math.floor(Math.random() * 100000);

  // Retry button: go back to payment page (you can replace with actual payment URL)
  document.getElementById("retryBtn").addEventListener("click", () => {
    window.location.href = "payment.html";
  });

  // WhatsApp support - predefined support number (replace with actual)
  function showWhatsAppSupport() {
    const supportNumber = "27781234567"; // Rands support WhatsApp number
    const message = `🚫 Failed payment assistance\nOrder Attempt: ${orderAttempt}\nError: ${errorCodeDisplay}\n\nPlease help me resolve this issue.`;
    window.open(`https://wa.me/${supportNumber}?text=${encodeURIComponent(message)}`, '_blank');
  }
  document.getElementById("whatsappSupportBtn").addEventListener("click", showWhatsAppSupport);

  // ----- Support Modal Logic (cinematic dark) -----
  const modal = document.getElementById("supportModal");
  const supportBtn = document.getElementById("supportBtn");
  const closeModalBtn = document.getElementById("closeModalBtn");
  const sendSupportBtn = document.getElementById("sendSupportBtn");

  function openSupportModal() {
    modal.style.display = "flex";
    document.getElementById("supportEmail").value = "";
    document.getElementById("supportMessage").value = "";
  }

  function closeSupportModal() {
    modal.style.display = "none";
  }

  supportBtn.addEventListener("click", openSupportModal);
  closeModalBtn.addEventListener("click", closeSupportModal);
  // close on outside click
  window.addEventListener("click", (e) => {
    if (e.target === modal) closeSupportModal();
  });

  // Simulate sending support ticket
  function sendSupport() {
    const email = document.getElementById("supportEmail").value.trim();
    const message = document.getElementById("supportMessage").value.trim();

    if (!email) {
      alert("📧 Please enter your email address");
      return;
    }
    if (!message) {
      alert("📝 Please describe your issue");
      return;
    }
    if (!email.includes('@')) {
      alert("Please enter a valid email address");
      return;
    }

    // In a real app, POST to support API. Here we simulate.
    alert(`✨ Support ticket created!\n\nWe'll contact you at ${email} within 24 hours.\nReference: ${orderAttempt}\n\nStay vibing with Rands.`);
    closeSupportModal();
  }
  sendSupportBtn.addEventListener("click", sendSupport);

  // ----- Countdown auto-redirect (15 seconds) -----
  let timeLeft = 15;
  const countdownEl = document.getElementById("countdown");

  const timer = setInterval(() => {
    timeLeft--;
    countdownEl.innerText = `Redirecting in ${timeLeft}s...`;

    if (timeLeft <= 0) {
      clearInterval(timer);
      // Redirect to Rands home / kiosk (adjust as needed)
      window.location.href = "index.html";
    }
  }, 1000);

  // ----- floating particles (cinematic) -----
  function createParticles() {
    const particleCount = 55;
    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      const size = Math.random() * 5 + 1.5;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.top = `${Math.random() * 100}%`;
      particle.style.animation = `floatParticle ${Math.random() * 12 + 6}s infinite ease-in-out`;
      particle.style.animationDelay = `${Math.random() * 6}s`;
      document.body.appendChild(particle);
    }
  }

  // add keyframes dynamically
  const styleSheet = document.createElement("style");
  styleSheet.textContent = `
    @keyframes floatParticle {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.5; }
      100% { transform: translateY(-90px) translateX(25px); opacity: 0; }
    }
  `;
  document.head.appendChild(styleSheet);
  createParticles();

  // optional: subtle red pulse animation on error icon
  const errorIcon = document.querySelector('.error-icon');
  setInterval(() => {
    if (errorIcon) {
      errorIcon.style.textShadow = '0 0 12px rgba(255, 43, 43, 0.9)';
      setTimeout(() => {
        if (errorIcon) errorIcon.style.textShadow = '0 0 20px rgba(255, 43, 43, 0.7)';
      }, 200);
    }
  }, 1500);
</script>

</body>
</html>
