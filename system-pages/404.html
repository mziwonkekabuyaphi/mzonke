<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <title>Rands Vibe Pass | Lost in the Vibe Dimension</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Satoshi:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #050308;
      font-family: "Inter", "Satoshi", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* ========== CINEMATIC BACKGROUND ========== */
    .dynamic-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #1a0306 0%, #000000 100%);
      z-index: -5;
    }
    .ambient-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 70% 70%, rgba(255, 35, 35, 0.2), transparent 70%);
      animation: breatheGlow 12s infinite alternate;
      z-index: -4;
      pointer-events: none;
    }
    @keyframes breatheGlow {
      0% { opacity: 0.2; transform: scale(1);}
      100% { opacity: 0.8; transform: scale(1.05);}
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      pointer-events: none;
      z-index: -3;
      animation: floatOrb 25s infinite alternate ease-in-out;
    }
    .orb-1 { width: 450px; height: 450px; background: #ff2b2b; top: -150px; left: -120px; }
    .orb-2 { width: 550px; height: 550px; background: #b81212; bottom: -200px; right: -140px; animation-duration: 20s; opacity: 0.2; }
    .orb-3 { width: 300px; height: 300px; background: #ff6363; top: 45%; right: -5%; animation-duration: 18s; }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1);}
      100% { transform: translate(50px, -40px) scale(1.15);}
    }
    .grid-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: repeating-linear-gradient(0deg, rgba(255,43,43,0.04) 0px, rgba(255,43,43,0.04) 1px, transparent 1px, transparent 40px),
                        repeating-linear-gradient(90deg, rgba(255,43,43,0.04) 0px, rgba(255,43,43,0.04) 1px, transparent 1px, transparent 40px);
      pointer-events: none;
      z-index: -2;
      animation: gridShift 20s linear infinite;
    }
    @keyframes gridShift {
      0% { transform: translate(0, 0);}
      100% { transform: translate(40px, 40px);}
    }
    .glitch-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(255,0,0,0.02) 0px, rgba(255,0,0,0.02) 2px, transparent 2px, transparent 6px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.4;
      animation: glitchFlicker 0.3s infinite;
    }
    @keyframes glitchFlicker {
      0% { opacity: 0.3; }
      100% { opacity: 0.6; }
    }

    /* particles canvas */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      opacity: 0.5;
    }

    /* main container */
    .error-container {
      max-width: 780px;
      margin: 0 auto;
      padding: 1.5rem 1.2rem 3rem;
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* logo */
    .logo-area {
      position: absolute;
      top: 1.5rem;
      left: 1.2rem;
      z-index: 20;
    }
    .logo-icon {
      width: 48px;
      filter: drop-shadow(0 0 8px #ff2b2b);
      transition: all 0.3s;
    }

    /* 404 glitch hero */
    .hero-404 {
      text-align: center;
      margin-bottom: 1.5rem;
      position: relative;
    }
    .glitch-number {
      font-size: 8rem;
      font-weight: 900;
      font-family: monospace;
      letter-spacing: -5px;
      background: linear-gradient(135deg, #fff, #ff5e5e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 15px rgba(255,43,43,0.5);
      position: relative;
      animation: glitchText 2s infinite;
    }
    @keyframes glitchText {
      0% { transform: skew(0deg, 0deg); opacity: 1; text-shadow: 0 0 5px #ff2b2b; }
      95% { transform: skew(0deg, 0deg); opacity: 1; }
      96% { transform: skew(2deg, 1deg); text-shadow: -2px 0 red, 2px 0 blue; opacity: 0.9; }
      97% { transform: skew(-1deg, -0.5deg); text-shadow: 2px 0 red, -2px 0 blue; }
      98% { transform: skew(0deg, 0deg); text-shadow: none; }
      100% { transform: skew(0deg, 0deg); }
    }
    .main-heading {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, #ffb8b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-top: 0.5rem;
    }
    .sub-heading {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 0.5rem;
    }

    /* futuristic visual centerpiece: rotating holographic portal */
    .centerpiece {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
      perspective: 800px;
    }
    .portal {
      position: relative;
      width: 160px;
      height: 160px;
      animation: floatPortal 4s ease-in-out infinite;
    }
    .ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(255,43,43,0.7);
      border-top: 2px solid #ffb8b8;
      border-right: 2px solid #ff2b2b;
      box-shadow: 0 0 20px rgba(255,43,43,0.5), inset 0 0 15px rgba(255,43,43,0.3);
      animation: spinRing 4s linear infinite;
    }
    .ring2 {
      width: 80%;
      height: 80%;
      top: 10%;
      left: 10%;
      border: 2px dashed rgba(255,43,43,0.5);
      border-top: 2px solid #ff7b7b;
      animation: spinRingReverse 5s linear infinite;
    }
    .core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #ff2b2b, #4a0404);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px #ff2b2b;
      animation: pulseCore 1.8s alternate infinite;
    }
    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinRingReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes floatPortal {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulseCore {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    /* glass info card */
    .info-card {
      background: rgba(12,12,20,0.65);
      backdrop-filter: blur(18px);
      border-radius: 44px;
      padding: 1.2rem 1.5rem;
      margin: 1.5rem 0;
      border: 1px solid rgba(255,43,43,0.5);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
    }
    .info-item {
      flex: 1;
      min-width: 120px;
    }
    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.6;
    }
    .info-value {
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #ff2b2b;
      border-radius: 50%;
      animation: pulseDot 1.2s infinite;
    }
    @keyframes pulseDot {
      0% { opacity: 0.4; transform: scale(0.8);}
      100% { opacity: 1; transform: scale(1.2);}
    }

    /* smart search */
    .search-area {
      margin: 1rem 0;
    }
    .futuristic-search {
      background: rgba(20,20,32,0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,43,43,0.4);
      border-radius: 60px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }
    .futuristic-search:focus-within {
      border-color: #ff2b2b;
      box-shadow: 0 0 12px rgba(255,43,43,0.5);
      transform: scale(1.01);
    }
    .futuristic-search span {
      font-size: 1.2rem;
      opacity: 0.7;
    }
    .futuristic-search input {
      background: transparent;
      border: none;
      color: white;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      font-family: inherit;
    }
    .futuristic-search input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    /* action buttons */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 1.5rem 0 1rem;
      justify-content: center;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 0.85rem;
      background: rgba(20,20,32,0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,43,43,0.6);
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(105deg, #ff2b2b, #b51212);
      border: none;
      box-shadow: 0 6px 14px rgba(255,43,43,0.4);
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn:hover {
      transform: translateY(-2px);
      border-color: #ff7b7b;
      box-shadow: 0 12px 22px rgba(255,43,43,0.3);
    }

    /* live system details */
    .system-details {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px dashed rgba(255,255,255,0.2);
      font-size: 0.7rem;
    }
    .signal-bars {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .signal-bar {
      width: 4px;
      background: #ff4d4d;
      border-radius: 2px;
      animation: signalAnim 1.4s infinite alternate;
    }
    .signal-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .signal-bar:nth-child(2) { height: 12px; animation-delay: 0.2s; }
    .signal-bar:nth-child(3) { height: 10px; animation-delay: 0.4s; }
    .signal-bar:nth-child(4) { height: 16px; animation-delay: 0.1s; }
    @keyframes signalAnim {
      0% { opacity: 0.4; background: #ff7b7b; height: 6px; }
      100% { opacity: 1; background: #ff2b2b; height: 16px; }
    }
    .coordinates {
      font-family: monospace;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .glitch-number { font-size: 5rem; letter-spacing: -2px; }
      .main-heading { font-size: 1.5rem; }
      .portal { width: 120px; height: 120px; }
      .btn { padding: 10px 18px; font-size: 0.75rem; }
      .info-card { flex-direction: column; gap: 0.8rem; }
    }
  </style>
</head>
<body>
<div class="dynamic-bg"></div>
<div class="ambient-overlay"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="grid-lines"></div>
<div class="glitch-overlay"></div>
<canvas id="particleCanvas"></canvas>

<div class="logo-area">
  <img src="../assets/images/rands-logo.png" alt="Rands Vibe Pass" class="logo-icon">
</div>

<div class="error-container">
  <!-- hero 404 -->
  <div class="hero-404">
    <div class="glitch-number">404</div>
    <div class="main-heading">Lost In The Vibe Dimension</div>
    <div class="sub-heading">The page you’re looking for drifted beyond the system boundaries.</div>
  </div>

  <!-- futuristic centerpiece: rotating portal -->
  <div class="centerpiece">
    <div class="portal">
      <div class="ring"></div>
      <div class="ring ring2"></div>
      <div class="core"></div>
    </div>
  </div>

  <!-- glass info card -->
  <div class="info-card">
    <div class="info-item">
      <div class="info-label">ERROR CODE</div>
      <div class="info-value">RVP-404-NX</div>
    </div>
    <div class="info-item">
      <div class="info-label">LAST ROUTE</div>
      <div class="info-value">/vibe/destination/unknown</div>
    </div>
    <div class="info-item">
      <div class="info-label">SYSTEM STATUS</div>
      <div class="info-value"><span class="status-dot"></span> Navigation ready</div>
    </div>
    <div class="info-item">
      <div class="info-label">CONNECTION</div>
      <div class="info-value"><span class="status-dot"></span> Unstable drift</div>
    </div>
  </div>

  <!-- smart search -->
  <div class="search-area">
    <div class="futuristic-search">
      <span>🔍</span>
      <input type="text" id="vibeSearch" placeholder="Search the vibe universe...">
    </div>
  </div>

  <!-- action buttons -->
  <div class="button-group">
    <button class="btn btn-primary" id="homeBtn">🏠 Return Home</button>
    <button class="btn" id="eventsBtn">✨ Explore Events</button>
    <button class="btn" id="walletBtn">💳 Open Wallet</button>
    <button class="btn" id="retryBtn">⟳ Retry Connection</button>
  </div>

  <!-- live system details -->
  <div class="system-details">
    <div class="signal-bars">
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <div class="signal-bar"></div>
      <span style="margin-left: 6px;">Rands Navigation AI active</span>
    </div>
    <div class="server-time" id="serverTime">--:--:--</div>
    <div class="coordinates" id="coordinates">⚡ 404° VIBE_GRID</div>
  </div>
</div>

<script>
  (function() {
    // ---------- LIVE SERVER TIME ----------
    function updateServerTime() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit', second:'2-digit' });
      const timeSpan = document.getElementById('serverTime');
      if (timeSpan) timeSpan.innerText = timeStr;
    }
    updateServerTime();
    setInterval(updateServerTime, 1000);

    // dynamic coordinates animation (fake moving)
    const coordSpan = document.getElementById('coordinates');
    let frame = 0;
    setInterval(() => {
      frame++;
      const x = Math.sin(frame * 0.05) * 10 + 404;
      const y = Math.cos(frame * 0.07) * 10;
      if (coordSpan) coordSpan.innerText = `📍 ${x.toFixed(0)}° · ${y.toFixed(0)}° VIBE_GRID`;
    }, 800);

    // ---------- BUTTON ACTIONS (simulated but elegant) ----------
    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = "index.html";
    });
    document.getElementById('eventsBtn').addEventListener('click', () => {
      alert("✨ Explore upcoming events: Neon Rooftop, AfroTech, Midnight Cruise — your vibe awaits.");
    });
    document.getElementById('walletBtn').addEventListener('click', () => {
      alert("💳 Your Rands Wallet is secure. Balance: R 2,450.00. Access from home.");
    });
    document.getElementById('retryBtn').addEventListener('click', () => {
      alert("⟳ Attempting to reconnect to Rands Vibe Pass...\nConnection restored. Redirecting to home.");
      window.location.href = "index.html";
    });

    // search simulation
    const searchInput = document.getElementById('vibeSearch');
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        if (query) alert(`🔍 Searching "${query}" across the vibe universe... (demo)`);
        else alert("🌌 Enter a destination to explore.");
      }
    });

    // ---------- PARTICLES (cinematic) ----------
    const canvas = document.getElementById('particleCanvas');
    let ctx = canvas.getContext('2d');
    let particles = [];
    let animFrame;
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    function initParticles() {
      particles = [];
      for (let i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2.5 + 0.6,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.15,
          color: `rgba(255, ${70 + Math.random() * 80}, ${60 + Math.random() * 60}, ${Math.random() * 0.4 + 0.2})`
        });
      }
    }
    function drawParticles() {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 5;
        ctx.shadowColor = "#ff2b2b";
        ctx.fill();
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
      }
      animFrame = requestAnimationFrame(drawParticles);
    }
    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
    });
    resizeCanvas();
    initParticles();
    drawParticles();

    // ---------- MOUSE PARALLAX / INTERACTIVE GLASS CARD TILT ----------
    const infoCard = document.querySelector('.info-card');
    if (infoCard) {
      infoCard.addEventListener('mousemove', (e) => {
        const rect = infoCard.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        const tiltX = (x - 0.5) * 4;
        const tiltY = (y - 0.5) * 4;
        infoCard.style.transform = `perspective(1000px) rotateX(${tiltY}deg) rotateY(${tiltX}deg)`;
      });
      infoCard.addEventListener('mouseleave', () => {
        infoCard.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
      });
    }

    // glitch effect on hover for numbers
    const glitchEl = document.querySelector('.glitch-number');
    if (glitchEl) {
      setInterval(() => {
        glitchEl.style.animation = 'none';
        glitchEl.offsetHeight;
        glitchEl.style.animation = 'glitchText 2s infinite';
      }, 4000);
    }

    // ripple effect for all buttons
    const btns = document.querySelectorAll('.btn');
    btns.forEach(btn => {
      btn.addEventListener('mousedown', function(e) {
        const ripple = document.createElement('span');
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.cssText = `position:absolute; border-radius:50%; background:rgba(255,255,255,0.3); transform:scale(0); transition:transform 0.4s; pointer-events:none; width:${size}px; height:${size}px; left:${e.clientX - rect.left - size/2}px; top:${e.clientY - rect.top - size/2}px;`;
        this.style.position = 'relative';
        this.style.overflow = 'hidden';
        this.appendChild(ripple);
        setTimeout(() => ripple.style.transform = 'scale(4)', 10);
        setTimeout(() => ripple.remove(), 500);
      });
    });

    // floating easter egg: console message
    console.log("%c✨ Rands Vibe Pass | 404 Dimension ✨\nYou've found the edge of the vibe universe. Return home to continue.", "color: #ff2b2b; font-size: 14px; font-weight: bold;");
  })();
</script>
</body>
</html>
