<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Processing | Rands Vibe</title>

  <!-- Google Fonts: Satoshi + Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Satoshi:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      background-image: radial-gradient(circle at 30% 20%, rgba(255, 43, 43, 0.2) 0%, #000000 95%);
      font-family: "Inter", "Satoshi", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .ambient-glow {
      position: fixed;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(ellipse at 50% 40%, rgba(255, 43, 43, 0.25), transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      animation: slowDrift 16s infinite alternate ease-in-out;
    }

    @keyframes slowDrift {
      0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      100% { transform: translate(2%, 1%) scale(1.05); opacity: 0.9; }
    }

    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: #ff5e5e;
      border-radius: 50%;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    .processing-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .glass-card {
      background: rgba(12, 12, 20, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 56px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid rgba(255, 43, 43, 0.4);
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    .logo-area {
      margin-bottom: 28px;
      position: relative;
      display: inline-block;
    }
    .logo-image {
      width: 70px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 12px rgba(255, 43, 43, 0.6));
      animation: gentlePulse 2s infinite ease;
    }
    @keyframes gentlePulse {
      0% { filter: drop-shadow(0 0 4px rgba(255,43,43,0.3)); transform: scale(1);}
      50% { filter: drop-shadow(0 0 20px rgba(255,43,43,0.8)); transform: scale(1.02);}
      100% { filter: drop-shadow(0 0 4px rgba(255,43,43,0.3)); transform: scale(1);}
    }
    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(255,43,43,0.4), transparent 80%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      filter: blur(16px);
      z-index: -1;
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, #ffb8b8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }

    .sub {
      font-size: 0.85rem;
      opacity: 0.75;
      margin-bottom: 28px;
    }

    .tx-details {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 36px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 0.9rem;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }
    .detail-label {
      opacity: 0.7;
    }
    .detail-value {
      font-weight: 700;
      color: #ffc5c5;
    }
    .amount-value {
      font-size: 1.2rem;
      color: #ff5e5e;
    }

    .spinner-wrapper {
      margin: 28px 0 20px;
      display: flex;
      justify-content: center;
    }
    .neon-spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff2b2b, #ff7b7b, #ff2b2b);
      mask: radial-gradient(farthest-side, transparent 70%, black 71%);
      -webkit-mask: radial-gradient(farthest-side, transparent 70%, black 71%);
      animation: spin 1.2s linear infinite;
      box-shadow: 0 0 12px rgba(255, 43, 43, 0.6);
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .progress-section {
      margin: 16px 0 10px;
    }
    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff2b2b, #ff7b7b);
      border-radius: 30px;
      transition: width 0.2s ease;
    }
    .progress-text {
      font-size: 0.7rem;
      margin-top: 8px;
      opacity: 0.7;
    }

    .status-message {
      margin-top: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 10px;
      border-radius: 40px;
      background: rgba(255, 43, 43, 0.1);
      backdrop-filter: blur(4px);
      display: inline-block;
      width: auto;
      animation: subtlePulse 1.5s infinite;
    }
    @keyframes subtlePulse {
      0% { background: rgba(255, 43, 43, 0.05);}
      100% { background: rgba(255, 43, 43, 0.2);}
    }

    .cancel-link {
      display: block;
      margin-top: 24px;
      font-size: 0.8rem;
      opacity: 0.6;
      cursor: pointer;
      text-decoration: underline;
    }

    .tagline {
      margin-top: 20px;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ff8a8a;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="ambient-glow"></div>

<div class="processing-container">
  <div class="glass-card">
    <div class="logo-area">
      <div class="logo-glow"></div>
      <img src="../assets/images/rands-logo.png" alt="Rands Vibe" class="logo-image">
    </div>

    <div id="loadingState">
      <h2>Processing</h2>
      <div class="sub">Verifying your secure transaction</div>

      <div class="tx-details">
        <div class="detail-row">
          <span class="detail-label">Amount</span>
          <span class="detail-value amount-value">R 849.00</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">To</span>
          <span class="detail-value">Neon Rooftop · Ticketmaster</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Reference</span>
          <span class="detail-value">RND•VIP•2409</span>
        </div>
      </div>

      <div class="spinner-wrapper">
        <div class="neon-spinner"></div>
      </div>
      <div class="progress-section">
        <div class="progress-bar-bg">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressPercent">0%</div>
      </div>

      <div class="status-message" id="statusMsg">
        🔄 Initializing secure gateway...
      </div>
      <div class="cancel-link" id="cancelBtn">Cancel transaction</div>
      <div class="tagline">#RandsVibe • Live the Moment</div>
    </div>
  </div>
</div>

<script>
  // ---------- PROCESSING SIMULATION ----------
  let progress = 0;
  const progressFill = document.getElementById('progressFill');
  const progressPercent = document.getElementById('progressPercent');
  const statusMsg = document.getElementById('statusMsg');
  const loadingState = document.getElementById('loadingState');
  const cancelBtn = document.getElementById('cancelBtn');

  let interval;
  let timeout;

  const statusMessages = [
    "🔐 Encrypting payment details...",
    "📡 Contacting Rands secure gateway...",
    "⚡ Verifying with bank network...",
    "💎 Confirming vibe points...",
    "✅ Almost there, securing your ticket...",
    "✨ Transaction finalized!"
  ];

  let msgIndex = 0;

  function updateProgress() {
    progress += Math.random() * 12 + 3;
    if (progress >= 100) {
      progress = 100;
      if (interval) clearInterval(interval);
      if (timeout) clearTimeout(timeout);
      // Redirect to payment-success.html on success
      window.location.href = "payment-success.html";
    }
    const percentVal = Math.min(Math.floor(progress), 100);
    progressFill.style.width = percentVal + '%';
    progressPercent.innerText = percentVal + '%';

    if (percentVal >= 15 && msgIndex === 0) {
      msgIndex = 1;
      statusMsg.innerHTML = `🔐 ${statusMessages[1]}`;
    } else if (percentVal >= 30 && msgIndex === 1) {
      msgIndex = 2;
      statusMsg.innerHTML = `📡 ${statusMessages[2]}`;
    } else if (percentVal >= 50 && msgIndex === 2) {
      msgIndex = 3;
      statusMsg.innerHTML = `⚡ ${statusMessages[3]}`;
    } else if (percentVal >= 72 && msgIndex === 3) {
      msgIndex = 4;
      statusMsg.innerHTML = `💎 ${statusMessages[4]}`;
    } else if (percentVal >= 88 && msgIndex === 4) {
      msgIndex = 5;
      statusMsg.innerHTML = `✨ ${statusMessages[5]}`;
    }
  }

  function startProcessing() {
    progress = 0;
    msgIndex = 0;
    progressFill.style.width = '0%';
    progressPercent.innerText = '0%';
    statusMsg.innerHTML = "🔐 " + statusMessages[0];
    interval = setInterval(() => {
      if (progress < 100) {
        updateProgress();
      } else {
        clearInterval(interval);
      }
    }, 220);
    timeout = setTimeout(() => {
      if (progress < 100) {
        progress = 100;
        updateProgress();
      }
    }, 6500);
  }

  function cancelTransaction() {
    if (interval) clearInterval(interval);
    if (timeout) clearTimeout(timeout);
    window.location.href = "payment-failed.html";
  }

  cancelBtn.addEventListener('click', cancelTransaction);
  startProcessing();

  // floating particles
  function createParticles() {
    const particleCount = 55;
    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      const size = Math.random() * 5 + 1.5;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.top = `${Math.random() * 100}%`;
      particle.style.animation = `floatParticle ${Math.random() * 12 + 6}s infinite ease-in-out`;
      particle.style.animationDelay = `${Math.random() * 6}s`;
      document.body.appendChild(particle);
    }
  }

  const styleSheet = document.createElement("style");
  styleSheet.textContent = `
    @keyframes floatParticle {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.5; }
      100% { transform: translateY(-90px) translateX(25px); opacity: 0; }
    }
  `;
  document.head.appendChild(styleSheet);
  createParticles();

  // prevent accidental leave while processing
  window.addEventListener('beforeunload', function (e) {
    if (progress < 100 && progress > 0) {
      e.preventDefault();
      e.returnValue = 'Transaction in progress. Are you sure you want to leave?';
      return 'Transaction in progress. Are you sure you want to leave?';
    }
  });
</script>
</body>
</html>
