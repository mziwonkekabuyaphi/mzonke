<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rands Kiosk | Self Service Scanner</title>
  <style>
    /* ========== STYLES (unchanged except logo upload button removed) ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    :root {
      --rands-red: #E31B23;
      --rands-red-dark: #B3131A;
      --rands-red-glow: rgba(227, 27, 35, 0.6);
      --rands-orange: #F97316;
      --rands-red-invalid: #DC2626;
    }

    .kiosk-container {
      min-height: 100vh;
      background: #F8F9FC;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1);
    }

    .kiosk-card {
      max-width: 720px;
      width: 90%;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 48px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
    }

    .kiosk-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .kiosk-logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .kiosk-logo-img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      border-radius: 16px;
    }

    .kiosk-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--rands-red);
      margin: 0.5rem 0 0.3rem;
    }

    .kiosk-sub {
      font-size: 0.85rem;
      color: #6B7280;
    }

    .scanner-panel {
      background: linear-gradient(145deg, #1A1A2E 0%, #0F0F1A 100%);
      border-radius: 32px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .scanner-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--rands-red), var(--rands-red), transparent);
      animation: scanHeaderLight 2s infinite;
    }

    @keyframes scanHeaderLight {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .scanner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .scanner-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scanner-led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
      animation: ledPulse 1.5s infinite;
    }

    @keyframes ledPulse {
      0%, 100% { opacity: 0.5; box-shadow: 0 0 2px #10B981; }
      50% { opacity: 1; box-shadow: 0 0 12px #10B981; }
    }

    .scanner-status-text {
      font-size: 0.7rem;
      color: #10B981;
      font-weight: 500;
    }

    .scanner-model {
      font-size: 0.6rem;
      color: #6B7280;
      font-family: monospace;
    }

    .scanner-window {
      background: #05050A;
      border-radius: 24px;
      padding: 1.8rem;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(227, 27, 35, 0.3);
      margin-bottom: 1rem;
    }

    .scanner-lens {
      position: relative;
      background: #000000;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      text-align: center;
      overflow: hidden;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #111116 0%, #030305 100%);
    }

    .scan-line {
      position: absolute;
      width: 85%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--rands-red), #FF8888, var(--rands-red), transparent);
      left: 7.5%;
      box-shadow: 0 0 15px var(--rands-red), 0 0 8px #FF6B6B;
      animation: scannerSweep 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      border-radius: 3px;
    }

    @keyframes scannerSweep {
      0% { top: 10%; opacity: 0.5; }
      45% { top: 75%; opacity: 1; box-shadow: 0 0 25px var(--rands-red); }
      55% { top: 75%; opacity: 1; }
      100% { top: 10%; opacity: 0.5; }
    }

    .corner-marker {
      position: absolute;
      width: 35px;
      height: 35px;
      border-color: var(--rands-red);
      border-style: solid;
      border-width: 0;
      opacity: 0.7;
    }

    .corner-tl { top: 15px; left: 15px; border-top-width: 3px; border-left-width: 3px; }
    .corner-tr { top: 15px; right: 15px; border-top-width: 3px; border-right-width: 3px; }
    .corner-bl { bottom: 15px; left: 15px; border-bottom-width: 3px; border-left-width: 3px; }
    .corner-br { bottom: 15px; right: 15px; border-bottom-width: 3px; border-right-width: 3px; }

    .scanner-icon {
      font-size: 3.2rem;
      margin-bottom: 0.8rem;
      filter: drop-shadow(0 0 8px rgba(227, 27, 35, 0.5));
      animation: iconGlow 1.8s infinite;
    }

    @keyframes iconGlow {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 2px var(--rands-red)); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px var(--rands-red)); }
    }

    .scanner-hint {
      font-size: 0.7rem;
      color: #9CA3AF;
      margin-top: 0.5rem;
    }

    .scanner-hint strong { color: var(--rands-red); }

    .scanner-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .scanner-fps { font-size: 0.6rem; color: #4B5563; font-family: monospace; }
    .scanner-badge { background: rgba(227, 27, 35, 0.2); padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.6rem; color: var(--rands-red); }

    .input-section { margin: 1rem 0; }
    .input-label { font-size: 0.75rem; color: #6B7280; margin-bottom: 0.5rem; display: block; text-align: center; font-weight: 500; }
    .ticket-input { width: 100%; padding: 0.9rem 1.2rem; background: #F9FAFB; border: 2px solid #E5E7EB; border-radius: 48px; font-size: 0.95rem; color: #1F2937; font-family: monospace; text-align: center; transition: all 0.2s; outline: none; }
    .ticket-input:focus { border-color: var(--rands-red); box-shadow: 0 0 0 3px rgba(227, 27, 35, 0.1); }
    .kiosk-btn { width: 100%; padding: 0.9rem; background: var(--rands-red); border: none; border-radius: 48px; font-size: 1rem; font-weight: 600; color: white; cursor: pointer; transition: all 0.3s; margin-top: 0.8rem; }
    .kiosk-btn:hover { background: var(--rands-red-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(227, 27, 35, 0.3); }
    .printer-status { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 1rem 0; font-size: 0.7rem; color: #10B981; background: #F0FDF4; padding: 0.4rem 1rem; border-radius: 40px; width: fit-content; margin-left: auto; margin-right: auto; }
    .kiosk-footer { text-align: center; margin-top: 1.2rem; font-size: 0.65rem; color: #9CA3AF; }
    .footer-brand { font-weight: 500; color: var(--rands-red); }
    .footer-tagline { color: var(--rands-red); font-weight: 500; }
    .footer-creator { margin-top: 0.3rem; font-size: 0.6rem; color: #9CA3AF; font-family: monospace; }
    .red-dot { display: inline-block; width: 6px; height: 6px; background: var(--rands-red); border-radius: 50%; animation: pulseRed 1.5s infinite; margin-right: 4px; }
    @keyframes pulseRed { 0%,100%{opacity:0.4;} 50%{opacity:1;} }

    /* Popup Styles */
    .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 999; opacity: 0; visibility: hidden; transition: opacity 0.2s; }
    .popup-overlay.show { opacity: 1; visibility: visible; }
    .popup-card { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: white; border-radius: 48px; padding: 2rem; max-width: 420px; width: 85%; text-align: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1); box-shadow: 0 40px 70px rgba(0, 0, 0, 0.4); }
    .popup-card.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
    .popup-card.success-popup { border-top: 6px solid var(--rands-red); border-bottom: 6px solid var(--rands-red); }
    .popup-card.duplicate-popup { border-top: 6px solid var(--rands-orange); border-bottom: 6px solid var(--rands-orange); }
    .popup-card.invalid-popup { border-top: 6px solid var(--rands-red-invalid); border-bottom: 6px solid var(--rands-red-invalid); }
    .duplicate-popup h3 { color: var(--rands-orange) !important; }
    .invalid-popup h3 { color: var(--rands-red-invalid) !important; }
    .popup-card .popup-icon { font-size: 3rem; margin-bottom: 0.5rem; }
    .popup-card h3 { font-size: 1.4rem; margin-bottom: 0.5rem; color: var(--rands-red); }
    .popup-card .popup-message { color: #4B5563; margin: 0.5rem 0; }
    .popup-card .popup-detail { background: #F9FAFB; border-radius: 24px; padding: 0.8rem; margin: 1rem 0; font-family: monospace; }
    .popup-timer { font-size: 0.7rem; color: #9CA3AF; margin-top: 0.8rem; }
    .popup-btn { background: var(--rands-red); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 40px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 1rem; width: 100%; }
    .popup-btn:hover { background: var(--rands-red-dark); transform: translateY(-2px); }
    .popup-btn-orange { background: var(--rands-orange); }
    .popup-btn-red { background: var(--rands-red-invalid); }

    @media (max-width: 550px) {
      .kiosk-card { padding: 1.2rem; }
    }

    .error-shake { animation: shake 0.3s ease-in-out 0s 2; border-color: #E31B23 !important; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
    .printer-dot { animation: pulseGreen 1.5s infinite; }
    @keyframes pulseGreen { 0%,100%{opacity:0.4;} 50%{opacity:1;} }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
  </script>
</head>
<body>

<!-- KIOSK MAIN INTERFACE (no splash screen) -->
<div class="kiosk-container" id="kioskContainer">
  <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">
    <div class="kiosk-card">
      <div class="kiosk-header">
        <div class="kiosk-logo-container">
          <img id="kioskLogo" class="kiosk-logo-img" src="../assets/images/rands-logo4.png" alt="Rands Logo" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect x=\'32\' y=\'40\' width=\'36\' height=\'32\' rx=\'10\' fill=\'%23E31B23\'/%3E%3Cpath d=\'M45 58 L55 58 M50 53 L50 63\' stroke=\'white\' stroke-width=\'2\'/%3E%3C/svg%3E';">
        </div>
        <h2 class="kiosk-title">Self Service Kiosk</h2>
        <div class="kiosk-sub">Scan ticket · Print wristband · Instant entry</div>
      </div>
      <div class="printer-status"><span class="printer-dot" style="width:8px;height:8px;background:#10B981;border-radius:50%;animation:pulseGreen 1.5s infinite;"></span><span>🖨️ Wristband Printer Ready</span></div>
      <div class="scanner-panel">
        <div class="scanner-header"><div class="scanner-status"><div class="scanner-led"></div><span class="scanner-status-text">SCANNER ACTIVE</span></div><div class="scanner-model">RANDS SCAN-7000 • 2D/QR</div></div>
        <div class="scanner-window"><div class="scanner-lens"><div class="scan-line"></div><div class="corner-marker corner-tl"></div><div class="corner-marker corner-tr"></div><div class="corner-marker corner-bl"></div><div class="corner-marker corner-br"></div><div class="scanner-icon">📷</div><div style="font-size: 0.85rem; color: #E31B23; font-weight: 600;">POSITION TICKET</div><div class="scanner-hint">Place QR/barcode within <strong>scan area</strong></div></div></div>
        <div class="scanner-footer"><div class="scanner-fps">🔴 LASER READY · 60 FPS</div><div class="scanner-badge">AUTO-TRIGGER</div></div>
      </div>
      <div class="input-section"><label class="input-label">🔑 ENTER TICKET ID</label><input type="text" class="ticket-input" id="ticketInput" placeholder="Enter ticket ID" autocomplete="off"><button class="kiosk-btn" id="verifyTicketBtn">✓ VERIFY & PRINT WRISTBAND</button></div>
      <div class="kiosk-footer"><div><span class="red-dot"></span> <span class="footer-brand">Rands Venue Management</span> · <span class="footer-tagline">#SeeYourVibe</span></div><div class="footer-creator">Created by Mziwonke KaBuyaphi</div></div>
    </div>
  </div>
</div>

<div class="popup-overlay" id="popupOverlay"></div>
<div id="popupCard" class="popup-card"></div>

<script type="module">
  import { supabase } from '../config/supabase.js';

  // ========== GLOBALS ==========
  let currentEvent = null;
  let allTickets = [];

  // ========== LOAD ACTIVE EVENT & TICKETS ==========
  async function loadActiveEvent() {
    try {
      const { data, error } = await supabase
        .from('events')
        .select('*')
        .eq('status', 'active')
        .order('start_time', { ascending: false })
        .limit(1);
      if (error) throw error;
      if (!data || data.length === 0) {
        console.warn('No active event found');
        return null;
      }
      currentEvent = data[0];
      console.log('Active event:', currentEvent.name);
      return currentEvent;
    } catch (err) {
      console.error('Failed to load event:', err);
      showToast('Could not load active event', 'error');
      return null;
    }
  }

  async function loadTicketsForEvent(eventId) {
    try {
      const { data, error } = await supabase
        .from('tickets')
        .select('id, ticket_type_id, customer_phone, checked_in, checked_in_at, status, ticket_types(name)')
        .eq('event_id', eventId);
      if (error) throw error;
      allTickets = (data || []).map(t => ({
        id: t.id,
        attendeeName: t.customer_phone || 'Guest',
        ticketType: t.ticket_types?.name || 'Standard',
        checkedIn: t.checked_in === true,
        checkinTime: t.checked_in_at,
        status: t.status
      }));
    } catch (err) {
      console.error('Failed to load tickets:', err);
      showToast('Could not load tickets from database', 'error');
    }
  }

  // ========== CHECK-IN TICKET IN SUPABASE ==========
  async function checkInTicketById(ticketId) {
    const now = new Date().toISOString();
    // Update ticket
    const { error: updateErr } = await supabase
      .from('tickets')
      .update({ checked_in: true, checked_in_at: now })
      .eq('id', ticketId);
    if (updateErr) throw updateErr;
    // Insert checkin record
    const { error: checkinErr } = await supabase
      .from('checkins')
      .insert({
        ticket_id: ticketId,
        event_id: currentEvent.id,
        scanned_by: null,   // self-service kiosk
        scanned_at: now,
        status: 'valid'
      });
    if (checkinErr) throw checkinErr;
    return true;
  }

  // ========== UI POPUPS & RESET ==========
  const ticketInput = document.getElementById('ticketInput');
  const verifyBtn = document.getElementById('verifyTicketBtn');
  const popupOverlay = document.getElementById('popupOverlay');
  const popupCard = document.getElementById('popupCard');
  let activeTimeout = null;

  function hidePopup() {
    popupCard.classList.remove('show');
    popupOverlay.classList.remove('show');
    if (activeTimeout) clearTimeout(activeTimeout);
  }

  function showSuccessPopup(ticketData) {
    if (activeTimeout) clearTimeout(activeTimeout);
    popupCard.className = 'popup-card success-popup';
    popupCard.innerHTML = `
      <div class="popup-icon">✅🎫✨</div>
      <h3>Check-in Successful!</h3>
      <div class="popup-message">Welcome to the event!</div>
      <div class="popup-detail">
        <div style="font-weight:700; color:#E31B23;">${escapeHtml(ticketData.attendeeName)}</div>
        <div>🎟️ ${escapeHtml(ticketData.ticketType)}</div>
        <div>📍 ${escapeHtml(currentEvent?.name || 'Event')}</div>
        <div style="margin-top:8px;">🖨️ Wristband issued</div>
      </div>
      <div class="popup-timer" id="popupTimerCountdown">Closing in 3s</div>
    `;
    popupCard.classList.add('show');
    popupOverlay.classList.add('show');
    let countdown = 3;
    const timerSpan = document.getElementById('popupTimerCountdown');
    const interval = setInterval(() => {
      countdown--;
      if (timerSpan) timerSpan.textContent = `Closing in ${countdown}s`;
      if (countdown <= 0) {
        clearInterval(interval);
        hidePopup();
        resetAfterScan();
      }
    }, 1000);
    activeTimeout = setTimeout(() => {
      clearInterval(interval);
      hidePopup();
      resetAfterScan();
    }, 3000);
  }

  function showErrorPopup(type, ticketId, guestName = null) {
    if (activeTimeout) clearTimeout(activeTimeout);
    const isDuplicate = type === 'duplicate';
    popupCard.className = `popup-card ${isDuplicate ? 'duplicate-popup' : 'invalid-popup'}`;
    const btnClass = isDuplicate ? 'popup-btn-orange' : 'popup-btn-red';
    popupCard.innerHTML = `
      <div class="popup-icon">${isDuplicate ? '⚠️🟠' : '❌🔴'}</div>
      <h3>${isDuplicate ? 'Already Checked In!' : 'Invalid Ticket'}</h3>
      <div class="popup-message">${isDuplicate ? 'This ticket has already been used for entry.' : 'The ticket ID you entered is not recognized.'}</div>
      <div class="popup-detail" style="${isDuplicate ? 'background:#FFF7ED;' : 'background:#FEF2F2;'}">
        ${guestName ? `<div style="font-weight:700; color:${isDuplicate ? '#F97316' : '#DC2626'};">${escapeHtml(guestName)}</div>` : ''}
        <div style="font-family:monospace;">Ticket: ${escapeHtml(ticketId)}</div>
        ${isDuplicate ? '<div style="margin-top:6px; font-size:0.75rem;">⏱️ Previously checked in</div>' : '<div style="margin-top:8px; font-size:0.75rem;">Please check and try again.</div>'}
      </div>
      <button class="popup-btn ${btnClass}" id="dismissPopupBtn">🔄 SCAN ANOTHER TICKET</button>
    `;
    popupCard.classList.add('show');
    popupOverlay.classList.add('show');
    document.getElementById('dismissPopupBtn')?.addEventListener('click', () => {
      hidePopup();
      resetAfterScan();
    }, { once: true });
    activeTimeout = setTimeout(() => {
      hidePopup();
      resetAfterScan();
    }, 3000);
  }

  function resetAfterScan() {
    ticketInput.value = '';
    ticketInput.focus();
    // Reload tickets to reflect updated checked_in status
    if (currentEvent) loadTicketsForEvent(currentEvent.id);
  }

  function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.textContent = message;
    toast.style.position = 'fixed';
    toast.style.bottom = '80px';
    toast.style.left = '50%';
    toast.style.transform = 'translateX(-50%)';
    toast.style.background = type === 'error' ? '#DC2626' : '#10B981';
    toast.style.color = 'white';
    toast.style.padding = '8px 20px';
    toast.style.borderRadius = '40px';
    toast.style.fontSize = '12px';
    toast.style.zIndex = '1002';
    toast.style.boxShadow = '0 2px 10px rgba(0,0,0,0.2)';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ========== PROCESS SCAN (real Supabase) ==========
  async function processCheckin(ticketId) {
    if (!ticketId || ticketId.trim() === '') {
      showErrorPopup('invalid', 'Empty Field');
      ticketInput.classList.add('error-shake');
      setTimeout(() => ticketInput.classList.remove('error-shake'), 400);
      return;
    }

    if (!currentEvent) {
      showErrorPopup('invalid', ticketId, null);
      return;
    }

    // Find ticket in local cache (or fetch fresh)
    let ticket = allTickets.find(t => t.id === ticketId);
    if (!ticket && navigator.onLine) {
      // fetch fresh
      const { data, error } = await supabase
        .from('tickets')
        .select('*')
        .eq('id', ticketId)
        .single();
      if (!error && data) {
        ticket = {
          id: data.id,
          attendeeName: data.customer_phone || 'Guest',
          ticketType: 'Standard',
          checkedIn: data.checked_in === true,
          checkinTime: data.checked_in_at,
          status: data.status
        };
        allTickets.push(ticket);
      }
    }

    if (!ticket) {
      showErrorPopup('invalid', ticketId);
      ticketInput.classList.add('error-shake');
      setTimeout(() => ticketInput.classList.remove('error-shake'), 400);
      return;
    }

    if (ticket.checkedIn === true) {
      showErrorPopup('duplicate', ticketId, ticket.attendeeName);
      ticketInput.classList.add('error-shake');
      setTimeout(() => ticketInput.classList.remove('error-shake'), 400);
      return;
    }

    try {
      await checkInTicketById(ticketId);
      // Update local cache
      ticket.checkedIn = true;
      ticket.checkinTime = new Date().toISOString();
      showSuccessPopup(ticket);
    } catch (err) {
      console.error('Check-in failed:', err);
      showErrorPopup('invalid', ticketId);
    }
  }

  // ========== EVENT HANDLERS ==========
  verifyBtn.addEventListener('click', () => processCheckin(ticketInput.value.trim()));
  ticketInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') processCheckin(ticketInput.value.trim());
  });

  // ========== INITIALIZE ==========
  async function init() {
    const event = await loadActiveEvent();
    if (event) {
      await loadTicketsForEvent(event.id);
    } else {
      showToast('No active event found. Please contact event organiser.', 'error');
    }
    ticketInput.focus();
  }
  init();
</script>
</body>
</html>
