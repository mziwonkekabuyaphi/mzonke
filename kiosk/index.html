<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rands · Kiosk</title>

  <!-- Required by screens/welcome.js (wallet QR code rendering), carried
       over unchanged from kiosk-start.html's own <head> -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator-1.4.4/qrcode-generator.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0F0F0F;
      color: #FFFFFF;
      overflow: hidden;
    }

    #kiosk-app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0F0F0F;
    }

    #kiosk-screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <div id="kiosk-app">
    <main id="kiosk-screen"></main>
  </div>

  <script type="module" src="./kiosk.js"></script>
</body>
</html>
