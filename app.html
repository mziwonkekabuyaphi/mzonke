<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Rands App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <div id="app"></div>

  <!-- TRANSACT MODAL -->

  <div id="transactModal" class="modal hidden">

    <div class="modal-sheet">

      <div class="sheet-header">

        <h2>Transact</h2>

        <button class="close-btn" id="closeTransactBtn">✕</button>

      </div>

      <div class="transact-grid">

        <div class="transact-card" data-page="order-now">🍾 Order Now</div>

        <div class="transact-card" data-page="queue-now">⏳ Queue Now</div>

        <div class="transact-card" data-page="vvip-tab">💎 VVIP Tab</div>

        <div class="transact-card" data-page="vibe-statement">📄 Vibe Statement</div>

      </div>

    </div>

  </div>

  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <button class="nav-item" data-page="home">

      <span>🏠</span><span>Home</span>

    </button>

    <button class="nav-item" data-page="tickets">

      <span>🎟️</span><span>Tickets</span>

    </button>

    <button class="nav-item transact-btn" id="openTransactBtn">

      <span>💳</span><span>Transact</span>

    </button>

    <button class="nav-item" data-page="shisha">

      <span>💨</span><span>Shisha</span>

    </button>

    <button class="nav-item" data-page="lockers">

      <span>🔐</span><span>Lockers</span>

    </button>

  </nav>

  <script src="assets/js/app.js"></script>

</body>

</html>
