<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"

        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Rands App</title>

  <!-- Fonts -->

  <link rel="preconnect"

        href="https://fonts.googleapis.com">

  <link rel="preconnect"

        href="https://fonts.gstatic.com"

        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

        rel="stylesheet">

  <link rel="stylesheet"

        href="styles.css">

</head>

<body>

  <!-- APP VIEW CONTAINER -->

  <div id="app"></div>

  <!-- TRANSACT MODAL -->

  <div id="transactModal"

       class="modal hidden">

      <div class="modal-sheet">

          <div class="sheet-header">

              <h2>Transact</h2>

              <button class="close-btn"

                      onclick="closeTransactModal()">

                  ✕

              </button>

          </div>

          <div class="transact-grid">

              <!-- ORDER NOW -->

              <div class="transact-card"

                   onclick="loadPage('order-now')">

                  <div class="card-icon">🍾</div>

                  <h3>Order Now</h3>

                  <p>

                    Order instantly and collect when ready

                  </p>

              </div>

              <!-- QUEUE NOW -->

              <div class="transact-card"

                   onclick="loadPage('queue-now')">

                  <div class="card-icon">⏳</div>

                  <h3>Queue Now</h3>

                  <p>

                    Join the virtual queue and wait remotely

                  </p>

              </div>

              <!-- VVIP TAB -->

              <div class="transact-card"

                   onclick="loadPage('vvip-tab')">

                  <div class="card-icon">💎</div>

                  <h3>VVIP Tab</h3>

                  <p>

                    Premium spending tab and bottle service

                  </p>

              </div>

              <!-- VIBE STATEMENT -->

              <div class="transact-card"

                   onclick="loadPage('vibe-statement')">

                  <div class="card-icon">📄</div>

                  <h3>Vibe Statement</h3>

                  <p>

                    View your nightlife activity and spending

                  </p>

              </div>

          </div>

      </div>

  </div>

  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

      <!-- HOME -->

      <button class="nav-item active"

              onclick="setActive(this); loadPage('home')">

          <span class="nav-icon">🏠</span>

          <span class="nav-label">

            Home

          </span>

      </button>

      <!-- TICKETS -->

      <button class="nav-item"

              onclick="setActive(this); loadPage('tickets')">

          <span class="nav-icon">🎟️</span>

          <span class="nav-label">

            Tickets

          </span>

      </button>

      <!-- TRANSACT -->

      <button class="nav-item transact-btn"

              onclick="openTransactModal()">

          <span class="nav-icon">💳</span>

          <span class="nav-label">

            Transact

          </span>

      </button>

      <!-- SHISHA -->

      <button class="nav-item"

              onclick="setActive(this); loadPage('shisha')">

          <span class="nav-icon">💨</span>

          <span class="nav-label">

            Shisha

          </span>

      </button>

      <!-- LOCKERS -->

      <button class="nav-item"

              onclick="setActive(this); loadPage('lockers')">

          <span class="nav-icon">🔐</span>

          <span class="nav-label">

            Lockers

          </span>

      </button>

  </nav>

  <!-- APP SCRIPT -->

  <script src="assets/js/app.js"></script>

</body>

</html>
