<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Rands Smart Counter — Customer Experience</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ===== PREMIUM CUSTOMER DISPLAY ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0808;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ✨ Animated background particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(179,27,47,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(179,27,47,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(199,154,69,0.05) 0%, transparent 40%);
    }

    .particles::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.2), transparent),
        radial-gradient(2px 2px at 50px 160px, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.2), transparent),
        radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 160px 30px, rgba(255,255,255,0.2), transparent);
      background-size: 200px 200px;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 8s ease-in-out infinite alternate;
    }

    .glow-orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(179,27,47,0.15);
      top: -100px;
      right: -100px;
      animation-delay: 0s;
    }

    .glow-orb-2 {
      width: 300px;
      height: 300px;
      background: rgba(199,154,69,0.08);
      bottom: -50px;
      left: -50px;
      animation-delay: 3s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -30px) scale(1.1); }
    }

    /* ===== MAIN WRAPPER ===== */
    .experience {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      max-width: 1920px;
      max-height: 1080px;
      padding: 40px 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ===== TOP BAR ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .brand-gold {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand-gold .logo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #c79a45, #8a6c33);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      color: #0a0808;
      font-family: 'Playfair Display', serif;
      box-shadow: 0 8px 32px rgba(199,154,69,0.3);
    }

    .brand-gold h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 800;
      color: #fcf9f5;
      letter-spacing: 2px;
    }

    .brand-gold h1 span {
      color: #c79a45;
    }

    .brand-gold .sub {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 1px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff9c;
      box-shadow: 0 0 20px #00ff9c;
      animation: pulse-dot-live 1.5s infinite;
    }

    @keyframes pulse-dot-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .clock-premium {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
    }

    .clock-premium .time {
      font-size: 28px;
      font-weight: 500;
      color: #fcf9f5;
      letter-spacing: 2px;
    }

    .clock-premium .date {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
    }

    /* ===== HERO SECTION ===== */
    .hero-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px 0;
      position: relative;
    }

    .hero-section .badge {
      display: inline-block;
      background: rgba(179,27,47,0.2);
      border: 1px solid rgba(179,27,47,0.3);
      padding: 6px 20px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c79a45;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .hero-section .main-number {
      font-family: 'Playfair Display', serif;
      font-size: 160px;
      font-weight: 900;
      color: #fcf9f5;
      line-height: 1;
      text-shadow: 0 0 60px rgba(179,27,47,0.3);
      animation: numberPulse 3s ease-in-out infinite;
    }

    @keyframes numberPulse {
      0%, 100% { text-shadow: 0 0 60px rgba(179,27,47,0.3); }
      50% { text-shadow: 0 0 100px rgba(179,27,47,0.5), 0 0 200px rgba(179,27,47,0.2); }
    }

    .hero-section .main-label {
      font-size: 18px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: 10px;
      font-weight: 300;
    }

    .hero-section .customer-name {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: #c79a45;
      margin-top: 15px;
      font-weight: 600;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards 0.3s;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .order-details {
      display: flex;
      gap: 40px;
      margin-top: 30px;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards 0.6s;
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 10px 24px;
      border-radius: 999px;
    }

    .detail-item i {
      color: #c79a45;
      font-size: 16px;
    }

    .detail-item span {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      font-weight: 300;
    }

    .detail-item strong {
      color: #fcf9f5;
      font-weight: 600;
    }

    /* ===== PROGRESS JOURNEY ===== */
    .journey-section {
      padding: 30px 0 10px;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards 0.9s;
    }

    .journey-steps {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    .journey-steps::before {
      content: '';
      position: absolute;
      top: 28px;
      left: 15%;
      right: 15%;
      height: 2px;
      background: rgba(255,255,255,0.08);
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex: 1;
      position: relative;
      z-index: 2;
    }

    .step .icon-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .step.active .icon-ring {
      background: rgba(179,27,47,0.2);
      border-color: #c79a45;
      box-shadow: 0 0 40px rgba(199,154,69,0.2);
      transform: scale(1.1);
    }

    .step.completed .icon-ring {
      background: rgba(0,255,156,0.15);
      border-color: #00ff9c;
      box-shadow: 0 0 30px rgba(0,255,156,0.15);
    }

    .step .step-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
      transition: color 0.4s;
    }

    .step.active .step-label {
      color: #c79a45;
    }

    .step.completed .step-label {
      color: #00ff9c;
    }

    .step .step-time {
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ===== BOTTOM BAR ===== */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .queue-info {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
    }

    .queue-item i {
      color: #c79a45;
    }

    .queue-item strong {
      color: #fcf9f5;
      font-weight: 600;
      font-size: 18px;
    }

    .brand-stamp {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      color: rgba(255,255,255,0.15);
      letter-spacing: 3px;
      font-style: italic;
    }

    /* ===== VVIP OVERLAY ===== */
    .vvip-overlay {
      position: absolute;
      top: -20px;
      right: -20px;
      background: linear-gradient(135deg, #ffd700, #f0a500);
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #0a0808;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 60px rgba(255,215,0,0.4);
      animation: vvipGlow 2s ease-in-out infinite;
      display: none;
    }

    .vvip-overlay.show {
      display: block;
    }

    @keyframes vvipGlow {
      0%, 100% { box-shadow: 0 0 40px rgba(255,215,0,0.3); }
      50% { box-shadow: 0 0 80px rgba(255,215,0,0.6); }
    }

    /* ===== ANIMATIONS FOR ORDER STATES ===== */
    .state-ready .main-number {
      color: #00ff9c;
      text-shadow: 0 0 60px rgba(0,255,156,0.3);
      animation: readyGlow 1.5s ease-in-out infinite;
    }

    @keyframes readyGlow {
      0%, 100% { text-shadow: 0 0 40px rgba(0,255,156,0.3); }
      50% { text-shadow: 0 0 80px rgba(0,255,156,0.6); }
    }

    .state-ready .badge {
      background: rgba(0,255,156,0.15);
      border-color: rgba(0,255,156,0.3);
      color: #00ff9c;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .experience { padding: 30px 30px; }
      .hero-section .main-number { font-size: 100px; }
    }

    @media (max-width: 768px) {
      .experience { padding: 20px; }
      .top-bar { flex-direction: column; gap: 15px; align-items: center; text-align: center; }
      .top-right { flex-direction: column; align-items: center; gap: 10px; }
      .hero-section .main-number { font-size: 70px; }
      .hero-section .customer-name { font-size: 24px; }
      .order-details { gap: 15px; }
      .detail-item { padding: 8px 16px; font-size: 12px; }
      .journey-steps { gap: 5px; }
      .step .icon-ring { width: 44px; height: 44px; font-size: 18px; }
      .bottom-bar { flex-direction: column; gap: 15px; text-align: center; }
      .queue-info { flex-wrap: wrap; justify-content: center; }
    }

    /* ===== NO ORDERS STATE ===== */
    .empty-state-hero {
      text-align: center;
    }

    .empty-state-hero .big-icon {
      font-size: 80px;
      color: rgba(255,255,255,0.05);
      margin-bottom: 20px;
    }

    .empty-state-hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      color: rgba(255,255,255,0.15);
      font-weight: 300;
    }

    .empty-state-hero p {
      color: rgba(255,255,255,0.2);
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- ✨ Atmospheric effects -->
  <div class="particles"></div>
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <div class="experience" id="app">
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="brand-gold">
        <div class="logo-icon">R</div>
        <div>
          <h1>RANDS <span>COUNTER</span></h1>
          <div class="sub">Premium Bar Experience</div>
        </div>
      </div>
      <div class="top-right">
        <div class="live-indicator">
          <span class="live-dot"></span>
          <span>LIVE</span>
        </div>
        <div class="clock-premium">
          <div class="time" id="clockTime">--:--</div>
          <div class="date" id="clockDate">—</div>
        </div>
      </div>
    </div>

    <!-- HERO -->
    <div class="hero-section" id="heroSection">
      <div class="badge" id="statusBadge">✨ Now Preparing</div>
      
      <div class="vvip-overlay" id="vvipBadge">👑 VVIP PRIORITY</div>

      <div id="orderDisplay">
        <div class="main-number" id="mainNumber">—</div>
        <div class="main-label" id="mainLabel">Your Order</div>
        <div class="customer-name" id="customerName">Waiting for orders...</div>
      </div>

      <div class="order-details" id="orderDetails">
        <div class="detail-item">
          <i class="fas fa-shopping-bag"></i>
          <span><strong id="itemCount">0</strong> items</span>
        </div>
        <div class="detail-item">
          <i class="fas fa-clock"></i>
          <span>Est. <strong id="waitTime">—</strong></span>
        </div>
        <div class="detail-item">
          <i class="fas fa-hashtag"></i>
          <span>Queue <strong id="queuePosition">—</strong></span>
        </div>
      </div>
    </div>

    <!-- JOURNEY -->
    <div class="journey-section">
      <div class="journey-steps" id="journeySteps">
        <div class="step completed" data-step="0">
          <div class="icon-ring"><i class="fas fa-clipboard-check"></i></div>
          <div class="step-label">Order Placed</div>
        </div>
        <div class="step active" data-step="1">
          <div class="icon-ring"><i class="fas fa-cube"></i></div>
          <div class="step-label">Adding Ice</div>
          <div class="step-time" id="stepTime">—</div>
        </div>
        <div class="step" data-step="2">
          <div class="icon-ring"><i class="fas fa-hand-peace"></i></div>
          <div class="step-label">Ready</div>
        </div>
      </div>
    </div>

    <!-- BOTTOM -->
    <div class="bottom-bar">
      <div class="queue-info">
        <div class="queue-item">
          <i class="fas fa-users"></i>
          <span>In Queue</span>
          <strong id="queueTotal">0</strong>
        </div>
        <div class="queue-item">
          <i class="fas fa-hourglass-half"></i>
          <span>Avg Wait</span>
          <strong id="avgWait">—</strong>
        </div>
      </div>
      <div class="brand-stamp">✦ elevated service ✦</div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://odpugxrihfspaucsdqjj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fCsjtPGF2zFngK_5DiUKag_tkJk_xo2';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const TIMEZONE = 'Africa/Johannesburg';
    const VENDOR_NAME = "Rands Smart Counter";

    // ---- Clock ----
    function tickClock() {
      const now = new Date();
      document.getElementById('clockTime').textContent = now.toLocaleTimeString('en-ZA', { 
        timeZone: TIMEZONE, 
        hour12: false, 
        hour: '2-digit', 
        minute: '2-digit' 
      });
      document.getElementById('clockDate').textContent = now.toLocaleDateString('en-ZA', { 
        timeZone: TIMEZONE, 
        weekday: 'long', 
        day: 'numeric', 
        month: 'long' 
      });
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ---- Helpers ----
    const drinkKeywords = ['coke','cola','water','beer','lager','stout','wine','spirit','cocktail','juice','soda','fanta','sprite'];

    function filterDrinkItems(items) {
      if (!items || !items.length) return [];
      return items.filter(item => {
        const name = (item.name || "").toLowerCase();
        return drinkKeywords.some(k => name.includes(k));
      });
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function formatTime(mins) {
      if (mins < 1) return '<1 min';
      if (mins === 1) return '1 min';
      if (mins < 60) return `${mins} min`;
      const hours = Math.floor(mins / 60);
      const remaining = mins % 60;
      return remaining > 0 ? `${hours}h ${remaining}m` : `${hours}h`;
    }

    // ---- State ----
    let orders = [];
    let currentOrder = null;

    // ---- Fetch & Render ----
    async function fetchOrders() {
      const { data, error } = await supabase
        .from('butcher_shop_orders')
        .select('*')
        .eq('vendor', VENDOR_NAME)
        .in('status', ['pending', 'preparing', 'ready'])
        .order('is_vvip', { ascending: false })
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Fetch error', error);
        return;
      }

      orders = data || [];
      renderDisplay();
    }

    function renderDisplay() {
      const activeOrders = orders.filter(o => o.status !== 'completed' && o.status !== 'collected');
      
      // Find the "current" order - first VVIP, then first preparing, then first pending
      let targetOrder = activeOrders.find(o => o.is_vvip === true && o.status === 'preparing');
      if (!targetOrder) targetOrder = activeOrders.find(o => o.status === 'preparing');
      if (!targetOrder) targetOrder = activeOrders.find(o => o.is_vvip === true);
      if (!targetOrder) targetOrder = activeOrders[0];

      currentOrder = targetOrder;

      const hero = document.getElementById('heroSection');
      const numberEl = document.getElementById('mainNumber');
      const labelEl = document.getElementById('mainLabel');
      const nameEl = document.getElementById('customerName');
      const badgeEl = document.getElementById('statusBadge');
      const vvipBadge = document.getElementById('vvipBadge');
      const itemCount = document.getElementById('itemCount');
      const waitTime = document.getElementById('waitTime');
      const queuePos = document.getElementById('queuePosition');
      const queueTotal = document.getElementById('queueTotal');
      const avgWait = document.getElementById('avgWait');
      const stepTime = document.getElementById('stepTime');

      // Update queue stats
      queueTotal.textContent = activeOrders.length;
      
      // Calculate average wait (simplified)
      if (activeOrders.length > 0) {
        const now = Date.now();
        const waitTimes = activeOrders.map(o => {
          const created = new Date(o.created_at).getTime();
          return Math.floor((now - created) / 60000);
        });
        const avg = Math.round(waitTimes.reduce((a, b) => a + b, 0) / waitTimes.length);
        avgWait.textContent = formatTime(avg);
      } else {
        avgWait.textContent = '—';
      }

      if (!currentOrder) {
        // Empty state
        numberEl.textContent = '—';
        labelEl.textContent = 'Waiting for orders';
        nameEl.textContent = '✨ The bar is quiet...';
        badgeEl.textContent = '🌙 Standby';
        vvipBadge.classList.remove('show');
        itemCount.textContent = '0';
        waitTime.textContent = '—';
        queuePos.textContent = '—';
        stepTime.textContent = '—';
        
        // Reset journey steps
        document.querySelectorAll('.step').forEach(el => {
          el.classList.remove('active', 'completed');
        });
        document.querySelector('.step[data-step="0"]')?.classList.add('completed');
        
        hero.classList.remove('state-ready');
        return;
      }

      // Show VVIP badge
      if (currentOrder.is_vvip) {
        vvipBadge.classList.add('show');
      } else {
        vvipBadge.classList.remove('show');
      }

      // Main number
      numberEl.textContent = `#${currentOrder.order_number || '—'}`;
      
      // Customer name
      const name = currentOrder.customer_name || 'Walk-in';
      nameEl.textContent = name;

      // Status badge
      const statusMap = {
        'pending': { label: '⏳ Order Received', cls: '' },
        'preparing': { label: '🧊 Adding Ice', cls: '' },
        'ready': { label: '✅ Ready for Collection!', cls: 'state-ready' }
      };
      const status = statusMap[currentOrder.status] || statusMap['pending'];
      badgeEl.textContent = status.label;
      hero.className = 'hero-section ' + (currentOrder.status === 'ready' ? 'state-ready' : '');

      // Items
      let items = currentOrder.butcher_items || [];
      if (currentOrder.source === 'kiosk') {
        items = filterDrinkItems(items);
      }
      itemCount.textContent = items.length;

      // Wait time (elapsed since creation)
      const created = new Date(currentOrder.created_at).getTime();
      const elapsed = Math.floor((Date.now() - created) / 60000);
      waitTime.textContent = formatTime(elapsed);

      // Queue position
      const index = activeOrders.findIndex(o => o.order_id === currentOrder.order_id);
      queuePos.textContent = index >= 0 ? `#${index + 1}` : '—';

      // Step time (for "Adding Ice" stage)
      if (currentOrder.status === 'preparing' || currentOrder.status === 'ready') {
        const prepStart = currentOrder.prep_start_time 
          ? new Date(currentOrder.prep_start_time).getTime() 
          : created;
        const prepElapsed = Math.floor((Date.now() - prepStart) / 60000);
        stepTime.textContent = formatTime(prepElapsed);
      } else {
        stepTime.textContent = '—';
      }

      // Update journey steps
      const stepMap = {
        'pending': 0,
        'preparing': 1,
        'ready': 2
      };
      const currentStep = stepMap[currentOrder.status] || 0;

      document.querySelectorAll('.step').forEach((el, idx) => {
        el.classList.remove('active', 'completed');
        if (idx < currentStep) el.classList.add('completed');
        if (idx === currentStep) el.classList.add('active');
      });
    }

    // ---- Realtime ----
    function setupRealtime() {
      supabase
        .channel('customer-display')
        .on('postgres_changes', { 
          event: '*', 
          schema: 'public', 
          table: 'butcher_shop_orders',
          filter: `vendor=eq.${VENDOR_NAME}`
        }, () => {
          fetchOrders();
        })
        .subscribe();
    }

    // ---- Init ----
    fetchOrders();
    setupRealtime();

    // Refresh every 10s for timer updates
    setInterval(() => {
      if (currentOrder) renderDisplay();
    }, 10000);
