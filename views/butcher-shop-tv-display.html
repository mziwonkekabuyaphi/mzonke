<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Butcher Shop — Live Order Board · Premium Red</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --premium-black: #0c0907;
      --premium-charcoal: #1a1210;
      --premium-red: #b31b2f;
      --premium-red-bright: #e02f44;
      --premium-red-glow: #d42a3e;
      --premium-white: #fcf9f5;
      --premium-cream: #f2ebe0;
      --premium-soft-gray: #b7aea4;
      --premium-gold: #d9b36a;
      --premium-gold-dim: #a8874a;
      --premium-ink: #1a1410;
      --premium-ink-soft: #5a4d40;
      --premium-green: #6f9e5a;
      --premium-green-glow: #8fcf74;
      line-height: 1.2;
    }
    *{ box-sizing: border-box; }
    html,body{
      margin:0; padding:0; width:100%; height:100%;
      background: var(--premium-black);
      color: var(--premium-white);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* rich vignette + subtle grain */
    body::before{
      content:"";
      position: fixed; inset:0;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(224,47,68,0.15), transparent 50%),
        radial-gradient(ellipse at 50% 110%, rgba(0,0,0,0.7), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
      pointer-events:none;
      z-index: 0;
    }

    .app{ position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; }

    /* ===== HEADER — premium red & gold ===== */
    header{
      display:flex; align-items:center; justify-content:space-between;
      padding: 16px 36px;
      background: linear-gradient(180deg, #1a1210, #0f0b09);
      border-bottom: 3px solid var(--premium-red);
      box-shadow: 0 8px 28px rgba(179,27,47,0.3);
    }
    .brand{ display:flex; align-items:center; gap:18px; }
    .brand .logo-slot{
      width:58px; height:58px; border-radius:12px;
      background: var(--premium-white);
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
      box-shadow: 0 0 0 2px var(--premium-gold), 0 8px 18px rgba(0,0,0,0.5);
      flex-shrink:0;
    }
    .brand .logo-slot span{
      font-family:'Oswald'; font-weight:700;
      color: var(--premium-red);
      font-size:28px;
      letter-spacing:2px;
    }
    .brand-text .eyebrow{
      font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:0.2em;
      color: var(--premium-gold); text-transform:uppercase; margin-bottom:2px;
      opacity:0.8;
    }
    .brand-text h1{
      font-family:'Oswald'; font-weight:700; font-size:32px; letter-spacing:0.02em;
      margin:0; color: var(--premium-white);
      text-transform:uppercase;
      text-shadow: 0 2px 6px rgba(179,27,47,0.3);
    }
    .brand-text h1 span{ color: var(--premium-red-bright); }

    .header-right{ display:flex; align-items:center; gap:28px; }
    .clock{ text-align:right; font-family:'IBM Plex Mono'; }
    .clock .time{
      font-size:26px; font-weight:600;
      color:var(--premium-white);
      letter-spacing:0.04em;
      text-shadow: 0 0 12px rgba(224,47,68,0.2);
    }
    .clock .date{
      font-size:12px; color:var(--premium-soft-gray);
      letter-spacing:0.06em; text-transform:uppercase;
    }
    .status-pill{
      display:flex; align-items:center; gap:8px;
      font-family:'IBM Plex Mono'; font-size:12px; letter-spacing:0.06em;
      padding:7px 16px; border-radius:999px;
      background: rgba(111,158,90,0.12);
      border: 1px solid rgba(111,158,90,0.35);
      color: var(--premium-green-glow);
      text-transform:uppercase;
      backdrop-filter: blur(2px);
    }
    .status-pill.offline{
      background: rgba(224,47,68,0.15);
      border-color: rgba(224,47,68,0.5);
      color: #ff7a84;
    }
    .status-dot{
      width:9px; height:9px; border-radius:50%;
      background: #7ee06b;
      box-shadow: 0 0 12px #7ee06b;
      animation: pulse-dot 1.8s infinite;
    }
    .status-pill.offline .status-dot{
      background:#ff5b64;
      box-shadow:0 0 12px #ff5b64;
    }
    @keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* ===== BOARD ===== */
    .board{
      flex:1; display:grid; grid-template-columns: 1fr 1fr 1.15fr;
      gap: 0; min-height:0;
      background: radial-gradient(circle at 20% 20%, rgba(179,27,47,0.06), transparent 50%);
    }
    .column{
      display:flex; flex-direction:column; min-height:0;
      border-right: 1px solid rgba(179,27,47,0.2);
      position:relative;
    }
    .column:last-child{ border-right:none; }

    .col-head{
      padding: 20px 28px 14px;
      display:flex; align-items:baseline; justify-content:space-between;
      border-bottom: 2px solid rgba(179,27,47,0.3);
      background: linear-gradient(180deg, rgba(224,47,68,0.06), transparent);
    }
    .col-head h2{
      font-family:'Oswald'; text-transform:uppercase; letter-spacing:0.05em;
      font-size:20px; margin:0; font-weight:600;
      color: var(--premium-white);
      display:flex; align-items:center; gap:10px;
    }
    .col-head .rail-icon{ font-size:18px; opacity:0.9; }
    .col-count{
      font-family:'IBM Plex Mono'; font-size:15px; font-weight:600;
      background: rgba(179,27,47,0.2);
      color: var(--premium-red-bright);
      padding:3px 12px; border-radius:999px; min-width:32px; text-align:center;
      box-shadow: inset 0 0 8px rgba(179,27,47,0.2);
    }
    .col-new .col-count{ background: rgba(179,27,47,0.25); color: #ff8a96; }
    .col-ready .col-head{ border-bottom-color: rgba(111,158,90,0.5); }
    .col-ready .col-count{ background: rgba(111,158,90,0.2); color: var(--premium-green-glow); }

    .rail{
      flex:1; overflow-y:auto; overflow-x:hidden;
      padding: 22px 22px 30px;
      display:flex; flex-direction:column; gap:20px;
      scrollbar-width:none;
    }
    .rail::-webkit-scrollbar{ display:none; }

    .empty-state{
      margin-top:40px; text-align:center; color: #6f6256;
      font-family:'Inter'; font-size:14px; padding:0 30px;
    }
    .empty-state .glyph{ font-size:34px; display:block; margin-bottom:10px; opacity:0.4; }

    /* ===== TICKET — premium white/cream with red accents ===== */
    .ticket{
      position:relative;
      background: var(--premium-cream);
      color: var(--premium-ink);
      border-radius: 4px 4px 0 0;
      padding: 18px 20px 22px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.6), 0 2px 0 rgba(0,0,0,0.2);
      transform: rotate(var(--tilt, -0.3deg));
      animation: drop-in 0.4s cubic-bezier(.2,.8,.3,1);
      border-left: 4px solid var(--premium-red);
    }
    .ticket:nth-child(3n+1){ --tilt: -0.7deg; border-left-width: 5px; }
    .ticket:nth-child(3n+2){ --tilt: 0.4deg; }
    .ticket:nth-child(3n){ --tilt: -0.2deg; }

    @keyframes drop-in{
      from{ opacity:0; transform: translateY(-16px) rotate(var(--tilt,0)); }
      to{ opacity:1; transform: translateY(0) rotate(var(--tilt,0)); }
    }

    /* torn paper bottom */
    .ticket::after{
      content:"";
      position:absolute; left:0; right:0; bottom:-10px; height:14px;
      background:
        linear-gradient(135deg, var(--premium-cream) 50%, transparent 50%) 0 0/10px 10px repeat-x,
        linear-gradient(-135deg, var(--premium-cream) 50%, transparent 50%) 0 0/10px 10px repeat-x;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    /* brass clip — upgraded gold */
    .clip{
      position:absolute; top:-12px; left:50%; transform:translateX(-50%);
      width:38px; height:18px; border-radius:4px;
      background: linear-gradient(180deg, #f0d68a, var(--premium-gold-dim));
      box-shadow: 0 3px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
    }
    .clip::after{
      content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%);
      width:4px; height:10px; background: var(--premium-gold-dim);
    }

    .ticket-top{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px; }
    .order-num{
      font-family:'Oswald'; font-size:26px; font-weight:700; letter-spacing:0.01em;
      color: var(--premium-red);
    }
    .channel-badge{
      font-family:'IBM Plex Mono'; font-size:10px; text-transform:uppercase; letter-spacing:0.06em;
      padding:4px 10px; border-radius:4px;
      border:1.5px solid var(--premium-ink);
      color: var(--premium-ink);
      transform: rotate(2deg);
      white-space:nowrap;
      background: rgba(255,255,255,0.2);
    }
    .channel-badge.kiosk{ border-color:#7a6342; color:#7a6342; }
    .channel-badge.web{ border-color:#2a5f6b; color:#2a5f6b; }
    .channel-badge.whatsapp{ border-color:#2a6b3c; color:#2a6b3c; }

    .customer{
      font-family:'Inter'; font-weight:600; font-size:15px;
      color: var(--premium-ink);
      margin-bottom:10px;
    }
    .customer .sub{ font-weight:400; color:var(--premium-ink-soft); font-size:12px; }

    .items{
      list-style:none; margin:0 0 14px; padding:0;
      border-top:1px dashed rgba(36,28,21,0.25);
      padding-top:8px;
    }
    .items li{
      display:flex; justify-content:space-between; gap:10px;
      font-size:14px; padding:3px 0; color:var(--premium-ink);
    }
    .items li .qty{
      font-family:'IBM Plex Mono'; font-weight:600;
      color: var(--premium-red);
      min-width:24px;
    }
    .items li .name{ flex:1; }

    .ticket-foot{ display:flex; align-items:center; justify-content:space-between; }
    .timer{
      font-family:'IBM Plex Mono'; font-weight:600; font-size:13px;
      display:flex; align-items:center; gap:6px;
      padding:4px 12px; border-radius:6px;
    }
    .timer.calm{ background: rgba(111,158,90,0.12); color:#3d6b2c; }
    .timer.warn{ background: rgba(217,142,43,0.15); color:#9e6b1a; }
    .timer.hot{
      background: rgba(179,27,47,0.18);
      color: var(--premium-red);
      animation: hot-pulse 1.2s infinite;
    }
    @keyframes hot-pulse{ 0%,100%{opacity:1;} 50%{opacity:0.5;} }

    .action-tag{
      font-family:'Oswald'; font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
      color:var(--premium-ink-soft);
    }

    /* ready column special glow */
    .col-ready .ticket{
      box-shadow: 0 10px 30px rgba(111,158,90,0.25), 0 2px 0 rgba(0,0,0,0.2);
      border-left-color: var(--premium-green);
    }
    .col-ready .ticket .order-num{ color: #3d6b2c; }

    /* ===== FOOTER TICKER ===== */
    footer{
      height:60px; flex-shrink:0;
      background: #0f0b09;
      border-top: 2px solid rgba(179,27,47,0.3);
      display:flex; align-items:center;
      overflow:hidden;
      position:relative;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.6);
    }
    footer .label{
      font-family:'Oswald'; font-size:13px; text-transform:uppercase; letter-spacing:0.1em;
      color: var(--premium-gold);
      background: rgba(179,27,47,0.15);
      padding:0 24px; height:100%;
      display:flex; align-items:center; flex-shrink:0; z-index:2;
      border-right:2px solid rgba(179,27,47,0.3);
    }
    .ticker-track{
      display:flex; gap:48px; white-space:nowrap;
      animation: scroll-left 30s linear infinite;
      padding-left: 100%;
      align-items:center;
      font-family:'IBM Plex Mono'; font-size:14px; color: #d6cdc2;
    }
    .ticker-track span.tag{ color: var(--premium-green-glow); margin-right:8px; }
    @keyframes scroll-left{ from{ transform: translateX(0); } to{ transform: translateX(-100%); } }
    footer .empty-ticker{ padding-left:24px; color:#6f6256; font-family:'Inter'; font-size:13px; }

    @media (max-width: 1100px){
      .board{ grid-template-columns: 1fr; }
      .column{ border-right:none; border-bottom:1px solid rgba(179,27,47,0.2); }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo-slot" id="logoSlot"><span>R</span></div>
      <div class="brand-text">
        <div class="eyebrow">Rands · Kitchen Display</div>
        <h1>The Butcher <span>Shop</span></h1>
      </div>
    </div>
    <div class="header-right">
      <div class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">Connecting…</span></div>
      <div class="clock">
        <div class="time" id="clockTime">--:--:--</div>
        <div class="date" id="clockDate">—</div>
      </div>
    </div>
  </header>

  <div class="board">
    <section class="column col-new">
      <div class="col-head">
        <h2><span class="rail-icon">🔔</span>New Orders</h2>
        <span class="col-count" id="countNew">0</span>
      </div>
      <div class="rail" id="railNew"></div>
    </section>

    <section class="column col-prep">
      <div class="col-head">
        <h2><span class="rail-icon">🔪</span>On The Block</h2>
        <span class="col-count" id="countPrep">0</span>
      </div>
      <div class="rail" id="railPrep"></div>
    </section>

    <section class="column col-ready">
      <div class="col-head">
        <h2><span class="rail-icon">✅</span>Ready for Collection</h2>
        <span class="col-count" id="countReady">0</span>
      </div>
      <div class="rail" id="railReady"></div>
    </section>
  </div>

  <footer>
    <div class="label">Collected</div>
    <div id="tickerWrap" style="flex:1; overflow:hidden;">
      <div class="empty-ticker" id="emptyTicker">No orders collected yet today.</div>
      <div class="ticker-track" id="tickerTrack" style="display:none;"></div>
    </div>
  </footer>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://odpugxrihfspaucsdqjj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_fCsjtPGF2zFngK_5DiUKag_tkJk_xo2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const TIMEZONE = 'Africa/Johannesburg';

  // ---- Clock ----
  function tickClock(){
    const now = new Date();
    document.getElementById('clockTime').textContent = now.toLocaleTimeString('en-ZA', { timeZone: TIMEZONE, hour12:false });
    document.getElementById('clockDate').textContent = now.toLocaleDateString('en-ZA', { timeZone: TIMEZONE, weekday:'long', day:'numeric', month:'long' });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---- Connection status ----
  function setStatus(online){
    const pill = document.getElementById('statusPill');
    const text = document.getElementById('statusText');
    if(online){
      pill.classList.remove('offline');
      text.textContent = 'Live';
    } else {
      pill.classList.add('offline');
      text.textContent = 'Reconnecting…';
    }
  }

  // ---- Helpers ----
  function channelLabel(source){
    const s = (source || 'kiosk').toLowerCase();
    if(s.includes('whatsapp')) return { cls:'whatsapp', label:'WhatsApp' };
    if(s.includes('web')) return { cls:'web', label:'Web App' };
    return { cls:'kiosk', label:'Kiosk' };
  }

  function elapsedMinutes(fromMs){
    return Math.max(0, Math.floor((Date.now() - fromMs) / 60000));
  }

  function formatElapsed(mins){
    if(mins < 1) return 'just now';
    if(mins === 1) return '1 min';
    return `${mins} min`;
  }

  function timerClass(mins, thresholds){
    if(mins >= thresholds.hot) return 'hot';
    if(mins >= thresholds.warn) return 'warn';
    return 'calm';
  }

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Rendering ----
  let ORDERS = [];

  function render(){
    const now = Date.now();
    const newOrders = ORDERS.filter(o => o.status === 'pending' || o.status === 'placed');
    const prepOrders = ORDERS.filter(o => o.status === 'preparing');
    const readyOrders = ORDERS.filter(o => o.status === 'ready');
    const collected = ORDERS.filter(o => o.status === 'collected' || o.status === 'completed')
      .sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at))
      .slice(0, 12);

    document.getElementById('countNew').textContent = newOrders.length;
    document.getElementById('countPrep').textContent = prepOrders.length;
    document.getElementById('countReady').textContent = readyOrders.length;

    renderRail('railNew', newOrders, {
      timeBasis: o => new Date(o.created_at).getTime(),
      thresholds: { warn: 2, hot: 5 },
      emptyIcon: '📋', emptyText: 'No new orders. The board is clear.'
    });

    renderRail('railPrep', prepOrders, {
      timeBasis: o => o.prep_start_time || new Date(o.updated_at).getTime(),
      thresholds: { warn: 8, hot: 15 },
      emptyIcon: '🔥', emptyText: 'Nothing on the block right now.'
    });

    renderRail('railReady', readyOrders, {
      timeBasis: o => new Date(o.updated_at).getTime(),
      thresholds: { warn: 5, hot: 10 },
      emptyIcon: '🛎️', emptyText: 'Nothing waiting for collection.'
    });

    renderTicker(collected);
  }

  function ticketHtml(o, opts){
    const ch = channelLabel(o.source);
    const mins = elapsedMinutes(opts.timeBasis(o));
    const tClass = timerClass(mins, opts.thresholds);
    const items = (o.butcher_items || []);
    const itemsHtml = items.map(it => `
      <li><span class="qty">${escapeHtml(it.quantity)}×</span><span class="name">${escapeHtml(it.name)}</span></li>
    `).join('');

    return `
      <div class="ticket" data-order-id="${o.order_id}">
        <div class="clip"></div>
        <div class="ticket-top">
          <div class="order-num">${escapeHtml(o.order_number || '—')}</div>
          <div class="channel-badge ${ch.cls}">${ch.label}</div>
        </div>
        <div class="customer">${escapeHtml(o.customer_name || 'Walk-in')}
          <span class="sub">${o.customer_phone ? '· ' + escapeHtml(o.customer_phone) : ''}</span>
        </div>
        <ul class="items">${itemsHtml}</ul>
        <div class="ticket-foot">
          <div class="timer ${tClass}">⏱ ${formatElapsed(mins)}</div>
        </div>
      </div>
    `;
  }

  function renderRail(elId, list, opts){
    const el = document.getElementById(elId);
    if(list.length === 0){
      el.innerHTML = `<div class="empty-state"><span class="glyph">${opts.emptyIcon}</span>${opts.emptyText}</div>`;
      return;
    }
    const sorted = [...list].sort((a,b) => opts.timeBasis(a) - opts.timeBasis(b));
    el.innerHTML = sorted.map(o => ticketHtml(o, opts)).join('');
  }

  function renderTicker(collected){
    const track = document.getElementById('tickerTrack');
    const empty = document.getElementById('emptyTicker');
    if(collected.length === 0){
      track.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    track.style.display = 'flex';
    track.innerHTML = collected.map(o => {
      const items = (o.butcher_items || []).map(it => it.name).join(', ');
      return `<div><span class="tag">✓</span>${escapeHtml(o.order_number)} — ${escapeHtml(o.customer_name || 'Walk-in')} · ${escapeHtml(items)}</div>`;
    }).join('');
  }

  setInterval(render, 15000);

  // ---- Data fetching ----
  async function fetchOrders(){
    const { data, error } = await supabase
      .from('butcher_shop_orders')
      .select('*')
      .order('created_at', { ascending: false });

    if(error){
      console.error('Fetch error', error);
      setStatus(false);
      return;
    }
    setStatus(true);
    ORDERS = data || [];
    render();
  }

  fetchOrders();

  // ---- Realtime ----
  const channel = supabase
    .channel('butcher-shop-orders-feed')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
      fetchOrders();
    })
    .subscribe((status) => {
      if(status === 'SUBSCRIBED'){ setStatus(true); }
      if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){ setStatus(false); }
    });

  setInterval(fetchOrders, 30000);
</script>
</body>
</html>
