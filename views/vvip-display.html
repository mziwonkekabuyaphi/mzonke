<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Rands VVIP Lounge — Live Table Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ===== RANDS SMART COUNTER — PREMIUM RED THEME ===== */
    :root {
      --charcoal: #0c0907;
      --charcoal-2: #1a1210;
      --charcoal-3: #241b17;
      --paper: #f4ecdc;
      --paper-shadow: #d8c9a8;
      --blood: #b31b2f;
      --blood-bright: #e02f44;
      --blood-glow: rgba(179,27,47,0.25);
      --brass: #c79a45;
      --brass-dim: #8a6c33;
      --bone: #faf7f0;
      --ink: #241c15;
      --ink-soft: #5a4d3d;
      --green: #6f9e5a;
      --green-glow: #8fcf74;
      --amber: #d98e2b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--charcoal);
      color: var(--bone);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* ambient texture + vignette */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(179,27,47,0.10), transparent 50%),
        radial-gradient(ellipse at 50% 110%, rgba(0,0,0,0.6), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ===== HEADER — Premium Red ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 36px;
      background: linear-gradient(180deg, #1a1210, #0f0b09);
      border-bottom: 3px solid var(--blood);
      box-shadow: 0 8px 28px rgba(179,27,47,0.25);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo-slot {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 2px var(--brass), 0 8px 18px rgba(0,0,0,0.5);
      flex-shrink: 0;
      overflow: hidden;
    }

    .logo-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-text .eyebrow {
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--brass);
      text-transform: uppercase;
      margin-bottom: 2px;
      opacity: 0.8;
    }

    .brand-text h1 {
      font-family: 'Oswald';
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 0.02em;
      margin: 0;
      color: var(--bone);
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(179,27,47,0.2);
    }

    .brand-text h1 span {
      color: var(--blood-bright);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .clock {
      text-align: right;
      font-family: 'IBM Plex Mono';
    }

    .clock .time {
      font-size: 26px;
      font-weight: 600;
      color: var(--bone);
      letter-spacing: 0.04em;
      text-shadow: 0 0 12px rgba(224,47,68,0.15);
    }

    .clock .date {
      font-size: 12px;
      color: #a9998a;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      letter-spacing: 0.05em;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(111,158,90,0.12);
      border: 1px solid rgba(111,158,90,0.35);
      color: #9fd486;
      text-transform: uppercase;
      backdrop-filter: blur(2px);
    }

    .status-pill.offline {
      background: rgba(179,27,47,0.15);
      border-color: rgba(179,27,47,0.5);
      color: #ff7a84;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #7ee06b;
      box-shadow: 0 0 12px #7ee06b;
      animation: pulse-dot 1.8s infinite;
    }

    .status-pill.offline .status-dot {
      background: #ff5b64;
      box-shadow: 0 0 12px #ff5b64;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ===== VVIP action buttons on booking cards ===== */
    .vvip-action-btn {
      font-family: 'Oswald';
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: var(--blood);
      color: var(--bone);
    }

    .vvip-action-btn:hover { background: var(--blood-bright); }

    .vvip-action-btn.gold {
      background: linear-gradient(180deg, #e3c073, var(--brass-dim));
      color: var(--ink);
    }

    .vvip-package {
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }

    #vvipView {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ===== BOARD — 3 columns ===== */
    .board {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1.15fr;
      gap: 0;
      min-height: 0;
      background: radial-gradient(circle at 20% 20%, rgba(179,27,47,0.05), transparent 50%);
    }

    .column {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid rgba(179,27,47,0.2);
      position: relative;
    }

    .column:last-child {
      border-right: none;
    }

    .col-head {
      padding: 18px 24px 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid rgba(179,27,47,0.25);
      background: linear-gradient(180deg, rgba(179,27,47,0.06), transparent);
      flex-shrink: 0;
    }

    .col-head h2 {
      font-family: 'Oswald';
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 20px;
      margin: 0;
      font-weight: 600;
      color: var(--bone);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .col-head .rail-icon { 
      font-size: 18px; 
      opacity: 0.9;
      color: var(--blood-bright);
    }

    .col-count {
      font-family: 'IBM Plex Mono';
      font-size: 15px;
      font-weight: 600;
      background: rgba(179,27,47,0.2);
      color: var(--blood-bright);
      padding: 3px 12px;
      border-radius: 999px;
      min-width: 32px;
      text-align: center;
      box-shadow: inset 0 0 8px rgba(179,27,47,0.15);
    }

    .col-new .col-count {
      background: rgba(179,27,47,0.25);
      color: #ff8a96;
    }

    .col-ready .col-head {
      border-bottom-color: rgba(111,158,90,0.5);
    }
    .col-ready .col-count {
      background: rgba(111,158,90,0.2);
      color: var(--green-glow);
    }

    .rail {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: none;
    }

    .rail::-webkit-scrollbar { display: none; }

    .empty-state {
      margin-top: 40px;
      text-align: center;
      color: #6e6154;
      font-family: 'Inter';
      font-size: 14px;
      padding: 0 20px;
    }

    .empty-state .glyph {
      font-size: 34px;
      display: block;
      margin-bottom: 10px;
      opacity: 0.4;
      color: var(--blood-bright);
    }

    /* ===== TICKET — Butcher Shop style ===== */
    .ticket {
      position: relative;
      background: var(--paper);
      color: var(--ink);
      border-radius: 3px 3px 0 0;
      padding: 16px 18px 22px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5), 0 2px 0 rgba(0,0,0,0.2);
      transform: rotate(var(--tilt, -0.3deg));
      animation: drop-in 0.4s cubic-bezier(.2,.8,.3,1);
      border-left: 4px solid var(--blood);
    }

    .ticket:nth-child(3n+1) { --tilt: -0.7deg; border-left-width: 5px; }
    .ticket:nth-child(3n+2) { --tilt: 0.4deg; }
    .ticket:nth-child(3n) { --tilt: -0.2deg; }

    @keyframes drop-in {
      from { opacity: 0; transform: translateY(-16px) rotate(var(--tilt,0)); }
      to { opacity: 1; transform: translateY(0) rotate(var(--tilt,0)); }
    }

    /* torn paper edge */
    .ticket::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -10px;
      height: 14px;
      background:
        linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0/10px 10px repeat-x,
        linear-gradient(-135deg, var(--paper) 50%, transparent 50%) 0 0/10px 10px repeat-x;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
    }

    /* brass clip */
    .clip {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 16px;
      border-radius: 3px;
      background: linear-gradient(180deg, #e3c073, var(--brass-dim));
      box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .clip::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%);
      width: 3px;
      height: 9px;
      background: var(--brass-dim);
    }

    .ticket-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .order-num {
      font-family: 'Oswald';
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--blood);
    }

    .channel-badge {
      font-family: 'IBM Plex Mono';
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1.5px solid var(--ink);
      color: var(--ink);
      transform: rotate(2deg);
      white-space: nowrap;
      background: rgba(255,255,255,0.15);
    }

    .channel-badge.kiosk { border-color: #7a6342; color: #7a6342; }
    .channel-badge.web { border-color: #2a5f6b; color: #2a5f6b; }
    .channel-badge.whatsapp { border-color: #2a6b3c; color: #2a6b3c; }

    .customer {
      font-family: 'Inter';
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .customer .sub {
      font-weight: 400;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .items {
      list-style: none;
      margin: 0 0 14px;
      padding: 0;
      border-top: 1px dashed rgba(36,28,21,0.25);
      padding-top: 8px;
    }

    .items li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      padding: 3px 0;
      color: var(--ink);
    }

    .items li .qty {
      font-family: 'IBM Plex Mono';
      font-weight: 600;
      color: var(--blood);
      min-width: 24px;
    }

    .items li .name { flex: 1; }

    .ticket-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timer {
      font-family: 'IBM Plex Mono';
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 6px;
    }

    .timer.calm { background: rgba(111,158,90,0.12); color: #3d6b2c; }
    .timer.warn { background: rgba(217,142,43,0.15); color: #9e6b1a; }
    .timer.hot {
      background: rgba(179,27,47,0.18);
      color: var(--blood);
      animation: hot-pulse 1.2s infinite;
    }

    @keyframes hot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .action-tag {
      font-family: 'Oswald';
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
    }

    /* ready column special */
    .col-ready .ticket {
      box-shadow: 0 10px 30px rgba(111,158,90,0.2), 0 2px 0 rgba(0,0,0,0.2);
      border-left-color: var(--green);
    }

    .col-ready .ticket .order-num { color: #3d6b2c; }

    /* VVIP glow */
    .ticket.vvip-ticket {
      border-left: 6px solid #ffd700;
      box-shadow: 0 0 30px rgba(255,215,0,0.2), 0 12px 28px rgba(0,0,0,0.5);
    }

    .ticket.vvip-ticket .order-num::after {
      content: " 👑 VVIP";
      font-size: 14px;
      color: #ffd700;
      margin-left: 6px;
    }

    /* ===== FOOTER TICKER ===== */
    footer {
      height: 56px;
      flex-shrink: 0;
      background: #0f0b09;
      border-top: 2px solid rgba(179,27,47,0.25);
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.4);
    }

    footer .label {
      font-family: 'Oswald';
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--brass);
      background: rgba(179,27,47,0.12);
      padding: 0 20px;
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      z-index: 2;
      border-right: 2px solid rgba(179,27,47,0.2);
      gap: 8px;
    }

    footer .label i {
      color: var(--green-glow);
    }

    .ticker-track {
      display: flex;
      gap: 44px;
      white-space: nowrap;
      animation: scroll-left 28s linear infinite;
      padding-left: 100%;
      align-items: center;
      font-family: 'IBM Plex Mono';
      font-size: 13px;
      color: #d6cdc2;
    }

    .ticker-track span.tag { color: var(--green-glow); margin-right: 6px; }

    @keyframes scroll-left {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    footer .empty-ticker {
      padding-left: 24px;
      color: #6e6154;
      font-family: 'Inter';
      font-size: 13px;
    }

    /* responsive */
    @media (max-width: 1100px) {
      .board { grid-template-columns: 1fr; }
      .column { border-right: none; border-bottom: 1px solid rgba(179,27,47,0.15); }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo-slot">
        <img src="../assets/images/rands-logo.png" alt="Rands" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>R</span>'">
      </div>
      <div class="brand-text">
        <div class="eyebrow">Rands · VVIP Lounge</div>
        <h1>Rands <span>VVIP Lounge</span></h1>
      </div>
    </div>
    <div class="header-right">
      <div class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">Connecting…</span></div>
      <div class="clock">
        <div class="time" id="clockTime">--:--:--</div>
        <div class="date" id="clockDate">—</div>
      </div>
    </div>
  </header>

  <div id="vvipView" style="flex:1; min-height:0; display:flex; flex-direction:column;">
    <div class="board">
      <section class="column col-new">
        <div class="col-head">
          <h2><i class="fas fa-calendar-check rail-icon"></i>Expected</h2>
          <span class="col-count" id="countExpected">0</span>
        </div>
        <div class="rail" id="railExpected"></div>
      </section>

      <section class="column col-prep">
        <div class="col-head">
          <h2><i class="fas fa-door-open rail-icon"></i>Checked In</h2>
          <span class="col-count" id="countCheckedIn">0</span>
        </div>
        <div class="rail" id="railCheckedIn"></div>
      </section>

      <section class="column col-ready">
        <div class="col-head">
          <h2><i class="fas fa-champagne-glasses rail-icon"></i>Seated / Active Tab</h2>
          <span class="col-count" id="countSeated">0</span>
        </div>
        <div class="rail" id="railSeated"></div>
      </section>
    </div>

    <footer>
      <div class="label"><i class="fas fa-check-circle"></i> Closed Tabs</div>
      <div id="vvipTickerWrap" style="flex:1; overflow:hidden;">
        <div class="empty-ticker" id="vvipEmptyTicker">No tabs closed yet today.</div>
        <div class="ticker-track" id="vvipTickerTrack" style="display:none;"></div>
      </div>
    </footer>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://odpugxrihfspaucsdqjj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_fCsjtPGF2zFngK_5DiUKag_tkJk_xo2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const TIMEZONE = 'Africa/Johannesburg';

  // ---- Clock ----
  function tickClock(){
    const now = new Date();
    document.getElementById('clockTime').textContent = now.toLocaleTimeString('en-ZA', { timeZone: TIMEZONE, hour12: false });
    document.getElementById('clockDate').textContent = now.toLocaleDateString('en-ZA', { timeZone: TIMEZONE, weekday: 'long', day: 'numeric', month: 'long' });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ---- Connection status ----
  function setStatus(online){
    const pill = document.getElementById('statusPill');
    const text = document.getElementById('statusText');
    if(online){
      pill.classList.remove('offline');
      text.textContent = 'Live';
    } else {
      pill.classList.add('offline');
      text.textContent = 'Reconnecting…';
    }
  }

  // ---- Helpers ----
  function elapsedMinutes(fromMs){
    return Math.max(0, Math.floor((Date.now() - fromMs) / 60000));
  }

  function formatElapsed(mins){
    if(mins < 1) return 'just now';
    if(mins === 1) return '1 min';
    return `${mins} min`;
  }

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ==================================================================
  // VVIP TABLES VIEW
  // Reads/writes public.vvip_bookings + public.vvip_tables directly.
  // Both tables currently have RLS disabled, so the same anon key this
  // board already uses for `orders` can read and update them too — no
  // extra credentials needed.
  //
  // NOTE: live tab-spend totals are NOT shown here. That data lives in
  // vvip_tab_transactions, which DOES have RLS enabled with a
  // staff-only policy (is_staff_or_admin(auth.uid())) — the anon key
  // this board runs on doesn't pass that check, so a spend query would
  // silently come back empty rather than error. Showing "R0.00 spent"
  // when the real number isn't zero would be worse than not showing it.
  // If you want live tab totals on this board, that needs either a
  // deliberate anon-read policy on vvip_tab_transactions, or this board
  // switching to an authenticated staff login.
  // ==================================================================

  let VVIP_BOOKINGS = [];
  let VVIP_TABLES_MAP = {};

  async function loadVvipTables(){
    const { data, error } = await supabase.from('vvip_tables').select('*');
    if (error) { console.error('VVIP tables fetch error', error); return; }
    VVIP_TABLES_MAP = {};
    (data || []).forEach(t => { VVIP_TABLES_MAP[t.id] = t; });
  }

  async function fetchVvipBookings(){
    const { data, error } = await supabase
      .from('vvip_bookings')
      .select('*')
      .in('status', ['confirmed', 'checked_in', 'seated', 'completed'])
      .order('created_at', { ascending: false })
      .limit(150);

    if (error){
      console.error('VVIP bookings fetch error', error);
      setStatus(false);
      return;
    }
    setStatus(true);
    VVIP_BOOKINGS = data || [];
    renderVvip();
  }

  function vvipCardHtml(b, opts){
    const table = VVIP_TABLES_MAP[b.table_id];
    const tableLabel = table ? table.table_number : 'No table assigned';
    const mins = elapsedMinutes(opts.timeBasis(b));

    return `
      <div class="ticket vvip-ticket" data-booking-id="${b.id}">
        <div class="clip"></div>
        <div class="ticket-top">
          <div class="order-num">${escapeHtml(tableLabel)}</div>
          <div class="channel-badge web">${escapeHtml(b.booking_reference || '—')}</div>
        </div>
        <div class="customer">${escapeHtml(b.customer_name || 'Guest')}
          <span class="sub">${b.customer_phone ? '· ' + escapeHtml(b.customer_phone) : ''}</span>
        </div>
        <div class="vvip-package">R${Number(b.total_amount || 0).toFixed(2)} package${table ? ' · ' + table.capacity + ' seats' : ''}</div>
        <div class="ticket-foot">
          <div class="timer ${opts.timerClass || 'calm'}"><i class="fas fa-clock"></i> ${formatElapsed(mins)}</div>
          ${opts.actionHtml(b)}
        </div>
      </div>
    `;
  }

  function renderVvipRail(elId, list, opts){
    const el = document.getElementById(elId);
    if (list.length === 0){
      el.innerHTML = `<div class="empty-state"><i class="fas ${opts.emptyIcon} glyph"></i>${opts.emptyText}</div>`;
      return;
    }
    const sorted = [...list].sort((a,b) => opts.timeBasis(a) - opts.timeBasis(b));
    el.innerHTML = sorted.map(b => vvipCardHtml(b, opts)).join('');
  }

  function renderVvipTicker(completed){
    const track = document.getElementById('vvipTickerTrack');
    const empty = document.getElementById('vvipEmptyTicker');
    if (completed.length === 0){
      track.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    track.style.display = 'flex';
    track.innerHTML = completed.map(b => {
      const table = VVIP_TABLES_MAP[b.table_id];
      return `<div><span class="tag"><i class="fas fa-check-circle"></i></span>${escapeHtml(table ? table.table_number : 'Table —')} — ${escapeHtml(b.customer_name || 'Guest')}</div>`;
    }).join('');
  }

  function renderVvip(){
    const expected = VVIP_BOOKINGS.filter(b => b.status === 'confirmed');
    const checkedIn = VVIP_BOOKINGS.filter(b => b.status === 'checked_in');
    const seated = VVIP_BOOKINGS.filter(b => b.status === 'seated');
    const completed = VVIP_BOOKINGS.filter(b => b.status === 'completed')
      .sort((a,b) => new Date(b.completed_time || b.updated_at) - new Date(a.completed_time || a.updated_at))
      .slice(0, 12);

    document.getElementById('countExpected').textContent = expected.length;
    document.getElementById('countCheckedIn').textContent = checkedIn.length;
    document.getElementById('countSeated').textContent = seated.length;

    renderVvipRail('railExpected', expected, {
      timeBasis: b => new Date(b.created_at).getTime(),
      emptyIcon: 'fa-calendar-check',
      emptyText: 'No VVIP guests expected.',
      actionHtml: b => `<button class="vvip-action-btn" onclick="vvipCheckIn('${b.id}')">Check In</button>`
    });

    renderVvipRail('railCheckedIn', checkedIn, {
      timeBasis: b => new Date(b.check_in_time || b.created_at).getTime(),
      emptyIcon: 'fa-door-open',
      emptyText: 'No one checked in yet.',
      actionHtml: b => `<button class="vvip-action-btn" onclick="vvipSeat('${b.id}')">Seat at Table</button>`
    });

    renderVvipRail('railSeated', seated, {
      timeBasis: b => new Date(b.seated_time || b.check_in_time || b.created_at).getTime(),
      emptyIcon: 'fa-champagne-glasses',
      emptyText: 'No active tables right now.',
      actionHtml: b => `<button class="vvip-action-btn gold" onclick="vvipClose('${b.id}')">Close Tab</button>`
    });

    renderVvipTicker(completed);
  }

  window.vvipCheckIn = async function(id){
    const { error } = await supabase.from('vvip_bookings')
      .update({ status: 'checked_in', check_in_time: new Date().toISOString() })
      .eq('id', id);
    if (error) { console.error('Check-in failed', error); return; }
    fetchVvipBookings();
  };

  window.vvipSeat = async function(id){
    const { error } = await supabase.from('vvip_bookings')
      .update({ status: 'seated', seated_time: new Date().toISOString() })
      .eq('id', id);
    if (error) { console.error('Seat failed', error); return; }
    fetchVvipBookings();
  };

  window.vvipClose = async function(id){
    const { error } = await supabase.from('vvip_bookings')
      .update({ status: 'completed', completed_time: new Date().toISOString() })
      .eq('id', id);
    if (error) { console.error('Close tab failed', error); return; }
    fetchVvipBookings();
  };

  async function init(){
    await loadVvipTables();
    await fetchVvipBookings();
  }
  init();

  const vvipChannel = supabase
    .channel('vvip-bookings-feed')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_bookings' }, () => {
      fetchVvipBookings();
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') { setStatus(true); }
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') { setStatus(false); }
    });

  setInterval(fetchVvipBookings, 15000);
</script>
</body>
</html>
