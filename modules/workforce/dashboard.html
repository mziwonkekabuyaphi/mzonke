<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Workforce Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        :root {
            --bg-primary: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-light: #e2e8f0;
            --green-500: #10b981;
            --green-600: #059669;
            --green-100: #d1fae5;
            --red-500: #ef4444;
            --orange-500: #f97316;
            --neutral-200: #e2e8f0;
        }
        body { background: var(--bg-primary); color: var(--text-primary); }
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--card-bg); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; padding: 1.5rem 1rem; }
        .sidebar-brand { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border-light); margin-bottom: 1.5rem; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
        .nav-item { padding: 0.75rem 1rem; border-radius: 0.75rem; color: var(--text-secondary); text-decoration: none; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--green-100); color: #047857; }
        .admin-main { flex: 1; padding: 2rem; overflow-y: auto; }
        .admin-section { display: none; animation: fade 0.2s ease; }
        .admin-section.active { display: block; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .card { background: var(--card-bg); border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.8rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid var(--border-light); }
        .form-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; align-items: flex-end; }
        .form-group { flex: 1; min-width: 120px; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.25rem; }
        input, button { border-radius: 2rem; border: 1px solid var(--border-light); padding: 0.7rem 1.2rem; font-size: 0.95rem; }
        input:focus { outline: none; border-color: var(--green-500); }
        .btn-primary { background: var(--green-500); color: white; border: none; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background: var(--green-600); }
        .btn-secondary { background: var(--neutral-200); border: none; cursor: pointer; }
        .btn-csv { background: #3b82f6; color: white; margin-left: 1rem; }
        .staff-table { width: 100%; border-collapse: collapse; }
        .staff-table th, .staff-table td { text-align: left; padding: 1rem 0.5rem; border-bottom: 1px solid var(--border-light); }
        .badge-working { background: var(--green-100); color: #047857; padding: 0.2rem 0.8rem; border-radius: 2rem; font-size: 0.8rem; font-weight: 600; display: inline-block; }
        .badge-idle { background: #f1f5f9; color: #475569; padding: 0.2rem 0.8rem; border-radius: 2rem; }
        .btn-icon-danger { background: transparent; color: var(--red-500); border: 1px solid var(--red-500); padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border-radius: 2rem; margin-right: 0.5rem; }
        .btn-force-clockout { background: transparent; color: var(--orange-500); border: 1px solid var(--orange-500); padding: 0.3rem 0.8rem; font-size: 0.75rem; cursor: pointer; border-radius: 2rem; }
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--card-bg); padding: 1.2rem; border-radius: 1.2rem; text-align: center; border: 1px solid var(--border-light); }
        .stat-card h3 { font-size: 0.9rem; color: var(--text-secondary); }
        .stat-card p { font-size: 2rem; font-weight: 700; margin-top: 0.5rem; }
        .payroll-list { margin-top: 1rem; }
        .payroll-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border-light); }
        .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; display: flex; flex-direction: column; gap: 0.6rem; }
        .toast { background: #1e293b; color: white; padding: 0.75rem 1.2rem; border-radius: 2rem; font-size: 0.85rem; animation: slideIn 0.2s ease; }
        .toast-success { background: var(--green-600); }
        .toast-error { background: var(--red-500); }
        .toast-info { background: #3b82f6; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        .pin-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(4px); }
        .pin-card { background: white; border-radius: 2rem; padding: 2rem; width: 300px; text-align: center; }
        .pin-card input { text-align: center; letter-spacing: 6px; font-size: 1.5rem; margin: 1rem 0; }
        .loading { text-align: center; padding: 2rem; color: var(--text-secondary); }
        @media (max-width: 680px) {
            .admin-layout { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 0.5rem; padding: 0.8rem; }
            .sidebar-brand { display: none; }
            .sidebar-nav { flex-direction: row; }
            .admin-main { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div id="adminAppRoot"><div class="loading">Loading...</div></div>
    <div id="toastContainer" class="toast-container"></div>

    <script type="module">
        import { supabase } from '../../config/supabase.js';

        let currentAdmin = null;
        let tenantId = null;
        let currentSection = 'staffSection';

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]); }

        async function authenticateAdmin(pin) {
            const { data, error } = await supabase
                .from('staff')
                .select('id, name, tenant_id, role')
                .eq('pin', pin)
                .in('role', ['tenant_admin', 'super_admin'])
                .maybeSingle();

            if (error || !data) {
                showToast('Invalid admin PIN', 'error');
                return false;
            }
            currentAdmin = data;
            tenantId = data.tenant_id;
            renderAdminDashboard();
            return true;
        }

        async function loadStaffList() {
            const { data, error } = await supabase
                .from('staff')
                .select('id, name, pin, hourly_rate, status, role')
                .eq('tenant_id', tenantId)
                .order('name');
            if (error) return [];
            const { data: activeShifts } = await supabase
                .from('staff_shifts')
                .select('staff_id')
                .eq('shift_status', 'active')
                .eq('tenant_id', tenantId);
            const activeStaffIds = new Set(activeShifts?.map(s => s.staff_id) || []);
            return data.map(s => ({ ...s, isWorking: activeStaffIds.has(s.id) }));
        }

        async function addStaff(name, pin, hourlyRate) {
            const { error } = await supabase
                .from('staff')
                .insert({
                    name, pin, hourly_rate: parseFloat(hourlyRate),
                    tenant_id: tenantId, role: 'staff', status: 'Active'
                });
            if (error) throw error;
        }

        async function deleteStaff(staffId) {
            const { data: active } = await supabase
                .from('staff_shifts')
                .select('id')
                .eq('staff_id', staffId)
                .eq('shift_status', 'active')
                .maybeSingle();
            if (active) throw new Error('Staff has an active shift. Force clock out first.');
            const { error } = await supabase.from('staff').delete().eq('id', staffId);
            if (error) throw error;
        }

        async function forceClockOut(staffId) {
            const { data: shift } = await supabase
                .from('staff_shifts')
                .select('id')
                .eq('staff_id', staffId)
                .eq('shift_status', 'active')
                .maybeSingle();
            if (!shift) throw new Error('No active shift found');
            const { error } = await supabase
                .from('staff_shifts')
                .update({ end_time: new Date().toISOString(), shift_status: 'forced' })
                .eq('id', shift.id);
            if (error) throw error;
        }

        async function loadShiftHistory() {
            const { data, error } = await supabase
                .from('staff_shifts')
                .select(`id, start_time, end_time, total_hours, staff_id, staff:staff_id(name)`)
                .eq('tenant_id', tenantId)
                .order('start_time', { ascending: false });
            if (error) return [];
            return data.map(s => ({ ...s, staffName: s.staff?.name || 'Unknown' }));
        }

        async function getWeeklyPayroll() {
            const startOfWeek = new Date();
            startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
            startOfWeek.setHours(0,0,0,0);
            const { data, error } = await supabase
                .from('staff_shifts')
                .select(`staff_id, total_hours, staff:staff_id(name, hourly_rate)`)
                .eq('shift_status', 'completed')
                .eq('tenant_id', tenantId)
                .gte('end_time', startOfWeek.toISOString());
            if (error) return [];
            const map = new Map();
            for (const shift of data) {
                const staffId = shift.staff_id;
                const name = shift.staff?.name;
                const rate = shift.staff?.hourly_rate || 0;
                const hours = shift.total_hours || 0;
                if (!map.has(staffId)) map.set(staffId, { name, hours: 0, rate });
                map.get(staffId).hours += hours;
            }
            return Array.from(map.values()).map(s => ({ ...s, earnings: s.hours * s.rate }));
        }

        async function updateAnalyticsUI() {
            const staff = await loadStaffList();
            document.getElementById('totalStaffCount').innerText = staff.length;
            document.getElementById('activeStaffCount').innerText = staff.filter(s => s.isWorking).length;

            const { data: allShifts } = await supabase
                .from('staff_shifts')
                .select('total_hours')
                .eq('tenant_id', tenantId)
                .eq('shift_status', 'completed');
            const totalHoursAll = allShifts?.reduce((s, i) => s + (i.total_hours || 0), 0) || 0;
            document.getElementById('totalHoursAll').innerText = totalHoursAll.toFixed(1) + 'h';

            const startOfWeek = new Date();
            startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
            startOfWeek.setHours(0,0,0,0);
            const { data: weeklyShifts } = await supabase
                .from('staff_shifts')
                .select('total_hours')
                .eq('tenant_id', tenantId)
                .eq('shift_status', 'completed')
                .gte('end_time', startOfWeek.toISOString());
            const weeklyHours = weeklyShifts?.reduce((s, i) => s + (i.total_hours || 0), 0) || 0;
            document.getElementById('weeklyHours').innerText = weeklyHours.toFixed(1) + 'h';

            const payrollItems = await getWeeklyPayroll();
            const payrollDiv = document.getElementById('payrollList');
            if (payrollItems.length === 0) {
                payrollDiv.innerHTML = '<div class="payroll-item">No completed shifts this week.</div>';
                document.getElementById('totalWeeklyPayroll').innerText = 'R0.00';
            } else {
                let total = 0;
                payrollDiv.innerHTML = payrollItems.map(item => {
                    total += item.earnings;
                    return `<div class="payroll-item"><span><strong>${escapeHtml(item.name)}</strong> (R${item.rate.toFixed(2)}/hr)</span><span>${item.hours.toFixed(1)} hrs → R${item.earnings.toFixed(2)}</span></div>`;
                }).join('');
                document.getElementById('totalWeeklyPayroll').innerText = `R${total.toFixed(2)}`;
            }
        }

        async function renderStaffTable() {
            const staff = await loadStaffList();
            const tbody = document.getElementById('staffTableBody');
            if (!tbody) return;
            if (staff.length === 0) { tbody.innerHTML = '<tr><td colspan="7">No staff members. Create one.</td></tr>'; return; }
            tbody.innerHTML = staff.map(s => `
                <tr>
                    <td>${escapeHtml(s.name)}</td><td>****</td><td>R${(s.hourly_rate || 0).toFixed(2)}</td>
                    <td>${s.isWorking ? '<span class="badge-working">🟢 On Shift</span>' : '<span class="badge-idle">⚪ Off Duty</span>'}</td>
                    <td>${s.role === 'staff' ? 'Staff' : s.role}</td>
                    <td>${s.isWorking ? '<span class="badge-working">✓ Working</span>' : '—'}</td>
                    <td>
                        ${s.isWorking ? `<button class="btn-force-clockout" data-id="${s.id}">⏹️ Force Out</button>` : ''}
                        <button class="btn-icon-danger" data-id="${s.id}">Delete</button>
                    </td>
                </td>
            `).join('');
            document.querySelectorAll('.btn-force-clockout').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.getAttribute('data-id');
                    if (confirm('Force clock out this staff?')) {
                        try { await forceClockOut(id); showToast('Staff forced out', 'success'); await refreshCurrentSection(); }
                        catch (err) { showToast(err.message, 'error'); }
                    }
                });
            });
            document.querySelectorAll('.btn-icon-danger').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.getAttribute('data-id');
                    if (confirm('Delete staff? Shift history remains.')) {
                        try { await deleteStaff(id); showToast('Staff deleted', 'success'); await refreshCurrentSection(); }
                        catch (err) { showToast(err.message, 'error'); }
                    }
                });
            });
        }

        async function renderShiftHistory() {
            const shifts = await loadShiftHistory();
            const tbody = document.getElementById('historyTableBody');
            if (!tbody) return;
            if (shifts.length === 0) { tbody.innerHTML = '<tr><td colspan="5">No shifts recorded</td></tr>'; return; }
            tbody.innerHTML = shifts.map(shift => {
                const date = new Date(shift.start_time).toLocaleDateString();
                const cin = new Date(shift.start_time).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
                const cout = shift.end_time ? new Date(shift.end_time).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '—';
                const dur = shift.total_hours ? `${shift.total_hours.toFixed(1)} hrs` : 'In progress';
                return `<tr><td>${escapeHtml(shift.staffName)}</td><td>${date}</td><td>${cin}</td><td>${cout}</td><td>${dur}</td></tr>`;
            }).join('');
        }

        async function refreshCurrentSection() {
            if (currentSection === 'staffSection') await renderStaffTable();
            else if (currentSection === 'shiftsSection') await renderShiftHistory();
            else if (currentSection === 'analyticsSection') await updateAnalyticsUI();
        }

        async function handleCreateStaff() {
            const name = document.getElementById('staffName').value.trim();
            const pin = document.getElementById('staffPin').value.trim();
            const rate = parseFloat(document.getElementById('staffRate').value);
            if (!name || !/^\d{4}$/.test(pin)) { showToast('Name and 4-digit PIN required', 'error'); return; }
            if (isNaN(rate) || rate < 0) { showToast('Valid hourly rate required', 'error'); return; }
            try {
                await addStaff(name, pin, rate);
                showToast(`Staff ${name} added`, 'success');
                document.getElementById('staffName').value = '';
                document.getElementById('staffPin').value = '';
                document.getElementById('staffRate').value = '';
                await renderStaffTable();
                await updateAnalyticsUI();
            } catch (err) { showToast('Error: ' + err.message, 'error'); }
        }

        async function exportWeeklyPayrollCSV() {
            const payroll = await getWeeklyPayroll();
            const rows = [['Staff Name', 'Hours Worked', 'Hourly Rate (R)', 'Total Earnings (R)']];
            let total = 0;
            for (const item of payroll) {
                rows.push([item.name, item.hours.toFixed(2), item.rate.toFixed(2), item.earnings.toFixed(2)]);
                total += item.earnings;
            }
            rows.push(['TOTAL', '', '', total.toFixed(2)]);
            const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `payroll_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('CSV exported', 'success');
        }
