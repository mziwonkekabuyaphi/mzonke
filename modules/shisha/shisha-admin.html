<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Shisha Lounge | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafd;
            padding: 20px;
            color: #1e293b;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #E30613, #B5040F);
            border-radius: 28px;
            padding: 20px 30px;
            color: white;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-size: 1.6rem; font-weight: 800; }
        .header p { opacity: 0.8; margin-top: 4px; }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .stats-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            flex: 1;
            min-width: 140px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eef2f8;
        }
        .stat-number { font-size: 28px; font-weight: 800; color: #E30613; }
        .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
        .tabs {
            display: flex;
            gap: 8px;
            background: white;
            padding: 6px;
            border-radius: 60px;
            margin-bottom: 24px;
            border: 1px solid #eef2f8;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 60px;
            border: none;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #E30613;
            color: white;
            box-shadow: 0 2px 6px rgba(227,6,19,0.2);
        }
        .panel {
            display: none;
            background: white;
            border-radius: 28px;
            padding: 24px;
            border: 1px solid #eef2f8;
            margin-bottom: 24px;
        }
        .panel.active { display: block; }
        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f172a;
        }
        .add-form {
            background: #f8fafc;
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .add-form input, .add-form select {
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            font-family: inherit;
            flex: 1;
            min-width: 150px;
        }
        .add-form button {
            background: #E30613;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .item-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info .name { font-weight: 700; margin-bottom: 4px; }
        .item-info .meta { font-size: 12px; color: #64748b; }
        .item-actions button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            margin-left: 8px;
            color: #94a3b8;
        }
        .item-actions button.danger { color: #E30613; }
        .device-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 8px;
        }
        .status-available { background: #dcfce7; color: #166534; }
        .status-active { background: #fee2e2; color: #991b1b; }
        .status-maintenance { background: #fef9c3; color: #854d0e; }
        .status-deleted { background: #e2e8f0; color: #475569; text-decoration: line-through; }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 500;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1><i class="fas fa-smoking"></i> Shisha Lounge Admin</h1>
            <p>Manage flavours, hookahs, locations</p>
        </div>
        <button class="back-btn" onclick="window.location.href='home.html'"><i class="fas fa-arrow-left"></i> Back</button>
    </div>

    <div class="stats-row" id="statsRow">
        <div class="stat-card"><div class="stat-number" id="flavourCount">-</div><div class="stat-label">Flavours</div></div>
        <div class="stat-card"><div class="stat-number" id="deviceCount">-</div><div class="stat-label">Hookahs</div></div>
        <div class="stat-card"><div class="stat-number" id="locationCount">-</div><div class="stat-label">Locations</div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="flavours">🍃 Flavours</button>
        <button class="tab-btn" data-tab="devices">🔥 Hookah Devices</button>
        <button class="tab-btn" data-tab="locations">📍 Locations</button>
        <button class="tab-btn" data-tab="sessions">⏱️ Active Sessions</button>
    </div>

    <!-- FLAVOURS PANEL -->
    <div id="flavoursPanel" class="panel active">
        <div class="section-title"><i class="fas fa-leaf"></i> Shisha Flavours</div>
        <div class="add-form">
            <input type="text" id="newFlavourName" placeholder="Flavour name (e.g., Double Apple)">
            <input type="number" id="newFlavourPrice" placeholder="Price (R)" value="250" step="10">
            <button id="addFlavourBtn"><i class="fas fa-plus"></i> Add Flavour</button>
        </div>
        <div id="flavoursList" class="items-grid">Loading...</div>
    </div>

    <!-- DEVICES PANEL -->
    <div id="devicesPanel" class="panel">
        <div class="section-title"><i class="fas fa-fire"></i> Hookah Devices</div>
        <div class="add-form">
            <input type="text" id="newDeviceCode" placeholder="Device code (e.g., SH-031)">
            <select id="newDeviceStatus">
                <option value="available">Available</option>
                <option value="maintenance">Maintenance</option>
            </select>
            <button id="addDeviceBtn"><i class="fas fa-plus"></i> Add Custom Device</button>
        </div>
        <div id="devicesList" class="items-grid">Loading...</div>
    </div>

    <!-- LOCATIONS PANEL -->
    <div id="locationsPanel" class="panel">
        <div class="section-title"><i class="fas fa-map-marker-alt"></i> Lounge Locations</div>
        <div class="add-form">
            <input type="text" id="newLocationName" placeholder="Location name (e.g., VIP Terrace)">
            <button id="addLocationBtn"><i class="fas fa-plus"></i> Add Location</button>
        </div>
        <div id="locationsList" class="items-grid">Loading...</div>
    </div>

    <!-- SESSIONS PANEL (read-only) -->
    <div id="sessionsPanel" class="panel">
        <div class="section-title"><i class="fas fa-hourglass-half"></i> Active Shisha Sessions</div>
        <div id="sessionsList" style="overflow-x: auto;">Loading...</div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../../config/supabase.js';

    // Helper toast
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#b91c1c' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // ========== FLAVOURS ==========
    async function loadFlavours() {
        const { data, error } = await supabase.from('shisha_products').select('*').order('name');
        if (error) { console.error(error); return; }
        const container = document.getElementById('flavoursList');
        if (!data.length) { container.innerHTML = '<div class="empty">No flavours. Add one above.</div>'; return; }
        container.innerHTML = data.map(p => `
            <div class="item-card" data-id="${p.id}">
                <div class="item-info">
                    <div class="name">${escapeHtml(p.name)}</div>
                    <div class="meta">R${p.price} • ${p.is_available ? 'Available' : 'Hidden'}</div>
                </div>
                <div class="item-actions">
                    <button class="toggle-availability" data-id="${p.id}" data-avail="${p.is_available}"><i class="fas ${p.is_available ? 'fa-eye-slash' : 'fa-eye'}"></i></button>
                    <button class="delete-flavour danger" data-id="${p.id}"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
        `).join('');
        // attach events
        document.querySelectorAll('.toggle-availability').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = btn.dataset.id;
                const current = btn.dataset.avail === 'true';
                const { error } = await supabase.from('shisha_products').update({ is_available: !current }).eq('id', id);
                if (error) showToast(error.message, true);
                else { loadFlavours(); showToast('Updated'); }
            });
        });
        document.querySelectorAll('.delete-flavour').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                if (!confirm('Delete this flavour? This will not delete sessions, but may break old records.')) return;
                const id = btn.dataset.id;
                const { error } = await supabase.from('shisha_products').delete().eq('id', id);
                if (error) showToast(error.message, true);
                else { loadFlavours(); showToast('Deleted'); }
            });
        });
        document.getElementById('flavourCount').innerText = data.length;
    }

    document.getElementById('addFlavourBtn').onclick = async () => {
        const name = document.getElementById('newFlavourName').value.trim();
        const price = parseFloat(document.getElementById('newFlavourPrice').value);
        if (!name || isNaN(price)) { showToast('Enter name and price', true); return; }
        const { error } = await supabase.from('shisha_products').insert({ name, price, is_available: true });
        if (error) showToast(error.message, true);
        else {
            document.getElementById('newFlavourName').value = '';
            document.getElementById('newFlavourPrice').value = '250';
            loadFlavours();
            showToast('Flavour added');
        }
    };

    // ========== DEVICES ==========
    async function loadDevices() {
        const { data, error } = await supabase.from('hookah_devices').select('*').order('device_code');
        if (error) { console.error(error); return; }
        const container = document.getElementById('devicesList');
        if (!data.length) { container.innerHTML = '<div class="empty">No devices.</div>'; return; }
        container.innerHTML = data.map(d => `
            <div class="item-card" data-id="${d.id}">
                <div class="item-info">
                    <div class="name">${escapeHtml(d.device_code)} ${d.device_name ? `(${escapeHtml(d.device_name)})` : ''}</div>
                    <div class="meta">
                        <span class="device-status status-${d.status === 'available' ? 'available' : (d.status === 'active' ? 'active' : (d.status === 'maintenance' ? 'maintenance' : 'deleted'))}">${d.status}</span>
                    </div>
                </div>
                <div class="item-actions">
                    <select class="status-select" data-id="${d.id}" style="padding:4px 8px; border-radius:30px;">
                        <option value="available" ${d.status === 'available' ? 'selected' : ''}>Available</option>
                        <option value="maintenance" ${d.status === 'maintenance' ? 'selected' : ''}>Maintenance</option>
                        <option value="deleted" ${d.status === 'deleted' ? 'selected' : ''}>Deleted</option>
                    </select>
                    <button class="delete-device danger" data-id="${d.id}"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
        `).join('');
        // attach status change
        document.querySelectorAll('.status-select').forEach(select => {
            select.addEventListener('change', async (e) => {
                const id = select.dataset.id;
                const newStatus = select.value;
                const { error } = await supabase.from('hookah_devices').update({ status: newStatus }).eq('id', id);
                if (error) showToast(error.message, true);
                else { loadDevices(); showToast('Device updated'); }
            });
        });
        document.querySelectorAll('.delete-device').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                if (!confirm('Delete this device? (Soft delete – sets status to deleted)')) return;
                const id = btn.dataset.id;
                const { error } = await supabase.from('hookah_devices').update({ status: 'deleted' }).eq('id', id);
                if (error) showToast(error.message, true);
                else { loadDevices(); showToast('Device marked as deleted'); }
            });
        });
        document.getElementById('deviceCount').innerText = data.length;
    }

    document.getElementById('addDeviceBtn').onclick = async () => {
        let code = document.getElementById('newDeviceCode').value.trim().toUpperCase();
        if (!code) { showToast('Enter device code (e.g., SH-031)', true); return; }
        const status = document.getElementById('newDeviceStatus').value;
        const { error } = await supabase.from('hookah_devices').insert({ device_code: code, status });
        if (error) showToast(error.message, true);
        else {
            document.getElementById('newDeviceCode').value = '';
            loadDevices();
            showToast('Device added');
        }
    };

    // ========== LOCATIONS ==========
    async function loadLocations() {
        const { data, error } = await supabase.from('shisha_locations').select('*').order('name');
        if (error) { console.error(error); return; }
        const container = document.getElementById('locationsList');
        if (!data.length) { container.innerHTML = '<div class="empty">No locations. Add one above.</div>'; return; }
        container.innerHTML = data.map(l => `
            <div class="item-card" data-id="${l.id}">
                <div class="item-info">
                    <div class="name">${escapeHtml(l.name)}</div>
                    <div class="meta">${l.is_active ? 'Active' : 'Inactive'}</div>
                </div>
                <div class="item-actions">
                    <button class="toggle-location" data-id="${l.id}" data-active="${l.is_active}"><i class="fas ${l.is_active ? 'fa-eye-slash' : 'fa-eye'}"></i></button>
                    <button class="delete-location danger" data-id="${l.id}"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.toggle-location').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const id = btn.dataset.id;
                const current = btn.dataset.active === 'true';
                const { error } = await supabase.from('shisha_locations').update({ is_active: !current }).eq('id', id);
                if (error) showToast(error.message, true);
                else { loadLocations(); showToast('Updated'); }
            });
        });
        document.querySelectorAll('.delete-location').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                if (!confirm('Delete this location? Sessions will keep location reference but name may disappear.')) return;
                const id = btn.dataset.id;
                const { error } = await supabase.from('shisha_locations').delete().eq('id', id);
                if (error) showToast(error.message, true);
                else { loadLocations(); showToast('Deleted'); }
            });
        });
        document.getElementById('locationCount').innerText = data.length;
    }

    document.getElementById('addLocationBtn').onclick = async () => {
        const name = document.getElementById('newLocationName').value.trim();
        if (!name) { showToast('Enter location name', true); return; }
        const { error } = await supabase.from('shisha_locations').insert({ name });
        if (error) showToast(error.message, true);
        else {
            document.getElementById('newLocationName').value = '';
            loadLocations();
            showToast('Location added');
        }
    };

    // ========== ACTIVE SESSIONS (read-only) ==========
    async function loadActiveSessions() {
        const { data, error } = await supabase
            .from('shisha_sessions')
            .select(`
                id, shishaId:hookah_devices(device_code), flavour:shisha_products(name),
                location:shisha_locations(name), start_time, remaining_time_seconds, status, paused,
                total_amount, customer_profile_id, customer_phone
            `)
            .in('status', ['active', 'refill', 'paused'])
            .order('start_time', { ascending: false });
        if (error) { console.error(error); return; }
        const container = document.getElementById('sessionsList');
        if (!data.length) { container.innerHTML = '<div class="empty">No active sessions.</div>'; return; }
        // simple table
        let html = '<table style="width:100%; border-collapse:collapse;"><thead><tr style="background:#f1f5f9;"><th>Device</th><th>Flavour</th><th>Location</th><th>Time Left</th><th>Status</th><th>Customer</th><th>Total</th></tr></thead><tbody>';
        data.forEach(s => {
            const mins = Math.floor(s.remaining_time_seconds / 60);
            const secs = s.remaining_time_seconds % 60;
            const timeStr = `${mins}:${secs.toString().padStart(2,'0')}`;
            html += `<tr style="border-bottom:1px solid #e2e8f0;">
                <td style="padding:12px;">${s.shishaId?.device_code || '?'}</td>
                <td>${s.flavour?.name || '?'}</td>
                <td>${s.location?.name || '?'}</td>
                <td>${timeStr}</td>
                <td>${s.paused ? 'Paused' : s.status}</td>
                <td>${s.customer_phone || s.customer_profile_id?.slice(0,8) || '—'}</td>
                <td>R${s.total_amount}</td>
            </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // ========== TAB SWITCHING ==========
    function switchTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`${tabId}Panel`).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
        if (tabId === 'sessions') loadActiveSessions();
        else if (tabId === 'flavours') loadFlavours();
        else if (tabId === 'devices') loadDevices();
        else if (tabId === 'locations') loadLocations();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // ========== INIT ==========
    async function init() {
        // Check if tables exist – show error if not
        try {
            await loadFlavours();
            await loadDevices();
            await loadLocations();
            await loadActiveSessions();
        } catch(e) {
            console.error(e);
            showToast('Supabase tables not ready. Run the shisha migration SQL first.', true);
        }
    }
    init();

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
</script>
</body>
</html>
