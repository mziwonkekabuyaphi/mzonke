<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rands Vibe — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:        #C9A84C;
      --gold-dim:    #A07830;
      --gold-light:  #E8CC80;
      --bg:          #0A0A0B;
      --surface:     #111114;
      --surface-2:   #1A1A1F;
      --border:      rgba(201,168,76,0.18);
      --border-soft: rgba(255,255,255,0.07);
      --text:        #F0EDE6;
      --text-muted:  #7A7870;
      --text-dim:    #3E3D3A;
      --red:         #E05555;
      --radius:      10px;
      --transition:  0.18s ease;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(201,168,76,0.04) 0%, transparent 60%);
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2.5rem 2.25rem 2rem;
    }

    /* ── Logo / Header ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark svg {
      width: 18px;
      height: 18px;
    }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .logo-text span {
      color: var(--gold);
    }

    /* ── Heading ── */
    .heading {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 0.35rem;
      letter-spacing: -0.01em;
    }

    .subheading {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    /* ── Auth Error ── */
    #authError {
      display: none;
      background: rgba(224,85,85,0.1);
      border: 1px solid rgba(224,85,85,0.3);
      color: #F48080;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: var(--radius);
      margin-bottom: 1.25rem;
    }

    #authError.visible {
      display: block;
    }

    /* ── Form ── */
    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 46px;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 0 14px;
      outline: none;
      transition: border-color var(--transition);
      -webkit-appearance: none;
    }

    input[type="password"] {
      padding-right: 44px;
    }

    input:focus {
      border-color: var(--gold-dim);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
    }

    input::placeholder {
      color: var(--text-dim);
    }

    /* ── Password toggle ── */
    #togglePw {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 44px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--text-muted);
      transition: color var(--transition);
    }

    #togglePw:hover { color: var(--text); }

    #togglePw svg {
      width: 16px;
      height: 16px;
      pointer-events: none;
    }

    /* ── Primary button ── */
    .btn-primary {
      width: 100%;
      height: 48px;
      background: var(--gold);
      color: #0A0A0B;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--transition), opacity var(--transition);
      margin-top: 0.5rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary:hover:not(:disabled) { background: var(--gold-light); }
    .btn-primary:active:not(:disabled) { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary.loading::after {
      content: '';
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.25);
      border-top-color: #0A0A0B;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1.5rem 0;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-soft);
    }

    /* ── Alt buttons (Google / Passkey) ── */
    .alt-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alt-btn {
      width: 100%;
      height: 46px;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color var(--transition), background var(--transition);
      padding: 0 16px;
    }

    .alt-btn:hover:not(:disabled) {
      border-color: rgba(255,255,255,0.15);
      background: #1F1F25;
    }

    .alt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .alt-btn-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .alt-btn-label {
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
    }

    /* ── Register link ── */
    .register-row {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .register-row a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
      transition: color var(--transition);
    }

    .register-row a:hover { color: var(--gold-light); }

    /* ── Animations ── */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Responsive ── */
    @media (max-width: 460px) {
      .card { padding: 2rem 1.5rem 1.75rem; border-radius: 14px; }
      .heading { font-size: 21px; }
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-mark">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M9 2L15.5 6V12L9 16L2.5 12V6L9 2Z" stroke="#0A0A0B" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="9" cy="9" r="2.2" fill="#0A0A0B"/>
        </svg>
      </div>
      <span class="logo-text">Rands <span>Vibe</span></span>
    </div>

    <!-- Heading -->
    <h1 class="heading">Welcome back</h1>
    <p class="subheading">Sign in to access your dashboard</p>

    <!-- Error -->
    <div id="authError" role="alert"></div>

    <!-- Email / Password -->
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@randsvibe.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••••" autocomplete="current-password" />
        <button type="button" id="togglePw" aria-label="Toggle password visibility">
          <!-- Eye icon -->
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- Eye-off icon -->
          <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-primary" id="loginBtn" type="button">
      <span id="loginBtnLabel">Sign In</span>
    </button>

    <!-- Divider -->
    <div class="divider">or</div>

    <!-- OAuth / Passkey -->
    <div class="alt-buttons">

      <button class="alt-btn" id="googleBtn" type="button">
        <!-- Google SVG logo -->
        <svg class="alt-btn-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        <span class="alt-btn-label">Continue with Google</span>
      </button>

      <div id="passkeyWrap">
        <button class="alt-btn" id="passkeyBtn" type="button">
          <svg class="alt-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:#C9A84C">
            <circle cx="8" cy="8" r="3.5"/>
            <path d="M14 8h7M17.5 8v4"/>
            <path d="M2 20v-1a5 5 0 0 1 5-5h2"/>
          </svg>
          <span class="alt-btn-label">Sign in with Passkey</span>
        </button>
      </div>

    </div>

    <!-- Register -->
    <p class="register-row">
      Don't have an account? <a href="register.html" id="registerLink">Create one</a>
    </p>

  </div>

  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
