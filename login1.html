<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Rands Vibe Passport · Sign In</title>

    <!-- Dashboard fonts (from login1) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
               LOGIN — Rands Vibe Passport (hybrid)
               Structure from "login (11).html"
               Color/style from "login1 (1).html"
               Border removed, red left‑edge line kept
               Heading: "Rands" on top, "Vibe Passport" below
               ============================================================ */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Design tokens (from login1) ── */
        :root {
            --red: #E30613;
            --red-glow: rgba(227, 6, 19, 0.35);
            --red-dim: rgba(227, 6, 19, 0.12);
            --red-border: rgba(227, 6, 19, 0.25);
            --bg: #09090b;
            --surface: #111114;
            --surface-2: #18181c;
            --surface-3: #1e1e24;
            --border: rgba(255, 255, 255, 0.07);
            --border-bright: rgba(255, 255, 255, 0.13);
            --text: #f4f4f5;
            --text-muted: #71717a;
            --text-dim: #3f3f46;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        html,
        body {
            height: 100%;
            min-height: 100dvh;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }

        /* ── Body: scrollable, centered content ── */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            overflow-y: auto;
            overflow-x: hidden;
            flex-direction: column;
            min-height: 100dvh;
        }

        /* ── Background layers (from login1) ── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(120, 0, 200, 0.25) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(200, 0, 60, 0.18) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 20% 60%, rgba(60, 0, 120, 0.15) 0%, transparent 60%),
                var(--bg);
        }

        .bg-noise {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.4;
        }

        /* ── Install Banner (from login1) ── */
        .login-install-banner {
            display: none;
            width: 100%;
            max-width: 480px;
            margin-bottom: 16px;
            margin-top: 4px;
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.4s var(--ease) both;
            position: relative;
            z-index: 2;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .banner-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .banner-icon {
            font-size: 26px;
            flex-shrink: 0;
        }
        .banner-text {
            flex: 1;
            min-width: 140px;
        }
        .banner-text strong {
            display: block;
            font-size: 0.9rem;
            color: var(--text);
        }
        .banner-text p {
            margin: 2px 0 0;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .banner-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .cta-button {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 7px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            white-space: nowrap;
        }
        .cta-button:hover {
            background: #c8050f;
        }
        .cta-button:active {
            transform: scale(0.96);
        }
        .banner-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 6px;
            transition: color 0.2s;
            line-height: 1;
        }
        .banner-close:hover {
            color: var(--text);
        }

        /* ── Card container ── */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            animation: fadeUp 0.6s var(--ease) both;
            padding: 8px 0;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Glass card (from login1) ── */
        .login-card {
            background: var(--surface);
            /* ✅ border removed — user wanted it gone */
            border: none;
            border-radius: 16px;
            padding: 36px 32px 32px;
            transition: border-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        /* ✅ Red line on the left edge — kept */
        .login-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15%;
            bottom: 15%;
            width: 2px;
            background: linear-gradient(180deg, transparent, var(--red) 50%, transparent);
            border-radius: 99px;
            box-shadow: 0 0 12px var(--red);
            opacity: 0.6;
        }

        /* ── Brand / Heading (from login page: Rands on top, Vibe Passport below) ── */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-mark {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 16px;
            box-shadow: 0 0 30px var(--red-glow);
            transition: box-shadow 0.3s;
            background: var(--surface-3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-mark:hover {
            box-shadow: 0 0 50px var(--red-glow), 0 0 100px rgba(227, 6, 19, 0.2);
        }
        .logo-mark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .logo-mark .fallback-icon {
            color: var(--red);
            font-size: 1.6rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            display: none;
        }
        .logo-mark img:not([src]),
        .logo-mark img[src=""] {
            display: none;
        }
        .logo-mark img:not([src])+.fallback-icon,
        .logo-mark img[src=""]+.fallback-icon {
            display: block;
        }

        /* ── Heading: "Rands" on top, "Vibe Passport" below ── */
        .brand-heading {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            line-height: 1.1;
        }
        .brand-heading .top {
            display: block;
        }
        .brand-heading .bottom {
            display: block;
            color: var(--red);
            text-shadow: 0 0 30px var(--red-glow);
        }

        .brand-sub {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 4px;
            letter-spacing: 0.02em;
        }

        /* ── Form fields (from login1) ── */
        .form-wrap {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 4px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding-left: 2px;
        }

        .input-wrap {
            position: relative;
        }

        .field-input {
            width: 100%;
            background: var(--surface-3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            -webkit-appearance: none;
        }
        .field-input::placeholder {
            color: var(--text-dim);
        }
        .field-input:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px var(--red-dim);
            background: var(--surface-2);
        }
        .field-input.has-error {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.15);
        }

        .field-error {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--red);
            padding-left: 4px;
            display: none;
        }
        .field-error.visible {
            display: block;
        }

        /* Password toggle */
        .password-wrap .field-input {
            padding-right: 46px;
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .toggle-pw:hover {
            color: var(--text);
        }
        .toggle-pw svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── Auth error banner ── */
        .auth-error {
            display: none;
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(227, 6, 19, 0.1);
            border: 1px solid rgba(227, 6, 19, 0.3);
            color: rgba(255, 160, 168, 0.95);
            font-size: 0.82rem;
            font-weight: 500;
            line-height: 1.5;
            margin-top: 2px;
        }
        .auth-error.visible {
            display: block;
            animation: fadeSlide 0.3s var(--ease) both;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Forgot password ── */
        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin-top: -4px;
        }
        .forgot-link {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-link:hover {
            color: var(--red);
        }

        /* ── Primary CTA ── */
        .cta-wrap {
            margin-top: 20px;
        }

        .cta-btn {
            width: 100%;
            padding: 14px 24px;
            border-radius: 8px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s var(--ease), box-shadow 0.3s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .cta-btn:active {
            transform: scale(0.97);
        }
        .cta-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        .red-cta {
            background: var(--red);
            color: white;
            box-shadow: 0 0 16px var(--red-glow);
        }
        .red-cta:hover:not(:disabled) {
            background: #c8050f;
            box-shadow: 0 0 24px var(--red-glow);
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -110%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
            transform: skewX(-20deg);
        }
        .cta-btn:not(:disabled):hover::before {
            animation: sheen 0.55s forwards;
        }
        @keyframes sheen {
            to {
                left: 160%;
            }
        }

        .btn-spinner {
            width: 20px;
            height: 20px;
            display: none;
            animation: spinIcon 0.75s linear infinite;
            flex-shrink: 0;
        }
        .cta-btn.loading .btn-spinner {
            display: block;
        }
        .cta-btn.loading .btn-label {
            opacity: 0.7;
        }

        @keyframes spinIcon {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Divider ── */
        .alt-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
        }
        .alt-divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .alt-divider-text {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
            white-space: nowrap;
        }

        /* ── Alt buttons (Google & Passkey) ── */
        .alt-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .alt-btn {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-3);
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
        }
        .alt-btn:hover {
            background: var(--surface-2);
            border-color: var(--border-bright);
            color: var(--text);
        }
        .alt-btn:active {
            transform: scale(0.97);
        }
        .alt-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .alt-btn-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alt-btn-label {
            font-size: 0.82rem;
            font-weight: 500;
        }

        /* ── Passkey button special glow ── */
        #passkeyBtn {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.04) 0%, rgba(227, 6, 19, 0.08) 100%);
            transition: all 0.3s var(--ease);
        }
        #passkeyBtn:hover {
            background: radial-gradient(circle at 30% 10%, rgba(227, 6, 19, 0.2), rgba(255, 255, 255, 0.04));
            border-color: rgba(227, 6, 19, 0.5);
            box-shadow: 0 0 12px rgba(227, 6, 19, 0.3);
            transform: translateY(-2px);
        }
        #passkeyBtn:active {
            transform: scale(0.97);
        }

        /* ── Sign‑up link ── */
        .signup-link {
            text-align: center;
            margin-top: 22px;
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .signup-link a {
            color: var(--red);
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .signup-link a:hover {
            opacity: 0.8;
        }

        /* ── Customer tag ── */
        .customer-tag {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-dim);
        }
        .customer-tag .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 6px var(--red);
            flex-shrink: 0;
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            body {
                padding: 16px 14px;
            }
            .login-install-banner {
                padding: 10px 14px;
                margin-bottom: 12px;
                margin-top: 2px;
            }
            .banner-text strong {
                font-size: 0.8rem;
            }
            .banner-text p {
                font-size: 0.7rem;
            }
            .cta-button {
                font-size: 0.7rem;
                padding: 6px 14px;
            }
            .login-card {
                padding: 24px 20px 20px;
                border-radius: 12px;
            }
            .brand-heading {
                font-size: 1.6rem;
            }
            .logo-mark {
                width: 48px;
                height: 48px;
                border-radius: 12px;
            }
            .field-input {
                font-size: 0.78rem;
                padding: 8px 12px;
            }
            .cta-btn {
                padding: 12px 20px;
                font-size: 0.78rem;
            }
            .alt-btn {
                padding: 10px 16px;
                font-size: 0.78rem;
            }
        }

        @media (max-width: 400px) {
            body {
                padding: 12px 10px;
            }
            .login-install-banner {
                padding: 8px 12px;
            }
            .login-card {
                padding: 18px 14px 16px;
            }
            .brand-heading {
                font-size: 1.4rem;
            }
            .brand-sub {
                font-size: 0.72rem;
            }
            .logo-mark {
                width: 40px;
                height: 40px;
                border-radius: 10px;
            }
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-bright);
            border-radius: 99px;
        }

        /* ── Logo fallback ── */
        .logo-mark img:not([src]),
        .logo-mark img[src=""] {
            display: none;
        }
        .logo-mark img:not([src])+.fallback-icon,
        .logo-mark img[src=""]+.fallback-icon {
            display: block;
        }
    </style>

    <!-- Font Awesome for fallback icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>

    <!-- Background layers -->
    <div class="bg"></div>
    <div class="bg-noise"></div>

    <!--
      ─── INSTALL BANNER ──────────────────────────
      Shown only if:
      - App is not already installed (standalone mode)
      - User has not dismissed it before (localStorage)
    -->
    <div id="loginInstallBanner" class="login-install-banner" style="display:none;">
        <div class="banner-content">
            <div class="banner-icon">📲</div>
            <div class="banner-text">
                <strong>Install Rands Vibe Passport</strong>
                <p id="installInstructions">Get the full app experience with one tap.</p>
            </div>
            <div class="banner-actions">
                <button id="loginInstallCta" class="cta-button">Install Now</button>
                <button id="closeLoginBanner" class="banner-close" aria-label="Dismiss">✕</button>
            </div>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- Customer tag – updated to #SeeYourVibe -->
            <div class="customer-tag">
                <span class="dot"></span>
                <span>#SeeYourVibe</span>
            </div>

            <!-- Branding with heading: "Rands" on top, "Vibe Passport" below -->
            <div class="brand">
                <div class="logo-mark">
                    <img src="../assets/images/rands-logo.png" alt="Rands Vibe Passport" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'" />
                    <span class="fallback-icon">R</span>
                </div>
                <h1 class="brand-heading">
                    <span class="top">Rands</span>
                    <span class="bottom">Vibe Passport</span>
                </h1>
                <div class="brand-sub">Secure access to your experience</div>
            </div>

            <!-- Form -->
            <form class="form-wrap" id="loginForm" novalidate>
                <div class="field-group">
                    <label class="field-label" for="email">Email Address</label>
                    <div class="input-wrap">
                        <input class="field-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" inputmode="email" />
                    </div>
                    <span class="field-error" id="err-email">Enter a valid email address</span>
                </div>

                <div class="field-group">
                    <label class="field-label" for="password">Password</label>
                    <div class="input-wrap password-wrap">
                        <input class="field-input" type="password" id="password" name="password" placeholder="Your passport key" autocomplete="current-password" />
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                            <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" fill="none" stroke-width="1.8" />
                                <circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="1.8" />
                            </svg>
                            <svg id="eyeOffIcon" viewBox="0 0 24 24" style="display:none" width="18" height="18">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" stroke="currentColor" fill="none" stroke-width="1.8" />
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" stroke="currentColor" fill="none" stroke-width="1.8" />
                                <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="1.8" />
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" id="err-password">Password is required</span>

    <!-- OAuth callback handler -->
    <script>
        (async function handleOAuthRedirect() {
            let retries = 0;
            let supabaseClient = null;

            function getSupabaseFromWindow() {
                return window.supabaseClient || window.__supabase || (window.supabase && window.supabase.auth ? window
                    .supabase : null);
            }

            while (retries < 20 && !supabaseClient) {
                supabaseClient = getSupabaseFromWindow();
                if (!supabaseClient) {
                    await new Promise(r => setTimeout(r, 100));
                    retries++;
                }
            }

            if (!supabaseClient) {
                console.warn("OAuth handler: Supabase client not found. Skipping.");
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && typeof window.finishLogin === 'function') {
                console.log("OAuth session detected → calling finishLogin");
                await window.finishLogin(session.user);
                if (window.location.hash || window.location.search.includes('code=')) {
                    window.history.replaceState(null, '', window.location.pathname);
                }
            }
        })();
    </script>

            if (forgotLink) {
                forgotLink.addEventListener('click', function(e) {

                    alert('Password recovery will be available soon. Please contact support.');
                });
            }
        });
    </script>

    <!-- ====== INSTALL BANNER LOGIC ====== -->
    <script>
        (function() {
            'use strict';

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBanner);
            } else {
                initBanner();
            }

            function initBanner() {
                const banner = document.getElementById('loginInstallBanner');
                const closeBtn = document.getElementById('closeLoginBanner');
                const ctaBtn = document.getElementById('loginInstallCta');
                const instructionsEl = document.getElementById('installInstructions');

                if (!banner) return;

                const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                    window.navigator.standalone === true;

                const isDismissed = localStorage.getItem('loginInstallDismissed') === 'true';

                if (isStandalone || isDismissed) {
                    banner.style.display = 'none';
                    return;
                }

                const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                const isAndroid = /Android/.test(navigator.userAgent);

                let instructionText = '';
                let ctaText = 'Install Now';

                if (isIos) {
                    instructionText = 'Tap the Share icon below, then select "Add to Home Screen".';
                    ctaText = 'How to Install';
                } else if (isAndroid) {
                    instructionText = 'Tap the menu (⋮) in your browser and select "Install App".';
                    ctaText = 'Install App';
                } else {
                    instructionText = 'Install this app from your browser\'s menu for the best experience.';
                    ctaText = 'Learn How';
                }

                if (instructionsEl) instructionsEl.textContent = instructionText;
                if (ctaBtn) ctaBtn.textContent = ctaText;

                banner.style.display = 'block';

                if (closeBtn) {
                    closeBtn.addEventListener('click', function() {
                        banner.style.display = 'none';
                        localStorage.setItem('loginInstallDismissed', 'true');
                    });
                }

                if (ctaBtn) {
                    ctaBtn.addEventListener('click', function() {
                        if (isIos) {
                            alert(
                                '📲 To install Rands Vibe Passport on your iPhone/iPad:\n\n' +
                                '1. Tap the Share icon (square with arrow) at the bottom of the screen.\n' +
                                '2. Scroll down and tap "Add to Home Screen".\n' +
                                '3. Tap "Add" in the top‑right corner.\n\n' +
                                'You\'ll then have the app icon on your Home Screen.'
                            );
                        } else if (isAndroid) {
                            alert(
                                '📲 To install Rands Vibe Passport on your Android device:\n\n' +
                                '1. Tap the three‑dot menu (⋮) in your browser.\n' +
                                '2. Tap "Install App" or "Add to Home Screen".\n' +
                                '3. Follow the on‑screen prompts.\n\n' +
                                'The app will be added to your Home Screen.'
                            );
                        } else {
                            alert(
                                '📲 To install this app on your computer:\n\n' +
                                '• Chrome/Edge: Look for the install icon (➕) in the address bar.\n' +
                                '• Firefox/Safari: Use "Add to Home Screen" or "Add to Dock" from the browser menu.\n\n' +
                                'This will create a shortcut for quick access.'
                            );
                        }
                    });
                }
            }
        })();
    </script>
