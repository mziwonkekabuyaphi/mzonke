<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Rands Wallet | Statement</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="../assets/css/statement.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <div class="brand" onclick="window.location.href='home.html'">
            <div class="brand-logo">
                <img src="../assets/images/rands-logo.png" alt="Rands" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-receipt&quot;></i>';">
            </div>
            <div class="brand-text">
                <h1>Statement</h1>
                <p>Transaction History</p>
            </div>
        </div>
        <div class="home-icon-btn" id="homeIconBtn">
            <i class="fas fa-home"></i>
        </div>
    </header>

    <!-- ===== STATS ===== -->
    <div class="wallet-stats">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-wallet"></i></div>
            <div class="stat-info"><h3>Current Balance</h3><div class="stat-number" id="balanceStat">R 0.00</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-exchange-alt"></i></div>
            <div class="stat-info"><h3>Transactions</h3><div class="stat-number" id="txCountStat">0</div></div>
        </div>
    </div>

    <!-- ===== MAIN STATEMENT CARD ===== -->
    <div class="statement-wrap">
        <div class="statement-card">

            <!-- Financial Header -->
            <div class="financial-header">
                <div class="balance-badge">
                    <i class="fas fa-receipt"></i>
                </div>
                <div class="financial-titles">
                    <div class="page-title">Statement</div>
                    <div class="page-subtitle">Full transaction history</div>
                </div>
            </div>

            <!-- Wallet Preview -->
            <div class="wallet-preview">
                <div>
                    <div class="preview-label">Current balance</div>
                    <div class="preview-amount" id="currentBalanceSpan">R0.00</div>
                </div>
                <i class="fas fa-wallet" style="color: var(--red); font-size: 1.5rem;"></i>
            </div>

            <!-- Action Buttons -->
            <div class="header-actions">
                <button class="action-btn pdf-btn" id="exportPdfBtn"><i class="fas fa-file-pdf"></i> Download PDF</button>
                <button class="action-btn reset-btn" id="resetFilterBtn"><i class="fas fa-sync-alt"></i> Reset</button>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-mini">
                    <h4 id="totalSpentSpan">R0.00</h4>
                    <p>Total Spent</p>
                </div>
                <div class="stat-mini">
                    <h4 id="totalDepositedSpan">R0.00</h4>
                    <p>Total Deposited</p>
                </div>
                <div class="stat-mini">
                    <h4 id="totalRewardsSpan">R0.00</h4>
                    <p>Refunds / Cashback</p>
                </div>
                <div class="stat-mini">
                    <h4 id="txCountSpan">0</h4>
                    <p>Transactions</p>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="section-title"><i class="fas fa-filter"></i> Filter transactions</div>
            <div class="filter-section">
                <div class="pills-row" id="filterPillsRow"></div>
            </div>

            <!-- Transaction History List -->
            <div id="transactionsList" class="transactions-container"></div>
            <div id="loadMoreContainer"></div>

            <!-- Bottom Actions -->
            <div class="bottom-actions">
                <button class="btn-lg" onclick="window.location.href='home.html'"><i class="fas fa-passport"></i> Open Passport</button>
                <button class="btn-lg btn-lg-outline" onclick="window.location.href='deposit.html'"><i class="fas fa-arrow-up"></i> Top Up</button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast-message"></div>

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
            }
        }
    </script>

    <script type="module" src="../assets/js/statement.js"></script>
</body>
</html>
