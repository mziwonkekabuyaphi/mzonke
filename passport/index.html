<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vibe Pass | Digital Wallet</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23171414'/%3E%3Cpath d='M18 18h28v8H26v6h16v8H26v6h20v8H18z' fill='%23f4c542'/%3E%3C/svg%3E">

    <!-- Loaded ONCE for the entire app session, not per page -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Your existing per-page CSS files, shared at repo root — unchanged -->
    <link rel="stylesheet" href="../assets/css/home.css">
    <link rel="stylesheet" href="css/tickets.css">
    <link rel="stylesheet" href="css/vvip.css">
    <link rel="stylesheet" href="css/shisha.css">
    <link rel="stylesheet" href="css/order-now.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/deposit.css">
    <link rel="stylesheet" href="css/vault.css">
    <link rel="stylesheet" href="../assets/css/pay-now.css">
    <link rel="stylesheet" href="css/statement.css">
    <link rel="stylesheet" href="css/festival-banner.css">
    <link rel="stylesheet" href="css/payment-success.css">

    <!-- Global shell styles (also in /css/) -->
    <link rel="stylesheet" href="css/bottom-nav.css">
    <link rel="stylesheet" href="css/shell-additions.css">
</head>
<body class="nav-hidden">

<div id="app">
    <!-- Every page fragment (with its own header) gets injected here -->
    <div id="app-content">
        <div class="page-loading">Loading…</div>
    </div>

    <!-- The ONE genuinely global element, per your architecture.
         Hidden on the home route via body.nav-hidden (see router.js /
         shell-additions.css) — matches the old multi-page behavior where
         home.html never included #bottomNavContainer. -->
    <div id="bottomNavContainer">
        <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation">
            <div class="bottom-nav__inner">
                <button class="bottom-nav__item" data-link="tickets" aria-label="Tickets">
                    <span class="bottom-nav__pill" aria-hidden="true"></span>
                    <span class="bottom-nav__icon" aria-hidden="true"><i class="fas fa-ticket-alt"></i></span>
                    <span class="bottom-nav__label">Tickets</span>
                </button>
                <button class="bottom-nav__item" data-link="vvip" aria-label="VVIP">
                    <span class="bottom-nav__pill" aria-hidden="true"></span>
                    <span class="bottom-nav__icon" aria-hidden="true"><i class="fas fa-crown"></i></span>
                    <span class="bottom-nav__label">VVIP</span>
                </button>
                <button class="bottom-nav__item" data-link="order" aria-label="Order">
                    <span class="bottom-nav__pill" aria-hidden="true"></span>
                    <span class="bottom-nav__icon" aria-hidden="true"><i class="fas fa-utensils"></i></span>
                    <span class="bottom-nav__label">Order</span>
                </button>
                <button class="bottom-nav__item" data-link="shisha" aria-label="Shisha">
                    <span class="bottom-nav__pill" aria-hidden="true"></span>
                    <span class="bottom-nav__icon" aria-hidden="true"><i class="fas fa-smoking"></i></span>
                    <span class="bottom-nav__label">Shisha</span>
                </button>
                <button class="bottom-nav__item" data-link="lockers" aria-label="Lockers">
                    <span class="bottom-nav__pill" aria-hidden="true"></span>
                    <span class="bottom-nav__icon" aria-hidden="true"><i class="fas fa-lock"></i></span>
                    <span class="bottom-nav__label">Vault</span>
                </button>
            </div>
        </nav>
    </div>
    <div class="bottom-nav-spacer"></div>
</div>

<div class="toast-message" id="customToast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
