<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vibe Pass | Digital Wallet</title>

    <!-- Loaded ONCE for the entire app session, not per page -->

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Your existing per-page CSS files, shared at repo root — unchanged -->
    <link rel="stylesheet" href="../assets/css/home.css">
    <!-- Add one <link> per page's CSS file as you convert it, e.g.: -->
    <!-- <link rel="stylesheet" href="../assets/css/tickets.css"> -->

    <!-- New: nav + loading-state styles only, lives inside passport/ -->
    <link rel="stylesheet" href="css/shell-additions.css">

<body>

<div id="app">
    <!-- Every page fragment (with its own header) gets injected here -->
    <div id="app-content">
        <div class="page-loading">Loading…</div>
    </div>

    <!-- The ONE genuinely global element, per your architecture -->
    <nav id="bottom-nav" class="bottom-nav">
        <button class="nav-item" data-link="home"><i class="fas fa-home"></i><span>Home</span></button>
        <button class="nav-item" data-link="order"><i class="fas fa-receipt"></i><span>Orders</span></button>
        <button class="nav-item" data-link="tickets"><i class="fas fa-ticket-alt"></i><span>Tickets</span></button>
        <button class="nav-item" data-link="vvip"><i class="fas fa-crown"></i><span>VVIP</span></button>
        <button class="nav-item" data-link="lockers"><i class="fas fa-lock"></i><span>Lockers</span></button>
    </nav>
</div>

<div class="toast-message" id="customToast"></div>

<script type="module" src="js/main.js"></script>
