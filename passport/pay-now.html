<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Rands Wallet | Pay Now</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
            }
        }
    </script>
    <style>
        /* pure pay styles (same as original – no header/nav) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .pay-standalone {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .pay-content {
            padding: 24px 20px 32px;
        }
        .pay-heading {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #E30613 0%, #b0020e 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-align: center;
        }
        .barcode-container {
            background: #ffffff;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            border: 1px solid #ecf0f5;
        }
        #barcodeCanvas {
            max-width: 280px;
            width: 100%;
            height: auto;
        }
        .qr-large {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eef2f8;
            text-align: center;
        }
        #qrcode {
            width: 160px;
            height: 160px;
            margin: 0 auto 12px;
            display: flex;
            justify-content: center;
        }
        .qr-label {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 500;
            margin-top: 8px;
            word-break: break-all;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 60px;
            display: inline-block;
        }
        .action-btn {
            border: none;
            padding: 14px 12px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 28px;
            background: linear-gradient(135deg, #E30613 0%, #b71c1c 100%);
            color: white;
            box-shadow: 0 6px 14px rgba(227, 6, 19, 0.25);
        }
        .action-btn:active { transform: scale(0.96); }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: flex-end;
            justify-content: center;
            z-index: 3000;
        }
        .modal.active { display: flex; }
        .modal-card {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 28px 28px 0 0;
            padding: 24px 20px 28px;
            animation: slideUp 0.3s;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 60px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-confirm { background: #E30613; color: white; }
        .btn-cancel { background: #f1f5f9; color: #2c3e66; }
        .toast-msg {
            position: fixed;
            bottom: 100px;
            left: 20px;
            right: 20px;
            background: #1e2a3a;
            color: white;
            padding: 10px 16px;
            border-radius: 60px;
            text-align: center;
            z-index: 3500;
            display: none;
            font-size: 0.8rem;
        }
        .toast-msg.show { display: block; }
        @media (max-width: 480px) {
            .pay-content { padding: 20px 16px; }
            .pay-heading { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="pay-standalone">
    <div class="pay-content">
        <div class="pay-heading">
            <i class="fas fa-qrcode" style="margin-right: 8px;"></i> Scan to Pay
        </div>
        <div class="barcode-container">
            <svg id="barcodeCanvas"></svg>
        </div>
        <div class="qr-large">
            <div id="qrcode"></div>
            <p class="qr-label">
                <i class="fas fa-wallet"></i> Rands Account: <span id="qrAccountLabel"></span>
            </p>
        </div>
        <button class="action-btn" id="payNowBtn">
            <i class="fas fa-bolt"></i> Pay Now (R150)
        </button>
        <p style="font-size: 0.7rem; color: #94a3b8; margin-top: 20px; text-align: center;">Tap to authorise a R150 payment</p>
    </div>
</div>

<!-- payment approval modal (same as original) -->
<div id="paymentApprovalModal" class="modal">
    <div class="modal-card">
        <h3 style="color:#E30613;"><i class="fas fa-shield-alt"></i> 💰 Payment Request</h3>
        <div id="approvalDetails" style="margin:20px 0; text-align:center;">
            <div style="background:#f8fafc; border-radius:20px; padding:20px;">
                <p style="font-size:1.5rem; font-weight:800; color:#E30613;" id="approvalAmount">R0.00</p>
                <p style="font-size:0.9rem; color:#64748b; margin-top:10px;">From: <strong>Rands Kiosk • POS</strong></p>
                <p style="font-size:0.85rem; color:#475569; margin-top:8px;" id="approvalDesc">-</p>
            </div>
        </div>
        <div class="modal-btns">
            <button class="modal-btn btn-cancel" id="rejectPaymentBtn">Reject</button>
            <button class="modal-btn btn-confirm" id="acceptPaymentBtn">Confirm Payment</button>
        </div>
    </div>
</div>

<div id="globalToast" class="toast-msg"></div>

<script type="module">
    import { supabase } from '../confi/supabase.js';

    // DOM elements
    const toast = document.getElementById('globalToast');
    const qrLabel = document.getElementById('qrAccountLabel');
    const barcodeCanvas = document.getElementById('barcodeCanvas');
    const qrcodeDiv = document.getElementById('qrcode');
    const payBtn = document.getElementById('payNowBtn');
    const modal = document.getElementById('paymentApprovalModal');
    const approvalAmount = document.getElementById('approvalAmount');
    const approvalDesc = document.getElementById('approvalDesc');
    const acceptBtn = document.getElementById('acceptPaymentBtn');
    const rejectBtn = document.getElementById('rejectPaymentBtn');

    let currentUserId = null;
    let currentUserPhone = null;
    let currentBalance = 0;
    let activeRequestId = null;
    let realtimeSubscription = null;

    function showToastMsg(msg) {
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // fetch user profile & balance from Supabase
    async function loadUserData() {
        const { data: { user }, error: userError } = await supabase.auth.getUser();
        if (userError || !user) {
            showToastMsg("Please log in first");
            window.location.href = 'login.html';
            return false;
        }
        currentUserId = user.id;

        // get account details from 'accounts' table
        const { data: account, error: accError } = await supabase
            .from('accounts')
            .select('phone, balance, name')
            .eq('user_id', currentUserId)
            .single();

        if (accError || !account) {
            showToastMsg("Account not found. Please contact support.");
            return false;
        }

        currentUserPhone = account.phone;
        currentBalance = account.balance;
        // update QR / barcode with user phone (same as original used phone as ID)
        if (qrLabel) qrLabel.innerText = currentUserPhone;
        generateBarcode(currentUserPhone);
        generateQRCode(currentUserPhone);
        return true;
    }

    function generateBarcode(text) {
        if (barcodeCanvas && text) {
            try {
                JsBarcode("#barcodeCanvas", text, { format: "CODE128", width: 2, height: 50, displayValue: false });
            } catch(e) { console.warn(e); }
        }
    }

    function generateQRCode(text) {
        if (qrcodeDiv && text) {
            qrcodeDiv.innerHTML = "";
            try {
                new QRCode(qrcodeDiv, { text: text, width: 140, height: 140, colorDark: "#E30613" });
            } catch(e) { console.warn(e); }
        }
    }

    // create a new payment request (R150)
    async function createPaymentRequest() {
        if (!currentUserId) {
            showToastMsg("User not authenticated");
            return;
        }
        const amount = 150;
        if (currentBalance < amount) {
            showToastMsg(`Insufficient balance. Current: R${currentBalance.toFixed(2)}`);
            return;
        }

        const { data, error } = await supabase
            .from('payment_requests')
            .insert({
                user_id: currentUserId,
                amount: amount,
                description: "Payment to Rands Kiosk · POS Terminal",
                status: 'pending',
                created_at: new Date().toISOString()
            })
            .select()
            .single();

        if (error) {
            console.error(error);
            showToastMsg("Failed to create payment request");
            return;
        }
        showToastMsg(`Payment request R${amount} sent – awaiting approval`);
        // No need to call show modal – realtime subscription will trigger it
    }

    // accept payment: deduct balance, update request status, add transaction
    async function acceptPaymentRequest(requestId, amount, description) {
        if (!currentUserId) return false;

        // Check current balance again
        const { data: account, error: fetchError } = await supabase
            .from('accounts')
            .select('balance')
            .eq('user_id', currentUserId)
            .single();

        if (fetchError || !account) {
            showToastMsg("Error fetching account");
            return false;
        }

        if (account.balance < amount) {
            showToastMsg(`Insufficient balance. You have R${account.balance.toFixed(2)}`);
            return false;
        }

        const newBalance = account.balance - amount;

        // Start a transaction (update balance, update request, insert transaction record)
        const { error: updateBalanceError } = await supabase
            .from('accounts')
            .update({ balance: newBalance })
            .eq('user_id', currentUserId);

        if (updateBalanceError) {
            showToastMsg("Payment failed. Try again.");
            return false;
        }

        const { error: updateRequestError } = await supabase
            .from('payment_requests')
            .update({ status: 'completed' })
            .eq('id', requestId);

        if (updateRequestError) {
            // Rollback balance? For simplicity we log error but still consider payment done
            console.error("Request update failed", updateRequestError);
        }

        // Insert transaction record
        await supabase.from('transactions').insert({
            user_id: currentUserId,
            description: description,
            amount: -amount,
            date: new Date().toISOString().slice(0,10)
        });

        // Update local balance
        currentBalance = newBalance;
        showToastMsg(`✅ Payment of R${amount.toFixed(2)} completed.`);
        return true;
    }

    async function rejectPaymentRequest(requestId) {
        const { error } = await supabase
            .from('payment_requests')
            .update({ status: 'rejected' })
            .eq('id', requestId);
        if (error) console.error(error);
        showToastMsg("Payment rejected");
    }

    // Show modal for a given payment request
    function showPaymentModal(request) {
        if (!modal || modal.classList.contains('active')) return;
        approvalAmount.innerHTML = `R${request.amount.toFixed(2)}`;
        approvalDesc.innerHTML = `${request.description} (ID: ${request.id.toString().slice(-6)})`;
        modal.setAttribute('data-request-id', request.id);
        activeRequestId = request.id;
        modal.classList.add('active');
    }

    // Set up realtime subscription for new/updated pending requests
    async function subscribeToPaymentRequests() {
        if (realtimeSubscription) {
            await realtimeSubscription.unsubscribe();
        }
        realtimeSubscription = supabase
            .channel('payment-requests-channel')
            .on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'payment_requests',
                filter: `user_id=eq.${currentUserId}`
            }, (payload) => {
                const newRequest = payload.new;
                if (newRequest.status === 'pending') {
                    showPaymentModal(newRequest);
                }
            })
            .on('postgres_changes', {
                event: 'UPDATE',
                schema: 'public',
                table: 'payment_requests',
                filter: `user_id=eq.${currentUserId}`
            }, (payload) => {
                const updated = payload.new;
                // If modal is open and request was updated externally, close modal if completed/rejected
                if (modal.classList.contains('active') && activeRequestId === updated.id && updated.status !== 'pending') {
                    modal.classList.remove('active');
                    activeRequestId = null;
                    if (updated.status === 'completed') {
                        showToastMsg("Payment already processed");
                    } else if (updated.status === 'rejected') {
                        showToastMsg("Payment was rejected elsewhere");
                    }
                }
            })
            .subscribe();
    }

    // handle accept button click
    async function handleAccept() {
        const requestId = modal.getAttribute('data-request-id');
        if (!requestId) {
            modal.classList.remove('active');
            return;
        }
        // fetch the request details to get amount and description
        const { data: request, error } = await supabase
            .from('payment_requests')
            .select('amount, description')
            .eq('id', requestId)
            .single();

        if (error || !request) {
            showToastMsg("Request not found");
            modal.classList.remove('active');
            return;
        }

        const success = await acceptPaymentRequest(requestId, request.amount, request.description);
        if (success) {
            modal.classList.remove('active');
            activeRequestId = null;
            // Refresh balance display (optional)
            const { data: freshAccount } = await supabase.from('accounts').select('balance').eq('user_id', currentUserId).single();
            if (freshAccount) currentBalance = freshAccount.balance;
        } else {
            // keep modal open? close anyway to avoid stuck state
            modal.classList.remove('active');
        }
    }

    async function handleReject() {
        const requestId = modal.getAttribute('data-request-id');
        if (requestId) {
            await rejectPaymentRequest(requestId);
        }
        modal.classList.remove('active');
        activeRequestId = null;
    }

    // Initialize page
    async function init() {
        const userLoaded = await loadUserData();
        if (!userLoaded) return;

        await subscribeToPaymentRequests();

        // Check for any existing pending requests on page load
        const { data: pendingRequests, error } = await supabase
            .from('payment_requests')
            .select('*')
            .eq('user_id', currentUserId)
            .eq('status', 'pending')
            .order('created_at', { ascending: false });

        if (!error && pendingRequests && pendingRequests.length > 0) {
            showPaymentModal(pendingRequests[0]);
        }
    }

    // attach event listeners
    payBtn.addEventListener('click', (e) => {
        e.preventDefault();
        createPaymentRequest();
    });

    acceptBtn.addEventListener('click', handleAccept);
    rejectBtn.addEventListener('click', handleReject);

    // close modal when clicking on backdrop
    modal.addEventListener('click', (e) => {
        if (e.target === modal) handleReject();
    });

    init();
</script>
</body>
</html>
