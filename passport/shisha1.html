<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Shisha | Digital Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/bottom-nav.css">
    <link rel="stylesheet" href="../assets/css/shisha.css">
</head>
<body data-section="shisha">

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <div class="brand" onclick="window.location.href='home.html'">
            <div class="brand-logo">
                <img src="../assets/images/rands-logo.png" alt="Rands" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-smoking\'></i>';">
            </div>
            <div class="brand-text">
                <h1>Shisha</h1>
                <p>Puff and Pass</p>
            </div>
        </div>
        <div class="header-right">
            <div class="home-icon-btn" id="homeHeaderBtn"><i class="fas fa-home"></i></div>
        </div>
    </header>

    <!-- ===== STATS CARDS ===== -->
    <div class="wallet-stats">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-wallet"></i></div>
            <div class="stat-info">
                <h3>My Balance</h3>
                <div class="stat-number" id="walletBalance">R0.00</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-fire"></i></div>
            <div class="stat-info">
                <h3>Active Session</h3>
                <div class="stat-number" id="sessionStatText">—</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-chalkboard-user"></i></div>
            <div class="stat-info">
                <h3>Coals Used</h3>
                <div class="stat-number" id="coalsUsedStat">0</div>
            </div>
        </div>
    </div>

    <!-- ===== TAB NAVIGATION ===== -->
    <div class="shisha-tab-nav">
        <button class="tab-btn active" id="shishaTabBtn"><i class="fas fa-smoking"></i> Shisha</button>
        <button class="tab-btn" id="statementTabBtn"><i class="fas fa-receipt"></i> Puffing Statement</button>
    </div>

    <!-- ===== SHISHA PANEL ===== -->
    <div id="shishaPanel" class="shisha-panel">
        <div id="activeSessionContainer"></div>
        <div id="noSessionContainer" class="empty-state-mini" style="display: none;">
            <i class="fas fa-smoking" style="font-size: 2rem; color: var(--mist);"></i>
            <p style="margin-top: 10px;">No active session</p>
            <p style="font-size: 0.7rem;">Order below to start</p>
        </div>

        <div class="requests-grid" id="serviceButtonsGrid">
            <button class="service-btn" id="coalRefillBtn"><i class="fas fa-fire"></i> Coal Refill</button>
            <button class="service-btn" id="endSessionBtn"><i class="fas fa-stop"></i> End Session</button>
            <button class="service-btn" id="reportIssueBtn"><i class="fas fa-triangle-exclamation"></i> Report Issue</button>
        </div>

        <div class="order-card-modern">
            <h4><i class="fas fa-ticket-alt"></i> Order New Session</h4>
            <select id="orderLocation" class="modern-select">
                <option value="">Loading locations...</option>
            </select>
            <select id="orderFlavour" class="modern-select">
                <option value="">Loading flavours...</option>
            </select>
            <div class="order-btn-modern" id="orderNowBtn">Smoke Now - R250</div>
            <div class="helper-text"><i class="fas fa-shield-alt"></i> Payment via wallet • Staff approval required</div>
        </div>
    </div>

    <!-- ===== STATEMENT PANEL ===== -->
    <div id="statementPanel" class="statement-panel">
        <div id="statementListContainer" class="statement-list">
            <div class="statement-empty">Loading your requests...</div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toastMessage" class="toast-message"></div>

    <!-- ===== ISSUE REPORT MODAL ===== -->
    <div id="issueModalOverlay" class="issue-modal-overlay">
        <div class="issue-modal">
            <div class="issue-modal-header">
                <h4><i class="fas fa-triangle-exclamation"></i> What's the issue?</h4>
                <button class="issue-modal-close" id="issueModalClose"><i class="fas fa-xmark"></i></button>
            </div>
            <div class="issue-options" id="issueOptionsList"></div>
            <div class="issue-other-input" id="issueOtherInput">
                <textarea id="issueOtherText" rows="3" placeholder="Tell us what's wrong..."></textarea>
                <div class="order-btn-modern" id="issueOtherSubmit" style="margin-top: 10px;">Send Report</div>
            </div>
        </div>
    </div>

    <!-- ===== BOTTOM NAVIGATION ===== -->
    <div id="bottomNavContainer"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="/assets/js/bottom-nav.js"></script>
    <script type="module" src="../assets/js/shisha.js"></script>
</body>
</html>
