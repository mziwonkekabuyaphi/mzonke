<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Tickets | Digital Wallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <!-- Supabase is now imported from local config file -->
    <script type="module">
        import { createClient } from '../config/supabase.js';
        window.supabase = createClient();
        // Then load the rest of the script (which uses window.supabase)
        const script = document.createElement('script');
        script.src = 'data:application/javascript,' + encodeURIComponent(`
            // ========== SUPABASE CLIENT IS ALREADY SET ==========
            const supabase = window.supabase;

            // ========== GLOBAL STATE ==========
            let currentUser = null;
            let currentProfile = null;
            let events = [];
            let selectedEventId = null;
            let foundWalletProfile = null;
            let phoneDebounceTimer = null;
            let isLoggedIn = false;

            // ========== UTILITIES ==========
            function showToast(msg, isError = false) {
                const toast = document.getElementById('toastMsg');
                if (!toast) return;
                toast.textContent = msg;
                toast.style.background = isError ? '#ef4444' : '#1e293b';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2600);
            }

            function generateTicketId() {
                return 'TK' + Math.random().toString(36).substring(2, 10).toUpperCase();
            }

            function setIssueBtn(loading) {
                const btn = document.getElementById('confirmIssueBtn');
                if (!btn) return;
                if (loading) {
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner"></span> Issuing…';
                } else {
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Issue to Wallet';
                    btn.disabled = !foundWalletProfile;
                }
            }

            // ========== AUTH & CUSTOMER STATS ==========
            async function loadSession() {
                console.log('🔐 Loading session...');
                try {
                    const { data: { session }, error } = await supabase.auth.getSession();
                    if (error || !session) {
                        console.warn('No active session');
                        return false;
                    }
                    currentUser = session.user;
                    isLoggedIn = true;
                    console.log('✅ Logged in:', currentUser.email);

                    // Fetch profile for customer name and phone
                    const { data: profile, error: profileError } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', currentUser.id)
                        .single();
                    if (!profileError && profile) {
                        currentProfile = profile;
                        document.getElementById('userNameStat').textContent = profile.name || profile.phone || currentUser.email;
                    } else {
                        document.getElementById('userNameStat').textContent = currentUser.email || 'Customer';
                    }
                    return true;
                } catch (err) {
                    console.error('❌ loadSession crash:', err);
                    return false;
                }
            }

            // Count tickets for the current customer only
            async function refreshMyTicketCount() {
                if (!currentProfile || !currentProfile.phone) {
                    document.getElementById('myTicketCountStat').textContent = '0';
                    return;
                }
                try {
                    const { count, error } = await supabase
                        .from('tickets')
                        .select('id', { count: 'exact', head: true })
                        .eq('customer_phone', currentProfile.phone);
                    if (!error) {
                        document.getElementById('myTicketCountStat').textContent = count || 0;
                    }
                } catch (err) { console.error(err); }
            }

            // ========== LOAD EVENTS (global, no tenant) ==========
            async function loadEvents() {
                console.log('📅 Fetching events...');
                const eventSelect = document.getElementById('eventSelectStore');
                const modalEventSelect = document.getElementById('modalEventSelect');
                const ticketsContainer = document.getElementById('ticketsContainerStore');

                try {
                    const { data, error } = await supabase
                        .from('events')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    events = data || [];
                    console.log('✅ EVENTS LOADED (global):', events);

                    document.getElementById('eventsCountStat').textContent = events.length;

                    if (!events.length) {
                        if (eventSelect) eventSelect.innerHTML = '<option value="">No events found</option>';
                        if (modalEventSelect) modalEventSelect.innerHTML = '<option value="">No events found</option>';
                        ticketsContainer.innerHTML = \`<div class="empty-state"><i class="fas fa-calendar-times"></i> No events</div>\`;
                        return;
                    }

                    const optionsHtml = events.map(event => {
                        const dateText = event.start_time ? new Date(event.start_time).toLocaleDateString() : 'TBA';
                        return \`<option value="\${event.id}">\${event.name} — \${dateText}</option>\`;
                    }).join('');

                    if (eventSelect) {
                        eventSelect.innerHTML = optionsHtml;
                        eventSelect.disabled = false;
                    }
                    if (modalEventSelect) {
                        modalEventSelect.innerHTML = '<option value="">Select event…</option>' + optionsHtml;
                    }

                    selectedEventId = events[0].id;
                    if (eventSelect) eventSelect.value = selectedEventId;
                    eventSelect.onchange = (e) => {
                        selectedEventId = e.target.value;
                        renderStoreTickets();
                    };

                    document.getElementById('issueTicketBtn').disabled = false;
                    await renderStoreTickets();
                } catch (err) {
                    console.error('❌ loadEvents crash:', err);
                    ticketsContainer.innerHTML = '<div class="empty-state">Failed to load events</div>';
                }
            }

            // ========== TICKET TYPES ==========
            async function loadTicketTypesForEvent(eventId) {
                const select = document.getElementById('modalTicketTypeSelect');
                if (!select) return;
                if (!eventId) {
                    select.innerHTML = '<option value="">Select event first…</option>';
                    select.disabled = true;
                    return;
                }
                select.disabled = true;
                select.innerHTML = '<option>Loading…</option>';
                try {
                    const { data, error } = await supabase
                        .from('ticket_types')
                        .select('*')
                        .eq('event_id', eventId)
                        .order('price');
                    if (error) throw error;
                    const types = data || [];
                    if (!types.length) {
                        select.innerHTML = '<option value="">No ticket types</option>';
                        select.disabled = true;
                        return;
                    }
                    select.innerHTML = '<option value="">Select ticket type…</option>' +
                        types.map(t => {
                            const remaining = (t.capacity || 0) - (t.sold || 0);
                            const soldOut = remaining <= 0;
                            return \`<option value="\${t.id}" \${soldOut ? 'disabled' : ''}>\${t.name} — R\${Number(t.price).toLocaleString()} (\${remaining} left)</option>\`;
                        }).join('');
                    select.disabled = false;
                } catch (err) {
                    console.error(err);
                    select.innerHTML = '<option value="">Error loading types</option>';
                }
            }

            // ========== RENDER STORE ==========
            async function renderStoreTickets() {
                const container = document.getElementById('ticketsContainerStore');
                if (!container) return;
                if (!selectedEventId) {
                    container.innerHTML = '<div class="empty-state">Select event</div>';
                    return;
                }
                container.innerHTML = '<div class="empty-state"><span class="spinner"></span> Loading tickets...</div>';
                try {
                    const { data, error } = await supabase
                        .from('ticket_types')
                        .select('*')
                        .eq('event_id', selectedEventId)
                        .order('price');
                    if (error) throw error;
                    const types = data || [];
                    if (!types.length) {
                        container.innerHTML = '<div class="empty-state">No ticket types for this event</div>';
                        return;
                    }
                    const html = types.map(tt => {
                        const remaining = (tt.capacity || 0) - (tt.sold || 0);
                        const soldOut = remaining <= 0;
                        return \`
                            <div class="ticket-card">
                                <div class="ticket-header">
                                    <div class="ticket-type">\${tt.name}</div>
                                    <div class="ticket-price">R\${Number(tt.price).toLocaleString()}</div>
                                    <div class="ticket-desc">Remaining: \${remaining}</div>
                                </div>
                                <div class="ticket-body">
                                    <button type="button" class="buy-btn issue-type-btn" data-type-id="\${tt.id}" \${soldOut ? 'disabled' : ''}>
                                        \${soldOut ? 'Sold Out' : 'Issue Ticket'}
                                    </button>
                                </div>
                            </div>
                        \`;
                    }).join('');
                    container.innerHTML = html;
                    document.querySelectorAll('.issue-type-btn:not(:disabled)').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const typeId = btn.getAttribute('data-type-id');
                            openIssueModal(selectedEventId, typeId);
                        });
                    });
                } catch (err) {
                    console.error(err);
                    container.innerHTML = '<div class="empty-state">System crashed</div>';
                }
            }

            // ========== LOOKUP CUSTOMER ==========
            async function lookupCustomerByPhone(rawPhone) {
                const status = document.getElementById('phoneLookupStatus');
                const infoBox = document.getElementById('walletOwnerInfo');
                const display = document.getElementById('walletOwnerDisplay');
                const confirmBtn = document.getElementById('confirmIssueBtn');
                foundWalletProfile = null;
                if (confirmBtn) confirmBtn.disabled = true;
                const phone = rawPhone.trim().replace(/\\s+/g, '');
                if (phone.length < 7) {
                    status.className = 'lookup-status';
                    infoBox.style.display = 'none';
                    return;
                }
                status.className = 'lookup-status loading';
                status.textContent = '🔍 Looking up customer...';
                try {
                    const { data, error } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('phone', phone)
                        .limit(1);
                    if (error) console.error(error);
                    if (!data || !data.length) {
                        status.className = 'lookup-status notfound';
                        status.textContent = '❌ Customer not found';
                        return;
                    }
                    const profile = data[0];
                    foundWalletProfile = profile;
                    status.className = 'lookup-status found';
                    status.textContent = '✅ Customer found';
                    display.innerHTML = \`<strong>\${profile.name || 'Unnamed'}</strong><br><span>\${profile.phone || ''}</span>\`;
                    infoBox.style.display = 'block';
                    if (confirmBtn) confirmBtn.disabled = false;
                } catch (err) { console.error(err); }
            }

            // ========== ISSUE MODAL ==========
            function openIssueModal(presetEventId = null, presetTypeId = null) {
                const modal = document.getElementById('issueTicketModal');
                const modalEventSelect = document.getElementById('modalEventSelect');
                const modalTypeSelect = document.getElementById('modalTicketTypeSelect');
                const phoneInput = document.getElementById('customerPhone');
                const status = document.getElementById('phoneLookupStatus');
                const infoBox = document.getElementById('walletOwnerInfo');
                const confirmBtn = document.getElementById('confirmIssueBtn');
                foundWalletProfile = null;
                if (phoneInput) phoneInput.value = '';
                if (status) { status.className = 'lookup-status'; status.textContent = ''; }
                if (infoBox) infoBox.style.display = 'none';
                if (confirmBtn) {
                    confirmBtn.disabled = true;
                    confirmBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Issue to Wallet';
                }
                if (presetEventId && modalEventSelect) {
                    modalEventSelect.value = presetEventId;
                    loadTicketTypesForEvent(presetEventId).then(() => {
                        if (presetTypeId && modalTypeSelect) modalTypeSelect.value = presetTypeId;
                    });
                }
                modal.classList.add('show');
            }

            function closeIssueModal() {
                document.getElementById('issueTicketModal')?.classList.remove('show');
                foundWalletProfile = null;
            }

            // ========== ISSUE TICKET ==========
            async function issueTicketToWallet() {
                const eventId = document.getElementById('modalEventSelect').value;
                const typeId = document.getElementById('modalTicketTypeSelect').value;
                const phone = document.getElementById('customerPhone').value.trim().replace(/\\s+/g, '');
                if (!eventId) { showToast('Select event', true); return; }
                if (!typeId) { showToast('Select ticket type', true); return; }
                if (!foundWalletProfile) { showToast('Customer required', true); return; }
                setIssueBtn(true);
                try {
                    const { error } = await supabase.from('tickets').insert({
                        event_id: eventId,
                        ticket_type_id: typeId,
                        customer_phone: phone,
                        status: 'issued',
                        issued_by: currentUser?.id || null,
                        issued_at: new Date().toISOString()
                    });
                    if (error) throw error;
                    showToast('✅ Ticket issued');
                    closeIssueModal();
                    await renderStoreTickets();
                    await refreshMyTicketCount();
                } catch (err) {
                    console.error(err);
                    showToast('Failed: ' + err.message, true);
                    setIssueBtn(false);
                }
            }

            // ========== MY TICKETS MODAL (shows all tickets – admin view) ==========
            async function renderMyTicketsModal() {
                const container = document.getElementById('myTicketsList');
                if (!container) return;
                container.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
                try {
                    const { data, error } = await supabase
                        .from('tickets')
                        .select(\`*, ticket_types(name, price)\`)
                        .order('issued_at', { ascending: false });
                    if (error) throw error;
                    const tickets = data || [];
                    if (!tickets.length) {
                        container.innerHTML = '<div class="empty-state">No issued tickets</div>';
                        return;
                    }
                    container.innerHTML = tickets.map(t => {
                        const eventName = events.find(e => e.id === t.event_id)?.name || 'Unknown Event';
                        return \`
                            <div class="ticket-card-wallet">
                                <div class="ticket-header-wallet">
                                    <div class="event-name-tag">\${eventName}</div>
                                    <div class="ticket-title">\${t.ticket_types?.name || 'Ticket'}</div>
                                </div>
                                <div class="qr-section">
                                    <div style="font-size:0.8rem;">📱 \${t.customer_phone || ''}</div>
                                    <div style="margin-top:10px;">\${t.status || 'issued'}</div>
                                </div>
                            </div>
                        \`;
                    }).join('');
                } catch (err) {
                    console.error(err);
                    container.innerHTML = '<div class="empty-state">Failed loading tickets</div>';
                }
            }

            function openMyTicketsModal() {
                const modal = document.getElementById('myTicketsModal');
                if (!modal) return;
                renderMyTicketsModal();
                modal.classList.add('show');
            }

            // ========== DELETE EVENT (ADMIN ONLY) ==========
            async function deleteSelectedEvent() {
                if (!selectedEventId) {
                    showToast('No event selected', true);
                    return;
                }
                const eventToDelete = events.find(e => e.id == selectedEventId);
                if (!eventToDelete) return;
                const confirmed = confirm(\`Delete event "\${eventToDelete.name}" and ALL its ticket types?\\n\\nTickets already issued for this event will prevent deletion unless your database has CASCADE DELETE.\`);
                if (!confirmed) return;

                try {
                    // First delete ticket types (they have foreign key to events)
                    const { error: typesError } = await supabase
                        .from('ticket_types')
                        .delete()
                        .eq('event_id', selectedEventId);
                    if (typesError) throw typesError;

                    // Then delete the event
                    const { error: eventError } = await supabase
                        .from('events')
                        .delete()
                        .eq('id', selectedEventId);
                    if (eventError) throw eventError;

                    showToast('✅ Event and ticket types deleted');
                    // Reload events and refresh UI
                    await loadEvents();
                    await refreshMyTicketCount();
                } catch (err) {
                    console.error(err);
                    if (err.message.includes('foreign key')) {
                        showToast('Cannot delete: there are issued tickets for this event. Remove tickets first or set up CASCADE.', true);
                    } else {
                        showToast('Delete failed: ' + err.message, true);
                    }
                }
            }

            // ========== EVENT LISTENERS ==========
            function wireEvents() {
                document.getElementById('myTicketsHeaderBtn')?.addEventListener('click', openMyTicketsModal);
                document.getElementById('closeMyTicketsModal')?.addEventListener('click', () => {
                    document.getElementById('myTicketsModal')?.classList.remove('show');
                });
                document.getElementById('issueTicketBtn')?.addEventListener('click', () => openIssueModal(selectedEventId));
                document.getElementById('closeIssueModal')?.addEventListener('click', closeIssueModal);
                document.getElementById('cancelIssueBtn')?.addEventListener('click', closeIssueModal);
                document.getElementById('modalEventSelect')?.addEventListener('change', async e => {
                    await loadTicketTypesForEvent(e.target.value);
                    foundWalletProfile = null;
                    document.getElementById('confirmIssueBtn').disabled = true;
                });
                document.getElementById('customerPhone')?.addEventListener('input', e => {
                    clearTimeout(phoneDebounceTimer);
                    foundWalletProfile = null;
                    document.getElementById('confirmIssueBtn').disabled = true;
                    phoneDebounceTimer = setTimeout(() => lookupCustomerByPhone(e.target.value), 600);
                });
                document.getElementById('confirmIssueBtn')?.addEventListener('click', issueTicketToWallet);
                document.getElementById('deleteEventBtn')?.addEventListener('click', deleteSelectedEvent);
            }

            // ========== INIT ==========
            async function init() {
                console.log('🚀 Initializing (imported supabase from ../config/supabase.js)');
                wireEvents();
                const loggedIn = await loadSession();
                if (loggedIn) {
                    await refreshMyTicketCount();
                }
                await loadEvents();
            }
            init();
        `);
        document.body.appendChild(script);
    </script>

        .ticket-body { padding: 14px; }
        .features-list { list-style: none; margin-bottom: 14px; }
        .features-list li { padding: 6px 0; font-size: 0.7rem; display: flex; align-items: center; gap: 8px; color: var(--slate); border-bottom: 1px solid var(--border-strong); }
        .feature-icon { color: var(--red); width: 18px; font-size: 0.7rem; }
        .buy-btn { width: 100%; background: var(--red); color: white; border: none; padding: 12px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: var(--transition); }
        .buy-btn:active { transform: scale(0.97); }
        .buy-btn:disabled { background: var(--mist); cursor: not-allowed; }
        .sold-out-tag { background: rgba(0,0,0,0.5); padding: 3px 10px; border-radius: 40px; font-size: 0.6rem; }
        .ticket-card-wallet { background: var(--white); border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--border-strong); margin-bottom: 14px; }
        .ticket-header-wallet { padding: 14px; }
        .ticket-header-wallet.earlyBird { background: linear-gradient(135deg, #0ea5e9, #3b82f6); }
        .ticket-header-wallet.general { background: linear-gradient(135deg, var(--red), var(--red-dark)); }
        .ticket-header-wallet.vip { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .event-name-tag { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.9); }
        .ticket-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 800; color: white; margin: 6px 0; }
        .qr-section { padding: 14px; text-align: center; background: var(--bone); border-top: 1px solid var(--border-strong); }
        .qr-container { background: white; padding: 8px; border-radius: 16px; display: inline-block; margin-bottom: 8px; }
        .manual-checkin-row { font-size: 0.65rem; font-family: monospace; background: var(--white); padding: 6px; border-radius: 40px; color: var(--red); margin: 8px 0; }
        .ticket-footer-wallet { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; background: var(--white); border-top: 1px solid var(--border-strong); }
        .delete-ticket-btn { background: rgba(227,6,19,0.1); border: 1px solid var(--red); color: var(--red); padding: 5px 12px; border-radius: 40px; font-size: 0.65rem; font-weight: 600; cursor: pointer; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 500; display: none; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-card { background: var(--white); border-radius: var(--radius-xl); max-width: 500px; width: 92%; max-height: 85vh; overflow-y: auto; border: 2px solid var(--red); }
        .issue-modal-body { padding: 20px; }
        .issue-field { margin-bottom: 16px; }
        .issue-field label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
        .issue-field input, .issue-field select { width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 10px 14px; font-family: 'Inter', sans-serif; font-size: 0.8rem; outline: none; background: var(--bone); transition: border 0.18s; }
        .issue-field input:focus, .issue-field select:focus { border-color: var(--red); background: var(--white); }
        .lookup-status { font-size: 0.72rem; margin-top: 6px; padding: 6px 10px; border-radius: 8px; display: none; }
        .lookup-status.found { background: #dcfce7; color: #166534; display: block; }
        .lookup-status.notfound { background: #fee2e2; color: #991b1b; display: block; }
        .lookup-status.loading { background: #f1f5f9; color: var(--slate); display: block; }
        .issue-actions { display: flex; gap: 10px; margin-top: 20px; }
        .issue-actions button { flex: 1; padding: 12px; border-radius: var(--radius-full); font-weight: 700; font-size: 0.8rem; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: var(--transition); }
        .btn-cancel { background: var(--bone); color: var(--slate); border: 1px solid var(--border-strong) !important; }
        .btn-issue { background: linear-gradient(135deg, var(--red), var(--red-dark)); color: white; }
        .btn-issue:disabled { background: var(--mist); cursor: not-allowed; }
        .btn-issue:not(:disabled):active { transform: scale(0.97); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--mist); }
        .toast-msg { position: fixed; bottom: 90px; left: 20px; right: 20px; background: var(--ink); color: white; padding: 10px 16px; border-radius: 60px; text-align: center; z-index: 600; display: none; font-weight: 500; font-size: 0.8rem; }
        .toast-msg.show { display: block; animation: fadeUp 0.2s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .dropdown-loading { color: var(--mist); font-style: italic; font-size: 0.75rem; padding: 8px 0; }
        @media (max-width: 480px) { .event-selector label { font-size: 0.65rem; } #eventSelectStore { font-size: 0.7rem; } .issue-btn { padding: 0 10px; font-size: 0.7rem; } }
    </style>
</head>
<body>

<header class="site-header">
    <div class="brand" onclick="window.location.href='home.html'">
        <div class="brand-logo"><i class="fas fa-ticket-alt"></i></div>
        <div class="brand-text">
            <h1>Tickets</h1>
            <p>Digital Wallet</p>
        </div>
    </div>
    <div class="header-right">
        <div class="my-tickets-pill" id="myTicketsHeaderBtn">
            <i class="fas fa-wallet"></i> Issued Tickets
        </div>
    </div>
</header>

<div class="wallet-stats">
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-user"></i></div>
        <div class="stat-info">
            <h3>Customer</h3>
            <div class="stat-number" id="userNameStat" style="font-size:1rem;">Loading...</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-ticket-alt"></i></div>
        <div class="stat-info">
            <h3>My Tickets</h3>
            <div class="stat-number" id="myTicketCountStat">—</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-calendar-check"></i></div>
        <div class="stat-info">
            <h3>All Events</h3>
            <div class="stat-number" id="eventsCountStat">—</div>
        </div>
    </div>
</div>

<div class="tabs-container">
    <button class="tab-btn active" id="tabStoreBtn"><i class="fas fa-store"></i> Ticket Store</button>
</div>

<div id="storePanel">
    <div class="store-header">
        <div class="event-selector">
            <label><i class="fas fa-calendar-alt"></i> Event:</label>
            <select id="eventSelectStore" disabled>
                <option>Loading events…</option>
            </select>
        </div>
        <div class="delete-event-btn" id="deleteEventBtn" title="Delete selected event (admin only)">
            <i class="fas fa-trash-alt"></i>
        </div>
        <button class="issue-btn" id="issueTicketBtn" disabled>
            <i class="fas fa-plus-circle"></i> Issue Ticket
        </button>
    </div>
    <div id="ticketsContainerStore" class="tickets-grid">
        <div class="empty-state"><i class="fas fa-calendar-alt" style="font-size:2rem;display:block;margin-bottom:10px;"></i>Loading events…</div>
    </div>
</div>

<!-- My Issued Tickets Modal -->
<div class="modal-overlay" id="myTicketsModal">
    <div class="modal-card" style="padding:0;">
        <div style="padding: 16px; background: linear-gradient(135deg, var(--red), var(--red-dark)); border-radius: 28px 28px 0 0; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="color: white; font-size: 1.1rem;"><i class="fas fa-ticket-alt"></i> Issued Tickets (All)</h3>
            <button id="closeMyTicketsModal" style="background: rgba(255,255,255,0.2); border: none; width: 32px; height: 32px; border-radius: 50%; color: white; cursor: pointer; font-size: 1.2rem; line-height:1;">&times;</button>
        </div>
        <div id="myTicketsList" style="padding: 16px;"></div>
    </div>
</div>

<!-- Issue Ticket Modal -->
<div class="modal-overlay" id="issueTicketModal">
    <div class="modal-card">
        <div style="padding: 16px; background: linear-gradient(135deg, var(--red), var(--red-dark)); border-radius: 28px 28px 0 0; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="color: white; font-size: 1.1rem;"><i class="fas fa-plus-circle"></i> Issue Ticket to Wallet</h3>
            <button type="button" id="closeIssueModal" style="background: rgba(255,255,255,0.2); border: none; width: 32px; height: 32px; border-radius: 50%; color: white; cursor: pointer; font-size: 1.2rem; line-height:1;">&times;</button>
        </div>
        <div class="issue-modal-body">
            <div class="issue-field">
                <label><i class="fas fa-calendar-alt"></i> Event</label>
                <select id="modalEventSelect">
                    <option value="">Select event…</option>
                </select>
            </div>
            <div class="issue-field">
                <label><i class="fas fa-tag"></i> Ticket Type</label>
                <select id="modalTicketTypeSelect" disabled>
                    <option value="">Select event first…</option>
                </select>
            </div>
            <div class="issue-field">
                <label><i class="fas fa-phone"></i> Customer Phone (Wallet Owner)</label>
                <input type="tel" id="customerPhone" placeholder="+27 XX XXX XXXX" autocomplete="off">
                <div class="lookup-status" id="phoneLookupStatus"></div>
            </div>
            <div class="issue-field" id="walletOwnerInfo" style="display:none;">
                <label><i class="fas fa-user"></i> Wallet Owner Found</label>
                <div id="walletOwnerDisplay" style="font-size:0.8rem; padding:10px; background:var(--bone); border-radius:12px; color:var(--ink-muted);"></div>
            </div>
            <div class="issue-actions">
                <button type="button" class="btn-cancel" id="cancelIssueBtn">Cancel</button>
                <button type="button" class="btn-issue" id="confirmIssueBtn" disabled>
                    <i class="fas fa-paper-plane"></i> Issue to Wallet
                </button>
            </div>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>
</body>
</html>
