<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Butcher Smart Queue - Pre-order Kiosk</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/pre-order.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <div class="brand" onclick="window.location.href='home.html'">
            <img src="../assets/images/rands-logo3.png" alt="Rands Wallet" class="brand-logo" style="width:40px; height:40px; object-fit:contain; background:rgba(255,255,255,0.2); border-radius:var(--radius-md); padding:8px;" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%23E30613\'/%3E%3Ctext x=\'50\' y=\'65\' font-size=\'40\' text-anchor=\'middle\' fill=\'white\'%3ER%3C/text%3E%3C/svg%3E'">
            <div class="brand-text">
                <h1>Butcher Q</h1>
                <p>Smart Queue</p>
            </div>
        </div>
        <div class="header-right">
            <div class="header-icon" id="logoutHeaderBtn"><i class="fas fa-times"></i></div>
        </div>
    </header>

    <!-- ===== TITLE ===== -->
    <div class="smartq-title">
        <h2>🥩 Butcher <span>SmartQ</span></h2>
        <p>Pre-order & join the queue instantly</p>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="kiosk-container">
        <!-- Join Panel -->
        <div class="join-panel">
            <div class="panel-label">Your Contact</div>
            <div class="form-group">
                <label><i class="fab fa-whatsapp"></i> WhatsApp Number</label>
                <input type="tel" id="whatsappNumber" placeholder="e.g. 0635713652" value="" maxlength="10" inputmode="numeric">
                <div class="phone-hint" id="phoneHint">
                    <i class="fas fa-info-circle"></i> Enter 10-digit number
                </div>
            </div>
            <button class="join-btn" id="joinBtn" disabled>
                <i class="fas fa-utensils"></i> Pre-order &amp; Queue
            </button>
        </div>

        <!-- Serving Panel -->
        <div class="serving-panel">
            <h2>🔴 NOW SERVING</h2>
            <div id="butcherServing" class="counter-serving">
                <h3>🥩 The Butcher Counter</h3>
                <div class="serving-number" id="butcherTicket">—</div>
                <div class="serving-sub">Current ticket</div>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">Created by Mziwonke KaBuyaphi</div>

    <!-- ===== MODALS ===== -->
    <!-- Popup Modal -->
    <div id="popupModal" class="popup-modal-overlay">
        <div class="popup-modal">
            <div class="popup-title" id="popupTitle">Notification</div>
            <div class="popup-message" id="popupMessage">Message</div>
            <button class="popup-btn" id="popupOkBtn">OK</button>
        </div>
    </div>

    <script type="module" src="../assets/js/pre-order.js"></script>
</body>
</html>
