<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Rands Wallet | Statement</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF Export Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        /* ========== REFINED STYLES (matching Profile & Pay Now) ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --red: #E30613;
            --red-dark: #a0010e;
            --red-glow: rgba(227,6,19,0.25);
            --glass-bg: rgba(255,255,255,0.75);
            --glass-border: rgba(255,255,255,0.4);
            --ink: #1e293b;
            --ink-muted: #334155;
            --slate: #475569;
            --mist: #94a3b8;
            --bone: #f8fafd;
            --white: #ffffff;
            --shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            --shadow-card: 0 4px 12px rgba(0,0,0,0.04);
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 18px;
            --radius-full: 9999px;
            --border-light: rgba(227,6,19,0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f8;
            transition: background 0.2s;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 32px;
        }

        body.dark {
            --bone: #0f172a;
            --white: #1e293b;
            --ink: #f1f5f9;
            --ink-muted: #cbd5e1;
            --slate: #94a3b8;
            --mist: #64748b;
            --glass-bg: rgba(15,23,42,0.85);
            --glass-border: rgba(255,255,255,0.1);
            background: #0b1120;
        }

        /* Header (matching Profile/Pay Now style) */
        .statement-header {
            max-width: 680px;
            margin: 0 auto;
            padding: 16px 24px 0 24px;
            position: relative;
        }
        .header-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title h1 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .header-title p {
            font-size: 0.7rem;
            color: var(--mist);
            margin-top: 4px;
        }
        .close-statement-btn {
            background: var(--bone);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid rgba(227,6,19,0.15);
            color: var(--red);
            font-size: 1.1rem;
        }
        .close-statement-btn:active { transform: scale(0.94); background: var(--white); }

        /* Main container */
        .statement-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 20px 24px 40px;
        }

        /* Stats grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 16px 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
            transition: all 0.2s;
        }
        .stat-card:active { transform: scale(0.98); background: var(--bone); }
        .stat-icon {
            width: 48px;
            height: 48px;
            background: rgba(227,6,19,0.08);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 1.3rem;
        }
        .stat-info h3 {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--mist);
            letter-spacing: 0.5px;
        }
        .stat-number {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--ink);
        }
        .trend-badge {
            background: #e6f7e6;
            color: #10b981;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
        }

        /* Recent Transactions Section (NEW - shows last 10) */
        .recent-section {
            margin-bottom: 32px;
        }
        .section-title {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--mist);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .recent-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .recent-item {
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.2s;
        }
        .recent-item:active { transform: scale(0.98); background: var(--bone); }
        .recent-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .recent-icon {
            width: 40px;
            height: 40px;
            background: rgba(227,6,19,0.08);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 1rem;
        }
        .recent-details h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--ink);
        }
        .recent-details p {
            font-size: 0.65rem;
            color: var(--mist);
            margin-top: 2px;
        }
        .recent-amount {
            font-weight: 800;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .recent-amount.positive { color: #10b981; }
        .recent-amount.negative { color: var(--red); }

        /* Filter pills */
        .filter-section {
            margin-bottom: 24px;
        }
        .pills-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-pill {
            background: var(--white);
            padding: 8px 18px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            border: 1px solid var(--border-light);
            color: var(--slate);
            transition: all 0.2s cubic-bezier(0.2,0.9,0.4,1.1);
        }
        .filter-pill.active {
            background: linear-gradient(95deg, var(--red), var(--red-dark));
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px var(--red-glow);
        }
        .filter-pill:active { transform: scale(0.96); }

        /* Full transaction history cards */
        .transactions-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .transaction-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 16px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.2s;
        }
        .transaction-card:active { transform: scale(0.99); background: var(--bone); }
        .tx-icon {
            width: 52px;
            height: 52px;
            background: rgba(227,6,19,0.08);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--red);
            flex-shrink: 0;
        }
        .tx-details { flex: 2; }
        .tx-title {
            font-weight: 800;
            font-size: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }
        .tx-merchant { font-weight: 700; color: var(--ink); }
        .tx-amount {
            font-weight: 800;
            font-size: 1rem;
            white-space: nowrap;
        }
        .tx-amount.positive { color: #10b981; }
        .tx-amount.negative { color: var(--red); }
        .tx-type {
            font-size: 0.65rem;
            color: var(--mist);
            margin-top: 4px;
        }
        .tx-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
            font-size: 0.6rem;
            color: var(--mist);
            align-items: center;
        }
        .status-badge {
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .status-success { background: #e6f7e6; color: #10b981; }
        .status-pending { background: #fff8e5; color: #f59e0b; }
        .status-failed { background: #fee2e2; color: #ef4444; }
        .status-refunded { background: #e0f2fe; color: #0284c7; }
        .ref-id {
            font-family: monospace;
            font-size: 0.55rem;
            background: var(--bone);
            padding: 2px 8px;
            border-radius: 20px;
        }

        /* Load more & empty state */
        .load-more-btn {
            background: transparent;
            border: 1.5px solid var(--red);
            color: var(--red);
            padding: 12px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.8rem;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .load-more-btn:active { transform: scale(0.96); background: rgba(227,6,19,0.05); }
        .empty-state {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 48px 24px;
            text-align: center;
            border: 1px solid var(--border-light);
            color: var(--mist);
        }
        .empty-state button {
            background: linear-gradient(95deg, var(--red), var(--red-dark));
            border: none;
            margin-top: 16px;
            padding: 10px 24px;
            border-radius: var(--radius-full);
            color: white;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--red-glow);
        }

        /* PDF Export Button */
        .pdf-export-wrapper {
            margin: 16px 0 8px;
        }
        .pdf-export-btn {
            background: linear-gradient(95deg, var(--red), var(--red-dark));
            border: none;
            padding: 12px 16px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.8rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 4px 12px var(--red-glow);
        }
        .pdf-export-btn:active { transform: scale(0.96); }

        /* Skeleton */
        .skeleton-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            gap: 14px;
            border: 1px solid var(--border-light);
        }
        .skeleton-icon { width: 52px; height: 52px; background: #e2e8f0; border-radius: var(--radius-md); animation: pulse 1.2s infinite; }
        .skeleton-text { flex: 2; }
        .skeleton-line { height: 14px; background: #e2e8f0; border-radius: 20px; margin-bottom: 8px; width: 70%; animation: pulse 1.2s infinite; }
        .skeleton-line.short { width: 40%; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        @media (max-width: 480px) {
            .statement-container { padding: 16px 16px 32px; }
            .stat-number { font-size: 1.1rem; }
            .tx-title { flex-direction: column; align-items: flex-start; }
            .stats-grid { gap: 10px; }
        }
    </style>
</head>
<body>

<div class="statement-header">
    <div class="header-card">
        <div class="header-title">
            <h1><i class="fas fa-receipt" style="margin-right: 6px;"></i> Statement</h1>
            <p>Your wallet activity & history</p>
        </div>
        <div class="close-statement-btn" id="closeStatementBtn">
            <i class="fas fa-times"></i>
        </div>
    </div>
</div>

<div class="statement-container" id="statementContainer">
    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-coins"></i></div>
            <div class="stat-info">
                <h3>Current Balance</h3>
                <div class="stat-number" id="currentBalanceSpan">R0.00</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
            <div class="stat-info">
                <h3>Total Spent</h3>
                <div class="stat-number" id="totalSpentSpan">R0.00</div>
                <span class="trend-badge"><i class="fas fa-arrow-down"></i> vs last month</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-download"></i></div>
            <div class="stat-info">
                <h3>Total Deposited</h3>
                <div class="stat-number" id="totalDepositedSpan">R0.00</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-gift"></i></div>
            <div class="stat-info">
                <h3>Refunded Cash</h3>
                <div class="stat-number" id="totalRewardsSpan">R0.00</div>
            </div>
        </div>
    </div>

    <!-- RECENT TRANSACTIONS SECTION: Last 10 transactions -->
    <div class="recent-section" id="recentSection" style="display: none;">
        <div class="section-title"><i class="fas fa-clock" style="color: var(--red);"></i> Last 10 Transactions</div>
        <div id="recentTransactionsList" class="recent-grid"></div>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <div class="section-title"><i class="fas fa-filter" style="color: var(--red);"></i> Filter history</div>
        <div class="pills-row" id="filterPillsRow"></div>
    </div>

    <!-- Full Transaction History -->
    <div id="transactionsList" class="transactions-container"></div>
    <div id="loadMoreContainer"></div>

    <!-- PDF Export Button -->
    <div class="pdf-export-wrapper">
        <button class="pdf-export-btn" id="exportPdfBtn"><i class="fas fa-file-pdf"></i> Download Statement as PDF</button>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
    }
</script>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // ========== STATE ==========
    let currentUser = null;
    let walletId = null;
    let allTransactions = [];
    let displayedTransactions = [];
    let currentOffset = 0;
    const PAGE_SIZE = 15;
    let isLoading = false;
    let activeChip = "all";

    // DOM elements
    const balanceEl = document.getElementById("currentBalanceSpan");
    const totalSpentEl = document.getElementById("totalSpentSpan");
    const totalDepositedEl = document.getElementById("totalDepositedSpan");
    const refundedCashEl = document.getElementById("totalRewardsSpan");
    const transactionsContainer = document.getElementById("transactionsList");
    const loadMoreContainer = document.getElementById("loadMoreContainer");
    const recentSection = document.getElementById("recentSection");
    const recentList = document.getElementById("recentTransactionsList");

    // Helper: category mapping
    function getTxCategory(tx) {
        const type = tx.type?.toLowerCase() || '';
        if (type === 'deposit') return 'deposit';
        if (type === 'purchase') return 'purchase';
        if (type === 'ticket') return 'ticket';
        if (type === 'refund') return 'refund';
        if (type === 'reward') return 'reward';
        if (tx.description?.toLowerCase().includes('refund')) return 'refund';
        if (tx.description?.toLowerCase().includes('cashback')) return 'reward';
        return 'other';
    }

    // Summary stats
    function updateSummaryStats() {
        let totalSpent = 0, totalDeposited = 0, refundedCash = 0;
        for (const tx of allTransactions) {
            const cat = getTxCategory(tx);
            const amount = Number(tx.amount) || 0;
            const isSuccess = tx.status === 'success' || tx.status === 'completed' || tx.status === 'paid' || tx.status === 'refunded';
            if (!isSuccess) continue;

            if (cat === 'purchase' || cat === 'ticket') {
                totalSpent += Math.abs(amount);
            } else if (cat === 'deposit') {
                totalDeposited += Math.abs(amount);
            } else if (cat === 'refund' || cat === 'reward') {
                refundedCash += Math.abs(amount);
            } else {
                if (amount < 0) totalSpent += Math.abs(amount);
                else if (amount > 0) totalDeposited += amount;
            }
        }
        totalSpentEl.innerText = `R${totalSpent.toFixed(2)}`;
        totalDepositedEl.innerText = `R${totalDeposited.toFixed(2)}`;
        refundedCashEl.innerText = `R${refundedCash.toFixed(2)}`;
    }

    async function fetchWalletBalance() {
        if (!walletId) return;
        const { data, error } = await supabase.from('wallets').select('balance').eq('id', walletId).single();
        if (!error && data) {
            balanceEl.innerText = `R${(data.balance || 0).toFixed(2)}`;
        }
    }

    async function loadAllTransactions() {
        if (!walletId) return [];
        const { data, error } = await supabase
            .from('wallet_transactions')
            .select('*')
            .eq('wallet_id', walletId)
            .order('created_at', { ascending: false });
        if (error) {
            console.error("Error loading transactions:", error);
            return [];
        }
        allTransactions = data || [];
        updateSummaryStats();
        await fetchWalletBalance();
        return allTransactions;
    }

    // Render LAST 10 transactions (recent section)
    function renderRecentTransactions() {
        if (!allTransactions.length) {
            recentSection.style.display = 'none';
            return;
        }
        const lastTen = allTransactions.slice(0, 10);
        if (lastTen.length === 0) {
            recentSection.style.display = 'none';
            return;
        }
        recentSection.style.display = 'block';
        let html = '';
        for (const tx of lastTen) {
            const amount = Number(tx.amount) || 0;
            const isPositive = (tx.type === 'refund' || tx.type === 'reward' || amount > 0);
            const sign = isPositive ? '+' : '-';
            const amountClass = isPositive ? 'positive' : 'negative';
            const formattedAmount = `${sign} R${Math.abs(amount).toFixed(2)}`;
            const dateObj = tx.created_at ? new Date(tx.created_at) : new Date();
            const formattedDate = `${dateObj.toLocaleDateString()} ${dateObj.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
            let icon = "fa-exchange-alt";
            const cat = getTxCategory(tx);
            if (cat === "deposit") icon = "fa-plus-circle";
            else if (cat === "purchase") icon = "fa-shopping-bag";
            else if (cat === "ticket") icon = "fa-ticket-alt";
            else if (cat === "refund") icon = "fa-undo-alt";
            else if (cat === "reward") icon = "fa-gift";
            const merchant = tx.description || tx.type || "Transaction";
            html += `
                <div class="recent-item">
                    <div class="recent-info">
                        <div class="recent-icon"><i class="fas ${icon}"></i></div>
                        <div class="recent-details">
                            <h4>${escapeHtml(merchant)}</h4>
                            <p>${formattedDate}</p>
                        </div>
                    </div>
                    <div class="recent-amount ${amountClass}">${formattedAmount}</div>
                </div>
            `;
        }
        recentList.innerHTML = html;
    }

    function getFilteredTransactions() {
        if (activeChip === "all") return [...allTransactions];
        let filtered = [];
        for (const tx of allTransactions) {
            const cat = getTxCategory(tx);
            if (activeChip === "deposits" && cat === "deposit") filtered.push(tx);
            else if (activeChip === "purchases" && (cat === "purchase" || cat === "ticket")) filtered.push(tx);
            else if (activeChip === "tickets" && cat === "ticket") filtered.push(tx);
            else if (activeChip === "refunds" && cat === "refund") filtered.push(tx);
            else if (activeChip === "failed" && tx.status === "failed") filtered.push(tx);
            else if (activeChip === "pending" && (tx.status === "pending" || tx.status === "processing")) filtered.push(tx);
        }
        return filtered;
    }

    function renderTransactions() {
        const toShow = displayedTransactions;
        if (toShow.length === 0 && !isLoading) {
            transactionsContainer.innerHTML = `<div class="empty-state"><i class="fas fa-receipt"></i><p>No transactions found</p><button id="resetHomeBtn">Return Home</button></div>`;
            const resetBtn = document.getElementById("resetHomeBtn");
            if (resetBtn) resetBtn.onclick = () => window.location.href = "home.html";
            loadMoreContainer.innerHTML = "";
            return;
        }
        let html = "";
        for (const tx of toShow) {
            const amount = Number(tx.amount) || 0;
            const direction = tx.direction?.toLowerCase() === 'debit' ? 'debit' : (amount > 0 ? 'credit' : 'debit');
            const isPositive = (direction === 'credit' && amount > 0) || (tx.type === 'refund' || tx.type === 'reward');
            const sign = isPositive ? "+" : "-";
            const amountClass = isPositive ? "positive" : "negative";
            const formattedAmount = `${sign} R${Math.abs(amount).toFixed(2)}`;
            let statusClass = "status-success";
            let statusText = tx.status?.charAt(0).toUpperCase() + tx.status?.slice(1) || "Success";
            if (tx.status === "pending") { statusClass = "status-pending"; statusText = "Pending"; }
            else if (tx.status === "failed") { statusClass = "status-failed"; statusText = "Failed"; }
            else if (tx.status === "refunded") { statusClass = "status-refunded"; statusText = "Refunded"; }
            const dateObj = tx.created_at ? new Date(tx.created_at) : new Date();
            const formattedDate = `${dateObj.toLocaleDateString()} • ${dateObj.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
            const refId = tx.provider_reference || tx.id.slice(-8).toUpperCase();
            let icon = "fa-exchange-alt";
            const cat = getTxCategory(tx);
            if (cat === "deposit") icon = "fa-plus-circle";
            else if (cat === "purchase") icon = "fa-shopping-bag";
            else if (cat === "ticket") icon = "fa-ticket-alt";
            else if (cat === "refund") icon = "fa-undo-alt";
            else if (cat === "reward") icon = "fa-gift";
            const merchant = tx.description || tx.type || "Transaction";
            const typeLabel = tx.type ? tx.type.charAt(0).toUpperCase() + tx.type.slice(1) : "Activity";
            html += `
                <div class="transaction-card">
                    <div class="tx-icon"><i class="fas ${icon}"></i></div>
                    <div class="tx-details">
                        <div class="tx-title">
                            <span class="tx-merchant">${escapeHtml(merchant)}</span>
                            <span class="tx-amount ${amountClass}">${formattedAmount}</span>
                        </div>
                        <div class="tx-type">${typeLabel}</div>
                        <div class="tx-meta">
                            <span><i class="far fa-calendar-alt"></i> ${formattedDate}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <span class="ref-id"><i class="fas fa-hashtag"></i> ${refId}</span>
                        </div>
                    </div>
                </div>
            `;
        }
        transactionsContainer.innerHTML = html;
        const filteredTotal = getFilteredTransactions().length;
        if (currentOffset < filteredTotal) {
            loadMoreContainer.innerHTML = `<button class="load-more-btn" id="loadMoreBtn"><i class="fas fa-arrow-down"></i> Load more transactions</button>`;
            document.getElementById("loadMoreBtn")?.addEventListener("click", loadMoreTransactions);
        } else {
            loadMoreContainer.innerHTML = `<button class="load-more-btn" disabled style="opacity:0.5;">✨ All transactions loaded</button>`;
        }
    }

    async function loadMoreTransactions() {
        if (isLoading) return;
        isLoading = true;
        loadMoreContainer.innerHTML = `<div class="skeleton-card"><div class="skeleton-icon"></div><div class="skeleton-text"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>`;
        await new Promise(resolve => setTimeout(resolve, 500));
        const filtered = getFilteredTransactions();
        const nextOffset = currentOffset + PAGE_SIZE;
        const newItems = filtered.slice(currentOffset, nextOffset);
        if (newItems.length > 0) {
            displayedTransactions.push(...newItems);
            currentOffset = nextOffset;
        }
        renderTransactions();
        isLoading = false;
    }

    function resetPaginationAndFilter() {
        const filtered = getFilteredTransactions();
        currentOffset = PAGE_SIZE;
        displayedTransactions = filtered.slice(0, PAGE_SIZE);
        renderTransactions();
        renderRecentTransactions(); // refresh recent after data load
    }

    async function refreshAllData() {
        await loadAllTransactions();
        resetPaginationAndFilter();
    }

    // Filter pills
    function initFilterPills() {
        const pillOptions = ["all", "deposits", "purchases", "tickets", "refunds", "failed", "pending"];
        const pillLabels = {
            all: "All", deposits: "Deposits", purchases: "Purchases", tickets: "Tickets",
            refunds: "Refunds", failed: "Failed", pending: "Pending"
        };
        const row = document.getElementById("filterPillsRow");
        row.innerHTML = pillOptions.map(opt => `<div class="filter-pill ${opt === activeChip ? 'active' : ''}" data-filter="${opt}">${pillLabels[opt]}</div>`).join('');
        document.querySelectorAll(".filter-pill").forEach(pill => {
            pill.addEventListener("click", () => {
                activeChip = pill.dataset.filter;
                document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
                pill.classList.add("active");
                const filtered = getFilteredTransactions();
                currentOffset = PAGE_SIZE;
                displayedTransactions = filtered.slice(0, PAGE_SIZE);
                renderTransactions();
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Auth & wallet init
    async function initAuthAndWallet() {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            window.location.href = '../login.html';
            return false;
        }
        currentUser = session.user;
        const { data: wallet, error: walletErr } = await supabase.from('wallets').select('id').eq('user_id', currentUser.id).single();
        if (walletErr) {
            const { data: newWallet, error: createErr } = await supabase.from('wallets').insert({ user_id: currentUser.id, balance: 0 }).select().single();
            if (createErr) {
                console.error(createErr);
                return false;
            }
            walletId = newWallet.id;
        } else {
            walletId = wallet.id;
        }
        return true;
    }

    async function loadData() {
        if (!walletId) return;
        transactionsContainer.innerHTML = `
            <div class="skeleton-card"><div class="skeleton-icon"></div><div class="skeleton-text"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-icon"></div><div class="skeleton-text"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>`;
        await loadAllTransactions();
        renderRecentTransactions(); // show last 10
        const filtered = getFilteredTransactions();
        currentOffset = PAGE_SIZE;
        displayedTransactions = filtered.slice(0, PAGE_SIZE);
        renderTransactions();
    }

    // PDF Export (includes recent + full history)
    async function exportStatementPDF() {
        const exportContainer = document.createElement('div');
        exportContainer.style.background = '#ffffff';
        exportContainer.style.padding = '24px';
        exportContainer.style.fontFamily = 'Inter, sans-serif';
        exportContainer.style.width = '100%';
        exportContainer.style.maxWidth = '800px';
        exportContainer.style.margin = '0 auto';
        
        const headerHtml = `
            <div style="text-align: center; margin-bottom: 24px; border-bottom: 2px solid #E30613; padding-bottom: 16px;">
                <h1 style="color: #E30613; font-weight: 800;">Rands Wallet Statement</h1>
                <p style="color: #475569;">Generated on ${new Date().toLocaleString()}</p>
                <p style="font-size: 0.8rem; color: #64748b;">User: ${currentUser?.email || 'Member'}</p>
            </div>
        `;
        
        // Recent 10 section in PDF
        let recentHtml = `<h3 style="margin: 20px 0 12px;">📋 Last 10 Transactions</h3><table style="width:100%; border-collapse:collapse;">`;
        const lastTen = allTransactions.slice(0, 10);
        if (lastTen.length) {
            recentHtml += `<thead><tr style="background:#f1f5f9;"><th style="padding:8px; text-align:left;">Date</th><th>Description</th><th style="text-align:right;">Amount</th></tr></thead><tbody>`;
            for (const tx of lastTen) {
                const amount = Number(tx.amount) || 0;
                const sign = amount > 0 ? '+' : '-';
                const formattedAmount = `${sign} R${Math.abs(amount).toFixed(2)}`;
                const date = tx.created_at ? new Date(tx.created_at).toLocaleString() : '-';
                const desc = tx.description || tx.type || 'Transaction';
                recentHtml += `<tr style="border-bottom:1px solid #e2e8f0;">
                    <td style="padding:6px;">${date}</td>
                    <td>${escapeHtml(desc)}</td>
                    <td style="text-align:right;">${formattedAmount}</td>
                 </tr>`;
            }
            recentHtml += `</tbody>`;
        } else {
            recentHtml += `<tr><td colspan="3" style="padding:20px; text-align:center;">No recent transactions</td></tr>`;
        }
        recentHtml += `</table>`;
        
        // Full history table
        let fullHtml = `<h3 style="margin: 30px 0 12px;">📜 Full Transaction History (${activeChip.toUpperCase()})</h3><table style="width:100%; border-collapse:collapse;">`;
        const txsToExport = displayedTransactions;
        if (txsToExport.length === 0) {
            fullHtml += `<tr><td style="padding: 20px; text-align: center;">No transactions found for this filter</td></tr>`;
        } else {
            fullHtml += `<thead><tr style="background:#f1f5f9;"><th style="padding:8px; text-align:left;">Date</th><th>Description</th><th style="text-align:right;">Amount</th><th>Status</th></tr></thead><tbody>`;
            for (const tx of txsToExport) {
                const amount = Number(tx.amount) || 0;
                const sign = amount > 0 ? '+' : '-';
                const formattedAmount = `${sign} R${Math.abs(amount).toFixed(2)}`;
                const date = tx.created_at ? new Date(tx.created_at).toLocaleString() : '-';
                const desc = tx.description || tx.type || 'Transaction';
                const status = tx.status || 'completed';
                fullHtml += `<tr style="border-bottom:1px solid #e2e8f0;">
                    <td style="padding:6px;">${date}</td>
                    <td>${escapeHtml(desc)}</td>
                    <td style="text-align:right;">${formattedAmount}</td>
                    <td><span style="background:${status === 'success' ? '#e6f7e6' : '#fee2e2'}; padding:2px 8px; border-radius:20px;">${status}</span></td>
                 </tr>`;
            }
            fullHtml += `</tbody>`;
        }
        fullHtml += `</table><p style="margin-top: 20px; font-size:0.7rem; color:#94a3b8;">Rands Wallet • Secure cashless ecosystem</p>`;
        exportContainer.innerHTML = headerHtml + recentHtml + fullHtml;
        
        const opt = {
            margin: [0.5, 0.5, 0.5, 0.5],
            filename: `rands_statement_${new Date().toISOString().slice(0,19)}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, letterRendering: true },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(exportContainer).save();
    }

    // Navigation
    document.getElementById("closeStatementBtn")?.addEventListener("click", () => {
        window.location.href = "home.html";
    });
    document.getElementById("exportPdfBtn")?.addEventListener("click", exportStatementPDF);

    // Initialize
    (async () => {
        const ok = await initAuthAndWallet();
        if (!ok) return;
        initFilterPills();
        await loadData();
    })();
</script>
</body>
</html>
