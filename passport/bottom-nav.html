<!-- bottom-nav.html -->
<!-- ONLY the nav + modal + script -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* RESET any page-level interference */
.bottom-nav-wrapper,
.bottom-nav-wrapper * {
    all: revert; /* reset inherited styles */
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
/* re-apply essential styles after revert */
.bottom-nav-wrapper {
    display: block;
}
:root {
    --nav-bg: rgba(255,255,255,0.98);
    --nav-active: #ffffff;
    --nav-inactive: #E30613;
    --nav-shadow: 0 -8px 25px rgba(0,0,0,0.08);
    --nav-radius: 28px;
    --nav-height: 72px;
    --nav-padding: 6px 12px;
}

body {
    padding-bottom: calc(var(--nav-height) + 24px) !important;
    margin: 0 !important;
}

/* ---------- BOTTOM NAV (fully responsive & resilient) ---------- */
.bottom-nav {
    position: fixed !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    z-index: 9999 !important;
    background: var(--nav-bg) !important;
    backdrop-filter: blur(20px) !important;
    border-radius: var(--nav-radius) var(--nav-radius) 0 0 !important;
    border-top: 1px solid rgba(0,0,0,0.05) !important;
    box-shadow: var(--nav-shadow) !important;
    padding: var(--nav-padding) !important;
    transition: transform 0.3s ease !important;
    width: 100% !important;
}

.bottom-nav.hide {
    transform: translateY(100%) !important;
}

.nav-items {
    display: flex !important;
    align-items: center !important;
    justify-content: space-around !important;
    max-width: 600px !important;
    margin: 0 auto !important;
    gap: 4px !important;
    width: 100% !important;
    padding: 0 !important;
}

.nav-item {
    flex: 1 !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 3px !important;
    border-radius: 40px !important;
    padding: 6px 4px !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
    position: relative !important;
    min-width: 0 !important;
    text-align: center !important;
    background: transparent !important;
    border: none !important;
}

.nav-item:active {
    transform: scale(0.94) !important;
}

.nav-icon {
    font-size: 1.2rem !important;
}

.nav-label {
    font-size: 0.6rem !important;
    font-weight: 700 !important;
    letter-spacing: 0.2px !important;
    white-space: nowrap !important;
}

.nav-item .nav-icon,
.nav-item .nav-label {
    color: var(--nav-inactive) !important;
}

.nav-item.active {
    background: linear-gradient(135deg, #E30613, #9f020d) !important;
    box-shadow: 0 4px 12px rgba(227,6,19,0.25) !important;
}

.nav-item.active .nav-icon,
.nav-item.active .nav-label {
    color: white !important;
}

.nav-item.active::after {
    content: "" !important;
    position: absolute !important;
    bottom: -5px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    width: 5px !important;
    height: 5px !important;
    background: white !important;
    border-radius: 50% !important;
}

/* ---------- MODAL (fully responsive) ---------- */
.transact-modal-overlay {
    position: fixed !important;
    inset: 0 !important;
    background: rgba(0,0,0,0.55) !important;
    backdrop-filter: blur(8px) !important;
    z-index: 10000 !important;
    display: flex !important;
    align-items: flex-end !important;
    justify-content: center !important;
    visibility: hidden !important;
    opacity: 0 !important;
    transition: 0.3s ease !important;
}

.transact-modal-overlay.active {
    visibility: visible !important;
    opacity: 1 !important;
}

.transact-modal {
    width: 100% !important;
    max-width: 500px !important;
    background: white !important;
    border-radius: 30px 30px 0 0 !important;
    transform: translateY(100%) !important;
    transition: transform 0.35s ease !important;
    max-height: 85vh !important;
    overflow-y: auto !important;
}

.transact-modal-overlay.active .transact-modal {
    transform: translateY(0) !important;
}

.modal-drag-handle {
    width: 42px !important;
    height: 5px !important;
    background: #e2e8f0 !important;
    border-radius: 20px !important;
    margin: 12px auto 0 !important;
}

.modal-header {
    padding: 20px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    border-bottom: 1px solid #eef2f8 !important;
    flex-wrap: wrap !important;
}

.modal-header h2 {
    margin: 0 !important;
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    font-size: 1.15rem !important;
    font-weight: 800 !important;
    color: #0f172a !important;
}

.modal-close {
    width: 38px !important;
    height: 38px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border-radius: 50% !important;
    background: #f8fafc !important;
    cursor: pointer !important;
}

.modal-close i {
    color: #475569 !important;
}

.modal-body {
    padding: 18px 20px 30px !important;
}

.transact-options-grid {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 14px !important;
}

.transact-option-card {
    background: white !important;
    border: 1px solid #edf2f7 !important;
    border-radius: 24px !important;
    padding: 16px 10px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    text-align: center !important;
    gap: 8px !important;
    cursor: pointer !important;
    transition: 0.2s ease !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04) !important;
}

.transact-option-card:active {
    transform: scale(0.96) !important;
}

.transact-option-icon {
    width: 48px !important;
    height: 48px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border-radius: 16px !important;
    background: linear-gradient(135deg,#E30613,#9f020d) !important;
}

.transact-option-icon i {
    color: white !important;
    font-size: 1.2rem !important;
}

.transact-option-info h3 {
    margin: 0 !important;
    font-size: 0.8rem !important;
    font-weight: 700 !important;
    color: #0f172a !important;
}

.transact-option-info p {
    margin-top: 3px !important;
    font-size: 0.6rem !important;
    color: #64748b !important;
    line-height: 1.3 !important;
}

/* ---------- RESPONSIVE BREAKPOINTS ---------- */
@media (max-width: 480px) {
    :root {
        --nav-height: 62px;
        --nav-padding: 4px 8px;
    }
    .nav-icon {
        font-size: 1rem !important;
    }
    .nav-label {
        font-size: 0.5rem !important;
    }
    .nav-item {
        padding: 5px 2px !important;
        gap: 2px !important;
    }
    .transact-options-grid {
        grid-template-columns: 1fr !important;
        gap: 12px !important;
    }
    .transact-option-card {
        flex-direction: row !important;
        justify-content: flex-start !important;
        gap: 14px !important;
        padding: 12px 16px !important;
        text-align: left !important;
    }
    .transact-option-icon {
        width: 44px !important;
        height: 44px !important;
    }
    .transact-option-info h3 {
        font-size: 0.85rem !important;
    }
    .transact-option-info p {
        font-size: 0.65rem !important;
    }
    .modal-header {
        padding: 16px !important;
    }
    .modal-body {
        padding: 16px !important;
    }
}

@media (max-width: 380px) {
    .nav-label {
        display: none !important;
    }
    .nav-icon {
        font-size: 1.2rem !important;
    }
    .nav-item {
        padding: 8px 0 !important;
    }
}
</style>

<div class="bottom-nav-wrapper">
    <nav class="bottom-nav" id="bottomNav">
        <div class="nav-items">
            <div class="nav-item" data-url="home.html">
                <i class="fas fa-home nav-icon"></i>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item" data-url="vvip.html">
                <i class="fas fa-crown nav-icon"></i>
                <span class="nav-label">VVIP</span>
            </div>
            <div class="nav-item" data-modal="true">
                <i class="fas fa-exchange-alt nav-icon"></i>
                <span class="nav-label">Transact</span>
            </div>
            <div class="nav-item" data-url="lockers-vault.html">
                <i class="fas fa-wine-bottle nav-icon"></i>
                <span class="nav-label">Lockers</span>
            </div>
            <div class="nav-item" data-url="profile.html">
                <i class="fas fa-user-circle nav-icon"></i>
                <span class="nav-label">Profile</span>
            </div>
        </div>
    </nav>

    <div class="transact-modal-overlay" id="transactModalOverlay">
        <div class="transact-modal">
            <div class="modal-drag-handle"></div>
            <div class="modal-header">
                <h2>
                    <i class="fas fa-exchange-alt" style="color:#E30613;"></i>
                    Transact
                </h2>
                <div class="modal-close" id="closeTransactModal">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="modal-body">
                <div class="transact-options-grid">
                    <div class="transact-option-card" data-redirect="order.html">
                        <div class="transact-option-icon">
                            <i class="fas fa-receipt"></i>
                        </div>
                        <div class="transact-option-info">
                            <h3>Order Now</h3>
                            <p>Buy booze, food & drinks</p>
                        </div>
                    </div>
                    <div class="transact-option-card" data-redirect="pre-order.html">
                        <div class="transact-option-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="transact-option-info">
                            <h3>Queue Now</h3>
                            <p>The Butcher virtual queue</p>
                        </div>
                    </div>
                    <div class="transact-option-card" data-redirect="shisha.html">
                        <div class="transact-option-icon">
                            <i class="fas fa-smoking"></i>
                        </div>
                        <div class="transact-option-info">
                            <h3>Smoke Hookah</h3>
                            <p>Premium shisha lounge</p>
                        </div>
                    </div>
                    <div class="transact-option-card" data-redirect="tickets.html">
                        <div class="transact-option-icon">
                            <i class="fas fa-ticket-alt"></i>
                        </div>
                        <div class="transact-option-info">
                            <h3>Buy Tickets</h3>
                            <p>Purchase event tickets</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    let currentFile = window.location.pathname.split('/').pop();
    if (currentFile === '' || currentFile === 'index.html') {
        currentFile = 'home.html';
    }

    const navItems = document.querySelectorAll('.nav-item');
    const modal = document.getElementById('transactModalOverlay');
    const closeBtn = document.getElementById('closeTransactModal');
    const bottomNav = document.getElementById('bottomNav');

    navItems.forEach(item => {
        const itemUrl = item.dataset.url;
        if (itemUrl && itemUrl === currentFile) {
            item.classList.add('active');
        }
    });

    navItems.forEach(item => {
        item.addEventListener('click', (e) => {
            e.preventDefault();
            const isModal = item.dataset.modal === 'true';
            const url = item.dataset.url;

            if (isModal) {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                return;
            }

            if (url) {
                window.location.href = url;
            }
        });
    });

    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    document.querySelectorAll('.transact-option-card').forEach(card => {
        card.addEventListener('click', () => {
            const redirect = card.dataset.redirect;
            closeModal();
            setTimeout(() => {
                window.location.href = redirect;
            }, 150);
        });
    });

    let lastScroll = 0;
    let ticking = false;
    window.addEventListener('scroll', () => {
        if (!ticking) {
            requestAnimationFrame(() => {
                const currentScroll = window.pageYOffset;
                if (currentScroll <= 30) {
                    bottomNav.classList.remove('hide');
                } else if (currentScroll > lastScroll && currentScroll > 80) {
                    bottomNav.classList.add('hide');
                } else {
                    bottomNav.classList.remove('hide');
                }
                lastScroll = currentScroll;
                ticking = false;
            });
            ticking = true;
        }
    }, { passive: true });

    closeModal();

    if (document.body.scrollHeight <= window.innerHeight) {
        bottomNav.classList.remove('hide');
    }
})();
</script>
