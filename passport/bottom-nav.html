<div class="bottom-nav-wrapper">
    <nav class="bottom-nav" id="bottomNav">
        <div class="nav-items">
            <div class="nav-item" data-url="tickets.html">
                <i class="fas fa-ticket-alt nav-icon"></i>
                <span class="nav-label">Tickets</span>
            </div>
            <div class="nav-item" data-url="vvip.html">
                <i class="fas fa-crown nav-icon"></i>
                <span class="nav-label">VVIP</span>
            </div>
            <div class="nav-item" data-url="order.html">
                <i class="fas fa-receipt nav-icon"></i>
                <span class="nav-label">Order</span>
            </div>
            <div class="nav-item" data-url="shisha.html">
                <i class="fas fa-smoking nav-icon"></i>
                <span class="nav-label">Shisha</span>
            </div>
            <div class="nav-item" data-url="lockers-vault.html">
                <i class="fas fa-cubes nav-icon"></i>
                <span class="nav-label">Lockers</span>
            </div>
        </div>
    </nav>
</div>

<style>
    .bottom-nav-wrapper {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        background: white;
        border-top: 1px solid #eef2f8;
        border-radius: 30px 30px 0 0;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
        padding: 8px 16px 20px 16px;
    }
    
    .bottom-nav {
        max-width: 480px;
        margin: 0 auto;
    }
    
    .nav-items {
        display: flex;
        justify-content: space-around;
        align-items: center;
    }
    
    .nav-item {
        text-align: center;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        transition: all 0.2s ease;
    }
    
    .nav-item:active {
        transform: scale(0.95);
    }
    
    .nav-item i {
        font-size: 1.3rem;
        color: #94a3b8;
        transition: color 0.2s ease;
    }
    
    .nav-item span {
        font-size: 0.7rem;
        font-weight: 500;
        color: #94a3b8;
        transition: color 0.2s ease;
    }
    
    .nav-item.active i,
    .nav-item.active span {
        color: #E30613;
    }
</style>

<script>
    (function initNav() {
        const navItems = document.querySelectorAll('.nav-item');
        const currentPage = window.location.pathname.split('/').pop();
        
        navItems.forEach(item => {
            const targetUrl = item.getAttribute('data-url');
            
            if (targetUrl === currentPage) {
                item.classList.add('active');
            }
            
            item.addEventListener('click', (e) => {
                e.preventDefault();
                if (targetUrl && targetUrl !== currentPage) {
                    window.location.href = targetUrl;
                }
            });
        });
        
        const navWrapper = document.querySelector('.bottom-nav-wrapper');
        if (navWrapper && !document.getElementById('nav-padding-style')) {
            const style = document.createElement('style');
            style.id = 'nav-padding-style';
            style.textContent = `body { padding-bottom: ${navWrapper.offsetHeight + 16}px !important; }`;
            document.head.appendChild(style);
        }
    })();
</script>
