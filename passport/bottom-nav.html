<!-- bottom-nav.html -->
<!-- ONLY the nav + modal + script -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --nav-bg: rgba(255,255,255,0.98);
    --nav-active: #ffffff;
    --nav-inactive: #E30613;
    --nav-shadow: 0 -8px 25px rgba(0,0,0,0.08);
    --nav-radius: 28px;
    --nav-height: 72px;
    --nav-padding: 6px 16px;
}
.bottom-nav-wrapper * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    padding-bottom: calc(var(--nav-height) + 24px);
}

/* bottom nav */
.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9999;
    background: var(--nav-bg);
    backdrop-filter: blur(20px);
    border-radius: var(--nav-radius) var(--nav-radius) 0 0;
    border-top: 1px solid rgba(0,0,0,0.05);
    box-shadow: var(--nav-shadow);
    padding: var(--nav-padding);
    transition: transform 0.3s ease;
}
.bottom-nav.hide {
    transform: translateY(100%);
}
.nav-items {
    display: flex;
    align-items: center;
    justify-content: space-around;
    max-width: 600px;
    margin: 0 auto;
    gap: 6px;
}
.nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border-radius: 40px;
    min-width: 55px;
    padding: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
}
.nav-item:active {
    transform: scale(0.94);
}
.nav-icon {
    font-size: 1.25rem;
}
.nav-label {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.3px;
}
.nav-item .nav-icon,
.nav-item .nav-label {
    color: var(--nav-inactive);
}
.nav-item.active {
    background: linear-gradient(135deg, #E30613, #9f020d);
    box-shadow: 0 4px 12px rgba(227,6,19,0.25);
}
.nav-item.active .nav-icon,
.nav-item.active .nav-label {
    color: white;
}
.nav-item.active::after {
    content: "";
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
}

/* modal */
.transact-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    z-index: 10000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    visibility: hidden;
    opacity: 0;
    transition: 0.3s ease;
}
.transact-modal-overlay.active {
    visibility: visible;
    opacity: 1;
}
.transact-modal {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 30px 30px 0 0;
    transform: translateY(100%);
    transition: transform 0.35s ease;
    max-height: 85vh;
    overflow-y: auto;
}
.transact-modal-overlay.active .transact-modal {
    transform: translateY(0);
}
.modal-drag-handle {
    width: 42px;
    height: 5px;
    background: #e2e8f0;
    border-radius: 20px;
    margin: 12px auto 0;
}
.modal-header {
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #eef2f8;
}
.modal-header h2 {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.15rem;
    font-weight: 800;
    color: #0f172a;
}
.modal-close {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #f8fafc;
    cursor: pointer;
}
.modal-close i {
    color: #475569;
}
.modal-body {
    padding: 18px 20px 30px;
}
.transact-options-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 14px;
}
.transact-option-card {
    background: white;
    border: 1px solid #edf2f7;
    border-radius: 24px;
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    cursor: pointer;
    transition: 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.transact-option-card:active {
    transform: scale(0.96);
}
.transact-option-icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: linear-gradient(135deg,#E30613,#9f020d);
}
.transact-option-icon i {
    color: white;
    font-size: 1.3rem;
}
.transact-option-info h3 {
    margin: 0;
    font-size: 0.85rem;
    font-weight: 700;
    color: #0f172a;
}
.transact-option-info p {
    margin-top: 3px;
    font-size: 0.65rem;
    color: #64748b;
    line-height: 1.3;
}

@media (max-width:480px) {
    :root {
        --nav-height: 66px;
    }
    .nav-icon {
        font-size: 1.1rem;
    }
    .nav-label {
        font-size: 0.52rem;
    }
    .transact-option-card {
        padding: 14px 8px;
    }
    .transact-option-icon {
        width: 46px;
        height: 46px;
    }
}
</style>

<div class="bottom-nav-wrapper">
    <nav class="bottom-nav" id="bottomNav">
        <div class="nav-items">
            <div class="nav-item" data-url="home.html">
                <i class="fas fa-home nav-icon"></i>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item" data-url="vvip.html">
                <i class="fas fa-crown nav-icon"></i>
                <span class="nav-label">VVIP</span>
            </div>
            <div class="nav-item" data-modal="true">
                <i class="fas fa-exchange-alt nav-icon"></i>
                <span class="nav-label">Transact</span>
            </div>
            <div class="nav-item" data-url="lockers-vault.html">
                <i class="fas fa-wine-bottle nav-icon"></i>
                <span class="nav-label">Lockers</span>
            </div>
            <div class="nav-item" data-url="profile.html">
                <i class="fas fa-user-circle nav-icon"></i>
                <span class="nav-label">Profile</span>
            </div>
        </div>
    </nav>

    <div class="transact-modal-overlay" id="transactModalOverlay">
        <div class="transact-modal">
            <div class="modal-drag-handle"></div>
            <div class="modal-header">
                <h2>
                    <i class="fas fa-exchange-alt" style="color:#E30613;"></i>
                    Transact
                </h2>
                <div class="modal-close" id="closeTransactModal">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="modal-body">
                <div class="transact-options-grid">
                    <div class="transact-option-card" data-redirect="order.html">
                        <div class="transact-option-icon">
                            <i class="fas fa-receipt"></i>
                        </div>
                        <div class="transact-option-info">
                            <h3>Order Now</h3>
                            <p>Buy booze, food & drinks</p>
                        </div>
                    </div>
                    <div class="transact-option-card" data-redirect="pre-order.html">
                        <div class="transact-option-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="transact-option-info">
                            <h3>Queue Now</h3>
                            <p>The Butcher virtual queue</p>
                        </div>
                    </div>
                    <div class="transact-option-card" data-redirect="shisha.html">
                        <div class="transact-option-icon">
                            <i class="fas fa-smoking"></i>
                        </div>
                        <div class="transact-option-info">
                            <h3>Smoke Hookah</h3>
                            <p>Premium shisha lounge</p>
                        </div>
                    </div>
                    <div class="transact-option-card" data-redirect="tickets.html">
                        <div class="transact-option-icon">
                            <i class="fas fa-ticket-alt"></i>
                        </div>
                        <div class="transact-option-info">
                            <h3>Buy Tickets</h3>
                            <p>Purchase event tickets</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    // ----- FIX: detect current page correctly (handles home, index, root) -----
    let currentFile = window.location.pathname.split('/').pop();
    if (currentFile === '' || currentFile === 'index.html') {
        currentFile = 'home.html';   // treat root / index as home
    }

    const navItems = document.querySelectorAll('.nav-item');
    const modal = document.getElementById('transactModalOverlay');
    const closeBtn = document.getElementById('closeTransactModal');
    const bottomNav = document.getElementById('bottomNav');

    // ----- set active class on current page -----
    navItems.forEach(item => {
        const itemUrl = item.dataset.url;
        if (itemUrl && itemUrl === currentFile) {
            item.classList.add('active');
        }
    });

    // ----- navigation + modal handling -----
    navItems.forEach(item => {
        item.addEventListener('click', (e) => {
            e.preventDefault();
            const isModal = item.dataset.modal === 'true';
            const url = item.dataset.url;

            if (isModal) {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                return;
            }

            if (url) {
                window.location.href = url;
            }
        });
    });

    // ----- close modal functions -----
    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    // ----- redirect from modal options -----
    document.querySelectorAll('.transact-option-card').forEach(card => {
        card.addEventListener('click', () => {
            const redirect = card.dataset.redirect;
            closeModal();
            setTimeout(() => {
                window.location.href = redirect;
            }, 150);
        });
    });

    // ----- scroll-to-hide (more stable) -----
    let lastScroll = 0;
    let ticking = false;

    window.addEventListener('scroll', () => {
        if (!ticking) {
            requestAnimationFrame(() => {
                const currentScroll = window.pageYOffset;
                if (currentScroll <= 30) {
                    bottomNav.classList.remove('hide');
                } else if (currentScroll > lastScroll && currentScroll > 80) {
                    bottomNav.classList.add('hide');
                } else {
                    bottomNav.classList.remove('hide');
                }
                lastScroll = currentScroll;
                ticking = false;
            });
            ticking = true;
        }
    }, { passive: true });

    // ----- safety: ensure modal is closed on page load (in case it was left open) -----
    closeModal();

    // ----- small fix: prevent nav from being hidden on very short pages -----
    if (document.body.scrollHeight <= window.innerHeight) {
        bottomNav.classList.remove('hide');
    }
})();
</script>
