<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Bottom Navigation Component</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ========== GLOBAL BOTTOM NAVIGATION STYLES ========== */
        :root {
            --nav-bg: rgba(255, 255, 255, 0.98);
            --nav-active: #ffffff;
            --nav-inactive: #E30613;
            --nav-inactive-dim: rgba(227, 6, 19, 0.6);
            --nav-shadow: 0 -8px 25px rgba(0, 0, 0, 0.08);
            --nav-radius: 28px;
            --nav-height: 72px;
            --nav-padding: 6px 16px;
        }

        body {
            padding-bottom: calc(var(--nav-height) + 20px);
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--nav-radius) var(--nav-radius) 0 0;
            box-shadow: var(--nav-shadow);
            padding: var(--nav-padding);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .bottom-nav.hide {
            transform: translateY(100%);
        }

        .nav-items {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            height: 100%;
            gap: 4px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            padding: 6px 8px;
            border-radius: 40px;
            min-width: 55px;
            background: transparent;
            border: none;
            font-family: 'Inter', sans-serif;
            position: relative;
            flex: 1;
        }

        .nav-item:active {
            transform: scale(0.94);
        }

        .nav-icon {
            font-size: 1.3rem;
            transition: all 0.2s ease;
        }

        .nav-label {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
        }

        .nav-item .nav-icon,
        .nav-item .nav-label {
            color: var(--nav-inactive);
        }

        .nav-item.active .nav-icon,
        .nav-item.active .nav-label {
            color: var(--nav-active);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: var(--nav-active);
            border-radius: 50%;
            opacity: 0.9;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #E30613, #a0010e);
            box-shadow: 0 2px 8px rgba(227, 6, 19, 0.3);
        }

        @media (hover: hover) {
            .nav-item:hover .nav-icon,
            .nav-item:hover .nav-label {
                color: var(--nav-active);
            }
            .nav-item:hover {
                background: rgba(227, 6, 19, 0.85);
            }
        }

        /* ========== TRANSACT MODAL ========== */
        .transact-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.3s ease, opacity 0.3s ease;
        }

        .transact-modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .transact-modal {
            background: var(--white, #ffffff);
            border-radius: 32px 32px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.15);
        }

        .transact-modal-overlay.active .transact-modal {
            transform: translateY(0);
        }

        .transact-modal .modal-header {
            padding: 20px 20px 12px 20px;
            border-bottom: 1px solid #eef2f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--white, #ffffff);
            z-index: 10;
        }

        .transact-modal .modal-header h2 {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1e293b;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .transact-modal .modal-close {
            width: 36px;
            height: 36px;
            background: #f8fafd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #eef2f8;
        }

        .transact-modal .modal-close:active {
            transform: scale(0.94);
            background: rgba(227, 6, 19, 0.1);
        }

        .transact-modal .modal-close i {
            color: #475569;
            font-size: 1rem;
        }

        .transact-modal .modal-body {
            padding: 16px 20px 30px 20px;
        }

        .transact-options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .transact-option-card {
            background: var(--white, #ffffff);
            border: 1px solid #eef2f8;
            border-radius: 24px;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .transact-option-card:active {
            transform: scale(0.96);
            background: rgba(227, 6, 19, 0.04);
            border-color: #E30613;
        }

        .transact-option-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #E30613, #a0010e);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(227, 6, 19, 0.2);
        }

        .transact-option-icon i {
            font-size: 1.4rem;
            color: white;
        }

        .transact-option-info h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 2px;
        }

        .transact-option-info p {
            font-size: 0.6rem;
            color: #94a3b8;
            line-height: 1.2;
        }

        .modal-drag-handle {
            width: 40px;
            height: 4px;
            background: #eef2f8;
            border-radius: 4px;
            margin: 12px auto 0;
        }

        @media (max-width: 480px) {
            :root {
                --nav-height: 65px;
                --nav-padding: 4px 12px;
            }
            .nav-item {
                min-width: 48px;
                padding: 4px 4px;
            }
            .nav-icon {
                font-size: 1.1rem;
            }
            .nav-label {
                font-size: 0.5rem;
            }
            .transact-option-card {
                padding: 14px 8px;
            }
            .transact-option-icon {
                width: 44px;
                height: 44px;
            }
            .transact-option-icon i {
                font-size: 1.2rem;
            }
            .transact-option-info h3 {
                font-size: 0.75rem;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .transact-modal {
                max-height: 90vh;
            }
            .transact-modal .modal-body {
                padding: 12px 20px 20px 20px;
            }
            .transact-option-card {
                padding: 10px 8px;
            }
        }

        .transact-modal::-webkit-scrollbar {
            width: 3px;
        }
        .transact-modal::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .transact-modal::-webkit-scrollbar-thumb {
            background: #E30613;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<!-- Your existing page content goes here -->

<!-- ========== BOTTOM NAVIGATION BAR (5 TABS) ========== -->
<nav class="bottom-nav" id="bottomNav">
    <div class="nav-items">
        <!-- 1. Home -->
        <div class="nav-item" data-nav="home" data-url="../passport/home.html">
            <i class="fas fa-home nav-icon"></i>
            <span class="nav-label">Home</span>
        </div>
        
        <!-- 2. VVIP -->
        <div class="nav-item" data-nav="vvip" data-url="../passport/vvip.html">
            <i class="fas fa-crown nav-icon"></i>
            <span class="nav-label">VVIP</span>
        </div>
        
        <!-- 3. Transact (modal) -->
        <div class="nav-item" data-nav="transact" data-modal="true">
            <i class="fas fa-exchange-alt nav-icon"></i>
            <span class="nav-label">Transact</span>
        </div>
        
        <!-- 4. Booze Lockers -->
        <div class="nav-item" data-nav="booze-lockers" data-url="../passport/locker-vault.html">
            <i class="fas fa-wine-bottle nav-icon"></i>
            <span class="nav-label">Booze Lockers</span>
        </div>
        
        <!-- 5. Profile -->
        <div class="nav-item" data-nav="profile" data-url="../passport/lockers-vault.html">
            <i class="fas fa-user-circle nav-icon"></i>
            <span class="nav-label">Profile</span>
        </div>
    </div>
</nav>

<!-- ========== TRANSACT MODAL (UPDATED CARDS) ========== -->
<div class="transact-modal-overlay" id="transactModalOverlay">
    <div class="transact-modal">
        <div class="modal-drag-handle"></div>
        <div class="modal-header">
            <h2>
                <i class="fas fa-exchange-alt" style="color: #E30613;"></i>
                Transact
            </h2>
            <div class="modal-close" id="closeTransactModal">
                <i class="fas fa-times"></i>
            </div>
        </div>
        <div class="modal-body">
            <div class="transact-options-grid">
                <!-- Card 1: Order Now -->
                <div class="transact-option-card" data-redirect="order.html">
                    <div class="transact-option-icon">
                        <i class="fas fa-receipt"></i>
                    </div>
                    <div class="transact-option-info">
                        <h3>Order Now</h3>
                        <p>Buy booze, food & drinks</p>
                    </div>
                </div>
                
                <!-- Card 2: Queue Now -->
                <div class="transact-option-card" data-redirect="pre-order.html">
                    <div class="transact-option-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="transact-option-info">
                        <h3>Queue Now</h3>
                        <p>The Butcher pre‑order virtual queue</p>
                    </div>
                </div>
                
                <!-- Card 3: Smoke Hookah -->
                <div class="transact-option-card" data-redirect="shisha.html">
                    <div class="transact-option-icon">
                        <i class="fas fa-smoking"></i>
                    </div>
                    <div class="transact-option-info">
                        <h3>Smoke Hookah</h3>
                        <p>Shisha lounge – premium flavours</p>
                    </div>
                </div>
                
                <!-- Card 4: Buy Tickets -->
                <div class="transact-option-card" data-redirect="tickets.html">
                    <div class="transact-option-icon">
                        <i class="fas fa-ticket-alt"></i>
                    </div>
                    <div class="transact-option-info">
                        <h3>Buy Tickets</h3>
                        <p>Purchase & download event tickets</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // Get current page filename (relative to where this component is placed)
        const currentPage = window.location.pathname.split('/').pop() || 'home.html';
        
        const navItems = document.querySelectorAll('.nav-item');
        const transactModalOverlay = document.getElementById('transactModalOverlay');
        const closeTransactModal = document.getElementById('closeTransactModal');
        
        function highlightActiveNav() {
            navItems.forEach(item => {
                const itemUrl = item.getAttribute('data-url');
                const isModalTrigger = item.getAttribute('data-modal') === 'true';
                if (isModalTrigger) {
                    item.classList.remove('active');
                    return;
                }
                if (itemUrl && currentPage === itemUrl.split('/').pop()) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
        
        function setActiveTab(tabName) {
            navItems.forEach(item => {
                const itemNav = item.getAttribute('data-nav');
                if (itemNav === tabName) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
        
        function openTransactModal() {
            if (transactModalOverlay) {
                transactModalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                document.body.classList.add('modal-open');
            }
        }
        
        function closeTransactModalFn() {
            if (transactModalOverlay) {
                transactModalOverlay.classList.remove('active');
                document.body.style.overflow = '';
                document.body.classList.remove('modal-open');
            }
        }
        
        if (transactModalOverlay) {
            transactModalOverlay.addEventListener('click', (e) => {
                if (e.target === transactModalOverlay) closeTransactModalFn();
            });
        }
        if (closeTransactModal) {
            closeTransactModal.addEventListener('click', (e) => {
                e.stopPropagation();
                closeTransactModalFn();
            });
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && transactModalOverlay && transactModalOverlay.classList.contains('active')) {
                closeTransactModalFn();
            }
        });
        
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                item.style.transform = 'scale(0.94)';
                setTimeout(() => { item.style.transform = ''; }, 150);
                
                const isModalTrigger = item.getAttribute('data-modal') === 'true';
                const redirectUrl = item.getAttribute('data-url');
                const navName = item.getAttribute('data-nav');
                
                if (isModalTrigger) {
                    openTransactModal();
                } else if (redirectUrl) {
                    setActiveTab(navName);
                    setTimeout(() => { window.location.href = redirectUrl; }, 50);
                }
            });
        });
        
        const transactOptions = document.querySelectorAll('.transact-option-card');
        transactOptions.forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                option.style.transform = 'scale(0.96)';
                setTimeout(() => { option.style.transform = ''; }, 150);
                const redirectUrl = option.getAttribute('data-redirect');
                if (redirectUrl) {
                    closeTransactModalFn();
                    setTimeout(() => { window.location.href = redirectUrl; }, 200);
                }
            });
        });
        
        if (transactModalOverlay) {
            transactModalOverlay.addEventListener('touchmove', (e) => {
                const modalContent = transactModalOverlay.querySelector('.transact-modal');
                if (modalContent && !modalContent.contains(e.target)) e.preventDefault();
            }, { passive: false });
        }
        
        // Optional hide on scroll
        let lastScrollTop = 0;
        const bottomNav = document.getElementById('bottomNav');
        let scrollTimeout;
        let isModalOpen = false;
        
        function updateModalState() {
            isModalOpen = transactModalOverlay && transactModalOverlay.classList.contains('active');
        }
        if (transactModalOverlay) {
            const observer = new MutationObserver(updateModalState);
            observer.observe(transactModalOverlay, { attributes: true, attributeFilter: ['class'] });
        }
        
        function handleScroll() {
            if (scrollTimeout) clearTimeout(scrollTimeout);
            if (isModalOpen) return;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop < lastScrollTop || scrollTop < 50) {
                if (bottomNav && bottomNav.classList.contains('hide')) bottomNav.classList.remove('hide');
            } else if (scrollTop > lastScrollTop && scrollTop > 100) {
                if (bottomNav && !bottomNav.classList.contains('hide')) bottomNav.classList.add('hide');
            }
            scrollTimeout = setTimeout(() => {
                if (bottomNav && bottomNav.classList.contains('hide') && !isModalOpen) bottomNav.classList.remove('hide');
            }, 2000);
            lastScrollTop = scrollTop;
        }
        if (window.innerWidth <= 768 && bottomNav) window.addEventListener('scroll', handleScroll, { passive: true });
        
        highlightActiveNav();
        window.addEventListener('beforeunload', () => { document.body.style.overflow = ''; });
        window.bottomNav = { openTransactModal, closeTransactModal: closeTransactModalFn, setActiveTab, highlightActiveNav };
        setTimeout(highlightActiveNav, 100);
    })();
</script>
</body>
</html>
