<header class="site-header">
    <div class="brand" data-link="home">
        <div class="brand-logo is-badge">
            <img src="../assets/images/rands-logo.png" alt="Rands" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-box-archive\'></i>';">
        </div>
        <div class="brand-text">
            <h1>My Vault</h1>
            <p>We'll Keep It Safe</p>
        </div>
    </div>
    <div class="header-right">
        <div class="home-icon-btn" id="homeIconBtn" data-link="home">
            <i class="fas fa-home"></i>
        </div>
    </div>
</header>

<div class="wallet-stats">
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-wallet"></i></div><div class="stat-info"><h3>My Balance</h3><div class="stat-number" id="walletBalance">R0.00</div></div></div>
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-box-archive"></i></div><div class="stat-info"><h3>Vault Value</h3><div class="stat-number" id="vaultValueStat">R0.00</div></div></div>
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-boxes-stacked"></i></div><div class="stat-info"><h3>Items Stored</h3><div class="stat-number" id="vaultItemsStat">0</div></div></div>
</div>

<div class="vault-tab-nav">
    <button class="tab-btn active" id="myVaultTabBtn"><i class="fas fa-box-archive"></i> My Vault</button>
    <button class="tab-btn" id="keepProductsTabBtn"><i class="fas fa-plus"></i> Keep Products</button>
</div>

<!-- MY VAULT PANEL -->
<div id="myVaultPanel" class="vault-panel">
    <div id="activeHoldingsContainer"></div>
    <div id="historyToggle" class="history-toggle" style="display:none;">Show Past Holdings <i class="fas fa-chevron-down"></i></div>
    <div id="historyContainer" class="history-section"></div>
</div>

<!-- KEEP PRODUCTS PANEL -->
<div id="keepProductsPanel" class="vault-panel" style="display:none;">
    <div id="availableProductsContainer"></div>
</div>

<!-- Selection summary (sticky, only visible on Keep Products tab with selections) -->
<div id="selectionSummary" class="selection-summary" style="display:none;">
    <div class="selection-summary-row">
        <span class="selection-summary-label">Selected</span>
        <span class="selection-summary-value" id="selectedCount">0 Items</span>
    </div>
    <div class="selection-summary-row">
        <span class="selection-summary-label">Vault Value</span>
        <span class="selection-total" id="selectedTotal">R0.00</span>
    </div>
    <button class="holding-action-btn" id="requestToKeepBtn" style="margin-top:10px;">Request to Keep</button>
</div>

<!-- Confirm modal (used for both store and collect requests) -->
<div class="vault-modal-overlay" id="confirmModal">
    <div class="vault-modal-card">
        <div class="vault-modal-body">
            <h3 id="confirmModalTitle" style="font-family:'Playfair Display', serif; margin-bottom: 8px;">Confirm</h3>
            <p id="confirmModalMessage" style="font-size: 0.85rem; color: var(--slate);">Are you sure?</p>
            <div class="vault-modal-actions">
                <button class="vault-btn-cancel" id="confirmModalCancelBtn">Cancel</button>
                <button class="vault-btn-confirm" id="confirmModalConfirmBtn">Confirm</button>
            </div>
        </div>
    </div>
</div>

<div id="toastMessage" class="vault-toast"></div>
