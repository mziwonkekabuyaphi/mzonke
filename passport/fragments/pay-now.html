<header class="site-header">
    <div class="brand" data-link="home">
        <div class="brand-logo">
            <img src="../assets/images/rands-logo.png" alt="Rands" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-qrcode&quot;></i>';">
        </div>
        <div class="brand-text">
            <h1>Pay Now</h1>
            <p>Scan & Pay</p>
        </div>
    </div>
    <div class="home-icon-btn" id="homeIconBtn" data-link="home">
        <i class="fas fa-home"></i>
    </div>
</header>

<!-- ===== STATS (matching payment-success) ===== -->
<div class="wallet-stats">
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-wallet"></i></div>
        <div class="stat-info"><h3>Available Balance</h3><div class="stat-number" id="walletBalanceStat">R 0.00</div></div>
    </div>
    <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-ticket-alt"></i></div>
        <div class="stat-info"><h3>Pending Requests</h3><div class="stat-number" id="pendingCountStat">0</div></div>
    </div>
</div>

<!-- ===== MAIN PAY CARD ===== -->
<div class="pay-wrap">
    <div class="pay-card">

        <div class="pay-heading">
            <i class="fas fa-qrcode"></i> Scan to Pay
        </div>

        <!-- Balance -->
        <div class="balance-card">
            <div class="balance-label">AVAILABLE BALANCE</div>
            <div class="balance-amount" id="walletBalance">R 0.00</div>
        </div>

        <!-- Barcode -->
        <div class="barcode-container">
            <svg id="barcodeCanvas"></svg>
        </div>

        <!-- QR Code -->
        <div class="paynow-qr-section">
            <div id="qrcode"></div>
            <p class="qr-label">
                <i class="fas fa-wallet"></i> Rands Account: <span id="qrAccountLabel"></span>
            </p>
        </div>

        <!-- Box Office Requests -->
        <div class="boxoffice-section">
            <div class="boxoffice-title">
                <i class="fas fa-ticket-alt"></i> BOX OFFICE REQUESTS
                <span class="boxoffice-badge" id="boxofficeCount">0</span>
            </div>
            <div id="boxofficeRequestsList">
                <div class="boxoffice-empty">
                    <i class="fas fa-clock"></i>
                    <p>No pending payment requests</p>
                    <p style="font-size: 0.65rem; margin-top: 6px; color: var(--mist);">When you buy tickets at Box Office, requests appear here</p>
                </div>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="bottom-actions">
            <button class="btn-lg" data-link="home"><i class="fas fa-passport"></i> Open Passport</button>
            <button class="btn-lg btn-lg-outline" data-link="deposit"><i class="fas fa-arrow-up"></i> Top Up</button>
        </div>
    </div>
</div>

<!-- ===== TOAST ===== -->
<div id="globalToast" class="paynow-toast"></div>
