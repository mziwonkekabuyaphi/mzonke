<!-- Header (matching Order/Tickets) -->
<header class="site-header">
    <div class="brand" data-link="home">
        <div class="brand-logo">
            <img src="../assets/images/rands-logo.png" alt="Rands" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fas fa-lightbulb&quot;></i>';">
        </div>
        <div class="brand-text">
            <h1>Festival Banner</h1>
            <p>Digital Sign</p>
        </div>
    </div>
    <div class="header-right">
        <!-- X icon instead of back button — exits fullscreen (if active) then
             navigates home. Needs the extra exitFullscreen() step first, so
             it's wired up in JS rather than a plain data-link. -->
        <div class="close-icon" id="closeHomeBtn">
            <i class="fas fa-times"></i>
        </div>
    </div>
</header>

<!-- LED Display Card -->
<div class="led-card">
    <div class="led-screen" id="ledScreen">
        <div class="message-container" id="messageContainer">
            <div class="message-text" id="messageText">#See Your Vibe Mode</div>
        </div>
    </div>
</div>

<!-- Controls Panel (modern card) -->
<div class="controls-card">
    <div class="input-wrapper">
        <input type="text" id="messageInput" class="message-input" placeholder="ENTER YOUR MESSAGE..." maxlength="200">
    </div>

    <div class="button-row">
        <button class="btn" id="showBtn">SHOW</button>
        <button class="btn btn-secondary" id="clearBtn">CLEAR</button>
    </div>

    <div class="color-row">
        <div class="color-preset white" data-color="#FFFFFF"></div>
        <div class="color-preset red" data-color="#FF0040"></div>
        <div class="color-preset green" data-color="#00FF88"></div>
        <div class="color-preset blue" data-color="#00CCFF"></div>
        <div class="color-preset purple" data-color="#CC00FF"></div>
        <div class="color-preset yellow" data-color="#FFDD00"></div>
        <div class="color-preset orange" data-color="#FF6600"></div>
        <div class="color-preset pink" data-color="#FF69B4"></div>
        <div class="color-preset cyan" data-color="#00FFFF"></div>
        <div class="color-preset lime" data-color="#AAFF00"></div>
        <div class="color-preset magenta" data-color="#FF00FF"></div>
        <div class="color-preset teal" data-color="#008080"></div>
        <input type="color" id="colorPicker" class="color-picker-input" value="#FFFFFF">
    </div>

    <div class="slider-group">
        <div class="slider-label">
            <span><i class="fas fa-tachometer-alt"></i> SCROLL SPEED</span>
            <span id="speedValue">NORMAL</span>
        </div>
        <input type="range" id="speedSlider" min="2" max="15" step="1" value="8">
    </div>

    <div class="mode-grid">
        <div class="mode-btn" data-mode="static"><span>🔲</span><span>STATIC</span></div>
        <div class="mode-btn" data-mode="scroll"><span>📜</span><span>SCROLL</span></div>
        <div class="mode-btn" data-mode="bounce"><span>🏀</span><span>BOUNCE</span></div>
        <div class="mode-btn" data-mode="flash"><span>⚡</span><span>FLASH</span></div>
        <div class="mode-btn" data-mode="wave"><span>🌊</span><span>WAVE</span></div>
    </div>

    <div class="preset-grid">
        <div class="preset-btn" data-preset="IT'S LIT 🔥">🔥 IT'S LIT eRANDS🔥</div>
        <div class="preset-btn" data-preset="RANDS ON TOP 💸">💸 RANDS ON TOP</div>
        <div class="preset-btn" data-preset="PLAY AMAPIANO 🇿🇦">🎵 #SeeYourVibe 🇿🇦</div>
        <div class="preset-btn" data-preset="BIRTHDAY ENERGY 🎉">🎂 BIRTHDAY ENERGY 🎉</div>
    </div>

    <div class="button-row">
        <button class="btn fullscreen-toggle-btn" id="fullscreenToggleBtn">
            <i class="fas fa-expand"></i> FULL SCREEN
        </button>
        <button class="btn brightness-btn" id="brightnessBoostBtn">💡 MAX BRIGHTNESS</button>
    </div>

    <div class="hint-text">
        <i class="fas fa-fingerprint"></i> TAP SCREEN → SHOW CONTROLS | DOUBLE TAP → SWITCH MODE | LONG PRESS → CLEAR | FULLSCREEN → LONG PRESS TO EXIT
    </div>
</div>

<div class="brightness-flash" id="brightnessFlash"></div>
