<header class="site-header">
    <div class="brand" data-link="home">
        <img src="../assets/images/rands-logo3.png" alt="Rands Vibe" class="brand-logo is-image">
        <div class="brand-text">
            <h1>Ticket Wallet</h1>
            <p>Your Digital Pass</p>
        </div>
    </div>
    <div class="header-right">
        <div class="home-icon-btn" id="homeIconBtn" data-link="home">
            <i class="fas fa-home"></i>
        </div>
    </div>
</header>

<div class="wallet-stats">
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-wallet"></i></div><div class="stat-info"><h3>My Balance</h3><div class="stat-number" id="walletBalance">R0.00</div></div></div>
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-calendar-check"></i></div><div class="stat-info"><h3>Available Events</h3><div class="stat-number" id="eventsCountStat">—</div></div></div>
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-ticket-alt"></i></div><div class="stat-info"><h3>My Tickets</h3><div class="stat-number" id="myTicketsCountStat">0</div></div></div>
</div>

<div class="ticket-tab-nav">
    <button class="tab-btn active" id="eventsTabBtn"><i class="fas fa-music"></i> Events</button>
    <button class="tab-btn" id="myTicketsTabBtn"><i class="fas fa-qrcode"></i> My Tickets</button>
</div>

<div id="eventsPanel">
    <div class="store-header">
        <div class="event-selector">
            <label><i class="fas fa-calendar-alt"></i> Event:</label>
            <select id="eventSelectStore" disabled><option>Loading events…</option></select>
        </div>
    </div>
    <div id="ticketsContainerStore" class="tickets-grid"><div class="empty-state"><i class="fas fa-calendar-alt" style="font-size:2rem;"></i>Loading events…</div></div>
</div>

<div id="myTicketsPanel" style="display: none;">
    <div id="myTicketsListFull" class="tickets-grid"><div class="empty-state"><i class="fas fa-ticket-alt"></i>Your tickets will appear here</div></div>
</div>

<!-- Transfer Modal -->
<div class="modal-overlay" id="transferModal"><div class="modal-card"><div style="padding: 16px; background: linear-gradient(135deg, var(--red), var(--red-dark)); border-radius: 28px 28px 0 0; display: flex; justify-content: space-between;"><h3 style="color: white;"><i class="fas fa-exchange-alt"></i> Transfer Ticket</h3><button id="closeTransferModal" style="background:rgba(255,255,255,0.2); border:none; width:32px; height:32px; border-radius:50%; color:white; cursor:pointer;">&times;</button></div><div class="tickets-modal-body"><input type="tel" id="transferPhone" class="transfer-input" placeholder="+27 XX XXX XXXX"><div id="transferStatus" style="font-size:0.75rem;"></div><div class="modal-actions"><button class="btn-cancel" id="cancelTransferBtn">Cancel</button><button class="btn-issue" id="confirmTransferBtn">Transfer Ticket</button></div></div></div></div>

<!-- Confirmation Modal -->
<div class="modal-overlay" id="confirmationModal"><div class="modal-card"><div style="padding: 16px; background: linear-gradient(135deg, var(--red), var(--red-dark)); border-radius: 28px 28px 0 0; display: flex; justify-content: space-between;"><h3 style="color: white;" id="confirmModalTitle"><i class="fas fa-question-circle"></i> Confirm</h3><button id="closeConfirmModal" style="background:rgba(255,255,255,0.2); border:none; width:32px; height:32px; border-radius:50%; color:white; cursor:pointer;">&times;</button></div><div class="tickets-modal-body"><div class="confirm-modal-icon"><i class="fas fa-exclamation-triangle"></i></div><div class="confirm-message" id="confirmModalMessage">Are you sure?</div><div class="modal-actions"><button class="btn-cancel" id="confirmModalCancelBtn">Cancel</button><button class="btn-issue" id="confirmModalConfirmBtn">Confirm</button></div></div></div></div>
