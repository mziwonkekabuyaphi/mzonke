<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Passport Wallet | Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafd; padding: 20px; color: #1e293b; }
    .container { max-width: 1400px; margin: 0 auto; }
    .stats-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 24px; }
    .stat-card { background: white; border-radius: 20px; padding: 15px 20px; flex: 1; min-width: 140px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eef2f8; }
    .stat-number { font-size: 28px; font-weight: 800; color: #E30613; }
    .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
    .tabs { display: flex; gap: 8px; background: white; padding: 6px; border-radius: 60px; margin-bottom: 24px; border: 1px solid #eef2f8; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 60px; border: none; background: transparent; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #E30613; color: white; box-shadow: 0 2px 6px rgba(227,6,19,0.2); }
    .panel { display: none; background: white; border-radius: 28px; padding: 24px; border: 1px solid #eef2f8; margin-bottom: 24px; }
    .panel.active { display: block; }
    .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; color: #0f172a; }
    .add-form { background: #f8fafc; padding: 20px; border-radius: 24px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .add-form input, .add-form select { padding: 10px 16px; border-radius: 60px; border: 1px solid #cbd5e1; font-family: inherit; flex: 1; min-width: 150px; }
    .add-form button, .btn-primary { background: #E30613; color: white; border: none; padding: 10px 24px; border-radius: 60px; font-weight: 600; cursor: pointer; }
    .btn-secondary { background: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 60px; font-weight: 600; cursor: pointer; }
    .btn-danger { background: #fee2e2; color: #dc2626; border: none; padding: 8px 16px; border-radius: 60px; font-weight: 600; cursor: pointer; }
    .btn-success { background: #dcfce7; color: #166534; border: none; padding: 8px 16px; border-radius: 60px; font-weight: 600; cursor: pointer; }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; max-height: 400px; overflow-y: auto; }
    .item-card { background: #f8fafc; border-radius: 20px; padding: 16px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; }
    .item-card:hover { border-color: #E30613; background: #fff5f5; }
    .item-card.selected { border-color: #E30613; background: #fff5f5; }
    .item-info .name { font-weight: 700; margin-bottom: 4px; }
    .item-info .meta { font-size: 11px; color: #64748b; }
    .item-balance { font-weight: 800; color: #166534; font-size: 1rem; }
    .account-status { display: inline-block; padding: 2px 8px; border-radius: 30px; font-size: 10px; font-weight: 600; }
    .status-active { background: #dcfce7; color: #166534; }
    .status-blocked { background: #fee2e2; color: #991b1b; }
    .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .selected-info { background: #f8fafc; border-radius: 20px; padding: 16px; margin-bottom: 20px; border: 1px solid #eef2f8; }
    .topup-section { background: #f8fafc; border-radius: 24px; padding: 16px; margin-bottom: 20px; border: 1px solid #eef2f8; }
    .topup-title { color: #E30613; margin-bottom: 12px; font-size: 0.8rem; font-weight: 700; }
    .topup-input-group { display: flex; gap: 10px; margin-bottom: 12px; }
    .topup-input { flex: 1; padding: 10px 16px; background: white; border: 1px solid #cbd5e1; border-radius: 60px; font-size: 0.85rem; }
    .preset-amounts { display: flex; gap: 8px; flex-wrap: wrap; }
    .preset-btn { padding: 6px 14px; background: white; border: 1px solid #cbd5e1; border-radius: 60px; cursor: pointer; font-size: 0.7rem; font-weight: 500; }
    .transaction-list { max-height: 280px; overflow-y: auto; }
    .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eef2f8; }
    .search-box { background: #f8fafc; border-radius: 60px; padding: 4px 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #eef2f8; flex: 1; }
    .search-box input { flex: 1; background: none; border: none; padding: 8px 0; outline: none; font-size: 0.8rem; }
    .search-box i { color: #94a3b8; }
    .search-hint { font-size: 11px; color: #64748b; margin-left: 8px; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: 0.2s; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: white; border-radius: 28px; max-width: 500px; width: 90%; }
    .modal-header { padding: 20px 24px; background: #E30613; border-radius: 28px 28px 0 0; }
    .modal-header h3 { color: white; font-size: 1.2rem; font-weight: 800; text-align: center; }
    .modal-body { padding: 24px; }
    .modal-footer { display: flex; gap: 12px; padding: 0 24px 24px 24px; }
    .modal-footer button { flex: 1; padding: 12px; border-radius: 60px; font-weight: 600; cursor: pointer; border: none; }
    .modal-footer .modal-confirm { background: #E30613; color: white; }
    .modal-footer .modal-cancel { background: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; }
    .loading-state, .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
    .toast { position: fixed; bottom: 30px; right: 30px; background: #1e293b; color: white; padding: 12px 24px; border-radius: 60px; font-weight: 500; z-index: 1000; display: none; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 768px) { body { padding: 16px; } .stats-row { flex-direction: column; } .items-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
    <div class="stats-row">
        <div class="stat-card"><div class="stat-number" id="totalAccounts">-</div><div class="stat-label">Total Accounts</div></div>
        <div class="stat-card"><div class="stat-number" id="totalBalance">R0</div><div class="stat-label">Total Balance</div></div>
        <div class="stat-card"><div class="stat-number" id="totalTransactions">-</div><div class="stat-label">Transactions</div></div>
        <div class="stat-card"><div class="stat-number" id="blockedAccounts">-</div><div class="stat-label">Blocked</div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="accounts">👥 Accounts</button>
        <button class="tab-btn" data-tab="refunds">🔄 Refunds</button>
    </div>

    <!-- Accounts Panel -->
    <div id="accountsPanel" class="panel active">
        <div class="section-title"><i class="fas fa-wallet"></i> Wallet Accounts</div>
        <div class="add-form" style="justify-content: space-between;">
            <div style="display: flex; gap: 12px; flex: 1;">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchAccount" placeholder="Search by name, email, or phone number...">
                </div>
            </div>
            <button class="btn-secondary" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div id="accountList" class="items-grid"><div class="loading-state">Loading wallets...</div></div>
        
        <!-- Selected Account Actions -->
        <div id="selectedAccountPanel" style="margin-top: 24px; display: none;">
            <div class="section-title"><i class="fas fa-bolt"></i> Account Actions</div>
            <div class="selected-info" id="selectedAccountInfo"></div>
            <div class="action-buttons">
                <button class="btn-primary" id="openTopUpBtn"><i class="fas fa-plus-circle"></i> Top Up</button>
                <button class="btn-danger" id="blockAccountBtn"><i class="fas fa-ban"></i> Block Wallet</button>
                <button class="btn-success" id="unblockAccountBtn"><i class="fas fa-check-circle"></i> Unblock Wallet</button>
            </div>
            <div class="topup-section">
                <div class="topup-title"><i class="fas fa-hand-holding-usd"></i> Quick Top Up</div>
                <div class="topup-input-group">
                    <input type="number" id="quickTopupAmount" placeholder="Amount" class="topup-input" value="100">
                    <button class="btn-success" id="quickTopUpBtn">Add</button>
                </div>
                <div class="preset-amounts">
                    <button class="preset-btn" onclick="setQuickAmount(50)">R50</button>
                    <button class="preset-btn" onclick="setQuickAmount(100)">R100</button>
                    <button class="preset-btn" onclick="setQuickAmount(200)">R200</button>
                    <button class="preset-btn" onclick="setQuickAmount(500)">R500</button>
                    <button class="preset-btn" onclick="setQuickAmount(1000)">R1000</button>
                </div>
            </div>
            <div>
                <div class="topup-title"><i class="fas fa-history"></i> Recent Transactions</div>
                <div id="accountTransactions" class="transaction-list"></div>
            </div>
        </div>
    </div>

    <!-- Refunds Panel -->
    <div id="refundsPanel" class="panel">
        <div class="section-title"><i class="fas fa-undo-alt"></i> Refund Requests</div>
        <div id="refundRequestsList" class="items-grid"><div class="empty-state">No refund requests</div></div>
    </div>
</div>

<!-- Top Up Modal -->
<div id="topUpModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><h3><i class="fas fa-plus-circle"></i> Top Up Wallet</h3></div>
        <div class="modal-body">
            <label>Account: <span id="modalAccountId" style="color:#E30613; font-weight:700;">-</span></label>
            <input type="number" id="modalTopupAmount" placeholder="Enter amount" class="topup-input" style="margin-top:16px;">
            <div class="preset-amounts" style="margin-top:12px;">
                <button class="preset-btn" onclick="setModalAmount(50)">R50</button>
                <button class="preset-btn" onclick="setModalAmount(100)">R100</button>
                <button class="preset-btn" onclick="setModalAmount(200)">R200</button>
                <button class="preset-btn" onclick="setModalAmount(500)">R500</button>
                <button class="preset-btn" onclick="setModalAmount(1000)">R1000</button>
            </div>
        </div>
        <div class="modal-footer">
            <button class="modal-confirm" id="confirmTopUpBtn">Confirm</button>
            <button class="modal-cancel" id="closeTopUpModalBtn">Cancel</button>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div id="confirmModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><h3 id="confirmModalTitle">Confirm Action</h3></div>
        <div class="modal-body"><p id="confirmModalMessage"></p></div>
        <div class="modal-footer">
            <button class="modal-confirm" id="modalConfirmBtn">Confirm</button>
            <button class="modal-cancel" id="modalCancelBtn">Cancel</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';
    
    let accounts = [];
    let selectedWalletId = null;
    let modalResolve = null;

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#b91c1c' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    // ========== MODAL SYSTEM ==========
    function showModal(title, message) {
        return new Promise((resolve) => {
            modalResolve = resolve;
            document.getElementById('confirmModalTitle').innerText = title;
            document.getElementById('confirmModalMessage').innerHTML = message;
            document.getElementById('confirmModal').classList.add('active');
        });
    }

    function closeModal(confirmed) {
        document.getElementById('confirmModal').classList.remove('active');
        if (modalResolve) { modalResolve(confirmed); modalResolve = null; }
    }

    document.getElementById('modalConfirmBtn').onclick = () => closeModal(true);
    document.getElementById('modalCancelBtn').onclick = () => closeModal(false);
    document.getElementById('confirmModal').onclick = (e) => { if (e.target === document.getElementById('confirmModal')) closeModal(false); };

    // ========== REUSABLE TOP-UP FUNCTION ==========
    async function updateWalletBalanceAndLog(walletId, amountDelta, description) {
        if (!walletId) {
            showToast('No wallet selected', true);
            return false;
        }
        if (isNaN(amountDelta) || amountDelta <= 0) {
            showToast('Amount must be greater than 0', true);
            return false;
        }
        
        console.log('💰 Top-up started:', { walletId, amountDelta });
        
        try {
            const { data: walletData, error: fetchError } = await supabase
                .from('wallets')
                .select('balance')
                .eq('id', walletId)
                .single();
            
            if (fetchError) throw fetchError;
            
            const currentBalance = parseFloat(walletData.balance) || 0;
            const newBalance = currentBalance + amountDelta;
            
            console.log('💰 Balance:', { currentBalance, newBalance });
            
            const { error: updateError } = await supabase
                .from('wallets')
                .update({ balance: newBalance, updated_at: new Date().toISOString() })
                .eq('id', walletId);
            
            if (updateError) throw updateError;
            
            const { error: transactionError } = await supabase
                .from('wallet_transactions')
                .insert({
                    wallet_id: walletId,
                    amount: amountDelta,
                    type: 'topup',
                    description: description,
                    performed_by: 'admin',
                    status: 'completed',
                    direction: 'credit',
                    created_at: new Date().toISOString()
                });
            
            if (transactionError) console.warn('Transaction log failed:', transactionError);
            
            console.log('✅ Top-up successful');
            return true;
            
        } catch (err) {
            console.error('❌ Top-up failed:', err);
            showToast(err.message, true);
            return false;
        }
    }

    // ========== BLOCK WALLET (COMPLETE BLOCK) ==========
    async function blockWallet(walletId, userId) {
        try {
            // 1. Block the wallet in wallets table (add status column or use a separate approach)
            // First check if wallets table has a status column, if not we'll use profiles.status
            const { error: walletBlockError } = await supabase
                .from('wallets')
                .update({ status: 'blocked', updated_at: new Date().toISOString() })
                .eq('id', walletId);
            
            if (walletBlockError) {
                // If wallets table doesn't have status column, log but continue
                console.warn('Could not block wallet in wallets table:', walletBlockError);
            }
            
            // 2. Block the user profile (this prevents login and all access)
            const { error: profileError } = await supabase
                .from('profiles')
                .update({ 
                    status: 'Blocked',
                    updated_at: new Date().toISOString()
                })
                .eq('id', userId);
            
            if (profileError) throw profileError;
            
            // 3. Optionally: Add a transaction record for the block action
            await supabase
                .from('wallet_transactions')
                .insert({
                    wallet_id: walletId,
                    amount: 0,
                    type: 'admin_action',
                    description: 'Wallet blocked by admin',
                    performed_by: 'admin',
                    status: 'completed',
                    created_at: new Date().toISOString()
                });
            
            console.log('✅ Wallet and user profile blocked successfully');
            return true;
            
        } catch (err) {
            console.error('❌ Block failed:', err);
            showToast('Block failed: ' + err.message, true);
            return false;
        }
    }

    // ========== UNBLOCK WALLET ==========
    async function unblockWallet(walletId, userId) {
        try {
            // 1. Unblock wallet
            const { error: walletUnblockError } = await supabase
                .from('wallets')
                .update({ status: 'active', updated_at: new Date().toISOString() })
                .eq('id', walletId);
            
            if (walletUnblockError) {
                console.warn('Could not unblock wallet in wallets table:', walletUnblockError);
            }
            
            // 2. Unblock user profile
            const { error: profileError } = await supabase
                .from('profiles')
                .update({ 
                    status: 'Active',
                    updated_at: new Date().toISOString()
                })
                .eq('id', userId);
            
            if (profileError) throw profileError;
            
            // 3. Log the unblock action
            await supabase
                .from('wallet_transactions')
                .insert({
                    wallet_id: walletId,
                    amount: 0,
                    type: 'admin_action',
                    description: 'Wallet unblocked by admin',
                    performed_by: 'admin',
                    status: 'completed',
                    created_at: new Date().toISOString()
                });
            
            console.log('✅ Wallet and user profile unblocked successfully');
            return true;
            
        } catch (err) {
            console.error('❌ Unblock failed:', err);
            showToast('Unblock failed: ' + err.message, true);
            return false;
        }
    }

    // ========== LOAD WALLETS ==========
    async function loadWallets() {
        try {
            const { data, error } = await supabase
                .from('wallets')
                .select(`
                    id,
                    balance,
                    user_id,
                    profiles:user_id (id, name, email, phone, status)
                `);
            
            if (error) throw error;
            
            accounts = (data || []).map(w => ({
                id: w.id,
                balance: parseFloat(w.balance) || 0,
                user_id: w.profiles?.id || null,
                name: w.profiles?.name || 'Unknown',
                email: w.profiles?.email || 'no-email',
                phone: w.profiles?.phone || '',
                status: w.profiles?.status === 'Blocked' ? 'Blocked' : 'Active'
            }));
            
            renderAccountList();
            updateStats();
            console.log(`✅ Loaded ${accounts.length} wallets`);
            
        } catch (err) {
            console.error('Error loading wallets:', err);
            showToast('Failed to load wallets', true);
        }
    }

    // ========== FETCH TRANSACTIONS ==========
    async function fetchTransactions(walletId) {
        try {
            const { data, error } = await supabase
                .from('wallet_transactions')
                .select('*')
                .eq('wallet_id', walletId)
                .order('created_at', { ascending: false })
                .limit(20);
            
            if (error) throw error;
            
            return (data || []).map(tx => ({
                desc: tx.description || (tx.type === 'topup' ? 'Top Up' : 'Transaction'),
                amount: parseFloat(tx.amount),
                date: tx.created_at ? new Date(tx.created_at).toLocaleDateString() : '',
                time: tx.created_at ? new Date(tx.created_at).toLocaleTimeString() : ''
            }));
        } catch (err) {
            console.error('Error fetching transactions:', err);
            return [];
        }
    }

    // ========== UPDATE STATS ==========
    async function updateStats() {
        const totalBalance = accounts.reduce((sum, a) => sum + (a.balance || 0), 0);
        const blockedCount = accounts.filter(a => a.status === 'Blocked').length;
        
        document.getElementById('totalAccounts').innerText = accounts.length;
        document.getElementById('totalBalance').innerText = 'R' + totalBalance.toFixed(2);
        document.getElementById('blockedAccounts').innerText = blockedCount;
        
        const { count } = await supabase.from('wallet_transactions').select('*', { count: 'exact', head: true });
        document.getElementById('totalTransactions').innerText = count || 0;
    }

    // ========== RENDER ACCOUNT LIST ==========
    function renderAccountList() {
        const searchTerm = document.getElementById('searchAccount')?.value.toLowerCase() || '';
        let filtered = accounts.filter(acc => 
            acc.name.toLowerCase().includes(searchTerm) || 
            acc.email.toLowerCase().includes(searchTerm) ||
            (acc.phone && acc.phone.includes(searchTerm))  // PHONE NUMBER SEARCH ADDED
        );
        
        const container = document.getElementById('accountList');
        if (!filtered.length) { 
            container.innerHTML = '<div class="empty-state">No wallets found</div>'; 
            return; 
        }
        
        container.innerHTML = filtered.map(acc => `
            <div class="item-card ${selectedWalletId === acc.id ? 'selected' : ''}" onclick="selectAccount('${acc.id}')">
                <div class="item-info">
                    <div class="name">${escapeHtml(acc.name)}</div>
                    <div class="meta">${escapeHtml(acc.email)} ${acc.phone ? `• ${escapeHtml(acc.phone)}` : ''}</div>
                </div>
                <div>
                    <div class="item-balance">R${(acc.balance || 0).toFixed(2)}</div>
                    <div class="account-status ${acc.status === 'Active' ? 'status-active' : 'status-blocked'}">${acc.status}</div>
                </div>
            </div>
        `).join('');
    }

    // ========== SELECT ACCOUNT ==========
    window.selectAccount = async function(walletId) {
        console.log('Selected wallet:', walletId);
        selectedWalletId = walletId;
        const acc = accounts.find(a => a.id === walletId);
        if (!acc) return;
        
        const panel = document.getElementById('selectedAccountPanel');
        panel.style.display = 'block';
        
        // Show if wallet is blocked
        const isBlocked = acc.status === 'Blocked';
        
        document.getElementById('selectedAccountInfo').innerHTML = `
            <div><strong>${escapeHtml(acc.name)}</strong> (${escapeHtml(acc.email)})</div>
            <div>${acc.phone ? `<div><strong>Phone:</strong> ${escapeHtml(acc.phone)}</div>` : ''}</div>
            <div style="margin-top:8px;"><strong>Balance:</strong> <span style="color:#166534; font-weight:800;">R${(acc.balance || 0).toFixed(2)}</span></div>
            <div><strong>Status:</strong> <span class="account-status ${acc.status === 'Active' ? 'status-active' : 'status-blocked'}">${acc.status}</span></div>
            ${isBlocked ? '<div style="margin-top:8px; color:#dc2626;"><i class="fas fa-lock"></i> WALLET IS BLOCKED - User cannot use funds</div>' : ''}
        `;
        
        const transactions = await fetchTransactions(walletId);
        const txContainer = document.getElementById('accountTransactions');
        if (!transactions.length) { 
            txContainer.innerHTML = '<div class="empty-state">No transactions yet</div>'; 
        } else {
            txContainer.innerHTML = transactions.map(tx => `
                <div class="transaction-item">
                    <div>
                        <div class="topup-title" style="margin:0;">${escapeHtml(tx.desc)}</div>
                        <small>${tx.date} ${tx.time}</small>
                    </div>
                    <div style="color:#166534; font-weight:700;">+R${Math.abs(tx.amount).toFixed(2)}</div>
                </div>
            `).join('');
        }
        
        renderAccountList();
    };

    // ========== BLOCK / UNBLOCK ACTIONS ==========
    async function blockAccount() {
        if (!selectedWalletId) { showToast('Select an account first', true); return; }
        const acc = accounts.find(a => a.id === selectedWalletId);
        
        if (acc.status === 'Blocked') { showToast('Wallet is already blocked', true); return; }
        
        const confirmed = await showModal(
            'Block Wallet', 
            `Are you sure you want to BLOCK <strong>${escapeHtml(acc.name)}</strong>'s wallet?<br><br>
            This will:<br>
            • Block the wallet completely<br>
            • Prevent the user from making any transactions<br>
            • Prevent the user from logging in<br>
            • The user will NOT be able to use their funds`
        );
        
        if (!confirmed) return;
        
        const success = await blockWallet(selectedWalletId, acc.user_id);
        if (success) {
            await refreshData();
            showToast(`Wallet for ${acc.name} has been BLOCKED`);
        }
    }
    
    async function unblockAccount() {
        if (!selectedWalletId) { showToast('Select an account first', true); return; }
        const acc = accounts.find(a => a.id === selectedWalletId);
        
        if (acc.status === 'Active') { showToast('Wallet is already active', true); return; }
        
        const confirmed = await showModal(
            'Unblock Wallet', 
            `Are you sure you want to UNBLOCK <strong>${escapeHtml(acc.name)}</strong>'s wallet?<br><br>
            This will restore full access to their wallet and account.`
        );
        
        if (!confirmed) return;
        
        const success = await unblockWallet(selectedWalletId, acc.user_id);
        if (success) {
            await refreshData();
            showToast(`Wallet for ${acc.name} has been UNBLOCKED`);
        }
    }

    // ========== TOP UP FUNCTIONS ==========
    async function quickTopUp() {
        if (!selectedWalletId) { showToast('Select an account first', true); return; }
        
        // Check if wallet is blocked
        const acc = accounts.find(a => a.id === selectedWalletId);
        if (acc && acc.status === 'Blocked') {
            showToast('Cannot top up a blocked wallet. Unblock first.', true);
            return;
        }
        
        const amount = parseFloat(document.getElementById('quickTopupAmount').value);
        if (isNaN(amount) || amount <= 0) { showToast('Valid amount required', true); return; }
        
        if (await updateWalletBalanceAndLog(selectedWalletId, amount, `Admin Quick Top Up: +R${amount.toFixed(2)}`)) {
            await refreshData();
            showToast(`R${amount.toFixed(2)} added`);
        }
    }
    
    function openTopUpModal() {
        if (!selectedWalletId) { showToast('Select an account first', true); return; }
        
        const acc = accounts.find(a => a.id === selectedWalletId);
        if (acc && acc.status === 'Blocked') {
            showToast('Cannot top up a blocked wallet. Unblock first.', true);
            return;
        }
        
        document.getElementById('modalAccountId').innerText = acc?.name || selectedWalletId;
        document.getElementById('modalTopupAmount').value = '';
        document.getElementById('topUpModal').classList.add('active');
    }
    
    function closeTopUpModal() { document.getElementById('topUpModal').classList.remove('active'); }
    
    async function confirmTopUp() {
        if (!selectedWalletId) { showToast('Select an account', true); closeTopUpModal(); return; }
        
        const acc = accounts.find(a => a.id === selectedWalletId);
        if (acc && acc.status === 'Blocked') {
            showToast('Cannot top up a blocked wallet. Unblock first.', true);
            closeTopUpModal();
            return;
        }
        
        const amount = parseFloat(document.getElementById('modalTopupAmount').value);
        if (isNaN(amount) || amount <= 0) { showToast('Valid amount required', true); return; }
        
        if (await updateWalletBalanceAndLog(selectedWalletId, amount, `Admin Top Up: +R${amount.toFixed(2)}`)) {
            await refreshData();
            showToast(`R${amount.toFixed(2)} added`);
            closeTopUpModal();
        }
    }
    
    async function refreshData() {
        await loadWallets();
        if (selectedWalletId && accounts.find(a => a.id === selectedWalletId)) {
            await selectAccount(selectedWalletId);
        } else if (accounts.length) {
            await selectAccount(accounts[0].id);
        } else {
            document.getElementById('selectedAccountPanel').style.display = 'none';
            selectedWalletId = null;
        }
        showToast('Refreshed');
    }

    // ========== UI HELPERS ==========
    function setQuickAmount(amt) { document.getElementById('quickTopupAmount').value = amt; }
    function setModalAmount(amt) { document.getElementById('modalTopupAmount').value = amt; }
    
    // ========== REFUNDS (Demo) ==========
    function renderRefundRequests() {
        const container = document.getElementById('refundRequestsList');
        container.innerHTML = '<div class="empty-state">No refund requests</div>';
    }
    
    // ========== TAB SWITCHING ==========
    function switchTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`${tabId}Panel`).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
    }
    
    // ========== EVENT LISTENERS ==========
    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
    document.getElementById('openTopUpBtn')?.addEventListener('click', openTopUpModal);
    document.getElementById('blockAccountBtn')?.addEventListener('click', blockAccount);
    document.getElementById('unblockAccountBtn')?.addEventListener('click', unblockAccount);
    document.getElementById('quickTopUpBtn')?.addEventListener('click', quickTopUp);
    document.getElementById('confirmTopUpBtn')?.addEventListener('click', confirmTopUp);
    document.getElementById('closeTopUpModalBtn')?.addEventListener('click', closeTopUpModal);
    document.getElementById('refreshBtn')?.addEventListener('click', refreshData);
    document.getElementById('searchAccount')?.addEventListener('keyup', () => renderAccountList());
    document.getElementById('topUpModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('topUpModal')) closeTopUpModal(); });
    
    // Expose globals
    window.selectAccount = selectAccount;
    window.setQuickAmount = setQuickAmount;
    window.setModalAmount = setModalAmount;
    
    // ========== INIT ==========
    async function init() {
        await loadWallets();
        renderRefundRequests();
        if (accounts.length) {
            await selectAccount(accounts[0].id);
        }
    }
    
    init();
</script>
</body>
</html>
