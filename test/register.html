<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rands | Premium Access System</title>
  <style>
    /* All existing CSS from previous version remains exactly the same */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }
    body { background: #0a0a0a; color: #ffffff; min-height: 100vh; transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
    body.vip-theme { background: radial-gradient(circle at 20% 30%, #1a0505, #0a0000); box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.1); }
    body.vip-theme .premium-glow { text-shadow: 0 0 12px #ff1a1a, 0 0 25px rgba(255, 0, 0, 0.6); }
    .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .glass-card { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 50, 50, 0.25); border-radius: 2rem; padding: 2rem; box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 0, 0, 0.1); transition: all 0.2s; }
    .btn { background: linear-gradient(135deg, #e60000, #990000); border: none; padding: 0.9rem 1.8rem; border-radius: 3rem; font-weight: 700; font-size: 1rem; color: white; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; width: 100%; letter-spacing: 0.5px; }
    .btn-outline { background: transparent; border: 1.5px solid #ff3333; color: #ff4d4d; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(230, 0, 0, 0.4); }
    input, .input-field { width: 100%; padding: 0.9rem 1rem; background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 1.5rem; color: white; font-size: 1rem; transition: 0.2s; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #ff3333; box-shadow: 0 0 0 2px rgba(255, 51, 51, 0.3); }
    .step { display: none; animation: fadeSlideUp 0.4s ease; }
    .step.active-step { display: block; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.98); backdrop-filter: blur(20px); z-index: 2000; display: flex; align-items: center; justify-content: center; flex-direction: column; transition: opacity 0.5s; }
    .wallet-card-3d { width: 280px; height: 170px; background: linear-gradient(145deg, #1f0a0a, #000000); border-radius: 1.5rem; border: 1px solid rgba(255, 0, 0, 0.7); box-shadow: 0 0 30px rgba(255, 0, 0, 0.5); margin-bottom: 2rem; transform-style: preserve-3d; animation: spinCard 3s infinite ease-in-out, redGlowPulse 1.8s infinite; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.4rem; letter-spacing: 2px; color: #ff4d4d; }
    @keyframes spinCard { 0% { transform: rotateY(0deg) rotateX(0deg); } 50% { transform: rotateY(12deg) rotateX(6deg); } 100% { transform: rotateY(0deg) rotateX(0deg); } }
    @keyframes redGlowPulse { 0% { box-shadow: 0 0 5px #ff0000, inset 0 0 5px rgba(255,0,0,0.3); } 100% { box-shadow: 0 0 30px #ff3300, inset 0 0 15px rgba(255,0,0,0.6); } }
    .progress-bar { width: 280px; height: 4px; background: #2a2a2a; border-radius: 10px; margin-top: 1rem; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: #ff3333; transition: width 0.3s linear; }
    .sequence-text { font-size: 1.2rem; margin-top: 1rem; font-weight: 500; letter-spacing: 1px; }
    .vip-badge { background: linear-gradient(135deg, #c90000, #550000); padding: 0.3rem 1rem; border-radius: 2rem; font-size: 0.8rem; font-weight: bold; }
    .row-flex { display: flex; gap: 1rem; flex-wrap: wrap; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 1500; }
    .modal-content { background: #0f0f0f; max-width: 450px; width: 90%; border-radius: 2rem; padding: 2rem; border: 1px solid red; }
    @media (max-width: 640px) { .glass-card { padding: 1.5rem; } }
    .error-msg { color: #ff6666; font-size: 0.8rem; margin-top: -0.5rem; margin-bottom: 1rem; }
    .success-check { color: #00e676; }
  </style>
</head>
<body>
<div id="app-root"></div>

<script type="module">
  // Import Supabase client and auth utilities from ../config/
  import { supabase } from '../config/supabase.js';
  // Optional: import additional auth helpers if needed from auth.js
  // import { handleAuth, sendMagicLink } from '../config/auth.js';
  
  // ------------------------------ GLOBALS
  let currentSession = null;
  let currentUserProfile = null;
  let walletData = null;

  // Helper: generate wallet ID RND-XXXX-XXXX
  function generateWalletId() {
    const segment = () => Math.floor(1000 + Math.random() * 9000).toString();
    return `RND-${segment()}-${segment()}`;
  }

  function showMessage(msg, isError = true) {
    const toast = document.createElement('div');
    toast.innerText = msg;
    toast.style.position = 'fixed';
    toast.style.bottom = '20px';
    toast.style.left = '20px';
    toast.style.right = '20px';
    toast.style.backgroundColor = isError ? '#b91c1c' : '#15803d';
    toast.style.color = 'white';
    toast.style.padding = '1rem';
    toast.style.borderRadius = '1.5rem';
    toast.style.zIndex = '9999';
    toast.style.textAlign = 'center';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
  }

  function setLoading(btn, isLoading) {
    if (!btn) return;
    btn.disabled = isLoading;
    btn.innerText = isLoading ? 'Processing...' : btn.getAttribute('data-original') || btn.innerText;
  }

  async function showCreationAnimation() {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'loader-overlay';
      overlay.innerHTML = `
        <div class="wallet-card-3d">RANDS</div>
        <div class="sequence-text" id="animText">Creating your Rands profile…</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      `;
      document.body.appendChild(overlay);
      const textEl = overlay.querySelector('#animText');
      const progressFill = overlay.querySelector('#progressFill');
      const messages = [
        "Creating your Rands profile…",
        "Generating your wallet…",
        "Securing your account…",
        "Finalising access…"
      ];
      let step = 0;
      progressFill.style.width = '0%';
      const interval = setInterval(() => {
        if (step < messages.length) {
          textEl.innerText = messages[step];
          progressFill.style.width = `${((step + 1) / messages.length) * 100}%`;
          step++;
        } else {
          clearInterval(interval);
          setTimeout(() => {
            textEl.innerText = "✨ Account Activated ✨";
            progressFill.style.width = '100%';
            setTimeout(() => {
              overlay.remove();
              resolve();
            }, 1500);
          }, 400);
        }
      }, 800);
    });
  }

  async function createUserProfileAndWallet(userId, email, firstName, lastName, phone) {
    const { error: userError } = await supabase
      .from('users')
      .insert([{
        id: userId,
        email: email,
        first_name: firstName,
        last_name: lastName,
        phone: phone,
        role: 'general',
        created_at: new Date().toISOString()
      }]);
    if (userError) throw new Error(`User profile error: ${userError.message}`);
    
    const walletIdValue = generateWalletId();
    const { error: walletError } = await supabase
      .from('wallets')
      .insert([{
        user_id: userId,
        wallet_id: walletIdValue,
        balance: 0,
        created_at: new Date().toISOString()
      }]);
    if (walletError) throw new Error(`Wallet error: ${walletError.message}`);
    return { walletId: walletIdValue };
  }

  async function fetchUserData(userId) {
    const { data: profile, error } = await supabase
      .from('users')
      .select('*')
      .eq('id', userId)
      .single();
    if (error) throw error;
    const { data: wallet } = await supabase
      .from('wallets')
      .select('*')
      .eq('user_id', userId)
      .single();
    return { profile, wallet };
  }

  async function upgradeToVIP(userId) {
    const { error } = await supabase
      .from('users')
      .update({ role: 'vip' })
      .eq('id', userId);
    if (error) throw new Error('VIP upgrade failed');
    return true;
  }

  // WhatsApp API helper (calls external endpoint or Twilio)
  async function sendWhatsAppMessage(toNumber, message) {
    try {
      // In production, replace with actual endpoint that uses Twilio/Meta
      console.log(`[WHATSAPP SIM] To: ${toNumber} | Msg: ${message}`);
      showMessage(`Demo: WhatsApp message sent to ${toNumber} with code. (Integrate Twilio for production)`, false);
      return true;
    } catch(e) { return false; }
  }

  async function showWhatsAppDialog() {
    const phone = prompt("Enter your WhatsApp number (with country code, e.g., +27831234567):");
    if (!phone || phone.length < 8) return;
    const { data: existingUser, error } = await supabase
      .from('users')
      .select('id, email')
      .eq('phone', phone)
      .maybeSingle();
    if (!existingUser) {
      showMessage('No account linked to this number. Please register first.');
      return;
    }
    const otpCode = Math.floor(100000 + Math.random() * 900000).toString();
    sessionStorage.setItem(`whatsapp_otp_${phone}`, otpCode);
    sessionStorage.setItem(`whatsapp_user_${phone}`, existingUser.id);
    const success = await sendWhatsAppMessage(phone, `Welcome to Rands 🔴\n\nYour secure login code: ${otpCode}\n\nDo not share this code.`);
    if (success) {
      const userOtp = prompt(`We sent a 6-digit OTP via WhatsApp to ${phone}. Enter code:`);
      if (userOtp === otpCode) {
        const { data: userRecord } = await supabase.from('users').select('email').eq('id', existingUser.id).single();
        if(userRecord) {
          alert(`Authenticated! Please log in with your email & password. We'll redirect.`);
          renderApp();
        }
      } else { showMessage('Invalid OTP'); }
    } else {
      showMessage('WhatsApp service currently unavailable. (Twilio keys required)');
    }
  }

  // Payment modal (VIP upgrade)
  function showPaymentModal() {
    const modalDiv = document.createElement('div');
    modalDiv.className = 'modal';
    modalDiv.style.display = 'flex';
    modalDiv.innerHTML = `
      <div class="modal-content">
        <h3 style="color:#ff4d4d;">Upgrade to VIP</h3>
        <p>Select payment provider:</p>
        <div style="display:flex; gap:1rem; margin: 1rem 0;">
          <button id="providerYoco" class="btn-outline" style="flex:1">Yoco</button>
          <button id="providerStripe" class="btn-outline" style="flex:1">Stripe</button>
          <button id="providerPayFast" class="btn-outline" style="flex:1">PayFast</button>
        </div>
        <button id="simulatePaymentBtn" class="btn">Simulate Successful Payment</button>
        <button id="closeModalBtn" class="btn-outline" style="margin-top:1rem;">Cancel</button>
      </div>
    `;
    document.body.appendChild(modalDiv);
    let selectedProvider = 'Stripe';
    document.getElementById('providerYoco').onclick = () => { selectedProvider = 'Yoco'; };
    document.getElementById('providerStripe').onclick = () => { selectedProvider = 'Stripe'; };
    document.getElementById('providerPayFast').onclick = () => { selectedProvider = 'PayFast'; };
    document.getElementById('simulatePaymentBtn').onclick = async () => {
      modalDiv.remove();
      const upgradeBtn = document.getElementById('upgradeVipBtn');
      if (upgradeBtn) setLoading(upgradeBtn, true);
      try {
        await upgradeToVIP(currentSession.user.id);
        const { profile, wallet } = await fetchUserData(currentSession.user.id);
        currentUserProfile = profile;
        walletData = wallet;
        document.body.classList.add('vip-theme');
        showMessage(`✅ VIP Activated via ${selectedProvider}! Welcome to elite tier.`, false);
        renderDashboard();
      } catch (err) {
        showMessage(err.message);
        if (upgradeBtn) setLoading(upgradeBtn, false);
      }
    };
    document.getElementById('closeModalBtn').onclick = () => modalDiv.remove();
  }

  // DASHBOARD
  function renderDashboard() {
    const root = document.getElementById('app-root');
    const isVip = currentUserProfile?.role === 'vip';
    if (isVip) document.body.classList.add('vip-theme');
    else document.body.classList.remove('vip-theme');

    root.innerHTML = `
      <div class="container">
        <div class="glass-card" style="width:100%;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
            <div><h2 style="color:#ff3a3a;">Rands Dashboard</h2></div>
            <div><span class="${isVip ? 'vip-badge premium-glow' : 'vip-badge'}" style="background:#333;">${isVip ? '👑 VIP ACCESS' : 'GENERAL'}</span>
            <button id="logoutBtn" class="btn-outline" style="margin-left:1rem; padding:0.5rem 1rem;">Exit</button></div>
          </div>
          <hr style="border-color:#2a2a2a; margin: 1rem 0;">
          <div class="row-flex">
            <div style="flex:1; min-width:200px;">
              <p><strong>${currentUserProfile?.first_name} ${currentUserProfile?.last_name}</strong><br>${currentUserProfile?.email}</p>
              <p>📞 ${currentUserProfile?.phone || '—'}</p>
              <div style="background:#1e1e1e; border-radius:1.5rem; padding:1rem; margin-top:1rem;">
                <span>💳 Wallet ID:</span>
                <strong style="color:#ff6666;">${walletData?.wallet_id || '—'}</strong><br>
                <span>💰 Balance: <strong>R${walletData?.balance || 0}</strong></span>
              </div>
            </div>
            <div style="flex:2">
              ${!isVip ? `<button id="upgradeVipBtn" class="btn" style="background: linear-gradient(135deg,#c90000,#4a0000);">⭐ UPGRADE TO VIP ⭐</button>` : 
                `<div class="premium-glow" style="border:1px solid red; border-radius:1.5rem; padding:1rem;">
                  <h3>🔥 VIP UNLOCKED 🔥</h3>
                  <p>✔️ Skip queue at events<br>✔️ VIP badge & priority access<br>✔️ Exclusive nightlife experiences</p>
                </div>`}
              <div style="margin-top:1.5rem;">
                <h4>🎟️ Upcoming Events</h4>
                <ul style="list-style:none;">
                  <li>🔴 Rooftop Elite - Sat 24 Aug</li>
                  <li>🔴 VIP Afterparty (invite only)</li>
                </ul>
                ${isVip ? '<span class="vip-badge">Access Granted: skip queue</span>' : '<span>Upgrade to VIP for priority entry</span>'}
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('logoutBtn').onclick = async () => {
      await supabase.auth.signOut();
      document.body.classList.remove('vip-theme');
      renderApp();
    };
    if (!isVip) {
      document.getElementById('upgradeVipBtn').onclick = () => showPaymentModal();
    }
  }

  // LOGIN & REGISTER
  function renderLogin() {
    const root = document.getElementById('app-root');
    root.innerHTML = `
      <div class="container">
        <div class="glass-card" style="max-width: 500px; width:100%;">
          <div style="text-align:center; margin-bottom:1.5rem;">
            <h1 style="color:#ff3333; font-size:2.3rem;">RANDS</h1>
            <p style="color:#aaa;">Elite access · Nightlife fintech</p>
          </div>
          <div id="authTabs" style="display:flex; gap:1rem; margin-bottom:2rem;">
            <button id="tabLoginBtn" class="btn" style="background:#222;">LOGIN</button>
            <button id="tabRegisterBtn" class="btn btn-outline">REGISTER</button>
          </div>
          <div id="loginPanel">
            <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button id="doLoginBtn" class="btn">Access Rands</button>
            <div style="margin-top:1rem; text-align:center;">
              <button id="whatsappLoginBtn" class="btn-outline" style="background:transparent;">📱 Send login link to WhatsApp</button>
            </div>
          </div>
          <div id="registerPanel" style="display:none;">
            <div id="multiStepRegister">
              <div class="step active-step" data-step="1">
                <input type="text" id="regFirstName" placeholder="First name">
                <input type="text" id="regLastName" placeholder="Last name">
                <button id="nextStep1" class="btn">Continue</button>
              </div>
              <div class="step" data-step="2">
                <input type="email" id="regEmail" placeholder="Email address">
                <input type="tel" id="regPhone" placeholder="Phone number (WhatsApp compatible)">
                <button id="nextStep2" class="btn">Continue</button>
              </div>
              <div class="step" data-step="3">
                <input type="password" id="regPassword" placeholder="Create strong password">
                <button id="createAccountFinalBtn" class="btn">Create Account / Activate Rands Account</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('tabLoginBtn').onclick = () => {
      document.getElementById('loginPanel').style.display = 'block';
      document.getElementById('registerPanel').style.display = 'none';
      document.getElementById('tabLoginBtn').style.background = '#222';
      document.getElementById('tabRegisterBtn').style.background = 'transparent';
    };
    document.getElementById('tabRegisterBtn').onclick = () => {
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('registerPanel').style.display = 'block';
      document.getElementById('tabRegisterBtn').style.background = '#222';
      document.getElementById('tabLoginBtn').style.background = 'transparent';
    };
    let step = 1;
    const steps = document.querySelectorAll('#multiStepRegister .step');
    function showStep(stepNum) {
      steps.forEach((st, idx) => {
        if (idx+1 === stepNum) st.classList.add('active-step');
        else st.classList.remove('active-step');
      });
    }
    document.getElementById('nextStep1')?.addEventListener('click', () => {
      const fname = document.getElementById('regFirstName').value.trim();
      const lname = document.getElementById('regLastName').value.trim();
      if(!fname || !lname) { showMessage('First and last name required'); return; }
      step=2; showStep(2);
    });
    document.getElementById('nextStep2')?.addEventListener('click', () => {
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      if(!email || !phone || !email.includes('@')) { showMessage('Valid email and phone required'); return; }
      step=3; showStep(3);
    });
    document.getElementById('createAccountFinalBtn')?.addEventListener('click', async () => {
      const firstName = document.getElementById('regFirstName').value.trim();
      const lastName = document.getElementById('regLastName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      if(!firstName || !lastName || !email || !phone || !password || password.length < 6) {
        showMessage('Please complete all fields (password min 6 characters)');
        return;
      }
      await showCreationAnimation();
      const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
        email, password,
        options: { data: { first_name: firstName, last_name: lastName } }
      });
      if (signUpError) { showMessage(signUpError.message); return; }
      const userId = signUpData.user?.id;
      if (!userId) { showMessage('Signup error'); return; }
      try {
        await createUserProfileAndWallet(userId, email, firstName, lastName, phone);
        showMessage('Account created! Welcome to Rands.', false);
        renderApp();
      } catch (err) { showMessage(err.message); }
    });
    document.getElementById('doLoginBtn').onclick = async () => {
      const email = document.getElementById('loginEmail').value;
      const pwd = document.getElementById('loginPassword').value;
      if (!email || !pwd) { showMessage('Enter credentials'); return; }
      const { error } = await supabase.auth.signInWithPassword({ email, password: pwd });
      if (error) showMessage(error.message);
      else renderApp();
    };
    document.getElementById('whatsappLoginBtn').onclick = () => showWhatsAppDialog();
  }

  async function renderApp() {
    const { data: { session } } = await supabase.auth.getSession();
    currentSession = session;
    if (session && session.user) {
      try {
        const { profile, wallet } = await fetchUserData(session.user.id);
        currentUserProfile = profile;
        walletData = wallet;
        renderDashboard();
      } catch (err) {
        console.warn(err);
        renderLogin();
      }
    } else {
      renderLogin();
    }
  }

  // Auth state listener
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
      currentSession = session;
      renderApp();
    }
    if (event === 'SIGNED_OUT') {
      currentSession = null;
      renderApp();
    }
  });

  // Start app
  renderApp();

  // Console reminder for Supabase table setup
  console.log(`
    🔴 SUPABASE SETUP REQUIRED TABLES (run in SQL editor):
    
    CREATE TABLE users (
      id UUID REFERENCES auth.users PRIMARY KEY,
      email TEXT,
      first_name TEXT,
      last_name TEXT,
      phone TEXT,
      created_at TIMESTAMPTZ,
      role TEXT DEFAULT 'general'
    );
    
    CREATE TABLE wallets (
      id UUID DEFAULT gen_random_uuid() PRIMARY KEY,
      user_id UUID REFERENCES users(id) ON DELETE CASCADE,
      wallet_id TEXT UNIQUE,
      balance BIGINT DEFAULT 0,
      created_at TIMESTAMPTZ
    );
    
    -- Enable Row Level Security and policies as needed.
  `);
</script>
</body>
</html>
