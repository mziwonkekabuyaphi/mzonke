<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VVIP Packages | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafd;
            padding: 20px;
            color: #1e293b;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .stats-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            flex: 1;
            min-width: 140px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eef2f8;
        }
        .stat-number { font-size: 28px; font-weight: 800; color: #E30613; }
        .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f172a;
        }
        .add-form {
            background: #f8fafc;
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .add-form input, .add-form select, .add-form textarea {
            padding: 10px 16px;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            font-family: inherit;
            flex: 1;
            min-width: 150px;
        }
        .add-form textarea { border-radius: 20px; min-height: 80px; }
        .add-form button, .btn-primary {
            background: #E30613;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 8px 16px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .item-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #e2e8f0;
        }
        .package-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 16px;
            background: #E30613;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .package-image i { font-size: 48px; color: rgba(255,255,255,0.8); }
        .package-image img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
        .package-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .package-name { font-weight: 800; font-size: 1rem; color: #1e293b; }
        .package-price { font-weight: 800; font-size: 1.2rem; color: #E30613; }
        .package-description { font-size: 0.75rem; color: #64748b; margin-bottom: 8px; }
        .package-meta { display: flex; gap: 12px; font-size: 0.7rem; color: #64748b; margin-bottom: 8px; }
        .benefits-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .benefit-tag {
            background: rgba(227,6,19,0.08);
            padding: 4px 10px;
            border-radius: 60px;
            font-size: 0.65rem;
            font-weight: 500;
            color: #E30613;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 60px;
            font-size: 0.65rem;
            font-weight: 600;
        }
        .status-active { background: #dcfce7; color: #166534; }
        .status-inactive { background: #e5e7eb; color: #4b5563; }
        .package-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
        .package-actions button { flex: 1; padding: 8px; border-radius: 60px; font-weight: 600; font-size: 0.7rem; cursor: pointer; }
        .btn-edit { background: white; border: 1px solid #e2e8f0; color: #1e293b; }
        .btn-delete { background: #fee2e2; border: none; color: #dc2626; }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: white;
            border-radius: 28px;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            padding: 20px 24px;
            background: #E30613;
            border-radius: 28px 28px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { color: white; font-size: 1.2rem; font-weight: 800; }
        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.8rem; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 60px;
            font-family: 'Inter', sans-serif;
        }
        .form-group textarea { border-radius: 20px; min-height: 80px; resize: vertical; }
        .image-upload-area {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }
        .image-preview { width: 100%; height: 150px; object-fit: cover; border-radius: 16px; margin-top: 12px; }
        .benefits-input-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .benefits-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .benefit-item {
            background: rgba(227,6,19,0.08);
            padding: 6px 12px;
            border-radius: 60px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #E30613;
        }
        .benefit-item button { background: none; border: none; color: #E30613; cursor: pointer; }
        .form-actions { display: flex; gap: 12px; margin-top: 24px; }
        .form-actions button { flex: 1; }
        
        .loading-state, .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 500;
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .stats-row { flex-direction: column; }
            .items-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Stats Row -->
    <div class="stats-row">
        <div class="stat-card"><div class="stat-number" id="totalPackages">-</div><div class="stat-label">Total Packages</div></div>
        <div class="stat-card"><div class="stat-number" id="activePackages">-</div><div class="stat-label">Active</div></div>
        <div class="stat-card"><div class="stat-number" id="totalBookings">-</div><div class="stat-label">Bookings</div></div>
        <div class="stat-card"><div class="stat-number" id="totalRevenue">-</div><div class="stat-label">Revenue (R)</div></div>
    </div>

    <!-- Action Bar -->
    <div style="margin-bottom: 24px;">
        <button class="btn-primary" id="createPackageBtn"><i class="fas fa-plus"></i> Create New Package</button>
    </div>

    <!-- Packages Grid -->
    <div id="packagesGrid" class="items-grid">
        <div class="loading-state">Loading packages...</div>
    </div>
</div>

<!-- Modal -->
<div id="packageModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Create Package</h2>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <form id="packageForm">
                <div class="form-group"><label>Package Name *</label><input type="text" id="packageName" required></div>
                <div class="form-group"><label>Description</label><textarea id="packageDescription"></textarea></div>
                <div class="form-group"><label>Price (R) *</label><input type="number" id="packagePrice" step="0.01" required></div>
                <div class="form-group"><label>Capacity *</label><input type="number" id="packageCapacity" min="1" required></div>
                <div class="form-group"><label>Status</label><select id="packageStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
                <div class="form-group">
                    <label>Package Image</label>
                    <div class="image-upload-area" id="imageUploadArea"><i class="fas fa-cloud-upload-alt"></i><p>Click to upload</p><input type="file" id="imageInput" accept="image/*" style="display:none;"></div>
                    <div id="imagePreviewContainer" style="display:none;"><img id="imagePreview" class="image-preview"><button type="button" class="btn-secondary" id="removeImageBtn" style="margin-top:8px;">Remove</button></div>
                </div>
                <div class="form-group">
                    <label>Benefits</label>
                    <div class="benefits-input-group"><input type="text" id="benefitInput" placeholder="e.g., VIP Access"><button type="button" class="btn-secondary" id="addBenefitBtn">Add</button></div>
                    <div id="benefitsList" class="benefits-tags"></div>
                </div>
                <div class="form-actions"><button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button><button type="submit" class="btn-primary">Save</button></div>
            </form>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';
    
    let currentEditingId = null;
    let benefitsArray = [];
    let currentImageBase64 = null;
    let packages = [];

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#b91c1c' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    function updateBenefitsDisplay() {
        const container = document.getElementById('benefitsList');
        if (!benefitsArray.length) { container.innerHTML = '<span style="color:#94a3b8;font-size:0.7rem;">No benefits</span>'; return; }
        container.innerHTML = benefitsArray.map((b, idx) => `<div class="benefit-item"><i class="fas fa-check"></i> ${escapeHtml(b)}<button type="button" onclick="window.removeBenefit(${idx})">&times;</button></div>`).join('');
    }
    
    window.removeBenefit = function(idx) { benefitsArray.splice(idx, 1); updateBenefitsDisplay(); };
    
    document.getElementById('addBenefitBtn')?.addEventListener('click', () => {
        const input = document.getElementById('benefitInput');
        const benefit = input.value.trim();
        if (benefit && !benefitsArray.includes(benefit)) { benefitsArray.push(benefit); updateBenefitsDisplay(); input.value = ''; }
    });

    function fileToBase64(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); }); }
    
    function setupImageUpload() {
        const uploadArea = document.getElementById('imageUploadArea');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('imagePreviewContainer');
        const removeBtn = document.getElementById('removeImageBtn');
        uploadArea.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                if (file.size > 2 * 1024 * 1024) { showToast('Max 2MB', true); return; }
                const base64 = await fileToBase64(file);
                currentImageBase64 = base64;
                imagePreview.src = base64;
                previewContainer.style.display = 'block';
                uploadArea.style.display = 'none';
            }
        });
        removeBtn.addEventListener('click', () => { currentImageBase64 = null; previewContainer.style.display = 'none'; uploadArea.style.display = 'block'; imageInput.value = ''; });
    }
    
    function resetImageUpload() { currentImageBase64 = null; document.getElementById('imagePreviewContainer').style.display = 'none'; document.getElementById('imageUploadArea').style.display = 'block'; document.getElementById('imageInput').value = ''; }

    async function loadStats() {
        try {
            const { count: packageCount } = await supabase.from('vvip_packages').select('*', { count: 'exact', head: true });
            const { count: activeCount } = await supabase.from('vvip_packages').select('*', { count: 'exact', head: true }).eq('status', 'active');
            const { count: bookingCount } = await supabase.from('vvip_bookings').select('*', { count: 'exact' });
            const { data: revenueData } = await supabase.from('vvip_bookings').select('total_amount').eq('status', 'completed');
            const totalRevenue = (revenueData || []).reduce((s, b) => s + (b.total_amount || 0), 0);
            document.getElementById('totalPackages').innerText = packageCount || 0;
            document.getElementById('activePackages').innerText = activeCount || 0;
            document.getElementById('totalBookings').innerText = bookingCount || 0;
            document.getElementById('totalRevenue').innerText = totalRevenue.toLocaleString();
        } catch (error) { console.error(error); }
    }

    async function loadPackages() {
        try {
            const { data, error } = await supabase.from('vvip_packages').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            packages = data || [];
            const container = document.getElementById('packagesGrid');
            if (!packages.length) { container.innerHTML = '<div class="empty-state">No packages. Click Create.</div>'; return; }
            container.innerHTML = packages.map(pkg => `
                <div class="item-card">
                    <div class="package-image">${pkg.image ? `<img src="${pkg.image}" alt="${escapeHtml(pkg.name)}">` : '<i class="fas fa-crown"></i>'}</div>
                    <div class="package-header"><span class="package-name">${escapeHtml(pkg.name)}</span><span class="package-price">R${pkg.price}</span></div>
                    <div class="package-meta"><span><i class="fas fa-users"></i> Cap: ${pkg.capacity}</span><span><i class="fas fa-ticket"></i> Sold: ${pkg.sold_count || 0}</span><span class="status-badge ${pkg.status === 'active' ? 'status-active' : 'status-inactive'}">${pkg.status}</span></div>
                    <div class="package-description">${escapeHtml(pkg.description || 'No description')}</div>
                    <div class="benefits-list">${(pkg.benefits || []).slice(0, 3).map(b => `<span class="benefit-tag">${escapeHtml(b)}</span>`).join('')}${(pkg.benefits || []).length > 3 ? `<span class="benefit-tag">+${pkg.benefits.length - 3}</span>` : ''}</div>
                    <div class="package-actions"><button class="btn-edit" onclick="window.editPackage('${pkg.id}')">Edit</button><button class="btn-delete" onclick="window.deletePackage('${pkg.id}')">Delete</button></div>
                </div>
            `).join('');
            await loadStats();
        } catch (error) { console.error(error); document.getElementById('packagesGrid').innerHTML = `<div class="empty-state">Error: ${error.message}</div>`; }
    }

    function openCreateModal() { currentEditingId = null; benefitsArray = []; currentImageBase64 = null; document.getElementById('modalTitle').innerText = 'Create Package'; document.getElementById('packageForm').reset(); document.getElementById('packageStatus').value = 'active'; updateBenefitsDisplay(); resetImageUpload(); document.getElementById('packageModal').classList.add('active'); document.body.style.overflow = 'hidden'; }
    
    window.editPackage = async function(id) {
        const pkg = packages.find(p => p.id === id);
        if (!pkg) return;
        currentEditingId = id; benefitsArray = pkg.benefits || []; currentImageBase64 = pkg.image || null;
        document.getElementById('modalTitle').innerText = 'Edit Package';
        document.getElementById('packageName').value = pkg.name;
        document.getElementById('packageDescription').value = pkg.description || '';
        document.getElementById('packagePrice').value = pkg.price;
        document.getElementById('packageCapacity').value = pkg.capacity;
        document.getElementById('packageStatus').value = pkg.status || 'active';
        updateBenefitsDisplay();
        if (pkg.image) { document.getElementById('imagePreview').src = pkg.image; document.getElementById('imagePreviewContainer').style.display = 'block'; document.getElementById('imageUploadArea').style.display = 'none'; }
        else { resetImageUpload(); }
        document.getElementById('packageModal').classList.add('active');
        document.body.style.overflow = 'hidden';
    };
    
    window.deletePackage = async function(id) {
        if (!confirm('Archive this package?')) return;
        try { await supabase.from('vvip_packages').update({ status: 'inactive' }).eq('id', id); showToast('Archived'); await loadPackages(); } 
        catch (error) { showToast('Error: ' + error.message, true); }
    };
    
    function closeModal() { document.getElementById('packageModal').classList.remove('active'); document.body.style.overflow = 'auto'; currentEditingId = null; benefitsArray = []; resetImageUpload(); }
    
    document.getElementById('packageForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const packageData = { name: document.getElementById('packageName').value.trim(), description: document.getElementById('packageDescription').value.trim(), price: parseFloat(document.getElementById('packagePrice').value), capacity: parseInt(document.getElementById('packageCapacity').value), status: document.getElementById('packageStatus').value, benefits: benefitsArray, image: currentImageBase64 || null };
        if (!packageData.name || !packageData.price || !packageData.capacity) { showToast('Fill all required fields', true); return; }
        if (packageData.price <= 0 || packageData.capacity <= 0) { showToast('Price/capacity must be >0', true); return; }
        try {
            let result; if (currentEditingId) result = await supabase.from('vvip_packages').update(packageData).eq('id', currentEditingId);
            else result = await supabase.from('vvip_packages').insert([packageData]);
            if (result.error) throw result.error;
            showToast(currentEditingId ? 'Updated!' : 'Created!');
            closeModal(); await loadPackages();
        } catch (error) { showToast('Error: ' + error.message, true); }
    });
    
    document.getElementById('createPackageBtn').addEventListener('click', openCreateModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
    document.getElementById('packageModal').addEventListener('click', (e) => { if (e.target === document.getElementById('packageModal')) closeModal(); });
    
    setupImageUpload();
    loadPackages();
    supabase.channel('vvip_packages_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_packages' }, () => loadPackages()).subscribe();
</script>
</body>
</html>
