<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vault Admin | Locker Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8fafd; padding: 20px; color: #1e293b; }
        .container { max-width: 1400px; margin: 0 auto; }
        .stats-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 20px; padding: 15px 20px; flex: 1; min-width: 140px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eef2f8; }
        .stat-number { font-size: 28px; font-weight: 800; color: #E30613; }
        .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
        .tabs { display: flex; gap: 8px; background: white; padding: 6px; border-radius: 60px; margin-bottom: 24px; border: 1px solid #eef2f8; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 60px; border: none; background: transparent; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: #E30613; color: white; box-shadow: 0 2px 6px rgba(227,6,19,0.2); }
        .panel { display: none; background: white; border-radius: 28px; padding: 24px; border: 1px solid #eef2f8; margin-bottom: 24px; }
        .panel.active { display: block; }
        .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; color: #0f172a; }
        .add-form { background: #f8fafc; padding: 20px; border-radius: 24px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
        .add-form input, .add-form select { padding: 10px 16px; border-radius: 60px; border: 1px solid #cbd5e1; font-family: inherit; flex: 1; min-width: 150px; }
        .add-form button, .btn-primary { background: #E30613; color: white; border: none; padding: 10px 24px; border-radius: 60px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 60px; font-weight: 600; cursor: pointer; }
        .btn-danger { background: #fee2e2; color: #dc2626; border: none; padding: 6px 12px; border-radius: 60px; font-weight: 600; cursor: pointer; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
        .item-card { background: #f8fafc; border-radius: 20px; padding: 16px; border: 1px solid #e2e8f0; }
        .locker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .locker-number { font-weight: 800; font-size: 1rem; color: #1e293b; }
        .locker-status { display: inline-block; padding: 4px 10px; border-radius: 60px; font-size: 0.7rem; font-weight: 600; }
        .status-available { background: #dcfce7; color: #166534; }
        .status-occupied { background: #fee2e2; color: #991b1b; }
        .status-maintenance { background: #fef9c3; color: #854d0e; }
        .locker-details { font-size: 0.75rem; color: #64748b; margin-bottom: 12px; }
        .locker-actions { display: flex; gap: 8px; margin-top: 12px; }
        .locker-actions button { flex: 1; padding: 6px; border-radius: 60px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eef2f8; }
        .item-price { font-weight: 700; color: #E30613; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: 0.2s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: white; border-radius: 28px; max-width: 500px; width: 90%; }
        .modal-header { padding: 20px 24px; background: #E30613; border-radius: 28px 28px 0 0; }
        .modal-header h3 { color: white; font-size: 1.2rem; font-weight: 800; }
        .modal-body { padding: 24px; }
        .modal-body input, .modal-body select { width: 100%; padding: 10px 16px; margin: 8px 0 16px; border-radius: 60px; border: 1px solid #cbd5e1; font-family: inherit; }
        .modal-footer { display: flex; gap: 12px; padding: 0 24px 24px 24px; }
        .modal-footer button { flex: 1; }
        .loading-state, .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #1e293b; color: white; padding: 12px 24px; border-radius: 60px; font-weight: 500; z-index: 1000; display: none; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) { body { padding: 16px; } .stats-row { flex-direction: column; } .items-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="stats-row">
        <div class="stat-card"><div class="stat-number" id="totalLockers">-</div><div class="stat-label">Total Lockers</div></div>
        <div class="stat-card"><div class="stat-number" id="availableLockers">-</div><div class="stat-label">Available</div></div>
        <div class="stat-card"><div class="stat-number" id="occupiedLockers">-</div><div class="stat-label">Occupied</div></div>
        <div class="stat-card"><div class="stat-number" id="totalItems">-</div><div class="stat-label">Products</div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="lockers">🔒 Vault Lockers</button>
        <button class="tab-btn" data-tab="inventory">📦 Inventory</button>
    </div>

    <!-- Lockers Panel -->
    <div id="lockersPanel" class="panel active">
        <div class="section-title"><i class="fas fa-archive"></i> Manage Lockers</div>
        <div class="add-form">
            <button class="btn-primary" id="createLockerBtn"><i class="fas fa-plus"></i> Create Locker</button>
            <button class="btn-secondary" id="refreshLockersBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div id="lockersList" class="items-grid">Loading...</div>
    </div>

    <!-- Inventory Panel -->
    <div id="inventoryPanel" class="panel">
        <div class="section-title"><i class="fas fa-cube"></i> Product Inventory</div>
        <div class="add-form">
            <button class="btn-primary" id="createItemBtn"><i class="fas fa-plus"></i> Add Product</button>
            <button class="btn-secondary" id="refreshItemsBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div id="inventoryList" class="items-grid">Loading...</div>
    </div>
</div>

<!-- Create Locker Modal -->
<div id="lockerModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><h3><i class="fas fa-plus-circle"></i> Create Locker</h3></div>
        <div class="modal-body">
            <label>Locker Number *</label><input type="text" id="lockerNumber" placeholder="e.g., L-001, VIP-01">
            <label>Location (optional)</label><input type="text" id="lockerLocation" placeholder="Main Hall, VIP Section">
            <label>Size</label><select id="lockerSize"><option>Small</option><option>Medium</option><option>Large</option><option>Extra Large</option></select>
        </div>
        <div class="modal-footer"><button class="btn-primary" id="confirmCreateLockerBtn">Create</button><button class="btn-secondary" id="closeLockerModalBtn">Cancel</button></div>
    </div>
</div>

<!-- Create Item Modal -->
<div id="itemModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><h3><i class="fas fa-plus-circle"></i> Add Product</h3></div>
        <div class="modal-body">
            <label>Product Name *</label><input type="text" id="itemName" placeholder="e.g., Jameson Whiskey">
            <label>Price (R) *</label><input type="number" id="itemPrice" step="0.01" placeholder="0.00">
            <label>Category</label><select id="itemCategory"><option value="beer">Beer</option><option value="wine">Wine</option><option value="spirits">Spirits</option><option value="non_alcoholic">Non-Alcoholic</option><option value="other">Other</option></select>
            <label><input type="checkbox" id="itemAlcohol"> Contains Alcohol</label>
        </div>
        <div class="modal-footer"><button class="btn-primary" id="confirmCreateItemBtn">Add</button><button class="btn-secondary" id="closeItemModalBtn">Cancel</button></div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><h3><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h3></div>
        <div class="modal-body"><p id="deleteMessage"></p></div>
        <div class="modal-footer"><button class="btn-danger" id="confirmDeleteBtn">Delete</button><button class="btn-secondary" id="cancelDeleteBtn">Cancel</button></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';
    
    let lockers = [];
    let inventory = [];
    let pendingDelete = { type: null, id: null, name: '' };

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#b91c1c' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    async function loadLockers() {
        try {
            const { data, error } = await supabase.from('lockers').select('*').order('locker_number', { ascending: true });
            if (error) throw error;
            lockers = data || [];
            renderLockers();
            updateStats();
        } catch (err) { showToast('Failed to load lockers', true); console.error(err); }
    }

    async function loadInventory() {
        try {
            const { data, error } = await supabase.from('products').select('*').order('name', { ascending: true });
            if (error) throw error;
            inventory = data || [];
            renderInventory();
            updateStats();
        } catch (err) { showToast('Failed to load inventory', true); console.error(err); }
    }

    function updateStats() {
        document.getElementById('totalLockers').innerText = lockers.length;
        document.getElementById('availableLockers').innerText = lockers.filter(l => l.status === 'available').length;
        document.getElementById('occupiedLockers').innerText = lockers.filter(l => l.status === 'rented').length;
        document.getElementById('totalItems').innerText = inventory.length;
    }

    function renderLockers() {
        const container = document.getElementById('lockersList');
        if (!lockers.length) { container.innerHTML = '<div class="empty-state">No lockers. Create one.</div>'; return; }
        container.innerHTML = lockers.map(locker => `
            <div class="item-card">
                <div class="locker-header">
                    <span class="locker-number">🔒 ${escapeHtml(locker.locker_number)}</span>
                    <span class="locker-status status-${locker.status === 'available' ? 'available' : (locker.status === 'rented' ? 'occupied' : 'maintenance')}">${locker.status?.toUpperCase()}</span>
                </div>
                <div class="locker-details">
                    ${locker.location ? `<div><i class="fas fa-location-dot"></i> ${escapeHtml(locker.location)}</div>` : ''}
                    ${locker.size ? `<div><i class="fas fa-expand"></i> ${escapeHtml(locker.size)}</div>` : ''}
                </div>
                <div class="locker-actions">
                    ${locker.status === 'available' ? `<button class="btn-primary" onclick="markOccupied('${locker.id}')">Mark Occupied</button>` : `<button class="btn-secondary" onclick="markAvailable('${locker.id}')">Mark Available</button>`}
                    <button class="btn-danger" onclick="showDeleteModal('locker', '${locker.id}', '${escapeHtml(locker.locker_number)}')">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function renderInventory() {
        const container = document.getElementById('inventoryList');
        if (!inventory.length) { container.innerHTML = '<div class="empty-state">No products. Add one.</div>'; return; }
        container.innerHTML = inventory.map(item => `
            <div class="item-card">
                <div class="locker-header">
                    <span class="locker-number">${escapeHtml(item.name)}</span>
                    <span class="item-price">R${(item.price || 0).toFixed(2)}</span>
                </div>
                <div class="locker-details">
                    <span class="locker-status ${item.alcohol ? 'status-occupied' : 'status-available'}" style="display:inline-block;">${item.alcohol ? '🍺 Alcoholic' : '🥤 Non-Alcoholic'}</span>
                    <span style="margin-left:8px;">${item.category || 'Uncategorized'}</span>
                </div>
                <div class="locker-actions">
                    <button class="btn-danger" onclick="showDeleteModal('item', '${item.id}', '${escapeHtml(item.name)}')">Delete</button>
                </div>
            </div>
        `).join('');
    }

    window.markOccupied = async function(id) {
        await supabase.from('lockers').update({ status: 'rented' }).eq('id', id);
        showToast('Locker marked occupied');
        await loadLockers();
    };
    
    window.markAvailable = async function(id) {
        await supabase.from('lockers').update({ status: 'available' }).eq('id', id);
        showToast('Locker marked available');
        await loadLockers();
    };

    window.showDeleteModal = function(type, id, name) {
        pendingDelete = { type, id, name };
        document.getElementById('deleteMessage').innerText = `Delete "${name}"? This cannot be undone.`;
        document.getElementById('deleteModal').classList.add('active');
    };

    async function confirmDelete() {
        if (pendingDelete.type === 'locker') {
            const { error } = await supabase.from('lockers').delete().eq('id', pendingDelete.id);
            if (error) showToast('Delete failed', true);
            else { showToast('Locker deleted'); await loadLockers(); }
        } else if (pendingDelete.type === 'item') {
            const { error } = await supabase.from('products').delete().eq('id', pendingDelete.id);
            if (error) showToast('Delete failed', true);
            else { showToast('Product deleted'); await loadInventory(); }
        }
        document.getElementById('deleteModal').classList.remove('active');
        pendingDelete = { type: null, id: null, name: '' };
    }

    async function createLocker() {
        const number = document.getElementById('lockerNumber').value.trim();
        const location = document.getElementById('lockerLocation').value.trim();
        const size = document.getElementById('lockerSize').value;
        if (!number) { showToast('Locker number required', true); return; }
        const exists = lockers.some(l => l.locker_number === number);
        if (exists) { showToast('Locker number exists', true); return; }
        const { error } = await supabase.from('lockers').insert([{ locker_number: number, location: location || null, size: size, status: 'available', price_per_hour: 0 }]);
        if (error) showToast(error.message, true);
        else { showToast('Locker created'); document.getElementById('lockerModal').classList.remove('active'); await loadLockers(); }
        document.getElementById('lockerNumber').value = '';
        document.getElementById('lockerLocation').value = '';
    }

    async function createItem() {
        const name = document.getElementById('itemName').value.trim();
        const price = parseFloat(document.getElementById('itemPrice').value);
        const category = document.getElementById('itemCategory').value;
        const alcohol = document.getElementById('itemAlcohol').checked;
        if (!name || isNaN(price) || price <= 0) { showToast('Valid name and price required', true); return; }
        const { error } = await supabase.from('products').insert([{ name, price, category, alcohol, is_available: true, stock_quantity: 0, product_type: 'other' }]);
        if (error) showToast(error.message, true);
        else { showToast('Product added'); document.getElementById('itemModal').classList.remove('active'); await loadInventory(); }
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemAlcohol').checked = false;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`${tabId}Panel`).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
        if (tabId === 'lockers') loadLockers();
        else loadInventory();
    }

    document.getElementById('createLockerBtn').addEventListener('click', () => document.getElementById('lockerModal').classList.add('active'));
    document.getElementById('createItemBtn').addEventListener('click', () => document.getElementById('itemModal').classList.add('active'));
    document.getElementById('refreshLockersBtn').addEventListener('click', loadLockers);
    document.getElementById('refreshItemsBtn').addEventListener('click', loadInventory);
    document.getElementById('confirmCreateLockerBtn').addEventListener('click', createLocker);
    document.getElementById('confirmCreateItemBtn').addEventListener('click', createItem);
    document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);
    document.getElementById('closeLockerModalBtn').addEventListener('click', () => document.getElementById('lockerModal').classList.remove('active'));
    document.getElementById('closeItemModalBtn').addEventListener('click', () => document.getElementById('itemModal').classList.remove('active'));
    document.getElementById('cancelDeleteBtn').addEventListener('click', () => document.getElementById('deleteModal').classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
    
    loadLockers();
    loadInventory();
</script>
</body>
</html>
