<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Shisha Analytics | Premium Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --red: #E30613;
            --red-dark: #a0010e;
            --red-deep: #8A0009;
            --red-glow: rgba(227,6,19,0.12);
            --red-subtle: rgba(227,6,19,0.06);
            --ink: #1e293b;
            --ink-muted: #334155;
            --slate: #475569;
            --mist: #94a3b8;
            --bone: #f8fafd;
            --white: #ffffff;
            --success: #10b981;
            --gold: #f59e0b;
            --orange: #f97316;
            --purple: #8b5cf6;
            --border: rgba(0,0,0,0.07);
            --border-strong: #eef2f8;
            --shadow-soft: 0 8px 20px -6px rgba(0,0,0,0.08);
            --shadow-card: 0 4px 16px rgba(0,0,0,0.04);
            --radius-lg: 24px;
            --radius-xl: 28px;
            --radius-full: 9999px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bone);
            padding: 24px;
            color: var(--ink);
        }
        .dashboard-container { max-width: 1600px; margin: 0 auto; }
        
        /* Premium KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            border: 1px solid var(--border-strong);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--red);
        }
        .kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-soft); }
        .kpi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .kpi-icon {
            width: 48px; height: 48px;
            background: var(--red-subtle);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 1.4rem;
        }
        .kpi-value { font-size: 32px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
        .kpi-label { font-size: 12px; color: var(--mist); margin-top: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
        .trend-up { color: var(--success); background: #e6f7ec; padding: 2px 8px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        .trend-down { color: #ef4444; background: #fee2e2; padding: 2px 8px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        
        /* Section styles */
        .section {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-card);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
        }
        .section-title i { color: var(--red); }
        
        /* Stats grids */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
        }
        .stat-card {
            background: var(--bone);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            border: 1px solid var(--border-strong);
            transition: all 0.2s;
        }
        .stat-card:hover { background: var(--white); border-color: var(--red); }
        .stat-number { font-size: 24px; font-weight: 800; color: var(--red); }
        .stat-label { font-size: 11px; color: var(--mist); margin-top: 4px; font-weight: 500; }
        
        /* Chart rows */
        .chart-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }
        .chart-container {
            background: var(--bone);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border-strong);
        }
        canvas { max-height: 260px; width: 100%; }
        
        /* Leaderboard & Activity */
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-strong);
            font-size: 13px;
        }
        .rank {
            font-weight: 800;
            width: 32px;
            color: var(--red);
        }
        .activity-feed { max-height: 320px; overflow-y: auto; }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-strong);
        }
        .activity-badge {
            width: 36px; height: 36px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--red-subtle);
            color: var(--red);
        }
        .activity-detail { flex: 1; font-size: 13px; }
        .activity-amount { font-weight: 700; color: var(--red); }
        .activity-time { font-size: 10px; color: var(--mist); }
        
        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-active { background: #fee2e2; color: var(--red); }
        .status-refill { background: #fff3e0; color: var(--gold); }
        .status-paused { background: #fff8e1; color: #ff8f00; }
        .status-available { background: #e6f7ec; color: #166534; }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .filter-chip {
            background: var(--bone);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            border: 1px solid var(--border-strong);
        }
        .filter-chip.active, .filter-chip:hover { background: var(--red); color: white; border-color: var(--red); }
        
        .loading-state { text-align: center; padding: 60px; color: var(--mist); }
        .empty-state { text-align: center; padding: 40px; color: var(--mist); }
        
        @media (max-width: 900px) {
            body { padding: 16px; }
            .chart-row { grid-template-columns: 1fr; }
            .kpi-grid { gap: 12px; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- HERO KPI SECTION -->
    <div class="kpi-grid" id="heroKpiGrid"></div>

    <!-- REVENUE & SESSION METRICS -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-chart-line"></i> Revenue Analytics</div>
            </div>
            <canvas id="revenueChart"></canvas>
            <div id="revenueStats" class="stats-grid" style="margin-top: 16px;"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-fire"></i> Session Performance</div>
            </div>
            <canvas id="sessionStatusChart"></canvas>
            <div id="sessionStats" class="stats-grid" style="margin-top: 16px;"></div>
        </div>
    </div>

    <!-- HOOKAH UTILIZATION + FLAVOUR POPULARITY -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-smoking"></i> Hookah Utilization</div>
            </div>
            <canvas id="utilizationChart"></canvas>
            <div id="deviceStats" class="stats-grid" style="margin-top: 16px;"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-leaf"></i> Top Flavours</div>
            </div>
            <canvas id="flavourChart"></canvas>
            <div id="topFlavourInfo" class="stat-card" style="margin-top: 16px; text-align: center;"></div>
        </div>
    </div>

    <!-- SERVICE REQUESTS + RECENT ACTIVITY -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-concierge-bell"></i> Service Request Analytics</div>
            </div>
            <canvas id="requestChart"></canvas>
            <div id="requestStats" class="stats-grid" style="margin-top: 16px;"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-stream"></i> Recent Activity</div>
                <span style="font-size: 11px; color: var(--mist);"><i class="fas fa-sync-alt"></i> real-time</span>
            </div>
            <div id="recentActivity" class="activity-feed"></div>
        </div>
    </div>

    <!-- LOCATION PERFORMANCE + ALERTS -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-map-marker-alt"></i> Location Performance</div>
            </div>
            <div id="locationStats" class="stats-grid"></div>
            <canvas id="locationRevenueChart" style="margin-top: 16px;"></canvas>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-bell"></i> System Alerts</div>
            </div>
            <div id="alertsContainer" class="activity-feed"></div>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // Charts storage
    let charts = {};

    // Helper
    const fmtR = (val) => `R${(val || 0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
    const fmtNumber = (val) => (val || 0).toLocaleString();

    // Data state
    let sessions = [];
    let devices = [];
    let flavours = [];
    let locations = [];
    let requests = [];

    // ========== LOAD DATA FROM SUPABASE ==========
    async function loadShishaData() {
        try {
            // Load completed/active sessions for analytics
            const { data: sessionData, error: sessionErr } = await supabase
                .from('shisha_sessions')
                .select('*, shisha_products(name), shisha_locations(name), hookah_devices(device_code)')
                .order('created_at', { ascending: false });
            if (sessionErr) throw sessionErr;
            sessions = sessionData || [];

            // Load devices for utilization stats
            const { data: deviceData, error: deviceErr } = await supabase
                .from('hookah_devices')
                .select('*')
                .order('device_code');
            if (deviceErr) throw deviceErr;
            devices = deviceData || [];

            // Load flavours
            const { data: flavourData, error: flavourErr } = await supabase
                .from('shisha_products')
                .select('*')
                .eq('is_available', true);
            if (flavourErr) throw flavourErr;
            flavours = flavourData || [];

            // Load locations
            const { data: locationData, error: locationErr } = await supabase
                .from('shisha_locations')
                .select('*')
                .eq('is_active', true);
            if (locationErr) throw locationErr;
            locations = locationData || [];

            // Load service requests
            const { data: requestData, error: requestErr } = await supabase
                .from('shisha_requests')
                .select('*')
                .order('created_at', { ascending: false });
            if (requestErr) throw requestErr;
            requests = requestData || [];

            renderAllDashboards();
        } catch (err) {
            console.error('Error loading shisha data:', err);
            generateMockData();
            renderAllDashboards();
        }
    }

    function generateMockData() {
        sessions = Array.from({ length: 45 }, (_, i) => ({
            id: `s${i}`,
            total_amount: [250, 500, 750, 1000][Math.floor(Math.random() * 4)],
            status: ['active', 'expired', 'completed', 'refill'][Math.floor(Math.random() * 4)],
            refill_count: Math.floor(Math.random() * 3),
            created_at: new Date(Date.now() - Math.random() * 30 * 86400000).toISOString(),
            shisha_products: { name: ['Double Apple', 'Mint+Grape', 'Watermelon', 'Berry Mint'][Math.floor(Math.random() * 4)] },
            shisha_locations: { name: ['Main Lounge', 'VIP Terrace', 'Garden Area', 'Rooftop'][Math.floor(Math.random() * 4)] },
            hookah_devices: { device_code: `SH-${Math.floor(Math.random() * 20) + 1}` }
        }));
        devices = Array.from({ length: 15 }, (_, i) => ({ id: `d${i}`, device_code: `SH-${i + 1}`, status: 'available' }));
        flavours = [{ name: 'Double Apple', price: 250 }, { name: 'Mint+Grape', price: 250 }, { name: 'Watermelon', price: 250 }, { name: 'Berry Mint', price: 250 }];
        locations = [{ name: 'Main Lounge' }, { name: 'VIP Terrace' }, { name: 'Garden Area' }, { name: 'Rooftop' }];
        requests = Array.from({ length: 12 }, (_, i) => ({
            request_type: ['new_order', 'coal_refill', 'extend_time', 'end_session'][Math.floor(Math.random() * 4)],
            status: ['pending', 'approved', 'completed'][Math.floor(Math.random() * 3)],
            created_at: new Date(Date.now() - Math.random() * 7 * 86400000).toISOString(),
            amount: [250, 250, 120, 0][Math.floor(Math.random() * 4)]
        }));
    }

    // ========== RENDER HERO KPI ==========
    function renderHeroKPI() {
        const totalRevenue = sessions.reduce((sum, s) => sum + (s.total_amount || 0), 0);
        const activeSessions = sessions.filter(s => s.status === 'active').length;
        const totalSessions = sessions.length;
        const avgSessionValue = totalRevenue / (totalSessions || 1);
        const refillRate = sessions.reduce((sum, s) => sum + (s.refill_count || 0), 0);
        const utilizationRate = devices.length ? (activeSessions / devices.length * 100) : 0;
        const pendingRequests = requests.filter(r => r.status === 'pending').length;

        const heroItems = [
            { icon: "fa-chart-line", label: "Total Revenue", value: fmtR(totalRevenue), trend: "+18%", trendUp: true },
            { icon: "fa-fire", label: "Active Sessions", value: activeSessions, sub: `${Math.round(utilizationRate)}% hookah utilization` },
            { icon: "fa-coins", label: "Avg Session Value", value: fmtR(avgSessionValue), trend: "+5%" },
            { icon: "fa-chart-simple", label: "Total Sessions", value: fmtNumber(totalSessions), sub: `${refillRate} total refills` },
            { icon: "fa-concierge-bell", label: "Pending Requests", value: pendingRequests, trend: pendingRequests > 3 ? "+2" : "steady" },
            { icon: "fa-percent", label: "Refill Rate", value: `${((refillRate / totalSessions) * 100).toFixed(1)}%`, sub: "per session avg" }
        ];
        document.getElementById('heroKpiGrid').innerHTML = heroItems.map(k => `
            <div class="kpi-card">
                <div class="kpi-header">
                    <div class="kpi-icon"><i class="fas ${k.icon}"></i></div>
                    ${k.trend ? `<span class="${k.trendUp ? 'trend-up' : 'trend-down'}"><i class="fas fa-arrow-${k.trendUp ? 'up' : 'down'}"></i> ${k.trend}</span>` : ''}
                </div>
                <div class="kpi-value">${k.value}</div>
                <div class="kpi-label">${k.label}</div>
                ${k.sub ? `<div style="font-size: 11px; color: var(--mist); margin-top: 6px;">${k.sub}</div>` : ''}
            </div>
        `).join('');
    }

    function renderRevenueAnalytics() {
        // Last 7 days revenue
        const last7Days = [...Array(7)].map((_, i) => {
            const date = new Date();
            date.setDate(date.getDate() - i);
            return date.toISOString().split('T')[0];
        }).reverse();
        
        const revenueByDay = last7Days.map(day => {
            return sessions.filter(s => s.created_at?.startsWith(day)).reduce((sum, s) => sum + (s.total_amount || 0), 0);
        });
        
        const ctx = document.getElementById('revenueChart').getContext('2d');
        if (charts.revenue) charts.revenue.destroy();
        charts.revenue = new Chart(ctx, {
            type: 'line',
            data: { labels: last7Days.map(d => d.slice(5)), datasets: [{ label: 'Revenue (R)', data: revenueByDay, borderColor: '#E30613', backgroundColor: 'rgba(227,6,19,0.1)', fill: true, tension: 0.3 }] },
            options: { responsive: true, plugins: { tooltip: { callbacks: { label: (ctx) => `R${ctx.raw.toLocaleString()}` } } } }
        });
        
        const todayRevenue = revenueByDay[revenueByDay.length - 1];
        const weekRevenue = revenueByDay.reduce((a, b) => a + b, 0);
        const monthRevenue = sessions.reduce((sum, s) => sum + (s.total_amount || 0), 0);
        
        document.getElementById('revenueStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${fmtR(todayRevenue)}</div><div class="stat-label">Today</div></div>
            <div class="stat-card"><div class="stat-number">${fmtR(weekRevenue)}</div><div class="stat-label">This Week</div></div>
            <div class="stat-card"><div class="stat-number">${fmtR(monthRevenue)}</div><div class="stat-label">All Time</div></div>
        `;
    }

    function renderSessionPerformance() {
        const active = sessions.filter(s => s.status === 'active').length;
        const refill = sessions.filter(s => s.status === 'refill').length;
        const expired = sessions.filter(s => s.status === 'expired').length;
        const completed = sessions.filter(s => s.status === 'completed').length;
        
        const ctx = document.getElementById('sessionStatusChart').getContext('2d');
        if (charts.sessionStatus) charts.sessionStatus.destroy();
        charts.sessionStatus = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Active', 'Refill Soon', 'Expired', 'Completed'], datasets: [{ data: [active, refill, expired, completed], backgroundColor: ['#E30613', '#f59e0b', '#6b7280', '#10b981'] }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
        
        document.getElementById('sessionStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${active}</div><div class="stat-label">Active</div></div>
            <div class="stat-card"><div class="stat-number">${refill}</div><div class="stat-label">Refill Soon</div></div>
            <div class="stat-card"><div class="stat-number">${expired}</div><div class="stat-label">Expired</div></div>
            <div class="stat-card"><div class="stat-number">${completed}</div><div class="stat-label">Completed</div></div>
        `;
    }

    function renderHookahUtilization() {
        const activeSessions = sessions.filter(s => s.status === 'active');
        const inUse = new Set(activeSessions.map(s => s.device_id)).size;
        const available = devices.length - inUse;
        const maintenance = devices.filter(d => d.status === 'maintenance').length;
        
        const ctx = document.getElementById('utilizationChart').getContext('2d');
        if (charts.utilization) charts.utilization.destroy();
        charts.utilization = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['In Use', 'Available', 'Maintenance'], datasets: [{ label: 'Hookah Stations', data: [inUse, available, maintenance], backgroundColor: ['#E30613', '#10b981', '#f59e0b'], borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: true }
        });
        
        document.getElementById('deviceStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${devices.length}</div><div class="stat-label">Total Hookahs</div></div>
            <div class="stat-card"><div class="stat-number">${inUse}</div><div class="stat-label">In Use</div></div>
            <div class="stat-card"><div class="stat-number">${available}</div><div class="stat-label">Available</div></div>
            <div class="stat-card"><div class="stat-number">${Math.round((inUse / devices.length) * 100)}%</div><div class="stat-label">Utilization</div></div>
        `;
    }

    function renderFlavourPopularity() {
        const flavourCount = {};
        sessions.forEach(s => {
            const name = s.shisha_products?.name || 'Unknown';
            flavourCount[name] = (flavourCount[name] || 0) + 1;
        });
        const sorted = Object.entries(flavourCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
        
        const ctx = document.getElementById('flavourChart').getContext('2d');
        if (charts.flavour) charts.flavour.destroy();
        charts.flavour = new Chart(ctx, {
            type: 'bar',
            data: { labels: sorted.map(f => f[0]), datasets: [{ label: 'Session Count', data: sorted.map(f => f[1]), backgroundColor: '#E30613', borderRadius: 8 }] },
            options: { responsive: true, indexAxis: 'y' }
        });
        
        const topFlavour = sorted[0];
        document.getElementById('topFlavourInfo').innerHTML = `<strong>🏆 Most Popular:</strong> ${topFlavour?.[0] || '—'} (${topFlavour?.[1] || 0} sessions)`;
    }

    function renderServiceRequestAnalytics() {
        const newOrders = requests.filter(r => r.request_type === 'new_order').length;
        const refills = requests.filter(r => r.request_type === 'coal_refill').length;
        const extensions = requests.filter(r => r.request_type === 'extend_time').length;
        const ends = requests.filter(r => r.request_type === 'end_session').length;
        const pending = requests.filter(r => r.status === 'pending').length;
        const approved = requests.filter(r => r.status === 'approved' || r.status === 'completed').length;
        
        const ctx = document.getElementById('requestChart').getContext('2d');
        if (charts.requests) charts.requests.destroy();
        charts.requests = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['New Orders', 'Coal Refills', 'Extensions', 'End Session'], datasets: [{ data: [newOrders, refills, extensions, ends], backgroundColor: ['#E30613', '#f59e0b', '#8b5cf6', '#10b981'] }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
        
        document.getElementById('requestStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${pending}</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-number">${approved}</div><div class="stat-label">Approved</div></div>
            <div class="stat-card"><div class="stat-number">${newOrders}</div><div class="stat-label">New Orders</div></div>
            <div class="stat-card"><div class="stat-number">${refills}</div><div class="stat-label">Refill Requests</div></div>
        `;
    }

    function renderRecentActivity() {
        const recent = [...sessions].slice(0, 8);
        const container = document.getElementById('recentActivity');
        if (!recent.length) { container.innerHTML = '<div class="empty-state">No recent activity</div>'; return; }
        container.innerHTML = recent.map(s => {
            const statusText = { active: 'Started', refill: 'Refill needed', expired: 'Expired', completed: 'Completed' }[s.status] || s.status;
            return `<div class="activity-item">
                <div class="activity-badge"><i class="fas ${s.status === 'active' ? 'fa-play' : s.status === 'refill' ? 'fa-fire' : 'fa-stop'}"></i></div>
                <div class="activity-detail"><strong>${s.shisha_products?.name || 'Session'}</strong> ${statusText} on ${s.hookah_devices?.device_code || 'Hookah'}<div class="activity-time">${new Date(s.created_at).toLocaleString()}</div></div>
                <div class="activity-amount">${fmtR(s.total_amount)}</div>
            </div>`;
        }).join('');
    }

    function renderLocationPerformance() {
        const locationRevenue = {};
        const locationSessions = {};
        sessions.forEach(s => {
            const name = s.shisha_locations?.name || 'Unknown';
            locationRevenue[name] = (locationRevenue[name] || 0) + (s.total_amount || 0);
            locationSessions[name] = (locationSessions[name] || 0) + 1;
        });
        const sorted = Object.entries(locationRevenue).sort((a, b) => b[1] - a[1]);
        
        document.getElementById('locationStats').innerHTML = sorted.slice(0, 4).map(([name, revenue], idx) => `
            <div class="stat-card"><div class="stat-number">${name.slice(0, 15)}</div><div class="stat-label">${fmtR(revenue)} · ${locationSessions[name]} sessions</div></div>
        `).join('');
        
        const ctx = document.getElementById('locationRevenueChart').getContext('2d');
        if (charts.location) charts.location.destroy();
        charts.location = new Chart(ctx, {
            type: 'bar',
            data: { labels: sorted.map(l => l[0]), datasets: [{ label: 'Revenue (R)', data: sorted.map(l => l[1]), backgroundColor: '#E30613', borderRadius: 8 }] },
            options: { responsive: true }
        });
    }

    function renderAlerts() {
        const activeSessions = sessions.filter(s => s.status === 'active').length;
        const refillSessions = sessions.filter(s => s.status === 'refill').length;
        const pendingRequests = requests.filter(r => r.status === 'pending').length;
        const availableHookahs = devices.filter(d => d.status === 'available').length;
        
        const alerts = [];
        if (refillSessions > 3) alerts.push({ level: 'warning', title: 'Multiple Sessions Need Refill', desc: `${refillSessions} hookahs require immediate coal refill` });
        if (availableHookahs === 0 && activeSessions > 0) alerts.push({ level: 'info', title: 'All Hookahs Occupied', desc: 'Consider adding more stations' });
        if (pendingRequests > 5) alerts.push({ level: 'critical', title: 'High Request Volume', desc: `${pendingRequests} pending service requests` });
        if (activeSessions === 0) alerts.push({ level: 'info', title: 'No Active Sessions', desc: 'Lounge is quiet - promote shisha specials' });
        
        const container = document.getElementById('alertsContainer');
        if (!alerts.length) { container.innerHTML = '<div class="empty-state">No active alerts</div>'; return; }
        container.innerHTML = alerts.map(a => `
            <div class="activity-item" style="border-left: 4px solid ${a.level === 'critical' ? '#dc2626' : a.level === 'warning' ? '#f59e0b' : '#3b82f6'}; background: ${a.level === 'critical' ? '#fff5f5' : a.level === 'warning' ? '#fffbeb' : '#eff6ff'}; padding-left: 12px; border-radius: 12px; margin-bottom: 8px;">
                <div><strong>${a.title}</strong><br><small>${a.desc}</small></div>
            </div>
        `).join('');
    }

    function renderAllDashboards() {
        renderHeroKPI();
        renderRevenueAnalytics();
        renderSessionPerformance();
        renderHookahUtilization();
        renderFlavourPopularity();
        renderServiceRequestAnalytics();
        renderRecentActivity();
        renderLocationPerformance();
        renderAlerts();
    }

    // Real-time subscriptions
    function setupRealtime() {
        supabase.channel('shisha-analytics')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'shisha_sessions' }, () => loadShishaData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'shisha_requests' }, () => loadShishaData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'hookah_devices' }, () => loadShishaData())
            .subscribe();
    }

    // Auto-refresh every 30 seconds
    setInterval(() => loadShishaData(), 30000);
    
    loadShishaData();
    setupRealtime();
</script>
</body>
</html>
