<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>NEBULA ADMIN • Event Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: radial-gradient(circle at 10% 20%, rgba(227,6,19,0.03) 0%, #f5f7fc 100%);
        padding: 28px 24px;
        color: #0a0c15;
    }

    .container {
        max-width: 1440px;
        margin: 0 auto;
    }

    /* stats redefined */
    .stats-row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 32px;
    }

    .stat-card {
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(2px);
        border-radius: 32px;
        padding: 20px 24px;
        flex: 1;
        min-width: 160px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
        border: 1px solid rgba(227,6,19,0.12);
        transition: all 0.2s ease;
    }

    .stat-number {
        font-size: 34px;
        font-weight: 800;
        color: #E30613;
        letter-spacing: -0.02em;
    }

    .stat-label {
        font-size: 13px;
        font-weight: 500;
        color: #4a5568;
        margin-top: 6px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .section-title {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #0f172a;
        letter-spacing: -0.3px;
    }

    /* premium carousel */
    .carousel-section {
        margin-bottom: 32px;
        position: relative;
    }

    .carousel-container {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    .carousel-wrapper {
        overflow-x: auto;
        scroll-behavior: smooth;
        scroll-snap-type: x mandatory;
        border-radius: 40px;
        scrollbar-width: thin;
        padding-bottom: 8px;
    }

    .carousel-wrapper::-webkit-scrollbar {
        height: 5px;
    }

    .carousel-wrapper::-webkit-scrollbar-track {
        background: #eef2f8;
        border-radius: 20px;
    }

    .carousel-wrapper::-webkit-scrollbar-thumb {
        background: #E30613;
        border-radius: 20px;
    }

    .carousel-track {
        display: flex;
        gap: 24px;
        padding: 8px 6px 18px 6px;
    }

    /* cosmic event cards */
    .event-card {
        flex: 0 0 320px;
        scroll-snap-align: start;
        background: #ffffff;
        border-radius: 36px;
        border: 1px solid rgba(227,6,19,0.15);
        overflow: hidden;
        cursor: pointer;
        transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        box-shadow: 0 12px 28px -12px rgba(0,0,0,0.08);
        position: relative;
    }

    .event-card:hover {
        transform: translateY(-8px) scale(1.01);
        box-shadow: 0 28px 40px -16px rgba(227,6,19,0.25);
        border-color: #E30613;
    }

    .event-card.selected {
        border: 2.5px solid #E30613;
        box-shadow: 0 0 0 3px rgba(227,6,19,0.2), 0 20px 30px -12px rgba(0,0,0,0.2);
        background: #fffef7;
    }

    .event-banner {
        height: 140px;
        background: linear-gradient(125deg, #E30613, #a50e12, #2c0b0d);
        background-size: 200% 200%;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 16px;
        position: relative;
        overflow: hidden;
    }

    .event-banner::after {
        content: "✨";
        position: absolute;
        font-size: 60px;
        opacity: 0.2;
        bottom: -10px;
        left: -10px;
        transform: rotate(-10deg);
    }

    .event-status {
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(6px);
        padding: 5px 14px;
        border-radius: 60px;
        font-size: 0.7rem;
        font-weight: 700;
        color: white;
        letter-spacing: 0.5px;
        border: 0.5px solid rgba(255,255,255,0.3);
    }

    .event-content {
        padding: 20px 18px 22px;
    }

    .event-name {
        font-weight: 800;
        font-size: 1.15rem;
        color: #E30613;
        margin-bottom: 10px;
        letter-spacing: -0.2px;
    }

    .event-detail {
        font-size: 0.75rem;
        color: #4b5568;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
    }

    .ticket-summary {
        margin-top: 16px;
        padding: 10px 14px;
        background: linear-gradient(115deg, #fff5f5, #ffffff);
        border-radius: 28px;
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        font-weight: 700;
        border: 0.5px solid #ffe1e1;
    }

    .carousel-arrow {
        background: white;
        border: 1px solid #e9edf2;
        border-radius: 60px;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 5px 12px rgba(0,0,0,0.03);
    }

    .carousel-arrow i {
        color: #E30613;
        font-size: 1.2rem;
    }

    .carousel-arrow:hover {
        background: #E30613;
        border-color: #E30613;
    }
    .carousel-arrow:hover i { color: white; }

    .panel {
        background: rgba(255,255,255,0.96);
        backdrop-filter: blur(2px);
        border-radius: 36px;
        padding: 28px 30px;
        border: 1px solid #f0f2f8;
        box-shadow: 0 20px 35px -12px rgba(0,0,0,0.05);
        margin-bottom: 20px;
    }

    .action-bar {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 28px;
    }

    .btn-primary {
        background: #E30613;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 44px;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.85rem;
        transition: 0.2s;
        box-shadow: 0 4px 10px rgba(227,6,19,0.2);
    }
    .btn-primary:hover { background: #b00510; transform: scale(0.97); }

    .btn-secondary {
        background: #f1f5f9;
        color: #1e293b;
        border: 1px solid #e2e8f0;
        padding: 12px 24px;
        border-radius: 44px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-danger {
        background: #fee2e2;
        color: #dc2626;
        border: none;
        padding: 12px 24px;
        border-radius: 44px;
        font-weight: 700;
        cursor: pointer;
    }
    .btn-warning {
        background: #fff0e5;
        color: #e67e22;
        border: none;
        padding: 12px 24px;
        border-radius: 44px;
        font-weight: 700;
        cursor: pointer;
    }

    /* selected event info - premium styling with great padding and gap */
    .selected-info-premium {
        background: linear-gradient(105deg, #ffffff 0%, #fffafb 100%);
        border-radius: 32px;
        padding: 24px 28px;
        margin-bottom: 28px;
        border: 1px solid rgba(227,6,19,0.2);
        box-shadow: 0 8px 18px rgba(227,6,19,0.05);
        transition: all 0.2s;
    }

    .event-info-glow {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 28px;
        row-gap: 14px;
    }

    .event-name-large {
        font-size: 1.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #E30613, #b91e2a);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        letter-spacing: -0.3px;
    }

    .event-meta-chip {
        background: #f1f5f9;
        padding: 6px 16px;
        border-radius: 100px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    /* Ticket inventory - uniform align */
    .ticket-inventory-modern {
        background: #fefcfa;
        border-radius: 28px;
        padding: 8px 0;
        margin-bottom: 28px;
        border: 1px solid #ffe8e8;
    }

    .inventory-header {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
        padding: 16px 20px;
        background: #fff3f0;
        border-radius: 24px;
        font-weight: 700;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #4a2a2e;
        margin-bottom: 8px;
    }

    .ticket-row-uniform {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
        padding: 14px 20px;
        border-bottom: 1px solid #ffe0dd;
        align-items: center;
        font-weight: 500;
        font-size: 0.85rem;
        transition: 0.1s;
    }

    .ticket-row-uniform:hover {
        background: #fff8f5;
    }

    .ticket-type-badge {
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .purchase-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: #ffffff;
        border-radius: 24px;
        margin-bottom: 10px;
        border: 1px solid #f0e7e7;
        font-size: 0.8rem;
    }

    /* stunning modal overlays - glassmorphic */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(10, 10, 20, 0.65);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.25s ease;
    }

    .modal-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .modal-content {
        background: #ffffff;
        border-radius: 44px;
        max-width: 540px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow: 0 40px 60px rgba(0,0,0,0.3);
        animation: floatUp 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    @keyframes floatUp {
        from { transform: scale(0.96) translateY(20px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-header {
        padding: 24px 28px;
        background: #E30613;
        border-radius: 44px 44px 0 0;
    }
    .modal-header h3 { color: white; font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 12px; }
    .modal-body { padding: 28px; }
    .modal-body input, .modal-body select { width: 100%; padding: 14px 18px; margin: 8px 0 20px; border-radius: 60px; border: 1px solid #e2e8f0; font-family: inherit; background: #fefefe; }
    .ticket-type-toggle { margin-bottom: 20px; border: 1px solid #ffe2e2; border-radius: 28px; padding: 16px; background: #fffbfb; }
    .ticket-header { display: flex; justify-content: space-between; cursor: pointer; font-weight: 700; }
    .ticket-fields { display: none; margin-top: 14px; }
    .ticket-fields.active { display: block; }
    .modal-footer { display: flex; gap: 14px; padding: 0 28px 28px 28px; }
    .modal-footer button { flex: 1; padding: 14px; border-radius: 60px; font-weight: 700; }

    /* beautiful toast replaced by custom modals — but we still keep alerts elegant */
    .toast-premium {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #0f172a;
        backdrop-filter: blur(12px);
        color: white;
        padding: 16px 28px;
        border-radius: 60px;
        font-weight: 600;
        z-index: 1001;
        display: none;
        align-items: center;
        gap: 14px;
        box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2);
        border-left: 5px solid #E30613;
        font-size: 0.9rem;
    }

    .empty-state { text-align: center; padding: 36px; color: #94a3b8; font-weight: 500; }

    @media (max-width: 700px) {
        body { padding: 16px; }
        .inventory-header, .ticket-row-uniform { grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr; gap: 5px; font-size: 0.7rem; }
        .event-card { flex: 0 0 260px; }
        .selected-info-premium { padding: 18px; }
    }
</style>
</head>
<body>
<div class="container">
    <!-- stats row -->
    <div class="stats-row">
        <div class="stat-card"><div class="stat-number" id="totalTickets">-</div><div class="stat-label">Tickets Sold</div></div>
        <div class="stat-card"><div class="stat-number" id="totalEvents">-</div><div class="stat-label">Active Events</div></div>
        <div class="stat-card"><div class="stat-number" id="totalTicketHolders">-</div><div class="stat-label">Ticket Holders</div></div>
        <div class="stat-card"><div class="stat-number" id="totalRevenue">R0</div><div class="stat-label">Revenue (ZAR)</div></div>
    </div>

    <!-- CAROUSEL out of this world -->
    <div class="carousel-section">
        <div class="carousel-container">
            <div class="carousel-arrow" id="prevArrow"><i class="fas fa-chevron-left"></i></div>
            <div class="carousel-wrapper" id="carouselWrapper">
                <div class="carousel-track" id="eventCarousel"></div>
            </div>
            <div class="carousel-arrow" id="nextArrow"><i class="fas fa-chevron-right"></i></div>
        </div>
    </div>

    <!-- main panel -->
    <div class="panel">
        <div class="section-title"><i class="fas fa-crown" style="color:#E30613;"></i> Event Command Center</div>
        <div class="action-bar">
            <button class="btn-primary" id="addEventBtn"><i class="fas fa-plus-circle"></i> Add Event</button>
            <button class="btn-danger" id="deleteEventBtn"><i class="fas fa-trash-alt"></i> Delete Selected</button>
            <button class="btn-warning" id="editTicketsBtn"><i class="fas fa-tags"></i> Edit Tickets</button>
            <button class="btn-secondary" id="refreshEventsBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>

        <!-- premium event info block with PADDING + GAP & EXACT display like Mzonke testing 2 📅 ... -->
        <div id="selectedEventInfo" class="selected-info-premium" style="display:none;"></div>

        <!-- Ticket inventory aligned uniformly -->
        <div class="section-title" style="font-size:1.1rem;"><i class="fas fa-ticket-alt"></i> Ticket Inventory • structured tiers</div>
        <div id="ticketInventory" class="ticket-inventory-modern"></div>

        <div class="section-title" style="font-size:1.1rem;"><i class="fas fa-history"></i> Recent ticket purchases</div>
        <div id="purchasesList"></div>
    </div>
</div>

<!-- STUNNING ALERT MODAL (replaces alert/confirm) -->
<div id="stunningAlertModal" class="modal-overlay">
    <div class="modal-content" style="max-width: 420px;">
        <div class="modal-header" style="background:#1e293b;"><h3><i class="fas fa-bell"></i> Notification</h3></div>
        <div class="modal-body" id="alertMessageBody">Message here</div>
        <div class="modal-footer"><button class="btn-primary" id="closeAlertBtn" style="background:#E30613;">Got it</button></div>
    </div>
</div>

<!-- Add Event Modal -->
<div id="addEventModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><h3><i class="fas fa-calendar-plus"></i> Create Interstellar Event</h3></div>
        <div class="modal-body">
            <input type="text" id="eventName" placeholder="Event name *" value="Mzonke testing 2">
            <input type="date" id="eventDate" value="2026-06-05">
            <input type="text" id="eventLocation" placeholder="Location" value="Rands Cape Town">
            <div class="ticket-type-toggle"><div class="ticket-header" onclick="toggleFields('earlyBird')"><span>🐦 Early Bird</span><i class="fas fa-chevron-down"></i></div><div id="earlyBirdFields" class="ticket-fields"><input type="number" id="ebPrice" placeholder="Price (R)"><input type="number" id="ebCap" placeholder="Capacity"></div></div>
            <div class="ticket-type-toggle"><div class="ticket-header" onclick="toggleFields('general')"><span>🎟️ General Admission</span><i class="fas fa-chevron-down"></i></div><div id="generalFields" class="ticket-fields"><input type="number" id="genPrice" placeholder="Price (R)"><input type="number" id="genCap" placeholder="Capacity"></div></div>
            <div class="ticket-type-toggle"><div class="ticket-header" onclick="toggleFields('vip')"><span>👑 VIP Experience</span><i class="fas fa-chevron-down"></i></div><div id="vipFields" class="ticket-fields"><input type="number" id="vipPrice" placeholder="Price (R)"><input type="number" id="vipCap" placeholder="Capacity"></div></div>
        </div>
        <div class="modal-footer"><button class="btn-primary" id="confirmAddEventBtn">Launch Event</button><button class="btn-secondary" id="closeAddModalBtn">Cancel</button></div>
    </div>
</div>

<!-- Edit Tickets Modal -->
<div id="editTicketsModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><h3><i class="fas fa-edit"></i> Adjust ticket universe</h3></div>
        <div class="modal-body">
            <div><label>🐦 Early Bird</label><div style="display:flex; gap:10px;"><input type="number" id="editEbPrice" placeholder="Price" style="flex:1;"><input type="number" id="editEbCap" placeholder="Capacity" style="flex:1;"></div></div>
            <div style="margin-top:20px;"><label>🎟️ General</label><div style="display:flex; gap:10px;"><input type="number" id="editGenPrice" placeholder="Price" style="flex:1;"><input type="number" id="editGenCap" placeholder="Capacity" style="flex:1;"></div></div>
            <div style="margin-top:20px;"><label>👑 VIP</label><div style="display:flex; gap:10px;"><input type="number" id="editVipPrice" placeholder="Price" style="flex:1;"><input type="number" id="editVipCap" placeholder="Capacity" style="flex:1;"></div></div>
        </div>
        <div class="modal-footer"><button class="btn-primary" id="saveTicketsBtn">Save Changes</button><button class="btn-secondary" id="closeEditModalBtn">Cancel</button></div>
    </div>
</div>

<div id="premiumToast" class="toast-premium"><i class="fas fa-check-circle" style="color:#E30613;"></i> <span id="toastMsg"></span></div>

<script type="module">
    import { supabase } from '../config/supabase.js';
    
    let events = [];
    let selectedEventId = null;
    
    function showStunningAlert(msg, isError = false) {
        const modal = document.getElementById('stunningAlertModal');
        const bodyDiv = document.getElementById('alertMessageBody');
        bodyDiv.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-sparkle'}" style="margin-right:12px; color:#E30613;"></i> ${msg}`;
        modal.classList.add('active');
        document.getElementById('closeAlertBtn').onclick = () => modal.classList.remove('active');
    }
    
    function showToastModern(msg, isError = false) {
        const toast = document.getElementById('premiumToast');
        const msgSpan = document.getElementById('toastMsg');
        msgSpan.innerText = msg;
        toast.style.display = 'flex';
        if (isError) toast.style.borderLeftColor = '#f97316';
        else toast.style.borderLeftColor = '#E30613';
        setTimeout(() => { toast.style.display = 'none'; }, 2800);
    }
    
    window.showAlert = showStunningAlert;
    window.toast = showToastModern;
    
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    
    async function loadEvents() {
        try {
            const { data: eventsData, error: eventsError } = await supabase.from('events').select('*').order('created_at', { ascending: false });
            if (eventsError) throw eventsError;
            const { data: ticketTypes } = await supabase.from('ticket_types').select('*');
            events = (eventsData || []).map(ev => {
                const eventTickets = (ticketTypes || []).filter(tt => tt.event_id === ev.id);
                return {
                    id: ev.id, name: ev.name, date: ev.start_time?.split('T')[0] || '', location: ev.location || 'Rands',
                    ticketTypes: { earlyBird: eventTickets.find(t => t.name?.toLowerCase().includes('early')) || { price: 0, capacity: 0, sold: 0 },
                                  general: eventTickets.find(t => t.name?.toLowerCase().includes('general')) || { price: ev.base_price || 0, capacity: 0, sold: 0 },
                                  vip: eventTickets.find(t => t.name?.toLowerCase().includes('vip')) || { price: ev.vip_price || 0, capacity: 0, sold: 0 } }
                };
            });
            renderCarousel();
            updateStats();
            if (events.length && !selectedEventId) selectEvent(events[0].id);
            else if (selectedEventId && events.find(e => e.id === selectedEventId)) selectEvent(selectedEventId);
            else if (!events.length) {
                document.getElementById('selectedEventInfo').style.display = 'none';
                document.getElementById('ticketInventory').innerHTML = '<div class="empty-state">✨ No events yet — create one!</div>';
                document.getElementById('purchasesList').innerHTML = '<div class="empty-state">No purchases</div>';
            }
        } catch (err) { showStunningAlert('Failed to load events: ' + err.message, true); console.error(err); }
    }
    
    function updateStats() {
        const tickets = JSON.parse(localStorage.getItem('rands_tickets') || '[]');
        document.getElementById('totalTickets').innerText = tickets.length;
        document.getElementById('totalEvents').innerText = events.filter(e => true).length;
        const holders = new Set(tickets.map(t => t.ticketId?.split('_')[0])).size;
        document.getElementById('totalTicketHolders').innerText = holders;
        let revenue = 0;
        for (let ev of events) {
            for (let type of ['earlyBird', 'general', 'vip']) {
                revenue += (ev.ticketTypes[type]?.sold || 0) * (ev.ticketTypes[type]?.price || 0);
            }
        }
        document.getElementById('totalRevenue').innerText = 'R' + revenue.toLocaleString();
    }
    
    function renderCarousel() {
        const track = document.getElementById('eventCarousel');
        if (!events.length) { track.innerHTML = '<div class="empty-state">🌌 No cosmic events. Add one now.</div>'; return; }
        track.innerHTML = events.map(ev => {
            const totalSold = (ev.ticketTypes.earlyBird?.sold || 0) + (ev.ticketTypes.general?.sold || 0) + (ev.ticketTypes.vip?.sold || 0);
            const totalCap = (ev.ticketTypes.earlyBird?.capacity || 0) + (ev.ticketTypes.general?.capacity || 0) + (ev.ticketTypes.vip?.capacity || 0);
            const percent = totalCap ? Math.round((totalSold / totalCap) * 100) : 0;
            return `<div class="event-card ${selectedEventId === ev.id ? 'selected' : ''}" data-id="${ev.id}">
                <div class="event-banner"><span class="event-status"><i class="fas fa-fire"></i> LIVE</span></div>
                <div class="event-content">
                    <div class="event-name">✨ ${escapeHtml(ev.name)}</div>
                    <div class="event-detail"><i class="fas fa-calendar-alt"></i> ${ev.date || 'TBD'}</div>
                    <div class="event-detail"><i class="fas fa-location-dot"></i> ${escapeHtml(ev.location)}</div>
                    <div class="ticket-summary"><span><i class="fas fa-ticket"></i> ${totalSold} sold</span><span>📈 ${percent}% capacity</span></div>
                </div>
            </div>`;
        }).join('');
        document.querySelectorAll('.event-card').forEach(card => card.addEventListener('click', () => selectEvent(card.dataset.id)));
    }
    
    async function selectEvent(id) {
        selectedEventId = id;
        const ev = events.find(e => e.id === id);
        if (!ev) return;
        renderCarousel();
        
        // ========== OUT OF THIS WORLD DISPLAY with EXACT format and great padding/gap ==========
        const infoDiv = document.getElementById('selectedEventInfo');
        infoDiv.style.display = 'block';
        infoDiv.innerHTML = `
            <div class="event-info-glow">
                <div class="event-name-large">🎯 ${escapeHtml(ev.name)}</div>
                <div class="event-meta-chip"><i class="fas fa-calendar-check"></i> ${ev.date || 'TBD'}</div>
                <div class="event-meta-chip"><i class="fas fa-map-pin"></i> ${escapeHtml(ev.location)}</div>
            </div>
            <div style="margin-top: 14px; font-size: 0.85rem; color: #3c3f4a; display: flex; gap: 24px; flex-wrap: wrap;">
                <span><i class="fas fa-chart-line"></i> Total capacity: ${(ev.ticketTypes.earlyBird?.capacity||0)+(ev.ticketTypes.general?.capacity||0)+(ev.ticketTypes.vip?.capacity||0)}</span>
                <span><i class="fas fa-chart-simple"></i> Sold: ${(ev.ticketTypes.earlyBird?.sold||0)+(ev.ticketTypes.general?.sold||0)+(ev.ticketTypes.vip?.sold||0)}</span>
            </div>
        `;
        
        // uniform aligned inventory
        const container = document.getElementById('ticketInventory');
        const types = [{ key: 'earlyBird', label: '🐦 Early Bird', icon:'fa-clock' }, { key: 'general', label: '🎟️ General', icon:'fa-ticket' }, { key: 'vip', label: '👑 VIP Experience', icon:'fa-crown' }];
        let hasData = false;
        let inventoryHtml = `<div class="inventory-header"><span>Ticket Class</span><span>Price (R)</span><span>Capacity</span><span>Sold</span><span>Remaining</span></div>`;
        types.forEach(t => {
            const data = ev.ticketTypes[t.key];
            if (data.capacity > 0 || data.price > 0) {
                hasData = true;
                const remaining = (data.capacity - (data.sold || 0));
                inventoryHtml += `<div class="ticket-row-uniform">
                    <div class="ticket-type-badge"><i class="fas ${t.icon}"></i> ${t.label}</div>
                    <span>R${(data.price || 0).toLocaleString()}</span>
                    <span>${data.capacity || 0}</span>
                    <span>${data.sold || 0}</span>
                    <span>${remaining >= 0 ? remaining : 0}</span>
                </div>`;
            }
        });
        container.innerHTML = hasData ? inventoryHtml : '<div class="empty-state">🎫 No ticket types configured — click "Edit Tickets" to add tiers.</div>';
        
        const tickets = JSON.parse(localStorage.getItem('rands_tickets') || '[]');
        const eventTickets = tickets.filter(t => t.eventName === ev.name);
        const purchasesDiv = document.getElementById('purchasesList');
        if (!eventTickets.length) purchasesDiv.innerHTML = '<div class="empty-state">⏳ No recent purchases</div>';
        else purchasesDiv.innerHTML = eventTickets.map(t => `<div class="purchase-item"><span><i class="fas fa-receipt"></i> ${escapeHtml(t.ticketType)}</span><span>🎫 ${t.ticketId?.slice(-8)}</span><span>R${(t.price||0).toFixed(2)}</span></div>`).join('');
    }
    
    async function deleteEvent() {
        if (!selectedEventId) { showStunningAlert('Select an event first', true); return; }
        showStunningAlert('⚠️ Delete this event and all tickets? This action is permanent.', false);
        const confirmBtn = document.getElementById('closeAlertBtn');
        const originalClick = confirmBtn.onclick;
        confirmBtn.onclick = async () => {
            document.getElementById('stunningAlertModal').classList.remove('active');
            try {
                const { data: tickets } = await supabase.from('tickets').select('id').eq('event_id', selectedEventId);
                if (tickets?.length) await supabase.from('checkins').delete().in('ticket_id', tickets.map(t => t.id));
                await supabase.from('tickets').delete().eq('event_id', selectedEventId);
                await supabase.from('ticket_types').delete().eq('event_id', selectedEventId);
                await supabase.from('events').delete().eq('id', selectedEventId);
                showToastModern('Event destroyed successfully');
                selectedEventId = null;
                document.getElementById('selectedEventInfo').style.display = 'none';
                await loadEvents();
            } catch(e) { showStunningAlert('Delete error: '+e.message, true); }
            confirmBtn.onclick = originalClick;
        };
    }
    
    async function addEvent() { /* existing supabase logic same but enhanced validation */
        const name = document.getElementById('eventName').value.trim();
        const date = document.getElementById('eventDate').value;
        const location = document.getElementById('eventLocation').value.trim();
        if (!name || !date) { showStunningAlert('Event name and date required', true); return; }
        const ebPrice = parseFloat(document.getElementById('ebPrice').value);
        const ebCap = parseInt(document.getElementById('ebCap').value);
        const genPrice = parseFloat(document.getElementById('genPrice').value);
        const genCap = parseInt(document.getElementById('genCap').value);
        const vipPrice = parseFloat(document.getElementById('vipPrice').value);
        const vipCap = parseInt(document.getElementById('vipCap').value);
        const { data: ev, error } = await supabase.from('events').insert([{ name, location, start_time: date, base_price: genPrice || 0, vip_price: vipPrice || 0, status: 'active' }]).select().single();
        if (error) { showStunningAlert(error.message, true); return; }
        const ticketsToInsert = [];
        if (ebPrice && ebCap) ticketsToInsert.push({ event_id: ev.id, name: 'Early Bird', price: ebPrice, capacity: ebCap, sold: 0 });
        if (genPrice && genCap) ticketsToInsert.push({ event_id: ev.id, name: 'General Admission', price: genPrice, capacity: genCap, sold: 0 });
        if (vipPrice && vipCap) ticketsToInsert.push({ event_id: ev.id, name: 'VIP Experience', price: vipPrice, capacity: vipCap, sold: 0 });
        if (ticketsToInsert.length) await supabase.from('ticket_types').insert(ticketsToInsert);
        showToastModern('🚀 Event created!');
        document.getElementById('addEventModal').classList.remove('active');
        await loadEvents();
    }
    
    async function editTickets() { if (!selectedEventId) { showStunningAlert('Select an event first', true); return; } const ev = events.find(e => e.id === selectedEventId);
        document.getElementById('editEbPrice').value = ev.ticketTypes.earlyBird?.price || ''; document.getElementById('editEbCap').value = ev.ticketTypes.earlyBird?.capacity || '';
        document.getElementById('editGenPrice').value = ev.ticketTypes.general?.price || ''; document.getElementById('editGenCap').value = ev.ticketTypes.general?.capacity || '';
        document.getElementById('editVipPrice').value = ev.ticketTypes.vip?.price || ''; document.getElementById('editVipCap').value = ev.ticketTypes.vip?.capacity || '';
        document.getElementById('editTicketsModal').classList.add('active');
    }
    async function saveTickets() { if (!selectedEventId) return;
        await supabase.from('ticket_types').delete().eq('event_id', selectedEventId);
        const newTypes = [];
        const ebPrice = parseFloat(document.getElementById('editEbPrice').value); const ebCap = parseInt(document.getElementById('editEbCap').value);
        const genPrice = parseFloat(document.getElementById('editGenPrice').value); const genCap = parseInt(document.getElementById('editGenCap').value);
        const vipPrice = parseFloat(document.getElementById('editVipPrice').value); const vipCap = parseInt(document.getElementById('editVipCap').value);
        if (ebPrice && ebCap) newTypes.push({ event_id: selectedEventId, name: 'Early Bird', price: ebPrice, capacity: ebCap, sold: 0 });
        if (genPrice && genCap) newTypes.push({ event_id: selectedEventId, name: 'General Admission', price: genPrice, capacity: genCap, sold: 0 });
        if (vipPrice && vipCap) newTypes.push({ event_id: selectedEventId, name: 'VIP Experience', price: vipPrice, capacity: vipCap, sold: 0 });
        if (newTypes.length) await supabase.from('ticket_types').insert(newTypes);
        showToastModern('Ticket inventory updated');
        document.getElementById('editTicketsModal').classList.remove('active');
        await loadEvents();
    }
    window.toggleFields = (type) => document.getElementById(`${type}Fields`).classList.toggle('active');
    function setupCarousel() { const wrapper = document.getElementById('carouselWrapper');
        document.getElementById('prevArrow').onclick = () => wrapper.scrollBy({ left: -360, behavior: 'smooth' });
        document.getElementById('nextArrow').onclick = () => wrapper.scrollBy({ left: 360, behavior: 'smooth' });
    }
    document.getElementById('addEventBtn').onclick = () => document.getElementById('addEventModal').classList.add('active');
    document.getElementById('deleteEventBtn').onclick = deleteEvent;
    document.getElementById('editTicketsBtn').onclick = editTickets;
    document.getElementById('refreshEventsBtn').onclick = loadEvents;
    document.getElementById('confirmAddEventBtn').onclick = addEvent;
    document.getElementById('saveTicketsBtn').onclick = saveTickets;
    document.getElementById('closeAddModalBtn').onclick = () => document.getElementById('addEventModal').classList.remove('active');
    document.getElementById('closeEditModalBtn').onclick = () => document.getElementById('editTicketsModal').classList.remove('active');
    setupCarousel();
    loadEvents();
</script>
</body>
</html>
