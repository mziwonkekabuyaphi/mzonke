<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Butcher Shop | Menu Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafd; padding: 20px; color: #1e293b; }
    .container { max-width: 1400px; margin: 0 auto; }
    .stats-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 24px; }
    .stat-card { background: white; border-radius: 20px; padding: 15px 20px; flex: 1; min-width: 140px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eef2f8; }
    .stat-number { font-size: 28px; font-weight: 800; color: #E30613; }
    .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
    .tabs { display: flex; gap: 8px; background: white; padding: 6px; border-radius: 60px; margin-bottom: 24px; border: 1px solid #eef2f8; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 60px; border: none; background: transparent; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #E30613; color: white; box-shadow: 0 2px 6px rgba(227,6,19,0.2); }
    .panel { display: none; background: white; border-radius: 28px; padding: 24px; border: 1px solid #eef2f8; margin-bottom: 24px; }
    .panel.active { display: block; }
    .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; color: #0f172a; }
    .add-form { background: #f8fafc; padding: 20px; border-radius: 24px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .add-form input, .add-form select { padding: 10px 16px; border-radius: 60px; border: 1px solid #cbd5e1; font-family: inherit; flex: 1; min-width: 150px; }
    .add-form button { background: #E30613; color: white; border: none; padding: 10px 24px; border-radius: 60px; font-weight: 600; cursor: pointer; }
    .btn-secondary { background: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 60px; font-weight: 600; cursor: pointer; }
    .btn-danger { background: #fee2e2; color: #dc2626; border: none; padding: 6px 14px; border-radius: 60px; font-weight: 600; cursor: pointer; font-size: 0.7rem; }
    .btn-success { background: #dcfce7; color: #166534; border: none; padding: 6px 14px; border-radius: 60px; font-weight: 600; cursor: pointer; font-size: 0.7rem; }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
    .category-card { background: #f8fafc; border-radius: 20px; padding: 16px; border: 1px solid #e2e8f0; }
    .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #E30613; }
    .category-name { font-weight: 800; color: #E30613; }
    .items-list { margin-top: 12px; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eef2f8; }
    .item-name input { width: 120px; padding: 4px 8px; border-radius: 30px; border: 1px solid #cbd5e1; font-size: 0.75rem; }
    .item-price input { width: 70px; padding: 4px 8px; border-radius: 30px; border: 1px solid #cbd5e1; font-size: 0.75rem; }
    .category-tag { background: white; border: 1px solid #e2e8f0; border-radius: 60px; padding: 8px 16px; display: inline-flex; align-items: center; gap: 10px; margin: 0 8px 8px 0; }
    .category-list-container { display: flex; flex-wrap: wrap; margin-bottom: 20px; }
    .action-bar { display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 20px; }
    .loading-state, .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
    .toast { position: fixed; bottom: 30px; right: 30px; background: #1e293b; color: white; padding: 12px 24px; border-radius: 60px; font-weight: 500; z-index: 1000; display: none; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 768px) { body { padding: 16px; } .stats-row { flex-direction: column; } .items-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
    <div class="stats-row">
        <div class="stat-card"><div class="stat-number" id="totalCategories">-</div><div class="stat-label">Categories</div></div>
        <div class="stat-card"><div class="stat-number" id="totalItems">-</div><div class="stat-label">Menu Items</div></div>
        <div class="stat-card"><div class="stat-number" id="lowestPrice">-</div><div class="stat-label">Lowest Price</div></div>
        <div class="stat-card"><div class="stat-number" id="highestPrice">-</div><div class="stat-label">Highest Price</div></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="categories">📁 Categories</button>
        <button class="tab-btn" data-tab="items">🍖 Menu Items</button>
    </div>

    <!-- Categories Panel -->
    <div id="categoriesPanel" class="panel active">
        <div class="section-title"><i class="fas fa-tags"></i> Manage Categories</div>
        <div class="add-form">
            <input type="text" id="newCategoryName" placeholder="New category name (e.g., Desserts)">
            <button id="addCategoryBtn"><i class="fas fa-plus"></i> Add Category</button>
        </div>
        <div id="categoryList" class="category-list-container">Loading...</div>
    </div>

    <!-- Items Panel -->
    <div id="itemsPanel" class="panel">
        <div class="section-title"><i class="fas fa-utensils"></i> Menu Items</div>
        <div class="add-form">
            <select id="itemCategorySelect" style="flex:1;"></select>
            <input type="text" id="newItemName" placeholder="Item name">
            <input type="number" id="newItemPrice" placeholder="Price (R)" step="0.01">
            <button id="addItemBtn"><i class="fas fa-plus"></i> Add Item</button>
        </div>
        <div class="action-bar">
            <button class="btn-secondary" id="resetToDefaultBtn"><i class="fas fa-undo"></i> Reset to Default</button>
            <span style="background:#10b981; color:white; padding:6px 16px; border-radius:60px; font-size:12px;"><i class="fas fa-check-circle"></i> Live Sync</span>
        </div>
        <div id="itemsContainer" class="items-grid">Loading...</div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const MENU_KEY = "butcher_menu_config";
    const DEFAULT_MENU = {
        meat: [{ id: "ribeye", name: "Ribeye Steak", price: 159 }, { id: "beef_sausage", name: "Beef Sausage", price: 89 }, { id: "lamb_chop", name: "Lamb Chop", price: 199 }, { id: "bacon_pack", name: "Bacon 500g", price: 79 }],
        meals: [{ id: "steak_combo", name: "Steak + Chips", price: 189 }, { id: "boerewors_roll", name: "Boerewors Roll", price: 65 }, { id: "barbecue_platter", name: "BBQ Platter", price: 299 }],
        sides: [{ id: "chips", name: "Chips", price: 25 }, { id: "salad", name: "Fresh Salad", price: 32 }, { id: "pap_sheba", name: "Pap & Sheba", price: 28 }],
        drinks: [{ id: "coke", name: "Coca-Cola", price: 18 }, { id: "water", name: "Still Water", price: 12 }, { id: "beer", name: "Castle Lager", price: 28 }]
    };
    
    let menu = {};

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#b91c1c' : '#1e293b';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    function getCategoryDisplayName(key) {
        const names = { meat: 'MEAT', meals: 'MEALS', sides: 'SIDES', drinks: 'DRINKS' };
        return names[key] || key.toUpperCase();
    }

    function updateStats() {
        const categories = Object.keys(menu);
        let totalItems = 0;
        let allPrices = [];
        for (let cat of categories) {
            totalItems += menu[cat].length;
            allPrices.push(...menu[cat].map(i => i.price));
        }
        document.getElementById('totalCategories').innerText = categories.length;
        document.getElementById('totalItems').innerText = totalItems;
        document.getElementById('lowestPrice').innerText = allPrices.length ? 'R' + Math.min(...allPrices) : '-';
        document.getElementById('highestPrice').innerText = allPrices.length ? 'R' + Math.max(...allPrices) : '-';
    }

    function saveMenu() {
        localStorage.setItem(MENU_KEY, JSON.stringify(menu));
        window.dispatchEvent(new StorageEvent('storage', { key: MENU_KEY, newValue: JSON.stringify(menu) }));
        updateStats();
        showToast('Menu saved & synced');
    }

    function loadMenu() {
        const saved = localStorage.getItem(MENU_KEY);
        if (saved) menu = JSON.parse(saved);
        else menu = JSON.parse(JSON.stringify(DEFAULT_MENU));
        renderCategories();
        renderItems();
        updateStats();
    }

    function renderCategories() {
        const categories = Object.keys(menu);
        const container = document.getElementById('categoryList');
        if (!categories.length) { container.innerHTML = '<div class="empty-state">No categories</div>'; return; }
        container.innerHTML = categories.map(cat => `
            <div class="category-tag">
                <span>${getCategoryDisplayName(cat)}</span>
                <button class="btn-danger" style="padding:2px 8px;" onclick="deleteCategory('${cat}')">✕</button>
            </div>
        `).join('');
    }

    window.deleteCategory = function(catKey) {
        if (confirm(`Delete category "${getCategoryDisplayName(catKey)}" and all its items?`)) {
            delete menu[catKey];
            saveMenu();
            renderCategories();
            renderItems();
            showToast('Category deleted');
        }
    };

    function renderItems() {
        const categories = Object.keys(menu);
        const container = document.getElementById('itemsContainer');
        if (!categories.length) { container.innerHTML = '<div class="empty-state">No categories. Add one first.</div>'; return; }
        
        container.innerHTML = categories.map(cat => `
            <div class="category-card">
                <div class="category-header">
                    <span class="category-name">${getCategoryDisplayName(cat)}</span>
                    <button class="btn-danger" onclick="deleteCategory('${cat}')" style="padding:4px 12px;">Delete Category</button>
                </div>
                <div class="items-list">
                    ${menu[cat].map(item => `
                        <div class="menu-item" data-id="${item.id}">
                            <input type="text" class="edit-name" value="${escapeHtml(item.name)}" style="width:140px;" data-cat="${cat}" data-id="${item.id}">
                            <input type="number" class="edit-price" value="${item.price}" step="0.01" style="width:80px;" data-cat="${cat}" data-id="${item.id}">
                            <div>
                                <button class="btn-success save-item" data-cat="${cat}" data-id="${item.id}">Save</button>
                                <button class="btn-danger delete-item" data-cat="${cat}" data-id="${item.id}">Del</button>
                            </div>
                        </div>
                    `).join('')}
                    ${menu[cat].length === 0 ? '<div class="empty-state" style="padding:20px;">No items</div>' : ''}
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.save-item').forEach(btn => {
            btn.onclick = () => {
                const cat = btn.dataset.cat;
                const id = btn.dataset.id;
                const row = btn.closest('.menu-item');
                const newName = row.querySelector('.edit-name').value.trim();
                const newPrice = parseFloat(row.querySelector('.edit-price').value);
                if (newName && !isNaN(newPrice)) {
                    const itemIndex = menu[cat].findIndex(i => i.id === id);
                    if (itemIndex !== -1) {
                        menu[cat][itemIndex].name = newName;
                        menu[cat][itemIndex].price = newPrice;
                        saveMenu();
                        renderItems();
                        showToast('Item updated');
                    }
                } else showToast('Invalid input', true);
            };
        });
        
        document.querySelectorAll('.delete-item').forEach(btn => {
            btn.onclick = () => {
                const cat = btn.dataset.cat;
                const id = btn.dataset.id;
                const item = menu[cat]?.find(i => i.id === id);
                if (confirm(`Delete "${item?.name}"?`)) {
                    menu[cat] = menu[cat].filter(i => i.id !== id);
                    saveMenu();
                    renderItems();
                    showToast('Item deleted');
                }
            };
        });
        
        const categorySelect = document.getElementById('itemCategorySelect');
        categorySelect.innerHTML = categories.map(cat => `<option value="${cat}">${getCategoryDisplayName(cat)}</option>`).join('');
    }

    document.getElementById('addCategoryBtn').onclick = () => {
        const newName = document.getElementById('newCategoryName').value.trim();
        if (newName) {
            const catKey = newName.toLowerCase().replace(/\s+/g, '_');
            if (menu[catKey]) { showToast('Category exists', true); return; }
            menu[catKey] = [];
            saveMenu();
            renderCategories();
            renderItems();
            document.getElementById('newCategoryName').value = '';
            showToast('Category added');
        } else showToast('Enter a name', true);
    };

    document.getElementById('addItemBtn').onclick = () => {
        const category = document.getElementById('itemCategorySelect').value;
        const itemName = document.getElementById('newItemName').value.trim();
        const itemPrice = parseFloat(document.getElementById('newItemPrice').value);
        if (!category) { showToast('Select category', true); return; }
        if (!itemName) { showToast('Enter item name', true); return; }
        if (isNaN(itemPrice) || itemPrice <= 0) { showToast('Valid price required', true); return; }
        const newId = `${category}_${Date.now()}`;
        menu[category].push({ id: newId, name: itemName, price: itemPrice });
        saveMenu();
        renderItems();
        document.getElementById('newItemName').value = '';
        document.getElementById('newItemPrice').value = '';
        showToast('Item added');
    };

    document.getElementById('resetToDefaultBtn').onclick = () => {
        if (confirm('Reset to default menu? All customizations will be lost.')) {
            menu = JSON.parse(JSON.stringify(DEFAULT_MENU));
            saveMenu();
            renderCategories();
            renderItems();
            showToast('Reset to default');
        }
    };

    function switchTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(`${tabId}Panel`).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
        if (tabId === 'items') renderItems();
        else renderCategories();
    }

    document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
    
    loadMenu();
    window.addEventListener('storage', (e) => { if (e.key === MENU_KEY && e.newValue) { menu = JSON.parse(e.newValue); renderCategories(); renderItems(); updateStats(); } });
</script>
</body>
</html>
