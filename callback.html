<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rands Vibe · Signing you in…</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #e8192c; --red-bright: #ff2d40;
    --bg: #0c0a0a; --white: #ffffff; --muted: rgba(245,242,238,0.38);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  html, body { height: 100%; background: var(--bg); font-family: 'Bricolage Grotesque', sans-serif; color: var(--white); display: flex; align-items: center; justify-content: center; }
  .bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(120,0,200,0.25) 0%, transparent 70%), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(200,0,60,0.18) 0%, transparent 60%), var(--bg); }
  .wrap { position: relative; z-index: 1; text-align: center; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 2px; color: var(--white); }
  .logo span { color: var(--red-bright); }
  .spinner { width: 44px; height: 44px; border: 3px solid rgba(232,25,44,0.2); border-top-color: var(--red-bright); border-radius: 50%; animation: spin 0.75s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 14px; color: var(--muted); letter-spacing: 0.5px; min-height: 20px; }
  .error-msg { font-size: 13px; color: rgba(255,160,168,0.9); background: rgba(232,25,44,0.1); border: 1px solid rgba(232,25,44,0.3); border-radius: 12px; padding: 12px 16px; display: none; max-width: 320px; line-height: 1.5; }
  .error-msg.visible { display: block; }
  .back-link { font-size: 13px; color: var(--red-bright); text-decoration: none; display: none; font-weight: 600; }
  .back-link.visible { display: block; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="logo">Rands <span>Vibe</span></div>
  <div class="spinner" id="spinner"></div>
  <p class="status" id="status">Completing sign-in…</p>
  <div class="error-msg" id="errorMsg"></div>
  <a href="/login.html" class="back-link" id="backLink">← Back to login</a>
</div>

<script type="module">
  import { supabase } from './config/supabase.js';
  import { getUserRole, getRoleRedirectUrl } from './config/auth.js';

  const statusEl  = document.getElementById('status');
  const errorEl   = document.getElementById('errorMsg');
  const backLink  = document.getElementById('backLink');
  const spinner   = document.getElementById('spinner');

  function showError(msg) {
    spinner.style.display = 'none';
    statusEl.textContent = '';
    errorEl.textContent = msg;
    errorEl.classList.add('visible');
    backLink.classList.add('visible');
  }

  async function handleCallback() {
    try {
      // exchangeCodeForSession handles the ?code= param from OAuth.
      // For implicit flow (hash-based tokens) getSession() is enough.
      const hashParams = new URLSearchParams(window.location.hash.replace('#', '?'));
      const queryParams = new URLSearchParams(window.location.search);

      // Try PKCE code exchange first
      if (queryParams.get('code')) {
        statusEl.textContent = 'Exchanging auth code…';
        const { error } = await supabase.auth.exchangeCodeForSession(window.location.href);
        if (error) throw error;
      }

      statusEl.textContent = 'Verifying your account…';
      const { data: { session }, error: sessionErr } = await supabase.auth.getSession();
      if (sessionErr || !session) throw sessionErr || new Error('No session found.');

      const user = session.user;

      // If this is a new OAuth user, write account_type to profile if stored
      const oauthAccountType = sessionStorage.getItem('rv_oauth_account_type');
      if (oauthAccountType) {
        sessionStorage.removeItem('rv_oauth_account_type');
        await supabase
          .from('profiles')
          .upsert({ id: user.id, account_type: oauthAccountType }, { onConflict: 'id' });
      }

      statusEl.textContent = 'Checking your access level…';
      const { role, error: roleError } = await getUserRole(user.id);

      if (roleError === 'NO_ROLE' || !role) {
        // New OAuth user — default to customer, upsert the role
        await supabase
          .from('profiles')
          .upsert({ id: user.id, role: 'customer' }, { onConflict: 'id' });

        statusEl.textContent = 'Setting up your passport…';
        window.location.href = '/passport/home.html';
        return;
      }

      if (roleError) throw new Error('Unable to verify account permissions.');

      const redirectUrl = getRoleRedirectUrl(role);
      if (!redirectUrl) throw new Error(`Unknown role "${role}". Contact support.`);

      statusEl.textContent = 'All good — taking you in!';
      window.location.href = redirectUrl;

    } catch (err) {
      console.error('Callback error:', err);
      showError(err.message || 'Sign-in failed. Please try again.');
    }
  }

  handleCallback();
</script>
</body>
</html>
