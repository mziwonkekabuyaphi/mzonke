<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Rands Vault | Admin Studio - Locker & Unlock Requests</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f9fafb; color:#1e293b; }
        .admin-header {
            background: linear-gradient(135deg, #7f1a1a 0%, #991b1b 100%);
            color:white; padding:1.25rem 2rem; display:flex; justify-content:space-between;
            align-items:center; flex-wrap:wrap; gap:1rem; position:sticky; top:0; z-index:100;
        }
        .logo-area h1 { font-size:1.65rem; font-weight:700; }
        .logo-area h1 i { color:#fecaca; margin-right:8px; }
        .header-stats { display:flex; gap:1.5rem; background:rgba(255,255,255,0.15); padding:0.6rem 1.5rem; border-radius:60px; }
        .btn-primary { background:#dc2626; border:none; padding:0.6rem 1.3rem; border-radius:40px; font-weight:600; color:white; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
        .btn-primary:hover { background:#b91c1c; }
        .btn-secondary { background:#e2e8f0; color:#1e293b; border:none; padding:0.5rem 1rem; border-radius:30px; cursor:pointer; }
        .btn-danger { background:#dc2626; color:white; border:none; padding:0.5rem 1rem; border-radius:30px; cursor:pointer; }
        .btn-success { background:#16a34a; color:white; }
        .admin-container { max-width:1600px; margin:2rem auto; padding:0 1.8rem; }
        .kpi-grid { display:flex; flex-wrap:wrap; gap:1.5rem; margin-bottom:2rem; }
        .kpi-card { background:white; border-radius:28px; padding:1.2rem 1.8rem; flex:1; min-width:160px; border:1px solid #fee2e2; }
        .kpi-card i { font-size:2rem; color:#dc2626; margin-bottom:0.5rem; }
        .kpi-number { font-size:2rem; font-weight:800; color:#0f172a; }
        .dashboard-split { display:grid; grid-template-columns:1fr 0.9fr; gap:2rem; }
        @media (max-width:1000px) { .dashboard-split { grid-template-columns:1fr; } }
        .panel { background:white; border-radius:28px; overflow:hidden; border:1px solid #fee2e2; margin-bottom:2rem; }
        .panel-header { background:#fff1f0; padding:1.2rem 1.8rem; border-bottom:2px solid #fecaca; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
        .panel-header h2 { color:#991b1b; display:flex; align-items:center; gap:10px; }
        .locker-grid-admin { padding:1.5rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.2rem; max-height:55vh; overflow-y:auto; }
        .locker-admin-card { background:white; border-radius:20px; border:1px solid #fecaca; padding:1rem; }
        .locker-status { display:inline-block; padding:0.2rem 0.7rem; border-radius:40px; font-size:0.7rem; font-weight:700; }
        .status-available { background:#dcfce7; color:#166534; }
        .status-occupied { background:#fee2e2; color:#991b1b; }
        .tickets-list, .requests-list { padding:0 1.2rem 1.5rem 1.2rem; max-height:55vh; overflow-y:auto; }
        .request-card, .ticket-card { background:#fef2f2; border-radius:20px; padding:1rem; margin-bottom:1rem; border-left:5px solid #dc2626; }
        .empty-state { text-align:center; padding:2.5rem; color:#94a3b8; }
        .modal-glass { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:1000; visibility:hidden; opacity:0; transition:0.2s; }
        .modal-glass.active { visibility:visible; opacity:1; }
        .modal-card { background:white; width:90%; max-width:500px; border-radius:36px; padding:1.8rem; }
        .modal-card input { width:100%; padding:12px 16px; margin:10px 0 16px; border-radius:60px; border:1px solid #e2e8f0; }
        .flex-btns { display:flex; justify-content:flex-end; gap:12px; margin-top:20px; }
        .toast-notify { position:fixed; bottom:25px; right:25px; background:#1e293b; color:white; padding:12px 24px; border-radius:60px; animation:fadeUp 0.3s ease; z-index:1100; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
    </style>
</head>
<body>
<div class="admin-header">
    <div class="logo-area"><h1><i class="fas fa-crown"></i> Rands Vault · Admin Studio</h1><p>lockers & unlock requests</p></div>
    <div class="header-stats"><div class="stat-pill"><i class="fas fa-boxes"></i> <span id="headerTotalLockers">0</span> lockers</div><div class="stat-pill"><i class="fas fa-ticket-alt"></i> <span id="headerActiveTickets">0</span> active</div></div>
    <div><button class="btn-outline" onclick="window.openCustomerPortal?.()"><i class="fas fa-external-link-alt"></i> Customer Portal</button></div>
</div>
<div class="admin-container">
    <div class="kpi-grid">
        <div class="kpi-card"><i class="fas fa-locker"></i><div class="kpi-number" id="kpiTotalLockers">0</div><div>Total Lockers</div></div>
        <div class="kpi-card"><i class="fas fa-check-circle"></i><div class="kpi-number" id="kpiAvailable">0</div><div>Available</div></div>
        <div class="kpi-card"><i class="fas fa-user-lock"></i><div class="kpi-number" id="kpiOccupied">0</div><div>Occupied</div></div>
        <div class="kpi-card"><i class="fas fa-clock"></i><div class="kpi-number" id="kpiPendingRequests">0</div><div>Pending Unlocks</div></div>
    </div>

    <div class="dashboard-split">
        <!-- LEFT: Lockers -->
        <div class="panel">
            <div class="panel-header"><h2><i class="fas fa-archive"></i> Vault Lockers</h2><button class="btn-primary" onclick="openCreateLockerModal()"><i class="fas fa-plus-circle"></i> Create Locker</button></div>
            <div class="locker-grid-admin" id="lockerAdminGrid">Loading...</div>
        </div>

        <!-- RIGHT: Active Tickets + Pending Unlocks -->
        <div>
            <div class="panel">
                <div class="panel-header"><h2><i class="fas fa-ticket-alt"></i> Active Tickets</h2></div>
                <div class="tickets-list" id="activeTicketsContainer">Loading...</div>
            </div>
            <div class="panel">
                <div class="panel-header"><h2><i class="fas fa-hourglass-half"></i> Pending Unlock Requests</h2></div>
                <div class="requests-list" id="pendingRequestsContainer">Loading...</div>
            </div>
        </div>
    </div>
</div>

<!-- Create Locker Modal -->
<div id="createLockerModalWin" class="modal-glass"><div class="modal-card"><h3 style="color:#991b1b;">New Locker</h3><label>Locker Number</label><input type="number" id="lockerNumberInput"><label>QR Code (optional)</label><input type="text" id="lockerQrInput"><div class="flex-btns"><button class="btn-secondary" onclick="closeLockerModal()">Cancel</button><button class="btn-primary" onclick="createLocker()">Create</button></div></div></div>
<!-- Confirm Release Modal -->
<div id="releaseModal" class="modal-glass"><div class="modal-card"><h3>Release Locker</h3><p id="releaseMsg"></p><div class="flex-btns"><button class="btn-secondary" onclick="closeReleaseModal()">Cancel</button><button class="btn-danger" id="confirmReleaseBtn">Release & Approve</button></div></div></div>

<script type="module">
    import { supabase } from '../config/supabase.js';
    let currentLockers = [];
    let pendingReleaseLockerId = null;
    let pendingRequestId = null;

    function showToast(msg, isError=false) { 
        let t=document.querySelector('.toast-notify'); if(t) t.remove();
        let toast=document.createElement('div'); toast.className='toast-notify'; toast.style.background=isError?'#dc2626':'#1e293b';
        toast.innerHTML=`<i class="fas ${isError?'fa-exclamation-triangle':'fa-check-circle'}"></i> ${msg}`;
        document.body.appendChild(toast); setTimeout(()=>toast.remove(),2800);
    }

    async function fetchLockers() {
        let {data,error}=await supabase.from('lockers').select('*').order('locker_number');
        if(error) throw error;
        currentLockers=data;
        renderLockers(); renderActiveTickets(); updateStats();
    }
    async function fetchPendingRequests() {
        let {data,error}=await supabase.from('unlock_requests').select('*, lockers(locker_number)').eq('status','pending').order('requested_at',{ascending:true});
        if(error) console.error(error);
        renderPendingRequests(data||[]);
        document.getElementById('kpiPendingRequests').innerText=(data||[]).length;
    }
    function renderLockers() {
        let container=document.getElementById('lockerAdminGrid');
        if(!currentLockers.length){ container.innerHTML='<div class="empty-state">No lockers</div>'; return; }
        container.innerHTML='';
        currentLockers.forEach(l=>{
            let statusClass=l.status==='available'?'status-available':'status-occupied';
            let statusLabel=l.status==='available'?'Available':'Occupied';
            let card=document.createElement('div'); card.className='locker-admin-card';
            card.innerHTML=`
                <div style="display:flex; justify-content:space-between;"><strong>Locker #${l.locker_number}</strong><span class="locker-status ${statusClass}">${statusLabel}</span></div>
                <div style="margin:8px 0;"><i class="fas fa-qrcode"></i> ${l.qr_code}<br>${l.status==='occupied'?`👤 ${l.customer_name||''} 📞 ${l.customer_phone||''}`:'✅ Ready'}</div>
                <div class="locker-actions" style="display:flex; gap:8px; justify-content:flex-end;">
                    <button class="btn-secondary" onclick="viewLocker('${l.id}')">View</button>
                    ${l.status==='available'?`<button class="btn-danger" onclick="deleteLockerPrompt('${l.id}')">Delete</button>`:`<button class="btn-warning" style="background:#f97316; color:white;" onclick="prepareRelease('${l.id}',null)">Release</button>`}
                </div>
            `;
            container.appendChild(card);
        });
    }
    function renderActiveTickets() {
        let container=document.getElementById('activeTicketsContainer');
        let occupied=currentLockers.filter(l=>l.status==='occupied');
        if(!occupied.length){ container.innerHTML='<div class="empty-state">No active tickets</div>'; return; }
        container.innerHTML='';
        occupied.forEach(l=>{
            let div=document.createElement('div'); div.className='ticket-card';
            div.innerHTML=`<div class="ticket-badge" style="background:#dc2626;color:white;display:inline-block;padding:2px 10px;border-radius:20px;">ACTIVE</div>
                <div><strong>Locker #${l.locker_number}</strong><br>👤 ${l.customer_name||'?'}<br>📞 ${l.customer_phone||'?'}<br>💰 R ${(l.total_value||0).toFixed(2)}<br>🕒 ${l.occupied_at?new Date(l.occupied_at).toLocaleString():'unknown'}</div>
                <button class="btn-danger" style="margin-top:8px;" onclick="prepareRelease('${l.id}',null)"><i class="fas fa-unlock"></i> Release</button>`;
            container.appendChild(div);
        });
    }
    function renderPendingRequests(requests) {
        let container=document.getElementById('pendingRequestsContainer');
        if(!requests.length){ container.innerHTML='<div class="empty-state">No pending unlock requests</div>'; return; }
        container.innerHTML='';
        requests.forEach(req=>{
            let div=document.createElement('div'); div.className='request-card';
            div.innerHTML=`<div><strong>Locker #${req.lockers?.locker_number||'?'}</strong><br>📞 ${req.customer_phone}<br>💰 Value: R ${(req.total_value||0).toFixed(2)}<br>📅 ${new Date(req.requested_at).toLocaleString()}</div>
                <div style="margin-top:10px; display:flex; gap:8px;">
                    <button class="btn-success" onclick="approveUnlock('${req.id}','${req.locker_id}')">✅ Approve & Release</button>
                    <button class="btn-danger" onclick="rejectUnlock('${req.id}')">❌ Reject</button>
                </div>`;
            container.appendChild(div);
        });
    }
    async function approveUnlock(requestId, lockerId) {
        // 1) Update unlock request status to approved
        await supabase.from('unlock_requests').update({ status:'approved', approved_at:new Date().toISOString() }).eq('id',requestId);
        // 2) Release the locker: status=available, clear customer fields
        await supabase.from('lockers').update({
            status:'available',
            customer_name:null,
            customer_phone:null,
            customer_pin_hash:null,
            total_value:0,
            occupied_at:null,
            updated_at:new Date().toISOString()
        }).eq('id',lockerId);
        showToast('Locker released and request approved');
        fetchLockers(); fetchPendingRequests();
    }
    async function rejectUnlock(requestId) {
        await supabase.from('unlock_requests').update({ status:'cancelled' }).eq('id',requestId);
        showToast('Unlock request rejected');
        fetchPendingRequests();
    }
    async function prepareRelease(lockerId, requestId) {
        pendingReleaseLockerId = lockerId;
        pendingRequestId = requestId;
        document.getElementById('releaseMsg').innerHTML = `Release locker #${currentLockers.find(l=>l.id===lockerId)?.locker_number}? This will make it available.`;
        document.getElementById('releaseModal').classList.add('active');
        document.getElementById('confirmReleaseBtn').onclick = async () => {
            await supabase.from('lockers').update({ status:'available', customer_name:null, customer_phone:null, customer_pin_hash:null, total_value:0, occupied_at:null }).eq('id',lockerId);
            if(pendingRequestId) await supabase.from('unlock_requests').update({ status:'approved', approved_at:new Date() }).eq('id',pendingRequestId);
            showToast('Locker released');
            closeReleaseModal();
            fetchLockers(); fetchPendingRequests();
        };
    }
    async function createLocker() {
        let num=parseInt(document.getElementById('lockerNumberInput').value);
        let qr=document.getElementById('lockerQrInput').value.trim() || `LKR-${Date.now()}`;
        if(isNaN(num)) return showToast('Invalid number',true);
        let exists=currentLockers.some(l=>l.locker_number===num);
        if(exists) return showToast('Locker number exists',true);
        let {error}=await supabase.from('lockers').insert({ locker_number:num, qr_code:qr, status:'available', total_value:0 });
        if(error){ showToast(error.message,true); return; }
        showToast(`Locker #${num} created`);
        closeLockerModal(); fetchLockers();
    }
    async function deleteLocker(lockerId){
        let locker=currentLockers.find(l=>l.id===lockerId);
        if(locker.status!=='available') return showToast('Cannot delete occupied locker',true);
        await supabase.from('lockers').delete().eq('id',lockerId);
        showToast('Locker deleted'); fetchLockers();
    }
    function updateStats(){
        let total=currentLockers.length, available=currentLockers.filter(l=>l.status==='available').length, occupied=currentLockers.filter(l=>l.status==='occupied').length;
        document.getElementById('kpiTotalLockers').innerText=total;
        document.getElementById('kpiAvailable').innerText=available;
        document.getElementById('kpiOccupied').innerText=occupied;
        document.getElementById('headerTotalLockers').innerText=total;
        document.getElementById('headerActiveTickets').innerText=occupied;
    }
    window.viewLocker=(id)=>{ let l=currentLockers.find(l=>l.id===id); alert(`Locker #${l.locker_number}\nStatus: ${l.status}\nCustomer: ${l.customer_name||'—'}\nValue: R${(l.total_value||0).toFixed(2)}`); };
    window.deleteLockerPrompt=(id)=>{ if(confirm('Delete permanently?')) deleteLocker(id); };
    window.openCreateLockerModal=()=>{ document.getElementById('createLockerModalWin').classList.add('active'); };
    window.closeLockerModal=()=>{ document.getElementById('createLockerModalWin').classList.remove('active'); };
    window.closeReleaseModal=()=>{ document.getElementById('releaseModal').classList.remove('active'); pendingReleaseLockerId=null; };
    window.approveUnlock=approveUnlock; window.rejectUnlock=rejectUnlock; window.prepareRelease=prepareRelease;
    window.openCustomerPortal=()=>window.open('customer-choice.html','_blank');
    
    // Real-time subscriptions
    supabase.channel('lockers-changes').on('postgres_changes',{event:'*',schema:'public',table:'lockers'},()=>{ fetchLockers(); }).subscribe();
    supabase.channel('requests-changes').on('postgres_changes',{event:'*',schema:'public',table:'unlock_requests'},()=>{ fetchPendingRequests(); }).subscribe();
    
    fetchLockers(); fetchPendingRequests();
</script>
</body>
</html>
