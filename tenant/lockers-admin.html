<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Booze Locker · Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --red: #E30613;
            --red-glow: rgba(227,6,19,0.35);
            --red-dim: rgba(227,6,19,0.10);
            --red-border: rgba(227,6,19,0.22);
            --bg: #09090b;
            --s1: #111114;
            --s2: #18181c;
            --s3: #1e1e24;
            --border: rgba(255,255,255,0.07);
            --border-b: rgba(255,255,255,0.12);
            --text: #f4f4f5;
            --muted: #71717a;
            --dim: #3f3f46;
            --green: #22c55e;
            --gold: #f59e0b;
            --purple: #8b5cf6;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            padding: 16px;
            height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
        }

        /* ─── HEADER ─── */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--s1);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            border-radius: 12px 12px 0 0;
            margin-bottom: 12px;
        }
        .main-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .main-header h2 i { color: var(--red); }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--s3);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .icon-btn:hover { background: var(--s2); border-color: var(--border-b); color: var(--text); }
        .icon-btn.active-toggle { color: var(--red); border-color: var(--red-border); background: var(--red-dim); }

        /* ─── MAIN CONTENT ─── */
        .main-content {
            flex: 1;
            overflow: auto;
            background: var(--s1);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        /* Stats row (red line style) */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: var(--s2);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            flex: 1;
            min-width: 140px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--red);
        }
        .stat-card i {
            font-size: 1.5rem;
            color: var(--red);
            margin-bottom: 0.3rem;
        }
        .stat-number {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text);
        }
        .stat-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--muted);
            margin-top: 0.15rem;
        }

        /* ─── TWO-COLUMN LAYOUT ─── */
        .dashboard-split {
            display: grid;
            grid-template-columns: 1fr 0.9fr;
            gap: 1.5rem;
        }
        @media (max-width: 1000px) {
            .dashboard-split { grid-template-columns: 1fr; gap: 1.5rem; }
        }

        .panel {
            background: var(--s2);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            background: var(--s3);
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .panel-header h2 {
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
        }
        .panel-header h2 i { color: var(--red); }

        .btn-primary {
            background: var(--red);
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 0 12px var(--red-glow);
            font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover { background: #c8050f; transform: translateY(-1px); }
        .btn-secondary {
            background: var(--s3);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }
        .btn-secondary:hover { background: var(--s2); color: var(--text); }
        .btn-danger {
            background: var(--red-dim);
            color: var(--red);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }
        .btn-danger:hover { background: rgba(227,6,19,0.2); }

        /* Locker grid */
        .locker-grid-admin {
            padding: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
            max-height: 50vh;
            overflow-y: auto;
            flex: 1;
        }
        .locker-admin-card {
            background: var(--s3);
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 0.9rem 1rem;
            transition: 0.2s;
        }
        .locker-admin-card:hover { border-color: var(--red-border); transform: translateY(-2px); }
        .locker-number {
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--text);
        }
        .locker-status {
            display: inline-block;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            font-size: 0.55rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-available { background: rgba(34,197,94,0.15); color: var(--green); }
        .status-occupied { background: rgba(227,6,19,0.15); color: var(--red); }
        .status-maintenance { background: rgba(245,158,11,0.15); color: var(--gold); }

        .locker-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .locker-actions button {
            flex: 1;
            padding: 0.3rem 0.6rem;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }
        .locker-actions .btn-occupy { background: var(--red-dim); color: var(--red); }
        .locker-actions .btn-occupy:hover { background: rgba(227,6,19,0.2); }
        .locker-actions .btn-available { background: rgba(34,197,94,0.1); color: var(--green); }
        .locker-actions .btn-available:hover { background: rgba(34,197,94,0.2); }
        .locker-actions .btn-delete-locker { background: var(--s2); color: var(--muted); }
        .locker-actions .btn-delete-locker:hover { color: var(--red); }

        /* Items list */
        .items-list-scroll {
            padding: 0.8rem 1rem 1rem 1rem;
            max-height: 50vh;
            overflow-y: auto;
            flex: 1;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--s3);
            padding: 0.6rem 1rem;
            border-radius: 12px;
            margin-bottom: 6px;
            border: 1px solid var(--border);
        }
        .item-row:hover { border-color: var(--red-border); }
        .item-name {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text);
        }
        .item-meta {
            font-size: 0.6rem;
            color: var(--muted);
        }
        .item-price {
            font-weight: 700;
            color: var(--red);
            font-size: 0.8rem;
        }
        .item-actions {
            display: flex;
            gap: 6px;
        }
        .item-actions button {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 4px;
        }
        .item-actions .delete-item:hover { color: var(--red); }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--muted);
            font-size: 0.8rem;
        }
        .empty-state i { font-size: 2rem; color: var(--dim); display: block; margin-bottom: 0.5rem; }

        /* ─── MODALS ─── */
        .modal-glass {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-glass.active { visibility: visible; opacity: 1; }
        .modal-card {
            background: var(--s1);
            width: 90%;
            max-width: 480px;
            border-radius: 24px;
            padding: 1.8rem 2rem;
            border: 1px solid var(--border);
        }
        .modal-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-card h3 i { color: var(--red); }
        .modal-card label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--muted);
            margin: 0.8rem 0 0.3rem;
        }
        .modal-card input, .modal-card select {
            width: 100%;
            padding: 10px 14px;
            background: var(--s2);
            border: 1px solid var(--border);
            border-radius: 40px;
            font-size: 0.8rem;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: 0.15s;
        }
        .modal-card input:focus, .modal-card select:focus {
            border-color: var(--red-border);
            box-shadow: 0 0 0 2px var(--red-dim);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 1.2rem;
        }
        .modal-actions button { flex: 1; }

        /* ─── TOAST ─── */
        .toast-notify {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--s2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 500;
            z-index: 4000;
            display: none;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .toast-notify.show { display: block; animation: fadeUp 0.2s ease; }
        .toast-notify.error { border-color: var(--red); }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ─── DASHBOARD OVERLAY ─── */
        .dashboard-overlay {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 520px;
            max-width: 93vw;
            background: var(--s1);
            border-left: 1px solid var(--border);
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2,0.9,0.3,1);
            overflow-y: auto;
            padding: 20px 22px 30px;
            box-shadow: -12px 0 60px rgba(0,0,0,0.6);
        }
        .dashboard-overlay.open { transform: translateX(0); }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .dash-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dash-header h2 i { color: var(--red); }
        .dash-close {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }
        .dash-close:hover { color: var(--text); }
        .dash-kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .dash-kpi {
            background: var(--s2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            border-left: 2px solid var(--red);
        }
        .dash-kpi .val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
        }
        .dash-kpi .label {
            font-size: 0.58rem;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.05em;
            margin-top: 2px;
        }
        .dash-kpi .sub { font-size: 0.6rem; color: var(--muted); margin-top: 4px; }
        .dash-section { margin-top: 18px; }
        .dash-section h3 {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }
        .dash-chart-wrap {
            background: var(--s2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        .dash-chart-wrap canvas { max-height: 140px; width: 100% !important; }
        .dash-stats-mini {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .dash-stat-mini {
            background: var(--s2);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .dash-stat-mini .num {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text);
        }
        .dash-stat-mini .lbl {
            font-size: 0.55rem;
            color: var(--muted);
            text-transform: uppercase;
        }
        .dash-activity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.7rem;
        }
        .dash-activity-item .icon {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--red-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            flex-shrink: 0;
        }
        .dash-activity-item .details { flex: 1; }
        .dash-activity-item .amount { font-weight: 700; color: var(--red); }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 99px; }

        @media (max-width: 900px) {
            .dashboard-split { grid-template-columns: 1fr; }
            .dashboard-overlay { width: 100vw; max-width: 100vw; }
        }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- ─── HEADER ─── -->
    <div class="main-header">
        <h2><i class="fas fa-wine-bottle"></i> Booze Locker</h2>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleDashboard()" id="toggleDashBtn" title="Analytics"><i class="fas fa-chart-pie"></i></button>
            <button class="icon-btn" onclick="refreshAll()" title="Refresh"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>

    <!-- ─── MAIN CONTENT ─── -->
    <div class="main-content">
        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-card"><i class="fas fa-wine-bottle"></i><div class="stat-number" id="kpiTotalLockers">0</div><div class="stat-label">Total Lockers</div></div>
            <div class="stat-card"><i class="fas fa-check-circle"></i><div class="stat-number" id="kpiAvailable">0</div><div class="stat-label">Available</div></div>
            <div class="stat-card"><i class="fas fa-user-lock"></i><div class="stat-number" id="kpiOccupied">0</div><div class="stat-label">Occupied</div></div>
            <div class="stat-card"><i class="fas fa-tag"></i><div class="stat-number" id="kpiItemsCount">0</div><div class="stat-label">Product SKUs</div></div>
        </div>

        <div class="dashboard-split">
            <!-- LOCKERS PANEL -->
            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fas fa-wine-bottle"></i> Vault Lockers</h2>
                    <div style="display: flex; gap: 6px;">
                        <button class="btn-primary" onclick="openCreateLockerModal()"><i class="fas fa-plus"></i> Create</button>
                        <button class="btn-secondary" onclick="refreshLockers()"><i class="fas fa-sync-alt"></i></button>
                    </div>
                </div>
                <div class="locker-grid-admin" id="lockerAdminGrid"><div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading lockers...</div></div>
            </div>

            <!-- INVENTORY PANEL -->
            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fas fa-wine-glass-alt"></i> Wine & Spirits</h2>
                    <button class="btn-primary" onclick="openCreateItemModal()"><i class="fas fa-plus"></i> New Item</button>
                </div>
                <div class="items-list-scroll" id="itemsListContainer"><div class="empty-state">Loading items...</div></div>
            </div>
        </div>
    </div>

    <!-- ─── DASHBOARD OVERLAY ─── -->
    <div class="dashboard-overlay" id="dashboardOverlay">
        <div class="dash-header">
            <h2><i class="fas fa-chart-pie"></i> Locker Analytics</h2>
            <button class="dash-close" onclick="toggleDashboard()">&times;</button>
        </div>
        <!-- KPIs -->
        <div class="dash-kpi-grid" id="dashKpiGrid"></div>
        <!-- Utilization -->
        <div class="dash-section">
            <h3>Locker Utilization</h3>
            <div class="dash-chart-wrap"><canvas id="dashUtilChart"></canvas></div>
        </div>
        <!-- Revenue Trend -->
        <div class="dash-section">
            <h3>Stored Value Trend</h3>
            <div class="dash-chart-wrap"><canvas id="dashRevenueChart"></canvas></div>
        </div>
        <!-- Top Items -->
        <div class="dash-section">
            <h3>Most Stored Items</h3>
            <div class="dash-chart-wrap"><canvas id="dashItemsChart"></canvas></div>
        </div>
        <!-- Top Customers -->
        <div class="dash-section">
            <h3>Top Customers by Value</h3>
            <div id="dashTopCustomers" style="max-height:150px;overflow:auto;"></div>
        </div>
        <!-- Alerts -->
        <div class="dash-section">
            <h3>Alerts</h3>
            <div id="dashAlerts"></div>
        </div>
    </div>

    <!-- ─── MODALS ─── -->
    <!-- Create Locker -->
    <div id="createLockerModalWin" class="modal-glass">
        <div class="modal-card">
            <h3><i class="fas fa-wine-bottle"></i> Create New Locker</h3>
            <label>Locker Number (e.g., L-001, WINE-01)</label>
            <input type="text" id="lockerNumberInput" placeholder="L-001">
            <label>Location (optional)</label>
            <input type="text" id="lockerLocationInput" placeholder="Wine Cellar, VIP Section">
            <label>Size (optional)</label>
            <select id="lockerSizeInput">
                <option value="Small">Small (6 bottles)</option>
                <option value="Medium" selected>Medium (12 bottles)</option>
                <option value="Large">Large (24 bottles)</option>
                <option value="Extra Large">Extra Large (48 bottles)</option>
            </select>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeLockerModal()">Cancel</button>
                <button class="btn-primary" onclick="createLockerAdmin()">Create Locker</button>
            </div>
        </div>
    </div>

    <!-- Create Item -->
    <div id="createItemModalWin" class="modal-glass">
        <div class="modal-card">
            <h3><i class="fas fa-wine-glass-alt"></i> Add to Inventory</h3>
            <label>Product Name</label>
            <input type="text" id="itemNameInput" placeholder="e.g., Cabernet Sauvignon">
            <label>Price (R)</label>
            <input type="number" step="0.01" id="itemPriceInput" placeholder="0.00">
            <label>Category</label>
            <select id="itemCategoryInput">
                <option value="wine">Red Wine</option>
                <option value="wine">White Wine</option>
                <option value="wine">Rosé</option>
                <option value="wine">Sparkling</option>
                <option value="spirits">Whiskey</option>
                <option value="spirits">Vodka</option>
                <option value="spirits">Gin</option>
                <option value="spirits">Rum</option>
                <option value="spirits">Tequila</option>
                <option value="beer">Craft Beer</option>
                <option value="non_alcoholic">Non-Alcoholic</option>
                <option value="other">Other</option>
            </select>
            <label>Alcohol?</label>
            <select id="itemAlcoholInput">
                <option value="true">Yes (Alcoholic)</option>
                <option value="false">No (Non-Alcoholic)</option>
            </select>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeItemModal()">Cancel</button>
                <button class="btn-primary" onclick="addItemToInventory()">Add Product</button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete -->
    <div id="confirmDeleteModal" class="modal-glass">
        <div class="modal-card">
            <h3><i class="fas fa-trash-alt"></i> Confirm Delete</h3>
            <p id="deleteConfirmMsg" style="color:var(--muted);font-size:0.85rem;margin-bottom:1rem;"></p>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeConfirmModal()">Cancel</button>
                <button class="btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-notify"></div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // ─── STATE ───
    let lockers = [];
    let inventoryItems = [];
    let pendingDeleteId = null;
    let deleteType = null;
    let charts = {};

    // ─── TOAST ───
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast-notify show' + (isError ? ' error' : '');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    function fmtR(val) { return `R${(val||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`; }

    // ─── LOCKER CRUD ───
    async function loadLockers() {
        try {
            const { data, error } = await supabase
                .from('lockers')
                .select('*')
                .order('locker_number', { ascending: true });
            if (error) throw error;
            lockers = data || [];
            renderLockers();
            updateStats();
            return lockers;
        } catch (err) {
            console.error('Load lockers error:', err);
            showToast('Failed to load lockers', true);
            lockers = [];
            renderLockers();
            return [];
        }
    }

    async function createLockerInSupabase(lockerData) {
        try {
            const { data, error } = await supabase
                .from('lockers')
                .insert([{
                    locker_number: lockerData.locker_number,
                    location: lockerData.location || null,
                    size: lockerData.size || 'Medium',
                    status: 'available',
                    price_per_hour: 0
                }])
                .select()
                .single();
            if (error) throw error;
            showToast(`Locker ${lockerData.locker_number} created!`);
            await loadLockers();
            return data;
        } catch (err) {
            showToast(err.message || 'Failed to create locker', true);
            return null;
        }
    }

    async function deleteLockerFromSupabase(lockerId, lockerNumber) {
        try {
            const { error } = await supabase.from('lockers').delete().eq('id', lockerId);
            if (error) throw error;
            showToast(`Locker ${lockerNumber} deleted`);
            await loadLockers();
            return true;
        } catch (err) {
            showToast(err.message || 'Failed to delete locker', true);
            return false;
        }
    }

    async function updateLockerStatus(lockerId, status) {
        try {
            const { error } = await supabase.from('lockers').update({ status }).eq('id', lockerId);
            if (error) throw error;
            await loadLockers();
            return true;
        } catch (err) {
            showToast('Failed to update locker status', true);
            return false;
        }
    }

    // ─── INVENTORY CRUD ───
    async function loadInventory() {
        try {
            const { data, error } = await supabase
                .from('products')
                .select('*')
                .order('name', { ascending: true });
            if (error) throw error;
            inventoryItems = data || [];
            renderInventory();
            updateStats();
            return inventoryItems;
        } catch (err) {
            console.error('Load inventory error:', err);
            showToast('Failed to load inventory', true);
            inventoryItems = [];
            renderInventory();
            return [];
        }
    }

    async function createProductInSupabase(productData) {
        try {
            const { data, error } = await supabase
                .from('products')
                .insert([{
                    name: productData.name,
                    price: parseFloat(productData.price),
                    category: productData.category,
                    alcohol: productData.alcohol === 'true',
                    is_available: true,
                    stock_quantity: 0,
                    product_type: 'other'
                }])
                .select()
                .single();
            if (error) throw error;
            showToast(`"${productData.name}" added to inventory!`);
            await loadInventory();
            return data;
        } catch (err) {
            showToast(err.message || 'Failed to create product', true);
            return null;
        }
    }

    async function deleteProductFromSupabase(productId, productName) {
        try {
            const { error } = await supabase.from('products').delete().eq('id', productId);
            if (error) throw error;
            showToast(`"${productName}" removed`);
            await loadInventory();
            return true;
        } catch (err) {
            showToast(err.message || 'Failed to delete product', true);
            return false;
        }
    }

    // ─── UI RENDER ───
    function renderLockers() {
        const grid = document.getElementById('lockerAdminGrid');
        if (!grid) return;
        if (!lockers || lockers.length === 0) {
            grid.innerHTML = '<div class="empty-state"><i class="fas fa-wine-bottle"></i>No lockers yet. Click "Create" to get started.</div>';
            return;
        }
        grid.innerHTML = lockers.map(locker => `
            <div class="locker-admin-card">
                <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;">
                    <div class="locker-number"><i class="fas fa-wine-bottle"></i> ${escapeHtml(locker.locker_number)}</div>
                    <span class="locker-status status-${locker.status === 'available' ? 'available' : (locker.status === 'rented' ? 'occupied' : 'maintenance')}">
                        ${locker.status === 'available' ? 'AVAILABLE' : (locker.status === 'rented' ? 'OCCUPIED' : 'MAINTENANCE')}
                    </span>
                </div>
                <div style="font-size:0.7rem;color:var(--muted);margin-bottom:8px;">
                    ${locker.location ? `<div><i class="fas fa-location-dot"></i> ${escapeHtml(locker.location)}</div>` : ''}
                    ${locker.size ? `<div><i class="fas fa-expand"></i> ${escapeHtml(locker.size)}</div>` : ''}
                </div>
                <div class="locker-actions">
                    ${locker.status === 'available' ?
                        `<button class="btn-occupy" onclick="markLockerOccupied('${locker.id}')"><i class="fas fa-wine-glass-alt"></i> Occupy</button>` :
                        `<button class="btn-available" onclick="markLockerAvailable('${locker.id}')"><i class="fas fa-check-circle"></i> Available</button>`
                    }
                    <button class="btn-delete-locker" onclick="deleteLockerPrompt('${locker.id}','${escapeHtml(locker.locker_number)}')"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
        `).join('');
    }

    function renderInventory() {
        const container = document.getElementById('itemsListContainer');
        if (!container) return;
        if (!inventoryItems || inventoryItems.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-wine-glass-alt"></i>No wine & spirits items yet. Click "New Item" to add.</div>';
            return;
        }
        container.innerHTML = inventoryItems.map(item => {
            const icon = item.category === 'wine' ? 'fa-wine-bottle' :
                        (item.category === 'spirits' ? 'fa-whiskey-glass' : 'fa-glass-cheers');
            return `
                <div class="item-row">
                    <div style="flex:2;">
                        <div class="item-name"><i class="fas ${icon}" style="color:var(--red);margin-right:6px;"></i>${escapeHtml(item.name)}</div>
                        <div class="item-meta">${escapeHtml(item.category || 'Wine & Spirits')} ${item.alcohol ? '<i class="fas fa-wine-bottle"></i>' : '<i class="fas fa-leaf"></i>'}</div>
                    </div>
                    <div class="item-price">${fmtR(item.price)}</div>
                    <div class="item-actions">
                        <button class="delete-item" onclick="deleteItemPrompt('${item.id}','${escapeHtml(item.name)}')"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateStats() {
        const total = lockers.length;
        const available = lockers.filter(l => l.status === 'available').length;
        const occupied = lockers.filter(l => l.status === 'rented').length;
        document.getElementById('kpiTotalLockers').textContent = total;
        document.getElementById('kpiAvailable').textContent = available;
        document.getElementById('kpiOccupied').textContent = occupied;
        document.getElementById('kpiItemsCount').textContent = inventoryItems.length;
    }

    // ─── MODAL HANDLERS ───
    function openCreateLockerModal() {
        document.getElementById('lockerNumberInput').value = '';
        document.getElementById('lockerLocationInput').value = '';
        document.getElementById('lockerSizeInput').value = 'Medium';
        document.getElementById('createLockerModalWin').classList.add('active');
    }
    window.openCreateLockerModal = openCreateLockerModal;

    function closeLockerModal() {
        document.getElementById('createLockerModalWin').classList.remove('active');
    }
    window.closeLockerModal = closeLockerModal;

    async function createLockerAdmin() {
        const lockerNumber = document.getElementById('lockerNumberInput').value.trim();
        const location = document.getElementById('lockerLocationInput').value.trim();
        const size = document.getElementById('lockerSizeInput').value;
        if (!lockerNumber) { showToast('Enter a locker number', true); return; }
        if (lockers.some(l => l.locker_number === lockerNumber)) {
            showToast(`Locker ${lockerNumber} already exists!`, true);
            return;
        }
        closeLockerModal();
        await createLockerInSupabase({ locker_number: lockerNumber, location, size });
    }
    window.createLockerAdmin = createLockerAdmin;

    function deleteLockerPrompt(lockerId, lockerNumber) {
        pendingDeleteId = lockerId;
        deleteType = 'locker';
        document.getElementById('deleteConfirmMsg').innerHTML = `<i class="fas fa-wine-bottle"></i> Delete locker "${lockerNumber}"? This cannot be undone.`;
        document.getElementById('confirmDeleteModal').classList.add('active');
    }
    window.deleteLockerPrompt = deleteLockerPrompt;

    function deleteItemPrompt(itemId, itemName) {
        pendingDeleteId = itemId;
        deleteType = 'item';
        document.getElementById('deleteConfirmMsg').innerHTML = `<i class="fas fa-wine-glass-alt"></i> Delete "${itemName}" from inventory? This cannot be undone.`;
        document.getElementById('confirmDeleteModal').classList.add('active');
    }
    window.deleteItemPrompt = deleteItemPrompt;

    function closeConfirmModal() {
        document.getElementById('confirmDeleteModal').classList.remove('active');
        pendingDeleteId = null;
        deleteType = null;
    }
    window.closeConfirmModal = closeConfirmModal;

    async function confirmDelete() {
        if (deleteType === 'locker' && pendingDeleteId) {
            const locker = lockers.find(l => l.id === pendingDeleteId);
            await deleteLockerFromSupabase(pendingDeleteId, locker?.locker_number || 'Unknown');
        } else if (deleteType === 'item' && pendingDeleteId) {
            const item = inventoryItems.find(i => i.id === pendingDeleteId);
            await deleteProductFromSupabase(pendingDeleteId, item?.name || 'Unknown');
        }
        closeConfirmModal();
    }
    window.confirmDelete = confirmDelete;

    async function markLockerOccupied(lockerId) {
        await updateLockerStatus(lockerId, 'rented');
        showToast('Locker marked as occupied');
    }
    window.markLockerOccupied = markLockerOccupied;

    async function markLockerAvailable(lockerId) {
        await updateLockerStatus(lockerId, 'available');
        showToast('Locker marked as available');
    }
    window.markLockerAvailable = markLockerAvailable;

    function openCreateItemModal() {
        document.getElementById('itemNameInput').value = '';
        document.getElementById('itemPriceInput').value = '';
        document.getElementById('itemCategoryInput').value = 'wine';
        document.getElementById('itemAlcoholInput').value = 'true';
        document.getElementById('createItemModalWin').classList.add('active');
    }
    window.openCreateItemModal = openCreateItemModal;

    function closeItemModal() {
        document.getElementById('createItemModalWin').classList.remove('active');
    }
    window.closeItemModal = closeItemModal;

    async function addItemToInventory() {
        const name = document.getElementById('itemNameInput').value.trim();
        const price = document.getElementById('itemPriceInput').value;
        const category = document.getElementById('itemCategoryInput').value;
        const alcohol = document.getElementById('itemAlcoholInput').value;
        if (!name) { showToast('Enter a product name', true); return; }
        if (!price || parseFloat(price) <= 0) { showToast('Enter a valid price', true); return; }
        closeItemModal();
        await createProductInSupabase({ name, price, category, alcohol });
    }
    window.addItemToInventory = addItemToInventory;

    async function refreshLockers() {
        await loadLockers();
        await loadInventory();
        showToast('Refreshed');
    }
    window.refreshLockers = refreshLockers;

    async function refreshAll() {
        await refreshLockers();
        if (document.getElementById('dashboardOverlay').classList.contains('open')) renderCharts();
    }
    window.refreshAll = refreshAll;

    // ─── DASHBOARD TOGGLE ───
    function toggleDashboard() {
        const overlay = document.getElementById('dashboardOverlay');
        overlay.classList.toggle('open');
        document.getElementById('toggleDashBtn').classList.toggle('active-toggle', overlay.classList.contains('open'));
        if (overlay.classList.contains('open')) renderCharts();
    }
    window.toggleDashboard = toggleDashboard;

    // ─── CHARTS ───
    function renderCharts() {
        // KPIs
        const total = lockers.length;
        const available = lockers.filter(l => l.status === 'available').length;
        const occupied = lockers.filter(l => l.status === 'rented').length;
        const utilRate = total ? Math.round((occupied / total) * 100) : 0;
        const totalValue = lockers.reduce((s, l) => s + (l.total_value || 0), 0);
        const avgValue = occupied ? totalValue / occupied : 0;

        document.getElementById('dashKpiGrid').innerHTML = `
            <div class="dash-kpi"><div class="val">${total}</div><div class="label">Total Lockers</div><div class="sub">${occupied} occupied</div></div>
            <div class="dash-kpi"><div class="val">${utilRate}%</div><div class="label">Utilization</div></div>
            <div class="dash-kpi"><div class="val">${fmtR(totalValue)}</div><div class="label">Stored Value</div><div class="sub">Avg: ${fmtR(avgValue)}</div></div>
            <div class="dash-kpi"><div class="val">${available}</div><div class="label">Available</div><div class="sub">${Math.round((available/total)*100)}% free</div></div>
        `;

        // Utilization chart
        const ctx1 = document.getElementById('dashUtilChart').getContext('2d');
        if (charts.util) charts.util.destroy();
        charts.util = new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: ['Occupied', 'Available', 'Maintenance'],
                datasets: [{ data: [occupied, available, lockers.filter(l => l.status === 'maintenance').length], backgroundColor: ['#E30613', '#22c55e', '#f59e0b'] }]
            },
            options: { responsive: true, plugins: { legend: { labels: { color: '#71717a', boxWidth: 8 } } } }
        });

        // Revenue trend (mock from occupied_at dates)
        const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
        const revData = days.map(() => {
            // Simulate from lockers with occupied_at
            const dayLockers = lockers.filter(l => l.occupied_at && new Date(l.occupied_at).getDay() === days.indexOf(day));
            return dayLockers.reduce((s, l) => s + (l.total_value || 0), 0);
        });
        const ctx2 = document.getElementById('dashRevenueChart').getContext('2d');
        if (charts.revenue) charts.revenue.destroy();
        charts.revenue = new Chart(ctx2, {
            type: 'line',
            data: { labels: days, datasets: [{ label: 'Stored Value (R)', data: revData, borderColor: '#E30613', backgroundColor: 'rgba(227,6,19,0.1)', fill: true, tension: 0.3 }] },
            options: { responsive: true, plugins: { tooltip: { callbacks: { label: (ctx) => fmtR(ctx.raw) } } } }
        });

        // Top items (from inventory)
        const itemCount = {};
        inventoryItems.forEach(item => {
            const name = item.name || 'Unknown';
            itemCount[name] = (itemCount[name] || 0) + (item.stock_quantity || 1);
        });
        const sortedItems = Object.entries(itemCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
        const ctx3 = document.getElementById('dashItemsChart').getContext('2d');
        if (charts.items) charts.items.destroy();
        charts.items = new Chart(ctx3, {
            type: 'bar',
            data: {
                labels: sortedItems.map(i => i[0].slice(0, 12)),
                datasets: [{ label: 'Units', data: sortedItems.map(i => i[1]), backgroundColor: '#E30613', borderRadius: 4 }]
            },
            options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } } }
        });

        // Top customers (from lockers with customer_name)
        const occupiedLockers = lockers.filter(l => l.status === 'rented' && l.customer_name);
        const sortedCustomers = [...occupiedLockers].sort((a, b) => (b.total_value || 0) - (a.total_value || 0)).slice(0, 5);
        const topContainer = document.getElementById('dashTopCustomers');
        if (sortedCustomers.length) {
            topContainer.innerHTML = sortedCustomers.map((c, idx) => `
                <div class="dash-activity-item" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.7rem;">
                    <span>${idx+1}. ${c.customer_name || 'Anonymous'} (${c.locker_number})</span>
                    <span style="color:var(--red);font-weight:700;">${fmtR(c.total_value)}</span>
                </div>
            `).join('');
        } else {
            topContainer.innerHTML = '<div style="color:var(--muted);font-size:0.7rem;padding:8px 0;">No occupied lockers</div>';
        }

        // Alerts
        const alerts = [];
        if (available < 3 && occupied > 0) alerts.push({ level:'warning', title:'Low Availability', desc:`Only ${available} lockers available` });
        if (occupied === 0 && total > 0) alerts.push({ level:'info', title:'No Occupied Lockers', desc:'Utilization is at 0%' });
        const highValue = lockers.filter(l => (l.total_value||0) > 3000).length;
        if (highValue > 3) alerts.push({ level:'info', title:'High-Value Lockers', desc:`${highValue} lockers > R3000` });
        const alertDiv = document.getElementById('dashAlerts');
        if (alerts.length) {
            alertDiv.innerHTML = alerts.map(a => `
                <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.7rem;">
                    <i class="fas fa-exclamation-circle" style="color:${a.level==='warning'?'var(--gold)':'#3b82f6'}"></i>
                    <div><strong>${a.title}</strong> · ${a.desc}</div>
                </div>
            `).join('');
        } else {
            alertDiv.innerHTML = '<div style="color:var(--muted);font-size:0.7rem;">No alerts</div>';
        }
    }

    // ─── REALTIME ───
    function setupRealtime() {
        supabase.channel('locker-admin')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'lockers' }, () => loadLockers())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => loadInventory())
            .subscribe();
    }

    // ─── INIT ───
    async function init() {
        await Promise.all([loadLockers(), loadInventory()]);
        setupRealtime();
        // Auto-refresh every 30s
        setInterval(() => { loadLockers(); loadInventory(); }, 30000);
        // Close overlay on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const overlay = document.getElementById('dashboardOverlay');
                if (overlay.classList.contains('open')) toggleDashboard();
            }
        });
    }
    init();
</script>
</body>
</html>
