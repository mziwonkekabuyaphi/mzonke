<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Vault Admin (Embedded)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      padding: 0;
      margin: 0;
    }
    .iframe-module {
      width: 100%;
      background: #f5f7fb;
      padding: 20px;
    }
    .kpi-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .kpi-card {
      background: white;
      border-radius: 28px;
      padding: 1.2rem 1.8rem;
      flex: 1;
      min-width: 160px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border: 1px solid #edf2f7;
    }
    .kpi-card i { font-size: 2rem; color: #E30613; margin-bottom: 0.5rem; }
    .kpi-number { font-size: 2rem; font-weight: 800; color: #1e293b; }
    .dashboard-split {
      display: grid;
      grid-template-columns: 1fr 0.9fr;
      gap: 2rem;
    }
    @media (max-width: 1000px) {
      .dashboard-split { grid-template-columns: 1fr; gap: 2rem; }
    }
    .panel {
      background: white;
      border-radius: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border: 1px solid #edf2f7;
      overflow: hidden;
    }
    .panel-header {
      background: #fafcff;
      padding: 1.2rem 1.8rem;
      border-bottom: 1px solid #edf2f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .panel-header h2 { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .locker-grid-admin {
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
      max-height: 65vh;
      overflow-y: auto;
    }
    .locker-admin-card {
      background: white;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      padding: 1rem;
      transition: 0.2s;
    }
    .locker-admin-card:hover { border-color: #E30613; transform: translateY(-3px); }
    .locker-status {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .status-available { background: #d1fae5; color: #065f46; }
    .status-occupied { background: #fed7aa; color: #9a3412; }
    .btn-primary {
      background: #E30613;
      border: none;
      padding: 0.6rem 1.3rem;
      border-radius: 40px;
      font-weight: 600;
      color: white;
      cursor: pointer;
    }
    .btn-primary:hover { background: #b8050f; transform: translateY(-2px); }
    .btn-secondary {
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      cursor: pointer;
    }
    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      cursor: pointer;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 0.7rem 1rem;
      border-radius: 14px;
      margin-bottom: 8px;
    }
    .item-price { font-weight: 700; color: #E30613; }
    .items-list-scroll {
      max-height: 55vh;
      overflow-y: auto;
      padding: 0 1rem 1rem 1rem;
    }
    .empty-state {
      text-align: center;
      padding: 2.5rem;
      color: #94a3b8;
    }
    .modal-glass {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .modal-glass.active { visibility: visible; opacity: 1; }
    .modal-card {
      background: white;
      width: 90%;
      max-width: 500px;
      border-radius: 36px;
      padding: 1.8rem;
    }
    .modal-card input, .modal-card select {
      width: 100%;
      padding: 12px 16px;
      margin: 10px 0 16px;
      border: 1px solid #cbd5e1;
      border-radius: 60px;
    }
    .toast-notify {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 500;
      z-index: 1100;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px);}
      to { opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
<div class="iframe-module">
  <div class="kpi-grid">
    <div class="kpi-card"><i class="fas fa-locker"></i><div class="kpi-number" id="kpiTotalLockers">0</div><div>Total Lockers</div></div>
    <div class="kpi-card"><i class="fas fa-check-circle"></i><div class="kpi-number" id="kpiAvailable">0</div><div>Available</div></div>
    <div class="kpi-card"><i class="fas fa-user-lock"></i><div class="kpi-number" id="kpiOccupied">0</div><div>Occupied</div></div>
    <div class="kpi-card"><i class="fas fa-tag"></i><div class="kpi-number" id="kpiItemsCount">0</div><div>Product SKUs</div></div>
  </div>

  <div class="dashboard-split">
    <div class="panel">
      <div class="panel-header">
        <h2><i class="fas fa-archive" style="color:#E30613;"></i> Vault Lockers</h2>
        <div style="display: flex; gap: 10px;">
          <button class="btn-primary" onclick="openCreateLockerModal()"><i class="fas fa-plus-circle"></i> Create Locker</button>
          <button class="btn-secondary" onclick="refreshLockersAdmin()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
      </div>
      <div class="locker-grid-admin" id="lockerAdminGrid"><div class="empty-state">Loading lockers...</div></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2><i class="fas fa-cube" style="color:#E30613;"></i> Item Inventory</h2>
        <button class="btn-primary" onclick="openCreateItemModal()"><i class="fas fa-plus"></i> New Item</button>
      </div>
      <div class="items-list-scroll" id="itemsListContainer"><div class="empty-state">No items yet.</div></div>
    </div>
  </div>
</div>

<!-- modals (unchanged functionality) -->
<div id="createLockerModalWin" class="modal-glass"><div class="modal-card"><h3>New Locker</h3><label>Locker Number</label><input type="number" id="lockerNumberInput"><label>QR Tag</label><input type="text" id="lockerQrInput"><div class="flex-btns" style="display:flex; gap:12px; margin-top:20px;"><button class="btn-secondary" onclick="closeLockerModal()">Cancel</button><button class="btn-primary" onclick="createLockerAdmin()">Create</button></div></div></div>
<div id="createItemModalWin" class="modal-glass"><div class="modal-card"><h3>Add Product</h3><label>Item Name</label><input type="text" id="itemNameInput"><label>Price (R)</label><input type="number" step="0.01" id="itemPriceInput"><label>Barcode</label><input type="text" id="itemBarcodeInput"><div class="flex-btns" style="display:flex; gap:12px; margin-top:20px;"><button class="btn-secondary" onclick="closeItemModal()">Cancel</button><button class="btn-primary" onclick="addItemToInventory()">Add</button></div></div></div>
<div id="confirmDeleteModal" class="modal-glass"><div class="modal-card"><h3>Confirm Delete</h3><p id="deleteConfirmMsg"></p><div class="flex-btns" style="display:flex; gap:12px; margin-top:20px;"><button class="btn-secondary" onclick="closeConfirmModal()">Cancel</button><button class="btn-danger" id="confirmDeleteBtn">Delete</button></div></div></div>

<script>
// Exact same JavaScript from original (lockers + items logic), no changes to functionality
const STORAGE_LOCKERS = 'rands_lockers';
const STORAGE_ITEMS = 'rands_inventory_items';
let lockers = [];
let inventoryItems = [];
let pendingDeleteCallback = null;

function loadLockersFromStorage() { /* same as original */ }
function createInitialLockers() { /* same */ }
function loadInventoryFromStorage() { /* same */ }
function saveLockers() { localStorage.setItem(STORAGE_LOCKERS, JSON.stringify(lockers)); }
function saveInventory() { localStorage.setItem(STORAGE_ITEMS, JSON.stringify(inventoryItems)); }
function renderLockersAdmin() { /* same but adapt IDs */ }
function renderItemsAdmin() { /* same */ }
function updateStatsUI() { /* same */ }
function openCreateLockerModal() { document.getElementById('createLockerModalWin').classList.add('active'); }
function closeLockerModal() { document.getElementById('createLockerModalWin').classList.remove('active'); }
function createLockerAdmin() { /* same logic */ }
function deleteLockerPrompt(lockerId) { /* same */ }
function closeConfirmModal() { document.getElementById('confirmDeleteModal').classList.remove('active'); }
function viewLockerItems(lockerId) { /* same */ }
function openCreateItemModal() { document.getElementById('createItemModalWin').classList.add('active'); }
function closeItemModal() { document.getElementById('createItemModalWin').classList.remove('active'); }
function addItemToInventory() { /* same */ }
function deleteItem(itemId) { /* same */ }
function refreshLockersAdmin() { loadLockersFromStorage(); renderLockersAdmin(); showToast("Lockers refreshed"); }
function showToast(msg) { /* same toast */ }

// Initialise
function init() {
  loadLockersFromStorage();
  loadInventoryFromStorage();
  renderLockersAdmin();
  renderItemsAdmin();
}
init();
setInterval(() => {
  const fresh = localStorage.getItem(STORAGE_LOCKERS);
  if (fresh) { lockers = JSON.parse(fresh); renderLockersAdmin(); }
  const freshItems = localStorage.getItem(STORAGE_ITEMS);
  if (freshItems) { inventoryItems = JSON.parse(freshItems); renderItemsAdmin(); }
  updateStatsUI();
}, 2800);

// Expose globals
window.openCreateLockerModal = openCreateLockerModal;
window.closeLockerModal = closeLockerModal;
window.createLockerAdmin = createLockerAdmin;
window.deleteLockerPrompt = deleteLockerPrompt;
window.closeConfirmModal = closeConfirmModal;
window.viewLockerItems = viewLockerItems;
window.openCreateItemModal = openCreateItemModal;
window.closeItemModal = closeItemModal;
window.addItemToInventory = addItemToInventory;
window.deleteItem = deleteItem;
window.refreshLockersAdmin = refreshLockersAdmin;
</script>
</body>
</html>
