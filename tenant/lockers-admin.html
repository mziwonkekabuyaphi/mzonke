<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vault Admin | Booze Lockers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            padding: 0;
            margin: 0;
        }
        .iframe-module {
            width: 100%;
            background: #f5f7fb;
            padding: 20px;
        }
        .kpi-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .kpi-card {
            background: white;
            border-radius: 28px;
            padding: 1.2rem 1.8rem;
            flex: 1;
            min-width: 160px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #E30613;
        }
        .kpi-card i { font-size: 2rem; color: #E30613; margin-bottom: 0.5rem; }
        .kpi-number { font-size: 2rem; font-weight: 800; color: #1e293b; }
        .dashboard-split {
            display: grid;
            grid-template-columns: 1fr 0.9fr;
            gap: 2rem;
        }
        @media (max-width: 1000px) {
            .dashboard-split { grid-template-columns: 1fr; gap: 2rem; }
        }
        .panel {
            background: white;
            border-radius: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            overflow: hidden;
        }
        .panel-header {
            background: #fafcff;
            padding: 1.2rem 1.8rem;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .panel-header h2 { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .panel-header h2 i { color: #E30613; }
        .locker-grid-admin {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            max-height: 65vh;
            overflow-y: auto;
        }
        .locker-admin-card {
            background: white;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            padding: 1rem;
            transition: 0.2s;
        }
        .locker-admin-card:hover { border-color: #E30613; transform: translateY(-3px); }
        .locker-status {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .status-available { background: #d1fae5; color: #065f46; }
        .status-occupied { background: #fed7aa; color: #9a3412; }
        .status-maintenance { background: #fee2e2; color: #991b1b; }
        .btn-primary {
            background: #E30613;
            border: none;
            padding: 0.6rem 1.3rem;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: #b8050f; transform: translateY(-2px); }
        .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            cursor: pointer;
        }
        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            cursor: pointer;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 0.7rem 1rem;
            border-radius: 14px;
            margin-bottom: 8px;
        }
        .item-price { font-weight: 700; color: #E30613; }
        .items-list-scroll {
            max-height: 55vh;
            overflow-y: auto;
            padding: 0 1rem 1rem 1rem;
        }
        .empty-state {
            text-align: center;
            padding: 2.5rem;
            color: #94a3b8;
        }
        .modal-glass {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-glass.active { visibility: visible; opacity: 1; }
        .modal-card {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 36px;
            padding: 1.8rem;
        }
        .modal-card input, .modal-card select {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0 16px;
            border: 1px solid #cbd5e1;
            border-radius: 60px;
            font-family: 'Inter', sans-serif;
        }
        .toast-notify {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 500;
            z-index: 1100;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .locker-number {
            font-weight: 800;
            font-size: 1.1rem;
            color: #1e293b;
        }
        .loading-spinner {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }
        .wine-icon-badge {
            background: #8B0000;
            color: white;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
<div class="iframe-module">
    <!-- Brand Header with Logo -->
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <img src="../assets/images/rands-logo.png" alt="Rands" style="height: 40px; width: auto;" onerror="this.style.display='none'">
        <div>
            <h1 style="font-size: 1.5rem; font-weight: 800; color: #1e293b;"><i class="fas fa-wine-bottle" style="color: #E30613;"></i> Booze Lockers | Vault Admin</h1>
            <p style="color: #64748b; font-size: 0.8rem;">Secure wine & spirits storage management</p>
        </div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card"><i class="fas fa-wine-bottle"></i><div class="kpi-number" id="kpiTotalLockers">0</div><div>Total Lockers</div></div>
        <div class="kpi-card"><i class="fas fa-check-circle"></i><div class="kpi-number" id="kpiAvailable">0</div><div>Available</div></div>
        <div class="kpi-card"><i class="fas fa-user-lock"></i><div class="kpi-number" id="kpiOccupied">0</div><div>Occupied</div></div>
        <div class="kpi-card"><i class="fas fa-tag"></i><div class="kpi-number" id="kpiItemsCount">0</div><div>Product SKUs</div></div>
    </div>

    <div class="dashboard-split">
        <div class="panel">
            <div class="panel-header">
                <h2><i class="fas fa-wine-bottle"></i> Vault Lockers</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-primary" onclick="openCreateLockerModal()"><i class="fas fa-plus-circle"></i> Create Locker</button>
                    <button class="btn-secondary" onclick="refreshLockersAdmin()"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
            </div>
            <div class="locker-grid-admin" id="lockerAdminGrid"><div class="empty-state">Loading lockers...</div></div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2><i class="fas fa-wine-glass-alt"></i> Item Inventory <span class="wine-icon-badge"><i class="fas fa-wine-bottle"></i> Wine & Spirits</span></h2>
                <button class="btn-primary" onclick="openCreateItemModal()"><i class="fas fa-plus"></i> New Item</button>
            </div>
            <div class="items-list-scroll" id="itemsListContainer"><div class="empty-state">Loading items...</div></div>
        </div>
    </div>
</div>

<!-- Modals -->
<div id="createLockerModalWin" class="modal-glass">
    <div class="modal-card">
        <h3><i class="fas fa-wine-bottle"></i> Create New Locker</h3>
        <label>Locker Number (e.g., L-001, WINE-01)</label>
        <input type="text" id="lockerNumberInput" placeholder="L-001">
        <label>Location (optional)</label>
        <input type="text" id="lockerLocationInput" placeholder="Wine Cellar, VIP Section">
        <label>Size (optional)</label>
        <select id="lockerSizeInput">
            <option value="Small">Small (6 bottles)</option>
            <option value="Medium">Medium (12 bottles)</option>
            <option value="Large">Large (24 bottles)</option>
            <option value="Extra Large">Extra Large (48 bottles)</option>
        </select>
        <div style="display:flex; gap:12px; margin-top:20px;">
            <button class="btn-secondary" onclick="closeLockerModal()">Cancel</button>
            <button class="btn-primary" onclick="createLockerAdmin()">Create Locker</button>
        </div>
    </div>
</div>

<div id="createItemModalWin" class="modal-glass">
    <div class="modal-card">
        <h3><i class="fas fa-wine-glass-alt"></i> Add to Wine & Spirits Inventory</h3>
        <label>Product Name</label>
        <input type="text" id="itemNameInput" placeholder="e.g., Cabernet Sauvignon">
        <label>Price (R)</label>
        <input type="number" step="0.01" id="itemPriceInput" placeholder="0.00">
        <label>Category</label>
        <select id="itemCategoryInput">
            <option value="wine">Red Wine</option>
            <option value="wine">White Wine</option>
            <option value="wine">Rosé</option>
            <option value="wine">Sparkling</option>
            <option value="spirits">Whiskey</option>
            <option value="spirits">Vodka</option>
            <option value="spirits">Gin</option>
            <option value="spirits">Rum</option>
            <option value="spirits">Tequila</option>
            <option value="beer">Craft Beer</option>
            <option value="non_alcoholic">Non-Alcoholic</option>
            <option value="other">Other</option>
        </select>
        <label>Alcohol?</label>
        <select id="itemAlcoholInput">
            <option value="true">Yes (Alcoholic)</option>
            <option value="false">No (Non-Alcoholic)</option>
        </select>
        <div style="display:flex; gap:12px; margin-top:20px;">
            <button class="btn-secondary" onclick="closeItemModal()">Cancel</button>
            <button class="btn-primary" onclick="addItemToInventory()">Add Product</button>
        </div>
    </div>
</div>

<div id="confirmDeleteModal" class="modal-glass">
    <div class="modal-card">
        <h3><i class="fas fa-trash-alt"></i> Confirm Delete</h3>
        <p id="deleteConfirmMsg"></p>
        <div style="display:flex; gap:12px; margin-top:20px;">
            <button class="btn-secondary" onclick="closeConfirmModal()">Cancel</button>
            <button class="btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // Global state
    let lockers = [];
    let inventoryItems = [];
    let pendingDeleteCallback = null;
    let pendingDeleteId = null;
    let deleteType = null;

    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast-notify';
        toast.textContent = message;
        toast.style.background = isError ? '#dc2626' : '#1e293b';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // LOCKER FUNCTIONS
    async function loadLockersFromSupabase() {
        try {
            const { data, error } = await supabase
                .from('lockers')
                .select('*')
                .order('locker_number', { ascending: true });
            
            if (error) throw error;
            
            lockers = data || [];
            renderLockersAdmin();
            updateStatsUI();
            return lockers;
        } catch (err) {
            console.error('Error loading lockers:', err);
            showToast('Failed to load lockers from database', true);
            lockers = [];
            renderLockersAdmin();
            return [];
        }
    }

    async function createLockerInSupabase(lockerData) {
        try {
            const { data, error } = await supabase
                .from('lockers')
                .insert([{
                    locker_number: lockerData.locker_number,
                    location: lockerData.location || null,
                    size: lockerData.size || 'Medium',
                    status: 'available',
                    price_per_hour: 0
                }])
                .select()
                .single();
            
            if (error) throw error;
            
            showToast(`✅ Locker ${lockerData.locker_number} created successfully!`);
            await loadLockersFromSupabase();
            return data;
        } catch (err) {
            console.error('Error creating locker:', err);
            showToast(err.message || 'Failed to create locker', true);
            return null;
        }
    }

    async function deleteLockerFromSupabase(lockerId, lockerNumber) {
        try {
            const { error } = await supabase
                .from('lockers')
                .delete()
                .eq('id', lockerId);
            
            if (error) throw error;
            
            showToast(`✅ Locker ${lockerNumber} deleted successfully!`);
            await loadLockersFromSupabase();
            return true;
        } catch (err) {
            console.error('Error deleting locker:', err);
            showToast(err.message || 'Failed to delete locker', true);
            return false;
        }
    }

    async function updateLockerStatus(lockerId, status) {
        try {
            const { error } = await supabase
                .from('lockers')
                .update({ status: status })
                .eq('id', lockerId);
            
            if (error) throw error;
            
            await loadLockersFromSupabase();
            return true;
        } catch (err) {
            console.error('Error updating locker status:', err);
            showToast('Failed to update locker status', true);
            return false;
        }
    }

    // INVENTORY FUNCTIONS
    async function loadInventoryFromSupabase() {
        try {
            const { data, error } = await supabase
                .from('products')
                .select('*')
                .order('name', { ascending: true });
            
            if (error) throw error;
            
            inventoryItems = data || [];
            renderItemsAdmin();
            updateStatsUI();
            return inventoryItems;
        } catch (err) {
            console.error('Error loading inventory:', err);
            showToast('Failed to load inventory from database', true);
            inventoryItems = [];
            renderItemsAdmin();
            return [];
        }
    }

    async function createProductInSupabase(productData) {
        try {
            const { data, error } = await supabase
                .from('products')
                .insert([{
                    name: productData.name,
                    price: parseFloat(productData.price),
                    category: productData.category,
                    alcohol: productData.alcohol === 'true',
                    is_available: true,
                    stock_quantity: 0,
                    product_type: 'other'
                }])
                .select()
                .single();
            
            if (error) throw error;
            
            showToast(`✅ "${productData.name}" added to wine & spirits inventory!`);
            await loadInventoryFromSupabase();
            return data;
        } catch (err) {
            console.error('Error creating product:', err);
            showToast(err.message || 'Failed to create product', true);
            return null;
        }
    }

    async function deleteProductFromSupabase(productId, productName) {
        try {
            const { error } = await supabase
                .from('products')
                .delete()
                .eq('id', productId);
            
            if (error) throw error;
            
            showToast(`✅ "${productName}" removed from inventory!`);
            await loadInventoryFromSupabase();
            return true;
        } catch (err) {
            console.error('Error deleting product:', err);
            showToast(err.message || 'Failed to delete product', true);
            return false;
        }
    }

    // UI RENDERING
    function renderLockersAdmin() {
        const grid = document.getElementById('lockerAdminGrid');
        if (!grid) return;
        
        if (!lockers || lockers.length === 0) {
            grid.innerHTML = '<div class="empty-state"><i class="fas fa-wine-bottle"></i><p>No lockers yet. Click "Create Locker" to get started.</p></div>';
            return;
        }
        
        grid.innerHTML = lockers.map(locker => `
            <div class="locker-admin-card">
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                    <div class="locker-number"><i class="fas fa-wine-bottle"></i> ${escapeHtml(locker.locker_number)}</div>
                    <div>
                        <span class="locker-status status-${locker.status === 'available' ? 'available' : (locker.status === 'rented' ? 'occupied' : 'maintenance')}">
                            ${locker.status === 'available' ? 'AVAILABLE' : (locker.status === 'rented' ? 'OCCUPIED 🍷' : 'MAINTENANCE')}
                        </span>
                    </div>
                </div>
                <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">
                    ${locker.location ? `<div><i class="fas fa-location-dot"></i> ${escapeHtml(locker.location)}</div>` : ''}
                    ${locker.size ? `<div><i class="fas fa-expand"></i> ${escapeHtml(locker.size)}</div>` : ''}
                </div>
                <div style="display: flex; gap: 8px; margin-top: 12px;">
                    ${locker.status === 'available' ? 
                        `<button class="btn-secondary" style="flex:1;" onclick="markLockerOccupied('${locker.id}')">
                            <i class="fas fa-wine-glass-alt"></i> Mark Occupied
                        </button>` : 
                        `<button class="btn-secondary" style="flex:1;" onclick="markLockerAvailable('${locker.id}')">
                            <i class="fas fa-check-circle"></i> Mark Available
                        </button>`
                    }
                    <button class="btn-danger" style="flex:0.5;" onclick="deleteLockerPrompt('${locker.id}', '${escapeHtml(locker.locker_number)}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `).join('');
    }

    function renderItemsAdmin() {
        const container = document.getElementById('itemsListContainer');
        if (!container) return;
        
        if (!inventoryItems || inventoryItems.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fas fa-wine-glass-alt"></i><p>No wine & spirits items yet. Click "New Item" to add.</p></div>';
            return;
        }
        
        container.innerHTML = inventoryItems.map(item => {
            const categoryIcon = item.category === 'wine' ? 'fa-wine-bottle' : (item.category === 'spirits' ? 'fa-whiskey-glass' : 'fa-glass-cheers');
            return `
                <div class="item-row">
                    <div style="flex:2;">
                        <strong><i class="fas ${categoryIcon}" style="color: #8B0000;"></i> ${escapeHtml(item.name)}</strong><br>
                        <small style="color:#64748b;">${item.category || 'Wine & Spirits'} ${item.alcohol ? '🍷' : '🧃'}</small>
                    </div>
                    <div class="item-price" style="flex:1; text-align:right;">
                        R${(item.price || 0).toFixed(2)}
                    </div>
                    <button class="btn-danger" style="margin-left: 12px;" onclick="deleteItemPrompt('${item.id}', '${escapeHtml(item.name)}')">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            `;
        }).join('');
    }

    function updateStatsUI() {
        const totalLockers = lockers.length;
        const availableLockers = lockers.filter(l => l.status === 'available').length;
        const occupiedLockers = lockers.filter(l => l.status === 'rented').length;
        const itemsCount = inventoryItems.length;
        
        document.getElementById('kpiTotalLockers').textContent = totalLockers;
        document.getElementById('kpiAvailable').textContent = availableLockers;
        document.getElementById('kpiOccupied').textContent = occupiedLockers;
        document.getElementById('kpiItemsCount').textContent = itemsCount;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Modal handlers
    function openCreateLockerModal() {
        document.getElementById('lockerNumberInput').value = '';
        document.getElementById('lockerLocationInput').value = '';
        document.getElementById('lockerSizeInput').value = 'Medium';
        document.getElementById('createLockerModalWin').classList.add('active');
    }
    
    function closeLockerModal() {
        document.getElementById('createLockerModalWin').classList.remove('active');
    }
    
    async function createLockerAdmin() {
        const lockerNumber = document.getElementById('lockerNumberInput').value.trim();
        const location = document.getElementById('lockerLocationInput').value.trim();
        const size = document.getElementById('lockerSizeInput').value;
        
        if (!lockerNumber) {
            showToast('Please enter a locker number (e.g., L-001, WINE-01)', true);
            return;
        }
        
        const exists = lockers.some(l => l.locker_number === lockerNumber);
        if (exists) {
            showToast(`Locker ${lockerNumber} already exists!`, true);
            return;
        }
        
        closeLockerModal();
        
        await createLockerInSupabase({
            locker_number: lockerNumber,
            location: location,
            size: size
        });
    }
    
    function deleteLockerPrompt(lockerId, lockerNumber) {
        pendingDeleteId = lockerId;
        deleteType = 'locker';
        document.getElementById('deleteConfirmMsg').innerHTML = `<i class="fas fa-wine-bottle"></i> Delete locker "${lockerNumber}"? This action cannot be undone.`;
        document.getElementById('confirmDeleteModal').classList.add('active');
    }
    
    async function deleteItemPrompt(itemId, itemName) {
        pendingDeleteId = itemId;
        deleteType = 'item';
        document.getElementById('deleteConfirmMsg').innerHTML = `<i class="fas fa-wine-glass-alt"></i> Delete "${itemName}" from wine & spirits inventory? This action cannot be undone.`;
        document.getElementById('confirmDeleteModal').classList.add('active');
    }
    
    async function confirmDelete() {
        if (deleteType === 'locker' && pendingDeleteId) {
            const locker = lockers.find(l => l.id === pendingDeleteId);
            await deleteLockerFromSupabase(pendingDeleteId, locker?.locker_number || 'Unknown');
        } else if (deleteType === 'item' && pendingDeleteId) {
            const item = inventoryItems.find(i => i.id === pendingDeleteId);
            await deleteProductFromSupabase(pendingDeleteId, item?.name || 'Unknown');
        }
        closeConfirmModal();
        pendingDeleteId = null;
        deleteType = null;
    }
    
    function closeConfirmModal() {
        document.getElementById('confirmDeleteModal').classList.remove('active');
    }
    
    async function markLockerOccupied(lockerId) {
        await updateLockerStatus(lockerId, 'rented');
        showToast('🍷 Locker marked as occupied - Wine stored safely');
    }
    
    async function markLockerAvailable(lockerId) {
        await updateLockerStatus(lockerId, 'available');
        showToast('Locker marked as available');
    }
    
    function openCreateItemModal() {
        document.getElementById('itemNameInput').value = '';
        document.getElementById('itemPriceInput').value = '';
        document.getElementById('itemCategoryInput').value = 'wine';
        document.getElementById('itemAlcoholInput').value = 'true';
        document.getElementById('createItemModalWin').classList.add('active');
    }
    
    function closeItemModal() {
        document.getElementById('createItemModalWin').classList.remove('active');
    }
    
    async function addItemToInventory() {
        const name = document.getElementById('itemNameInput').value.trim();
        const price = document.getElementById('itemPriceInput').value;
        const category = document.getElementById('itemCategoryInput').value;
        const alcohol = document.getElementById('itemAlcoholInput').value;
        
        if (!name) {
            showToast('Please enter a product name', true);
            return;
        }
        
        if (!price || parseFloat(price) <= 0) {
            showToast('Please enter a valid price', true);
            return;
        }
        
        closeItemModal();
        
        await createProductInSupabase({
            name: name,
            price: price,
            category: category,
            alcohol: alcohol
        });
    }
    
    function refreshLockersAdmin() {
        loadLockersFromSupabase();
        showToast('Refreshing lockers...');
    }
    
    // Auto-refresh every 10 seconds
    let autoRefreshInterval;
    
    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(() => {
            loadLockersFromSupabase();
            loadInventoryFromSupabase();
        }, 10000);
    }
    
    // Initialize
    async function init() {
        await Promise.all([
            loadLockersFromSupabase(),
            loadInventoryFromSupabase()
        ]);
        startAutoRefresh();
    }
    
    init();
    
    // Expose global functions
    window.openCreateLockerModal = openCreateLockerModal;
    window.closeLockerModal = closeLockerModal;
    window.createLockerAdmin = createLockerAdmin;
    window.deleteLockerPrompt = deleteLockerPrompt;
    window.deleteItemPrompt = deleteItemPrompt;
    window.confirmDelete = confirmDelete;
    window.closeConfirmModal = closeConfirmModal;
    window.markLockerOccupied = markLockerOccupied;
    window.markLockerAvailable = markLockerAvailable;
    window.openCreateItemModal = openCreateItemModal;
    window.closeItemModal = closeItemModal;
    window.addItemToInventory = addItemToInventory;
    window.refreshLockersAdmin = refreshLockersAdmin;
</script>
</body>
</html>
