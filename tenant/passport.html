<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Passport Wallet (Admin Dashboard)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: transparent;
    padding: 0;
  }
  .module-container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
  }
  .stats-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: white;
    border-radius: 24px;
    padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    border: 1px solid #edf2f7;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .stat-card::before {
    content: '';
    width: 4px;
    background: #E30613;
    border-radius: 4px;
    height: 40px;
  }
  .stat-icon { font-size: 1.8rem; color: #E30613; width: 50px; text-align: center; }
  .stat-info { flex: 1; }
  .stat-value { font-size: 1.6rem; font-weight: 800; color: #0b1a2f; line-height: 1.2; }
  .stat-label { color: #6c7a8e; font-size: 0.7rem; text-transform: uppercase; font-weight: 600; }
  .dashboard-card {
    background: white;
    border-radius: 28px;
    border: 1px solid #edf2f7;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid #eff3f8;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .card-header h3 {
    font-size: 0.9rem;
    font-weight: 700;
    color: #0b1a2f;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-body { padding: 20px; }
  .account-list, .refund-list { max-height: 400px; overflow-y: auto; }
  .account-item, .refund-item {
    background: #f8fafd;
    border-radius: 20px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    cursor: pointer;
    border: 1px solid #eef2f8;
    transition: all 0.2s;
  }
  .account-item:hover, .refund-item:hover { border-color: #E30613; background: #fff5f5; }
  .account-item.selected { border-color: #E30613; background: #fff5f5; }
  .account-id { font-weight: 700; color: #E30613; font-size: 0.9rem; }
  .account-name { font-size: 0.7rem; color: #6c7a8e; margin-top: 4px; }
  .account-balance { font-weight: 800; color: #2b7a3e; font-size: 1rem; }
  .account-status { padding: 4px 10px; border-radius: 30px; font-size: 0.65rem; font-weight: 600; }
  .status-active { background: #e6f7ec; color: #2b7a3e; }
  .status-blocked { background: #ffe6e6; color: #E30613; }
  .status-pending { background: #fff3e0; color: #e67e22; }
  .status-approved { background: #e6f7ec; color: #2b7a3e; }
  .status-rejected { background: #ffe6e6; color: #E30613; }
  .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .action-btn {
    padding: 8px 16px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 0.75rem;
    cursor: pointer;
    background: #f1f4f9;
    color: #1f2a48;
    border: 1px solid #e2e8f0;
    transition: all 0.2s;
  }
  .action-btn:active { transform: scale(0.96); }
  .action-btn.primary { background: #E30613; color: white; border: none; }
  .action-btn.success { background: #2e7d32; color: white; border: none; }
  .action-btn.danger { background: #b71c1c; color: white; border: none; }
  .action-btn.warning { background: #ff9800; color: #1a1a1a; border: none; }
  .topup-section {
    background: #f8fafd;
    border-radius: 24px;
    padding: 16px;
    margin-bottom: 20px;
    border: 1px solid #eef2f8;
  }
  .topup-title { color: #E30613; margin-bottom: 12px; font-size: 0.8rem; font-weight: 700; }
  .topup-input-group { display: flex; gap: 10px; margin-bottom: 12px; }
  .topup-input {
    flex: 1;
    padding: 12px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 50px;
    font-size: 0.85rem;
  }
  .preset-amounts { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-btn {
    padding: 6px 14px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 50px;
    cursor: pointer;
    font-size: 0.7rem;
    font-weight: 500;
  }
  .transaction-list { max-height: 280px; overflow-y: auto; }
  .transaction-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eff3f8;
  }
  .transaction-left { display: flex; align-items: center; gap: 10px; }
  .transaction-icon {
    width: 36px;
    height: 36px;
    background: rgba(227,6,19,0.08);
    border-radius: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #E30613;
  }
  .transaction-type { font-weight: 600; font-size: 0.8rem; }
  .transaction-time { font-size: 0.6rem; color: #6c7a8e; }
  .transaction-amount { font-weight: 700; font-size: 0.85rem; }
  .amount-positive { color: #2b7a3e; }
  .amount-negative { color: #E30613; }
  .search-box {
    background: #f8fafd;
    border-radius: 50px;
    padding: 4px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #e2e8f0;
  }
  .search-box input { flex: 1; background: none; border: none; padding: 8px 0; outline: none; font-size: 0.8rem; }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 20px;
    right: 20px;
    background: #1e2a3a;
    color: white;
    padding: 12px 20px;
    border-radius: 60px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 2000;
    font-size: 0.8rem;
    justify-content: center;
  }
  .toast.show { display: flex; animation: slideUp 0.3s ease; }
  .toast.success { background: #2e7d32; }
  .toast.error { background: #b71c1c; }
  @keyframes slideUp {
    from { transform: translateY(100px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .empty-state { text-align: center; padding: 30px; color: #6c7a8e; }
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 3000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: white;
    border-radius: 32px;
    padding: 24px;
    max-width: 500px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 12px; }
  .modal-header h3 { color: #E30613; font-size: 1.3rem; font-weight: 800; }
  .modal-footer { display: flex; gap: 12px; margin-top: 20px; }
  .modal-btn {
    flex: 1;
    padding: 14px;
    border-radius: 60px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .modal-btn.confirm { background: #E30613; color: white; }
  .modal-btn.cancel { background: #f1f5f9; color: #1f2a48; border: 1px solid #e2e8f0; }
  .your-account-badge {
    background: #E30613;
    color: white;
    padding: 2px 10px;
    border-radius: 50px;
    font-size: 0.6rem;
    font-weight: 600;
    margin-left: 8px;
    display: inline-block;
  }
</style>
</head>
<body>
<div class="module-container">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><div class="stat-value" id="totalAccounts">0</div><div class="stat-label">Total Accounts</div></div></div>
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-coins"></i></div><div class="stat-info"><div class="stat-value" id="totalBalance">R0</div><div class="stat-label">Total Balance</div></div></div>
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-exchange-alt"></i></div><div class="stat-info"><div class="stat-value" id="totalTransactions">0</div><div class="stat-label">Transactions</div></div></div>
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-ban"></i></div><div class="stat-info"><div class="stat-value" id="blockedAccounts">0</div><div class="stat-label">Blocked</div></div></div>
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-info"><div class="stat-value" id="pendingRefunds">0</div><div class="stat-label">Pending Refunds</div></div></div>
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-check-circle"></i></div><div class="stat-info"><div class="stat-value" id="approvedRefunds">0</div><div class="stat-label">Approved</div></div></div>
    <div class="stat-card"><div class="stat-icon"><i class="fas fa-coins"></i></div><div class="stat-info"><div class="stat-value" id="totalRefundAmount">R0</div><div class="stat-label">Refunded</div></div></div>
  </div>

  <div class="dashboard-card">
    <div class="card-header"><h3><i class="fas fa-address-card"></i> Accounts</h3><div class="search-box"><input type="text" id="searchAccount" placeholder="Search..." onkeyup="filterAccounts()"><i class="fas fa-search"></i></div></div>
    <div class="card-body"><div class="account-list" id="accountList"></div></div>
  </div>

  <div class="dashboard-card">
    <div class="card-header"><h3><i class="fas fa-bolt"></i> Actions</h3><span id="selectedAccountDisplay" style="color:#E30613; font-size:0.7rem;">None selected</span></div>
    <div class="card-body">
      <div class="action-buttons">
        <button class="action-btn primary" onclick="openTopUpModal()"><i class="fas fa-plus-circle"></i> Top Up</button>
        <button class="action-btn danger" onclick="blockSelectedAccount()"><i class="fas fa-ban"></i> Block</button>
        <button class="action-btn success" onclick="unblockSelectedAccount()"><i class="fas fa-check-circle"></i> Unblock</button>
        <button class="action-btn info" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>
      <div id="selectedAccountInfo" style="background:#f8fafd; border-radius:20px; padding:14px; margin-bottom:20px; display:none;">
        <div><span>Account:</span><span style="color:#E30613; font-weight:700;" id="selAccountId">-</span></div>
        <div><span>Holder:</span><span id="selHolderName">-</span></div>
        <div><span>Balance:</span><span style="color:#2b7a3e; font-weight:800;" id="selBalance">R0</span></div>
        <div><span>Status:</span><span id="selStatus" style="padding:2px 10px; border-radius:30px; font-size:0.65rem;">-</span></div>
      </div>
      <div class="topup-section">
        <div class="topup-title"><i class="fas fa-hand-holding-usd"></i> Quick Top Up</div>
        <div class="topup-input-group"><input type="number" id="quickTopupAmount" placeholder="Amount" class="topup-input" value="100"><button class="action-btn success" onclick="quickTopUp()" style="padding:10px 16px;">Add</button></div>
        <div class="preset-amounts"><button class="preset-btn" onclick="setQuickAmount(50)">R50</button><button class="preset-btn" onclick="setQuickAmount(100)">R100</button><button class="preset-btn" onclick="setQuickAmount(200)">R200</button><button class="preset-btn" onclick="setQuickAmount(500)">R500</button><button class="preset-btn" onclick="setQuickAmount(1000)">R1000</button></div>
      </div>
      <div><div style="color:#E30613; font-size:0.75rem; font-weight:700; margin-bottom:10px;"><i class="fas fa-history"></i> Recent Transactions</div><div id="accountTransactions" class="transaction-list"></div></div>
    </div>
  </div>

  <div class="dashboard-card">
    <div class="card-header"><h3><i class="fas fa-undo-alt"></i> Refund Requests</h3><button class="action-btn info" onclick="refreshRefunds()"><i class="fas fa-sync-alt"></i> Refresh</button></div>
    <div class="card-body"><div class="refund-list" id="refundRequestsList"></div></div>
  </div>
</div>

<div class="modal" id="topUpModal"><div class="modal-content"><div class="modal-header"><h3><i class="fas fa-plus-circle"></i> Top Up Passport</h3></div><div class="modal-body"><div><label>Account: <span id="modalAccountId" style="color:#E30613;">-</span></label></div><div class="topup-input-group"><input type="number" id="modalTopupAmount" placeholder="Enter amount" class="topup-input"></div><div class="preset-amounts"><button class="preset-btn" onclick="setModalAmount(50)">R50</button><button class="preset-btn" onclick="setModalAmount(100)">R100</button><button class="preset-btn" onclick="setModalAmount(200)">R200</button><button class="preset-btn" onclick="setModalAmount(500)">R500</button><button class="preset-btn" onclick="setModalAmount(1000)">R1000</button></div></div><div class="modal-footer"><button class="modal-btn confirm" onclick="confirmTopUp()">Confirm</button><button class="modal-btn cancel" onclick="closeModal()">Cancel</button></div></div></div>

<div id="toast" class="toast"><span id="toastIcon">✅</span><span id="toastMessage">Success!</span></div>

<script>
  // ==================== NEW SUPABASE CONFIGURATION ====================
  // REPLACE WITH YOUR ACTUAL SUPABASE PROJECT CREDENTIALS
  const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';      // <-- UPDATE
  const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';                   // <-- UPDATE
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  // ========== GLOBAL STATE (NO LOCALSTORAGE FOR WALLET DATA) ==========
  let accounts = [];              // wallets joined with profiles (id = wallet.id)
  let selectedAccountId = null;  // wallet id (uuid)
  let refundRequests = [];        // in-memory only (UI compatibility)
  let nextRefundId = 1;

  // ========== HELPER: FETCH WALLETS + PROFILES FROM SUPABASE ==========
  async function loadWalletsFromSupabase() {
    try {
      // Join wallets with profiles: wallets.user_id = profiles.id
      const { data, error } = await supabaseClient
        .from('wallets')
        .select(`
          id,
          balance,
          status,
          created_at,
          profiles:user_id (id, name, email)
        `);
      if (error) throw error;
      
      if (!data) return [];
      const formatted = data.map(w => ({
        id: w.id,
        wallet_id: w.id,
        balance: parseFloat(w.balance) || 0,
        status: w.status === 'active' ? 'Active' : (w.status === 'blocked' ? 'Blocked' : 'Active'),
        user_id: w.profiles?.id || null,
        name: w.profiles?.name || 'Unknown User',
        email: w.profiles?.email || 'no-email',
        created_at: w.created_at
      }));
      return formatted;
    } catch (err) {
      console.error('loadWallets error:', err);
      showToast('Failed to load wallets from Supabase', 'error');
      return [];
    }
  }

  // ========== FETCH TRANSACTIONS FOR A SPECIFIC WALLET ==========
  async function fetchWalletTransactions(walletId) {
    try {
      const { data, error } = await supabaseClient
        .from('wallet_transactions')
        .select('*')
        .eq('wallet_id', walletId)
        .order('created_at', { ascending: false })
        .limit(15);
      if (error) throw error;
      return data.map(tx => ({
        desc: tx.description || (tx.type === 'topup' ? 'Top Up' : 'Transaction'),
        amount: parseFloat(tx.amount),
        date: tx.created_at ? new Date(tx.created_at).toLocaleDateString() : new Date().toLocaleDateString(),
        time: tx.created_at ? new Date(tx.created_at).toLocaleTimeString() : new Date().toLocaleTimeString(),
        type: tx.type
      }));
    } catch (err) {
      console.error('fetchWalletTransactions error:', err);
      return [];
    }
  }

  // ========== ADD TRANSACTION RECORD (SUPABASE) ==========
  async function addTransactionToWallet(walletId, amount, description, performedBy = 'admin') {
    try {
      const { error } = await supabaseClient
        .from('wallet_transactions')
        .insert({
          wallet_id: walletId,
          amount: amount,
          type: amount > 0 ? 'topup' : 'adjustment',
          description: description,
          performed_by: performedBy,
          created_at: new Date().toISOString()
        });
      if (error) throw error;
    } catch (err) {
      console.error('addTransactionToWallet error:', err);
      showToast('Transaction log failed', 'error');
    }
  }

  // ========== UPDATE WALLET BALANCE & LOG (TOP-UP CORE) ==========
  async function updateWalletBalanceAndLog(walletId, amountDelta, description) {
    if (!walletId || isNaN(amountDelta) || amountDelta <= 0) return false;
    try {
      // 1. Get current wallet
      const { data: walletData, error: fetchErr } = await supabaseClient
        .from('wallets')
        .select('balance')
        .eq('id', walletId)
        .single();
      if (fetchErr) throw fetchErr;
      const currentBalance = parseFloat(walletData.balance) || 0;
      const newBalance = currentBalance + amountDelta;
      
      // 2. Update wallet balance
      const { error: updateErr } = await supabaseClient
        .from('wallets')
        .update({ balance: newBalance })
        .eq('id', walletId);
      if (updateErr) throw updateErr;
      
      // 3. Insert transaction record
      await addTransactionToWallet(walletId, amountDelta, description, 'admin');
      return true;
    } catch (err) {
      console.error('updateWalletBalanceAndLog error:', err);
      showToast(`Top up failed: ${err.message}`, 'error');
      return false;
    }
  }

  // ========== UPDATE WALLET STATUS (BLOCK/UNBLOCK) ==========
  async function setWalletStatus(walletId, newStatus) {
    try {
      const supabaseStatus = newStatus === 'Active' ? 'active' : 'blocked';
      const { error } = await supabaseClient
        .from('wallets')
        .update({ status: supabaseStatus })
        .eq('id', walletId);
      if (error) throw error;
      return true;
    } catch (err) {
      showToast(`Status update failed: ${err.message}`, 'error');
      return false;
    }
  }

  // ========== UPDATE STATS (TOTALS FROM accounts ARRAY + DB COUNTS) ==========
  async function updateStats() {
    const totalAccounts = accounts.length;
    let totalBalance = accounts.reduce((sum, acc) => sum + (acc.balance || 0), 0);
    const blockedCount = accounts.filter(a => a.status === 'Blocked').length;
    document.getElementById('totalAccounts').innerText = totalAccounts;
    document.getElementById('totalBalance').innerText = 'R' + totalBalance.toFixed(2);
    document.getElementById('blockedAccounts').innerText = blockedCount;
    
    // Get total transaction count across all wallets (from DB)
    try {
      const { count, error } = await supabaseClient
        .from('wallet_transactions')
        .select('*', { count: 'exact', head: true });
      if (!error) document.getElementById('totalTransactions').innerText = count || 0;
    } catch(e) { console.warn(e); }
    
    // Refund stats (in-memory)
    const pending = refundRequests.filter(r => r.status === 'pending').length;
    const approved = refundRequests.filter(r => r.status === 'approved').length;
    const totalAmount = refundRequests.filter(r => r.status === 'approved').reduce((s, r) => s + (r.amount || 0), 0);
    document.getElementById('pendingRefunds').innerText = pending;
    document.getElementById('approvedRefunds').innerText = approved;
    document.getElementById('totalRefundAmount').innerText = 'R' + totalAmount.toFixed(2);
  }

  // ========== RENDER ACCOUNT LIST (SEARCH + SELECTION) ==========
  function renderAccountList() {
    const searchTerm = document.getElementById('searchAccount')?.value.toLowerCase() || '';
    let filtered = accounts.filter(acc => 
      (acc.name && acc.name.toLowerCase().includes(searchTerm)) || 
      (acc.email && acc.email.toLowerCase().includes(searchTerm)) ||
      (acc.id && acc.id.toLowerCase().includes(searchTerm))
    );
    const container = document.getElementById('accountList');
    if (!filtered.length) { container.innerHTML = '<div class="empty-state">📭 No wallets found</div>'; return; }
    container.innerHTML = filtered.map(acc => `
      <div class="account-item ${selectedAccountId === acc.id ? 'selected' : ''}" onclick="selectAccount('${acc.id}')">
        <div>
          <div class="account-id">${escapeHtml(acc.name || acc.email)}</div>
          <div class="account-name">${escapeHtml(acc.email)} • Wallet ID: ${acc.id.slice(0,8)}</div>
        </div>
        <div>
          <div class="account-balance">R${(acc.balance || 0).toFixed(2)}</div>
          <div class="account-status ${acc.status === 'Active' ? 'status-active' : 'status-blocked'}">${acc.status || 'Active'}</div>
        </div>
      </div>
    `).join('');
  }

  // ========== SELECT ACCOUNT & DISPLAY DETAILS & TRANSACTIONS ==========
  async function selectAccount(walletId) {
    selectedAccountId = walletId;
    const acc = accounts.find(a => a.id === walletId);
    if (!acc) return;
    document.getElementById('selectedAccountInfo').style.display = 'block';
    document.getElementById('selectedAccountDisplay').innerHTML = `Selected: ${acc.name || acc.email}`;
    document.getElementById('selAccountId').innerText = acc.id.slice(0,12) + '...';
    document.getElementById('selHolderName').innerHTML = `${escapeHtml(acc.name)} (${escapeHtml(acc.email)})`;
    document.getElementById('selBalance').innerText = 'R' + (acc.balance || 0).toFixed(2);
    const statusEl = document.getElementById('selStatus');
    statusEl.innerText = acc.status;
    statusEl.className = (acc.status === 'Active') ? 'status-active' : 'status-blocked';
    
    // Load REAL transactions from Supabase
    const transactions = await fetchWalletTransactions(walletId);
    const txContainer = document.getElementById('accountTransactions');
    if (!transactions.length) { txContainer.innerHTML = '<div class="empty-state">No transactions yet</div>'; return; }
    txContainer.innerHTML = transactions.map(tx => `
      <div class="transaction-item">
        <div class="transaction-left">
          <div class="transaction-icon"><i class="fas ${tx.amount > 0 ? 'fa-arrow-up' : 'fa-arrow-down'}"></i></div>
          <div><div class="transaction-type">${escapeHtml(tx.desc)}</div><div class="transaction-time">${tx.date} ${tx.time}</div></div>
        </div>
        <div class="transaction-amount amount-positive">+R${Math.abs(tx.amount).toFixed(2)}</div>
      </div>
    `).join('');
    renderAccountList(); // highlight selected
  }

  // ========== BLOCK / UNBLOCK (SUPABASE) ==========
  async function blockSelectedAccount() {
    if (!selectedAccountId) { showToast('Select an account first', 'error'); return; }
    const acc = accounts.find(a => a.id === selectedAccountId);
    if (acc.status === 'Blocked') { showToast('Already blocked', 'warning'); return; }
    const success = await setWalletStatus(selectedAccountId, 'Blocked');
    if (success) {
      await addTransactionToWallet(selectedAccountId, 0, 'Account blocked by admin', 'admin');
      await refreshData();
      showToast(`Wallet ${selectedAccountId.slice(0,8)} blocked`, 'warning');
    }
  }
  
  async function unblockSelectedAccount() {
    if (!selectedAccountId) { showToast('Select an account first', 'error'); return; }
    const acc = accounts.find(a => a.id === selectedAccountId);
    if (acc.status === 'Active') { showToast('Already active', 'warning'); return; }
    const success = await setWalletStatus(selectedAccountId, 'Active');
    if (success) {
      await addTransactionToWallet(selectedAccountId, 0, 'Account unblocked by admin', 'admin');
      await refreshData();
      showToast(`Wallet ${selectedAccountId.slice(0,8)} unblocked`, 'success');
    }
  }

  // ========== TOP-UP (QUICK & MODAL) ==========
  async function quickTopUp() {
    if (!selectedAccountId) { showToast('Select an account first', 'error'); return; }
    const amount = parseFloat(document.getElementById('quickTopupAmount').value);
    if (isNaN(amount) || amount <= 0) { showToast('Valid amount required', 'error'); return; }
    const success = await updateWalletBalanceAndLog(selectedAccountId, amount, `Admin Quick Top Up: +R${amount.toFixed(2)}`);
    if (success) {
      await refreshData();
      showToast(`R${amount.toFixed(2)} added to wallet`, 'success');
    }
  }
  
  function openTopUpModal() {
    if (!selectedAccountId) { showToast('Select an account first', 'error'); return; }
    const acc = accounts.find(a => a.id === selectedAccountId);
    document.getElementById('modalAccountId').innerText = acc?.name || acc?.email || selectedAccountId;
    document.getElementById('topUpModal').classList.add('active');
  }
  
  async function confirmTopUp() {
    if (!selectedAccountId) { showToast('Select an account', 'error'); closeModal(); return; }
    const amount = parseFloat(document.getElementById('modalTopupAmount').value);
    if (isNaN(amount) || amount <= 0) { showToast('Valid amount required', 'error'); return; }
    const success = await updateWalletBalanceAndLog(selectedAccountId, amount, `Admin Top Up: +R${amount.toFixed(2)}`);
    if (success) {
      await refreshData();
      showToast(`R${amount.toFixed(2)} added`, 'success');
      closeModal();
    }
  }
  
  function closeModal() { document.getElementById('topUpModal').classList.remove('active'); }
  
  // ========== REFRESH DATA (RELOD WALLETS FROM SUPABASE) ==========
  async function refreshData() {
    const freshWallets = await loadWalletsFromSupabase();
    accounts = freshWallets;
    updateStats();
    renderAccountList();
    if (selectedAccountId && accounts.find(a => a.id === selectedAccountId)) {
      await selectAccount(selectedAccountId);
    } else if (accounts.length > 0) {
      await selectAccount(accounts[0].id);
    } else {
      selectedAccountId = null;
      document.getElementById('selectedAccountInfo').style.display = 'none';
      document.getElementById('selectedAccountDisplay').innerHTML = 'None selected';
      document.getElementById('accountTransactions').innerHTML = '<div class="empty-state">No wallets found</div>';
    }
    showToast('Dashboard synced with Supabase', 'success');
  }
  
  // ========== REFUND UI (IN-MEMORY COMPAT, NO LOCALSTORAGE) ==========
  function renderRefundRequests() {
    const container = document.getElementById('refundRequestsList');
    if (!refundRequests.length) { container.innerHTML = '<div class="empty-state">📭 No refund requests</div>'; return; }
    container.innerHTML = refundRequests.map(req => `
      <div class="refund-item">
        <div>
          <div class="account-id">#${req.id}</div>
          <div class="account-name">${escapeHtml(req.userPhone || req.userId)} • ${req.reason || 'No reason'}</div>
        </div>
        <div>
          <div class="account-balance">R${(req.amount || 0).toFixed(2)}</div>
          <div class="account-status ${req.status === 'pending' ? 'status-pending' : req.status === 'approved' ? 'status-approved' : 'status-rejected'}">${req.status?.toUpperCase() || 'PENDING'}</div>
          ${req.status === 'pending' ? `<div style="display:flex; gap:5px; margin-top:8px;"><button class="action-btn success" style="padding:4px 10px; font-size:0.6rem;" onclick="approveRefund(${req.id})">Approve</button><button class="action-btn danger" style="padding:4px 10px; font-size:0.6rem;" onclick="rejectRefund(${req.id})">Reject</button></div>` : ''}
        </div>
      </div>
    `).join('');
  }
  
  function approveRefund(refundId) {
    const refund = refundRequests.find(r => r.id === refundId);
    if (refund) { refund.status = 'approved'; refund.processedAt = new Date().toISOString(); }
    renderRefundRequests();
    updateStats();
    showToast(`Refund #${refundId} approved (demo)`, 'success');
  }
  
  function rejectRefund(refundId) {
    const refund = refundRequests.find(r => r.id === refundId);
    if (refund) { refund.status = 'rejected'; }
    renderRefundRequests();
    updateStats();
    showToast(`Refund #${refundId} rejected`, 'warning');
  }
  
  function refreshRefunds() { renderRefundRequests(); showToast('Refund list refreshed (in-memory)', 'success'); }
  
  // ========== UI HELPERS ==========
  function filterAccounts() { renderAccountList(); }
  function setQuickAmount(amt) { document.getElementById('quickTopupAmount').value = amt; }
  function setModalAmount(amt) { document.getElementById('modalTopupAmount').value = amt; }
  function showToast(message, type) {
    const toast = document.getElementById('toast');
    document.getElementById('toastIcon').innerText = type === 'success' ? '✅' : (type === 'error' ? '❌' : '⚠️');
    document.getElementById('toastMessage').innerText = message;
    toast.className = `toast ${type === 'success' ? 'success' : (type === 'error' ? 'error' : 'warning')} show`;
    setTimeout(() => toast.classList.remove('show'), 2500);
  }
  function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
  
  // ========== INITIAL LOAD (NO LOCALSTORAGE) ==========
  async function init() {
    accounts = await loadWalletsFromSupabase();
    // Sample in-memory refunds for UI demonstration (no localStorage)
    refundRequests = [];
    updateStats();
    renderAccountList();
    renderRefundRequests();
    if (accounts.length) await selectAccount(accounts[0].id);
    else showToast('No wallets found in Supabase. Please add wallets via DB.', 'warning');
  }
  
  // Expose global functions
  window.selectAccount = selectAccount;
  window.blockSelectedAccount = blockSelectedAccount;
  window.unblockSelectedAccount = unblockSelectedAccount;
  window.quickTopUp = quickTopUp;
  window.openTopUpModal = openTopUpModal;
  window.confirmTopUp = confirmTopUp;
  window.closeModal = closeModal;
  window.refreshData = refreshData;
  window.filterAccounts = filterAccounts;
  window.setQuickAmount = setQuickAmount;
  window.setModalAmount = setModalAmount;
  window.refreshRefunds = refreshRefunds;
  window.approveRefund = approveRefund;
  window.rejectRefund = rejectRefund;
  
  init();
</script>
</body>
</html>
