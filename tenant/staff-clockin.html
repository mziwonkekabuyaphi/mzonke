<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Staff Clock‑in · Rands Cape Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:opsz,wght@14..32,400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
    }
</script>
<style>
    :root{
        /* ---- Design tokens : "The Vault" ---- */
        --void: #0a0a0d;
        --void-2: #121116;
        --panel: #17151b;
        --panel-raised: #201d25;
        --hairline: rgba(244,241,234,0.08);
        --hairline-strong: rgba(244,241,234,0.14);
        --rands-red: #e30613;
        --rands-red-deep: #8c0a17;
        --wine: #3d0410;
        --champagne: #c9a24b;
        --champagne-dim: rgba(201,162,75,0.16);
        --bone: #f4f1ea;
        --bone-dim: #bab6ac;
        --smoke: #83808a;
        --font-display: 'Fraunces', serif;
        --font-body: 'Inter', sans-serif;
        --font-mono: 'IBM Plex Mono', monospace;
    }
    *{ margin:0; padding:0; box-sizing:border-box; }
    html{ color-scheme: dark; }
    body{
        font-family: var(--font-body);
        background: var(--void);
        color: var(--bone);
        min-height: 100vh;
        padding: 28px 20px 60px;
        position: relative;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }
    /* ambient club-spotlight backdrop */
    body::before{
        content:"";
        position: fixed;
        inset: -20% -20% auto -20%;
        height: 70vh;
        background:
            radial-gradient(60% 55% at 50% 0%, rgba(227,6,19,0.16), transparent 70%),
            radial-gradient(35% 40% at 15% 10%, rgba(201,162,75,0.06), transparent 70%);
        pointer-events: none;
        z-index: 0;
    }
    body::after{
        content:"";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(rgba(244,241,234,0.035) 0.6px, transparent 0.6px);
        background-size: 3px 3px;
        opacity: 0.5;
        pointer-events: none;
        z-index: 0;
    }
    .stage{
        max-width: 440px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
    }

    /* ---------- Header / crest ---------- */
    .crest-wrap{
        text-align: center;
        padding: 6px 0 30px;
    }
    .live-clock{
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        color: var(--smoke);
        margin-bottom: 20px;
    }
    .live-clock span{ color: var(--champagne); }
    .logo-orbit{
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 92px;
        height: 92px;
        margin-bottom: 18px;
    }
    .brand-icon{
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        z-index: 2;
        background:
            radial-gradient(circle at 32% 28%, #ff2635, var(--rands-red) 45%, var(--rands-red-deep) 100%);
        box-shadow:
            0 0 0 1px rgba(244,241,234,0.12),
            0 12px 30px -6px rgba(227,6,19,0.55),
            inset 0 1px 1px rgba(255,255,255,0.35);
        font-size: 1.6rem;
        color: var(--bone);
    }
    .brand-icon img{ width:100%; height:100%; object-fit:cover; }
    .pulse-ring{
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(227,6,19,0.55);
        pointer-events: none;
        z-index: 1;
        animation: pulseRing 2.4s ease-out infinite;
    }
    .pulse-ring.delay{ animation-delay: 1.2s; }
    @keyframes pulseRing{
        0%   { transform: scale(0.82); opacity: 0.9; }
        75%  { transform: scale(1.55); opacity: 0; }
        100% { transform: scale(1.55); opacity: 0; }
    }
    .wordmark{
        font-family: var(--font-display);
        font-optical-sizing: auto;
        font-weight: 600;
        font-size: 2.15rem;
        letter-spacing: 0.03em;
        line-height: 1;
        color: var(--bone);
    }
    .wordmark em{
        font-style: normal;
        color: var(--rands-red);
    }
    .locale-line{
        margin-top: 8px;
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--smoke);
    }
    .locale-line .dot{ color: var(--champagne); margin: 0 8px; }

    /* ---------- Vault card ---------- */
    .vault-card{
        background: linear-gradient(165deg, var(--panel) 0%, var(--void-2) 100%);
        border: 1px solid var(--hairline);
        border-radius: 28px;
        padding: 30px 26px 28px;
        position: relative;
        box-shadow:
            0 40px 60px -30px rgba(0,0,0,0.7),
            inset 0 1px 0 rgba(244,241,234,0.05);
        margin-bottom: 22px;
    }
    .vault-card::before{
        /* brushed sheen */
        content:"";
        position:absolute; inset:0;
        border-radius: inherit;
        background: linear-gradient(115deg, rgba(244,241,234,0.05) 0%, transparent 28%);
        pointer-events:none;
    }
    .eyebrow-row{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--champagne);
        margin-bottom: 20px;
    }
    .eyebrow-row i{ font-size: 0.75rem; }

    .pin-dots{
        display:flex;
        justify-content:center;
        gap: 14px;
        margin-bottom: 18px;
    }
    .pin-dot{
        width: 12px; height: 12px;
        border-radius: 50%;
        border: 1.5px solid var(--hairline-strong);
        background: transparent;
        transition: all .18s ease;
    }
    .pin-dot.filled{
        background: var(--rands-red);
        border-color: var(--rands-red);
        box-shadow: 0 0 10px 1px rgba(227,6,19,0.65);
    }

    .pin-input{
        width: 100%;
        padding: 14px 16px;
        font-family: var(--font-mono);
        font-size: 1.4rem;
        letter-spacing: 0.7em;
        text-indent: 0.7em;
        text-align: center;
        color: var(--bone);
        background: var(--void);
        border: 1px solid var(--hairline-strong);
        border-radius: 14px;
        outline: none;
        transition: border-color .15s ease, box-shadow .15s ease;
    }
    .pin-input::placeholder{ color: var(--smoke); letter-spacing: 0.4em; }
    .pin-input:focus{
        border-color: var(--rands-red);
        box-shadow: 0 0 0 4px rgba(227,6,19,0.16);
    }

    .numeric-keypad{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 22px 0 20px;
    }
    .key{
        position: relative;
        height: 60px;
        border-radius: 16px;
        border: 1px solid var(--hairline);
        background: linear-gradient(160deg, var(--panel-raised), var(--panel));
        color: var(--bone);
        font-family: var(--font-mono);
        font-size: 1.25rem;
        font-weight: 500;
        cursor: pointer;
        transition: transform .08s ease, border-color .15s ease, background .15s ease;
    }
    .key:hover{ border-color: var(--hairline-strong); }
    .key:active{
        transform: scale(0.93);
        background: linear-gradient(160deg, var(--rands-red-deep), var(--wine));
        border-color: var(--rands-red);
    }
    .key:focus-visible{ outline: 2px solid var(--champagne); outline-offset: 2px; }
    .key-clear, .key-del{
        font-size: 0.95rem;
        color: var(--smoke);
    }
    .key-del{ color: var(--rands-red); }

    .btn{
        width: 100%;
        padding: 16px;
        border-radius: 16px;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 0.01em;
        border: none;
        cursor: pointer;
        transition: transform .1s ease, box-shadow .2s ease, opacity .2s ease;
    }
    .btn i{ margin-right: 8px; }
    .btn-primary{
        background: linear-gradient(135deg, #ff2635, var(--rands-red) 45%, var(--rands-red-deep));
        color: var(--bone);
        box-shadow: 0 14px 26px -10px rgba(227,6,19,0.65);
    }
    .btn-primary:active{ transform: scale(0.98); }
    .btn-primary:disabled{ opacity: 0.65; cursor: not-allowed; transform:none; }
    .btn-outline{
        background: transparent;
        border: 1px solid var(--hairline-strong);
        color: var(--bone-dim);
        margin-top: 10px;
    }
    .btn-outline:hover{ border-color: var(--champagne); color: var(--champagne); }

    /* ---------- Roster panel ---------- */
    .roster-panel{
        background: linear-gradient(165deg, var(--panel) 0%, var(--void-2) 100%);
        border: 1px solid var(--hairline);
        border-radius: 24px;
        padding: 22px 22px 8px;
    }
    .roster-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom: 14px;
    }
    .roster-title{
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--bone-dim);
        display:flex; align-items:center; gap:8px;
    }
    .roster-title i{ color: var(--champagne); }
    .roster-count{
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--void);
        background: var(--champagne);
        border-radius: 999px;
        padding: 2px 9px;
        font-weight: 600;
    }
    .shift-item{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding: 14px 2px;
        border-bottom: 1px solid var(--hairline);
        gap: 10px;
    }
    .shift-item:last-child{ border-bottom: none; }
    .staff-id{
        display:flex; align-items:center; gap:10px;
        min-width:0;
    }
    .status-dot{
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--champagne);
        box-shadow: 0 0 8px 1px rgba(201,162,75,0.75);
        flex-shrink: 0;
        animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe{ 0%,100%{opacity:0.55;} 50%{opacity:1;} }
    .staff-name{
        font-weight: 600;
        font-size: 0.92rem;
        color: var(--bone);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .staff-since{
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--smoke);
    }
    .staff-elapsed{
        font-family: var(--font-mono);
        font-size: 0.92rem;
        color: var(--champagne);
        letter-spacing: 0.03em;
        flex-shrink: 0;
    }
    .roster-empty, .roster-error, .roster-loading{
        padding: 30px 10px;
        text-align:center;
        color: var(--smoke);
        font-size: 0.85rem;
    }
    .roster-error{ color: var(--rands-red); }

    footer.mark{
        text-align:center;
        margin-top: 26px;
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--smoke);
        opacity: 0.7;
    }

    /* ---------- Toast ---------- */
    .toast{
        position: fixed;
        bottom: 26px;
        left: 20px;
        right: 20px;
        max-width: 400px;
        margin: 0 auto;
        background: var(--panel-raised);
        border: 1px solid var(--hairline-strong);
        color: var(--bone);
        padding: 14px 18px;
        border-radius: 16px;
        text-align: center;
        z-index: 1000;
        display: none;
        font-size: 0.85rem;
        font-weight: 500;
        box-shadow: 0 20px 40px -14px rgba(0,0,0,0.8);
    }
    .toast i{ margin-right: 8px; }

    @media (max-width: 380px){
        .wordmark{ font-size: 1.8rem; }
        .pin-input{ font-size: 1.15rem; letter-spacing: 0.5em; text-indent: 0.5em; }
        .key{ height: 54px; font-size: 1.1rem; }
    }
    @media (prefers-reduced-motion: reduce){
        .pulse-ring, .status-dot{ animation: none; }
    }
</style>
</head>
<body>
<div class="stage">

    <div class="crest-wrap">
        <div class="live-clock" id="liveClock">— <span>·</span> —</div>
        <div class="logo-orbit">
            <div class="brand-icon">
                <img src="../assets/images/rands-logo.png" alt="Rands Cape Town" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-crown\'></i>';">
            </div>
            <div class="pulse-ring"></div>
            <div class="pulse-ring delay"></div>
        </div>
        <div class="wordmark">R<em>a</em>nds</div>
        <div class="locale-line">Cape Town <span class="dot">·</span> Staff Terminal</div>
    </div>

    <div class="vault-card">
        <div class="eyebrow-row"><i class="fas fa-fingerprint"></i> Enter your code</div>

        <div class="pin-dots" id="pinDots">
            <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
            <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
        </div>

        <input type="password" id="pinInput" class="pin-input" maxlength="6" inputmode="numeric"
               placeholder="••••••" autocomplete="off" autofocus
               aria-label="Staff PIN">

        <div class="numeric-keypad" id="keypad">
            <button class="key" data-digit="1">1</button>
            <button class="key" data-digit="2">2</button>
            <button class="key" data-digit="3">3</button>
            <button class="key" data-digit="4">4</button>
            <button class="key" data-digit="5">5</button>
            <button class="key" data-digit="6">6</button>
            <button class="key" data-digit="7">7</button>
            <button class="key" data-digit="8">8</button>
            <button class="key" data-digit="9">9</button>
            <button class="key key-clear" data-action="clear" aria-label="Clear"><i class="fas fa-rotate-left"></i></button>
            <button class="key" data-digit="0">0</button>
            <button class="key key-del" data-action="delete" aria-label="Delete"><i class="fas fa-delete-left"></i></button>
        </div>

        <button class="btn btn-primary" id="clockBtn">Clock In / Itshayile</button>
        <button class="btn btn-outline" id="refreshBtn"><i class="fas fa-rotate"></i> Refresh to see shifts</button>
    </div>

    <div class="roster-panel">
        <div class="roster-head">
            <div class="roster-title"><i class="fas fa-shield-halved"></i> On shift now</div>
            <div class="roster-count" id="rosterCount">0</div>
        </div>
        <div id="activeShiftsList">
            <div class="roster-loading">Sijonga Abasemsebenzini…</div>
        </div>
    </div>

    <footer class="mark">Rands Cape Town &middot; Attendance Vault</footer>
</div>

<div id="toast" class="toast"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    const pinInput = document.getElementById('pinInput');
    const clockBtn = document.getElementById('clockBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const activeShiftsDiv = document.getElementById('activeShiftsList');
    const rosterCount = document.getElementById('rosterCount');

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerHTML = `<i class="fas ${isError ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i>${msg}`;
        toast.style.background = isError ? 'linear-gradient(135deg,#8c0a17,#3d0410)' : 'linear-gradient(135deg,#201d25,#17151b)';
        toast.style.borderColor = isError ? '#e30613' : '#c9a24b';
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function formatDuration(ms) {
        const minutes = Math.floor(ms / (1000 * 60));
        if (minutes < 60) return `${minutes} minute${minutes !== 1 ? 's' : ''}`;
        const hours = (minutes / 60).toFixed(1);
        return `${hours} hours`;
    }

    async function loadActiveShifts() {
        try {
            const { data: shifts, error } = await supabase
                .from('staff_shifts')
                .select('*, staff_id')
                .eq('status', 'active')
                .order('login_time', { ascending: false });
            if (error) throw error;

            rosterCount.textContent = shifts.length;

            if (!shifts.length) {
                activeShiftsDiv.innerHTML = '<div class="roster-empty">No one on shift</div>';
                return;
            }

            const staffIds = [...new Set(shifts.map(s => s.staff_id))];
            const { data: staffProfiles } = await supabase
                .rpc('get_staff_names', { p_ids: staffIds });

            const staffMap = new Map();
            staffProfiles?.forEach(p => staffMap.set(p.id, `${p.name} ${p.surname}`));

            let html = '';
            for (const shift of shifts) {
                const staffName = staffMap.get(shift.staff_id) || 'Unknown';
                const loginUTC = new Date(shift.login_time + 'Z');
                const now = new Date();
                const durationMs = now - loginUTC;
                const durationStr = formatDuration(durationMs);
                const loginLocal = loginUTC.toLocaleTimeString();
                html += `
                    <div class="shift-item" data-login="${shift.login_time}">
                        <div class="staff-id">
                            <span class="status-dot"></span>
                            <div>
                                <div class="staff-name">${staffName}</div>
                                <div class="staff-since">Since ${loginLocal}</div>
                            </div>
                        </div>
                        <div class="staff-elapsed">${durationStr}</div>
                    </div>
                `;
            }
            activeShiftsDiv.innerHTML = html;
        } catch (err) {
            console.error(err);
            activeShiftsDiv.innerHTML = '<div class="roster-error">Error loading shifts</div>';
        }
    }

    async function validateStaffByPin(pin) {
        const { data, error } = await supabase
            .rpc('validate_staff_pin', { p_pin: pin });
        if (error) throw error;
        return data && data.length ? data[0] : null;
    }

    async function getActiveShift(staffId) {
        const { data, error } = await supabase
            .from('staff_shifts')
            .select('*')
            .eq('staff_id', staffId)
            .eq('status', 'active')
            .maybeSingle();
        if (error) throw error;
        return data;
    }

    async function clockIn(staff) {
        const { error } = await supabase
            .from('staff_shifts')
            .insert({
                staff_id: staff.id,
                login_time: new Date().toISOString(),
                status: 'active',
                login_method: 'pin_kiosk',
                kiosk_id: 'web-terminal'
            });
        if (error) throw error;
        await supabase.from('staff_activity_logs').insert({
            staff_id: staff.id,
            module: 'Attendance',
            action: 'Clocked in via web terminal',
            created_at: new Date().toISOString()
        });
        showToast(`${staff.name} ${staff.surname} – Clocked IN at ${new Date().toLocaleTimeString()}`);
        await loadActiveShifts();
    }

    async function clockOut(shift, staff) {
        const now = new Date();
        const loginUTC = new Date(shift.login_time + 'Z');
        const diffMs = now - loginUTC;
        const hours = diffMs / (1000 * 60 * 60);
        const { error } = await supabase
            .from('staff_shifts')
            .update({
                logout_time: now.toISOString(),
                status: 'completed',
                hours_worked: hours
            })
            .eq('id', shift.id);
        if (error) throw error;

        const durationStr = formatDuration(diffMs);
        await supabase.from('staff_activity_logs').insert({
            staff_id: staff.id,
            module: 'Attendance',
            action: `Clocked out after ${durationStr}`,
            created_at: new Date().toISOString()
        });
        showToast(`${staff.name} ${staff.surname} – Clocked OUT (${durationStr})`);
        await loadActiveShifts();
    }

    async function handleClockAction() {
        const pin = pinInput.value.trim();
        if (!pin || !/^\d{4,6}$/.test(pin)) {
            showToast('Please enter a valid 4‑6 digit PIN', true);
            return;
        }

        clockBtn.disabled = true;
        clockBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

        try {
            const staff = await validateStaffByPin(pin);
            if (!staff) {
                showToast('PIN not recognised. Please check with manager.', true);
                return;
            }

            const active = await getActiveShift(staff.id);
            if (active) {
                await clockOut(active, staff);
                pinInput.value = '';
            } else {
                await clockIn(staff);
                pinInput.value = '';
            }
        } catch (err) {
            console.error(err);
            showToast('Error: ' + err.message, true);
        } finally {
            clockBtn.disabled = false;
            clockBtn.innerHTML = 'Clock In / Out';
            pinInput.dispatchEvent(new Event('input'));
            pinInput.focus();
        }
    }

    function setupKeypad() {
        const keypad = document.getElementById('keypad');
        keypad.addEventListener('click', (e) => {
            const btn = e.target.closest('.key');
            if (!btn) return;
            const digit = btn.dataset.digit;
            const action = btn.dataset.action;
            if (digit) {
                if (pinInput.value.length < 6) {
                    pinInput.value += digit;
                }
            } else if (action === 'delete') {
                pinInput.value = pinInput.value.slice(0, -1);
            } else if (action === 'clear') {
                pinInput.value = '';
            }
            pinInput.dispatchEvent(new Event('input'));
            pinInput.focus();
        });
    }

    pinInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleClockAction();
        }
    });

    clockBtn.addEventListener('click', handleClockAction);
    refreshBtn.addEventListener('click', () => loadActiveShifts());

    setupKeypad();
    loadActiveShifts();
    pinInput.focus();
    setInterval(loadActiveShifts, 15000);

    /* ---- Purely decorative additions below : do not touch clock-in logic ---- */

    // Tumbler-style PIN dot indicator, mirrors pinInput length
    const pinDots = document.querySelectorAll('.pin-dot');
    pinInput.addEventListener('input', () => {
        const len = pinInput.value.length;
        pinDots.forEach((d, i) => d.classList.toggle('filled', i < len));
    });

    // Live header clock
    const liveClockEl = document.getElementById('liveClock');
    function tickClock() {
        const now = new Date();
        const time = now.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const date = now.toLocaleDateString('en-ZA', { weekday: 'short', day: '2-digit', month: 'short' });
        liveClockEl.innerHTML = `${date} <span>·</span> ${time}`;
    }
    tickClock();
    setInterval(tickClock, 1000);

    // Live-ticking elapsed time on roster rows between the 15s data refreshes
    setInterval(() => {
        document.querySelectorAll('.shift-item[data-login]').forEach(row => {
            const loginUTC = new Date(row.dataset.login + 'Z');
            const el = row.querySelector('.staff-elapsed');
            if (el) el.textContent = formatDuration(new Date() - loginUTC);
        });
    }, 1000);
</script>
</body>
</html>
