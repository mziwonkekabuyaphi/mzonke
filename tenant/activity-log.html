<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Activity Log | Rands Event Pass</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/shared.css">
  <link rel="stylesheet" href="assets/css/activity-log.css">
</head>
<body>

<div class="bg-pattern"></div>
<div class="container">

  <!-- ── Page header ── -->

  <div class="dashboard-header">
    <div class="header-badge">
      <i class="fas fa-history"></i>
      <span>Activity Log</span>
    </div>
  </div>

  <!-- ── Activity stats ── -->

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-user-clock"></i></div>
      <div class="stat-info">
        <div class="stat-value" id="totalActions">0</div>
        <div class="stat-label">Total Actions</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-calendar-day"></i></div>
      <div class="stat-info">
        <div class="stat-value" id="todayActions">0</div>
        <div class="stat-label">Today</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon"><i class="fas fa-shield-alt"></i></div>
      <div class="stat-info">
        <div class="stat-value" id="adminActions">0</div>
        <div class="stat-label">Admin Actions</div>
      </div>
    </div>
  </div>

  <!-- ── Staff activity log ── -->

  <div class="dashboard-card">
    <div class="card-header">
      <h3><i class="fas fa-history"></i> Staff Activity Log</h3>
      <button class="action-btn info" onclick="refreshActivityLog()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
    <div class="card-body">
      <div class="activity-list" id="activityLogList"></div>
    </div>
  </div>

  <!-- ── Global wallet activity ── -->

  <div class="dashboard-card full-width" style="margin-top:20px;">
    <div class="card-header">
      <h3><i class="fas fa-globe"></i> Recent Wallet Activity</h3>
    </div>
    <div class="card-body">
      <div class="transaction-list" id="globalActivity"></div>
    </div>
  </div>

  <div class="dashboard-footer"><p>Activity Log • Rands Event Pass</p></div>

</div><!-- /.container -->

<!-- ── Toast ── -->

<div class="toast" id="toast">
  <span id="toastIcon">✅</span>
  <span id="toastMessage">Success!</span>
</div>

<!-- ── Bottom navigation ── -->

<nav class="bottom-nav">
  <a href="passport.html" class="nav-item">
    <i class="fas fa-passport"></i>
    <span>Passport</span>
  </a>
  <a href="tickets.html" class="nav-item">
    <i class="fas fa-ticket-alt"></i>
    <span>Tickets</span>
  </a>
  <a href="activity-log.html" class="nav-item active">
    <i class="fas fa-history"></i>
    <span>Activity Log</span>
  </a>
</nav>

<!-- Supabase CDN is not needed on this page but included for consistency if needed in future -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="module" src="assets/js/activity-log.js"></script>

</body>
</html>
