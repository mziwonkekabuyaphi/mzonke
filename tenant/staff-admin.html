<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Staff Management | Rands Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rands-red: #dc2626;
            --rands-red-dark: #b91c1c;
            --rands-red-light: #fee2e2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9fafb;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--rands-red);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--rands-red-dark);
        }

        /* Animation */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }

        .modal-enter {
            animation: modalFadeIn 0.3s ease-out;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--rands-red);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Focus Styles */
        input:focus, select:focus, textarea:focus {
            outline: none;
            ring: 2px solid var(--rands-red);
            border-color: var(--rands-red);
        }

        /* Responsive Table */
        @media (max-width: 768px) {
            .responsive-table {
                display: block;
                width: 100%;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Main Container -->
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-lg hidden md:block">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-users text-red-600 text-2xl"></i>
                    <span class="text-xl font-bold text-gray-800">Staff Manager</span>
                </div>
            </div>
            <nav class="p-4">
                <a href="#" class="flex items-center space-x-3 px-4 py-3 bg-red-50 text-red-600 rounded-lg">
                    <i class="fas fa-user-friends"></i>
                    <span>Staff Management</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <!-- Header -->
            <div class="bg-white shadow-sm sticky top-0 z-10">
                <div class="px-6 py-4">
                    <div class="flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-800">Staff Management</h1>
                            <p class="text-sm text-gray-500 mt-1">Manage your workforce efficiently</p>
                        </div>
                        <button onclick="openStaffForm()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg transition duration-200 flex items-center space-x-2">
                            <i class="fas fa-plus"></i>
                            <span>Add Staff</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Dashboard Stats -->
            <div class="p-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 mb-6" id="stats-container">
                    <!-- Stats will be loaded here -->
                    <div class="bg-white rounded-lg shadow-sm p-4">
                        <div class="spinner mx-auto"></div>
                    </div>
                </div>

                <!-- Filters and Search -->
                <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                    <div class="flex flex-wrap gap-4 items-center justify-between">
                        <div class="flex-1 min-w-[200px]">
                            <div class="relative">
                                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="search-staff" placeholder="Search by name, email, or phone..." 
                                       class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500">
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-3">
                            <select id="filter-department" class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500">
                                <option value="">All Departments</option>
                                <option value="manager">Manager</option>
                                <option value="cashier">Cashier</option>
                                <option value="boxoffice">Box Office</option>
                                <option value="security">Security</option>
                                <option value="shisha">Shisha</option>
                                <option value="kitchen">Kitchen</option>
                                <option value="locker">Locker</option>
                                <option value="vvip">VVIP</option>
                                <option value="collections">Collections</option>
                                <option value="operations">Operations</option>
                            </select>
                            <select id="filter-status" class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500">
                                <option value="">All Status</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                            <button onclick="exportStaffList()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition flex items-center space-x-2">
                                <i class="fas fa-download"></i>
                                <span>Export</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Staff List Table -->
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Staff</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Department</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Hourly Rate</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Seen</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Modules</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="staff-table-body" class="bg-white divide-y divide-gray-200">
                                <tr>
                                    <td colspan="7" class="px-6 py-12 text-center">
                                        <div class="spinner mx-auto"></div>
                                        <p class="mt-2 text-gray-500">Loading staff data...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination -->
                    <div class="px-6 py-4 border-t border-gray-200" id="pagination-container"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Staff Form Modal -->
    <div id="staff-form-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto modal-enter">
                <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold" id="modal-title">Add New Staff</h2>
                    <button onclick="closeStaffForm()" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div id="staff-form-container"></div>
            </div>
        </div>
    </div>

    <!-- Staff Profile Modal -->
    <div id="staff-profile-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] overflow-y-auto modal-enter">
                <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold">Staff Profile</h2>
                    <button onclick="closeStaffProfile()" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div id="staff-profile-container"></div>
            </div>
        </div>
    </div>

    <script>
        // Supabase Configuration - REPLACE WITH YOUR ACTUAL CREDENTIALS
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        // Initialize Supabase client
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Global State
        let currentUser = null;
        let currentPage = 1;
        let pageSize = 10;
        let totalStaff = 0;
        let currentFilters = {
            search: '',
            department: '',
            status: ''
        };
        
        // Staff Departments (account_type)
        const DEPARTMENTS = {
            manager: 'Manager',
            cashier: 'Cashier',
            boxoffice: 'Box Office',
            security: 'Security',
            shisha: 'Shisha',
            kitchen: 'Kitchen',
            locker: 'Locker',
            vvip: 'VVIP',
            collections: 'Collections',
            operations: 'Operations'
        };
        
        // Module Definitions
        const MODULES = [
            { id: 'dashboard', name: 'Dashboard', icon: 'fa-tachometer-alt' },
            { id: 'orders_sales', name: 'Orders & Sales', icon: 'fa-shopping-cart' },
            { id: 'wallet', name: 'Wallet', icon: 'fa-wallet' },
            { id: 'events', name: 'Events', icon: 'fa-calendar-alt' },
            { id: 'box_office', name: 'Box Office', icon: 'fa-ticket-alt' },
            { id: 'check_ins', name: 'Check-ins', icon: 'fa-check-circle' },
            { id: 'shisha', name: 'Shisha', icon: 'fa-smoking' },
            { id: 'lockers', name: 'Lockers', icon: 'fa-locker' },
            { id: 'vvip', name: 'VVIP', icon: 'fa-crown' },
            { id: 'collection_counter', name: 'Collection Counter', icon: 'fa-calculator' },
            { id: 'reports', name: 'Reports', icon: 'fa-chart-line' },
            { id: 'payroll', name: 'Payroll', icon: 'fa-money-bill-wave' },
            { id: 'settings', name: 'Settings', icon: 'fa-cog' }
        ];
        
        // Initialize Staff Management
        async function initStaffManagement() {
            try {
                // Get current user session
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError) throw sessionError;
                
                if (!session) {
                    window.location.href = '/login.html';
                    return;
                }
                
                currentUser = session.user;
                
                // Verify admin access
                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('role')
                    .eq('id', currentUser.id)
                    .single();
                
                if (profileError || !['super_admin', 'admin'].includes(profile?.role)) {
                    alert('Access denied. Admin privileges required.');
                    window.location.href = '/dashboard.html';
                    return;
                }
                
                // Load initial data
                await loadDashboardStats();
                await loadStaffList();
                await loadModules();
                
                // Setup event listeners
                setupEventListeners();
                
            } catch (error) {
                console.error('Initialization error:', error);
                showNotification('Failed to initialize staff management', 'error');
            }
        }
        
        // Load Dashboard Statistics
        async function loadDashboardStats() {
            try {
                // Get total staff count
                const { count: totalStaffCount, error: totalError } = await supabaseClient
                    .from('profiles')
                    .select('*', { count: 'exact', head: true })
                    .eq('role', 'staff');
                
                // Get active staff
                const { count: activeStaffCount, error: activeError } = await supabaseClient
                    .from('profiles')
                    .select('*', { count: 'exact', head: true })
                    .eq('role', 'staff')
                    .eq('status', 'active');
                
                // Get currently clocked in staff
                const { count: clockedInCount, error: clockedError } = await supabaseClient
                    .from('staff_shifts')
                    .select('*', { count: 'exact', head: true })
                    .is('clock_out', null);
                
                // Get unique departments
                const { data: departments, error: deptError } = await supabaseClient
                    .from('profiles')
                    .select('account_type')
                    .eq('role', 'staff')
                    .not('account_type', 'is', null);
                
                const uniqueDepartments = new Set(departments?.map(d => d.account_type) || []);
                
                // Get monthly payroll sum
                const startOfMonth = new Date();
                startOfMonth.setDate(1);
                startOfMonth.setHours(0, 0, 0, 0);
                
                const { data: payrollData, error: payrollError } = await supabaseClient
                    .from('staff_payroll')
                    .select('final_pay')
                    .gte('created_at', startOfMonth.toISOString());
                
                const monthlyPayroll = payrollData?.reduce((sum, p) => sum + (p.final_pay || 0), 0) || 0;
                
                // Update UI
                document.getElementById('stats-container').innerHTML = `
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-red-600 hover:shadow-md transition">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-500 text-sm">Total Staff</p>
                                <p class="text-2xl font-bold text-gray-800">${totalStaffCount || 0}</p>
                            </div>
                            <i class="fas fa-users text-3xl text-red-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-green-600 hover:shadow-md transition">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-500 text-sm">Active Staff</p>
                                <p class="text-2xl font-bold text-gray-800">${activeStaffCount || 0}</p>
                            </div>
                            <i class="fas fa-user-check text-3xl text-green-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-blue-600 hover:shadow-md transition">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-500 text-sm">Currently Clocked In</p>
                                <p class="text-2xl font-bold text-gray-800">${clockedInCount || 0}</p>
                            </div>
                            <i class="fas fa-clock text-3xl text-blue-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-yellow-600 hover:shadow-md transition">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-500 text-sm">Total Departments</p>
                                <p class="text-2xl font-bold text-gray-800">${uniqueDepartments.size}</p>
                            </div>
                            <i class="fas fa-building text-3xl text-yellow-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-purple-600 hover:shadow-md transition">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-500 text-sm">Monthly Payroll</p>
                                <p class="text-2xl font-bold text-gray-800">R${monthlyPayroll.toLocaleString()}</p>
                            </div>
                            <i class="fas fa-money-bill-wave text-3xl text-purple-600 opacity-50"></i>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow-sm p-4 border-l-4 border-indigo-600 hover:shadow-md transition">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-500 text-sm">On Shift</p>
                                <p class="text-2xl font-bold text-gray-800">${clockedInCount || 0}</p>
                            </div>
                            <i class="fas fa-briefcase text-3xl text-indigo-600 opacity-50"></i>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error loading dashboard stats:', error);
                document.getElementById('stats-container').innerHTML = '<div class="col-span-full text-center text-red-600">Error loading statistics</div>';
            }
        }
        
        // Load Staff List with Filters and Pagination
        async function loadStaffList() {
            try {
                let query = supabaseClient
                    .from('profiles')
                    .select('*', { count: 'exact' })
                    .eq('role', 'staff');
                
                // Apply filters
                if (currentFilters.search) {
                    query = query.or(`first_name.ilike.%${currentFilters.search}%,last_name.ilike.%${currentFilters.search}%,email.ilike.%${currentFilters.search}%,phone.ilike.%${currentFilters.search}%`);
                }
                
                if (currentFilters.department) {
                    query = query.eq('account_type', currentFilters.department);
                }
                
                if (currentFilters.status) {
                    query = query.eq('status', currentFilters.status);
                }
                
                // Apply pagination
                const from = (currentPage - 1) * pageSize;
                const to = from + pageSize - 1;
                
                const { data: staff, error, count } = await query
                    .order('created_at', { ascending: false })
                    .range(from, to);
                
                if (error) throw error;
                
                totalStaff = count || 0;
                
                // Get module assignments for each staff member
                const staffWithModules = await Promise.all(staff.map(async (member) => {
                    const { data: modules, error: modError } = await supabaseClient
                        .from('staff_modules')
                        .select('module_id')
                        .eq('staff_id', member.id);
                    
                    return {
                        ...member,
                        assigned_modules: modules || [],
                        module_count: modules?.length || 0
                    };
                }));
                
                renderStaffTable(staffWithModules);
                renderPagination();
                
            } catch (error) {
                console.error('Error loading staff list:', error);
                document.getElementById('staff-table-body').innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-12 text-center text-red-600">
                            <i class="fas fa-exclamation-circle text-4xl mb-2 block"></i>
                            <p>Failed to load staff list</p>
                            <button onclick="loadStaffList()" class="mt-2 text-red-600 underline">Retry</button>
                        </td>
                    </tr>
                `;
            }
        }
        
        // Render Staff Table
        function renderStaffTable(staff) {
            const tbody = document.getElementById('staff-table-body');
            
            if (!staff || staff.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="px-6 py-12 text-center text-gray-500">
                            <i class="fas fa-users text-4xl mb-2 block"></i>
                            <p>No staff members found</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = staff.map(member => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4">
                        <div class="flex items-center">
                            <div class="flex-shrink-0 h-10 w-10 bg-red-100 rounded-full flex items-center justify-center">
                                <span class="text-red-600 font-semibold">${getInitials(member.first_name, member.last_name)}</span>
                            </div>
                            <div class="ml-4">
                                <div class="text-sm font-medium text-gray-900">${escapeHtml(member.first_name || '')} ${escapeHtml(member.last_name || '')}</div>
                                <div class="text-sm text-gray-500">${escapeHtml(member.email || '')}</div>
                                <div class="text-xs text-gray-400">${escapeHtml(member.phone || 'No phone')}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                            ${DEPARTMENTS[member.account_type] || member.account_type || 'N/A'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">
                        R${(member.hourly_rate || 0).toLocaleString()}
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${member.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                            ${member.status === 'active' ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">
                        ${member.last_seen ? formatDate(member.last_seen) : 'Never'}
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800">
                            ${member.module_count} Modules
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm font-medium">
                        <button onclick="viewStaffProfile('${member.id}')" class="text-blue-600 hover:text-blue-900 mr-3" title="View Profile">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button onclick="editStaff('${member.id}')" class="text-green-600 hover:text-green-900 mr-3" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="toggleStaffStatus('${member.id}', '${member.status}')" class="text-yellow-600 hover:text-yellow-900" title="${member.status === 'active' ? 'Deactivate' : 'Activate'}">
                            <i class="fas ${member.status === 'active' ? 'fa-ban' : 'fa-check-circle'}"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
        // Render Pagination
        function renderPagination() {
            const totalPages = Math.ceil(totalStaff / pageSize);
            const container = document.getElementById('pagination-container');
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let pages = [];
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    pages.push(i);
                } else if (pages[pages.length - 1] !== '...') {
                    pages.push('...');
                }
            }
            
            container.innerHTML = `
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="text-sm text-gray-700">
                        Showing ${((currentPage - 1) * pageSize) + 1} to ${Math.min(currentPage * pageSize, totalStaff)} of ${totalStaff} results
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} 
                                class="px-3 py-1 border rounded ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50'}">
                            Previous
                        </button>
                        ${pages.map(page => `
                            <button onclick="changePage(${page})" 
                                    class="px-3 py-1 border rounded ${currentPage === page ? 'bg-red-600 text-white' : 'hover:bg-gray-50'}">
                                ${page}
                            </button>
                        `).join('')}
                        <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}

        // Save Staff (Create or Update)
        async function saveStaff(staffId = null) {
            const form = document.getElementById('staff-form');
            const formData = new FormData(form);
            
            try {
                if (staffId) {
                    // Update existing staff
                    const updateData = {
                        first_name: formData.get('first_name'),
                        last_name: formData.get('last_name'),
                        phone: formData.get('phone'),
                        clock_in_pin: formData.get('clock_in_pin') || null,
                        hourly_rate: parseFloat(formData.get('hourly_rate')) || 0,
                        account_type: formData.get('account_type'),
                        status: formData.get('status'),
                        updated_at: new Date().toISOString()
                    };
                    
                    const { error: updateError } = await supabaseClient
                        .from('profiles')
                        .update(updateData)
                        .eq('id', staffId);
                    
                    if (updateError) throw updateError;
                    
                    // Update module permissions
                    const selectedModules = Array.from(form.querySelectorAll('input[name="modules"]:checked')).map(cb => cb.value);
                    
                    // Remove old permissions
                    await supabaseClient
                        .from('staff_modules')
                        .delete()
                        .eq('staff_id', staffId);
                    
                    // Add new permissions
                    if (selectedModules.length > 0) {
                        const moduleAssignments = selectedModules.map(moduleId => ({
                            staff_id: staffId,
                            module_id: moduleId
                        }));
                        
                        const { error: assignError } = await supabaseClient
                            .from('staff_modules')
                            .insert(moduleAssignments);
                        
                        if (assignError) throw assignError;
                    }
                    
                    showNotification('Staff updated successfully', 'success');
                    
                } else {
                    // Create new staff member
                    
                    // 1. Create Auth User
                    const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                        email: formData.get('email'),
                        password: formData.get('password'),
                        options: {
                            data: {
                                first_name: formData.get('first_name'),
                                last_name: formData.get('last_name'),
                                role: 'staff'
                            }
                        }
                    });
                    
                    if (authError) throw authError;
                    
                    // 2. Create Profile
                    const profileData = {
                        id: authData.user.id,
                        first_name: formData.get('first_name'),
                        last_name: formData.get('last_name'),
                        email: formData.get('email'),
                        phone: formData.get('phone'),
                        role: 'staff',
                        account_type: formData.get('account_type'),
                        clock_in_pin: formData.get('clock_in_pin') || null,
                        hourly_rate: parseFloat(formData.get('hourly_rate')) || 0,
                        status: formData.get('status') || 'active',
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };
                    
                    const { error: profileError } = await supabaseClient
                        .from('profiles')
                        .insert([profileData]);
                    
                    if (profileError) throw profileError;
                    
                    // 3. Assign Module Permissions
                    const selectedModules = Array.from(form.querySelectorAll('input[name="modules"]:checked')).map(cb => cb.value);
                    
                    if (selectedModules.length > 0) {
                        const moduleAssignments = selectedModules.map(moduleId => ({
                            staff_id: authData.user.id,
                            module_id: moduleId
                        }));
                        
                        const { error: assignError } = await supabaseClient
                            .from('staff_modules')
                            .insert(moduleAssignments);
                        
                        if (assignError) throw assignError;
                    }
                    
                    showNotification('Staff created successfully', 'success');
                }
                
                closeStaffForm();
                await loadStaffList();
                await loadDashboardStats();
                
            } catch (error) {
                console.error('Error saving staff:', error);
                showNotification(error.message || 'Failed to save staff', 'error');
            }
        }

        // Export Staff List
        async function exportStaffList() {
            try {
                let query = supabaseClient
                    .from('profiles')
                    .select('first_name, last_name, email, phone, account_type, hourly_rate, status, last_seen, created_at')
                    .eq('role', 'staff');
                
                if (currentFilters.search) {
                    query = query.or(`first_name.ilike.%${currentFilters.search}%,last_name.ilike.%${currentFilters.search}%,email.ilike.%${currentFilters.search}%`);
                }
                
                if (currentFilters.department) {

                }
                
                if (currentFilters.status) {
                    query = query.eq('status', currentFilters.status);
                }
                
                const { data: staff, error } = await query;
                
                if (error) throw error;
                
                // Convert to CSV
                const csvData = staff.map(s => ({
                    'First Name': s.first_name || '',
                    'Surname': s.last_name || '',
                    'Email': s.email || '',
                    'Phone': s.phone || '',
                    'Department': DEPARTMENTS[s.account_type] || s.account_type || '',
                    'Hourly Rate': s.hourly_rate || 0,
                    'Status': s.status || '',
                    'Last Seen': s.last_seen ? formatDate(s.last_seen) : '',
                    'Created Date': formatDate(s.created_at)
                }));
                
                const csv = convertToCSV(csvData);
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `staff_export_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
                
                showNotification('Staff list exported successfully', 'success');
                
            } catch (error) {
                console.error('Error exporting staff:', error);
                showNotification('Failed to export staff list', 'error');
            }
        }
        
        // Helper Functions
        function getInitials(firstName, lastName) {
            return `${(firstName || 'U')[0]}${(lastName || '')[0] || ''}`.toUpperCase();
        }
        
        function formatDate(dateString) {
            if (!dateString) return 'Never';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-ZA');
        }
        
        function formatDateTime(dateString) {
            if (!dateString) return 'Never';
            const date = new Date(dateString);
            return date.toLocaleString('en-ZA');
        }
        
        function calculateHoursWorked(clockInTime) {
            const start = new Date(clockInTime);
            const now = new Date();
            const hours = (now - start) / (1000 * 60 * 60);
            return `${hours.toFixed(1)} hours`;
        }
        
        function convertToCSV(data) {
            if (!data || data.length === 0) return '';
            const headers = Object.keys(data[0]);
            const csvRows = [];
            csvRows.push(headers.join(','));
            
            for (const row of data) {
                const values = headers.map(header => {
                    const value = row[header]?.toString() || '';
                    return `"${value.replace(/"/g, '""')}"`;
                });
                csvRows.push(values.join(','));
            }
            
            return csvRows.join('\n');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg ${
                type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500'
            } text-white animate-slide-in`;
            notification.innerHTML = `
                <div class="flex items-center space-x-2">
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
                    <span>${escapeHtml(message)}</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        function setupEventListeners() {
            // Search input
            let searchTimeout;
            document.getElementById('search-staff').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentFilters.search = e.target.value;
                    currentPage = 1;
                    loadStaffList();
                }, 300);
            });
            
            // Department filter
            document.getElementById('filter-department').addEventListener('change', (e) => {
                currentFilters.department = e.target.value;
                currentPage = 1;
                loadStaffList();
            });
            
            // Status filter
            document.getElementById('filter-status').addEventListener('change', (e) => {
                currentFilters.status = e.target.value;
                currentPage = 1;
                loadStaffList();
            });
        }
        
        function changePage(page) {
            if (page < 1) return;
            const totalPages = Math.ceil(totalStaff / pageSize);
            if (page > totalPages) return;
            currentPage = page;
            loadStaffList();
        }
        
        function closeStaffForm() {
            document.getElementById('staff-form-modal').classList.add('hidden');
        }
        
        function closeStaffProfile() {
            document.getElementById('staff-profile-modal').classList.add('hidden');
        }
        
        function editStaff(staffId) {
            openStaffForm(staffId);
        }
        
        // Make functions global for HTML onclick handlers
        window.openStaffForm = openStaffForm;
        window.closeStaffForm = closeStaffForm;
        window.closeStaffProfile = closeStaffProfile;
        window.viewStaffProfile = viewStaffProfile;
        window.editStaff = editStaff;
        window.toggleStaffStatus = toggleStaffStatus;
        window.forceLogoutStaff = forceLogoutStaff;
        window.exportStaffList = exportStaffList;
        window.changePage = changePage;
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initStaffManagement);
    </script>
</body>
</html>
