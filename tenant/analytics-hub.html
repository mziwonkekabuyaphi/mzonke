<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Analytics Hub | Rands Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f8;
            padding: 0;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .analytics-header {
            background: white;
            border-bottom: 1px solid #eef2f8;
            padding: 16px 24px 0 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            flex-shrink: 0;
        }
        
        .analytics-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .analytics-title h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e293b;
        }
        
        .analytics-title i {
            color: #E30613;
            font-size: 1.8rem;
        }
        
        .analytics-title span {
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.7rem;
            color: #64748b;
        }
        
        .analytics-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eef2f8;
            padding-bottom: 0;
        }
        
        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 40px 40px 0 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        
        .tab-btn i { font-size: 1rem; }
        .tab-btn:hover { color: #E30613; background: #fff0f0; }
        .tab-btn.active { color: #E30613; border-bottom: 3px solid #E30613; background: transparent; }
        
        .iframe-container {
            flex: 1;
            width: 100%;
            background: #f0f2f8;
            position: relative;
            overflow: hidden;
        }
        
        .analytics-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #f0f2f8;
            transition: opacity 0.2s ease;
        }
        
        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }
        
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid #eef2f8;
            border-top-color: #E30613;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-text { color: #64748b; font-size: 0.8rem; }
        
        .refresh-btn {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }
        
        .refresh-btn:hover {
            background: #E30613;
            border-color: #E30613;
            color: white;
        }
        
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .whatsapp-badge {
            background: #25D366;
            color: white;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 40px;
            margin-left: 6px;
        }
        
        @media (max-width: 768px) {
            .analytics-tabs { flex-wrap: wrap; }
            .tab-btn { padding: 8px 14px; font-size: 0.75rem; }
            .analytics-header { padding: 12px 16px 0 16px; }
        }
    </style>
</head>
<body>
<div class="analytics-header">
    <div class="header-row">
        <div class="analytics-title">
            <i class="fas fa-chart-line"></i>
            <h1>Analytics Command Center</h1>
            <span>Unified Dashboard</span>
        </div>
        <button class="refresh-btn" id="refreshFrameBtn">
            <i class="fas fa-sync-alt"></i> Refresh Current View
        </button>
    </div>
    <div class="analytics-tabs" id="tabButtons">
        <button class="tab-btn active" data-tab="overview" data-src="../stats/executive-stat.html">
            <i class="fas fa-chart-pie"></i> 📊 Overview
        </button>
        <button class="tab-btn" data-tab="events" data-src="../stats/event-stat.html">
            <i class="fas fa-calendar-alt"></i> 🎟️ Events
        </button>
        <button class="tab-btn" data-tab="wallet" data-src="../stats/wallet-stat.html">
            <i class="fas fa-wallet"></i> 💰 Wallet
        </button>
        <button class="tab-btn" data-tab="orders" data-src="../stats/order-stat.html">
            <i class="fas fa-utensils"></i> 🍺 F&B
        </button>
        <button class="tab-btn" data-tab="shisha" data-src="../stats/shisha-stat.html">
            <i class="fas fa-smoking"></i> 💨 Shisha
        </button>
        <button class="tab-btn" data-tab="lockers" data-src="../stats/booze-locker-stat.html">
            <i class="fas fa-locker"></i> 🔐 Lockers
        </button>
        <button class="tab-btn" data-tab="vvip" data-src="../stats/vvip-stat.html">
            <i class="fas fa-crown"></i> 👑 VVIP
        </button>
        <button class="tab-btn" data-tab="workforce" data-src="../stats/workforce-stat.html">
            <i class="fas fa-users"></i> 👥 Staff
        </button>
        <button class="tab-btn" data-tab="whatsapp" data-src="../stats/whatsapp-stat.html">
            <i class="fab fa-whatsapp"></i> 💬 WhatsApp AI
            <span class="whatsapp-badge">AI</span>
        </button>
    </div>
</div>
<div class="iframe-container" id="iframeContainer">
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading analytics...</div>
    </div>
    <iframe id="analyticsFrame" class="analytics-frame" src="../stats/executive-stat.html" title="Analytics Dashboard"></iframe>
</div>

<script>
    const tabConfig = {
        overview: '../stats/executive-stat.html',
        events: '../stats/event-stat.html',
        wallet: '../stats/wallet-stat.html',
        orders: '../stats/order-stat.html',
        shisha: '../stats/shisha-stat.html',
        lockers: '../stats/booze-locker-stat.html',
        vvip: '../stats/vvip-stat.html',
        workforce: '../stats/workforce-stat.html',
        whatsapp: '../stats/whatsapp-stat.html'
    };
    
    let currentTab = 'overview';
    let isLoading = false;
    
    const iframe = document.getElementById('analyticsFrame');
    const loadingOverlay = document.getElementById('loadingOverlay');
    
    function showLoading() {
        loadingOverlay.style.display = 'flex';
        iframe.style.opacity = '0.5';
    }
    
    function hideLoading() {
        loadingOverlay.style.display = 'none';
        iframe.style.opacity = '1';
    }
    
    function loadTab(tabId) {
        if (currentTab === tabId || isLoading) return;
        
        const src = tabConfig[tabId];
        if (!src) {
            console.error('No source configured for tab:', tabId);
            return;
        }
        
        currentTab = tabId;
        isLoading = true;
        showLoading();
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.dataset.tab === tabId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        iframe.src = src;
        
        iframe.onload = () => {
            isLoading = false;
            hideLoading();
            iframe.onload = null;
        };
        
        setTimeout(() => {
            if (isLoading) {
                isLoading = false;
                hideLoading();
            }
        }, 5000);
    }
    
    function refreshCurrentFrame() {
        if (iframe.src) {
            showLoading();
            iframe.contentWindow.location.reload();
            setTimeout(() => { hideLoading(); }, 1500);
        }
    }
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const tabId = btn.dataset.tab;
            loadTab(tabId);
        });
    });
    
    document.getElementById('refreshFrameBtn').addEventListener('click', refreshCurrentFrame);
    
    window.addEventListener('beforeunload', () => {
        localStorage.setItem('analytics_last_tab', currentTab);
    });
    
    const lastTab = localStorage.getItem('analytics_last_tab');
    if (lastTab && tabConfig[lastTab]) {
        currentTab = 'overview';
        loadTab(lastTab);
    }
</script>
</body>
</html>
