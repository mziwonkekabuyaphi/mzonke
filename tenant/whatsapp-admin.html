<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>WhatsApp Concierge · Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>
    <style>
        /* ─── EXACT COLOR PALETTE ─── */
        :root {
            --bg: #F8F9FA;
            --card: #FFFFFF;
            --primary: #D32F2F;
            --primary-dark: #B71C1C;
            --primary-dim: rgba(211, 47, 47, 0.08);
            --primary-border: rgba(211, 47, 47, 0.2);
            --text: #1F2937;
            --text-muted: #6B7280;
            --text-light: #9CA3AF;
            --border: #E5E7EB;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: var(--bg);
            overflow: hidden;
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: 380px;
            min-width: 280px;
            max-width: 460px;
            background: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
            transition: width 0.2s;
            box-shadow: var(--shadow);
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
        }
        .sidebar-brand i {
            color: var(--primary);
            font-size: 1.4rem;
        }
        .sidebar-brand small {
            font-weight: 400;
            font-size: 0.6rem;
            opacity: 0.6;
            margin-left: 2px;
            color: var(--text-muted);
        }
        .sidebar-actions {
            display: flex;
            gap: 6px;
        }
        .sidebar-actions button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-actions button:hover {
            background: var(--bg);
            color: var(--primary);
        }

        .search-bar {
            padding: 8px 14px;
            background: var(--card);
            flex-shrink: 0;
        }
        .search-bar-inner {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 4px 12px;
            gap: 10px;
        }
        .search-bar-inner i {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        .search-bar-inner input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 0.85rem;
            padding: 8px 0;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }
        .search-bar-inner input::placeholder {
            color: var(--text-light);
        }

        /* chat list */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            background: var(--card);
        }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: 0.15s;
            gap: 14px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .chat-item:hover {
            background: var(--bg);
        }
        .chat-item.active {
            background: var(--primary-dim);
            border-left: 3px solid var(--primary);
        }
        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
            text-transform: uppercase;
            position: relative;
        }
        .chat-avatar .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--card);
            background: #10b981;
        }
        .chat-avatar .status-dot.offline {
            background: var(--text-light);
        }
        .chat-info {
            flex: 1;
            min-width: 0;
        }
        .chat-info .name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .chat-info .name .time {
            font-weight: 400;
            font-size: 0.65rem;
            color: var(--text-light);
        }
        .chat-info .last-msg {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .chat-info .last-msg .badge {
            background: var(--primary);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 20px;
            min-width: 20px;
            text-align: center;
        }
        .chat-info .last-msg .intent-tag {
            font-size: 0.55rem;
            background: var(--bg);
            padding: 1px 8px;
            border-radius: 20px;
            color: var(--text-muted);
        }

        /* ─── MAIN CHAT ─── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            min-width: 0;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            min-height: 64px;
        }
        .chat-header .left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }
        .chat-header .left .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 0.95rem;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        .chat-header .left .contact .name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }
        .chat-header .left .contact .status {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header .left .contact .status .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }
        .chat-header .right button {
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-header .right button:hover {
            background: var(--bg);
            color: var(--primary);
        }

        /* messages area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 40px 8px 40px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .messages-area .empty-state {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .messages-area .empty-state i {
            font-size: 3rem;
            color: var(--border);
        }
        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            padding: 4px 0;
        }
        .message-row.incoming {
            align-self: flex-start;
        }
        .message-row.outgoing {
            align-self: flex-end;
        }
        .message-bubble {
            padding: 8px 14px;
            border-radius: 8px 8px 8px 2px;
            font-size: 0.85rem;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }
        .message-row.incoming .message-bubble {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px 8px 8px 2px;
        }
        .message-row.outgoing .message-bubble {
            background: var(--primary);
            color: white;
            border-radius: 8px 2px 8px 8px;
        }
        .message-bubble .time {
            font-size: 0.55rem;
            color: var(--text-light);
            margin-top: 4px;
            display: block;
            text-align: right;
        }
        .message-row.outgoing .message-bubble .time {
            color: rgba(255, 255, 255, 0.7);
        }
        .message-bubble .intent-tag {
            font-size: 0.5rem;
            background: var(--primary-dim);
            color: var(--primary);
            padding: 1px 8px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }
        .message-row.outgoing .message-bubble .intent-tag {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
        }
        .message-divider {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-light);
            padding: 8px 0;
            position: relative;
        }
        .message-divider span {
            background: var(--bg);
            padding: 0 16px;
        }

        /* input bar */
        .input-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px 14px 20px;
            background: var(--card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .input-bar .emoji-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .input-bar .emoji-btn:hover {
            color: var(--primary);
        }
        .input-bar input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--text);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-bar input:focus {
            border-color: var(--primary);
        }
        .input-bar input::placeholder {
            color: var(--text-light);
        }
        .input-bar .send-btn {
            background: var(--primary);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .input-bar .send-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }
        .input-bar .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ─── DASHBOARD OVERLAY ─── */
        .dashboard-overlay {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 520px;
            max-width: 92vw;
            background: var(--card);
            border-left: 2px solid var(--primary);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            overflow-y: auto;
            padding: 20px 24px 30px;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.05);
        }
        .dashboard-overlay.open {
            transform: translateX(0);
        }
        .dashboard-overlay .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .dashboard-overlay .dash-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dashboard-overlay .dash-header h2 i {
            color: var(--primary);
        }
        .dashboard-overlay .dash-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
            padding: 4px 8px;
        }
        .dashboard-overlay .dash-close:hover {
            color: var(--primary);
        }

        .dash-kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .dash-kpi {
            background: var(--bg);
            border-radius: 16px;
            padding: 16px 18px;
            border-left: 4px solid var(--primary);
            border: 1px solid var(--border);
        }
        .dash-kpi .val {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text);
        }
        .dash-kpi .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.4px;
            font-weight: 600;
        }

        .dash-section {
            margin-top: 22px;
        }
        .dash-section h3 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .dash-chart-wrap {
            background: var(--bg);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }
        .dash-chart-wrap canvas {
            max-height: 140px;
            width: 100% !important;
        }
        .dash-templates {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .dash-template-item {
            background: var(--bg);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }
        .dash-template-item .name {
            font-weight: 600;
            color: var(--text);
        }
        .dash-template-item .status {
            font-size: 0.6rem;
            padding: 2px 12px;
            border-radius: 20px;
            background: var(--bg);
            color: var(--text-muted);
            font-weight: 600;
            border: 1px solid var(--border);
        }
        .dash-template-item .status.active {
            background: #dcfce7;
            color: #166534;
            border-color: #86efac;
        }
        .dash-intents {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .dash-intent-chip {
            background: var(--bg);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text);
            border: 1px solid var(--border);
            font-weight: 500;
            transition: 0.15s;
        }
        .dash-intent-chip:hover {
            background: var(--primary-dim);
            border-color: var(--primary);
            color: var(--primary);
        }
        .dash-settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .dash-setting {
            background: var(--bg);
            border-radius: 12px;
            padding: 12px 14px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .dash-setting .val {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
        }
        .dash-setting .label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 500;
        }
        .dash-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .dash-actions button {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dash-actions button:hover {
            background: var(--primary-dim);
            border-color: var(--primary);
            color: var(--primary);
        }
        .dash-actions button.primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .dash-actions button.primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            color: white;
        }

        /* ─── TOAST ─── */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            z-index: 2000;
            display: none;
            font-size: 0.8rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        /* ─── MODALS ─── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: var(--card);
            border-radius: 28px;
            max-width: 480px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px 28px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 800;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-light);
        }
        .modal-close:hover {
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary);
        }
        .form-control option {
            background: var(--card);
        }
        textarea.form-control {
            min-height: 80px;
            resize: vertical;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            justify-content: flex-end;
        }
        .modal-buttons .btn {
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .modal-buttons .btn-secondary {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .modal-buttons .btn-secondary:hover {
            background: var(--border);
        }
        .modal-buttons .btn-primary {
            background: var(--primary);
            color: white;
        }
        .modal-buttons .btn-primary:hover {
            background: var(--primary-dark);
        }
        select.form-control {
            appearance: auto;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 820px) {
            .sidebar {
                width: 280px;
                min-width: 220px;
            }
            .messages-area {
                padding: 12px 16px 8px 16px;
            }
            .dashboard-overlay {
                width: 100vw;
                max-width: 100vw;
            }
        }
        @media (max-width: 600px) {
            .sidebar {
                width: 100%;
                max-width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .app {
                flex-direction: column;
            }
            .main {
                flex: 1;
                min-height: 0;
            }
            .messages-area {
                padding: 8px 12px;
            }
            .message-row {
                max-width: 90%;
            }
            .chat-header {
                padding: 6px 12px;
                min-height: 52px;
            }
            .input-bar {
                padding: 6px 12px 10px 12px;
            }
            .chat-header .right button {
                width: 34px;
                height: 34px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- ─── SIDEBAR ─── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <i class="fab fa-whatsapp"></i>
                    Concierge
                    <small>admin</small>
                </div>
                <div class="sidebar-actions">
                    <button id="toggleDashBtn" title="Dashboard" onclick="toggleDashboard()">
                        <i class="fas fa-chart-pie"></i>
                    </button>
                    <button onclick="refreshAllData()" title="Refresh">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>
            <div class="search-bar">
                <div class="search-bar-inner">
                    <i class="fas fa-search"></i>
                    <input type="text" id="chatSearch" placeholder="Search or start new chat" oninput="filterChats()" />
                </div>
            </div>
            <div class="chat-list" id="chatList"></div>
        </aside>

        <!-- ─── MAIN CHAT ─── -->
        <main class="main">
            <!-- Chat Header -->
            <div class="chat-header" id="chatHeader">
                <div class="left">
                    <div class="avatar" id="chatAvatar">?</div>
                    <div class="contact">
                        <div class="name" id="chatContactName">Select a conversation</div>
                        <div class="status" id="chatStatus">
                            <span class="online-dot"></span> online
                        </div>
                    </div>
                </div>
                <div class="right">
                    <button title="Call"><i class="fas fa-phone"></i></button>
                    <button title="Video"><i class="fas fa-video"></i></button>
                    <button title="More"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages-area" id="messagesArea">
                <div class="empty-state">
                    <i class="fab fa-whatsapp"></i>
                    <span>Select a conversation to start chatting</span>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="input-bar">
                <button class="emoji-btn"><i class="far fa-smile"></i></button>
                <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- ─── DASHBOARD OVERLAY ─── -->
    <div class="dashboard-overlay" id="dashboardOverlay">
        <div class="dash-header">
            <h2><i class="fas fa-chart-pie"></i> Analytics Dashboard</h2>
            <button class="dash-close" onclick="toggleDashboard()">&times;</button>
        </div>
        <div class="dash-kpi-grid" id="dashKpiGrid"></div>
        <div class="dash-section">
            <h3>Conversation Volume</h3>
            <div class="dash-chart-wrap"><canvas id="dashVolumeChart"></canvas></div>
        </div>
        <div class="dash-section">
            <h3>Intent Distribution</h3>
            <div class="dash-chart-wrap"><canvas id="dashIntentChart"></canvas></div>
        </div>
        <div class="dash-section">
            <h3>AI Performance</h3>
            <div class="dash-chart-wrap"><canvas id="dashAiChart"></canvas></div>
        </div>
        <div class="dash-section">
            <h3>Templates</h3>
            <div class="dash-templates" id="dashTemplatesList"></div>
            <div style="margin-top:8px;">
                <button class="dash-actions" style="background:transparent;border:none;padding:0;">
                    <button onclick="openTemplateModal()" class="primary"><i class="fas fa-plus"></i> Add Template</button>
                </button>
            </div>
        </div>
        <div class="dash-section">
            <h3>AI Intents</h3>
            <div class="dash-intents" id="dashIntentsList"></div>
            <div style="margin-top:8px;">
                <button class="dash-actions" style="background:transparent;border:none;padding:0;">
                    <button onclick="openIntentModal()" class="primary"><i class="fas fa-plus"></i> Add Intent</button>
                </button>
            </div>
        </div>
        <div class="dash-section">
            <h3>AI Settings</h3>
            <div class="dash-settings-grid" id="dashSettingsGrid"></div>
            <div style="margin-top:8px;">
                <button class="dash-actions" style="background:transparent;border:none;padding:0;">
                    <button onclick="openAISettingsModal()"><i class="fas fa-edit"></i> Edit Settings</button>
                </button>
            </div>
        </div>
    </div>

    <!-- ─── MODALS ─── -->
    <div id="templateModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3 id="templateModalTitle">Add Template</h3><button class="modal-close" onclick="closeTemplateModal()">&times;</button></div>
            <div class="form-group"><label>Template Name</label><input type="text" id="templateName" class="form-control" placeholder="e.g., welcome_message" /></div>
            <div class="form-group"><label>Template Key</label><input type="text" id="templateKey" class="form-control" placeholder="welcome" /></div>
            <div class="form-group"><label>Content</label><textarea id="templateContent" class="form-control" placeholder="Welcome! How can I help?"></textarea></div>
            <div class="form-group"><label>Status</label><select id="templateStatus" class="form-control"><option value="true">Active</option><option value="false">Inactive</option></select></div>
            <div class="modal-buttons"><button class="btn btn-secondary" onclick="closeTemplateModal()">Cancel</button><button class="btn btn-primary" onclick="saveTemplate()">Save</button></div>
        </div>
    </div>

    <div id="intentModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3 id="intentModalTitle">Add Intent</h3><button class="modal-close" onclick="closeIntentModal()">&times;</button></div>
            <div class="form-group"><label>Intent Name</label><input type="text" id="intentName" class="form-control" placeholder="e.g., order_status" /></div>
            <div class="form-group"><label>Description</label><textarea id="intentDescription" class="form-control" placeholder="What does this intent handle?"></textarea></div>
            <div class="modal-buttons"><button class="btn btn-secondary" onclick="closeIntentModal()">Cancel</button><button class="btn btn-primary" onclick="saveIntent()">Save</button></div>
        </div>
    </div>

    <div id="aiSettingsModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h3>AI Settings</h3><button class="modal-close" onclick="closeAISettingsModal()">&times;</button></div>
            <div class="form-group"><label>Model</label><select id="aiModel" class="form-control"><option value="claude">Claude</option><option value="gpt-4">GPT-4</option><option value="llama">Llama</option></select></div>
            <div class="form-group"><label>Temperature (0–1)</label><input type="number" id="aiTemperature" step="0.1" min="0" max="1" class="form-control" value="0.3" /></div>
            <div class="form-group"><label>Max Tokens</label><input type="number" id="aiMaxTokens" class="form-control" value="500" /></div>
            <div class="form-group"><label>Enable AI</label><select id="aiEnable" class="form-control"><option value="true">Enabled</option><option value="false">Disabled</option></select></div>
            <div class="modal-buttons"><button class="btn btn-secondary" onclick="closeAISettingsModal()">Cancel</button><button class="btn btn-primary" onclick="saveAISettings()">Save</button></div>
        </div>
    </div>

    <!-- ─── TOAST ─── -->
    <div id="toastMsg" class="toast-msg"></div>

    <script type="module">
        import { supabase } from '../config/supabase.js';

        // ─── GLOBALS ───
        let charts = {};
        let currentEditingTemplate = null;
        let currentEditingIntent = null;
        let selectedPhone = null;
        let allConversations = [];
        let allAIRequests = [];
        let allSessions = [];
        let allTemplates = [];
        let allIntents = [];
        let aiSettings = {};

        // ─── TOAST ───
        window.showToast = function(msg, isError = false) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = msg;
            toast.style.background = isError ? '#dc2626' : '#1F2937';
            toast.style.display = 'block';
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => toast.style.display = 'none', 2800);
        };

        // ─── ESCAPE ───
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]); }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const now = new Date();
            if (d.toDateString() === now.toDateString()) return formatTime(iso);
            const diff = (now - d) / 86400000;
            if (diff < 7) return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()];
            return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function getInitials(phone) {
            if (!phone) return '?';
            const parts = phone.replace(/[^a-zA-Z0-9]/g, '').slice(-4);
            return parts || '?';
        }

        // ─── DATA LOADING ───
        async function loadConversations() {
            try {
                const { data, error } = await supabase.from('whatsapp_conversations').select('*').order('created_at', { ascending: false }).limit(300);
                if (error) throw error;
                allConversations = data || [];
                return allConversations;
            } catch (e) { console.error(e); allConversations = []; return []; }
        }

        async function loadAIRequests() {
            try {
                const { data, error } = await supabase.from('ai_requests').select('*').order('created_at', { ascending: false }).limit(300);
                if (error) throw error;
                allAIRequests = data || [];
                return allAIRequests;
            } catch (e) { console.error(e); allAIRequests = []; return []; }
        }

        async function loadActiveSessions() {
            try {
                const { data, error } = await supabase.from('conversation_sessions').select('*').order('last_message_at', { ascending: false }).limit(50);
                if (error) throw error;
                allSessions = data || [];
                return allSessions;
            } catch (e) { console.error(e); allSessions = []; return []; }
        }

        async function loadTemplates() {
            try {
                const { data, error } = await supabase.from('whatsapp_templates').select('*').order('template_name');
                if (error) throw error;
                allTemplates = data || [];
                return allTemplates;
            } catch (e) { console.error(e); allTemplates = []; return []; }
        }

        async function loadIntents() {
            try {
                const { data, error } = await supabase.from('ai_intents').select('*').order('intent_name');
                if (error) throw error;
                allIntents = data || [];
                return allIntents;
            } catch (e) { console.error(e); allIntents = []; return []; }
        }

        async function loadAISettings() {
            try {
                const { data, error } = await supabase.from('ai_settings').select('*').eq('id', 'default').maybeSingle();
                if (error) throw error;
                aiSettings = data || { model: 'claude', temperature: 0.3, max_tokens: 500, enable_ai: true };
                return aiSettings;
            } catch (e) { console.error(e); aiSettings = { model: 'claude', temperature: 0.3, max_tokens: 500, enable_ai: true }; return aiSettings; }
        }

        // ─── GROUP CONVERSATIONS BY PHONE ───
        function groupByPhone(convs) {
            const map = new Map();
            for (const c of convs) {
                const key = c.phone || 'unknown';
                if (!map.has(key)) map.set(key, []);
                map.get(key).push(c);
            }
            for (const [k, v] of map) v.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            return map;
        }

        // ─── RENDER CHAT LIST ───
        function renderChatList(filter = '') {
            const container = document.getElementById('chatList');
            const grouped = groupByPhone(allConversations);
            const phones = Array.from(grouped.keys());
            phones.sort((a, b) => {
                const aLast = grouped.get(a).slice(-1)[0]?.created_at || '';
                const bLast = grouped.get(b).slice(-1)[0]?.created_at || '';
                return new Date(bLast) - new Date(aLast);
            });

            const search = filter.toLowerCase().trim();
            let filtered = phones;
            if (search) {
                filtered = phones.filter(p => p.toLowerCase().includes(search) ||
                    grouped.get(p).some(c => (c.message || '').toLowerCase().includes(search))
                );
            }

            if (!filtered.length) {
                container.innerHTML = `<div style="text-align:center;color:var(--text-light);padding:40px 0;font-size:0.85rem;">No conversations found</div>`;
                return;
            }

            container.innerHTML = filtered.map(phone => {
                const msgs = grouped.get(phone);
                const last = msgs.slice(-1)[0];
                const unread = msgs.filter(m => m.direction === 'inbound' && !m.read).length;
                const session = allSessions.find(s => s.phone === phone);
                const isOnline = !!session;
                const lastTime = last?.created_at ? formatDate(last.created_at) : '';
                const preview = last?.message ? escapeHtml(last.message.slice(0, 60)) : 'No messages';
                const intent = last?.intent || 'general';
                const isActive = phone === selectedPhone;

                return `<div class="chat-item ${isActive ? 'active' : ''}" onclick="selectConversation('${escapeHtml(phone)}')">
                            <div class="chat-avatar">
                                ${getInitials(phone)}
                                <span class="status-dot ${isOnline ? '' : 'offline'}"></span>
                            </div>
                            <div class="chat-info">
                                <div class="name">
                                    <span>${escapeHtml(phone)}</span>
                                    <span class="time">${lastTime}</span>
                                </div>
                                <div class="last-msg">
                                    <span>${preview}</span>
                                    <span style="display:flex;gap:6px;align-items:center;">
                                        <span class="intent-tag">${escapeHtml(intent)}</span>
                                        ${unread > 0 ? `<span class="badge">${unread}</span>` : ''}
                                    </span>
                                </div>
                            </div>
                        </div>`;
            }).join('');
        }

        // ─── SELECT CONVERSATION ───
        window.selectConversation = function(phone) {
            selectedPhone = phone;
            renderChatList(document.getElementById('chatSearch').value);
            renderChatMessages(phone);
            updateChatHeader(phone);
        };

        function updateChatHeader(phone) {
            const nameEl = document.getElementById('chatContactName');
            const avatarEl = document.getElementById('chatAvatar');
            const statusEl = document.getElementById('chatStatus');
            if (!phone) {
                nameEl.textContent = 'Select a conversation';
                avatarEl.textContent = '?';
                statusEl.innerHTML = '<span class="online-dot"></span> online';
                return;
            }
            nameEl.textContent = phone;
            avatarEl.textContent = getInitials(phone);
            const session = allSessions.find(s => s.phone === phone);
            const isOnline = !!session;
            statusEl.innerHTML = `
                        <span class="online-dot" style="background:${isOnline ? '#10b981' : 'var(--text-light)'}"></span>
                        ${isOnline ? 'online' : 'last seen recently'}
                    `;
        }

        // ─── RENDER MESSAGES ───
        function renderChatMessages(phone) {
            const area = document.getElementById('messagesArea');
            if (!phone) {
                area.innerHTML = `<div class="empty-state"><i class="fab fa-whatsapp"></i><span>Select a conversation to start chatting</span></div>`;
                return;
            }
            const grouped = groupByPhone(allConversations);
            const msgs = grouped.get(phone) || [];
            if (!msgs.length) {
                area.innerHTML = `<div class="empty-state"><i class="far fa-comment-dots"></i><span>No messages yet</span></div>`;
                return;
            }

            let html = '';
            let lastDate = '';
            for (const m of msgs) {
                const date = new Date(m.created_at).toDateString();
                if (date !== lastDate) {
                    html += `<div class="message-divider"><span>${new Date(m.created_at).toLocaleDateString([], { weekday:'long', month:'long', day:'numeric' })}</span></div>`;
                    lastDate = date;
                }
                const isInbound = m.direction === 'inbound';
                const time = formatTime(m.created_at);
                const intentTag = m.intent ? `<span class="intent-tag">${escapeHtml(m.intent)}</span>` : '';
                html += `<div class="message-row ${isInbound ? 'incoming' : 'outgoing'}">
                            <div class="message-bubble">
                                ${escapeHtml(m.message || '')}
                                ${intentTag}
                                <span class="time">${time}</span>
                            </div>
                        </div>`;
            }
            area.innerHTML = html;
            area.scrollTop = area.scrollHeight;
        }

        // ─── SEND MESSAGE ───
        window.sendMessage = async function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !selectedPhone) {
                if (!selectedPhone) showToast('Select a conversation first', true);
                return;
            }
            const btn = document.getElementById('sendBtn');
            btn.disabled = true;

            try {
                const { data, error } = await supabase.from('whatsapp_conversations').insert({
                    phone: selectedPhone,
                    message: text,
                    direction: 'outbound',
                    intent: 'manual',
                    created_at: new Date().toISOString(),
                });
                if (error) throw error;
                input.value = '';
                await loadConversations();
                renderChatList(document.getElementById('chatSearch').value);
                renderChatMessages(selectedPhone);
                showToast('Message sent');
            } catch (e) {
                showToast(e.message, true);
            }
            btn.disabled = false;
        };

        // ─── FILTER CHATS ───
        window.filterChats = function() {
            renderChatList(document.getElementById('chatSearch').value);
        };

        // ─── TOGGLE DASHBOARD ───
        window.toggleDashboard = function() {
            const overlay = document.getElementById('dashboardOverlay');
            overlay.classList.toggle('open');
            if (overlay.classList.contains('open')) {
                renderDashboard();
            }
        };

        // ─── RENDER DASHBOARD ───
        function renderDashboard() {
            const totalMsgs = allConversations.length;
            const uniqueUsers = new Set(allConversations.map(c => c.phone)).size;
            const aiSuccess = allAIRequests.length ? (allAIRequests.filter(r => r.success).length / allAIRequests.length * 100) : 0;
            const activeChats = allSessions.length;
            const templatesCount = allTemplates.length;

            document.getElementById('dashKpiGrid').innerHTML = `
                        <div class="dash-kpi"><div class="val">${totalMsgs}</div><div class="label">Total Messages</div></div>
                        <div class="dash-kpi"><div class="val">${uniqueUsers}</div><div class="label">Unique Users</div></div>
                        <div class="dash-kpi"><div class="val">${Math.round(aiSuccess)}%</div><div class="label">AI Success</div></div>
                        <div class="dash-kpi"><div class="val">${activeChats}</div><div class="label">Active Chats</div></div>
                    `;

            // Volume chart
            const last30 = [...Array(30)].map((_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - i);
                return d.toISOString().split('T')[0];
            }).reverse();
            const volData = last30.map(day => allConversations.filter(c => c.created_at?.startsWith(day)).length);
            const ctxV = document.getElementById('dashVolumeChart').getContext('2d');
            if (charts.dashVol) charts.dashVol.destroy();
            charts.dashVol = new Chart(ctxV, {
                type: 'line',
                data: { labels: last30.map(d => d.slice(5)), datasets: [{ label: 'Messages', data: volData, borderColor: '#D32F2F', backgroundColor: 'rgba(211,47,47,0.08)', fill: true, tension: 0.3, pointRadius: 1 }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#6B7280' } } }, scales: { x: { ticks: { color: '#9CA3AF', maxTicksLimit: 12 } }, y: { ticks: { color: '#9CA3AF', stepSize: 1 } } } }
            });

            // Intent chart
            const intentCount = {};
            allAIRequests.forEach(r => { const i = r.intent || 'unknown';
                intentCount[i] = (intentCount[i] || 0) + 1; });
            const sorted = Object.entries(intentCount).sort((a, b) => b[1] - a[1]);
            const ctxI = document.getElementById('dashIntentChart').getContext('2d');
            if (charts.dashIntent) charts.dashIntent.destroy();
            charts.dashIntent = new Chart(ctxI, {
                type: 'doughnut',
                data: { labels: sorted.map(i => i[0].replace(/_/g, ' ').toUpperCase()), datasets: [{ data: sorted.map(i => i[1]), backgroundColor: ['#D32F2F', '#f59e0b', '#10b981', '#8b5cf6', '#06b6d4', '#ef4444'] }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#6B7280', boxWidth: 12 } } } }
            });

            // AI chart
            const succ = allAIRequests.filter(r => r.success).length;
            const fail = allAIRequests.length - succ;
            const ctxA = document.getElementById('dashAiChart').getContext('2d');
            if (charts.dashAi) charts.dashAi.destroy();
            charts.dashAi = new Chart(ctxA, {
                type: 'doughnut',
                data: { labels: ['Successful', 'Failed'], datasets: [{ data: [succ, fail], backgroundColor: ['#10b981', '#D32F2F'] }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#6B7280', boxWidth: 12 } } } }
            });

            // Templates
            document.getElementById('dashTemplatesList').innerHTML = allTemplates.slice(0, 6).map(t =>
                `<div class="dash-template-item"><span class="name">${escapeHtml(t.template_name || t.template_key)}</span><span class="status ${t.active ? 'active' : ''}">${t.active ? 'Active' : 'Inactive'}</span></div>`
            ).join('') || '<div style="color:var(--text-light);font-size:0.75rem;">No templates</div>';

            // Intents
            document.getElementById('dashIntentsList').innerHTML = allIntents.slice(0, 12).map(i =>
                `<span class="dash-intent-chip">${escapeHtml(i.intent_name)}</span>`
            ).join('') || '<span style="color:var(--text-light);font-size:0.75rem;">No intents</span>';

            // Settings
            const s = aiSettings;
            document.getElementById('dashSettingsGrid').innerHTML = `
                        <div class="dash-setting"><div class="val">${s.model || 'claude'}</div><div class="label">Model</div></div>
                        <div class="dash-setting"><div class="val">${s.temperature || 0.3}</div><div class="label">Temperature</div></div>
                        <div class="dash-setting"><div class="val">${s.max_tokens || 500}</div><div class="label">Max Tokens</div></div>
                        <div class="dash-setting"><div class="val">${s.enable_ai ? 'ON' : 'OFF'}</div><div class="label">AI Status</div></div>
                    `;
        }

        // ─── REFRESH ───
        window.refreshAllData = async function() {
            showToast('Refreshing...');
            await Promise.all([loadConversations(), loadAIRequests(), loadActiveSessions(), loadTemplates(), loadIntents(), loadAISettings()]);
            renderChatList(document.getElementById('chatSearch').value);
            if (selectedPhone) {
                renderChatMessages(selectedPhone);
                updateChatHeader(selectedPhone);
            }
            if (document.getElementById('dashboardOverlay').classList.contains('open')) renderDashboard();
            showToast('Data refreshed');
        };

        // ─── MODAL HELPERS ───
        window.openTemplateModal = (id = null) => {
            currentEditingTemplate = id;
            const modal = document.getElementById('templateModal');
            document.getElementById('templateModalTitle').innerText = id ? 'Edit Template' : 'Add Template';
            if (id && allTemplates) {
                const t = allTemplates.find(tm => tm.id === id);
                if (t) {
                    document.getElementById('templateName').value = t.template_name || '';
                    document.getElementById('templateKey').value = t.template_key || '';
                    document.getElementById('templateContent').value = t.content || '';
                    document.getElementById('templateStatus').value = t.active ? 'true' : 'false';
                }
            } else {
                document.getElementById('templateName').value = '';
                document.getElementById('templateKey').value = '';
                document.getElementById('templateContent').value = '';
                document.getElementById('templateStatus').value = 'true';
            }
            modal.classList.add('active');
        };
        window.closeTemplateModal = () => document.getElementById('templateModal').classList.remove('active');
        window.saveTemplate = async () => {
            const name = document.getElementById('templateName').value.trim();
            const key = document.getElementById('templateKey').value.trim();
            const content = document.getElementById('templateContent').value.trim();
            const active = document.getElementById('templateStatus').value === 'true';
            if (!name || !key || !content) { showToast('Name, key and content required', true); return; }
            try {
                if (currentEditingTemplate) {
                    await supabase.from('whatsapp_templates').update({ template_name: name, template_key: key, content, active, updated_at: new Date() }).eq('id', currentEditingTemplate);
                    showToast('Template updated');
                } else {
                    await supabase.from('whatsapp_templates').insert({ template_key: key, template_name: name, content, active });
                    showToast('Template added');
                }
                closeTemplateModal();
                await loadTemplates();
                if (document.getElementById('dashboardOverlay').classList.contains('open')) renderDashboard();
            } catch (e) { showToast(e.message, true); }
        };

        window.openIntentModal = (id = null) => {
            currentEditingIntent = id;
            const modal = document.getElementById('intentModal');
            document.getElementById('intentModalTitle').innerText = id ? 'Edit Intent' : 'Add Intent';
            if (id && allIntents) {
                const i = allIntents.find(it => it.id === id);
                if (i) {
                    document.getElementById('intentName').value = i.intent_name;
                    document.getElementById('intentDescription').value = i.description || '';
                }
            } else {
                document.getElementById('intentName').value = '';
                document.getElementById('intentDescription').value = '';
            }
            modal.classList.add('active');
        };
        window.closeIntentModal = () => document.getElementById('intentModal').classList.remove('active');
        window.saveIntent = async () => {
            const name = document.getElementById('intentName').value.trim().toLowerCase().replace(/ /g, '_');
            const description = document.getElementById('intentDescription').value.trim();
            if (!name) { showToast('Intent name required', true); return; }
            try {
                if (currentEditingIntent) {
                    await supabase.from('ai_intents').update({ intent_name: name, description, updated_at: new Date() }).eq('id', currentEditingIntent);
                    showToast('Intent updated');
                } else {
                    await supabase.from('ai_intents').insert({ intent_name: name, description, active: true });
                    showToast('Intent added');
                }
                closeIntentModal();
                await loadIntents();
                if (document.getElementById('dashboardOverlay').classList.contains('open')) renderDashboard();
            } catch (e) { showToast(e.message, true); }
        };

        window.openAISettingsModal = () => {
            const s = aiSettings;
            document.getElementById('aiModel').value = s.model || 'claude';
            document.getElementById('aiTemperature').value = s.temperature || 0.3;
            document.getElementById('aiMaxTokens').value = s.max_tokens || 500;
            document.getElementById('aiEnable').value = s.enable_ai ? 'true' : 'false';
            document.getElementById('aiSettingsModal').classList.add('active');
        };
        window.closeAISettingsModal = () => document.getElementById('aiSettingsModal').classList.remove('active');
        window.saveAISettings = async () => {
            const model = document.getElementById('aiModel').value;
            const temperature = parseFloat(document.getElementById('aiTemperature').value);
            const maxTokens = parseInt(document.getElementById('aiMaxTokens').value);
            const enableAi = document.getElementById('aiEnable').value === 'true';
            try {
                await supabase.from('ai_settings').upsert({ id: 'default', model, temperature, max_tokens: maxTokens, enable_ai: enableAi, updated_at: new Date() });
                showToast('AI settings saved');
                closeAISettingsModal();
                await loadAISettings();
                if (document.getElementById('dashboardOverlay').classList.contains('open')) renderDashboard();
            } catch (e) { showToast(e.message, true); }
        };

        // ─── AUTO REFRESH ───
        setInterval(() => {
            loadConversations();
            loadAIRequests();
            loadActiveSessions();
        }, 30000);

        // ─── INIT ───
        async function init() {
            await Promise.all([loadConversations(), loadAIRequests(), loadActiveSessions(), loadTemplates(), loadIntents(), loadAISettings()]);
            renderChatList('');
            const grouped = groupByPhone(allConversations);
            const phones = Array.from(grouped.keys());
            if (phones.length) {
                selectedPhone = phones[0];
                renderChatMessages(selectedPhone);
                updateChatHeader(selectedPhone);
                renderChatList('');
            }
            window.allConversations = allConversations;
            window.allAIRequests = allAIRequests;
            window.allSessions = allSessions;
            window.allTemplates = allTemplates;
            window.allIntents = allIntents;
            window.aiSettings = aiSettings;
        }

        init();

        // ─── GLOBAL EXPOSURE ───
        window.selectConversation = selectConversation;
        window.sendMessage = sendMessage;
        window.filterChats = filterChats;
        window.toggleDashboard = toggleDashboard;
        window.refreshAllData = refreshAllData;
        window.openTemplateModal = openTemplateModal;
        window.closeTemplateModal = closeTemplateModal;
        window.saveTemplate = saveTemplate;
        window.openIntentModal = openIntentModal;
        window.closeIntentModal = closeIntentModal;
        window.saveIntent = saveIntent;
        window.openAISettingsModal = openAISettingsModal;
        window.closeAISettingsModal = closeAISettingsModal;
        window.saveAISettings = saveAISettings;
        window.showToast = showToast;

        console.log('🚀 WhatsApp Concierge Admin (exact palette) ready');
    </script>
</body>
</html>
