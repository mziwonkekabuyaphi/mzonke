<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>WhatsApp Concierge · Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script type="importmap">{ "imports": { "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" } }</script>

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red:        #E30613;
            --red-glow:   rgba(227,6,19,0.35);
            --red-dim:    rgba(227,6,19,0.1);
            --red-border: rgba(227,6,19,0.22);
            --bg:         #09090b;
            --s1:         #111114;
            --s2:         #18181c;
            --s3:         #1e1e24;
            --border:     rgba(255,255,255,0.07);
            --border-b:   rgba(255,255,255,0.12);
            --text:       #f4f4f5;
            --muted:      #71717a;
            --dim:        #3f3f46;
            --green:      #22c55e;
        }

        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }
        .app { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: var(--bg); }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 99px; }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: 340px; min-width: 260px; max-width: 420px;
            background: var(--s1); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; height: 100%; flex-shrink: 0;
        }
        .sidebar-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            flex-shrink: 0; min-height: 56px;
        }
        .sidebar-brand { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.92rem; color: var(--text); }
        .brand-icon {
            width: 34px; height: 34px; border-radius: 9px;
            background: var(--red-dim); border: 1px solid var(--red-border);
            display: flex; align-items: center; justify-content: center;
            color: var(--red); font-size: 1rem; box-shadow: 0 0 12px var(--red-glow);
        }
        .brand-sub { font-size: 0.6rem; color: var(--muted); font-weight: 400; font-family: 'Inter', sans-serif; letter-spacing: 0.04em; }
        .sidebar-actions { display: flex; gap: 4px; }
        .icon-btn {
            background: var(--s3); border: 1px solid var(--border); color: var(--muted);
            font-size: 0.9rem; cursor: pointer; border-radius: 8px;
            width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .icon-btn:hover { background: var(--s2); border-color: var(--border-b); color: var(--text); }
        .icon-btn.active-toggle { color: var(--red); border-color: var(--red-border); background: var(--red-dim); }

        .search-bar { padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .search-inner {
            background: var(--s2); border: 1px solid var(--border);
            border-radius: 8px; display: flex; align-items: center; padding: 0 12px; gap: 10px;
            transition: border-color 0.15s;
        }
        .search-inner:focus-within { border-color: var(--red-border); }
        .search-inner i { color: var(--dim); font-size: 0.8rem; }
        .search-inner input { background: transparent; border: none; outline: none; color: var(--text); font-size: 0.82rem; padding: 9px 0; width: 100%; font-family: 'Inter', sans-serif; }
        .search-inner input::placeholder { color: var(--muted); }

        .chat-list { flex: 1; overflow-y: auto; background: var(--s1); }
        .chat-item {
            display: flex; align-items: center; padding: 10px 14px; cursor: pointer;
            transition: background 0.12s; gap: 12px; border-bottom: 1px solid var(--border); position: relative;
        }
        .chat-item:hover { background: var(--s2); }
        .chat-item.active { background: var(--red-dim); border-left: 2px solid var(--red); }
        .chat-item.active::before { content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2px; background: var(--red); border-radius: 99px; box-shadow: 0 0 8px var(--red); }

        .chat-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--red), #7b0009);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 0.8rem;
            flex-shrink: 0; position: relative; font-family: 'Space Grotesk', sans-serif;
            box-shadow: 0 0 12px rgba(227,6,19,0.2);
        }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--s1); background: var(--green); }
        .status-dot.offline { background: var(--dim); }

        .chat-info { flex: 1; min-width: 0; }
        .chat-info .name { font-weight: 600; font-size: 0.82rem; color: var(--text); display: flex; justify-content: space-between; align-items: baseline; }
        .chat-info .name .time { font-weight: 400; font-size: 0.62rem; color: var(--muted); }
        .chat-info .last-msg { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
        .badge { background: var(--red); color: white; font-size: 0.58rem; font-weight: 700; padding: 1px 6px; border-radius: 99px; min-width: 18px; text-align: center; box-shadow: 0 0 6px var(--red-glow); }
        .intent-tag { font-size: 0.55rem; background: var(--s3); border: 1px solid var(--border); padding: 1px 7px; border-radius: 99px; color: var(--muted); }

        /* ─── MAIN CHAT ─── */
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
        .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; background: var(--s1); border-bottom: 1px solid var(--border); flex-shrink: 0; min-height: 56px; }
        .chat-header .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .ch-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--red), #7b0009); display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 0.75rem; flex-shrink: 0; box-shadow: 0 0 10px rgba(227,6,19,0.2); }
        .ch-name { font-weight: 600; font-size: 0.88rem; color: var(--text); }
        .ch-status { font-size: 0.68rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
        .online-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 5px var(--green); }
        .chat-header .right { display: flex; gap: 4px; }

        .messages-area { flex: 1; overflow-y: auto; padding: 16px 32px 8px 32px; display: flex; flex-direction: column; gap: 2px; }
        .empty-state { text-align: center; color: var(--dim); font-size: 0.88rem; margin: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .empty-state i { font-size: 2.6rem; color: var(--s3); }

        .message-row { display: flex; flex-direction: column; max-width: 72%; padding: 3px 0; }
        .message-row.incoming { align-self: flex-start; }
        .message-row.outgoing { align-self: flex-end; }
        .message-bubble { padding: 9px 14px; font-size: 0.83rem; line-height: 1.5; word-break: break-word; position: relative; }
        .message-row.incoming .message-bubble { background: var(--s2); color: var(--text); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; }
        .message-row.outgoing .message-bubble { background: var(--red); color: white; border-radius: 14px 4px 14px 14px; box-shadow: 0 4px 16px rgba(227,6,19,0.25); }
        .message-bubble .time { font-size: 0.53rem; color: var(--muted); margin-top: 4px; display: block; text-align: right; }
        .message-row.outgoing .message-bubble .time { color: rgba(255,255,255,0.55); }
        .message-bubble .intent-tag { font-size: 0.5rem; background: var(--red-dim); color: var(--red); padding: 1px 7px; border-radius: 99px; display: inline-block; margin-top: 4px; border: 1px solid var(--red-border); }
        .message-row.outgoing .message-bubble .intent-tag { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.75); border-color: transparent; }
        .message-divider { text-align: center; font-size: 0.62rem; color: var(--muted); padding: 8px 0; }
        .message-divider span { background: var(--bg); padding: 0 14px; }

        .input-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px 14px 16px; background: var(--s1); border-top: 1px solid var(--border); flex-shrink: 0; }
        .emoji-btn { background: transparent; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; padding: 6px; border-radius: 50%; transition: color 0.15s; }
        .emoji-btn:hover { color: var(--red); }
        .input-bar input { flex: 1; background: var(--s2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 0.83rem; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.15s; }
        .input-bar input:focus { border-color: var(--red-border); }
        .input-bar input::placeholder { color: var(--muted); }
        .send-btn { background: var(--red); border: none; border-radius: 10px; width: 42px; height: 42px; color: white; font-size: 1rem; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 16px var(--red-glow); }
        .send-btn:hover { background: #c8050f; transform: scale(1.03); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ─── DASHBOARD OVERLAY ─── */
        .dashboard-overlay { position: fixed; top: 0; right: 0; bottom: 0; width: 500px; max-width: 93vw; background: var(--s1); border-left: 1px solid var(--border); z-index: 1000; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.2,0.9,0.3,1); overflow-y: auto; padding: 20px 22px 30px; box-shadow: -12px 0 60px rgba(0,0,0,0.5); }
        .dashboard-overlay.open { transform: translateX(0); }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .dash-header h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .dash-header h2 i { color: var(--red); }
        .dash-close { background: transparent; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; line-height: 1; }
        .dash-close:hover { color: var(--text); }
        .dash-kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .dash-kpi { background: var(--s2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; border-left: 2px solid var(--red); }
        .dash-kpi .val { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--text); }
        .dash-kpi .label { font-size: 0.58rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin-top: 2px; }
        .dash-section { margin-top: 18px; }
        .dash-section h3 { font-size: 0.68rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
        .dash-chart-wrap { background: var(--s2); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
        .dash-chart-wrap canvas { max-height: 140px; width: 100% !important; }
        .dash-templates { display: flex; flex-direction: column; gap: 6px; }
        .dash-template-item { background: var(--s2); border-radius: 10px; padding: 9px 13px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; border: 1px solid var(--border); }
        .dash-template-item .name { font-weight: 600; color: var(--text); }
        .dash-template-item .status { font-size: 0.55rem; padding: 2px 9px; border-radius: 99px; background: var(--s3); color: var(--muted); }
        .dash-template-item .status.active { background: rgba(34,197,94,0.1); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
        .dash-intents { display: flex; flex-wrap: wrap; gap: 6px; }
        .dash-intent-chip { background: var(--s2); padding: 4px 12px; border-radius: 99px; font-size: 0.68rem; color: var(--muted); border: 1px solid var(--border); cursor: default; transition: all 0.15s; }
        .dash-intent-chip:hover { border-color: var(--red-border); color: var(--red); background: var(--red-dim); }
        .dash-settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .dash-setting { background: var(--s2); border-radius: 10px; padding: 10px 13px; text-align: center; border: 1px solid var(--border); }
        .dash-setting .val { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 600; color: var(--text); }
        .dash-setting .label { font-size: 0.55rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .dash-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .dash-btn { background: var(--s2); border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 6px; }
        .dash-btn:hover { border-color: var(--border-b); color: var(--text); background: var(--s3); }
        .dash-btn.primary { background: var(--red); color: white; border-color: var(--red); box-shadow: 0 0 12px var(--red-glow); }
        .dash-btn.primary:hover { background: #c8050f; }

        /* ─── TOAST ─── */
        .toast-msg { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--s2); border: 1px solid var(--border); color: var(--text); padding: 10px 22px; border-radius: 99px; z-index: 2000; display: none; font-size: 0.78rem; font-weight: 500; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }

        /* ─── MODALS ─── */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 3000; opacity: 0; visibility: hidden; transition: 0.2s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: var(--s1); border: 1px solid var(--border-b); border-radius: 20px; max-width: 460px; width: 92%; max-height: 85vh; overflow-y: auto; padding: 24px 26px; box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
        .modal-header h3 { font-family: 'Space Grotesk', sans-serif; color: var(--text); font-size: 1rem; font-weight: 600; }
        .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); line-height: 1; }
        .modal-close:hover { color: var(--text); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.68rem; font-weight: 600; margin-bottom: 5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .form-control { width: 100%; padding: 9px 13px; border: 1px solid var(--border); border-radius: 9px; background: var(--s2); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.83rem; outline: none; transition: border-color 0.15s; }
        .form-control:focus { border-color: var(--red-border); box-shadow: 0 0 0 3px var(--red-dim); }
        .form-control option { background: var(--s2); }
        textarea.form-control { min-height: 80px; resize: vertical; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }
        .btn { padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 0.78rem; cursor: pointer; border: 1px solid transparent; font-family: 'Inter', sans-serif; transition: all 0.15s; }
        .btn-secondary { background: var(--s2); color: var(--muted); border-color: var(--border); }
        .btn-secondary:hover { background: var(--s3); color: var(--text); }
        .btn-primary { background: var(--red); color: white; box-shadow: 0 0 14px var(--red-glow); }
        .btn-primary:hover { background: #c8050f; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 820px) { .sidebar { width: 260px; min-width: 220px; } .messages-area { padding: 12px 14px 8px 14px; } .dashboard-overlay { width: 100vw; max-width: 100vw; } }
        @media (max-width: 600px) { .sidebar { width: 100%; max-width: 100%; border-right: none; border-bottom: 1px solid var(--border); } .app { flex-direction: column; } .message-row { max-width: 88%; } .messages-area { padding: 8px 10px; } }
    </style>
</head>
<body>
<div class="app" id="app">

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="fab fa-whatsapp"></i></div>
                <div>Concierge <div class="brand-sub">whatsapp admin</div></div>
            </div>
            <div class="sidebar-actions">
                <button class="icon-btn" id="toggleDashBtn" title="Analytics" onclick="toggleDashboard()"><i class="fas fa-chart-pie"></i></button>
                <button class="icon-btn" onclick="refreshAllData()" title="Refresh"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>
        <div class="search-bar">
            <div class="search-inner">
                <i class="fas fa-search"></i>
                <input type="text" id="chatSearch" placeholder="Search conversations…" oninput="filterChats()" />
            </div>
        </div>
        <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main">
        <div class="chat-header" id="chatHeader">
            <div class="left">
                <div class="ch-avatar" id="chatAvatar">?</div>
                <div>
                    <div class="ch-name" id="chatContactName">Select a conversation</div>
                    <div class="ch-status" id="chatStatus"><span class="online-dot"></span> online</div>
                </div>
            </div>
            <div class="right">
                <button class="icon-btn" title="Call"><i class="fas fa-phone"></i></button>
                <button class="icon-btn" title="Video"><i class="fas fa-video"></i></button>
                <button class="icon-btn" title="More"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </div>
        <div class="messages-area" id="messagesArea">
            <div class="empty-state"><i class="fab fa-whatsapp"></i><span>Select a conversation to start</span></div>
        </div>
        <div class="input-bar">
            <button class="emoji-btn"><i class="far fa-smile"></i></button>
            <input type="text" id="messageInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter') sendMessage()" />
            <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </main>
</div>

<!-- DASHBOARD OVERLAY -->
<div class="dashboard-overlay" id="dashboardOverlay">
    <div class="dash-header">
        <h2><i class="fas fa-chart-pie"></i> Analytics</h2>
        <button class="dash-close" onclick="toggleDashboard()">&times;</button>
    </div>
    <div class="dash-kpi-grid" id="dashKpiGrid"></div>
    <div class="dash-section"><h3>Conversation Volume</h3><div class="dash-chart-wrap"><canvas id="dashVolumeChart"></canvas></div></div>
    <div class="dash-section"><h3>Intent Distribution</h3><div class="dash-chart-wrap"><canvas id="dashIntentChart"></canvas></div></div>
    <div class="dash-section"><h3>AI Performance</h3><div class="dash-chart-wrap"><canvas id="dashAiChart"></canvas></div></div>
    <div class="dash-section">
        <h3>Templates</h3>
        <div class="dash-templates" id="dashTemplatesList"></div>
        <div class="dash-actions" style="margin-top:10px;"><button class="dash-btn primary" onclick="openTemplateModal()"><i class="fas fa-plus"></i> Add Template</button></div>
    </div>
    <div class="dash-section">
        <h3>AI Intents</h3>
        <div class="dash-intents" id="dashIntentsList"></div>
        <div class="dash-actions" style="margin-top:10px;"><button class="dash-btn primary" onclick="openIntentModal()"><i class="fas fa-plus"></i> Add Intent</button></div>
    </div>
    <div class="dash-section">
        <h3>AI Settings</h3>
        <div class="dash-settings-grid" id="dashSettingsGrid"></div>
        <div class="dash-actions" style="margin-top:10px;"><button class="dash-btn" onclick="openAISettingsModal()"><i class="fas fa-edit"></i> Edit Settings</button></div>
    </div>
</div>

<!-- MODALS -->
<div id="templateModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><h3 id="templateModalTitle">Add Template</h3><button class="modal-close" onclick="closeTemplateModal()">&times;</button></div>
        <div class="form-group"><label>Template Name</label><input type="text" id="templateName" class="form-control" placeholder="e.g., welcome_message" /></div>
        <div class="form-group"><label>Template Key</label><input type="text" id="templateKey" class="form-control" placeholder="welcome" /></div>
        <div class="form-group"><label>Content</label><textarea id="templateContent" class="form-control" placeholder="Welcome! How can I help?"></textarea></div>
        <div class="form-group"><label>Status</label><select id="templateStatus" class="form-control"><option value="true">Active</option><option value="false">Inactive</option></select></div>
        <div class="modal-buttons"><button class="btn btn-secondary" onclick="closeTemplateModal()">Cancel</button><button class="btn btn-primary" onclick="saveTemplate()">Save</button></div>
    </div>
</div>
<div id="intentModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><h3 id="intentModalTitle">Add Intent</h3><button class="modal-close" onclick="closeIntentModal()">&times;</button></div>
        <div class="form-group"><label>Intent Name</label><input type="text" id="intentName" class="form-control" placeholder="e.g., order_status" /></div>
        <div class="form-group"><label>Description</label><textarea id="intentDescription" class="form-control" placeholder="What does this intent handle?"></textarea></div>
        <div class="modal-buttons"><button class="btn btn-secondary" onclick="closeIntentModal()">Cancel</button><button class="btn btn-primary" onclick="saveIntent()">Save</button></div>
    </div>
</div>
<div id="aiSettingsModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header"><h3>AI Settings</h3><button class="modal-close" onclick="closeAISettingsModal()">&times;</button></div>
        <div class="form-group"><label>Model</label><select id="aiModel" class="form-control"><option value="claude">Claude</option><option value="gpt-4">GPT-4</option><option value="llama">Llama</option></select></div>
        <div class="form-group"><label>Temperature (0–1)</label><input type="number" id="aiTemperature" step="0.1" min="0" max="1" class="form-control" value="0.3" /></div>
        <div class="form-group"><label>Max Tokens</label><input type="number" id="aiMaxTokens" class="form-control" value="500" /></div>
        <div class="form-group"><label>Enable AI</label><select id="aiEnable" class="form-control"><option value="true">Enabled</option><option value="false">Disabled</option></select></div>
        <div class="modal-buttons"><button class="btn btn-secondary" onclick="closeAISettingsModal()">Cancel</button><button class="btn btn-primary" onclick="saveAISettings()">Save</button></div>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    let charts = {}, currentEditingTemplate = null, currentEditingIntent = null, selectedPhone = null;
    let allConversations = [], allAIRequests = [], allSessions = [], allTemplates = [], allIntents = [], aiSettings = {};

    window.showToast = function(msg, isError = false) {
        const t = document.getElementById('toastMsg');
        t.textContent = msg;
        t.style.background = isError ? 'rgba(220,38,38,0.9)' : 'var(--s2)';
        t.style.borderColor = isError ? 'rgba(220,38,38,0.3)' : 'var(--border)';
        t.style.display = 'block';
        clearTimeout(t._h);
        t._h = setTimeout(() => t.style.display = 'none', 2800);
    };

    function esc(s) { if (!s) return ''; return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function fmtTime(iso) { if (!iso) return ''; return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
    function fmtDate(iso) {
        if (!iso) return '';
        const d = new Date(iso), n = new Date();
        if (d.toDateString() === n.toDateString()) return fmtTime(iso);
        if ((n-d)/86400000 < 7) return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
        return d.toLocaleDateString([], {month:'short', day:'numeric'});
    }
    function initials(p) { return p ? (p.replace(/[^a-zA-Z0-9]/g,'').slice(-4) || '?') : '?'; }

    async function loadConversations() { try { const {data,error} = await supabase.from('whatsapp_conversations').select('*').order('created_at',{ascending:false}).limit(300); if(error) throw error; allConversations = data||[]; } catch(e) { allConversations=[]; } }
    async function loadAIRequests() { try { const {data,error} = await supabase.from('ai_requests').select('*').order('created_at',{ascending:false}).limit(300); if(error) throw error; allAIRequests = data||[]; } catch(e) { allAIRequests=[]; } }
    async function loadActiveSessions() { try { const {data,error} = await supabase.from('conversation_sessions').select('*').order('last_message_at',{ascending:false}).limit(50); if(error) throw error; allSessions = data||[]; } catch(e) { allSessions=[]; } }
    async function loadTemplates() { try { const {data,error} = await supabase.from('whatsapp_templates').select('*').order('template_name'); if(error) throw error; allTemplates = data||[]; } catch(e) { allTemplates=[]; } }
    async function loadIntents() { try { const {data,error} = await supabase.from('ai_intents').select('*').order('intent_name'); if(error) throw error; allIntents = data||[]; } catch(e) { allIntents=[]; } }
    async function loadAISettings() { try { const {data,error} = await supabase.from('ai_settings').select('*').eq('id','default').maybeSingle(); if(error) throw error; aiSettings = data||{model:'claude',temperature:0.3,max_tokens:500,enable_ai:true}; } catch(e) { aiSettings={model:'claude',temperature:0.3,max_tokens:500,enable_ai:true}; } }

    function groupByPhone(convs) {
        const map = new Map();
        for (const c of convs) { const k = c.phone||'unknown'; if (!map.has(k)) map.set(k,[]); map.get(k).push(c); }
        for (const [k,v] of map) v.sort((a,b) => new Date(a.created_at)-new Date(b.created_at));
        return map;
    }

    function renderChatList(filter='') {
        const container = document.getElementById('chatList');
        const grouped = groupByPhone(allConversations);
        const phones = Array.from(grouped.keys()).sort((a,b) => {
            const al = grouped.get(a).slice(-1)[0]?.created_at||'', bl = grouped.get(b).slice(-1)[0]?.created_at||'';
            return new Date(bl)-new Date(al);
        });
        const s = filter.toLowerCase().trim();
        const filtered = s ? phones.filter(p => p.toLowerCase().includes(s) || grouped.get(p).some(c=>(c.message||'').toLowerCase().includes(s))) : phones;
        if (!filtered.length) { container.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:0.82rem;">No conversations found</div>`; return; }
        container.innerHTML = filtered.map(phone => {
            const msgs = grouped.get(phone), last = msgs.slice(-1)[0];
            const unread = msgs.filter(m=>m.direction==='inbound'&&!m.read).length;
            const online = !!allSessions.find(s=>s.phone===phone);
            const preview = last?.message ? esc(last.message.slice(0,55)) : 'No messages';
            const intent = last?.intent||'general';
            return `<div class="chat-item ${phone===selectedPhone?'active':''}" onclick="selectConversation('${esc(phone)}')">
                <div class="chat-avatar">${initials(phone)}<span class="status-dot ${online?'':'offline'}"></span></div>
                <div class="chat-info">
                    <div class="name"><span>${esc(phone)}</span><span class="time">${fmtDate(last?.created_at)}</span></div>
                    <div class="last-msg"><span>${preview}</span><span style="display:flex;gap:5px;align-items:center;flex-shrink:0;"><span class="intent-tag">${esc(intent)}</span>${unread>0?`<span class="badge">${unread}</span>`:''}</span></div>
                </div></div>`;
        }).join('');
    }

    window.selectConversation = function(phone) { selectedPhone=phone; renderChatList(document.getElementById('chatSearch').value); renderChatMessages(phone); updateChatHeader(phone); };

    function updateChatHeader(phone) {
        document.getElementById('chatContactName').textContent = phone||'Select a conversation';
        document.getElementById('chatAvatar').textContent = initials(phone);
        const online = !!allSessions.find(s=>s.phone===phone);
        document.getElementById('chatStatus').innerHTML = `<span class="online-dot" style="background:${online?'var(--green)':'var(--dim)'};box-shadow:${online?'0 0 5px var(--green)':'none'}"></span> ${online?'online':'last seen recently'}`;
    }

    function renderChatMessages(phone) {
        const area = document.getElementById('messagesArea');
        if (!phone) { area.innerHTML=`<div class="empty-state"><i class="fab fa-whatsapp"></i><span>Select a conversation to start</span></div>`; return; }
        const msgs = groupByPhone(allConversations).get(phone)||[];
        if (!msgs.length) { area.innerHTML=`<div class="empty-state"><i class="far fa-comment-dots"></i><span>No messages yet</span></div>`; return; }
        let html='', lastDate='';
        for (const m of msgs) {
            const date = new Date(m.created_at).toDateString();
            if (date!==lastDate) { html+=`<div class="message-divider"><span>${new Date(m.created_at).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</span></div>`; lastDate=date; }
            const isIn = m.direction==='inbound';
            html+=`<div class="message-row ${isIn?'incoming':'outgoing'}"><div class="message-bubble">${esc(m.message||'')}${m.intent?`<span class="intent-tag">${esc(m.intent)}</span>`:''}<span class="time">${fmtTime(m.created_at)}</span></div></div>`;
        }
        area.innerHTML=html; area.scrollTop=area.scrollHeight;
    }

    window.sendMessage = async function() {
        const input=document.getElementById('messageInput'), text=input.value.trim();
        if (!text||!selectedPhone) { if (!selectedPhone) showToast('Select a conversation first',true); return; }
        const btn=document.getElementById('sendBtn'); btn.disabled=true;
        try {
            const {error}=await supabase.from('whatsapp_conversations').insert({phone:selectedPhone,message:text,direction:'outbound',intent:'manual',created_at:new Date().toISOString()});
            if (error) throw error;
            input.value=''; await loadConversations(); renderChatList(document.getElementById('chatSearch').value); renderChatMessages(selectedPhone); showToast('Message sent');
        } catch(e) { showToast(e.message,true); }
        btn.disabled=false;
    };

    window.filterChats = function() { renderChatList(document.getElementById('chatSearch').value); };

    window.toggleDashboard = function() {
        const o=document.getElementById('dashboardOverlay'); o.classList.toggle('open');
        document.getElementById('toggleDashBtn').classList.toggle('active-toggle', o.classList.contains('open'));
        if (o.classList.contains('open')) renderDashboard();
    };

    const C = { grid:'rgba(255,255,255,0.04)', tick:'#52525b', legend:'#71717a' };

    function renderDashboard() {
        const totalMsgs=allConversations.length, uniqueUsers=new Set(allConversations.map(c=>c.phone)).size;
        const aiSuccess=allAIRequests.length?(allAIRequests.filter(r=>r.success).length/allAIRequests.length*100):0;
        document.getElementById('dashKpiGrid').innerHTML=`<div class="dash-kpi"><div class="val">${totalMsgs}</div><div class="label">Total Messages</div></div><div class="dash-kpi"><div class="val">${uniqueUsers}</div><div class="label">Unique Users</div></div><div class="dash-kpi"><div class="val">${Math.round(aiSuccess)}%</div><div class="label">AI Success</div></div><div class="dash-kpi"><div class="val">${allSessions.length}</div><div class="label">Active Chats</div></div>`;

        const last30=[...Array(30)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return d.toISOString().split('T')[0];}).reverse();
        const volData=last30.map(day=>allConversations.filter(c=>c.created_at?.startsWith(day)).length);
        const ctxV=document.getElementById('dashVolumeChart').getContext('2d');
        if(charts.vol) charts.vol.destroy();
        charts.vol=new Chart(ctxV,{type:'line',data:{labels:last30.map(d=>d.slice(5)),datasets:[{label:'Messages',data:volData,borderColor:'#E30613',backgroundColor:'rgba(227,6,19,0.06)',fill:true,tension:0.3,pointRadius:1,pointHoverRadius:4}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{color:C.legend,boxWidth:10,font:{size:10}}}},scales:{x:{ticks:{color:C.tick,maxTicksLimit:10,font:{size:9}},grid:{color:C.grid}},y:{ticks:{color:C.tick,stepSize:1,font:{size:9}},grid:{color:C.grid}}}}});

        const ic={};allAIRequests.forEach(r=>{const i=r.intent||'unknown';ic[i]=(ic[i]||0)+1;});
        const sorted=Object.entries(ic).sort((a,b)=>b[1]-a[1]);
        const ctxI=document.getElementById('dashIntentChart').getContext('2d');
        if(charts.intent) charts.intent.destroy();
        charts.intent=new Chart(ctxI,{type:'doughnut',data:{labels:sorted.map(i=>i[0].replace(/_/g,' ').toUpperCase()),datasets:[{data:sorted.map(i=>i[1]),backgroundColor:['#E30613','#f59e0b','#22c55e','#8b5cf6','#06b6d4','#f97316'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{color:C.legend,boxWidth:10,font:{size:10}}}}}});

        const succ=allAIRequests.filter(r=>r.success).length,fail=allAIRequests.length-succ;
        const ctxA=document.getElementById('dashAiChart').getContext('2d');
        if(charts.ai) charts.ai.destroy();
        charts.ai=new Chart(ctxA,{type:'doughnut',data:{labels:['Successful','Failed'],datasets:[{data:[succ,fail],backgroundColor:['#22c55e','#E30613'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{color:C.legend,boxWidth:10,font:{size:10}}}}}});

        document.getElementById('dashTemplatesList').innerHTML=allTemplates.slice(0,6).map(t=>`<div class="dash-template-item"><span class="name">${esc(t.template_name||t.template_key)}</span><span class="status ${t.active?'active':''}">${t.active?'Active':'Inactive'}</span></div>`).join('')||'<div style="color:var(--muted);font-size:0.75rem;">No templates</div>';
        document.getElementById('dashIntentsList').innerHTML=allIntents.slice(0,12).map(i=>`<span class="dash-intent-chip">${esc(i.intent_name)}</span>`).join('')||'<span style="color:var(--muted);font-size:0.75rem;">No intents</span>';
        const s=aiSettings;
        document.getElementById('dashSettingsGrid').innerHTML=`<div class="dash-setting"><div class="val">${s.model||'claude'}</div><div class="label">Model</div></div><div class="dash-setting"><div class="val">${s.temperature||0.3}</div><div class="label">Temperature</div></div><div class="dash-setting"><div class="val">${s.max_tokens||500}</div><div class="label">Max Tokens</div></div><div class="dash-setting"><div class="val" style="color:${s.enable_ai?'#22c55e':'#E30613'}">${s.enable_ai?'ON':'OFF'}</div><div class="label">AI Status</div></div>`;
    }

    window.refreshAllData = async function() {
        showToast('Refreshing…');
        await Promise.all([loadConversations(),loadAIRequests(),loadActiveSessions(),loadTemplates(),loadIntents(),loadAISettings()]);
        renderChatList(document.getElementById('chatSearch').value);
        if (selectedPhone) { renderChatMessages(selectedPhone); updateChatHeader(selectedPhone); }
        if (document.getElementById('dashboardOverlay').classList.contains('open')) renderDashboard();
        showToast('Data refreshed');
    };

    window.openTemplateModal=(id=null)=>{currentEditingTemplate=id;document.getElementById('templateModalTitle').innerText=id?'Edit Template':'Add Template';if(id&&allTemplates){const t=allTemplates.find(tm=>tm.id===id);if(t){document.getElementById('templateName').value=t.template_name||'';document.getElementById('templateKey').value=t.template_key||'';document.getElementById('templateContent').value=t.content||'';document.getElementById('templateStatus').value=t.active?'true':'false';}}else{['templateName','templateKey','templateContent'].forEach(i=>document.getElementById(i).value='');document.getElementById('templateStatus').value='true';}document.getElementById('templateModal').classList.add('active');};
    window.closeTemplateModal=()=>document.getElementById('templateModal').classList.remove('active');
    window.saveTemplate=async()=>{const name=document.getElementById('templateName').value.trim(),key=document.getElementById('templateKey').value.trim(),content=document.getElementById('templateContent').value.trim(),active=document.getElementById('templateStatus').value==='true';if(!name||!key||!content){showToast('Name, key and content required',true);return;}try{if(currentEditingTemplate)await supabase.from('whatsapp_templates').update({template_name:name,template_key:key,content,active,updated_at:new Date()}).eq('id',currentEditingTemplate);else await supabase.from('whatsapp_templates').insert({template_key:key,template_name:name,content,active});showToast(currentEditingTemplate?'Template updated':'Template added');closeTemplateModal();await loadTemplates();if(document.getElementById('dashboardOverlay').classList.contains('open'))renderDashboard();}catch(e){showToast(e.message,true);}};

    window.openIntentModal=(id=null)=>{currentEditingIntent=id;document.getElementById('intentModalTitle').innerText=id?'Edit Intent':'Add Intent';if(id&&allIntents){const i=allIntents.find(it=>it.id===id);if(i){document.getElementById('intentName').value=i.intent_name;document.getElementById('intentDescription').value=i.description||'';}}else{document.getElementById('intentName').value='';document.getElementById('intentDescription').value='';}document.getElementById('intentModal').classList.add('active');};
    window.closeIntentModal=()=>document.getElementById('intentModal').classList.remove('active');
    window.saveIntent=async()=>{const name=document.getElementById('intentName').value.trim().toLowerCase().replace(/ /g,'_'),description=document.getElementById('intentDescription').value.trim();if(!name){showToast('Intent name required',true);return;}try{if(currentEditingIntent)await supabase.from('ai_intents').update({intent_name:name,description,updated_at:new Date()}).eq('id',currentEditingIntent);else await supabase.from('ai_intents').insert({intent_name:name,description,active:true});showToast(currentEditingIntent?'Intent updated':'Intent added');closeIntentModal();await loadIntents();if(document.getElementById('dashboardOverlay').classList.contains('open'))renderDashboard();}catch(e){showToast(e.message,true);}};

    window.openAISettingsModal=()=>{const s=aiSettings;document.getElementById('aiModel').value=s.model||'claude';document.getElementById('aiTemperature').value=s.temperature||0.3;document.getElementById('aiMaxTokens').value=s.max_tokens||500;document.getElementById('aiEnable').value=s.enable_ai?'true':'false';document.getElementById('aiSettingsModal').classList.add('active');};
    window.closeAISettingsModal=()=>document.getElementById('aiSettingsModal').classList.remove('active');
    window.saveAISettings=async()=>{const model=document.getElementById('aiModel').value,temperature=parseFloat(document.getElementById('aiTemperature').value),maxTokens=parseInt(document.getElementById('aiMaxTokens').value),enableAi=document.getElementById('aiEnable').value==='true';try{await supabase.from('ai_settings').upsert({id:'default',model,temperature,max_tokens:maxTokens,enable_ai:enableAi,updated_at:new Date()});showToast('AI settings saved');closeAISettingsModal();await loadAISettings();if(document.getElementById('dashboardOverlay').classList.contains('open'))renderDashboard();}catch(e){showToast(e.message,true);}};

    setInterval(()=>{loadConversations();loadAIRequests();loadActiveSessions();},30000);

    async function init() {
        await Promise.all([loadConversations(),loadAIRequests(),loadActiveSessions(),loadTemplates(),loadIntents(),loadAISettings()]);
        renderChatList('');
        const phones=Array.from(groupByPhone(allConversations).keys());
        if(phones.length){selectedPhone=phones[0];renderChatMessages(selectedPhone);updateChatHeader(selectedPhone);renderChatList('');}
        window.allConversations=allConversations;window.allAIRequests=allAIRequests;window.allSessions=allSessions;window.allTemplates=allTemplates;window.allIntents=allIntents;window.aiSettings=aiSettings;
    }
    init();
    console.log('WhatsApp Concierge dark theme ready');
</script>
</body>
</html>
