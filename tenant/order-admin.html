<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Manager (Embedded)</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/vue@2/dist/vue.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: transparent;
      padding: 0;
      margin: 0;
    }
    .iframe-module {
      width: 100%;
      background: #f5f7fb;
      padding: 20px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border: 1px solid #edf2f7;
    }
    .stat-card i { font-size: 2rem; color: #E30613; margin-bottom: 12px; }
    .stat-card .number { font-size: 2rem; font-weight: 800; color: #1e293b; }
    .stat-card .label { color: #8A8A9A; font-size: 0.8rem; margin-top: 4px; }
    .add-product-panel {
      background: white;
      border-radius: 32px;
      padding: 28px;
      margin-bottom: 32px;
      border: 1px solid #edf2f7;
    }
    .add-product-panel h2 { margin-bottom: 20px; font-size: 1.3rem; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .form-grid input, .form-grid select {
      padding: 12px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 60px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
    }
    .form-grid input:focus, .form-grid select:focus { border-color: #E30613; }
    .image-upload-row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: #FAFAFA;
      padding: 16px;
      border-radius: 24px;
    }
    .image-preview { width: 60px; height: 60px; border-radius: 16px; object-fit: cover; background: #e0e0e0; }
    .checkbox-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .btn {
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: #E30613; color: white; }
    .btn-primary:hover { background: #B5040F; transform: translateY(-2px); }
    .btn-danger { background: #dc2626; color: white; }
    .btn-secondary { background: #F5F2EE; color: #0D0D0D; border: 1px solid #e0e0e0; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    .products-table {
      background: white;
      border-radius: 32px;
      overflow-x: auto;
      border: 1px solid #edf2f7;
    }
    .products-table-header {
      display: grid;
      grid-template-columns: 60px 1.5fr 2fr 100px 120px 80px 90px 60px;
      background: #fafcff;
      padding: 16px 20px;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #8A8A9A;
      border-bottom: 1px solid #edf2f7;
    }
    .product-row {
      display: grid;
      grid-template-columns: 60px 1.5fr 2fr 100px 120px 80px 90px 60px;
      padding: 12px 20px;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
      gap: 8px;
    }
    .product-row:hover { background: #FEF5F5; }
    .image-thumb { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; cursor: pointer; }
    .search-bar {
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-bar input {
      flex: 1;
      padding: 14px 20px;
      border: 1.5px solid #e0e0e0;
      border-radius: 60px;
      background: white;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #0D0D0D;
      color: white;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 600;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #059669; }
    .toast.error { background: #E30613; }
  </style>
</head>
<body>
<div class="iframe-module">
  <div id="adminApp">
    <div class="stats-grid">
      <div class="stat-card"><i class="fas fa-utensils"></i><div class="number">{{ products.length }}</div><div class="label">Total Products</div></div>
      <div class="stat-card"><i class="fas fa-wine-bottle"></i><div class="number">{{ alcoholCount }}</div><div class="label">Alcohol Items</div></div>
      <div class="stat-card"><i class="fas fa-droplet"></i><div class="number">{{ nonAlcoholCount }}</div><div class="label">Non-Alcohol</div></div>
      <div class="stat-card"><i class="fas fa-drumstick-bite"></i><div class="number">{{ butcherCount }}</div><div class="label">Butcher Items</div></div>
    </div>

    <div class="add-product-panel">
      <h2><i class="fas fa-plus-circle"></i> Add New Product with Image</h2>
      <div class="form-grid">
        <input type="text" v-model="newProduct.name" placeholder="Product name">
        <input type="text" v-model="newProduct.description" placeholder="Description">
        <input type="number" v-model="newProduct.price" placeholder="Price (R)">
        <select v-model="newProduct.category">
          <option value="beer">Beer</option><option value="wine">Wine</option><option value="rum">Rum</option>
          <option value="vodka">Vodka</option><option value="cognac">Cognac</option><option value="tequila">Tequila</option>
          <option value="whisky">Whisky</option><option value="non-alc">Non-Alcoholic</option><option value="butcher">The Butcher</option>
        </select>
      </div>
      <div class="image-upload-row">
        <label class="btn-secondary" style="background:#F0F0F0; margin:0;">
          <i class="fas fa-cloud-upload-alt"></i> Upload Image
          <input type="file" accept="image/*" @change="handleNewProductImage" style="display:none;">
        </label>
        <input type="text" v-model="newProduct.image" placeholder="Or paste image URL" style="flex:1; border-radius:60px;">
        <div v-if="newProduct.imagePreview" style="display:flex; align-items:center; gap:10px;">
          <img :src="newProduct.imagePreview" class="image-preview" alt="preview">
          <button class="btn-danger btn-sm" @click="clearNewProductImage" style="padding:4px 12px;">✕</button>
        </div>
        <span v-else style="color:#aaa; font-size:12px;">🏞️ PNG / JPG will be stored as base64</span>
      </div>
      <div class="checkbox-row"><label><input type="checkbox" v-model="newProduct.alcohol"> Contains Alcohol</label></div>
      <button class="btn btn-primary" @click="addProduct">+ Add Product</button>
    </div>

    <div class="search-bar">
      <i class="fas fa-search" style="color:#8A8A9A;"></i>
      <input type="text" v-model="searchQuery" placeholder="Search products...">
      <button class="btn btn-secondary" @click="refreshData"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div class="products-table">
      <div class="products-table-header">
        <span>ID</span><span>Name</span><span>Description</span><span>Price</span><span>Category</span><span>🍷</span><span>Image</span><span>Actions</span>
      </div>
      <div v-for="product in filteredProducts" :key="product.id" class="product-row">
        <span>{{ product.id }}</span>
        <input type="text" v-model="product.name" @change="saveProducts">
        <input type="text" v-model="product.description" @change="saveProducts">
        <input type="number" v-model="product.price" @change="saveProducts" step="1">
        <select v-model="product.category" @change="saveProducts">
          <option value="beer">Beer</option><option value="wine">Wine</option><option value="rum">Rum</option>
          <option value="vodka">Vodka</option><option value="cognac">Cognac</option><option value="tequila">Tequila</option>
          <option value="whisky">Whisky</option><option value="non-alc">Non-Alc</option><option value="butcher">Butcher</option>
        </select>
        <label style="display:flex;align-items:center;"><input type="checkbox" v-model="product.alcohol" @change="saveProducts"> 🍷</label>
        <div class="image-upload-inline">
          <img :src="product.imageURLForPreview" class="image-thumb" @click="triggerImageUploadForProduct(product)" title="Click to change image">
          <button @click="openImageUrlDialog(product)" class="btn-sm" style="background:#2c3e50;">URL</button>
          <input type="file" accept="image/*" :ref="'fileInput'+product.id" style="display:none;" @change="handleProductImageChange($event, product)">
        </div>
        <div class="action-buttons">
          <button class="btn btn-danger" style="padding:6px 12px; font-size:0.75rem;" @click="deleteProduct(product.id)"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    </div>
    <div class="toast" :class="[toast.type, { show: toast.visible }]">{{ toast.text }}</div>
  </div>
</div>

<script>
const DEFAULT_PRODUCTS = [/* same as original */];
new Vue({
  el: '#adminApp',
  data() {
    return {
      products: [],
      searchQuery: '',
      newProduct: { name: '', description: '', price: 0, category: 'beer', alcohol: false, image: '', imagePreview: null },
      toast: { visible: false, text: '', type: '' },
      toastTimer: null
    };
  },
  computed: {
    filteredProducts() { /* same */ },
    alcoholCount() { return this.products.filter(p => p.alcohol).length; },
    nonAlcoholCount() { return this.products.filter(p => !p.alcohol && p.category !== 'butcher').length; },
    butcherCount() { return this.products.filter(p => p.category === 'butcher').length; }
  },
  mounted() { this.loadProducts(); },
  methods: {
    showToast(text, type) { /* same */ },
    loadProducts() { /* same */ },
    getValidImageUrl(img) { /* same */ },
    saveProducts(silent) { /* same */ },
    handleNewProductImage(e) { /* same */ },
    clearNewProductImage() { /* same */ },
    triggerImageUploadForProduct(product) { /* same */ },
    handleProductImageChange(e, product) { /* same */ },
    openImageUrlDialog(product) { /* same */ },
    addProduct() { /* same */ },
    deleteProduct(id) { /* same */ },
    refreshData() { this.loadProducts(); this.showToast('Data refreshed', 'info'); }
  }
});
</script>
</body>
</html>
