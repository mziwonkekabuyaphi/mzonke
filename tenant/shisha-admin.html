<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Shisha Lounge · Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/shisha-admin.css">
</head>
<body>
<div class="app" id="app">

    <!-- Header -->
    <div class="main-header">
        <h2><i class="fas fa-smoking"></i> Shisha Lounge</h2>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleDashboard()" id="toggleDashBtn" title="Analytics"><i class="fas fa-chart-pie"></i></button>
            <button class="icon-btn" onclick="refreshAllData()" title="Refresh"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="tabs">
            <button class="tab-btn active" data-tab="flavours"><i class="fas fa-leaf"></i> Flavours</button>
            <button class="tab-btn" data-tab="devices"><i class="fas fa-fire"></i> Hookah Devices</button>
            <button class="tab-btn" data-tab="locations"><i class="fas fa-map-marker-alt"></i> Shisha Stations</button>
            <button class="tab-btn" data-tab="sessions"><i class="fas fa-hourglass-half"></i> Active Sessions</button>
        </div>

        <!-- FLAVOURS PANEL -->
        <div id="flavoursPanel" class="panel active">
            <div class="section-title"><i class="fas fa-leaf"></i> Shisha Flavours</div>
            <div class="add-form">
                <input type="text" id="newFlavourName" placeholder="Flavour name (e.g., Double Apple)">
                <input type="number" id="newFlavourPrice" placeholder="Price (R)" value="250" step="10">
                <button id="addFlavourBtn"><i class="fas fa-plus"></i> Add Flavour</button>
            </div>
            <div id="flavoursList" class="items-grid">Loading...</div>
        </div>

        <!-- DEVICES PANEL -->
        <div id="devicesPanel" class="panel">
            <div class="section-title"><i class="fas fa-fire"></i> Hookah Devices</div>
            <div class="add-form">
                <input type="text" id="newDeviceCode" placeholder="Device code (e.g., SH-031)">
                <select id="newDeviceStatus">
                    <option value="available">Available</option>
                    <option value="maintenance">Maintenance</option>
                </select>
                <button id="addDeviceBtn"><i class="fas fa-plus"></i> Add Custom Device</button>
            </div>
            <div id="devicesList" class="items-grid">Loading...</div>
        </div>

        <!-- LOCATIONS PANEL -->
        <div id="locationsPanel" class="panel">
            <div class="section-title"><i class="fas fa-map-marker-alt"></i> Shisha Stations</div>
            <div class="add-form">
                <input type="text" id="newLocationName" placeholder="Shisha Station name (e.g., VIP Terrace)">
                <button id="addLocationBtn"><i class="fas fa-plus"></i> Add Shisha Station</button>
            </div>
            <div id="locationsList" class="items-grid">Loading...</div>
        </div>

        <!-- SESSIONS PANEL -->
        <div id="sessionsPanel" class="panel">
            <div class="section-title"><i class="fas fa-hourglass-half"></i> Active Sessions</div>
            <div id="sessionsList" class="loading-state">Loading active sessions...</div>
        </div>
    </div>

    <!-- Dashboard Overlay -->
    <div class="dashboard-overlay" id="dashboardOverlay">
        <div class="dash-header">
            <h2><i class="fas fa-chart-pie"></i> Shisha Analytics</h2>
            <button class="dash-close" onclick="toggleDashboard()">&times;</button>
        </div>
        <!-- KPIs -->
        <div class="dash-kpi-grid" id="dashKpiGrid"></div>
        <!-- Revenue Trend -->
        <div class="dash-section">
            <h3>Revenue Trend</h3>
            <div class="dash-chart-wrap"><canvas id="dashRevenueChart"></canvas></div>
        </div>
        <!-- Session Status -->
        <div class="dash-section">
            <h3>Session Status</h3>
            <div class="dash-chart-wrap"><canvas id="dashSessionChart"></canvas></div>
        </div>
        <!-- Hookah Utilization -->
        <div class="dash-section">
            <h3>Hookah Utilization</h3>
            <div class="dash-chart-wrap"><canvas id="dashUtilChart"></canvas></div>
        </div>
        <!-- Top Flavours -->
        <div class="dash-section">
            <h3>Top Flavours</h3>
            <div id="dashTopFlavours" style="max-height:150px;overflow:auto;"></div>
        </div>
        <!-- Alerts -->
        <div class="dash-section">
            <h3>Alerts</h3>
            <div id="dashAlerts"></div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="confirmationModal" class="custom-modal-overlay">
        <div class="custom-modal">
            <i class="fas fa-exclamation-triangle"></i>
            <h3 id="modalTitle">Confirm Action</h3>
            <p id="modalMessage">Are you sure?</p>
            <div class="custom-modal-buttons">
                <button id="modalCancelBtn" class="custom-modal-btn cancel">Cancel</button>
                <button id="modalConfirmBtn" class="custom-modal-btn confirm">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
</div>

<script type="module" src="js/shisha-admin.js"></script>
</body>
</html>
