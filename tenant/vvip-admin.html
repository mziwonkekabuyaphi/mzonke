<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>VVIP Console | Admin Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ========== BASE STYLES (unchanged structure) ========== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
body {
    background: transparent;
    color: #1e293b;
    padding: 0;
    min-height: 100vh;
}
.admin-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
}
.admin-tabs {
    display: flex;
    gap: 6px;
    background: #f1f5f9;
    border-radius: 60px;
    padding: 5px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}
.admin-tab {
    padding: 10px 20px;
    background: none;
    border: none;
    color: #475569;
    cursor: pointer;
    font-weight: 600;
    border-radius: 40px;
    transition: 0.2s;
    font-size: 13px;
}
.admin-tab.active {
    background: #E30613;
    color: white;
}
.admin-tab-content {
    display: none;
    animation: fadeIn 0.3s ease;
}
.admin-tab-content.active {
    display: block;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
.dashboard-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}
.stat-card {
    background: white;
    border-radius: 20px;
    padding: 16px;
    text-align: center;
    border: 1px solid #edf2f7;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.stat-card .value {
    font-size: 28px;
    font-weight: 800;
    color: #E30613;
}
.stat-card .label {
    font-size: 11px;
    color: #64748b;
    margin-top: 5px;
}
.section-card {
    background: white;
    border-radius: 28px;
    padding: 24px;
    border: 1px solid #edf2f7;
    margin-bottom: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.section-card:hover {
    border-color: #E30613;
}
.card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid #E30613;
}
.card-header i {
    font-size: 24px;
    color: #E30613;
}
.card-header h2 {
    font-size: 18px;
    color: #E30613;
}
.card-header span {
    margin-left: auto;
    background: #f1f5f9;
    padding: 4px 12px;
    border-radius: 30px;
    font-size: 11px;
    color: #475569;
}
.tables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
}
.table-card {
    background: #f8fafc;
    border-radius: 20px;
    padding: 16px;
    border: 1px solid #e2e8f0;
    transition: transform 0.2s;
}
.table-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(227,6,19,0.1);
}
.table-name {
    font-size: 18px;
    font-weight: 700;
    color: #E30613;
}
.progress-bar {
    width: 100%;
    background: #e2e8f0;
    border-radius: 10px;
    height: 6px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: #E30613;
    width: 0%;
    transition: width 0.3s;
}
.btn-small {
    background: #E30613;
    border: none;
    padding: 6px 12px;
    border-radius: 30px;
    color: white;
    cursor: pointer;
    margin: 4px;
    transition: all 0.2s;
    font-size: 11px;
}
.btn-small:hover {
    background: #b8050f;
    transform: translateY(-1px);
}
.guest-badge {
    background: #E30613;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 10px;
    display: inline-block;
    margin: 2px;
    color: white;
}
.bands-table {
    width: 100%;
    border-collapse: collapse;
    overflow-x: auto;
    display: block;
    font-size: 13px;
}
.bands-table th, .bands-table td {
    padding: 10px 8px;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
    color: #1e293b;
}
.bands-table th {
    background: #E30613;
    color: white;
    font-weight: 600;
}
.items-list {
    max-height: 400px;
    overflow-y: auto;
    margin-bottom: 20px;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    background: white;
}
.list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #f1f5f9;
    transition: 0.2s;
}
.list-item:hover {
    background: #fef5f5;
}
.item-info {
    flex: 1;
}
.item-name {
    font-weight: 600;
    font-size: 14px;
}
.item-price {
    color: #10b981;
    font-size: 12px;
    margin-top: 4px;
}
.item-stock {
    color: #f59e0b;
    font-size: 11px;
    margin-top: 2px;
}
.add-form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}
.add-form input, .add-form select {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 40px;
    padding: 10px 16px;
    color: #1e293b;
    font-size: 13px;
    flex: 1;
    min-width: 120px;
}
.add-btn {
    background: #E30613;
    border: none;
    padding: 10px 20px;
    border-radius: 40px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}
.add-btn:hover {
    background: #b8050f;
    transform: translateY(-2px);
}
.empty-state {
    text-align: center;
    padding: 40px;
    color: #94a3b8;
}
.orders-grid {
    display: grid;
    gap: 16px;
}
.order-card {
    background: white;
    border-radius: 20px;
    padding: 16px;
    border: 2px solid #e2e8f0;
}
.order-card.ready {
    border-color: #10b981;
    box-shadow: 0 0 20px rgba(16,185,129,0.1);
}
.order-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
}
.order-id {
    background: #E30613;
    padding: 4px 10px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 12px;
    color: white;
}
.status-pending, .status-preparing, .status-ready {
    padding: 4px 10px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 600;
    display: inline-block;
}
.status-pending { background: #fef3c7; color: #d97706; }
.status-preparing { background: #d1fae5; color: #059669; }
.status-ready { background: #fee2e2; color: #E30613; animation: pulse 1s infinite; }
.order-total {
    font-size: 18px;
    font-weight: bold;
    color: #10b981;
    margin: 12px 0;
    text-align: right;
}
.collect-btn {
    background: #E30613;
    border: none;
    padding: 10px;
    border-radius: 40px;
    color: white;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
}
.collect-btn:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}
.transaction-list {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
}
.transaction-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid #f1f5f9;
}
.transaction-icon {
    font-size: 24px;
    min-width: 40px;
}
.transaction-details {
    flex: 1;
}
.transaction-header {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
}
.transaction-vendor {
    font-weight: 700;
    color: #E30613;
    background: rgba(227,6,19,0.1);
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
}
.transaction-amount {
    font-weight: 800;
    font-size: 13px;
    color: #10b981;
}
.transaction-time {
    font-size: 10px;
    color: #94a3b8;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
}
@media (max-width: 768px) {
    .admin-container { padding: 12px; }
    .admin-tab { padding: 8px 14px; font-size: 11px; }
    .tables-grid { grid-template-columns: 1fr; }
    .bands-table th, .bands-table td { font-size: 11px; padding: 8px 4px; }
}

/* ========== STUNNING VVIP MODAL ========== */
.vvip-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(12px);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}
.vvip-modal.active {
    opacity: 1;
    visibility: visible;
}
.vvip-modal-card {
    background: linear-gradient(145deg, #0f172a, #1e1b2f);
    border-radius: 48px;
    border: 1px solid rgba(227, 6, 19, 0.6);
    max-width: 90%;
    width: 380px;
    padding: 32px 28px;
    text-align: center;
    color: white;
    box-shadow: 0 25px 50px -12px rgba(227, 6, 19, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    transform: scale(0.9) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    position: relative;
    overflow: hidden;
}
.vvip-modal.active .vvip-modal-card {
    transform: scale(1) translateY(0);
}
.vvip-modal-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(227,6,19,0.15), transparent 70%);
    pointer-events: none;
}
.vvip-modal-icon {
    font-size: 64px;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 12px rgba(227,6,19,0.6));
}
.vvip-modal-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #fff, #ffb3b3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.3px;
}
.vvip-modal-message {
    color: #cbd5e1;
    font-size: 15px;
    margin-bottom: 28px;
    line-height: 1.5;
    padding: 0 8px;
}
.vvip-modal-btn {
    background: linear-gradient(135deg, #E30613, #a0010e);
    border: none;
    padding: 12px 32px;
    border-radius: 60px;
    color: white;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 14px rgba(227,6,19,0.4);
}
.vvip-modal-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.05);
    box-shadow: 0 8px 20px rgba(227,6,19,0.5);
}
.vvip-modal-btn:active {
    transform: translateY(1px);
}
</style>
</head>
<body>
<div class="admin-container" id="adminContainer" style="display: none;">
    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="overview">📊 Overview</button>
        <button class="admin-tab" data-tab="tables">📋 Tables</button>
        <button class="admin-tab" data-tab="bands">🖨️ Bands</button>
        <button class="admin-tab" data-tab="orders">👨‍🍳 Orders</button>
        <button class="admin-tab" data-tab="history">📜 History</button>
    </div>

    <!-- OVERVIEW TAB -->
    <div id="tab-overview" class="admin-tab-content active">
        <div class="dashboard-stats" id="overviewStats"></div>
        <div class="section-card">
            <div class="card-header">
                <i class="fas fa-chart-line"></i>
                <h2>Quick Actions</h2>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="add-btn" onclick="switchTab('tables')">📋 Manage Tables</button>
                <button class="add-btn" onclick="switchTab('bands')">🖨️ Manage Bands</button>
            </div>
        </div>
        <div class="section-card">
            <div class="card-header">
                <i class="fas fa-fire"></i>
                <h2>Low Stock Alerts</h2>
                <span>Needs attention</span>
            </div>
            <div id="lowStockPreview" class="items-list" style="max-height: 200px;"></div>
        </div>
    </div>

    <!-- TABLES TAB -->
    <div id="tab-tables" class="admin-tab-content">
        <div class="section-card">
            <div class="card-header">
                <i class="fas fa-plus-circle"></i>
                <h2>Create New Table</h2>
            </div>
            <div class="add-form">
                <input type="text" id="newTableName" placeholder="Table name (e.g., VIP Lounge)">
                <input type="number" id="newTableCapacity" placeholder="Capacity" value="10">
                <input type="number" id="newTableTab" placeholder="Initial Tab (R)" value="8000">
                <button class="add-btn" onclick="createTable()">+ Create Table</button>
            </div>
        </div>
        <div id="tablesList" class="tables-grid"></div>
    </div>

    <!-- BANDS TAB -->
    <div id="tab-bands" class="admin-tab-content">
        <div class="section-card">
            <div class="card-header">
                <i class="fas fa-id-card"></i>
                <h2>Registered Wristbands</h2>
                <span>VVIP Members</span>
            </div>
            <div id="bandsListContainer"></div>
        </div>
    </div>

    <!-- ORDERS TAB -->
    <div id="tab-orders" class="admin-tab-content">
        <div class="section-card">
            <div class="card-header">
                <i class="fas fa-fire"></i>
                <h2>Active Orders</h2>
            </div>
            <div id="activeOrdersGrid" class="orders-grid"></div>
        </div>
    </div>

    <!-- HISTORY TAB -->
    <div id="tab-history" class="admin-tab-content">
        <div class="section-card">
            <div class="card-header">
                <i class="fas fa-history"></i>
                <h2>Transaction History</h2>
            </div>
            <div id="historyContent"></div>
        </div>
    </div>
</div>

<div id="vvipModal" class="vvip-modal">
    <div class="vvip-modal-card">
        <div class="vvip-modal-icon"><i class="fas fa-crown"></i></div>
        <div class="vvip-modal-title">Administrator Access</div>
        <div class="vvip-modal-message"></div>
        <button class="vvip-modal-btn" onclick="closeModal()">Confirm</button>
    </div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // ========== GLOBAL STATE ==========
    let currentAdmin = null;
    let cachedTables = [], cachedProducts = [], cachedOrders = [], cachedBands = [], cachedTransactions = [];

    // Real-time subscriptions
    let tablesSubscription = null, ordersSubscription = null, profilesSubscription = null, transactionsSubscription = null;

    // ========== HELPER FUNCTIONS ==========
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showModal(title, message, iconHtml = '<i class="fas fa-crown"></i>') {
        const modal = document.getElementById('vvipModal');
        document.querySelector('.vvip-modal-title').innerText = title;
        document.querySelector('.vvip-modal-message').innerHTML = message;
        document.querySelector('.vvip-modal-icon').innerHTML = iconHtml;
        modal.classList.add('active');
    }
    window.closeModal = function() {
        document.getElementById('vvipModal').classList.remove('active');
    };

    // ========== AUTHENTICATION (ADMIN ONLY) ==========
    async function checkAdminAccess() {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session) {
            showModal("Access Denied", "You are not logged in.<br><br>Only administrators can access the VVIP Console.", '<i class="fas fa-shield-alt"></i>');
            return false;
        }
        const { data: profile, error: profErr } = await supabase
            .from('profiles')
            .select('role, name')
            .eq('id', session.user.id)
            .single();
        if (profErr || !profile || (profile.role !== 'admin' && profile.role !== 'staff')) {
            showModal("Access Denied", "You do not have administrator or staff privileges.<br><br>This area is restricted.", '<i class="fas fa-lock"></i>');
            return false;
        }
        currentAdmin = { id: session.user.id, name: profile.name, role: profile.role };
        return true;
    }

    // ========== DATA LOADING ==========
    async function loadVenueTables() {
        const { data, error } = await supabase.from('venue_tables').select('*');
        if (error) console.error("Load tables error:", error);
        return data || [];
    }
    async function loadProducts() {
        const { data, error } = await supabase.from('products').select('*');
        if (error) console.error("Load products error:", error);
        return data || [];
    }
    async function loadOrders() {
        const { data, error } = await supabase
            .from('orders')
            .select('*')
            .in('status', ['pending', 'preparing', 'ready'])
            .order('created_at', { ascending: false });
        if (error) console.error("Load orders error:", error);
        return data || [];
    }
    async function loadProfilesAndWallets() {
        const { data: profiles, error: pErr } = await supabase
            .from('profiles')
            .select('id, name, phone, role');
        if (pErr) console.error(pErr);
        const { data: wallets, error: wErr } = await supabase
            .from('wallets')
            .select('user_id, balance');
        if (wErr) console.error(wErr);
        const { data: tabAccounts, error: tErr } = await supabase
            .from('vvip_tab_accounts')
            .select('user_id, balance');
        if (tErr) console.error(tErr);

        const walletMap = {};
        if (wallets) wallets.forEach(w => { walletMap[w.user_id] = { balance: w.balance, tabBalance: 0 }; });
        if (tabAccounts) tabAccounts.forEach(t => { if (walletMap[t.user_id]) walletMap[t.user_id].tabBalance = t.balance; else walletMap[t.user_id] = { balance: 0, tabBalance: t.balance }; });
        
        const bands = [];
        if (profiles) {
            for (const p of profiles) {
                bands.push({
                    id: p.phone || p.id,
                    name: p.name || p.phone,
                    balance: walletMap[p.id]?.balance || 0,
                    tabBalance: walletMap[p.id]?.tabBalance || 0,
                    tableName: null,
                    userId: p.id
                });
            }
        }
        const tables = await loadVenueTables();
        for (const band of bands) {
            for (const tbl of tables) {
                if (tbl.guests && tbl.guests.includes(band.userId)) {
                    band.tableName = tbl.name;
                    break;
                }
            }
        }
        return bands;
    }
    async function loadTransactionHistory() {
        const { data, error } = await supabase
            .from('wallet_transactions')
            .select('*, profiles(name)')
            .order('created_at', { ascending: false })
            .limit(100);
        if (error) console.error(error);
        return (data || []).map(tx => ({
            vendor: tx.description?.split(' ')[0] || 'VVIP',
            amount: tx.amount,
            item: tx.description || 'Transaction',
            quantity: 1,
            time: new Date(tx.created_at).toLocaleTimeString(),
            user: tx.profiles?.name
        }));
    }

    async function refreshAllData() {
        cachedTables = await loadVenueTables();
        cachedProducts = await loadProducts();
        cachedOrders = await loadOrders();
        cachedBands = await loadProfilesAndWallets();
        cachedTransactions = await loadTransactionHistory();
    }

    // ========== RENDER FUNCTIONS ==========
    function renderOverview() {
        const totalTables = cachedTables.length;
        const occupiedTables = cachedTables.filter(t => (t.guests?.length || 0) > 0).length;
        const totalGuests = cachedTables.reduce((s, t) => s + (t.guests?.length || 0), 0);
        const totalRevenue = cachedTransactions.reduce((s, tx) => s + (tx.amount > 0 ? tx.amount : 0), 0);
        const totalBands = cachedBands.length;
        const lowStockCount = cachedProducts.filter(p => p.stock_quantity < 5 && p.stock_quantity > 0).length;
        document.getElementById('overviewStats').innerHTML = `
            <div class="stat-card"><div class="value">${totalTables}</div><div class="label">Tables</div></div>
            <div class="stat-card"><div class="value">${occupiedTables}</div><div class="label">Occupied</div></div>
            <div class="stat-card"><div class="value">${totalGuests}</div><div class="label">Guests</div></div>
            <div class="stat-card"><div class="value">R${totalRevenue.toLocaleString()}</div><div class="label">Revenue</div></div>
            <div class="stat-card"><div class="value">${totalBands}</div><div class="label">Bands</div></div>
            <div class="stat-card"><div class="value">${lowStockCount}</div><div class="label">Low Stock</div></div>
        `;
        const lowStockItems = cachedProducts.filter(p => p.stock_quantity < 5 && p.stock_quantity > 0).slice(0, 5);
        const previewHtml = lowStockItems.length ? lowStockItems.map(p => `<div class="list-item"><div><strong>${escapeHtml(p.name)}</strong><br><span style="color:#f59e0b;">⚠️ ${p.stock_quantity} left</span></div><div style="color:#f59e0b;">Low Stock</div></div>`).join('') : '<div class="empty-state">✅ No low stock items</div>';
        document.getElementById('lowStockPreview').innerHTML = previewHtml;
    }

    function renderTables() {
        const container = document.getElementById('tablesList');
        if (!container) return;
        if (cachedTables.length === 0) { container.innerHTML = '<div class="empty-state">✨ No tables. Create one above.</div>'; return; }
        container.innerHTML = cachedTables.map(t => {
            const originalTab = t.tab_balance || 0;
            const spent = originalTab - (t.tab_balance || 0);
            const percent = originalTab > 0 ? (spent / originalTab) * 100 : 0;
            return `<div class="table-card"><div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span class="table-name">${escapeHtml(t.name)}</span><span style="color:#E30613; font-weight:bold;">Tab: R${t.tab_balance || 0}</span></div>
            <div style="margin-bottom:10px;"><div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>👥 Guests: ${(t.guests?.length || 0)}/${t.capacity}</span><span>💰 Spent: R${spent}</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${percent}%;"></div></div></div>
            <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;"><input type="text" id="assign_${t.name.replace(/\s/g, '_')}" placeholder="Phone number (Wallet ID)" style="flex:1; padding:8px 12px; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:40px; color:#1e293b;"><button onclick="assignToTable('${escapeHtml(t.name).replace(/'/g, "\\'")}')" class="btn-small">➕ Assign</button><button onclick="unassignFromTable('${escapeHtml(t.name).replace(/'/g, "\\'")}')" class="btn-small">🗑️ Remove</button></div>
            <div><span style="color:#64748b; font-size:12px;">Assigned:</span><div style="margin-top:6px;">${(t.guests || []).map(g => `<span class="guest-badge">${escapeHtml(g)}</span>`).join('') || '<span style="color:#94a3b8; font-size:11px;">None</span>'}</div></div></div>`;
        }).join('');
        document.querySelectorAll('[id^="assign_"]').forEach(input => {
            const tableName = input.id.replace('assign_', '').replace(/_/g, ' ');
            input.addEventListener('keypress', (e) => { if (e.key === 'Enter') assignToTable(tableName); });
        });
    }

    function renderBands() {
        const container = document.getElementById('bandsListContainer');
        if (!container) return;
        if (cachedBands.length === 0) { container.innerHTML = '<div class="empty-state">💳 No wristbands registered yet.</div>'; return; }
        container.innerHTML = `<div style="overflow-x:auto;"><table class="bands-table"><thead><tr><th>🆔 ID</th><th>👤 Name</th><th>💰 Wallet</th><th>💎 VVIP Tab</th><th>📋 Table</th><th>🖨️</th></tr></thead><tbody>${cachedBands.map(b => `<tr><td style="font-family:monospace;">${escapeHtml(b.id)}</td><td>${escapeHtml(b.name)}</td><td style="color:#10b981;">R${(b.balance || 0).toLocaleString()}</td><td style="color:#f59e0b;">R${(b.tabBalance || 0).toLocaleString()}</td><td>${b.tableName ? escapeHtml(b.tableName) : '<span style="color:#94a3b8;">—</span>'}</td><td><button onclick="printBand('${b.id.replace(/'/g, "\\'")}')" class="btn-small">🖨️ Print</button></td></tr>`).join('')}</tbody></table></div><div style="margin-top:16px; padding:12px; background:#f8fafc; border-radius:20px; text-align:center; font-size:12px; color:#475569;">💡 Total: ${cachedBands.length} bands | Wallet total: R${cachedBands.reduce((s, b) => s + (b.balance || 0), 0).toLocaleString()} | VVIP Tab total: R${cachedBands.reduce((s, b) => s + (b.tabBalance || 0), 0).toLocaleString()}</div>`;
    }

    function renderOrders() {
        const container = document.getElementById('activeOrdersGrid');
        if (!container) return;
        if (cachedOrders.length === 0) { container.innerHTML = '<div class="empty-state">🍽️ No active orders.</div>'; return; }
        container.innerHTML = cachedOrders.map(order => {
            let statusClass = "", statusText = "", readyClass = "";
            if (order.status === "pending") { statusClass = "status-pending"; statusText = "PENDING"; }
            else if (order.status === "preparing") { statusClass = "status-preparing"; statusText = "PREPARING"; }
            else if (order.status === "ready") { statusClass = "status-ready"; statusText = "READY"; readyClass = "ready"; }
            let vendorIcon = order.vendor === "Rands Smart Counter" ? "🍺" : order.vendor === "Shisha Lounge" ? "💨" : "🥩";
            const items = Array.isArray(order.items) ? order.items : [];
            return `<div class="order-card ${readyClass}"><div class="order-header"><span class="order-id">#${order.order_id}</span><span style="color:#64748b; font-size:11px;">${new Date(order.created_at).toLocaleTimeString()}</span></div>
            <div style="margin-bottom:10px; font-size:12px;">${vendorIcon} <strong>${order.vendor}</strong> | Band: ${order.band_id}</div>
            <div class="${statusClass}" style="margin-bottom:10px;">${statusText}</div>
            <div style="margin:10px 0;">${items.map(item => `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #f1f5f9; font-size:12px;"><span>${item.quantity}x ${item.name}</span><span>R${item.price * item.quantity}</span></div>`).join('')}</div>
            <div class="order-total">Total: R${order.total}</div>
            <button class="collect-btn" onclick="collectOrder('${order.id}')" ${order.status !== "ready" ? "disabled" : ""}>${order.status === "ready" ? "📦 COLLECT" : "⏳ WAITING"}</button></div>`;
        }).join('');
    }

    function renderHistory() {
        const container = document.getElementById('historyContent');
        if (!container) return;
        if (cachedTransactions.length === 0) { container.innerHTML = '<div class="empty-state">✨ No transactions yet.</div>'; return; }
        const totalSpent = cachedTransactions.reduce((s, tx) => s + (tx.amount > 0 ? tx.amount : 0), 0);
        container.innerHTML = `<div class="dashboard-stats"><div class="stat-card"><div class="value">R${totalSpent.toFixed(2)}</div><div class="label">Total Spent</div></div><div class="stat-card"><div class="value">${cachedTransactions.length}</div><div class="label">Transactions</div></div></div><div class="transaction-list">${cachedTransactions.slice(0, 30).map(tx => { let vendorIcon = "💳"; return `<div class="transaction-item"><div class="transaction-icon">${vendorIcon}</div><div class="transaction-details"><div class="transaction-header"><span class="transaction-vendor">${tx.vendor}</span><span class="transaction-amount">+R${tx.amount}</span></div><div class="transaction-item-name">${tx.quantity}x ${tx.item}</div><div class="transaction-time">⏱️ ${tx.time}</div></div></div>`; }).join('')}</div>`;
    }

    async function renderAll() {
        await refreshAllData();
        const activeTab = document.querySelector('.admin-tab.active')?.dataset.tab;
        if (activeTab === 'overview') renderOverview();
        if (activeTab === 'tables') renderTables();
        if (activeTab === 'bands') renderBands();
        if (activeTab === 'orders') renderOrders();
        if (activeTab === 'history') renderHistory();
    }

    // ========== BUSINESS LOGIC ==========
    async function createTable() {
        const name = document.getElementById('newTableName')?.value.trim();
        const capacity = parseInt(document.getElementById('newTableCapacity')?.value);
        const tab = parseInt(document.getElementById('newTableTab')?.value);
        if (!name || capacity < 1) { showModal("Error", "Valid name and capacity required", '<i class="fas fa-exclamation-triangle"></i>'); return; }
        const exists = cachedTables.some(t => t.name === name);
        if (exists) { showModal("Duplicate", "Table already exists", '<i class="fas fa-ban"></i>'); return; }
        const { error } = await supabase.from('venue_tables').insert([{
            name, capacity, tab_balance: tab, entries_used: 0, guests: []
        }]);
        if (error) { showModal("Error", error.message, '<i class="fas fa-bug"></i>'); return; }
        await refreshAllData();
        renderAll();
        showModal("Table Created", `${name} created with R${tab} tab`, '<i class="fas fa-check-circle"></i>');
        document.getElementById('newTableName').value = '';
    }

    window.assignToTable = async function(tableName) {
        const walletId = prompt("Enter Phone number (Wallet ID):");
        if (!walletId) return;
        const { data: profile, error: profErr } = await supabase
            .from('profiles')
            .select('id')
            .eq('phone', walletId)
            .maybeSingle();
        if (!profile) {
            const createNew = confirm(`Profile with phone ${walletId} not found. Create new profile?`);
            if (!createNew) return;
            const { data: newProfile, error: createErr } = await supabase
                .from('profiles')
                .insert([{ phone: walletId, name: 'Guest', role: 'customer' }])
                .select()
                .single();
            if (createErr) { showModal("Error", createErr.message, '<i class="fas fa-bug"></i>'); return; }
            var userId = newProfile.id;
        } else {
            var userId = profile.id;
        }
        const table = cachedTables.find(t => t.name === tableName);
        if (!table) return;
        let guests = table.guests || [];
        if (guests.includes(userId)) { showModal("Already Assigned", `${walletId} already at this table`, '<i class="fas fa-info-circle"></i>'); return; }
        if (guests.length >= table.capacity) { showModal("Table Full", `${tableName} at capacity`, '<i class="fas fa-door-closed"></i>'); return; }
        guests.push(userId);
        const { error } = await supabase
            .from('venue_tables')
            .update({ guests, entries_used: guests.length })
            .eq('name', tableName);
        if (error) { showModal("Error", error.message, '<i class="fas fa-bug"></i>'); return; }
        await refreshAllData();
        renderAll();
        showModal("Assigned", `${walletId} → ${tableName}`, '<i class="fas fa-user-check"></i>');
    };

    window.unassignFromTable = async function(tableName) {
        const walletId = prompt("Enter Phone number to remove:");
        if (!walletId) return;
        const { data: profile } = await supabase.from('profiles').select('id').eq('phone', walletId).maybeSingle();
        if (!profile) { showModal("Not Found", "Profile not found", '<i class="fas fa-search"></i>'); return; }
        const table = cachedTables.find(t => t.name === tableName);
        if (!table) return;
        let guests = table.guests || [];
        const idx = guests.indexOf(profile.id);
        if (idx === -1) { showModal("Not Found", `${walletId} not at this table`, '<i class="fas fa-search"></i>'); return; }
        guests.splice(idx, 1);
        const { error } = await supabase
            .from('venue_tables')
            .update({ guests, entries_used: guests.length })
            .eq('name', tableName);
        if (error) { showModal("Error", error.message, '<i class="fas fa-bug"></i>'); return; }
        await refreshAllData();
        renderAll();
        showModal("Removed", `${walletId} removed from ${tableName}`, '<i class="fas fa-user-minus"></i>');
    };

    window.collectOrder = async function(orderId) {
        const order = cachedOrders.find(o => o.id === orderId);
        if (!order || order.status !== "ready") return;
        const { error } = await supabase
            .from('orders')
            .update({ status: 'collected' })
            .eq('id', orderId);
        if (error) showModal("Error", error.message, '<i class="fas fa-bug"></i>');
        else {
            await refreshAllData();
            renderAll();
            showModal("Order Collected", `Order #${order.order_id} collected`, '<i class="fas fa-gift"></i>');
        }
    };

    window.printBand = async function(bandId) {
        const band = cachedBands.find(b => b.id === bandId);
        if (!band) { showModal("Error", "Band not found", '<i class="fas fa-exclamation-triangle"></i>'); return; }
        const printWindow = window.open('', '_blank');
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(bandId)}`;
        printWindow.document.write(`<!DOCTYPE html><html><head><title>VVIP Wristband - ${bandId}</title><style>body{margin:0;padding:20px;background:white;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial;}.wristband{width:320px;background:linear-gradient(145deg,#b30000,#8b0000);border-radius:40px;padding:30px;text-align:center;color:white;}.logo{font-size:36px;margin-bottom:15px;}.band-id{font-size:26px;font-weight:bold;margin:15px 0;background:rgba(255,255,255,0.2);padding:10px;border-radius:50px;}.qr{background:white;padding:15px;border-radius:24px;display:inline-block;margin:15px 0;}.qr img{width:150px;height:150px;}</style><body><div class="wristband"><div class="logo">👑 RANDS VVIP</div><div class="band-id">${bandId}</div><div class="qr"><img src="${qrUrl}"></div><div class="footer">Present this wristband for access</div></div></body></html>`);
        printWindow.document.close();
        printWindow.print();
    };

    // ========== REAL-TIME ==========
    function setupRealtime() {
        if (tablesSubscription) tablesSubscription.unsubscribe();
        tablesSubscription = supabase
            .channel('venue_tables_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'venue_tables' }, () => renderAll())
            .subscribe();
        if (ordersSubscription) ordersSubscription.unsubscribe();
        ordersSubscription = supabase
            .channel('orders_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => renderAll())
            .subscribe();
        if (profilesSubscription) profilesSubscription.unsubscribe();
        profilesSubscription = supabase
            .channel('profiles_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => renderAll())
            .subscribe();
        if (transactionsSubscription) transactionsSubscription.unsubscribe();
        transactionsSubscription = supabase
            .channel('wallet_transactions_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'wallet_transactions' }, () => renderAll())
            .subscribe();
    }

    // ========== TAB SWITCHING ==========
    window.switchTab = function(tabName) {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.remove('active'));
        document.querySelector(`.admin-tab[data-tab="${tabName}"]`).classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
        renderAll();
    };

    // ========== INIT ==========
    async function init() {
        const isAdmin = await checkAdminAccess();
        if (!isAdmin) return;
        document.getElementById('adminContainer').style.display = 'block';
        await refreshAllData();
        renderAll();
        setupRealtime();
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });
    }
    init();
</script>
</body>
</html>
