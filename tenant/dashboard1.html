<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Manager | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f7fb; padding: 24px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 24px; padding: 24px; margin-bottom: 24px; border: 1px solid #eef2f8; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; font-weight: 800; color: #1e293b; }
        .btn-primary { background: #E30613; color: white; border: none; padding: 10px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .btn-secondary { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eef2f8; }
        th { background: #f8fafc; font-weight: 600; color: #475569; }
        .status-badge { padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; font-weight: 600; }
        .status-active { background: #dcfce7; color: #166534; }
        .status-inactive { background: #fee2e2; color: #991b1b; }
        .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 28px; padding: 28px; width: 90%; max-width: 500px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 16px; border-radius: 40px; border: 1px solid #e2e8f0; font-family: inherit; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h1><i class="fas fa-puzzle-piece"></i> Module Manager</h1>
            <button class="btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Add Module</button>
        </div>
        <div id="modulesTable">Loading...</div>
    </div>
</div>

<div id="moduleModal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3 id="modalTitle">Add Module</h3>
        <div class="form-group"><label>Module Name</label><input type="text" id="moduleName" placeholder="e.g., Event Management"></div>
        <div class="form-group"><label>Icon (FontAwesome class)</label><input type="text" id="moduleIcon" placeholder="calendar-alt"></div>
        <div class="form-group"><label>File Path</label><input type="text" id="moduleFile" placeholder="events-admin.html"></div>
        <div class="form-group"><label>Display Order</label><input type="number" id="moduleOrder" value="0"></div>
        <div class="form-group"><label>Status</label>
            <select id="moduleStatus"><option value="true">Active</option><option value="false">Inactive</option></select>
        </div>
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="saveModule()">Save</button>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';
    
    let editingId = null;
    
    async function loadModules() {
        const { data, error } = await supabase.from('modules').select('*').order('display_order');
        if (error) { console.error(error); return; }
        const container = document.getElementById('modulesTable');
        if (!data.length) {
            container.innerHTML = '<div style="text-align:center;padding:40px;">No modules found</div>';
            return;
        }
        container.innerHTML = `
            <table>
                <thead><tr><th>Order</th><th>Name</th><th>Icon</th><th>File Path</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>
                    ${data.map(m => `
                        <tr>
                            <td>${m.display_order || 0}</td>
                            <td><i class="fas fa-${m.icon}"></i> ${m.name}</td>
                            <td>${m.icon}</td>
                            <td><code>${m.file_path}</code></td>
                            <td><span class="status-badge ${m.is_active ? 'status-active' : 'status-inactive'}">${m.is_active ? 'Active' : 'Inactive'}</span></td>
                            <td>
                                <button class="btn-secondary" style="padding:4px 12px;" onclick="editModule(${m.id})">Edit</button>
                                <button class="btn-secondary" style="padding:4px 12px; color:#E30613;" onclick="toggleModule(${m.id}, ${!m.is_active})">${m.is_active ? 'Disable' : 'Enable'}</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }
    
    window.openModal = (id = null) => {
        editingId = id;
        if (id) {
            document.getElementById('modalTitle').innerText = 'Edit Module';
            supabase.from('modules').select('*').eq('id', id).single().then(({ data }) => {
                if (data) {
                    document.getElementById('moduleName').value = data.name;
                    document.getElementById('moduleIcon').value = data.icon || '';
                    document.getElementById('moduleFile').value = data.file_path || '';
                    document.getElementById('moduleOrder').value = data.display_order || 0;
                    document.getElementById('moduleStatus').value = data.is_active ? 'true' : 'false';
                }
            });
        } else {
            document.getElementById('modalTitle').innerText = 'Add Module';
            document.getElementById('moduleName').value = '';
            document.getElementById('moduleIcon').value = '';
            document.getElementById('moduleFile').value = '';
            document.getElementById('moduleOrder').value = '0';
            document.getElementById('moduleStatus').value = 'true';
        }
        document.getElementById('moduleModal').style.display = 'flex';
    };
    
    window.closeModal = () => {
        document.getElementById('moduleModal').style.display = 'none';
        editingId = null;
    };
    
    window.saveModule = async () => {
        const name = document.getElementById('moduleName').value.trim();
        const icon = document.getElementById('moduleIcon').value.trim();
        const file_path = document.getElementById('moduleFile').value.trim();
        const display_order = parseInt(document.getElementById('moduleOrder').value);
        const is_active = document.getElementById('moduleStatus').value === 'true';
        
        if (!name) { alert('Module name required'); return; }
        
        if (editingId) {
            await supabase.from('modules').update({ name, icon, file_path, display_order, is_active, updated_at: new Date() }).eq('id', editingId);
        } else {
            await supabase.from('modules').insert([{ name, icon, file_path, display_order, is_active }]);
        }
        closeModal();
        loadModules();
    };
    
    window.editModule = (id) => openModal(id);
    window.toggleModule = async (id, newStatus) => {
        await supabase.from('modules').update({ is_active: newStatus, updated_at: new Date() }).eq('id', id);
        loadModules();
    };
    
    loadModules();
</script>
</body>
</html>
