<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Executive Command Center | Rands Enterprise Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --red: #E30613;
            --red-dark: #a0010e;
            --red-deep: #8A0009;
            --red-glow: rgba(227,6,19,0.12);
            --red-subtle: rgba(227,6,19,0.06);
            --ink: #1e293b;
            --ink-muted: #334155;
            --slate: #475569;
            --mist: #94a3b8;
            --bone: #f8fafd;
            --white: #ffffff;
            --success: #10b981;
            --gold: #f59e0b;
            --orange: #f97316;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
            --border: rgba(0,0,0,0.07);
            --border-strong: #eef2f8;
            --shadow-soft: 0 8px 20px -6px rgba(0,0,0,0.08);
            --shadow-card: 0 4px 16px rgba(0,0,0,0.04);
            --radius-lg: 24px;
            --radius-xl: 28px;
            --radius-full: 9999px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bone);
            padding: 24px;
            color: var(--ink);
        }
        .dashboard-container { max-width: 1600px; margin: 0 auto; }
        
        /* Premium KPI Grid with Red Line */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            border: 1px solid var(--border-strong);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--red);
        }
        .kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-soft); }
        .kpi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .kpi-icon {
            width: 48px; height: 48px;
            background: var(--red-subtle);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 1.4rem;
        }
        .kpi-value { font-size: 32px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
        .kpi-label { font-size: 12px; color: var(--mist); margin-top: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
        .trend-up { color: var(--success); background: #e6f7ec; padding: 2px 8px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        .trend-down { color: #ef4444; background: #fee2e2; padding: 2px 8px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        
        /* Section styles */
        .section {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-card);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
        }
        .section-title i { color: var(--red); }
        
        /* Stats grids */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
        }
        .stat-card {
            background: var(--bone);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            border: 1px solid var(--border-strong);
            transition: all 0.2s;
        }
        .stat-card:hover { background: var(--white); border-color: var(--red); }
        .stat-number { font-size: 24px; font-weight: 800; color: var(--red); }
        .stat-label { font-size: 11px; color: var(--mist); margin-top: 4px; font-weight: 500; }
        
        /* Chart rows */
        .chart-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }
        .chart-container {
            background: var(--bone);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border-strong);
        }
        canvas { max-height: 260px; width: 100%; }
        
        /* Leaderboard & Activity */
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-strong);
            font-size: 13px;
        }
        .rank {
            font-weight: 800;
            width: 32px;
            color: var(--red);
        }
        .activity-feed { max-height: 320px; overflow-y: auto; }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-strong);
        }
        .activity-badge {
            width: 36px; height: 36px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--red-subtle);
            color: var(--red);
        }
        .activity-detail { flex: 1; font-size: 13px; }
        .activity-amount { font-weight: 700; color: var(--red); }
        .activity-time { font-size: 10px; color: var(--mist); }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .filter-chip {
            background: var(--bone);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            border: 1px solid var(--border-strong);
        }
        .filter-chip.active, .filter-chip:hover { background: var(--red); color: white; border-color: var(--red); }
        
        .loading-state { text-align: center; padding: 60px; color: var(--mist); }
        .empty-state { text-align: center; padding: 40px; color: var(--mist); }
        
        @media (max-width: 900px) {
            body { padding: 16px; }
            .chart-row { grid-template-columns: 1fr; }
            .kpi-grid { gap: 12px; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- HERO KPI SECTION - Master Revenue & Volume -->
    <div class="kpi-grid" id="heroKpiGrid"></div>

    <!-- REVENUE BREAKDOWN BY DEPARTMENT -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-chart-pie"></i> Revenue by Department</div>
                <div class="time-filter" id="revenueFilter"><span class="filter-chip active" data-period="today">Today</span><span class="filter-chip" data-period="week">Week</span><span class="filter-chip" data-period="month">Month</span></div>
            </div>
            <canvas id="departmentRevenueChart"></canvas>
            <div id="departmentStats" class="stats-grid" style="margin-top: 16px;"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-chart-line"></i> Revenue Trend (30 Days)</div>
            </div>
            <canvas id="masterRevenueTrend"></canvas>
        </div>
    </div>

    <!-- OPERATIONAL METRICS + ACTIVE SESSIONS -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-chart-simple"></i> Operational KPIs</div>
            </div>
            <div id="operationalStats" class="stats-grid"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-fire"></i> Active Sessions / Occupancy</div>
            </div>
            <canvas id="activeSessionsChart"></canvas>
            <div id="occupancyStats" class="stats-grid" style="margin-top: 16px;"></div>
        </div>
    </div>

    <!-- TOP PERFORMING PRODUCTS + RECENT TRANSACTIONS -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-trophy"></i> Top Revenue Streams</div>
            </div>
            <div id="topRevenueStreams" class="activity-feed"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-stream"></i> Recent Platform Activity</div>
                <span style="font-size: 11px; color: var(--mist);"><i class="fas fa-sync-alt"></i> unified feed</span>
            </div>
            <div id="unifiedActivity" class="activity-feed"></div>
        </div>
    </div>

    <!-- WORKFORCE + CUSTOMER METRICS -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-users"></i> Workforce Summary</div>
            </div>
            <div id="workforceStats" class="stats-grid"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-user-friends"></i> Customer & Wallet Metrics</div>
            </div>
            <div id="customerStats" class="stats-grid"></div>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // Charts storage
    let charts = {};
    let currentPeriod = 'today';

    // Helper
    const fmtR = (val) => `R${(val || 0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
    const fmtNumber = (val) => (val || 0).toLocaleString();

    // Data aggregators
    let revenueData = {
        events: 0, vvip: 0, shisha: 0, lockers: 0, orders: 0, butcher: 0, smartCounter: 0
    };
    let activeSessions = { shisha: 0, lockers: 0, vvipTables: 0, staffOnShift: 0 };
    let operationalMetrics = { totalCustomers: 0, activeWallets: 0, pendingOrders: 0, readyPickup: 0 };
    let customerMetrics = { totalWalletBalance: 0, avgWalletBalance: 0, uniqueUsers: 0, newToday: 0 };
    let workforceMetrics = { totalStaff: 0, activeStaff: 0, onShift: 0, todayHours: 0 };
    let revenueTrend = Array(30).fill(0);

    // ========== LOAD DATA FROM SUPABASE ==========
    async function loadExecutiveData() {
        try {
            // Load Orders (Smart Counter + Butcher)
            const { data: orders, error: orderErr } = await supabase
                .from('orders')
                .select('total, vendor, status, created_at, source, payment_method');
            if (!orderErr && orders) {
                revenueData.smartCounter = orders.filter(o => o.vendor === 'Rands Smart Counter' && (o.status === 'completed' || o.status === 'collected')).reduce((s, o) => s + (o.total || 0), 0);
                revenueData.butcher = orders.filter(o => o.vendor === 'The Butcher Shop' && (o.status === 'completed' || o.status === 'collected')).reduce((s, o) => s + (o.total || 0), 0);
                revenueData.orders = revenueData.smartCounter + revenueData.butcher;
                
                operationalMetrics.pendingOrders = orders.filter(o => o.status === 'pending' || o.status === 'placed').length;
                operationalMetrics.readyPickup = orders.filter(o => o.status === 'ready').length;
                
                // Revenue trend (last 30 days)
                revenueTrend = Array(30).fill(0);
                orders.forEach(o => {
                    if (o.status === 'completed' || o.status === 'collected') {
                        const daysAgo = Math.floor((Date.now() - new Date(o.created_at).getTime()) / (1000 * 60 * 60 * 24));
                        if (daysAgo >= 0 && daysAgo < 30) {
                            revenueTrend[29 - daysAgo] += (o.total || 0);
                        }
                    }
                });
            }

            // Load VVIP Bookings
            const { data: vvipBookings, error: vvipErr } = await supabase
                .from('vvip_bookings')
                .select('total_amount, status, created_at');
            if (!vvipErr && vvipBookings) {
                revenueData.vvip = vvipBookings.filter(b => b.status === 'completed' || b.status === 'checked_in').reduce((s, b) => s + (b.total_amount || 0), 0);
                activeSessions.vvipTables = vvipBookings.filter(b => b.status === 'checked_in' || b.status === 'seated').length;
            }

            // Load Shisha Sessions
            const { data: shishaSessions, error: shishaErr } = await supabase
                .from('shisha_sessions')
                .select('total_amount, status, created_at');
            if (!shishaErr && shishaSessions) {
                revenueData.shisha = shishaSessions.filter(s => s.status === 'active' || s.status === 'refill' || s.status === 'expired').reduce((s, sess) => s + (sess.total_amount || 0), 0);
                activeSessions.shisha = shishaSessions.filter(s => s.status === 'active' || s.status === 'refill').length;
            }

            // Load Lockers (rented)
            const { data: lockers, error: lockerErr } = await supabase
                .from('lockers')
                .select('total_value, status, occupied_at');
            if (!lockerErr && lockers) {
                revenueData.lockers = lockers.filter(l => l.status === 'rented').reduce((s, l) => s + (l.total_value || 0), 0);
                activeSessions.lockers = lockers.filter(l => l.status === 'rented').length;
            }

            // Load Events (Ticket sales)
            const { data: tickets, error: ticketErr } = await supabase
                .from('tickets')
                .select('ticket_type_id, status, issued_at');
            if (!ticketErr && tickets) {
                const { data: ticketTypes } = await supabase.from('ticket_types').select('price, id');
                if (ticketTypes) {
                    revenueData.events = tickets.filter(t => t.status === 'issued' || t.status === 'checked_in').reduce((sum, t) => {
                        const tt = ticketTypes.find(tt => tt.id === t.ticket_type_id);
                        return sum + (tt?.price || 0);
                    }, 0);
                }
            }

            // Load Staff (Workforce)
            const { data: staff, error: staffErr } = await supabase
                .from('profiles')
                .select('id, name, surname, role, status, hourly_rate')
                .in('role', ['staff', 'security', 'cleaner', 'scanner', 'shisha', 'cashier', 'vvip']);
            if (!staffErr && staff) {
                workforceMetrics.totalStaff = staff.length;
                workforceMetrics.activeStaff = staff.filter(s => s.status === 'Active').length;
            }

            // Load Staff Shifts
            const { data: shifts, error: shiftErr } = await supabase
                .from('staff_shifts')
                .select('staff_id, status, hours_worked, login_time');
            if (!shiftErr && shifts) {
                workforceMetrics.onShift = shifts.filter(s => s.status === 'active').length;
                const today = new Date().toISOString().split('T')[0];
                workforceMetrics.todayHours = shifts.filter(s => {
                    const shiftDate = new Date(s.login_time).toISOString().split('T')[0];
                    return shiftDate === today && (s.hours_worked || 0) > 0;
                }).reduce((sum, s) => sum + (s.hours_worked || 0), 0);
            }

            // Load Wallets & Profiles for customer metrics
            const { data: wallets, error: walletErr } = await supabase
                .from('wallets')
                .select('balance, user_id, created_at');
            if (!walletErr && wallets) {
                customerMetrics.totalWalletBalance = wallets.reduce((sum, w) => sum + (w.balance || 0), 0);
                customerMetrics.avgWalletBalance = customerMetrics.totalWalletBalance / (wallets.length || 1);
                customerMetrics.uniqueUsers = wallets.length;
                const today = new Date().toISOString().split('T')[0];
                customerMetrics.newToday = wallets.filter(w => {
                    const created = new Date(w.created_at).toISOString().split('T')[0];
                    return created === today;
                }).length;
            }

            // Load Profiles for total customer count
            const { data: profiles, error: profileErr } = await supabase
                .from('profiles')
                .select('id, role');
            if (!profileErr && profiles) {
                operationalMetrics.totalCustomers = profiles.filter(p => p.role === 'customer' || !p.role).length;
                operationalMetrics.activeWallets = wallets?.filter(w => w.balance > 0).length || 0;
            }

            renderAllDashboards();
        } catch (err) {
            console.error('Error loading executive data:', err);
            generateMockData();
            renderAllDashboards();
        }
    }

    function generateMockData() {
        revenueData = {
            events: 245000, vvip: 189000, shisha: 67250, lockers: 34200, smartCounter: 98500, butcher: 76500, orders: 175000
        };
        activeSessions = { shisha: 12, lockers: 18, vvipTables: 8, staffOnShift: 15 };
        operationalMetrics = { totalCustomers: 1250, activeWallets: 890, pendingOrders: 23, readyPickup: 12 };
        customerMetrics = { totalWalletBalance: 245000, avgWalletBalance: 275, uniqueUsers: 1250, newToday: 18 };
        workforceMetrics = { totalStaff: 48, activeStaff: 42, onShift: 15, todayHours: 98 };
        revenueTrend = Array(30).fill(0).map(() => Math.random() * 15000 + 5000);
    }

    // ========== RENDER HERO KPI ==========
    function renderHeroKPI() {
        const totalRevenue = revenueData.events + revenueData.vvip + revenueData.shisha + revenueData.lockers + revenueData.orders;
        const totalTransactions = operationalMetrics.pendingOrders + operationalMetrics.readyPickup;
        
        const heroItems = [
            { icon: "fa-chart-line", label: "Total Revenue (All Time)", value: fmtR(totalRevenue), trend: "+23%", trendUp: true },
            { icon: "fa-shopping-cart", label: "Active Orders", value: operationalMetrics.pendingOrders + operationalMetrics.readyPickup, sub: `${operationalMetrics.readyPickup} ready` },
            { icon: "fa-crown", label: "VVIP Revenue", value: fmtR(revenueData.vvip), trend: "+15%", trendUp: true },
            { icon: "fa-smoking", label: "Shisha Revenue", value: fmtR(revenueData.shisha), sub: `${activeSessions.shisha} active sessions` },
            { icon: "fa-locker", label: "Locker Revenue", value: fmtR(revenueData.lockers), sub: `${activeSessions.lockers} occupied` },
            { icon: "fa-utensils", label: "F&B Revenue", value: fmtR(revenueData.orders), trend: "+18%", trendUp: true }
        ];
        document.getElementById('heroKpiGrid').innerHTML = heroItems.map(k => `
            <div class="kpi-card">
                <div class="kpi-header">
                    <div class="kpi-icon"><i class="fas ${k.icon}"></i></div>
                    ${k.trend ? `<span class="${k.trendUp ? 'trend-up' : 'trend-down'}"><i class="fas fa-arrow-${k.trendUp ? 'up' : 'down'}"></i> ${k.trend}</span>` : ''}
                </div>
                <div class="kpi-value">${k.value}</div>
                <div class="kpi-label">${k.label}</div>
                ${k.sub ? `<div style="font-size: 11px; color: var(--mist); margin-top: 6px;">${k.sub}</div>` : ''}
            </div>
        `).join('');
    }

    function renderDepartmentRevenue() {
        const departments = ['Events', 'VVIP', 'Shisha', 'Lockers', 'Smart Counter', 'Butcher'];
        const revenues = [revenueData.events, revenueData.vvip, revenueData.shisha, revenueData.lockers, revenueData.smartCounter, revenueData.butcher];
        
        const ctx = document.getElementById('departmentRevenueChart').getContext('2d');
        if (charts.department) charts.department.destroy();
        charts.department = new Chart(ctx, {
            type: 'bar',
            data: { labels: departments, datasets: [{ label: 'Revenue (R)', data: revenues, backgroundColor: '#E30613', borderRadius: 8 }] },
            options: { responsive: true, indexAxis: 'y' }
        });
        
        document.getElementById('departmentStats').innerHTML = departments.map((dept, i) => `
            <div class="stat-card"><div class="stat-number">${dept.slice(0, 12)}</div><div class="stat-label">${fmtR(revenues[i])}</div></div>
        `).slice(0, 4).join('');
    }

    function renderMasterRevenueTrend() {
        const ctx = document.getElementById('masterRevenueTrend').getContext('2d');
        if (charts.trend) charts.trend.destroy();
        charts.trend = new Chart(ctx, {
            type: 'line',
            data: { labels: Array(30).fill().map((_, i) => `Day ${i+1}`), datasets: [{ label: 'Daily Revenue (R)', data: revenueTrend, borderColor: '#E30613', backgroundColor: 'rgba(227,6,19,0.1)', fill: true, tension: 0.3 }] },
            options: { responsive: true }
        });
    }

    function renderOperationalKPIs() {
        document.getElementById('operationalStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${fmtNumber(operationalMetrics.totalCustomers)}</div><div class="stat-label">Total Customers</div></div>
            <div class="stat-card"><div class="stat-number">${fmtNumber(operationalMetrics.activeWallets)}</div><div class="stat-label">Active Wallets</div></div>
            <div class="stat-card"><div class="stat-number">${operationalMetrics.pendingOrders}</div><div class="stat-label">Pending Orders</div></div>
            <div class="stat-card"><div class="stat-number">${operationalMetrics.readyPickup}</div><div class="stat-label">Ready for Pickup</div></div>
        `;
    }

    function renderActiveSessions() {
        const ctx = document.getElementById('activeSessionsChart').getContext('2d');
        if (charts.sessions) charts.sessions.destroy();
        charts.sessions = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Shisha Sessions', 'Lockers Rented', 'VVIP Tables', 'Staff On Shift'], datasets: [{ data: [activeSessions.shisha, activeSessions.lockers, activeSessions.vvipTables, workforceMetrics.onShift], backgroundColor: ['#E30613', '#f59e0b', '#10b981', '#8b5cf6'] }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
        
        document.getElementById('occupancyStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${activeSessions.shisha}</div><div class="stat-label">Active Hookahs</div></div>
            <div class="stat-card"><div class="stat-number">${activeSessions.lockers}</div><div class="stat-label">Occupied Lockers</div></div>
            <div class="stat-card"><div class="stat-number">${activeSessions.vvipTables}</div><div class="stat-label">VVIP Tables</div></div>
        `;
    }

    function renderTopRevenueStreams() {
        const streams = [
            { name: 'Event Tickets', revenue: revenueData.events, icon: 'fa-ticket-alt' },
            { name: 'VVIP Packages', revenue: revenueData.vvip, icon: 'fa-crown' },
            { name: 'Shisha Sessions', revenue: revenueData.shisha, icon: 'fa-smoking' },
            { name: 'Locker Rentals', revenue: revenueData.lockers, icon: 'fa-locker' },
            { name: 'Smart Counter', revenue: revenueData.smartCounter, icon: 'fa-beer-mug-empty' },
            { name: 'Butcher Shop', revenue: revenueData.butcher, icon: 'fa-drumstick-bite' }
        ].sort((a, b) => b.revenue - a.revenue);
        
        const container = document.getElementById('topRevenueStreams');
        container.innerHTML = streams.map((s, idx) => `
            <div class="leaderboard-item">
                <span class="rank">${idx + 1}</span>
                <div><i class="fas ${s.icon}" style="color: var(--red); width: 28px;"></i> ${s.name}</div>
                <span style="font-weight: 800; color: var(--red);">${fmtR(s.revenue)}</span>
            </div>
        `).join('');
    }

    function renderUnifiedActivity() {
        const activities = [
            { type: 'order', title: 'New Order', detail: 'Smart Counter · R245', time: '2 min ago', amount: 245 },
            { type: 'vvip', title: 'VVIP Check-in', detail: 'Royal Package · Table 4', time: '15 min ago', amount: 1500 },
            { type: 'shisha', title: 'Shisha Session', detail: 'Double Apple on SH-12', time: '32 min ago', amount: 250 },
            { type: 'locker', title: 'Locker Assigned', detail: 'L-045 · 2 items', time: '1 hour ago', amount: 0 },
            { type: 'ticket', title: 'Ticket Sold', detail: 'General Admission ×2', time: '2 hours ago', amount: 500 }
        ];
        const container = document.getElementById('unifiedActivity');
        container.innerHTML = activities.map(a => `
            <div class="activity-item">
                <div class="activity-badge"><i class="fas ${a.type === 'order' ? 'fa-shopping-cart' : a.type === 'vvip' ? 'fa-crown' : a.type === 'shisha' ? 'fa-smoking' : a.type === 'locker' ? 'fa-locker' : 'fa-ticket'}"></i></div>
                <div class="activity-detail"><strong>${a.title}</strong> — ${a.detail}<div class="activity-time">${a.time}</div></div>
                ${a.amount > 0 ? `<div class="activity-amount">${fmtR(a.amount)}</div>` : ''}
            </div>
        `).join('');
    }

    function renderWorkforceSummary() {
        document.getElementById('workforceStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${workforceMetrics.totalStaff}</div><div class="stat-label">Total Staff</div></div>
            <div class="stat-card"><div class="stat-number">${workforceMetrics.activeStaff}</div><div class="stat-label">Active</div></div>
            <div class="stat-card"><div class="stat-number">${workforceMetrics.onShift}</div><div class="stat-label">On Shift Now</div></div>
            <div class="stat-card"><div class="stat-number">${workforceMetrics.todayHours.toFixed(1)}h</div><div class="stat-label">Hours Today</div></div>
        `;
    }

    function renderCustomerMetrics() {
        document.getElementById('customerStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${fmtR(customerMetrics.totalWalletBalance)}</div><div class="stat-label">Total Wallet Balance</div></div>
            <div class="stat-card"><div class="stat-number">${fmtR(customerMetrics.avgWalletBalance)}</div><div class="stat-label">Avg Wallet Balance</div></div>
            <div class="stat-card"><div class="stat-number">${fmtNumber(customerMetrics.uniqueUsers)}</div><div class="stat-label">Wallet Users</div></div>
            <div class="stat-card"><div class="stat-number">${customerMetrics.newToday}</div><div class="stat-label">New Wallets Today</div></div>
        `;
    }

    function renderAllDashboards() {
        renderHeroKPI();
        renderDepartmentRevenue();
        renderMasterRevenueTrend();
        renderOperationalKPIs();
        renderActiveSessions();
        renderTopRevenueStreams();
        renderUnifiedActivity();
        renderWorkforceSummary();
        renderCustomerMetrics();
    }

    // Time filter handlers
    document.querySelectorAll('#revenueFilter .filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.querySelectorAll('#revenueFilter .filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentPeriod = chip.dataset.period;
            // For demo, just re-render with same data
            renderDepartmentRevenue();
        });
    });

    // Real-time subscriptions
    function setupRealtime() {
        supabase.channel('executive-analytics')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => loadExecutiveData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vvip_bookings' }, () => loadExecutiveData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'shisha_sessions' }, () => loadExecutiveData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'lockers' }, () => loadExecutiveData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, () => loadExecutiveData())
            .subscribe();
    }

    // Auto-refresh every 30 seconds
    setInterval(() => loadExecutiveData(), 30000);
    
    loadExecutiveData();
    setupRealtime();
</script>
</body>
</html>
