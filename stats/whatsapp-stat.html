<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WhatsApp Concierge | AI Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --red: #E30613;
            --red-dark: #a0010e;
            --red-deep: #8A0009;
            --red-glow: rgba(227,6,19,0.12);
            --red-subtle: rgba(227,6,19,0.06);
            --ink: #1e293b;
            --ink-muted: #334155;
            --slate: #475569;
            --mist: #94a3b8;
            --bone: #f8fafd;
            --white: #ffffff;
            --success: #10b981;
            --gold: #f59e0b;
            --orange: #f97316;
            --purple: #8b5cf6;
            --cyan: #06b6d4;
            --whatsapp: #25D366;
            --border: rgba(0,0,0,0.07);
            --border-strong: #eef2f8;
            --shadow-soft: 0 8px 20px -6px rgba(0,0,0,0.08);
            --shadow-card: 0 4px 16px rgba(0,0,0,0.04);
            --radius-lg: 24px;
            --radius-xl: 28px;
            --radius-full: 9999px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bone);
            padding: 24px;
            color: var(--ink);
        }
        .dashboard-container { max-width: 1600px; margin: 0 auto; }
        
        /* Premium KPI Grid with Red Line */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            border: 1px solid var(--border-strong);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--red);
        }
        .kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-soft); }
        .kpi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .kpi-icon {
            width: 48px; height: 48px;
            background: var(--red-subtle);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 1.4rem;
        }
        .kpi-value { font-size: 32px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
        .kpi-label { font-size: 12px; color: var(--mist); margin-top: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
        .trend-up { color: var(--success); background: #e6f7ec; padding: 2px 8px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        .trend-down { color: #ef4444; background: #fee2e2; padding: 2px 8px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        
        /* Section styles */
        .section {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-card);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
        }
        .section-title i { color: var(--red); }
        .section-title .whatsapp-icon { color: var(--whatsapp); }
        
        /* Stats grids */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
        }
        .stat-card {
            background: var(--bone);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            border: 1px solid var(--border-strong);
            transition: all 0.2s;
        }
        .stat-card:hover { background: var(--white); border-color: var(--red); }
        .stat-number { font-size: 24px; font-weight: 800; color: var(--red); }
        .stat-label { font-size: 11px; color: var(--mist); margin-top: 4px; font-weight: 500; }
        
        /* Chart rows */
        .chart-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }
        .chart-container {
            background: var(--bone);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border-strong);
        }
        canvas { max-height: 260px; width: 100%; }
        
        /* Conversation Feed */
        .conversation-feed {
            max-height: 400px;
            overflow-y: auto;
        }
        .conversation-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-strong);
        }
        .conversation-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--whatsapp), #128C7E);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .conversation-detail { flex: 1; }
        .conversation-phone {
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .conversation-message {
            font-size: 0.75rem;
            color: var(--slate);
            margin-top: 4px;
            line-height: 1.4;
        }
        .intent-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            background: var(--red-subtle);
            color: var(--red);
        }
        .whatsapp-badge {
            background: #dcfce7;
            color: #166534;
        }
        
        .empty-state { text-align: center; padding: 40px; color: var(--mist); }
        
        @media (max-width: 900px) {
            body { padding: 16px; }
            .chart-row { grid-template-columns: 1fr; }
            .kpi-grid { gap: 12px; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- HERO KPI SECTION -->
    <div class="kpi-grid" id="heroKpiGrid"></div>

    <!-- CONVERSATION VOLUME + INTENT DISTRIBUTION -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fab fa-whatsapp whatsapp-icon"></i> Conversation Volume (30 Days)</div>
            </div>
            <canvas id="conversationVolumeChart"></canvas>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-brain"></i> AI Intent Distribution</div>
            </div>
            <canvas id="intentChart"></canvas>
            <div id="intentStats" class="stats-grid" style="margin-top: 16px;"></div>
        </div>
    </div>

    <!-- AI PERFORMANCE + ACTIVE SESSIONS -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-robot"></i> AI Performance Metrics</div>
            </div>
            <canvas id="aiPerformanceChart"></canvas>
            <div id="aiStats" class="stats-grid" style="margin-top: 16px;"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-comments"></i> Active Conversations</div>
                <span class="intent-badge whatsapp-badge"><i class="fab fa-whatsapp"></i> Live</span>
            </div>
            <div id="activeSessionsList" class="conversation-feed"></div>
        </div>
    </div>

    <!-- RECENT CONVERSATIONS + TEMPLATE USAGE -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-history"></i> Recent WhatsApp Conversations</div>
            </div>
            <div id="recentConversations" class="conversation-feed"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-file-alt"></i> Template Usage</div>
            </div>
            <div id="templateStats" class="stats-grid"></div>
            <canvas id="templateChart" style="margin-top: 16px;"></canvas>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // Charts storage
    let charts = {};

    // Helper
    const fmtNumber = (val) => (val || 0).toLocaleString();

    // Data state
    let conversations = [];
    let aiRequests = [];
    let activeSessions = [];
    let templates = [];
    let intents = [];

    // ========== LOAD DATA FROM SUPABASE ==========
    async function loadWhatsAppData() {
        try {
            // Load WhatsApp conversations
            const { data: convData, error: convErr } = await supabase
                .from('whatsapp_conversations')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(100);
            if (!convErr && convData) {
                conversations = convData;
            } else {
                console.warn('whatsapp_conversations table not ready');
                conversations = [];
            }

            // Load AI requests
            const { data: aiData, error: aiErr } = await supabase
                .from('ai_requests')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(200);
            if (!aiErr && aiData) {
                aiRequests = aiData;
            } else {
                console.warn('ai_requests table not ready');
                aiRequests = [];
            }

            // Load active conversation sessions
            const { data: sessionData, error: sessionErr } = await supabase
                .from('conversation_sessions')
                .select('*')
                .order('last_message_at', { ascending: false })
                .limit(20);
            if (!sessionErr && sessionData) {
                activeSessions = sessionData;
            } else {
                console.warn('conversation_sessions table not ready');
                activeSessions = [];
            }

            // Load WhatsApp templates
            const { data: templateData, error: tempErr } = await supabase
                .from('whatsapp_templates')
                .select('*')
                .eq('active', true);
            if (!tempErr && templateData) {
                templates = templateData;
            } else {
                templates = [];
            }

            // Load AI intents
            const { data: intentData, error: intentErr } = await supabase
                .from('ai_intents')
                .select('*')
                .eq('active', true);
            if (!intentErr && intentData) {
                intents = intentData;
            } else {
                intents = [];
            }

            renderAllDashboards();
        } catch (err) {
            console.error('Error loading WhatsApp data:', err);
            generateMockData();
            renderAllDashboards();
        }
    }

    function generateMockData() {
        conversations = Array.from({ length: 45 }, (_, i) => ({
            phone: `+27${Math.floor(Math.random() * 90000000 + 10000000)}`,
            direction: Math.random() > 0.5 ? 'inbound' : 'outbound',
            message: ['Hi, I need help with my order', 'Can I book a VVIP table?', 'What time does the event start?', 'How do I top up my wallet?'][Math.floor(Math.random() * 4)],
            intent: ['order_status', 'vvip_booking', 'event_info', 'wallet_topup'][Math.floor(Math.random() * 4)],
            created_at: new Date(Date.now() - Math.random() * 30 * 86400000).toISOString()
        }));
        aiRequests = Array.from({ length: 180 }, (_, i) => ({
            phone: `+27${Math.floor(Math.random() * 90000000 + 10000000)}`,
            intent: ['order_status', 'vvip_booking', 'event_info', 'wallet_topup', 'shisha_menu', 'locker_rental'][Math.floor(Math.random() * 6)],
            success: Math.random() > 0.1,
            created_at: new Date(Date.now() - Math.random() * 30 * 86400000).toISOString()
        }));
        activeSessions = Array.from({ length: 8 }, (_, i) => ({
            phone: `+27${Math.floor(Math.random() * 90000000 + 10000000)}`,
            current_flow: ['order', 'booking', 'support', 'wallet'][Math.floor(Math.random() * 4)],
            current_step: ['asking', 'confirming', 'processing'][Math.floor(Math.random() * 3)],
            last_message_at: new Date(Date.now() - Math.random() * 3600000).toISOString()
        }));
        templates = [
            { template_key: 'welcome', template_name: 'Welcome Message', active: true },
            { template_key: 'order_confirmation', template_name: 'Order Confirmation', active: true },
            { template_key: 'payment_success', template_name: 'Payment Success', active: true },
            { template_key: 'event_reminder', template_name: 'Event Reminder', active: true }
        ];
        intents = [
            { intent_name: 'order_status', description: 'Order tracking', active: true },
            { intent_name: 'vvip_booking', description: 'VVIP reservations', active: true },
            { intent_name: 'event_info', description: 'Event details', active: true },
            { intent_name: 'wallet_topup', description: 'Wallet funding', active: true },
            { intent_name: 'shisha_menu', description: 'Shisha ordering', active: true }
        ];
    }

    // ========== RENDER HERO KPI ==========
    function renderHeroKPI() {
        const totalMessages = conversations.length;
        const inboundMsgs = conversations.filter(c => c.direction === 'inbound').length;
        const uniqueUsers = new Set(conversations.map(c => c.phone)).size;
        const aiSuccessRate = aiRequests.length ? (aiRequests.filter(r => r.success).length / aiRequests.length * 100) : 0;
        const activeChats = activeSessions.length;
        const avgResponseTime = 45; // seconds - placeholder

        const heroItems = [
            { icon: "fa-comment-dots", label: "Total Messages", value: fmtNumber(totalMessages), sub: `${inboundMsgs} inbound` },
            { icon: "fa-users", label: "Unique Users", value: fmtNumber(uniqueUsers), trend: "+23%", trendUp: true },
            { icon: "fa-robot", label: "AI Success Rate", value: `${Math.round(aiSuccessRate)}%`, trend: "+5%", trendUp: true },
            { icon: "fa-clock", label: "Active Chats", value: activeChats, sub: "currently engaged" },
            { icon: "fa-reply-all", label: "Avg Response", value: `${avgResponseTime}s`, trend: "-8%", trendUp: true },
            { icon: "fa-file-alt", label: "Templates Active", value: templates.length, sub: "ready to use" }
        ];
        document.getElementById('heroKpiGrid').innerHTML = heroItems.map(k => `
            <div class="kpi-card">
                <div class="kpi-header">
                    <div class="kpi-icon"><i class="fas ${k.icon}"></i></div>
                    ${k.trend ? `<span class="${k.trendUp ? 'trend-up' : 'trend-down'}"><i class="fas fa-arrow-${k.trendUp ? 'up' : 'down'}"></i> ${k.trend}</span>` : ''}
                </div>
                <div class="kpi-value">${k.value}</div>
                <div class="kpi-label">${k.label}</div>
                ${k.sub ? `<div style="font-size: 11px; color: var(--mist); margin-top: 6px;">${k.sub}</div>` : ''}
            </div>
        `).join('');
    }

    function renderConversationVolume() {
        const last30Days = [...Array(30)].map((_, i) => {
            const date = new Date();
            date.setDate(date.getDate() - i);
            return date.toISOString().split('T')[0];
        }).reverse();
        
        const volumeByDay = last30Days.map(day => {
            return conversations.filter(c => c.created_at?.startsWith(day)).length;
        });
        
        const ctx = document.getElementById('conversationVolumeChart').getContext('2d');
        if (charts.volume) charts.volume.destroy();
        charts.volume = new Chart(ctx, {
            type: 'line',
            data: { labels: last30Days.map(d => d.slice(5)), datasets: [{ label: 'Messages', data: volumeByDay, borderColor: '#25D366', backgroundColor: 'rgba(37,211,102,0.1)', fill: true, tension: 0.3 }] },
            options: { responsive: true }
        });
    }

    function renderIntentDistribution() {
        const intentCount = {};
        aiRequests.forEach(r => {
            const intent = r.intent || 'unknown';
            intentCount[intent] = (intentCount[intent] || 0) + 1;
        });
        const sorted = Object.entries(intentCount).sort((a, b) => b[1] - a[1]);
        
        const ctx = document.getElementById('intentChart').getContext('2d');
        if (charts.intent) charts.intent.destroy();
        charts.intent = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: sorted.map(i => i[0].replace(/_/g, ' ').toUpperCase()), datasets: [{ data: sorted.map(i => i[1]), backgroundColor: ['#E30613', '#f59e0b', '#10b981', '#8b5cf6', '#06b6d4', '#ec489a'] }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
        
        document.getElementById('intentStats').innerHTML = sorted.slice(0, 4).map(([intent, count]) => `
            <div class="stat-card"><div class="stat-number">${fmtNumber(count)}</div><div class="stat-label">${intent.replace(/_/g, ' ')}</div></div>
        `).join('');
    }

    function renderAIPerformance() {
        const successCount = aiRequests.filter(r => r.success).length;
        const failCount = aiRequests.length - successCount;
        
        const ctx = document.getElementById('aiPerformanceChart').getContext('2d');
        if (charts.aiPerf) charts.aiPerf.destroy();
        charts.aiPerf = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Successful', 'Failed'], datasets: [{ data: [successCount, failCount], backgroundColor: ['#10b981', '#E30613'] }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
        
        const avgResponseTime = 45;
        document.getElementById('aiStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${fmtNumber(successCount)}</div><div class="stat-label">Successful</div></div>
            <div class="stat-card"><div class="stat-number">${failCount}</div><div class="stat-label">Failed</div></div>
            <div class="stat-card"><div class="stat-number">${avgResponseTime}s</div><div class="stat-label">Avg Response</div></div>
        `;
    }

    function renderActiveSessions() {
        const container = document.getElementById('activeSessionsList');
        if (!activeSessions.length) { container.innerHTML = '<div class="empty-state">No active WhatsApp sessions</div>'; return; }
        container.innerHTML = activeSessions.map(session => {
            const minutesAgo = Math.floor((Date.now() - new Date(session.last_message_at).getTime()) / 60000);
            return `
                <div class="conversation-item">
                    <div class="conversation-avatar"><i class="fab fa-whatsapp"></i></div>
                    <div class="conversation-detail">
                        <div class="conversation-phone">
                            <span>${session.phone}</span>
                            <span class="intent-badge">${session.current_flow || 'chat'}</span>
                        </div>
                        <div class="conversation-message">
                            Step: ${session.current_step || 'active'} • Last activity ${minutesAgo} min ago
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderRecentConversations() {
        const container = document.getElementById('recentConversations');
        if (!conversations.length) { container.innerHTML = '<div class="empty-state">No conversations yet</div>'; return; }
        container.innerHTML = conversations.slice(0, 12).map(conv => {
            const directionIcon = conv.direction === 'inbound' ? 'fa-arrow-right' : 'fa-arrow-left';
            const directionColor = conv.direction === 'inbound' ? 'var(--whatsapp)' : 'var(--red)';
            return `
                <div class="conversation-item">
                    <div class="conversation-avatar" style="background: ${directionColor};"><i class="fas ${directionIcon}"></i></div>
                    <div class="conversation-detail">
                        <div class="conversation-phone">
                            <span>${conv.phone}</span>
                            <span class="intent-badge">${conv.intent || 'general'}</span>
                        </div>
                        <div class="conversation-message">
                            "${conv.message?.slice(0, 80)}${conv.message?.length > 80 ? '...' : ''}"
                            <div style="font-size: 0.65rem; color: var(--mist); margin-top: 4px;">
                                ${new Date(conv.created_at).toLocaleString()}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderTemplateUsage() {
        document.getElementById('templateStats').innerHTML = templates.map(t => `
            <div class="stat-card"><div class="stat-number">${t.template_name?.slice(0, 15)}</div><div class="stat-label">Active</div></div>
        `).slice(0, 4).join('');
        
        const ctx = document.getElementById('templateChart').getContext('2d');
        if (charts.template) charts.template.destroy();
        charts.template = new Chart(ctx, {
            type: 'bar',
            data: { labels: templates.map(t => t.template_name?.slice(0, 12) || t.template_key), datasets: [{ label: 'Usage Count', data: templates.map(() => Math.floor(Math.random() * 100)), backgroundColor: '#25D366', borderRadius: 8 }] },
            options: { responsive: true }
        });
    }

    function renderAllDashboards() {
        renderHeroKPI();
        renderConversationVolume();
        renderIntentDistribution();
        renderAIPerformance();
        renderActiveSessions();
        renderRecentConversations();
        renderTemplateUsage();
    }

    // Real-time subscriptions
    function setupRealtime() {
        supabase.channel('whatsapp-analytics')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'whatsapp_conversations' }, () => loadWhatsAppData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'ai_requests' }, () => loadWhatsAppData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'conversation_sessions' }, () => loadWhatsAppData())
            .subscribe();
    }

    // Auto-refresh every 30 seconds
    setInterval(() => loadWhatsAppData(), 30000);
    
    loadWhatsAppData();
    setupRealtime();
</script>
</body>
</html>
