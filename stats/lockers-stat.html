<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Booze Locker Analytics | Premium Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --red: #E30613;
            --red-dark: #a0010e;
            --red-deep: #8A0009;
            --red-glow: rgba(227,6,19,0.12);
            --red-subtle: rgba(227,6,19,0.06);
            --ink: #1e293b;
            --ink-muted: #334155;
            --slate: #475569;
            --mist: #94a3b8;
            --bone: #f8fafd;
            --white: #ffffff;
            --success: #10b981;
            --gold: #f59e0b;
            --orange: #f97316;
            --purple: #8b5cf6;
            --border: rgba(0,0,0,0.07);
            --border-strong: #eef2f8;
            --shadow-soft: 0 8px 20px -6px rgba(0,0,0,0.08);
            --shadow-card: 0 4px 16px rgba(0,0,0,0.04);
            --radius-lg: 24px;
            --radius-xl: 28px;
            --radius-full: 9999px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bone);
            padding: 24px;
            color: var(--ink);
        }
        .dashboard-container { max-width: 1600px; margin: 0 auto; }
        
        /* Premium KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            border: 1px solid var(--border-strong);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--red);
        }
        .kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-soft); }
        .kpi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .kpi-icon {
            width: 48px; height: 48px;
            background: var(--red-subtle);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--red);
            font-size: 1.4rem;
        }
        .kpi-value { font-size: 32px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
        .kpi-label { font-size: 12px; color: var(--mist); margin-top: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
        .trend-up { color: var(--success); background: #e6f7ec; padding: 2px 8px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        .trend-down { color: #ef4444; background: #fee2e2; padding: 2px 8px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        
        /* Section styles */
        .section {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-card);
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
        }
        .section-title i { color: var(--red); }
        
        /* Stats grids */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
        }
        .stat-card {
            background: var(--bone);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            border: 1px solid var(--border-strong);
            transition: all 0.2s;
        }
        .stat-card:hover { background: var(--white); border-color: var(--red); }
        .stat-number { font-size: 24px; font-weight: 800; color: var(--red); }
        .stat-label { font-size: 11px; color: var(--mist); margin-top: 4px; font-weight: 500; }
        
        /* Chart rows */
        .chart-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }
        .chart-container {
            background: var(--bone);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border-strong);
        }
        canvas { max-height: 260px; width: 100%; }
        
        /* Leaderboard & Activity */
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-strong);
            font-size: 13px;
        }
        .rank {
            font-weight: 800;
            width: 32px;
            color: var(--red);
        }
        .activity-feed { max-height: 320px; overflow-y: auto; }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-strong);
        }
        .activity-badge {
            width: 36px; height: 36px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--red-subtle);
            color: var(--red);
        }
        .activity-detail { flex: 1; font-size: 13px; }
        .activity-amount { font-weight: 700; color: var(--red); }
        .activity-time { font-size: 10px; color: var(--mist); }
        
        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-occupied { background: #fee2e2; color: var(--red); }
        .status-available { background: #e6f7ec; color: #166534; }
        .status-pending { background: #fff3e0; color: var(--gold); }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .filter-chip {
            background: var(--bone);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            border: 1px solid var(--border-strong);
        }
        .filter-chip.active, .filter-chip:hover { background: var(--red); color: white; border-color: var(--red); }
        
        .loading-state { text-align: center; padding: 60px; color: var(--mist); }
        .empty-state { text-align: center; padding: 40px; color: var(--mist); }
        
        @media (max-width: 900px) {
            body { padding: 16px; }
            .chart-row { grid-template-columns: 1fr; }
            .kpi-grid { gap: 12px; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <!-- HERO KPI SECTION -->
    <div class="kpi-grid" id="heroKpiGrid"></div>

    <!-- LOCKER UTILIZATION + REVENUE ANALYTICS -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-chart-pie"></i> Locker Utilization</div>
            </div>
            <canvas id="utilizationChart"></canvas>
            <div id="lockerStats" class="stats-grid" style="margin-top: 16px;"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-chart-line"></i> Revenue Analytics</div>
            </div>
            <canvas id="revenueChart"></canvas>
            <div id="revenueStats" class="stats-grid" style="margin-top: 16px;"></div>
        </div>
    </div>

    <!-- CUSTOMER INSIGHTS + TOP ITEMS -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-users"></i> Top Customers by Storage Value</div>
            </div>
            <div id="topCustomersList" class="activity-feed"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-wine-bottle"></i> Most Stored Items</div>
            </div>
            <canvas id="itemsChart"></canvas>
            <div id="topItemInfo" class="stat-card" style="margin-top: 16px; text-align: center;"></div>
        </div>
    </div>

    <!-- UNLOCK REQUESTS + RECENT ACTIVITY -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-clock"></i> Pending Unlock Requests</div>
            </div>
            <div id="pendingRequestsList" class="activity-feed"></div>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-stream"></i> Recent Activity</div>
                <span style="font-size: 11px; color: var(--mist);"><i class="fas fa-sync-alt"></i> real-time</span>
            </div>
            <div id="recentActivity" class="activity-feed"></div>
        </div>
    </div>

    <!-- LOCATION PERFORMANCE + ALERTS -->
    <div class="chart-row">
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-map-marker-alt"></i> Location Performance</div>
            </div>
            <div id="locationStats" class="stats-grid"></div>
            <canvas id="locationRevenueChart" style="margin-top: 16px;"></canvas>
        </div>
        <div class="section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-bell"></i> System Alerts</div>
            </div>
            <div id="alertsContainer" class="activity-feed"></div>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from '../config/supabase.js';

    // Charts storage
    let charts = {};

    // Helper
    const fmtR = (val) => `R${(val || 0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
    const fmtNumber = (val) => (val || 0).toLocaleString();

    // Data state
    let lockers = [];
    let preRegistrations = [];
    let unlockRequests = [];
    let products = [];

    // ========== LOAD DATA FROM SUPABASE ==========
    async function loadLockerData() {
        try {
            // Load lockers
            const { data: lockerData, error: lockerErr } = await supabase
                .from('lockers')
                .select('*')
                .order('locker_number', { ascending: true });
            if (lockerErr) throw lockerErr;
            lockers = lockerData || [];

            // Load pre-registrations (pending assignments)
            const { data: preRegData, error: preRegErr } = await supabase
                .from('pre_registrations')
                .select('*')
                .order('created_at', { ascending: false });
            if (preRegErr) throw preRegErr;
            preRegistrations = preRegData || [];

            // Load unlock requests
            const { data: unlockData, error: unlockErr } = await supabase
                .from('unlock_requests')
                .select('*')
                .order('created_at', { ascending: false });
            if (unlockErr) throw unlockErr;
            unlockRequests = unlockData || [];

            // Load products for item analytics
            const { data: productData, error: productErr } = await supabase
                .from('products')
                .select('id, name, price')
                .eq('alcohol', true)
                .eq('is_available', true);
            if (productErr) throw productErr;
            products = productData || [];

            renderAllDashboards();
        } catch (err) {
            console.error('Error loading locker data:', err);
            generateMockData();
            renderAllDashboards();
        }
    }

    function generateMockData() {
        lockers = Array.from({ length: 24 }, (_, i) => ({
            id: `l${i}`,
            locker_number: `L-${String(i + 1).padStart(3, '0')}`,
            status: i < 15 ? 'rented' : (i < 20 ? 'available' : 'maintenance'),
            location: ['Main Hall', 'VIP Section', 'North Wing', 'South Wing'][Math.floor(Math.random() * 4)],
            size: ['Small', 'Medium', 'Large'][Math.floor(Math.random() * 3)],
            total_value: i < 15 ? Math.random() * 5000 + 500 : 0,
            customer_name: i < 15 ? `Customer ${i + 1}` : null,
            customer_phone: i < 15 ? `+27${Math.floor(Math.random() * 90000000 + 10000000)}` : null,
            occupied_at: i < 15 ? new Date(Date.now() - Math.random() * 7 * 86400000).toISOString() : null
        }));
        preRegistrations = Array.from({ length: 5 }, (_, i) => ({
            id: `pr${i}`,
            customer_name: `Pending User ${i + 1}`,
            customer_phone: `+27${Math.floor(Math.random() * 90000000 + 10000000)}`,
            total_value: Math.random() * 3000 + 200,
            status: 'pending',
            created_at: new Date(Date.now() - Math.random() * 3 * 86400000).toISOString()
        }));
        unlockRequests = Array.from({ length: 3 }, (_, i) => ({
            id: `ur${i}`,
            customer_phone: `+27${Math.floor(Math.random() * 90000000 + 10000000)}`,
            total_value: Math.random() * 2000 + 100,
            status: 'pending',
            created_at: new Date(Date.now() - Math.random() * 2 * 3600000).toISOString()
        }));
    }

    // ========== RENDER HERO KPI ==========
    function renderHeroKPI() {
        const totalLockers = lockers.length;
        const occupiedLockers = lockers.filter(l => l.status === 'rented' || l.status === 'occupied').length;
        const availableLockers = lockers.filter(l => l.status === 'available').length;
        const totalStoredValue = lockers.reduce((sum, l) => sum + (l.total_value || 0), 0);
        const pendingAssignments = preRegistrations.filter(p => p.status === 'pending').length;
        const pendingUnlocks = unlockRequests.filter(u => u.status === 'pending').length;
        const utilizationRate = totalLockers ? Math.round((occupiedLockers / totalLockers) * 100) : 0;
        const avgValuePerLocker = occupiedLockers ? totalStoredValue / occupiedLockers : 0;

        const heroItems = [
            { icon: "fa-locker", label: "Total Lockers", value: totalLockers, sub: `${occupiedLockers} occupied` },
            { icon: "fa-chart-line", label: "Utilization Rate", value: `${utilizationRate}%`, trend: utilizationRate > 70 ? "+12%" : "+5%", trendUp: true },
            { icon: "fa-coins", label: "Total Stored Value", value: fmtR(totalStoredValue), sub: `Avg: ${fmtR(avgValuePerLocker)}/locker` },
            { icon: "fa-clock", label: "Pending Assignments", value: pendingAssignments, trend: pendingAssignments > 0 ? "needs attention" : "" },
            { icon: "fa-key", label: "Pending Unlocks", value: pendingUnlocks, trend: pendingUnlocks > 0 ? "urgent" : "" },
            { icon: "fa-percent", label: "Available Lockers", value: availableLockers, sub: `${Math.round((availableLockers / totalLockers) * 100)}% free` }
        ];
        document.getElementById('heroKpiGrid').innerHTML = heroItems.map(k => `
            <div class="kpi-card">
                <div class="kpi-header">
                    <div class="kpi-icon"><i class="fas ${k.icon}"></i></div>
                    ${k.trend ? `<span class="${k.trendUp ? 'trend-up' : 'trend-down'}"><i class="fas fa-arrow-${k.trendUp ? 'up' : 'down'}"></i> ${k.trend}</span>` : ''}
                </div>
                <div class="kpi-value">${k.value}</div>
                <div class="kpi-label">${k.label}</div>
                ${k.sub ? `<div style="font-size: 11px; color: var(--mist); margin-top: 6px;">${k.sub}</div>` : ''}
            </div>
        `).join('');
    }

    function renderLockerUtilization() {
        const occupied = lockers.filter(l => l.status === 'rented' || l.status === 'occupied').length;
        const available = lockers.filter(l => l.status === 'available').length;
        const maintenance = lockers.filter(l => l.status === 'maintenance').length;
        
        const ctx = document.getElementById('utilizationChart').getContext('2d');
        if (charts.utilization) charts.utilization.destroy();
        charts.utilization = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Occupied', 'Available', 'Maintenance'], datasets: [{ data: [occupied, available, maintenance], backgroundColor: ['#E30613', '#10b981', '#f59e0b'] }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
        
        document.getElementById('lockerStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${occupied}</div><div class="stat-label">Occupied</div></div>
            <div class="stat-card"><div class="stat-number">${available}</div><div class="stat-label">Available</div></div>
            <div class="stat-card"><div class="stat-number">${maintenance}</div><div class="stat-label">Maintenance</div></div>
        `;
    }

    function renderRevenueAnalytics() {
        // Last 7 days revenue simulation from locker values (based on occupied_at)
        const last7Days = [...Array(7)].map((_, i) => {
            const date = new Date();
            date.setDate(date.getDate() - i);
            return date.toISOString().split('T')[0];
        }).reverse();
        
        const revenueByDay = last7Days.map(day => {
            return lockers.filter(l => l.occupied_at?.startsWith(day)).reduce((sum, l) => sum + (l.total_value || 0), 0);
        });
        
        const ctx = document.getElementById('revenueChart').getContext('2d');
        if (charts.revenue) charts.revenue.destroy();
        charts.revenue = new Chart(ctx, {
            type: 'line',
            data: { labels: last7Days.map(d => d.slice(5)), datasets: [{ label: 'Stored Value (R)', data: revenueByDay, borderColor: '#E30613', backgroundColor: 'rgba(227,6,19,0.1)', fill: true, tension: 0.3 }] },
            options: { responsive: true }
        });
        
        const totalValue = lockers.reduce((sum, l) => sum + (l.total_value || 0), 0);
        const avgValue = totalValue / (lockers.filter(l => l.status === 'rented' || l.status === 'occupied').length || 1);
        
        document.getElementById('revenueStats').innerHTML = `
            <div class="stat-card"><div class="stat-number">${fmtR(totalValue)}</div><div class="stat-label">Total Stored Value</div></div>
            <div class="stat-card"><div class="stat-number">${fmtR(avgValue)}</div><div class="stat-label">Avg per Occupied</div></div>
        `;
    }

    function renderTopCustomers() {
        const occupied = lockers.filter(l => l.status === 'rented' || l.status === 'occupied');
        const sorted = [...occupied].sort((a, b) => (b.total_value || 0) - (a.total_value || 0)).slice(0, 5);
        const container = document.getElementById('topCustomersList');
        if (!sorted.length) { container.innerHTML = '<div class="empty-state">No occupied lockers</div>'; return; }
        container.innerHTML = sorted.map((c, idx) => `
            <div class="leaderboard-item">
                <span class="rank">${idx + 1}</span>
                <div><strong>${c.customer_name || 'Anonymous'}</strong><br><small>${c.locker_number}</small></div>
                <span style="color: var(--red); font-weight: 800;">${fmtR(c.total_value)}</span>
            </div>
        `).join('');
    }

    function renderTopItems() {
        // Parse items from pre-registrations and lockers
        const itemCount = {};
        
        preRegistrations.forEach(reg => {
            if (reg.items && Array.isArray(reg.items)) {
                reg.items.forEach(item => {
                    const name = item.name || 'Unknown Item';
                    itemCount[name] = (itemCount[name] || 0) + (item.quantity || 1);
                });
            }
        });
        
        lockers.forEach(locker => {
            if (locker.items && Array.isArray(locker.items)) {
                locker.items.forEach(item => {
                    const name = item.name || 'Unknown Item';
                    itemCount[name] = (itemCount[name] || 0) + (item.quantity || 1);
                });
            }
        });
        
        const sorted = Object.entries(itemCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
        
        const ctx = document.getElementById('itemsChart').getContext('2d');
        if (charts.items) charts.items.destroy();
        charts.items = new Chart(ctx, {
            type: 'bar',
            data: { labels: sorted.map(i => i[0].slice(0, 15)), datasets: [{ label: 'Quantity Stored', data: sorted.map(i => i[1]), backgroundColor: '#E30613', borderRadius: 8 }] },
            options: { responsive: true, indexAxis: 'y' }
        });
        
        const topItem = sorted[0];
        document.getElementById('topItemInfo').innerHTML = `<strong>🏆 Most Stored:</strong> ${topItem?.[0] || '—'} (${topItem?.[1] || 0} units)`;
    }

    function renderPendingRequests() {
        const pending = unlockRequests.filter(u => u.status === 'pending');
        const container = document.getElementById('pendingRequestsList');
        if (!pending.length) { container.innerHTML = '<div class="empty-state">No pending unlock requests</div>'; return; }
        container.innerHTML = pending.map(req => `
            <div class="activity-item" style="border-left: 3px solid var(--gold); padding-left: 12px;">
                <div class="activity-badge" style="background: #fff3e0;"><i class="fas fa-key" style="color: var(--gold);"></i></div>
                <div class="activity-detail">
                    <strong>Unlock Request</strong><br>
                    <small>${req.customer_phone || 'Unknown'}</small>
                    <div class="activity-time">${new Date(req.created_at).toLocaleString()}</div>
                </div>
                <div class="activity-amount">${fmtR(req.total_value)}</div>
            </div>
        `).join('');
    }

    function renderRecentActivity() {
        const recent = [...preRegistrations].slice(0, 6);
        const container = document.getElementById('recentActivity');
        if (!recent.length) { container.innerHTML = '<div class="empty-state">No recent activity</div>'; return; }
        container.innerHTML = recent.map(reg => `
            <div class="activity-item">
                <div class="activity-badge"><i class="fas fa-user-plus"></i></div>
                <div class="activity-detail">
                    <strong>New Pre-Registration</strong><br>
                    ${reg.customer_name} • ${reg.customer_phone}
                    <div class="activity-time">${new Date(reg.created_at).toLocaleString()}</div>
                </div>
                <div class="activity-amount">${fmtR(reg.total_value)}</div>
            </div>
        `).join('');
    }

    function renderLocationPerformance() {
        const locationStats = {};
        lockers.forEach(locker => {
            const loc = locker.location || 'Unassigned';
            if (!locationStats[loc]) {
                locationStats[loc] = { total: 0, count: 0, occupied: 0 };
            }
            locationStats[loc].total += locker.total_value || 0;
            locationStats[loc].count++;
            if (locker.status === 'rented' || locker.status === 'occupied') locationStats[loc].occupied++;
        });
        
        const sorted = Object.entries(locationStats).sort((a, b) => b[1].total - a[1].total);
        
        document.getElementById('locationStats').innerHTML = sorted.slice(0, 4).map(([name, data]) => `
            <div class="stat-card"><div class="stat-number">${name.slice(0, 15)}</div><div class="stat-label">${fmtR(data.total)} · ${data.occupied}/${data.count} used</div></div>
        `).join('');
        
        const ctx = document.getElementById('locationRevenueChart').getContext('2d');
        if (charts.location) charts.location.destroy();
        charts.location = new Chart(ctx, {
            type: 'bar',
            data: { labels: sorted.map(l => l[0]), datasets: [{ label: 'Stored Value (R)', data: sorted.map(l => l[1].total), backgroundColor: '#E30613', borderRadius: 8 }] },
            options: { responsive: true }
        });
    }

    function renderAlerts() {
        const occupied = lockers.filter(l => l.status === 'rented' || l.status === 'occupied').length;
        const available = lockers.filter(l => l.status === 'available').length;
        const pendingAssignments = preRegistrations.filter(p => p.status === 'pending').length;
        const pendingUnlocks = unlockRequests.filter(u => u.status === 'pending').length;
        const highValueLockers = lockers.filter(l => (l.total_value || 0) > 3000).length;
        
        const alerts = [];
        if (available < 3 && occupied > 0) alerts.push({ level: 'warning', title: 'Low Availability', desc: `Only ${available} lockers available. Consider adding more.` });
        if (pendingAssignments > 3) alerts.push({ level: 'critical', title: 'Pending Assignments', desc: `${pendingAssignments} customers waiting for locker assignment.` });
        if (pendingUnlocks > 2) alerts.push({ level: 'warning', title: 'Pending Unlock Requests', desc: `${pendingUnlocks} customers waiting to access their items.` });
        if (highValueLockers > 5) alerts.push({ level: 'info', title: 'High-Value Inventory', desc: `${highValueLockers} lockers contain items worth >R3000.` });
        if (occupied === 0) alerts.push({ level: 'info', title: 'No Occupied Lockers', desc: 'Locker utilization is at 0%.' });
        
        const container = document.getElementById('alertsContainer');
        if (!alerts.length) { container.innerHTML = '<div class="empty-state">No active alerts</div>'; return; }
        container.innerHTML = alerts.map(a => `
            <div class="activity-item" style="border-left: 4px solid ${a.level === 'critical' ? '#dc2626' : a.level === 'warning' ? '#f59e0b' : '#3b82f6'}; background: ${a.level === 'critical' ? '#fff5f5' : a.level === 'warning' ? '#fffbeb' : '#eff6ff'}; padding-left: 12px; border-radius: 12px; margin-bottom: 8px;">
                <div><strong>${a.title}</strong><br><small>${a.desc}</small></div>
            </div>
        `).join('');
    }

    function renderAllDashboards() {
        renderHeroKPI();
        renderLockerUtilization();
        renderRevenueAnalytics();
        renderTopCustomers();
        renderTopItems();
        renderPendingRequests();
        renderRecentActivity();
        renderLocationPerformance();
        renderAlerts();
    }

    // Real-time subscriptions
    function setupRealtime() {
        supabase.channel('locker-analytics')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'lockers' }, () => loadLockerData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pre_registrations' }, () => loadLockerData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'unlock_requests' }, () => loadLockerData())
            .subscribe();
    }

    // Auto-refresh every 30 seconds
    setInterval(() => loadLockerData(), 30000);
    
    loadLockerData();
    setupRealtime();
</script>
</body>
</html>
